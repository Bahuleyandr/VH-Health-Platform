name: Release Container Images

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing mirrored release tag, for example backend-v1.2.3'
        required: true
      build_backend:
        description: 'Build backend image'
        required: false
        default: 'true'
        type: boolean
      build_admin:
        description: 'Build admin image'
        required: false
        default: 'true'
        type: boolean
      build_staff_web:
        description: 'Build staff Flutter web image'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-images
  cancel-in-progress: false

jobs:
  release-authority:
    name: Verify release authority
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      authorized: ${{ steps.authority.outputs.authorized }}
      state: ${{ steps.authority.outputs.state }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check provider, mirror, signer, tag, and Argo parity
        id: authority
        env:
          RELEASE_AUTHORITY_GITHUB_TOKEN: ${{ secrets.RELEASE_AUTHORITY_GITHUB_TOKEN }}
          RELEASE_AUTHORITY_FORGEJO_TOKEN: ${{ github.token }}
          RELEASE_AUTHORITY_ARGO_API_URL: ${{ vars.RELEASE_AUTHORITY_ARGO_API_URL }}
          RELEASE_AUTHORITY_ARGO_TOKEN: ${{ secrets.RELEASE_AUTHORITY_ARGO_TOKEN }}
          RELEASE_AUTHORITY_TAG: ${{ inputs.release_tag }}
        run: |
          args=(
            --provider forgejo
            --intent image-release
            --commit "$GITHUB_SHA"
            --event "$GITHUB_EVENT_NAME"
            --ref "$GITHUB_REF"
            --evidence-file output/release-authority/forgejo-release-images.json
          )
          args+=(--tag "$RELEASE_AUTHORITY_TAG")
          node scripts/check-release-authority.mjs "${args[@]}"

      - name: Upload release-authority evidence
        if: always()
        uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: release-authority-forgejo-images-${{ github.run_id }}
          path: output/release-authority
          if-no-files-found: error

  image:
    name: Release ${{ matrix.app }} image
    runs-on: docker-builder
    timeout-minutes: 90
    needs: release-authority
    if: needs.release-authority.outputs.authorized == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            tag_prefix: backend-v
            latest_tag: latest-backend
            image_name: vh-health-platform-backend
          - app: admin
            tag_prefix: admin-v
            latest_tag: latest-admin
            image_name: vh-health-platform-adminportal
          - app: staff-web
            tag_prefix: staff-web-v
            latest_tag: latest-staff-web
            image_name: vhhealth-staff-web
    env:
      VH_BUILDKIT_JOB_KEY: ${{ matrix.app }}
      BUILD_BACKEND_INPUT: ${{ inputs.build_backend }}
      BUILD_ADMIN_INPUT: ${{ inputs.build_admin }}
      BUILD_STAFF_WEB_INPUT: ${{ inputs.build_staff_web }}
      RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
      CONTAINER_REGISTRY_USERNAME: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
      CONTAINER_REGISTRY_PASSWORD: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      GHCR_IMAGE_OWNER: ${{ vars.GHCR_IMAGE_OWNER }}
      RELEASE_PLATFORMS: ${{ vars.RELEASE_PLATFORMS }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME }}
      NEXT_PUBLIC_ALLOWED_ORIGIN: ${{ vars.NEXT_PUBLIC_ALLOWED_ORIGIN }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN_ADMIN }}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT }}
      NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.SENTRY_TRACES_SAMPLE_RATE }}
      NEXT_PUBLIC_SENTRY_REPLAY_SESSION_SAMPLE_RATE: ${{ vars.NEXT_PUBLIC_SENTRY_REPLAY_SESSION_SAMPLE_RATE }}
      NEXT_PUBLIC_SENTRY_REPLAY_ERROR_SAMPLE_RATE: ${{ vars.NEXT_PUBLIC_SENTRY_REPLAY_ERROR_SAMPLE_RATE }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      STAFF_WEB_API_URL: ${{ vars.STAFF_WEB_API_URL }}
      STAFF_WEB_API_KEY: ${{ vars.STAFF_WEB_API_KEY }}
      STAFF_WEB_APP_NAME: ${{ vars.STAFF_WEB_APP_NAME }}
      SENTRY_DSN_STAFF: ${{ secrets.SENTRY_DSN_STAFF }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Sol Ultra #7: a release tag (or a dispatch) on ANY commit could build,
      # sign, and production-pin a commit that never passed protected-main review.
      # Gate every release on main-containment BEFORE any registry/signing secret
      # is used: the exact source commit must be an ancestor of origin/main.
      # (Complements — does not replace — server-side tag-prefix protection and a
      # required-reviewer environment on the sign/pin steps.)
      - name: Verify source commit is contained in main (Sol Ultra #7)
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "::error::Release commit ${GITHUB_SHA} is not contained in origin/main — refusing to build/sign/pin an unreviewed commit."
            exit 1
          fi
          echo "Verified ${GITHUB_SHA} is contained in origin/main."

      - name: Select image for this trigger
        id: selection
        run: |
          set -euo pipefail
          selected=false
          primary_tag=""
          latest_tag=""
          case "${{ matrix.app }}" in
            backend) want="${BUILD_BACKEND_INPUT:-true}" ;;
            admin) want="${BUILD_ADMIN_INPUT:-true}" ;;
            staff-web) want="${BUILD_STAFF_WEB_INPUT:-true}" ;;
          esac
          case "$RELEASE_TAG_INPUT" in
              ${{ matrix.tag_prefix }}*)
                if [ "$want" = "true" ]; then
                  selected=true
                  primary_tag="$RELEASE_TAG_INPUT"
                  latest_tag="${{ matrix.latest_tag }}"
                fi
                ;;
              *) ;;
          esac

          if [ "$selected" != "true" ]; then
            echo "selected=false" >> "$GITHUB_OUTPUT"
            echo "No release requested for ${{ matrix.app }} with tag ${RELEASE_TAG_INPUT}."
            exit 0
          fi

          # Forgejo mirrors this repo under a different user, but production
          # manifests, image policy, and Dalekdefender consume Bahuleyandr GHCR.
          owner_lc="$(printf '%s' "${GHCR_IMAGE_OWNER:-bahuleyandr}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner_lc}/${{ matrix.image_name }}"
          echo "selected=true" >> "$GITHUB_OUTPUT"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "PRIMARY_TAG=$primary_tag" >> "$GITHUB_ENV"
          echo "LATEST_TAG=$latest_tag" >> "$GITHUB_ENV"
          echo "RELEASE_PLATFORMS=${RELEASE_PLATFORMS:-linux/amd64}" >> "$GITHUB_ENV"

      - name: Validate release credentials
        if: steps.selection.outputs.selected == 'true'
        run: >
          node scripts/ci/forgejo-deploy-preflight.mjs
          --mode release-images
          --summary-file output/release-images/${{ matrix.app }}/MISSING_SECRETS.md

      - name: Login to GHCR
        if: steps.selection.outputs.selected == 'true'
        run: |
          set -euo pipefail
          registry_user="${CONTAINER_REGISTRY_USERNAME:-${GHCR_USERNAME:-}}"
          registry_password="${CONTAINER_REGISTRY_PASSWORD:-${GHCR_TOKEN:-}}"
          printf '%s' "$registry_password" | docker login ghcr.io -u "$registry_user" --password-stdin

      - name: Install image tools
        if: steps.selection.outputs.selected == 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/vh-release-tools output/release-images/${{ matrix.app }}

          syft_version="1.18.1"
          syft_archive="syft_${syft_version}_linux_amd64.tar.gz"
          curl -sSfL "https://github.com/anchore/syft/releases/download/v${syft_version}/${syft_archive}" \
            -o "/tmp/vh-release-tools/${syft_archive}"
          curl -sSfL "https://github.com/anchore/syft/releases/download/v${syft_version}/syft_${syft_version}_checksums.txt" \
            -o /tmp/vh-release-tools/syft_checksums.txt
          (cd /tmp/vh-release-tools && grep -E "(^|[[:space:]])${syft_archive}$" syft_checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/vh-release-tools/${syft_archive}" -C /tmp/vh-release-tools syft

          trivy_version="0.70.0"
          trivy_archive="trivy_${trivy_version}_Linux-64bit.tar.gz"
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${trivy_version}/${trivy_archive}" \
            -o "/tmp/vh-release-tools/${trivy_archive}"
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${trivy_version}/trivy_${trivy_version}_checksums.txt" \
            -o /tmp/vh-release-tools/trivy_checksums.txt
          (cd /tmp/vh-release-tools && grep -E "(^|[[:space:]])${trivy_archive}$" trivy_checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/vh-release-tools/${trivy_archive}" -C /tmp/vh-release-tools trivy

          cosign_version="2.5.3"
          curl -sSfL "https://github.com/sigstore/cosign/releases/download/v${cosign_version}/cosign-linux-amd64" \
            -o /tmp/vh-release-tools/cosign-linux-amd64
          curl -sSfL "https://github.com/sigstore/cosign/releases/download/v${cosign_version}/cosign_checksums.txt" \
            -o /tmp/vh-release-tools/cosign_checksums.txt
          (cd /tmp/vh-release-tools && grep -E '(^|[[:space:]])cosign-linux-amd64$' cosign_checksums.txt | sha256sum -c -)
          mv /tmp/vh-release-tools/cosign-linux-amd64 /tmp/vh-release-tools/cosign
          chmod 0755 /tmp/vh-release-tools/syft /tmp/vh-release-tools/trivy /tmp/vh-release-tools/cosign

      - name: Prove signing key matches tracked release authority
        if: steps.selection.outputs.selected == 'true'
        run: |
          set -euo pipefail
          /tmp/vh-release-tools/cosign public-key --key env://COSIGN_PRIVATE_KEY \
            > /tmp/vh-release-tools/release-authority.pub
          if ! cmp -s /tmp/vh-release-tools/release-authority.pub infra/forgejo/signing/cosign.pub; then
            echo "::error::COSIGN_PRIVATE_KEY does not match infra/forgejo/signing/cosign.pub"
            exit 1
          fi

      - name: Build and push image
        if: steps.selection.outputs.selected == 'true'
        run: |
          set -euo pipefail
          # The helper owns one exact builder for this matrix entry and removes
          # it on every exit. A later run retires exact stale names before create.
          trap 'node scripts/ci/forgejo-buildkit-builder.mjs cleanup release || exit 1' EXIT
          node scripts/ci/forgejo-buildkit-builder.mjs prepare release

          # staff-web is amd64-only regardless of RELEASE_PLATFORMS:
          # Dockerfile.web installs the official Flutter linux tarball, which
          # is published for x64 ONLY (no linux-arm64 stable tarball exists in
          # the Flutter release manifest — checked 2026-08-16). Pinned by
          # check-infra-security-controls.mjs.
          build_platforms="$RELEASE_PLATFORMS"
          if [ "${{ matrix.app }}" = "staff-web" ]; then
            build_platforms="linux/amd64"
          fi
          echo "BUILD_PLATFORMS=$build_platforms" >> "$GITHUB_ENV"
          node scripts/ci/forgejo-buildkit-builder.mjs build release

          digest="$(node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('output/release-images/${{ matrix.app }}/build-metadata.json','utf8')); console.log(data['containerimage.digest'] || '')")"
          if [ -z "$digest" ]; then
            echo "::error::Image build did not report a pushed digest"
            exit 1
          fi
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "${IMAGE}@${digest}" > "output/release-images/${{ matrix.app }}/image-ref.txt"

      - name: Generate SBOM
        if: steps.selection.outputs.selected == 'true'
        run: |
          /tmp/vh-release-tools/syft \
            "${IMAGE}@${IMAGE_DIGEST}" \
            -o spdx-json="output/release-images/${{ matrix.app }}/sbom.spdx.json"

      - name: Scan image with Trivy
        if: steps.selection.outputs.selected == 'true'
        run: |
          /tmp/vh-release-tools/trivy image \
            --platform linux/amd64 \
            --db-repository public.ecr.aws/aquasecurity/trivy-db:2 \
            --db-repository docker.io/aquasec/trivy-db:2 \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            --vuln-type os,library \
            --format sarif \
            --output "output/release-images/${{ matrix.app }}/trivy-image.sarif" \
            "${IMAGE}@${IMAGE_DIGEST}"

      - name: Sign image digest with cosign
        if: steps.selection.outputs.selected == 'true'
        run: |
          set -euo pipefail
          /tmp/vh-release-tools/cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${IMAGE_DIGEST}"
          /tmp/vh-release-tools/cosign verify --key infra/forgejo/signing/cosign.pub "${IMAGE}@${IMAGE_DIGEST}" \
            > "output/release-images/${{ matrix.app }}/cosign-verify.json"

      - name: Write release summary
        if: steps.selection.outputs.selected == 'true'
        run: |
          {
            echo "# ${{ matrix.app }} image release"
            echo ""
            echo "Image: \`${IMAGE}\`"
            echo "Primary tag: \`${PRIMARY_TAG}\`"
            if [ -n "${LATEST_TAG:-}" ]; then echo "Latest tag: \`${LATEST_TAG}\`"; fi
            echo "Digest: \`${IMAGE_DIGEST}\`"
            echo "Platforms: \`${BUILD_PLATFORMS:-$RELEASE_PLATFORMS}\`"
            echo "Signed: cosign key from Forgejo secret \`COSIGN_PRIVATE_KEY\`"
          } > "output/release-images/${{ matrix.app }}/SUMMARY.md"

      - name: Upload image release reports
        if: always() && steps.selection.outputs.selected == 'true'
        uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: release-image-${{ matrix.app }}-${{ inputs.release_tag }}
          path: output/release-images/${{ matrix.app }}
          if-no-files-found: ignore

  pin-prod-digest:
    name: Pin released digest to GitOps tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [release-authority, image]
    if: >
      needs.release-authority.outputs.authorized == 'true' && (
      startsWith(inputs.release_tag, 'backend-v') ||
      startsWith(inputs.release_tag, 'admin-v') ||
      startsWith(inputs.release_tag, 'staff-web-v'))
    permissions:
      contents: read
    env:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      CONTAINER_REGISTRY_PASSWORD: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
      CONTAINER_REGISTRY_USERNAME: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
      GITHUB_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.5.0'

      - name: Install cosign
        run: |
          set -euo pipefail
          mkdir -p /tmp/vh-release-tools
          cosign_version="2.5.3"
          curl -sSfL "https://github.com/sigstore/cosign/releases/download/v${cosign_version}/cosign-linux-amd64" \
            -o /tmp/vh-release-tools/cosign-linux-amd64
          curl -sSfL "https://github.com/sigstore/cosign/releases/download/v${cosign_version}/cosign_checksums.txt" \
            -o /tmp/vh-release-tools/cosign_checksums.txt
          (cd /tmp/vh-release-tools && grep -E '(^|[[:space:]])cosign-linux-amd64$' cosign_checksums.txt | sha256sum -c -)
          mv /tmp/vh-release-tools/cosign-linux-amd64 /tmp/vh-release-tools/cosign
          chmod 0755 /tmp/vh-release-tools/cosign

      # Audit finding #20: the pinned digest must be the one THIS run's build
      # job emitted (threaded through the release-image artifact) — never a
      # fresh resolution of the mutable tag, which would permit pinning any
      # previously-signed image. The script still resolves the tag, but only
      # as a cross-check that it agrees with the build-emitted digest.
      - name: Resolve release app from tag
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            backend-v*) echo "RELEASE_APP=backend" >> "$GITHUB_ENV" ;;
            admin-v*) echo "RELEASE_APP=admin" >> "$GITHUB_ENV" ;;
            staff-web-v*) echo "RELEASE_APP=staff-web" >> "$GITHUB_ENV" ;;
            *) echo "::error::unexpected release tag ${RELEASE_TAG}"; exit 1 ;;
          esac

      - name: Download build-emitted image ref
        uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          name: release-image-${{ env.RELEASE_APP }}-${{ inputs.release_tag }}
          path: output/release-artifact

      - name: Locate build-emitted image ref
        run: |
          set -euo pipefail
          ref_file="$(find output/release-artifact -name image-ref.txt -type f | head -n 1)"
          if [ -z "$ref_file" ]; then
            echo "::error::image-ref.txt not found in the release-image artifact — cannot prove the digest came from this run (audit finding #20)"
            exit 1
          fi
          echo "IMAGE_REF_FILE=$ref_file" >> "$GITHUB_ENV"

      - name: Pin build-emitted digest and update overlay
        run: |
          set -euo pipefail
          if [ -z "${GHCR_TOKEN:-}" ] && [ -n "${CONTAINER_REGISTRY_PASSWORD:-}" ]; then
            export GHCR_TOKEN="$CONTAINER_REGISTRY_PASSWORD"
          fi
          if [ -z "${GHCR_USERNAME:-}" ] && [ -n "${CONTAINER_REGISTRY_USERNAME:-}" ]; then
            export GHCR_USERNAME="$CONTAINER_REGISTRY_USERNAME"
          fi
          node scripts/update-prod-digests.mjs \
            --cosign-exe /tmp/vh-release-tools/cosign \
            --cosign-key infra/forgejo/signing/cosign.pub \
            --tag "$RELEASE_TAG" \
            --expected-digest-file "$IMAGE_REF_FILE" \
            --evidence-file "output/release-pin-digests/${RELEASE_TAG}.json"

      - name: Create reviewable digest patch
        run: |
          set -euo pipefail
          mkdir -p output/release-pin-digests
          if git diff --quiet; then
            echo "No digest change; overlay already pinned to this release."
            printf '' > "output/release-pin-digests/${RELEASE_TAG}.patch"
            exit 0
          fi
          git diff --binary -- infra/kubernetes/apps/kustomization.yaml \
            > "output/release-pin-digests/${RELEASE_TAG}.patch"

      - name: Upload digest verification evidence
        if: always()
        uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: release-pin-digests-${{ inputs.release_tag }}
          path: output/release-pin-digests
          if-no-files-found: ignore

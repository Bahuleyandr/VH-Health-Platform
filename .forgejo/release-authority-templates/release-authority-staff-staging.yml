name: Deploy Staff App - Staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staff-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-authority:
    name: Verify release authority
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      authorized: ${{ steps.authority.outputs.authorized }}
      state: ${{ steps.authority.outputs.state }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check provider, mirror, signer, commit, and Argo parity
        id: authority
        env:
          RELEASE_AUTHORITY_GITHUB_TOKEN: ${{ secrets.RELEASE_AUTHORITY_GITHUB_TOKEN }}
          RELEASE_AUTHORITY_FORGEJO_TOKEN: ${{ github.token }}
          RELEASE_AUTHORITY_ARGO_API_URL: ${{ vars.RELEASE_AUTHORITY_ARGO_API_URL }}
          RELEASE_AUTHORITY_ARGO_TOKEN: ${{ secrets.RELEASE_AUTHORITY_ARGO_TOKEN }}
        run: >
          node scripts/check-release-authority.mjs
          --provider forgejo
          --intent staging
          --commit "$GITHUB_SHA"
          --event "$GITHUB_EVENT_NAME"
          --ref "$GITHUB_REF"
          --evidence-file output/release-authority/forgejo-staff-staging.json

      - name: Upload release-authority evidence
        if: always()
        uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: release-authority-forgejo-staff-staging-${{ github.run_id }}
          path: output/release-authority
          if-no-files-found: error

  build-and-distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: release-authority
    if: needs.release-authority.outputs.authorized == 'true'
    env:
      FIREBASE_APP_ID_STAFF: ${{ secrets.FIREBASE_APP_ID_STAFF }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Node runs the codegen driver below (scripts/codegen.mjs) and the npx
      # firebase-tools distribution step. Pinned to the repo-standard version
      # rather than relying on whatever the runner image ships.
      - uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.5.0'

      - uses: https://github.com/subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Pinned to the workspace toolchain (_reusable-flutter-workspace.yml
          # + ci.yml + the .github release workflows) — bump all together. The
          # floating `stable` channel tracks whatever Dart ships that week, so
          # this lane could build a different Flutter than CI validated and, on
          # the release workflows, ship it.
          flutter-version: 3.47.0
          cache: true

      - name: Install Android API 37 toolchain
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Activate Melos
        run: dart pub global activate melos 8.2.2

      - name: Bootstrap workspace
        run: |
          dart pub get
          melos bootstrap

      # Must run AFTER bootstrap (build_runner is resolved by the workspace)
      # and BEFORE the build: the generated client lib/api/generated/** is
      # gitignored and absent on a fresh clone, yet the tracked barrel
      # lib/api/vhhealth_api.dart re-exports it and lib/services/** imports
      # generated symbols, so the app only compiles once codegen has run.
      # melos run codegen invokes `node scripts/codegen.mjs`, which needs Node
      # (set up above) and dart (from subosito/flutter-action above).
      - name: Codegen (regenerate Dart client from synced spec)
        run: melos run codegen

      - name: Build debug APKs
        working-directory: apps/staff
        run: >
          flutter build apk --debug --split-per-abi
          --dart-define=VH_BASE_URL=https://api.staging.vhhealth.app/api/v1
          --dart-define=VH_API_KEY=${{ secrets.VH_API_KEY }}

      - name: Upload staging APK artifacts
        uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: staff-staging-apks-${{ github.sha }}
          path: apps/staff/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Upload to Firebase App Distribution
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_APP_ID_STAFF:-}" ] || [ -z "${FIREBASE_TOKEN:-}" ]; then
            echo "Firebase App Distribution secrets missing; build artifact uploaded, distribution skipped."
            exit 0
          fi
          npx --yes firebase-tools@13.35.1 appdistribution:distribute \
            apps/staff/build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk \
            --app "$FIREBASE_APP_ID_STAFF" \
            --groups staging-testers \
            --release-notes "Staff ${GITHUB_SHA} on ${GITHUB_REF_NAME}" \
            --token "$FIREBASE_TOKEN"

      - name: Notify Discord on failure
        if: failure()
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL not configured; skipping notification."
            exit 0
          fi
          curl -sS -H "Content-Type: application/json" \
            -d "{\"content\":\"Staff App staging deploy failed on ${GITHUB_REF_NAME}\\n${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "$DISCORD_WEBHOOK_URL" || true

name: Release Staff App

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Staff release tag, for example staff-v1.2.3'
        required: true

permissions:
  contents: read

concurrency:
  group: release-staff-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-authority:
    name: Verify release authority
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      authorized: ${{ steps.authority.outputs.authorized }}
      state: ${{ steps.authority.outputs.state }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check provider, mirror, signer, tag, and Argo parity
        id: authority
        env:
          RELEASE_AUTHORITY_GITHUB_TOKEN: ${{ secrets.RELEASE_AUTHORITY_GITHUB_TOKEN }}
          RELEASE_AUTHORITY_FORGEJO_TOKEN: ${{ github.token }}
          RELEASE_AUTHORITY_ARGO_API_URL: ${{ vars.RELEASE_AUTHORITY_ARGO_API_URL }}
          RELEASE_AUTHORITY_ARGO_TOKEN: ${{ secrets.RELEASE_AUTHORITY_ARGO_TOKEN }}
          RELEASE_AUTHORITY_TAG: ${{ inputs.release_tag }}
        run: >
          node scripts/check-release-authority.mjs
          --provider forgejo
          --intent staff-release
          --commit "$GITHUB_SHA"
          --tag "$RELEASE_AUTHORITY_TAG"
          --event "$GITHUB_EVENT_NAME"
          --ref "$GITHUB_REF"
          --evidence-file output/release-authority/forgejo-release-staff.json

      - name: Upload release-authority evidence
        if: always()
        uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: release-authority-forgejo-staff-${{ github.run_id }}
          path: output/release-authority
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    needs: release-authority
    if: needs.release-authority.outputs.authorized == 'true'
    permissions:
      contents: write
    env:
      RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
      VH_BASE_URL: ${{ vars.VH_BASE_URL }}
      VH_API_KEY: ${{ secrets.VH_API_KEY }}
      VH_TENANT_SLUG: ${{ vars.VH_TENANT_SLUG }}
      VH_TENANT_ID: ${{ vars.VH_TENANT_ID }}
      STAFF_CERT_PIN_HASHES: ${{ vars.STAFF_CERT_PIN_HASHES }}
      CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS: ${{ vars.CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS }}
      STAFF_ANDROID_KEYSTORE_BASE64: ${{ secrets.STAFF_ANDROID_KEYSTORE_BASE64 }}
      STAFF_ANDROID_KEY_ALIAS: ${{ secrets.STAFF_ANDROID_KEY_ALIAS }}
      STAFF_ANDROID_KEY_PASSWORD: ${{ secrets.STAFF_ANDROID_KEY_PASSWORD }}
      STAFF_ANDROID_STORE_PASSWORD: ${{ secrets.STAFF_ANDROID_STORE_PASSWORD }}
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Node runs the codegen driver below (scripts/codegen.mjs), the cert-pin
      # validator, and the Forgejo release-asset publisher. Pinned to the
      # repo-standard version rather than relying on whatever the runner ships.
      - uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.5.0'

      - uses: https://github.com/subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Pinned to the workspace toolchain (_reusable-flutter-workspace.yml
          # + ci.yml + the .github release workflows) — bump all together. The
          # floating `stable` channel tracks whatever Dart ships that week, so
          # this lane could build a different Flutter than CI validated and, on
          # the release workflows, ship it.
          flutter-version: 3.47.0
          cache: true

      - name: Install Android API 37 toolchain
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Resolve release tag
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG_INPUT:-${GITHUB_REF_NAME}}"
          case "$tag" in
            staff-v*) ;;
            *) echo "::error::Staff releases require a staff-v* tag, got '$tag'"; exit 1 ;;
          esac
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Activate Melos
        run: dart pub global activate melos 8.2.2

      - name: Bootstrap workspace
        run: |
          dart pub get
          melos bootstrap

      # Must run AFTER bootstrap (build_runner is resolved by the workspace)
      # and BEFORE the build: the generated client lib/api/generated/** is
      # gitignored and absent on a fresh clone, yet the tracked barrel
      # lib/api/vhhealth_api.dart re-exports it and lib/services/** imports
      # generated symbols, so the app only compiles once codegen has run.
      # melos run codegen invokes `node scripts/codegen.mjs`, which needs Node
      # (set up above) and dart (from subosito/flutter-action above).
      # Kept ahead of the signing step so a codegen failure cannot burn a tag
      # after the release keystore has already been written to disk.
      - name: Codegen (regenerate Dart client from synced spec)
        run: melos run codegen

      - name: Validate release configuration
        run: |
          set -euo pipefail
          missing=0
          for name in \
            VH_BASE_URL \
            VH_API_KEY \
            STAFF_CERT_PIN_HASHES \
            CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS \
            STAFF_ANDROID_KEYSTORE_BASE64 \
            STAFF_ANDROID_KEY_ALIAS \
            STAFF_ANDROID_KEY_PASSWORD \
            STAFF_ANDROID_STORE_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is required for staff release builds"
              missing=1
            fi
          done
          node scripts/validate-cert-pin-set.mjs \
            --pins "${STAFF_CERT_PIN_HASHES}" \
            --clock-skew-seconds "${CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS}"
          exit "$missing"

      # See release-patient.yml for the full rationale. In short: never stamp an
      # empty define (`--dart-define=VH_TENANT_ID=` sets TenantConfig.id to ''
      # rather than the default, matching no tenant), and require slug + id to
      # be stamped together and coherently. TenantConfig.verifyOrThrow enforces
      # the same invariant at app startup.
      - name: Resolve and validate tenant build stamp
        run: |
          set -euo pipefail
          slug="${VH_TENANT_SLUG:-}"
          tenant_id="${VH_TENANT_ID:-}"
          default_tenant='00000000-0000-4000-8000-000000000001'
          uuid_re='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          defines=''
          if [ -n "${slug}" ] || [ -n "${tenant_id}" ]; then
            if [ -z "${slug}" ] || [ -z "${tenant_id}" ]; then
              echo "A per-tenant staff build needs BOTH VH_TENANT_SLUG and VH_TENANT_ID." >&2
              exit 1
            fi
            if ! printf '%s' "${tenant_id}" | grep -Eq "${uuid_re}"; then
              echo "VH_TENANT_ID is not a tenant UUID: '${tenant_id}'." >&2
              exit 1
            fi
            if [ "${tenant_id}" = "${default_tenant}" ]; then
              echo "VH_TENANT_SLUG='${slug}' is stamped but VH_TENANT_ID is the platform default tenant." >&2
              exit 1
            fi
            defines="--dart-define=VH_TENANT_SLUG=${slug} --dart-define=VH_TENANT_ID=${tenant_id}"
            echo "Per-tenant staff build for slug '${slug}'."
          else
            echo 'Default single-tenant staff build: no tenant defines stamped.'
          fi
          echo "VH_TENANT_DEFINES=${defines}" >> "${GITHUB_ENV}"

      - name: Configure Android signing
        run: |
          set -euo pipefail
          printf '%s' "$STAFF_ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/staff/android/release-keystore.jks
          cat > apps/staff/android/key.properties <<EOF
          storePassword=${STAFF_ANDROID_STORE_PASSWORD}
          keyPassword=${STAFF_ANDROID_KEY_PASSWORD}
          keyAlias=${STAFF_ANDROID_KEY_ALIAS}
          storeFile=release-keystore.jks
          EOF

      - name: Build release APK
        working-directory: apps/staff
        run: >
          flutter build apk --release
          --dart-define=VH_BASE_URL="${VH_BASE_URL}"
          --dart-define=VH_API_KEY="${VH_API_KEY}"
          --dart-define=PRODUCTION=true
          --dart-define=CERT_PIN_HASHES="${STAFF_CERT_PIN_HASHES}"
          --dart-define=CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS="${CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS}"
          ${VH_TENANT_DEFINES}

      - name: Build release AAB
        working-directory: apps/staff
        run: >
          flutter build appbundle --release
          --dart-define=VH_BASE_URL="${VH_BASE_URL}"
          --dart-define=VH_API_KEY="${VH_API_KEY}"
          --dart-define=PRODUCTION=true
          --dart-define=CERT_PIN_HASHES="${STAFF_CERT_PIN_HASHES}"
          --dart-define=CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS="${CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS}"
          ${VH_TENANT_DEFINES}

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p output/releases/staff
          cp apps/staff/build/app/outputs/flutter-apk/app-release.apk "output/releases/staff/vh-health-staff-${RELEASE_TAG}.apk"
          cp apps/staff/build/app/outputs/bundle/release/app-release.aab "output/releases/staff/vh-health-staff-${RELEASE_TAG}.aab"

      - name: Upload release artifacts
        uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: staff-release-artifacts
          path: output/releases/staff
          if-no-files-found: error

      - name: Publish Forgejo release assets
        run: |
          node scripts/ci/forgejo-release-assets.mjs \
            --tag "$RELEASE_TAG" \
            --name "Staff $RELEASE_TAG" \
            --body "Signed staff Android release built by Forgejo Actions from ${GITHUB_SHA}." \
            --file "output/releases/staff/vh-health-staff-${RELEASE_TAG}.apk" \
            --file "output/releases/staff/vh-health-staff-${RELEASE_TAG}.aab"

# Analytics warehouse CI (roadmap F1/F2) validates the dbt project against a
# real migrations-built schema, then renders the optional warehouse manifests.
name: ci-warehouse

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/kubernetes/optional/analytics-warehouse/**'
      - '.forgejo/workflows/ci-warehouse.yml'
  push:
    branches: [main]
    paths:
      - 'infra/kubernetes/optional/analytics-warehouse/**'
      - '.forgejo/workflows/ci-warehouse.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-warehouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dbt-build:
    name: dbt build + kustomize
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: vhhealth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      - uses: https://data.forgejo.org/actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install backend deps (migration runner)
        working-directory: apps/backend
        run: npm ci --ignore-scripts

      - name: Apply full migration chain (replicated schema shapes)
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/vhhealth_test
        run: |
          node scripts/ensure-pgvector-extension.mjs
          node scripts/ci-setup-db.mjs --skip-seeds

      - name: Install dbt
        run: |
          python -m pip install --user --quiet "dbt-core<2" "dbt-postgres~=1.9.0"
          "$HOME/.local/bin/dbt" --version

      - name: dbt build (models + tests)
        working-directory: infra/kubernetes/optional/analytics-warehouse/dbt
        env:
          DBT_PG_HOST: 127.0.0.1
          DBT_PG_PORT: '5432'
          DBT_PG_USER: postgres
          DBT_PG_DBNAME: vhhealth_test
          DBT_PG_SCHEMA: analytics
        run: |
          "$HOME/.local/bin/dbt" deps --profiles-dir profiles || true
          "$HOME/.local/bin/dbt" build --profiles-dir profiles --no-use-colors

      - name: Install kustomize
        run: |
          set -euo pipefail
          mkdir -p /tmp/vh-kustomize
          curl -sSfL \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz \
            -o /tmp/vh-kustomize/kustomize.tar.gz
          tar -xzf /tmp/vh-kustomize/kustomize.tar.gz -C /tmp/vh-kustomize kustomize
          chmod 0755 /tmp/vh-kustomize/kustomize

      - name: kustomize build (module manifests + configmap refs resolve)
        run: |
          /tmp/vh-kustomize/kustomize build infra/kubernetes/optional/analytics-warehouse > /dev/null
          echo "kustomize build OK"

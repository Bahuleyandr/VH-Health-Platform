name: Canonical CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  ci:
    name: Repo-owned CI runner
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: https://data.forgejo.org/actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/backend/package-lock.json
            apps/admin/package-lock.json

      - uses: https://github.com/subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: https://data.forgejo.org/actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run canonical CI
        run: node scripts/ci/run.mjs --install

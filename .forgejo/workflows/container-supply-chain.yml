name: Container Supply Chain

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'apps/admin/**'
      - 'apps/staff/**'
      - 'packages/vhhealth_core/**'
      - 'pubspec.*'
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'apps/admin/**'
      - 'apps/staff/**'
      - 'packages/vhhealth_core/**'
      - 'pubspec.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: ${{ matrix.app }} image
    runs-on: docker-builder
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            image: vhhealth-backend
            context: apps/backend
            dockerfile: apps/backend/Dockerfile
            build_contexts: ''
            build_args: '--build-arg NODE_IMAGE=mirror.gcr.io/library/node:26.5.0-alpine@sha256:e88a35be04478413b7c71c455cd9865de9b9360e1f43456be5951032d7ac1a66'
          - app: admin
            image: vhhealth-admin
            context: apps/admin
            dockerfile: apps/admin/Dockerfile
            build_contexts: '--build-context backend=apps/backend'
            build_args: '--build-arg NEXT_PUBLIC_API_URL=https://api.vhhealth.app --build-arg NEXT_PUBLIC_APP_NAME=VHHealthAdmin --build-arg NEXT_PUBLIC_ALLOWED_ORIGIN=https://admin.vhhealth.app --build-arg NEXT_PUBLIC_SENTRY_ENVIRONMENT=ci --build-arg NEXT_PUBLIC_SENTRY_RELEASE=${{ github.sha }} --build-arg SENTRY_UPLOAD_SOURCE_MAPS=false'
          - app: staff-web
            image: vhhealth-staff-web
            context: .
            dockerfile: apps/staff/Dockerfile.web
            build_contexts: ''
            build_args: '--build-arg VH_BASE_URL=https://api.vhhealth.app/api/v1 --build-arg APP_NAME=VHHealthStaff --build-arg SENTRY_ENVIRONMENT=ci --build-arg SENTRY_RELEASE=${{ github.sha }}'
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare output
        run: mkdir -p output/container/${{ matrix.app }}

      - name: Build image
        run: >
          docker build
          --pull
          -t local/${{ matrix.image }}:${{ github.sha }}
          -f ${{ matrix.dockerfile }}
          ${{ matrix.build_contexts }}
          ${{ matrix.build_args }}
          ${{ matrix.context }}

      - name: Record local image metadata
        run: |
          docker image inspect local/${{ matrix.image }}:${{ github.sha }} \
            > output/container/${{ matrix.app }}/image-inspect.json

      - name: Save image archive for offline scanners
        run: |
          set -euo pipefail
          docker save local/${{ matrix.image }}:${{ github.sha }} \
            -o /tmp/${{ matrix.app }}-image.tar

      # Audit finding M15: scanner installers were fetched from MUTABLE
      # `main` refs (and syft was unversioned) — pin both the install-script
      # ref and the tool version so the scanning toolchain itself can't be
      # swapped underneath the pipeline.
      - name: Install image scanners (pinned versions + pinned script refs)
        run: |
          set -euo pipefail
          mkdir -p /tmp/vh-scanners
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/v1.18.1/install.sh \
            | sh -s -- -b /tmp/vh-scanners v1.18.1
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.71.0/contrib/install.sh \
            | sh -s -- -b /tmp/vh-scanners v0.71.0

      - name: Generate SBOM
        continue-on-error: true
        run: |
          /tmp/vh-scanners/syft \
            docker-archive:/tmp/${{ matrix.app }}-image.tar \
            -o spdx-json=output/container/${{ matrix.app }}/sbom.spdx.json

      # Audit finding M15: this scan was `continue-on-error: true`, so
      # CRITICAL/HIGH vulns and leaked secrets never blocked a merge. It is
      # now BLOCKING (--exit-code 1) for vuln/secret findings. Misconfiguration
      # findings are reported separately below while the existing backlog is
      # triaged.
      - name: Trivy image scan (blocking on CRITICAL/HIGH + secrets)
        run: |
          /tmp/vh-scanners/trivy image \
            --input /tmp/${{ matrix.app }}-image.tar \
            --db-repository ghcr.io/aquasecurity/trivy-db:2 \
            --scanners vuln,secret \
            --skip-version-check \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            --format sarif \
            --output output/container/${{ matrix.app }}/trivy-image.sarif

      - name: Trivy image misconfiguration scan (advisory)
        continue-on-error: true
        run: |
          /tmp/vh-scanners/trivy image \
            --input /tmp/${{ matrix.app }}-image.tar \
            --db-repository ghcr.io/aquasecurity/trivy-db:2 \
            --scanners misconfig \
            --skip-version-check \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 0 \
            --format sarif \
            --output output/container/${{ matrix.app }}/trivy-image-misconfig.sarif

      - name: Registry push and cosign signature gate
        env:
          CONTAINER_REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
          CONTAINER_REGISTRY_USERNAME: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          CONTAINER_REGISTRY_PASSWORD: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          summary="output/container/${{ matrix.app }}/signing-summary.txt"
          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
            echo "Pull-request build kept local; release signing is enforced on push/manual runs." | tee "$summary"
            exit 0
          fi
          missing=()
          for name in CONTAINER_REGISTRY CONTAINER_REGISTRY_USERNAME CONTAINER_REGISTRY_PASSWORD COSIGN_PRIVATE_KEY COSIGN_PASSWORD COSIGN_PUBLIC_KEY; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Signing path missing required secret(s): %s\n' "${missing[*]}" | tee "$summary"
            echo "::error::Container signing is fail-closed for push/manual runs; configure ${missing[*]}"
            exit 1
          fi
          target="${CONTAINER_REGISTRY%/}/${{ matrix.image }}:${{ github.sha }}"
          printf '%s' "$CONTAINER_REGISTRY_PASSWORD" | docker login "$CONTAINER_REGISTRY" -u "$CONTAINER_REGISTRY_USERNAME" --password-stdin
          docker tag local/${{ matrix.image }}:${{ github.sha }} "$target"
          docker push "$target"
          curl -sSfL https://github.com/sigstore/cosign/releases/download/v2.5.3/cosign-linux-amd64 -o /tmp/cosign
          chmod +x /tmp/cosign
          /tmp/cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$target"
          /tmp/cosign verify --key env://COSIGN_PUBLIC_KEY "$target" \
            > output/container/${{ matrix.app }}/cosign-verify.json
          echo "Image pushed, signed, and verified: $target" | tee "$summary"

      - name: Upload image reports
        if: always()
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: container-${{ matrix.app }}
          path: output/container/${{ matrix.app }}
          if-no-files-found: ignore

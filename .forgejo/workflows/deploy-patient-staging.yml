name: Deploy Patient App - Staging

on:
  push:
    branches: [main]
    paths:
      - 'apps/patient/**'
      - 'packages/vhhealth_core/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'scripts/codegen.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-patient-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FIREBASE_APP_ID_PATIENT: ${{ secrets.FIREBASE_APP_ID_PATIENT }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      # Node runs the codegen driver below (scripts/codegen.mjs) and the npx
      # firebase-tools distribution step. Pinned to the repo-standard version
      # rather than relying on whatever the runner image ships.
      - uses: https://data.forgejo.org/actions/setup-node@v4
        with:
          node-version: '26.5.0'

      - uses: https://github.com/subosito/flutter-action@v2
        with:
          # Pinned to the workspace toolchain (_reusable-flutter-workspace.yml
          # + ci.yml + the .github release workflows) — bump all together. The
          # floating `stable` channel tracks whatever Dart ships that week, so
          # this lane could build a different Flutter than CI validated and, on
          # the release workflows, ship it.
          flutter-version: 3.44.0
          cache: true

      - name: Install Android API 37 toolchain
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Activate Melos
        run: dart pub global activate melos 8.2.2

      - name: Bootstrap workspace
        run: |
          dart pub get
          melos bootstrap

      # Must run AFTER bootstrap (build_runner is resolved by the workspace)
      # and BEFORE the build: the generated client lib/api/generated/** is
      # gitignored and absent on a fresh clone, yet the tracked barrel
      # lib/api/vhhealth_api.dart re-exports it and lib/services/** imports
      # generated symbols, so the app only compiles once codegen has run.
      # melos run codegen invokes `node scripts/codegen.mjs`, which needs Node
      # (set up above) and dart (from subosito/flutter-action above).
      - name: Codegen (regenerate Dart client from synced spec)
        run: melos run codegen

      - name: Build debug APKs
        working-directory: apps/patient
        run: >
          flutter build apk --debug --split-per-abi
          --dart-define=VH_BASE_URL=https://api.staging.vhhealth.app/api/v1
          --dart-define=VH_API_KEY=${{ secrets.VH_API_KEY }}

      - name: Upload staging APK artifacts
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: patient-staging-apks-${{ github.sha }}
          path: apps/patient/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Upload to Firebase App Distribution
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_APP_ID_PATIENT:-}" ] || [ -z "${FIREBASE_TOKEN:-}" ]; then
            echo "Firebase App Distribution secrets missing; build artifact uploaded, distribution skipped."
            exit 0
          fi
          npx --yes firebase-tools@13.35.1 appdistribution:distribute \
            apps/patient/build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk \
            --app "$FIREBASE_APP_ID_PATIENT" \
            --groups staging-testers \
            --release-notes "Patient ${GITHUB_SHA} on ${GITHUB_REF_NAME}" \
            --token "$FIREBASE_TOKEN"

      - name: Notify Discord on failure
        if: failure()
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL not configured; skipping notification."
            exit 0
          fi
          curl -sS -H "Content-Type: application/json" \
            -d "{\"content\":\"Patient App staging deploy failed on ${GITHUB_REF_NAME}\\n${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "$DISCORD_WEBHOOK_URL" || true

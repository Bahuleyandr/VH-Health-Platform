name: OpenAPI and Client Drift

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/backend/src/**'
      - 'apps/backend/all-514-routes-clean.json'
      - 'apps/admin/src/lib/api-types.generated.ts'
      - 'packages/vhhealth_core/**'
      - '.forgejo/workflows/openapi-client-drift.yml'
  push:
    branches: [main]
    paths:
      - 'apps/backend/src/**'
      - 'apps/backend/all-514-routes-clean.json'
      - 'apps/admin/src/lib/api-types.generated.ts'
      - 'packages/vhhealth_core/**'
      - '.forgejo/workflows/openapi-client-drift.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openapi-client-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi:
    name: Backend spec + Admin/Dart generated clients
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PUB_CACHE: /cache/vh-health-platform/pub
      npm_config_cache: /cache/vh-health-platform/npm
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: https://data.forgejo.org/actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/backend/package-lock.json
            apps/admin/package-lock.json

      - uses: https://github.com/subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install backend/admin dependencies
        run: |
          npm --prefix apps/backend ci
          npm --prefix apps/admin ci

      - name: Regenerate backend OpenAPI
        working-directory: apps/backend
        run: |
          if [ -f all-514-routes-clean.json ]; then
            npm run swagger:generate-complete
          else
            echo "::warning::apps/backend/all-514-routes-clean.json is not committed; validating committed swagger-complete.yaml instead of regenerating it."
          fi
          npm run swagger:validate
          npx spectral lint src/docs/swagger-complete.yaml

      - name: Regenerate Admin API types
        working-directory: apps/admin
        run: npm run generate:types

      - name: Regenerate shared Dart OpenAPI client
        run: |
          cp apps/backend/src/docs/swagger-complete.yaml packages/vhhealth_core/swagger/api.yaml
          dart pub get
          dart run melos bootstrap
          cd packages/vhhealth_core
          dart run build_runner build --delete-conflicting-outputs

      - name: Fail on generated client drift
        run: |
          git diff -- \
            apps/backend/src/docs/swagger-complete.yaml \
            apps/backend/src/docs/swagger-complete.json \
            apps/admin/src/lib/api-types.generated.ts \
            packages/vhhealth_core/swagger/api.yaml \
            packages/vhhealth_core/lib/api/generated
          git diff --exit-code -- \
            apps/backend/src/docs/swagger-complete.yaml \
            apps/backend/src/docs/swagger-complete.json \
            apps/admin/src/lib/api-types.generated.ts \
            packages/vhhealth_core/swagger/api.yaml \
            packages/vhhealth_core/lib/api/generated

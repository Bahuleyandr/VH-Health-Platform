name: OpenAPI and Client Drift

# Phase 1 (canonical spec + path-set drift gate): this workflow validates that
# the committed canonical spec apps/backend/src/docs/openapi.json is well-formed.
# The authoritative live-router drift gate (regenerate + diff) runs in
# schema-policy-drift.yml (which has the Postgres service the boot-based
# generator needs). The generated-CLIENT drift checks (admin-TS via
# openapi-typescript, shared Dart via swagger_dart_code_generator + the
# vhhealth_core spec-copy) return in Phases 2-4 of the OpenAPI contract pipeline
# epic — see docs/superpowers/specs/2026-06-24-openapi-contract-pipeline-design.md.
#
# Phase 4 (Dart client codegen gate) — scope note: this Forgejo workflow stays
# Node-only (spec well-formedness + vhhealth_core spec-copy sync). It deliberately
# does NOT regenerate the Dart client, because that needs the Flutter/Dart
# toolchain, which this runner does not provision. The AUTHORITATIVE Dart-client
# codegen gate (a spec change that breaks `melos run codegen` or the
# barrel/wrapper/compose-test fails CI) is the GitHub `ci-flutter` job —
# see the `Codegen (regenerate Dart client from synced spec)` step in
# .github/workflows/_reusable-flutter-workspace.yml. Forgejo keeps spec-sync only.

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/backend/src/docs/openapi.json'
      - 'apps/admin/src/lib/api-types.generated.ts'
      - 'packages/vhhealth_core/**'
      - '.forgejo/workflows/openapi-client-drift.yml'
  push:
    branches: [main]
    paths:
      - 'apps/backend/src/docs/openapi.json'
      - 'apps/admin/src/lib/api-types.generated.ts'
      - 'packages/vhhealth_core/**'
      - '.forgejo/workflows/openapi-client-drift.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openapi-client-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi:
    name: Backend spec well-formedness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      npm_config_cache: /cache/vh-health-platform/npm
      npm_config_audit: 'false'
      npm_config_fund: 'false'
      npm_config_prefer_offline: 'true'
      npm_config_progress: 'false'
      npm_config_production: 'false'
      NODE_ENV: development
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.5.0'
          cache: npm
          cache-dependency-path: |
            apps/backend/package-lock.json

      # onnxruntime-node's postinstall (script/install.js) downloads the CUDA 12
      # execution-provider .so files from api.nuget.org on linux/x64. No CI
      # runner has a GPU, the CPU runtime (libonnxruntime.so.1 +
      # onnxruntime_binding.node) is bundled in the npm tarball, and the only
      # consumer (src/services/gamification/adherenceModelServing.js) uses the
      # default CPU provider — so the download is dead weight that failed
      # `npm ci` with ETIMEDOUT to 150.171.109.77:443 on PR #1023 (run
      # 34195814839). `skip` makes install.js exit before any network call
      # (parseInstallFlag in script/install-utils.js, v1.27.0). The next step
      # asserts the skip took effect; it is not inferred from a green install.
      # Mirrors the guard PR #1045 put on every .github backend `npm ci`. This
      # install runs from the repo root via `--prefix apps/backend`, which is
      # why the verify step below sets its own working-directory.
      - name: Install backend dependencies
        timeout-minutes: 20
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: |
          npm --prefix apps/backend ci --include=dev --no-audit --no-fund --prefer-offline --progress=false

      - name: Verify onnxruntime-node postinstall skipped the CUDA download
        working-directory: apps/backend
        run: |
          ort=node_modules/onnxruntime-node/bin/napi-v6/linux/x64
          for f in libonnxruntime_providers_cuda.so libonnxruntime_providers_shared.so libonnxruntime_providers_tensorrt.so; do
            if [ -e "$ort/$f" ]; then
              echo "::error::$ort/$f is present — the NuGet download ran despite ONNXRUNTIME_NODE_INSTALL=skip"
              exit 1
            fi
          done
          for f in libonnxruntime.so.1 onnxruntime_binding.node; do
            if [ ! -e "$ort/$f" ]; then
              echo "::error::$ort/$f is missing — the bundled CPU runtime did not install"
              exit 1
            fi
          done
          node --input-type=module -e "const ort = await import('onnxruntime-node'); if (typeof ort.InferenceSession?.create !== 'function') throw new Error('onnxruntime-node imported but InferenceSession.create is missing');"
          echo "onnxruntime-node: CUDA provider download skipped; bundled CPU runtime present and importable"

      - name: Lint canonical OpenAPI spec with Spectral
        working-directory: apps/backend
        run: npx spectral lint src/docs/openapi.json

      - name: vhhealth_core spec-copy sync check
        working-directory: apps/backend
        run: node scripts/check-core-spec-sync.mjs

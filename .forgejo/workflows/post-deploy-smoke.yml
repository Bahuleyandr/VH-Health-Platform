name: Post Deploy Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-deploy-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: API/admin/Sentry smoke
    runs-on: docker-builder
    timeout-minutes: 15
    env:
      VH_TRIAL_API_ORIGIN: ${{ secrets.VH_TRIAL_API_ORIGIN }}
      VH_TRIAL_ADMIN_ORIGIN: ${{ secrets.VH_TRIAL_ADMIN_ORIGIN }}
      VH_REQUIRE_VERSION_MATCH: ${{ secrets.VH_REQUIRE_VERSION_MATCH }}
      SENTRY_DSN_BACKEND: ${{ secrets.SENTRY_DSN_BACKEND }}
      SENTRY_DSN_ADMIN: ${{ secrets.SENTRY_DSN_ADMIN }}
      SENTRY_DSN_STAFF: ${{ secrets.SENTRY_DSN_STAFF }}
      SENTRY_SMOKE_REQUIRED: ${{ secrets.SENTRY_SMOKE_REQUIRED }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.5.0'

      - name: Probe post-deploy smoke prerequisites
        id: preflight
        run: >
          node scripts/ci/forgejo-deploy-preflight.mjs
          --mode post-deploy-smoke
          --allow-skip
          --summary-file output/post-deploy-smoke/SKIPPED.md
          --result-file output/post-deploy-smoke/deployment-status.json

      - name: Run post-deploy smoke
        if: steps.preflight.outputs.skip != 'true'
        run: node scripts/ci/post-deploy-smoke.mjs

      - name: Upload post-deploy smoke report
        if: always()
        uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: post-deploy-smoke
          path: output/post-deploy-smoke
          if-no-files-found: ignore

name: Release Patient App

on:
  push:
    tags: ['patient-v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Patient release tag, for example patient-v1.2.3'
        required: true

permissions:
  contents: write

concurrency:
  group: release-patient-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
      VH_BASE_URL: ${{ vars.VH_BASE_URL }}
      VH_API_KEY: ${{ secrets.VH_API_KEY }}
      PATIENT_CERT_PIN_HASHES: ${{ vars.PATIENT_CERT_PIN_HASHES }}
      CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS: ${{ vars.CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS }}
      PATIENT_ANDROID_KEYSTORE_BASE64: ${{ secrets.PATIENT_ANDROID_KEYSTORE_BASE64 }}
      PATIENT_ANDROID_KEY_ALIAS: ${{ secrets.PATIENT_ANDROID_KEY_ALIAS }}
      PATIENT_ANDROID_KEY_PASSWORD: ${{ secrets.PATIENT_ANDROID_KEY_PASSWORD }}
      PATIENT_ANDROID_STORE_PASSWORD: ${{ secrets.PATIENT_ANDROID_STORE_PASSWORD }}
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: https://github.com/subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve release tag
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG_INPUT:-${GITHUB_REF_NAME}}"
          case "$tag" in
            patient-v*) ;;
            *) echo "::error::Patient releases require a patient-v* tag, got '$tag'"; exit 1 ;;
          esac
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Activate Melos
        run: dart pub global activate melos 7.5.1

      - name: Bootstrap workspace
        run: |
          dart pub get
          melos bootstrap

      - name: Validate release configuration
        run: |
          set -euo pipefail
          missing=0
          for name in \
            VH_BASE_URL \
            VH_API_KEY \
            PATIENT_CERT_PIN_HASHES \
            CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS \
            PATIENT_ANDROID_KEYSTORE_BASE64 \
            PATIENT_ANDROID_KEY_ALIAS \
            PATIENT_ANDROID_KEY_PASSWORD \
            PATIENT_ANDROID_STORE_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is required for patient release builds"
              missing=1
            fi
          done
          node scripts/validate-cert-pin-set.mjs \
            --pins "${PATIENT_CERT_PIN_HASHES}" \
            --clock-skew-seconds "${CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS}"
          exit "$missing"

      - name: Configure Android signing
        run: |
          set -euo pipefail
          printf '%s' "$PATIENT_ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/patient/android/release-keystore.jks
          cat > apps/patient/android/key.properties <<EOF
          storePassword=${PATIENT_ANDROID_STORE_PASSWORD}
          keyPassword=${PATIENT_ANDROID_KEY_PASSWORD}
          keyAlias=${PATIENT_ANDROID_KEY_ALIAS}
          storeFile=release-keystore.jks
          EOF

      - name: Build release APK
        working-directory: apps/patient
        run: >
          flutter build apk --release
          --dart-define=VH_BASE_URL="${VH_BASE_URL}"
          --dart-define=VH_API_KEY="${VH_API_KEY}"
          --dart-define=PRODUCTION=true
          --dart-define=CERT_PIN_HASHES="${PATIENT_CERT_PIN_HASHES}"
          --dart-define=CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS="${CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS}"

      - name: Build release AAB
        working-directory: apps/patient
        run: >
          flutter build appbundle --release
          --dart-define=VH_BASE_URL="${VH_BASE_URL}"
          --dart-define=VH_API_KEY="${VH_API_KEY}"
          --dart-define=PRODUCTION=true
          --dart-define=CERT_PIN_HASHES="${PATIENT_CERT_PIN_HASHES}"
          --dart-define=CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS="${CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS}"

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p output/releases/patient
          cp apps/patient/build/app/outputs/flutter-apk/app-release.apk "output/releases/patient/vh-health-patient-${RELEASE_TAG}.apk"
          cp apps/patient/build/app/outputs/bundle/release/app-release.aab "output/releases/patient/vh-health-patient-${RELEASE_TAG}.aab"

      - name: Upload release artifacts
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: patient-release-artifacts
          path: output/releases/patient
          if-no-files-found: error

      - name: Publish Forgejo release assets
        run: |
          node scripts/ci/forgejo-release-assets.mjs \
            --tag "$RELEASE_TAG" \
            --name "Patient $RELEASE_TAG" \
            --body "Signed patient Android release built by Forgejo Actions from ${GITHUB_SHA}." \
            --file "output/releases/patient/vh-health-patient-${RELEASE_TAG}.apk" \
            --file "output/releases/patient/vh-health-patient-${RELEASE_TAG}.aab"

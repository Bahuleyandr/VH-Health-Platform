name: Release Patient App

on:
  push:
    tags: ['patient-v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Patient release tag, for example patient-v1.2.3'
        required: true

permissions:
  contents: write

concurrency:
  group: release-patient-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
      VH_BASE_URL: ${{ vars.VH_BASE_URL }}
      VH_API_KEY: ${{ secrets.VH_API_KEY }}
      VH_TENANT_SLUG: ${{ vars.VH_TENANT_SLUG }}
      VH_TENANT_ID: ${{ vars.VH_TENANT_ID }}
      PATIENT_CERT_PIN_HASHES: ${{ vars.PATIENT_CERT_PIN_HASHES }}
      CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS: ${{ vars.CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS }}
      PATIENT_ANDROID_KEYSTORE_BASE64: ${{ secrets.PATIENT_ANDROID_KEYSTORE_BASE64 }}
      PATIENT_ANDROID_KEY_ALIAS: ${{ secrets.PATIENT_ANDROID_KEY_ALIAS }}
      PATIENT_ANDROID_KEY_PASSWORD: ${{ secrets.PATIENT_ANDROID_KEY_PASSWORD }}
      PATIENT_ANDROID_STORE_PASSWORD: ${{ secrets.PATIENT_ANDROID_STORE_PASSWORD }}
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      # Node runs the codegen driver below (scripts/codegen.mjs), the cert-pin
      # validator, and the Forgejo release-asset publisher. Pinned to the
      # repo-standard version rather than relying on whatever the runner ships.
      - uses: https://data.forgejo.org/actions/setup-node@v4
        with:
          node-version: '26.5.0'

      - uses: https://github.com/subosito/flutter-action@v2
        with:
          # Pinned to the workspace toolchain (_reusable-flutter-workspace.yml
          # + ci.yml + the .github release workflows) — bump all together. The
          # floating `stable` channel tracks whatever Dart ships that week, so
          # this lane could build a different Flutter than CI validated and, on
          # the release workflows, ship it.
          flutter-version: 3.44.0
          cache: true

      - name: Install Android API 37 toolchain
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Resolve release tag
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG_INPUT:-${GITHUB_REF_NAME}}"
          case "$tag" in
            patient-v*) ;;
            *) echo "::error::Patient releases require a patient-v* tag, got '$tag'"; exit 1 ;;
          esac
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Activate Melos
        run: dart pub global activate melos 8.2.2

      - name: Bootstrap workspace
        run: |
          dart pub get
          melos bootstrap

      # Must run AFTER bootstrap (build_runner is resolved by the workspace)
      # and BEFORE the build: the generated client lib/api/generated/** is
      # gitignored and absent on a fresh clone, yet the tracked barrel
      # lib/api/vhhealth_api.dart re-exports it and lib/services/** imports
      # generated symbols, so the app only compiles once codegen has run.
      # melos run codegen invokes `node scripts/codegen.mjs`, which needs Node
      # (set up above) and dart (from subosito/flutter-action above).
      # Kept ahead of the signing step so a codegen failure cannot burn a tag
      # after the release keystore has already been written to disk.
      - name: Codegen (regenerate Dart client from synced spec)
        run: melos run codegen

      - name: Validate release configuration
        run: |
          set -euo pipefail
          missing=0
          for name in \
            VH_BASE_URL \
            VH_API_KEY \
            PATIENT_CERT_PIN_HASHES \
            CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS \
            PATIENT_ANDROID_KEYSTORE_BASE64 \
            PATIENT_ANDROID_KEY_ALIAS \
            PATIENT_ANDROID_KEY_PASSWORD \
            PATIENT_ANDROID_STORE_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is required for patient release builds"
              missing=1
            fi
          done
          node scripts/validate-cert-pin-set.mjs \
            --pins "${PATIENT_CERT_PIN_HASHES}" \
            --clock-skew-seconds "${CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS}"
          exit "$missing"

      # See release-patient.yml for the full rationale. In short: never stamp an
      # empty define (`--dart-define=VH_TENANT_ID=` sets TenantConfig.id to ''
      # rather than the default, matching no tenant), and require slug + id to
      # be stamped together and coherently. TenantConfig.verifyOrThrow enforces
      # the same invariant at app startup.
      - name: Resolve and validate tenant build stamp
        run: |
          set -euo pipefail
          slug="${VH_TENANT_SLUG:-}"
          tenant_id="${VH_TENANT_ID:-}"
          default_tenant='00000000-0000-4000-8000-000000000001'
          uuid_re='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          defines=''
          if [ -n "${slug}" ] || [ -n "${tenant_id}" ]; then
            if [ -z "${slug}" ] || [ -z "${tenant_id}" ]; then
              echo "A per-tenant patient build needs BOTH VH_TENANT_SLUG and VH_TENANT_ID." >&2
              exit 1
            fi
            if ! printf '%s' "${tenant_id}" | grep -Eq "${uuid_re}"; then
              echo "VH_TENANT_ID is not a tenant UUID: '${tenant_id}'." >&2
              exit 1
            fi
            if [ "${tenant_id}" = "${default_tenant}" ]; then
              echo "VH_TENANT_SLUG='${slug}' is stamped but VH_TENANT_ID is the platform default tenant." >&2
              exit 1
            fi
            defines="--dart-define=VH_TENANT_SLUG=${slug} --dart-define=VH_TENANT_ID=${tenant_id}"
            echo "Per-tenant patient build for slug '${slug}'."
          else
            echo 'Default single-tenant patient build: no tenant defines stamped.'
          fi
          echo "VH_TENANT_DEFINES=${defines}" >> "${GITHUB_ENV}"

      - name: Configure Android signing
        run: |
          set -euo pipefail
          printf '%s' "$PATIENT_ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/patient/android/release-keystore.jks
          cat > apps/patient/android/key.properties <<EOF
          storePassword=${PATIENT_ANDROID_STORE_PASSWORD}
          keyPassword=${PATIENT_ANDROID_KEY_PASSWORD}
          keyAlias=${PATIENT_ANDROID_KEY_ALIAS}
          storeFile=release-keystore.jks
          EOF

      - name: Build release APK
        working-directory: apps/patient
        run: >
          flutter build apk --release
          --dart-define=VH_BASE_URL="${VH_BASE_URL}"
          --dart-define=VH_API_KEY="${VH_API_KEY}"
          --dart-define=PRODUCTION=true
          --dart-define=CERT_PIN_HASHES="${PATIENT_CERT_PIN_HASHES}"
          --dart-define=CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS="${CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS}"
          ${VH_TENANT_DEFINES}

      - name: Build release AAB
        working-directory: apps/patient
        run: >
          flutter build appbundle --release
          --dart-define=VH_BASE_URL="${VH_BASE_URL}"
          --dart-define=VH_API_KEY="${VH_API_KEY}"
          --dart-define=PRODUCTION=true
          --dart-define=CERT_PIN_HASHES="${PATIENT_CERT_PIN_HASHES}"
          --dart-define=CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS="${CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS}"
          ${VH_TENANT_DEFINES}

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p output/releases/patient
          cp apps/patient/build/app/outputs/flutter-apk/app-release.apk "output/releases/patient/vh-health-patient-${RELEASE_TAG}.apk"
          cp apps/patient/build/app/outputs/bundle/release/app-release.aab "output/releases/patient/vh-health-patient-${RELEASE_TAG}.aab"

      - name: Upload release artifacts
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: patient-release-artifacts
          path: output/releases/patient
          if-no-files-found: error

      - name: Publish Forgejo release assets
        run: |
          node scripts/ci/forgejo-release-assets.mjs \
            --tag "$RELEASE_TAG" \
            --name "Patient $RELEASE_TAG" \
            --body "Signed patient Android release built by Forgejo Actions from ${GITHUB_SHA}." \
            --file "output/releases/patient/vh-health-patient-${RELEASE_TAG}.apk" \
            --file "output/releases/patient/vh-health-patient-${RELEASE_TAG}.aab"

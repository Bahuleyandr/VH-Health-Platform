name: Release Staff App

on:
  push:
    tags: ['staff-v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Staff release tag, for example staff-v1.2.3'
        required: true

permissions:
  contents: write

concurrency:
  group: release-staff-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
      VH_BASE_URL: ${{ vars.VH_BASE_URL }}
      VH_API_KEY: ${{ secrets.VH_API_KEY }}
      STAFF_CERT_PIN_HASHES: ${{ vars.STAFF_CERT_PIN_HASHES }}
      STAFF_ANDROID_KEYSTORE_BASE64: ${{ secrets.STAFF_ANDROID_KEYSTORE_BASE64 }}
      STAFF_ANDROID_KEY_ALIAS: ${{ secrets.STAFF_ANDROID_KEY_ALIAS }}
      STAFF_ANDROID_KEY_PASSWORD: ${{ secrets.STAFF_ANDROID_KEY_PASSWORD }}
      STAFF_ANDROID_STORE_PASSWORD: ${{ secrets.STAFF_ANDROID_STORE_PASSWORD }}
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: https://github.com/subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve release tag
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG_INPUT:-${GITHUB_REF_NAME}}"
          case "$tag" in
            staff-v*) ;;
            *) echo "::error::Staff releases require a staff-v* tag, got '$tag'"; exit 1 ;;
          esac
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Activate Melos
        run: dart pub global activate melos 7.5.1

      - name: Bootstrap workspace
        run: |
          dart pub get
          melos bootstrap

      - name: Validate release configuration
        run: |
          set -euo pipefail
          missing=0
          for name in \
            VH_BASE_URL \
            VH_API_KEY \
            STAFF_CERT_PIN_HASHES \
            STAFF_ANDROID_KEYSTORE_BASE64 \
            STAFF_ANDROID_KEY_ALIAS \
            STAFF_ANDROID_KEY_PASSWORD \
            STAFF_ANDROID_STORE_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is required for staff release builds"
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure Android signing
        run: |
          set -euo pipefail
          printf '%s' "$STAFF_ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/staff/android/release-keystore.jks
          cat > apps/staff/android/key.properties <<EOF
          storePassword=${STAFF_ANDROID_STORE_PASSWORD}
          keyPassword=${STAFF_ANDROID_KEY_PASSWORD}
          keyAlias=${STAFF_ANDROID_KEY_ALIAS}
          storeFile=release-keystore.jks
          EOF

      - name: Build release APK
        working-directory: apps/staff
        run: >
          flutter build apk --release
          --dart-define=VH_BASE_URL="${VH_BASE_URL}"
          --dart-define=VH_API_KEY="${VH_API_KEY}"
          --dart-define=PRODUCTION=true
          --dart-define=CERT_PIN_HASHES="${STAFF_CERT_PIN_HASHES}"

      - name: Build release AAB
        working-directory: apps/staff
        run: >
          flutter build appbundle --release
          --dart-define=VH_BASE_URL="${VH_BASE_URL}"
          --dart-define=VH_API_KEY="${VH_API_KEY}"
          --dart-define=PRODUCTION=true
          --dart-define=CERT_PIN_HASHES="${STAFF_CERT_PIN_HASHES}"

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p output/releases/staff
          cp apps/staff/build/app/outputs/flutter-apk/app-release.apk "output/releases/staff/vh-health-staff-${RELEASE_TAG}.apk"
          cp apps/staff/build/app/outputs/bundle/release/app-release.aab "output/releases/staff/vh-health-staff-${RELEASE_TAG}.aab"

      - name: Upload release artifacts
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: staff-release-artifacts
          path: output/releases/staff
          if-no-files-found: error

      - name: Publish Forgejo release assets
        run: |
          node scripts/ci/forgejo-release-assets.mjs \
            --tag "$RELEASE_TAG" \
            --name "Staff $RELEASE_TAG" \
            --body "Signed staff Android release built by Forgejo Actions from ${GITHUB_SHA}." \
            --file "output/releases/staff/vh-health-staff-${RELEASE_TAG}.apk" \
            --file "output/releases/staff/vh-health-staff-${RELEASE_TAG}.aab"

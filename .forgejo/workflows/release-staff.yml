name: Release Staff App

on:
  push:
    tags: ['staff-v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Staff release tag, for example staff-v1.2.3'
        required: true

permissions:
  contents: write

concurrency:
  group: release-staff-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
      VH_BASE_URL: ${{ vars.VH_BASE_URL }}
      VH_API_KEY: ${{ secrets.VH_API_KEY }}
      STAFF_CERT_PIN_HASHES: ${{ vars.STAFF_CERT_PIN_HASHES }}
      CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS: ${{ vars.CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS }}
      STAFF_ANDROID_KEYSTORE_BASE64: ${{ secrets.STAFF_ANDROID_KEYSTORE_BASE64 }}
      STAFF_ANDROID_KEY_ALIAS: ${{ secrets.STAFF_ANDROID_KEY_ALIAS }}
      STAFF_ANDROID_KEY_PASSWORD: ${{ secrets.STAFF_ANDROID_KEY_PASSWORD }}
      STAFF_ANDROID_STORE_PASSWORD: ${{ secrets.STAFF_ANDROID_STORE_PASSWORD }}
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      # Node runs the codegen driver below (scripts/codegen.mjs), the cert-pin
      # validator, and the Forgejo release-asset publisher. Pinned to the
      # repo-standard version rather than relying on whatever the runner ships.
      - uses: https://data.forgejo.org/actions/setup-node@v4
        with:
          node-version: '26.5.0'

      - uses: https://github.com/subosito/flutter-action@v2
        with:
          # Pinned to the workspace toolchain (_reusable-flutter-workspace.yml
          # + ci.yml + the .github release workflows) — bump all together. The
          # floating `stable` channel tracks whatever Dart ships that week, so
          # this lane could build a different Flutter than CI validated and, on
          # the release workflows, ship it.
          flutter-version: 3.44.0
          cache: true

      - name: Resolve release tag
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG_INPUT:-${GITHUB_REF_NAME}}"
          case "$tag" in
            staff-v*) ;;
            *) echo "::error::Staff releases require a staff-v* tag, got '$tag'"; exit 1 ;;
          esac
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Activate Melos
        run: dart pub global activate melos 7.5.1

      - name: Bootstrap workspace
        run: |
          dart pub get
          melos bootstrap

      # Must run AFTER bootstrap (build_runner is resolved by the workspace)
      # and BEFORE the build: the generated client lib/api/generated/** is
      # gitignored and absent on a fresh clone, yet the tracked barrel
      # lib/api/vhhealth_api.dart re-exports it and lib/services/** imports
      # generated symbols, so the app only compiles once codegen has run.
      # melos run codegen invokes `node scripts/codegen.mjs`, which needs Node
      # (set up above) and dart (from subosito/flutter-action above).
      # Kept ahead of the signing step so a codegen failure cannot burn a tag
      # after the release keystore has already been written to disk.
      - name: Codegen (regenerate Dart client from synced spec)
        run: melos run codegen

      - name: Validate release configuration
        run: |
          set -euo pipefail
          missing=0
          for name in \
            VH_BASE_URL \
            VH_API_KEY \
            STAFF_CERT_PIN_HASHES \
            CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS \
            STAFF_ANDROID_KEYSTORE_BASE64 \
            STAFF_ANDROID_KEY_ALIAS \
            STAFF_ANDROID_KEY_PASSWORD \
            STAFF_ANDROID_STORE_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is required for staff release builds"
              missing=1
            fi
          done
          node scripts/validate-cert-pin-set.mjs \
            --pins "${STAFF_CERT_PIN_HASHES}" \
            --clock-skew-seconds "${CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS}"
          exit "$missing"

      - name: Configure Android signing
        run: |
          set -euo pipefail
          printf '%s' "$STAFF_ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/staff/android/release-keystore.jks
          cat > apps/staff/android/key.properties <<EOF
          storePassword=${STAFF_ANDROID_STORE_PASSWORD}
          keyPassword=${STAFF_ANDROID_KEY_PASSWORD}
          keyAlias=${STAFF_ANDROID_KEY_ALIAS}
          storeFile=release-keystore.jks
          EOF

      - name: Build release APK
        working-directory: apps/staff
        run: >
          flutter build apk --release
          --dart-define=VH_BASE_URL="${VH_BASE_URL}"
          --dart-define=VH_API_KEY="${VH_API_KEY}"
          --dart-define=PRODUCTION=true
          --dart-define=CERT_PIN_HASHES="${STAFF_CERT_PIN_HASHES}"
          --dart-define=CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS="${CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS}"

      - name: Build release AAB
        working-directory: apps/staff
        run: >
          flutter build appbundle --release
          --dart-define=VH_BASE_URL="${VH_BASE_URL}"
          --dart-define=VH_API_KEY="${VH_API_KEY}"
          --dart-define=PRODUCTION=true
          --dart-define=CERT_PIN_HASHES="${STAFF_CERT_PIN_HASHES}"
          --dart-define=CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS="${CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS}"

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p output/releases/staff
          cp apps/staff/build/app/outputs/flutter-apk/app-release.apk "output/releases/staff/vh-health-staff-${RELEASE_TAG}.apk"
          cp apps/staff/build/app/outputs/bundle/release/app-release.aab "output/releases/staff/vh-health-staff-${RELEASE_TAG}.aab"

      - name: Upload release artifacts
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: staff-release-artifacts
          path: output/releases/staff
          if-no-files-found: error

      - name: Publish Forgejo release assets
        run: |
          node scripts/ci/forgejo-release-assets.mjs \
            --tag "$RELEASE_TAG" \
            --name "Staff $RELEASE_TAG" \
            --body "Signed staff Android release built by Forgejo Actions from ${GITHUB_SHA}." \
            --file "output/releases/staff/vh-health-staff-${RELEASE_TAG}.apk" \
            --file "output/releases/staff/vh-health-staff-${RELEASE_TAG}.aab"

name: Schema and Policy Drift

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'apps/admin/src/**'
      - 'apps/staff/lib/**'
      - 'scripts/**'
      - '.forgejo/workflows/schema-policy-drift.yml'
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'apps/admin/src/**'
      - 'apps/staff/lib/**'
      - 'scripts/**'
      - '.forgejo/workflows/schema-policy-drift.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-policy-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-schema-policy:
    name: DB schema + role policy graph
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: vhhealth
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: vhhealth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vhhealth"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://vhhealth:${{ github.run_id }}@postgres:5432/vhhealth
      API_KEY: vhhealth-local-api-key
      BACKEND_API_KEY: vhhealth-local-api-key
      JWT_SECRET: vhhealth-local-admin-smoke-secret-123456789
      FIELD_ENCRYPTION_KEY: ci-field-encryption-key-32-chars-minimum
      TOTP_ENCRYPTION_KEY: ci-totp-encryption-key-32-chars-minimum
      BACKUP_ENCRYPTION_KEY: ci-backup-encryption-key-32-chars-minimum
      REQUIRE_MFA_FOR_SUPER_ADMIN: 'false'
      VH_ALLOW_NON_TEST_DATA_SEED: 'true'
      NODE_ENV: test

    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.5.0'
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # onnxruntime-node's postinstall (script/install.js) downloads the CUDA 12
      # execution-provider .so files from api.nuget.org on linux/x64. No CI
      # runner has a GPU, the CPU runtime (libonnxruntime.so.1 +
      # onnxruntime_binding.node) is bundled in the npm tarball, and the only
      # consumer (src/services/gamification/adherenceModelServing.js) uses the
      # default CPU provider — so the download is dead weight that failed
      # `npm ci` with ETIMEDOUT to 150.171.109.77:443 on PR #1023 (run
      # 34195814839). `skip` makes install.js exit before any network call
      # (parseInstallFlag in script/install-utils.js, v1.27.0). The next step
      # asserts the skip took effect; it is not inferred from a green install.
      # Mirrors the guard PR #1045 put on every .github backend `npm ci`.
      - name: Install backend dependencies
        working-directory: apps/backend
        run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip

      - name: Verify onnxruntime-node postinstall skipped the CUDA download
        working-directory: apps/backend
        run: |
          ort=node_modules/onnxruntime-node/bin/napi-v6/linux/x64
          for f in libonnxruntime_providers_cuda.so libonnxruntime_providers_shared.so libonnxruntime_providers_tensorrt.so; do
            if [ -e "$ort/$f" ]; then
              echo "::error::$ort/$f is present — the NuGet download ran despite ONNXRUNTIME_NODE_INSTALL=skip"
              exit 1
            fi
          done
          for f in libonnxruntime.so.1 onnxruntime_binding.node; do
            if [ ! -e "$ort/$f" ]; then
              echo "::error::$ort/$f is missing — the bundled CPU runtime did not install"
              exit 1
            fi
          done
          node --input-type=module -e "const ort = await import('onnxruntime-node'); if (typeof ort.InferenceSession?.create !== 'function') throw new Error('onnxruntime-node imported but InferenceSession.create is missing');"
          echo "onnxruntime-node: CUDA provider download skipped; bundled CPU runtime present and importable"

      - name: Apply migrations and schema guardrails
        working-directory: apps/backend
        run: |
          npx prisma generate
          npm run db:ensure-pgvector
          node scripts/ci-setup-db.mjs
          node scripts/check-schema-drift.mjs
          node scripts/ci-schema-drift.mjs
          node scripts/check-openapi-drift.mjs
          node scripts/scan-code-drift.mjs
          npm run check:phi-tenant-id

      - name: Role policy drift guard tests
        working-directory: apps/backend
        run: >
          npm run test:suite --
          src/tests/unit/rolePolicyGraph.test.js
          src/tests/unit/organizationHierarchyService.test.js
          src/tests/unit/roleRegistryEndpoint.test.js
          src/tests/unit/staffAccessDecisionService.test.js
          src/tests/unit/patientAccessGuard.test.js

      - name: Emit policy version/hash
        run: |
          node --input-type=module - <<'NODE'
          import { getRolePolicyHash, getRolePolicyVersion } from './apps/backend/src/config/rolePolicyGraph.js';
          console.log(`policy_version=${getRolePolicyVersion()}`);
          console.log(`policy_hash=${getRolePolicyHash()}`);
          NODE

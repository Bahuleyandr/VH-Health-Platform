name: Secret Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-account-secret-scan:
    name: Service account, gitleaks, GitGuardian
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GGSHIELD_VERSION: 1.49.0
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
      VH_CI_CACHE_DIR: /cache/vh-health-platform
      GITLEAKS_CACHE_DIR: /cache/vh-health-platform/gitleaks

    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: https://data.forgejo.org/actions/setup-node@v4
        with:
          node-version: '26.5.0'

      - name: Prepare persistent scanner cache
        run: |
          mkdir -p "$VH_CI_CACHE_DIR" "$GITLEAKS_CACHE_DIR"

      - name: Install ggshield
        if: env.GITGUARDIAN_API_KEY != ''
        run: |
          python -m pip install --user "ggshield==${GGSHIELD_VERSION}"
          "$HOME/.local/bin/ggshield" --version

      - name: Scan for service account private keys
        run: node scripts/scan-secrets.mjs

      - name: Gitleaks working tree scan
        run: node scripts/ci/run.mjs --install --only=security

      - name: GitGuardian working tree scan
        if: env.GITGUARDIAN_API_KEY != ''
        run: GGSHIELD_BIN="$HOME/.local/bin/ggshield" node scripts/ggshield-scan.mjs worktree

      - name: GitGuardian commit range scan
        if: env.GITGUARDIAN_API_KEY != ''
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: GGSHIELD_BIN="$HOME/.local/bin/ggshield" node scripts/ggshield-scan.mjs range

      - name: GitGuardian scan skipped
        if: env.GITGUARDIAN_API_KEY == ''
        run: echo "GITGUARDIAN_API_KEY is not configured; skipping ggshield scan."

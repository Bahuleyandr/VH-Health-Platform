name: Security Sweep

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '15 2 * * 2'
      timezone: Asia/Kolkata
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-sweep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Secrets, dependencies, Semgrep, Trivy
    runs-on: docker-builder
    timeout-minutes: 45
    env:
      VH_CI_CACHE_DIR: /cache/vh-health-platform
      GITLEAKS_CACHE_DIR: /cache/vh-health-platform/gitleaks
      npm_config_cache: /cache/vh-health-platform/npm
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: https://data.forgejo.org/actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/backend/package-lock.json
            apps/admin/package-lock.json

      - name: Run blocking repo-owned secret checks
        run: node scripts/ci/run.mjs --install --only=security

      - name: npm audit backend/admin
        run: |
          npm --prefix apps/backend audit --audit-level=high
          npm --prefix apps/admin audit --audit-level=high

      - name: Prepare security output
        run: mkdir -p output/security

      # Audit finding M15: scanner image pinned by DIGEST (was `:latest` —
      # mutable). OSV remains advisory pending triage of the existing
      # backlog; npm audit above is the blocking dependency gate.
      - name: OSV lockfile scan
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            ghcr.io/google/osv-scanner:v2.0.2@sha256:385ff9dd9d50a573766fc226f24da1d61cd5843542ff7e04c563561bbd918e30 \
            --lockfile=/src/apps/backend/package-lock.json \
            --lockfile=/src/apps/admin/package-lock.json \
            --lockfile=/src/pubspec.lock \
            --format=json \
            --output=/src/output/security/osv-lockfiles.json

      # Semgrep stays advisory here; Phase-3 of the 2026-06-10 remediation
      # plan flips it to blocking after the initial finding backlog is
      # triaged (docs/PLATFORM_REMEDIATION_PLAN.md).
      - name: Semgrep healthcare/web baseline
        continue-on-error: true
        run: |
          python -m pip install --user semgrep
          "$HOME/.local/bin/semgrep" scan \
            --config p/owasp-top-ten \
            --config p/secrets \
            --config p/javascript \
            --config p/typescript \
            --sarif \
            --output output/security/semgrep.sarif

      # Audit finding M15: BLOCKING on the merge path (was continue-on-error)
      # for CRITICAL/HIGH vulns + leaked secrets, and the scanner image is
      # pinned by digest (was a mutable version tag).
      - name: Trivy filesystem scan (blocking on CRITICAL/HIGH + secrets)
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e fs \
            --scanners vuln,secret,config \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            --format sarif \
            --output /work/output/security/trivy-fs.sarif \
            /work

      - name: Upload security reports
        if: always()
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: security-sweep
          path: output/security
          if-no-files-found: ignore

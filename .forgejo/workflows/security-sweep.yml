name: Security Sweep

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '15 2 * * 2'
      timezone: Asia/Kolkata
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-sweep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Secrets, dependencies, Semgrep, Trivy
    runs-on: docker-builder
    timeout-minutes: 45
    env:
      VH_CI_CACHE_DIR: /cache/vh-health-platform
      GITLEAKS_CACHE_DIR: /cache/vh-health-platform/gitleaks
      npm_config_cache: /cache/vh-health-platform/npm
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: https://data.forgejo.org/actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/backend/package-lock.json
            apps/admin/package-lock.json

      - name: Run blocking repo-owned secret checks
        run: node scripts/ci/run.mjs --install --only=security

      - name: npm audit backend/admin
        run: |
          npm --prefix apps/backend audit --audit-level=high
          npm --prefix apps/admin audit --audit-level=high

      - name: Prepare security output
        run: mkdir -p output/security

      # OSV remains advisory pending triage of the existing backlog; npm audit
      # above is the blocking dependency gate.
      - name: OSV lockfile scan
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p /tmp/vh-security-tools output/security
          curl -sSfL \
            https://github.com/google/osv-scanner/releases/download/v2.0.2/osv-scanner_linux_amd64 \
            -o /tmp/vh-security-tools/osv-scanner_linux_amd64
          curl -sSfL \
            https://github.com/google/osv-scanner/releases/download/v2.0.2/osv-scanner_SHA256SUMS \
            -o /tmp/vh-security-tools/osv-scanner_SHA256SUMS
          (
            cd /tmp/vh-security-tools
            grep 'osv-scanner_linux_amd64$' osv-scanner_SHA256SUMS | sha256sum -c -
          )
          mv /tmp/vh-security-tools/osv-scanner_linux_amd64 /tmp/vh-security-tools/osv-scanner
          chmod 0755 /tmp/vh-security-tools/osv-scanner
          /tmp/vh-security-tools/osv-scanner \
            --lockfile=apps/backend/package-lock.json \
            --lockfile=apps/admin/package-lock.json \
            --lockfile=pubspec.lock \
            --format=json \
            --output=output/security/osv-lockfiles.json

      # Semgrep stays advisory here; Phase-3 of the 2026-06-10 remediation
      # plan flips it to blocking after the initial finding backlog is
      # triaged (docs/PLATFORM_REMEDIATION_PLAN.md).
      - name: Semgrep healthcare/web baseline
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 -m venv /tmp/vh-semgrep-venv
          /tmp/vh-semgrep-venv/bin/python -m pip install --quiet --upgrade pip
          /tmp/vh-semgrep-venv/bin/python -m pip install --quiet semgrep
          /tmp/vh-semgrep-venv/bin/semgrep scan \
            --config p/owasp-top-ten \
            --config p/secrets \
            --config p/javascript \
            --config p/typescript \
            --sarif \
            --output output/security/semgrep.sarif

      # Audit finding M15: BLOCKING on the merge path for CRITICAL/HIGH vulns
      # and leaked secrets. Misconfiguration reporting stays advisory below
      # while the existing config backlog is triaged.
      - name: Trivy filesystem scan (blocking on CRITICAL/HIGH + secrets)
        run: |
          set -euo pipefail
          mkdir -p /tmp/vh-security-tools output/security
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.70.0/contrib/install.sh \
            | sh -s -- -b /tmp/vh-security-tools v0.70.0
          /tmp/vh-security-tools/trivy fs \
            --scanners vuln,secret \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            --timeout 15m \
            --skip-version-check \
            --skip-dirs output \
            --skip-dirs apps/backend/src/logs \
            --skip-dirs apps/patient/build \
            --skip-dirs apps/staff/build \
            --skip-dirs apps/admin/.next \
            --skip-dirs apps/admin/node_modules \
            --skip-dirs apps/backend/node_modules \
            --skip-dirs infra/mcp/vh-mcp-postgres/node_modules \
            --skip-dirs infra/onprem/vh-checks/node_modules \
            --format sarif \
            --output output/security/trivy-fs.sarif \
            .

      - name: Trivy misconfiguration scan (advisory)
        continue-on-error: true
        run: |
          set -euo pipefail
          /tmp/vh-security-tools/trivy fs \
            --scanners misconfig \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 0 \
            --timeout 10m \
            --skip-version-check \
            --skip-dirs output \
            --skip-dirs apps/backend/src/logs \
            --skip-dirs apps/patient/build \
            --skip-dirs apps/staff/build \
            --skip-dirs apps/admin/.next \
            --skip-dirs apps/admin/node_modules \
            --skip-dirs apps/backend/node_modules \
            --skip-dirs infra/mcp/vh-mcp-postgres/node_modules \
            --skip-dirs infra/onprem/vh-checks/node_modules \
            --format sarif \
            --output output/security/trivy-misconfig.sarif \
            .

      - name: Upload security reports
        if: always()
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: security-sweep
          path: output/security
          if-no-files-found: ignore

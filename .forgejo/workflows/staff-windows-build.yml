name: Staff Windows Build

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Staff API base URL baked into the build'
        required: false
        default: 'https://api.vhhealth.app/api/v1'
      sentry_environment:
        description: 'Sentry environment label'
        required: false
        default: 'trial-windows'

permissions:
  contents: read

concurrency:
  group: staff-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-readiness:
    name: Windows runner readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAFF_API_KEY: ${{ secrets.VH_API_KEY }}
      SENTRY_DSN_STAFF: ${{ secrets.SENTRY_DSN_STAFF }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: https://data.forgejo.org/actions/setup-node@v4
        with:
          node-version: '26.5.0'

      - name: Record Windows build readiness
        run: |
          mkdir -p output/staff-windows-build
          cat > output/staff-windows-build/README.md <<'EOF'
          # Staff Windows Build Readiness

          Forgejo does not currently have an online Windows runner for this
          repository. Flutter Windows desktop builds must run on Windows, so
          this workflow records readiness instead of queueing forever on a
          missing `windows-latest` label.

          Current manual/local build path:

          ```powershell
          $env:VH_API_KEY = "<redacted>"
          $env:VH_SENTRY_DSN = "<redacted>"
          .\scripts\build-staff-windows-update.ps1 `
            -BaseUrl "${{ inputs.api_base_url }}" `
            -SentryEnvironment "${{ inputs.sentry_environment }}"
          ```

          To enable Forgejo-hosted Windows artifacts, register a self-hosted
          Windows runner for this repo and then change this workflow's
          `runs-on` label to that runner label.
          EOF

      - name: Show local build command
        run: |
          cat output/staff-windows-build/README.md

      - name: Upload readiness artifact
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: staff-windows-build-readiness-${{ github.sha }}
          path: output/staff-windows-build
          if-no-files-found: error

name: Staff Windows Build

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Staff API base URL baked into the build'
        required: false
        default: 'https://api.vhhealth.app/api/v1'
      sentry_environment:
        description: 'Sentry environment label'
        required: false
        default: 'trial-windows'

permissions:
  contents: read

concurrency:
  group: staff-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-release:
    name: Flutter Windows release
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      STAFF_API_KEY: ${{ secrets.VH_API_KEY }}
      SENTRY_DSN_STAFF: ${{ secrets.SENTRY_DSN_STAFF }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: https://data.forgejo.org/actions/setup-node@v4
        with:
          node-version: 22

      - uses: https://github.com/subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap Flutter workspace
        shell: pwsh
        run: |
          dart pub get
          dart run melos bootstrap

      - name: Build Staff Windows release
        working-directory: apps/staff
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release `
            --dart-define=VH_BASE_URL="${{ inputs.api_base_url }}" `
            --dart-define=VH_API_KEY="$env:STAFF_API_KEY" `
            --dart-define=APP_NAME="VH Health Staff" `
            --dart-define=SENTRY_DSN="$env:SENTRY_DSN_STAFF" `
            --dart-define=SENTRY_ENVIRONMENT="${{ inputs.sentry_environment }}" `
            --dart-define=SENTRY_RELEASE="$env:GITHUB_SHA"

      - name: Upload Staff Windows artifact
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: vhhealth-staff-windows-${{ github.sha }}
          path: apps/staff/build/windows/x64/runner/Release
          if-no-files-found: error


name: Trial Readiness Smoke

on:
  workflow_dispatch:
    inputs:
      include_creates:
        description: 'Run create-flow smoke checks'
        required: false
        default: 'true'
      fail_on_failure:
        description: 'Fail workflow on required smoke failures'
        required: false
        default: 'true'

permissions:
  contents: read

concurrency:
  group: trial-readiness-smoke
  cancel-in-progress: false

jobs:
  staff-role-workflows:
    name: Staff role workflow sweep
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VH_BASE_URL: ${{ secrets.VH_STAFF_SMOKE_BASE_URL }}
      VH_API_KEY: ${{ secrets.VH_API_KEY }}
      VH_STAFF_TEST_PASSWORD: ${{ secrets.VH_STAFF_TEST_PASSWORD }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare trial readiness output
        run: mkdir -p output/trial-readiness

      - name: Run deployed staff role workflow smoke
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VH_BASE_URL)) {
            $env:VH_BASE_URL = "https://api.vhhealth.app/api/v1"
          }
          if ([string]::IsNullOrWhiteSpace($env:VH_API_KEY) -or [string]::IsNullOrWhiteSpace($env:VH_STAFF_TEST_PASSWORD)) {
            "VH_API_KEY or VH_STAFF_TEST_PASSWORD is missing; staff role workflow smoke skipped." |
              Out-File -FilePath output/trial-readiness/TRIAL_KNOWN_ISSUES.md -Encoding utf8
            exit 0
          }
          $includeCreates = "${{ inputs.include_creates }}" -eq "true"
          $failOnFailure = "${{ inputs.fail_on_failure }}" -eq "true"
          $args = @(
            "-BaseUrl", $env:VH_BASE_URL,
            "-ApiKey", $env:VH_API_KEY,
            "-StaffPassword", $env:VH_STAFF_TEST_PASSWORD,
            "-ReportPath", "output/trial-readiness/STAFF_ROLE_WORKFLOW_SWEEP.md",
            "-FailOnFailure", $failOnFailure
          )
          if ($includeCreates) { $args += "-IncludeCreates" }
          ./scripts/smoke-staff-role-workflows.ps1 @args

      - name: Write known issues note
        if: always()
        shell: pwsh
        run: |
          $path = "output/trial-readiness/TRIAL_KNOWN_ISSUES.md"
          if (-not (Test-Path $path)) {
            @(
              "# Trial Known Issues",
              "",
              "Generated by Forgejo trial-readiness-smoke for commit $env:GITHUB_SHA.",
              "",
              "- No blocking issue was recorded by this workflow. Manual hospital dry-run signoff is still required before production use."
            ) | Out-File -FilePath $path -Encoding utf8
          }

      - name: Upload trial readiness evidence
        if: always()
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: trial-readiness-smoke
          path: output/trial-readiness
          if-no-files-found: ignore


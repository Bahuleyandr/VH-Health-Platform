name: Reusable Admin CI

on:
  workflow_call:
    inputs:
      notify_on_failure:
        description: Send a Discord notification if the workflow fails.
        required: false
        type: boolean
        default: false
      notification_label:
        description: Label to use in the Discord failure message.
        required: false
        type: string
        default: Admin Portal CI
    secrets:
      DISCORD_WEBHOOK_URL:
        required: false

permissions:
  contents: read

jobs:
  lint-typecheck-build:
    name: Admin lint + type-check + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/admin

    env:
      NEXT_PUBLIC_API_URL: http://localhost:5000
      NEXT_PUBLIC_APP_NAME: VHHealth Admin
      NEXT_PUBLIC_APP_ORIGIN: http://localhost:3000
      # SEC-8: the admin proxy refuses to build in production without an explicit
      # CSRF origin allowlist. CI only needs a valid value to compile (this image
      # is never deployed); prod bakes the real origin via release-images.yml.
      NEXT_PUBLIC_ALLOWED_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_WS_URL: ws://localhost:5000
      # The backend key is server-only and must NEVER be NEXT_PUBLIC_* (Next.js
      # would inline it into the client bundle). check:no-public-secrets enforces
      # this. The build does not need a real value to compile.
      BACKEND_API_KEY: test-api-key

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "26.5.0"
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: apps/admin
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: apps/admin/node_modules

      - run: npm run lint

      - name: PR merge-base formatting ratchet
        env:
          ADMIN_FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || format('origin/{0}', github.event.repository.default_branch) }}
        run: npm run format:check

      - name: Verify retired PWA output stays absent
        run: npm run check:pwa-retirement

      - name: Advisory dead-code report
        run: npm run check:dead-code

      - name: OpenAPI types codegen smoke (spec stays generatable)
        run: npm run generate:types

      - name: Guard against client-inlinable secrets (NEXT_PUBLIC_*KEY/SECRET)
        run: npm run check:no-public-secrets

      - run: npm run type-check

      - name: Protected-surface Jest coverage
        run: npm run test:coverage

      - name: Admin CI contract fixtures
        run: npm run test:ci-contracts

      - run: npm run build

      - run: npm run check:clinical-ai-bundle

      - name: Notify Discord on failure
        if: failure() && inputs.notify_on_failure
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not configured — skipping notification."
            exit 0
          fi
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"🔴 **${{ inputs.notification_label }} failed** on \`${{ github.ref_name }}\`\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK_URL" || true

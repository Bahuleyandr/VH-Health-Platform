name: Reusable Backend FHIR Conformance

on:
  workflow_call:
    inputs:
      notify_on_failure:
        description: Send a Discord notification if the workflow fails.
        required: false
        type: boolean
        default: false
      notification_label:
        description: Label to use in the Discord failure message.
        required: false
        type: string
        default: Backend FHIR conformance
    secrets:
      DISCORD_WEBHOOK_URL:
        required: false

permissions:
  contents: read

jobs:
  fhir-conformance:
    name: Backend FHIR conformance
    runs-on: ubuntu-latest
    # continue-on-error removed (WS3 B3.4 CI-1): golden-bundle failures now
    # fail the workflow. The job itself uses exit 1 on strict violations;
    # informational samples still use || true inline.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up JDK 17 (validator requires Java)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Cache validator JAR
        id: cache-validator
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/fhir-validator
          key: fhir-validator-6.3.11

      - name: Download validator JAR
        if: steps.cache-validator.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/fhir-validator
          curl -L -o ~/.cache/fhir-validator/validator_cli.jar \
            https://github.com/hapifhir/org.hl7.fhir.core/releases/download/6.3.11/validator_cli.jar

      - name: Validate sample bundles (R4)
        run: |
          if [ ! -d src/services/fhir/__samples__ ]; then
            echo "No __samples__/ directory — skipping conformance run."
            exit 0
          fi
          set -e
          shopt -s nullglob
          for f in src/services/fhir/__samples__/*.json; do
            echo "=== Validating (informational) $f ==="
            java -jar ~/.cache/fhir-validator/validator_cli.jar "$f" -version 4.0.1 -tx n/a || true
          done

      - name: Validate golden bundles strict (R4)
        # golden/ is a REQUIRED gate: a missing or empty directory fails the
        # job. Restore the fixtures rather than deleting them — an absent
        # directory previously made this step exit 0 and the gate was
        # permanently green (R9 audit, fixed 2026-08-10).
        run: |
          if [ ! -d src/services/fhir/__samples__/golden ]; then
            echo "✗ src/services/fhir/__samples__/golden/ is missing — golden fixtures are a required gate. Restore them."
            exit 1
          fi
          shopt -s nullglob
          failed=0
          count=0
          for f in src/services/fhir/__samples__/golden/*.json; do
            count=$((count + 1))
            echo "=== Validating (STRICT) $f ==="
            if ! java -jar ~/.cache/fhir-validator/validator_cli.jar "$f" -version 4.0.1 -tx n/a; then
              failed=$((failed + 1))
            fi
          done
          if [ "$count" -eq 0 ]; then
            echo "✗ src/services/fhir/__samples__/golden/ contains no .json fixtures — golden fixtures are a required gate. Restore them."
            exit 1
          fi
          if [ "$failed" -gt 0 ]; then
            echo "✗ $failed golden bundle(s) failed FHIR R4 validation."
            exit 1
          fi
          echo "✓ All $count golden bundles validated clean."

      - name: Notify Discord on failure
        if: failure() && inputs.notify_on_failure
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not configured — skipping notification."
            exit 0
          fi
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"🔴 **${{ inputs.notification_label }} failed** on \`${{ github.ref_name }}\`\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK_URL" || true

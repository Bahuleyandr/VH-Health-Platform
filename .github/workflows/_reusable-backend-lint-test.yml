name: Reusable Backend Lint and Test

# Split (2026-07-17): the single lint-and-test job outgrew its wall-clock cap
# twice (#595/#599 cancelled at 45m; 46m1s against the raised 60m cap on
# #604's run) because the full chunked jest suite ran in ONE job and grows
# with every merged suite. Now: `static-checks` carries every non-test gate
# (~15m), and `test` fans the chunked suite across a shard matrix via
# JEST_CI_SHARD (deterministic interleave; math pinned by
# apps/backend/src/tests/unit/jestShardPartition.test.js). Each shard runs
# its slice of the chunks after its own DB setup — far from any timeout.
# To scale, edit ONLY the `shard:` list below: the divisor is derived from
# strategy.job-total (the matrix size), so shard count and divisor cannot
# drift apart. Callers are unaffected: a caller-side `needs: lint-and-test`
# waits for every job in this file.

on:
  workflow_call:
    inputs:
      notify_on_failure:
        description: Send a Discord notification if the workflow fails.
        required: false
        type: boolean
        default: false
      notification_label:
        description: Label to use in the Discord failure message.
        required: false
        type: string
        default: Backend CI
      # Prod parity (2026-08-18): production CNPG pins PostgreSQL 17.10
      # (infra/kubernetes/base/cnpg/cluster.yaml), so the default CI service
      # image is pg17 — CI previously ran pg18 and a real SQLSTATE-class
      # behavioral difference (23001 vs 23503 on ON DELETE RESTRICT) bit
      # during #878. The PG18 cutover is a held, operator-gated ladder
      # (docs/CNPG_POSTGRES_18_QUALIFICATION.md); until it lands, only the
      # non-required pg18-canary.yml dispatch overrides this input.
      postgres_image:
        description: Postgres service container image for DB-backed jobs.
        required: false
        type: string
        default: pgvector/pgvector:pg17
    secrets:
      DISCORD_WEBHOOK_URL:
        required: false

permissions:
  contents: read

env:
  API_KEY: test-api-key
  JWT_SECRET: test-jwt-secret-for-ci-must-be-at-least-32-chars
  NODE_ENV: test
  VH_ALLOW_NON_TEST_DATA_SEED: 'true'
  # Mandatory at-rest encryption keys (validateEnv requires them, min 32
  # chars). The jest harness pins these in-process via jest.setup.cjs, but
  # the OpenAPI drift step boots the app fresh through generate-openapi.mjs,
  # so they must be present at the job env too or validateEnv aborts the
  # spec regeneration. CI-only dummies — same values as smoke-e2e.yml.
  FIELD_ENCRYPTION_KEY: ci-field-encryption-key-32-chars-minimum
  TOTP_ENCRYPTION_KEY: ci-totp-encryption-key-32-chars-minimum
  BACKUP_ENCRYPTION_KEY: ci-backup-encryption-key-32-chars-minimum

jobs:
  prepare-prisma:
    name: Prepare generated Prisma client
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:1/prisma_generate_only

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.5.0'
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - run: npm ci

      - name: Restore generated Prisma client
        id: prisma-client
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: apps/backend/node_modules/.prisma
          key: prisma-client-${{ runner.os }}-node-26-${{ hashFiles('apps/backend/package-lock.json', 'apps/backend/prisma/schema.prisma') }}

      - name: Generate Prisma client on cache miss
        if: steps.prisma-client.outputs.cache-hit != 'true'
        run: npx prisma generate

      - name: Verify generated Prisma client
        run: node --input-type=module -e "const client = await import('@prisma/client'); if (typeof client.PrismaClient !== 'function') throw new Error('PrismaClient export missing');"

  static-checks:
    name: Backend lint + static checks
    needs: prepare-prisma
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/backend

    services:
      postgres:
        image: ${{ inputs.postgres_image }}
        env:
          POSTGRES_USER: vhhealth
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: vhhealth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vhhealth"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://vhhealth:${{ github.run_id }}@localhost:5432/vhhealth
      # Deep suites historically guarded on TEST_DATABASE_URL alone; the corpus
      # convention is `TEST_DATABASE_URL || DATABASE_URL`, but export both here
      # (mirroring _reusable-backend-quick.yml) so no suite can silently skip
      # in the canonical gate on a single-form guard.
      TEST_DATABASE_URL: postgresql://vhhealth:${{ github.run_id }}@localhost:5432/vhhealth
      # Skip-floor enforcement (HIGH-3 follow-up): with the full DB env
      # provisioned, any skipped test not declared in
      # apps/backend/scripts/jest-skip-floor.json fails the run
      # (scripts/jest-skip-floor-reporter.cjs) — silent env-guard skips can
      # never pass green in the gate again.
      JEST_ENFORCE_SKIP_FLOOR: '1'

    steps:
      # fetch-depth: 0 — the applied-migration immutability guard below resolves
      # a merge-base against main. On the default shallow checkout it fails
      # closed by design (a guard that silently skips reads as coverage it is
      # not providing), so this job needs the history. _reusable-backend-quick
      # and ci.yml's plan and security jobs already check out this way.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.5.0'
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - run: npm ci

      # PR #878: npm 11.14.1 regenerated package-lock.json and silently stripped
      # `"libc"` from all 26 platform-specific optional packages (@img/sharp-*,
      # @unrs/resolver-binding-*). The prod image is node:26.5.0-alpine (musl)
      # and apps/backend/Dockerfile runs `npm ci`, so without `libc` a musl
      # install also pulls glibc binaries into the image — and NO job here could
      # see it, because these runners are ubuntu-latest (glibc) and the Alpine
      # image is built post-merge by release-images.yml. Its own step rather
      # than a link in the `npm run lint` && chain: it is a lockfile-integrity
      # gate, not a source-lint one, and an earlier lint failure must not mask
      # it. Costs milliseconds — a JSON parse.
      - name: Lockfile libc guard (musl/glibc platform constraints intact)
        run: npm run check:lockfile-libc

      # Second layer behind the UTC session pin in src/lib/prisma.js. A
      # timestamptz read back through the pg driver is materialised in the
      # DATABASE SESSION timezone, so comparing one against the process clock is
      # only correct on a UTC session — two such sites shipped FAIL-OPEN. CI runs
      # a UTC database, so a relapse is behaviourally invisible here and only the
      # source shape can be checked. Its own step rather than a link in the
      # `npm run lint` && chain, so a lint failure cannot mask it.
      - name: Timestamptz clock-comparison guard (no driver Date vs process clock)
        run: npm run check:timestamptz-clock

      # Duplicate migration numbers (once-over 2026-08-23): five collisions had
      # already accumulated from concurrent PR trains while this guard existed
      # ONLY in apps/backend's local `npm run ci` chain, which no workflow here
      # invokes — so nothing could fail a merge gate on a sixth. Mirrored into
      # the affected gate (_reusable-backend-quick.yml) too, because a migration
      # lands on an ordinary feature push and the full tier only runs behind the
      # `[full-ci]` marker. Its own step, not a link in the `npm run lint` &&
      # chain: a lint failure must not mask it. Costs milliseconds — a readdir.
      - name: Migration number collision guard (no duplicate numeric prefixes)
        run: npm run check:migration-numbers

      # Applied-migration immutability. An in-place edit to a migration that
      # already ran passes every gate here — CI databases are fresh, so their
      # `_migrations` rows seed from whatever bytes are on disk and the runtime
      # checksum can never disagree. It only detonates on a long-lived database
      # (566 / 03db4c44f, dalekdefender run 33480653253). The evidence exists at
      # PR time only in git, so this compares migration blobs against their
      # merge-base with main. The authoritative copy runs in the unconditional
      # `security` stage of ci.yml — it must not be skippable by tier routing;
      # this mirror keeps both migration checks failing in the same place.
      - name: Applied-migration immutability guard (no edits to migrations on main)
        run: npm run check:migration-immutability

      - name: Restore generated Prisma client
        id: prisma-client
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: apps/backend/node_modules/.prisma
          key: prisma-client-${{ runner.os }}-node-26-${{ hashFiles('apps/backend/package-lock.json', 'apps/backend/prisma/schema.prisma') }}

      - name: Security audit
        run: |
          npm audit --audit-level=high
          npx audit-ci --critical

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: apps/backend
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: apps/backend/node_modules

      - run: npm run lint

      - name: Lint OpenAPI with Spectral
        run: npx spectral lint src/docs/openapi.json

      # `spectral lint` above exits 0 on warnings, so on its own it cannot tell
      # a new warning from the thousands of known ones. This pins the per-rule
      # counts and fails if any of them moves. See apps/backend/.spectral.yml.
      - name: OpenAPI lint budget (no new Spectral findings)
        run: npm run openapi:lint-budget

      - name: Generate Prisma client
        if: steps.prisma-client.outputs.cache-hit != 'true'
        run: npx prisma generate

      - name: OpenAPI drift check (regenerate live-router spec + diff)
        run: node scripts/check-openapi-drift.mjs

      # The repository's canonical CI is the sole OpenAPI generation authority.
      # Preserve the exact live-router output even when the drift gate fails so
      # maintainers can commit that artifact without running the generator on a
      # workstation.
      - name: Generate canonical OpenAPI artifact
        if: always()
        run: node scripts/generate-openapi.mjs --out="${RUNNER_TEMP}/vh-health-openapi.generated.json"

      - name: Upload canonical OpenAPI artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-openapi-${{ github.run_id }}
          path: ${{ runner.temp }}/vh-health-openapi.generated.json
          retention-days: 7
          if-no-files-found: error

      - name: OpenAPI core-spec sync check (vhhealth_core copy matches canonical)
        run: node scripts/check-core-spec-sync.mjs

      # Silence the Postgres service container's per-statement/error logging
      # before any DB traffic, so the "Stop containers" post-job teardown does
      # not flood the job log. GitHub `services:` cannot override the container
      # command, so settings are pushed via ALTER SYSTEM + reload (see the test
      # job for the full rationale). psql runs from the service image for parity.
      - name: Quiet Postgres logging (reduce teardown log flood)
        run: |
          docker run --rm --network host -e PGPASSWORD=${{ github.run_id }} "${{ inputs.postgres_image }}" \
            psql -h 127.0.0.1 -p 5432 -U vhhealth -d vhhealth -v ON_ERROR_STOP=1 \
              -c "ALTER SYSTEM SET log_statement='none';" \
              -c "ALTER SYSTEM SET log_min_messages='fatal';" \
              -c "ALTER SYSTEM SET log_min_error_statement='fatal';" \
              -c "ALTER SYSTEM SET log_min_duration_statement=-1;" \
              -c "SELECT pg_reload_conf();"

      - name: Enable pgvector extension
        run: npm run db:ensure-pgvector

      # Raw SQL migrations are the canonical source of truth for the DB
      # schema. `src/migrations/000_baseline.sql` bootstraps the public
      # schema (pg_dump of a clean QA DB); 001+ apply the deltas. The
      # previous `prisma db push --accept-data-loss` step was removed
      # because the post-migration DB contains features (GENERATED
      # columns, column-reference DEFAULTs, sequence-referencing
      # defaults) that Prisma cannot recreate declaratively — so push
      # would fail against the committed schema.prisma.
      - name: Apply raw migrations + seed lookup data
        run: node scripts/ci-setup-db.mjs

      # `check-schema-drift.mjs` runs `prisma db pull` against the fully
      # migrated DB and diffs the result against `prisma/schema.prisma`.
      # With raw migrations now canonical, drift fires when a migration
      # changes the DB but the committed schema.prisma was not
      # regenerated — exactly the bug the previous CI ordering was
      # missing for the 40+ tables Prisma never modelled.
      - name: Schema drift check (column-level via prisma db pull)
        run: node scripts/check-schema-drift.mjs

      # The static half of the inline CHECK census runs in the security stage;
      # this is its calibration against the migrated database: every pinned
      # census entry's `enforced` flag must match pg_constraint in both
      # directions, so the static classifier is checked against reality rather
      # than trusted. The drift check above cannot see CHECK constraints at all.
      - name: Inline CHECK census calibration (pg_constraint vs pinned census)
        run: node ../../scripts/ci/check-inline-check-census.mjs --verify-db

      - name: DB contract check
        run: npm run db:contracts

      - name: Seed comprehensive test data
        run: npm run seed:test-data

      # Renamed from "Seeded DB coverage check" — this checks DB-contract
      # seed coverage, not code coverage. The code-coverage gate is the next
      # step.
      - name: Seeded DB contract check
        run: npm run db:contracts:seeded

      # Enforces the per-file jest coverageThreshold (package.json) via the
      # curated deterministic suite list in scripts/run-coverage-jest.mjs.
      # The config existed since B3.2 but nothing ever invoked it — this step
      # is what makes the thresholds real (R9 audit, wired 2026-08-10).
      - name: Code coverage gate (B3.2 per-file thresholds)
        run: npm run test:coverage

      - name: Schema drift check (table allowlist)
        run: node scripts/ci-schema-drift.mjs

      - name: Notify Discord on failure
        if: failure() && inputs.notify_on_failure
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not configured — skipping notification."
            exit 0
          fi
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"🔴 **${{ inputs.notification_label }} static checks failed** on \`${{ github.ref_name }}\`\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK_URL" || true

  test:
    name: Backend tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: prepare-prisma
    runs-on: ubuntu-latest
    # Prisma generation can consume more than 20 minutes on hosted runners
    # before the approximately 15-minute test shard starts.
    timeout-minutes: 60
    strategy:
      # One shard's failure must not cancel the others — every run reports
      # each shard's real result.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: apps/backend

    services:
      postgres:
        image: ${{ inputs.postgres_image }}
        env:
          POSTGRES_USER: vhhealth
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: vhhealth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vhhealth"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://vhhealth:${{ github.run_id }}@localhost:5432/vhhealth
      # Same rationale as static-checks: deep-suite guards must never skip in
      # the canonical gate because only one of the two DB env names was set.
      TEST_DATABASE_URL: postgresql://vhhealth:${{ github.run_id }}@localhost:5432/vhhealth
      # Skip-floor enforcement (HIGH-3 follow-up) — see static-checks.
      JEST_ENFORCE_SKIP_FLOOR: '1'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.5.0'
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - run: npm ci

      - name: Restore generated Prisma client
        id: prisma-client
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: apps/backend/node_modules/.prisma
          key: prisma-client-${{ runner.os }}-node-26-${{ hashFiles('apps/backend/package-lock.json', 'apps/backend/prisma/schema.prisma') }}

      - name: Generate Prisma client
        if: steps.prisma-client.outputs.cache-hit != 'true'
        run: npx prisma generate

      # Silence the Postgres service container's per-statement/error logging
      # BEFORE any migration/seed/test traffic. The GitHub `services:` syntax
      # cannot override the container command (no `-c` server flags), so instead
      # push the settings via ALTER SYSTEM + a config reload the moment the DB is
      # healthy. Without this, the "Stop containers" post-job step dumps
      # thousands of statement/error log lines into the job log AFTER the jest
      # output, and the job-log API only serves the last ~5000 lines — burying a
      # failing shard's FAIL/assertion lines beyond recovery. psql is run from
      # the service image for client/server parity (same pattern as pg_dump/
      # pg_restore below).
      - name: Quiet Postgres logging (reduce teardown log flood)
        run: |
          docker run --rm --network host -e PGPASSWORD=${{ github.run_id }} "${{ inputs.postgres_image }}" \
            psql -h 127.0.0.1 -p 5432 -U vhhealth -d vhhealth -v ON_ERROR_STOP=1 \
              -c "ALTER SYSTEM SET log_statement='none';" \
              -c "ALTER SYSTEM SET log_min_messages='fatal';" \
              -c "ALTER SYSTEM SET log_min_error_statement='fatal';" \
              -c "ALTER SYSTEM SET log_min_duration_statement=-1;" \
              -c "SELECT pg_reload_conf();"

      - name: Enable pgvector extension
        run: npm run db:ensure-pgvector

      # Cache a MIGRATED-but-UNSEEDED template so each shard restores the schema
      # instead of replaying the whole migration chain. Keyed on the migrations,
      # applier/helper roots, runtime dependencies, and database/runtime versions
      # so any execution-semantic change is a cache miss (fresh apply).
      # Seeds are NEVER cached — they use NOW() and date-relative tests exist —
      # so seeding always runs fresh below. pg_dump/pg_restore run from the
      # postgres service image for client/server version parity (the runner's
      # bundled client is older than the pg17 service).
      #
      # HARDENING (poisoned-cache fix): a prior optimization saved this cache
      # from every shard in parallel on a miss, and a partial/empty dump could
      # be captured — poisoning the key so every later run got a cache HIT on a
      # zero-byte archive and died at pg_restore ("input file is too short").
      # Three defenses now:
      #   1. key bumped v1 -> v2 to abandon the poisoned entry;
      #   2. restore is split from save (actions/cache/restore is restore-only),
      #      a cache hit is VALIDATED before use, and any bad dump falls through
      #      to the fresh build path — the job never dies on a corrupt cache;
      #   3. exactly ONE shard saves, only after building a validated dump, and
      #      the dump is written atomically (temp file -> mv) so a save can
      #      never capture a half-written archive;
      #   4. key v3 hashes the applier's complete semantic dependency roots,
      #      package lock, Node runtime, and Postgres image.
      - name: Restore migrated DB template
        id: db-template
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: apps/backend/.db-template/template.dump
          key: db-template-v3-${{ runner.os }}-node-26.5.0-${{ inputs.postgres_image }}-${{ hashFiles('.github/workflows/_reusable-backend-lint-test.yml', 'apps/backend/src/migrations/**', 'apps/backend/scripts/ci-setup-db.mjs', 'apps/backend/scripts/ensure-pgvector-extension.mjs', 'apps/backend/scripts/lib/**', 'apps/backend/src/utils/migrations/**', 'apps/backend/src/logging/**', 'apps/backend/src/utils/logMasking.js', 'apps/backend/src/utils/urlRedaction.js', 'apps/backend/package.json', 'apps/backend/package-lock.json') }}

      # Self-heal: only trust a cached dump that exists, is non-trivially sized,
      # and parses as a valid custom-format archive. A failing check is demoted
      # to a miss (file removed) so the build path below rebuilds instead of the
      # restore path dying.
      - name: Validate cached DB template
        id: validate-template
        if: steps.db-template.outputs.cache-hit == 'true'
        run: |
          valid=false
          dump=.db-template/template.dump
          if [ -f "$dump" ] && [ "$(stat -c%s "$dump")" -gt 1024 ]; then
            if docker run --rm --network host -e PGPASSWORD=${{ github.run_id }} "${{ inputs.postgres_image }}" \
                pg_restore --list < "$dump" > /dev/null 2>&1; then
              valid=true
            fi
          fi
          echo "valid=$valid" >> "$GITHUB_OUTPUT"
          if [ "$valid" != "true" ]; then
            echo "::warning::Cached DB template is missing/empty/corrupt — falling through to a fresh migrated rebuild."
            rm -f "$dump"
          fi

      - name: Load template into database (valid cache hit)
        if: steps.db-template.outputs.cache-hit == 'true' && steps.validate-template.outputs.valid == 'true'
        run: |
          docker run --rm --network host -e PGPASSWORD=${{ github.run_id }} "${{ inputs.postgres_image }}" \
            pg_restore --no-owner --no-privileges --exit-on-error -h 127.0.0.1 -p 5432 -U vhhealth -d vhhealth \
            < .db-template/template.dump

      # Fresh build path: runs on a genuine cache miss OR when the cached dump
      # failed validation. Applies migrations to the live DB and dumps ATOMICALLY
      # (temp file, size-checked, then mv into place) so the artifact that a
      # cache save may later capture is always complete.
      - name: Build migrated template (cache miss or invalid cache)
        id: build-template
        if: steps.db-template.outputs.cache-hit != 'true' || steps.validate-template.outputs.valid != 'true'
        run: |
          set -o pipefail
          node scripts/ci-setup-db.mjs --skip-seeds
          mkdir -p .db-template
          tmp=.db-template/template.dump.tmp
          rm -f "$tmp"
          docker run --rm --network host -e PGPASSWORD=${{ github.run_id }} "${{ inputs.postgres_image }}" \
            pg_dump -Fc -h 127.0.0.1 -p 5432 -U vhhealth -d vhhealth > "$tmp"
          if [ ! -s "$tmp" ] || [ "$(stat -c%s "$tmp")" -le 1024 ]; then
            echo "::error::pg_dump produced an empty/short template archive — refusing to publish it."
            rm -f "$tmp"
            exit 1
          fi
          mv "$tmp" .db-template/template.dump
          echo "built=true" >> "$GITHUB_OUTPUT"

      # Single-writer save: only shard 1, only after a validated fresh build, and
      # only when the key was a genuine miss (an existing key is immutable in the
      # cache backend anyway). This eliminates the parallel-save race that
      # poisoned the key.
      - name: Save migrated DB template (single writer)
        if: matrix.shard == 1 && steps.build-template.outputs.built == 'true' && steps.db-template.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: apps/backend/.db-template/template.dump
          key: ${{ steps.db-template.outputs.cache-primary-key }}

      # Migrations now present either way (tracker-driven ci-setup-db skips them);
      # this run seeds lookup data and provisions the non-owner RLS test roles,
      # which live outside a per-database dump and must be recreated per shard.
      - name: Seed lookup data + provision RLS roles
        run: node scripts/ci-setup-db.mjs

      - name: Seed comprehensive test data
        run: npm run seed:test-data

      # T-M1: runtime-role (NOBYPASSRLS) regression for the pre-tenant webhook /
      # ABDM / bounded-sweep paths under migration 726's fail-closed RLS. Runs
      # once (shard 1) against the migrated DB; fails loudly if migration 732's
      # resolver or migration 736's parameterless owner capabilities regress.
      - name: Runtime-role webhook/ABDM RLS regression (T-M1)
        if: matrix.shard == 1
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js src/tests/deep/runtimeRoleWebhookRls.deep.test.js --runInBand --forceExit

      - name: Run tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        # Deterministic interleave over the chunked suite: every shard
        # discovers the same code-unit-sorted file list and runs the chunks
        # where (chunk-1) % job-total === shard-1. Complete/disjoint/balanced
        # properties are unit-pinned in jestShardPartition.test.js; the runner
        # refuses to combine JEST_CI_SHARD with the START/END chunk window.
        # strategy.job-total IS the matrix size, so the divisor can never
        # drift from the shard list (adversarial-review finding #1).
        env:
          JEST_CI_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        # `tee` + pipefail: the job-log API serves only the last ~5000 lines,
        # which the Postgres service-container dump fills entirely, so a
        # failing shard's jest output is unrecoverable after the fact (three
        # irreproducible shard-2/3 failures on 2026-08-14 died exactly this
        # blind). Capture the runner's stdout to a file and publish it as an
        # artifact so the FAIL lines survive; pipefail keeps jest's exit code
        # as the step verdict.
        run: |
          set -o pipefail
          npm run test:ci 2>&1 | tee /tmp/jest-shard-output.log

      # Recoverability: the tee'd log is also uploaded as an artifact below, but
      # artifact egress has been blocked before, leaving failing assertions
      # unreadable. Echo the log tail into the job log itself (which get_job_logs
      # can always read) so the real FAIL lines survive even when the artifact
      # does not. Runs before the Postgres service teardown at job end.
      - name: Dump failing jest log tail (job-log recoverable)
        if: failure()
        run: |
          echo "===== tail of /tmp/jest-shard-output.log (shard ${{ matrix.shard }}/${{ strategy.job-total }}) ====="
          tail -n 400 /tmp/jest-shard-output.log || echo "(no jest log captured — failure was before/at DB setup)"

      # Belt-and-suspenders recoverability: the job-log tail above can still be
      # buried, and the artifact/presigned URL sit on an egress-blocked blob
      # host — but GitHub check-run ANNOTATIONS are retrievable as JSON via the
      # API even under that egress policy. Re-emit the failing-test blocks as
      # `::error::` workflow commands (which become annotations) so the exact
      # failing test name + assertion is always readable. Parses the tee'd log
      # for file-level `FAIL` lines, per-test `●` headers + their assertion
      # context, and the `Tests:`/`Test Suites:` summary. Multi-line messages
      # are joined with `%0A`; `%` is pre-escaped to `%25` per the workflow
      # command spec. Emits a single explanatory `::error::` if the log is
      # missing/empty. Runs before the Postgres service teardown at job end.
      - name: "Annotate failing jest tests (workflow ::error:: commands)"
        if: failure()
        shell: bash
        run: |
          log=/tmp/jest-shard-output.log
          shard="${{ matrix.shard }}/${{ strategy.job-total }}"
          if [ ! -s "$log" ]; then
            echo "::error title=Jest shard ${shard}::No jest output captured at ${log} (the failing shard produced no test output — failure occurred before/at DB setup, or the log is empty)."
            exit 0
          fi
          # File-level FAIL lines (one annotation each).
          grep -E '^FAIL ' "$log" | while IFS= read -r line; do
            clean=${line//$'\r'/}
            clean=${clean//%/%25}
            echo "::error title=Jest FAIL suite (shard ${shard})::${clean}"
          done
          # Per-test failure blocks: each begins with a '●' header; capture the
          # header plus up to 8 following non-blank lines as the assertion.
          awk -v shard="$shard" '
            function emit() {
              if (hdr != "") {
                msg = hdr
                for (i = 0; i < n; i++) msg = msg "%0A" buf[i]
                print "::error title=Jest failing test (shard " shard ")::" msg
              }
              hdr = ""; n = 0; capture = 0
            }
            /^[[:space:]]*●[[:space:]]/ {
              emit()
              line = $0
              sub(/^[[:space:]]*●[[:space:]]*/, "", line)
              gsub(/\r/, "", line)
              gsub(/%/, "%25", line)
              hdr = line
              capture = 1
              next
            }
            {
              if (capture && n < 8) {
                l = $0
                gsub(/\r/, "", l)
                if (l ~ /^[[:space:]]*$/) {
                  # Jest prints a blank line right after the bullet header; skip
                  # leading blanks, but treat a blank AFTER captured content as
                  # the end of this test's assertion block.
                  if (n > 0) capture = 0
                } else {
                  gsub(/%/, "%25", l)
                  buf[n++] = l
                }
              }
            }
            END { emit() }
          ' "$log"
          # Jest summary line(s).
          grep -E '^(Tests|Test Suites):' "$log" | while IFS= read -r line; do
            clean=${line//$'\r'/}
            clean=${clean//%/%25}
            echo "::error title=Jest summary (shard ${shard})::${clean}"
          done

      - name: Upload jest output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jest-shard-${{ matrix.shard }}-of-${{ strategy.job-total }}-output
          path: /tmp/jest-shard-output.log
          retention-days: 7
          if-no-files-found: warn

      - name: Notify Discord on failure
        if: failure() && inputs.notify_on_failure
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not configured — skipping notification."
            exit 0
          fi
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"🔴 **${{ inputs.notification_label }} test shard ${{ matrix.shard }}/${{ strategy.job-total }} failed** on \`${{ github.ref_name }}\`\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK_URL" || true

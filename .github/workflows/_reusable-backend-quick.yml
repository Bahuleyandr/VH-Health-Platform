name: Reusable Backend Quick Gate

on:
  workflow_call:
    inputs:
      notify_on_failure:
        required: false
        type: boolean
        default: false
      notification_label:
        required: false
        type: string
        default: Backend quick gate
    secrets:
      DISCORD_WEBHOOK_URL:
        required: false

permissions:
  contents: read

jobs:
  affected:
    name: Backend affected checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/backend

    services:
      postgres:
        # Prod parity: production CNPG pins PostgreSQL 17.10 — keep CI on pg17
        # until the held PG18 cutover ladder lands (pg18-canary.yml is the
        # non-required qualification canary).
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: vhhealth
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: vhhealth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vhhealth"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://vhhealth:${{ github.run_id }}@localhost:5432/vhhealth
      TEST_DATABASE_URL: postgresql://vhhealth:${{ github.run_id }}@localhost:5432/vhhealth
      # Skip-floor enforcement (HIGH-3 follow-up): with the DB env provisioned,
      # any skipped test not declared in apps/backend/scripts/jest-skip-floor.json
      # fails the run (scripts/jest-skip-floor-reporter.cjs).
      JEST_ENFORCE_SKIP_FLOOR: '1'
      API_KEY: test-api-key
      JWT_SECRET: test-jwt-secret-for-ci-must-be-at-least-32-chars
      NODE_ENV: test
      VH_ALLOW_NON_TEST_DATA_SEED: 'true'
      FIELD_ENCRYPTION_KEY: ci-field-encryption-key-32-chars-minimum
      TOTP_ENCRYPTION_KEY: ci-totp-encryption-key-32-chars-minimum
      BACKUP_ENCRYPTION_KEY: ci-backup-encryption-key-32-chars-minimum

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.5.0'
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - run: npm ci

      # Same guard as the canonical gate's static-checks job — see the comment
      # there. Mirrored here so a stripped lockfile fails on the ordinary
      # feature push, not only on the final `[full-ci]` marker commit: a
      # regenerated package-lock.json is exactly the kind of change that lands
      # mid-branch, and #878's whole failure mode was discovering it late.
      - name: Lockfile libc guard (musl/glibc platform constraints intact)
        run: npm run check:lockfile-libc

      # Second layer behind the UTC session pin in src/lib/prisma.js. A
      # timestamptz read back through the pg driver is materialised in the
      # DATABASE SESSION timezone, so comparing one against the process clock is
      # only correct on a UTC session — two such sites shipped FAIL-OPEN. CI runs
      # a UTC database, so a relapse is behaviourally invisible here and only the
      # source shape can be checked. Its own step rather than a link in the
      # `npm run lint` && chain, so a lint failure cannot mask it.
      - name: Timestamptz clock-comparison guard (no driver Date vs process clock)
        run: npm run check:timestamptz-clock

      # Same guard as the canonical gate's static-checks job — see the comment
      # there. It belongs in BOTH tiers: a new migration arrives on an ordinary
      # feature push, which is exactly the event this affected gate covers,
      # while the full tier runs only behind the final `[full-ci]` marker.
      - name: Migration number collision guard (no duplicate numeric prefixes)
        run: npm run check:migration-numbers

      # Applied-migration immutability. The authoritative copy of this gate runs
      # in the unconditional `security` stage of ci.yml — it must not be
      # skippable by tier routing. It is mirrored here (and in the full tier)
      # beside the collision guard so that both migration checks fail in the
      # same place, for the same reason, on the same push. Needs the
      # `fetch-depth: 0` checkout above: it resolves a merge-base with main.
      - name: Applied-migration immutability guard (no edits to migrations on main)
        run: npm run check:migration-immutability

      - name: Restore generated Prisma client
        id: prisma-client
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: apps/backend/node_modules/.prisma
          key: prisma-client-${{ runner.os }}-node-26-${{ hashFiles('apps/backend/package-lock.json', 'apps/backend/prisma/schema.prisma') }}

      - name: Generate Prisma client on cache miss
        if: steps.prisma-client.outputs.cache-hit != 'true'
        run: npx prisma generate

      - name: Verify generated Prisma client
        run: node --input-type=module -e "const client = await import('@prisma/client'); if (typeof client.PrismaClient !== 'function') throw new Error('PrismaClient export missing');"

      - name: Save generated Prisma client
        if: steps.prisma-client.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: apps/backend/node_modules/.prisma
          key: prisma-client-${{ runner.os }}-node-26-${{ hashFiles('apps/backend/package-lock.json', 'apps/backend/prisma/schema.prisma') }}

      - name: Backend lint and static policy checks
        run: npm run lint

      - name: OpenAPI route and mirror checks
        run: |
          npm run openapi:check
          npm run openapi:check-core

      - name: Prepare migrated test database
        run: |
          npm run db:ensure-pgvector
          node scripts/ci-setup-db.mjs
          node scripts/check-schema-drift.mjs
          npm run seed:test-data

      - name: Run affected backend tests
        working-directory: .
        run: node scripts/ci/run-affected-backend-tests.mjs

      - name: Notify Discord on failure
        if: failure() && inputs.notify_on_failure
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not configured — skipping notification."
            exit 0
          fi
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"🔴 **${{ inputs.notification_label }} failed** on \`${{ github.ref_name }}\`\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK_URL" || true

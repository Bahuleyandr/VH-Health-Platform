name: Reusable Client API Contract

# Asserts that every client only calls API paths the backend actually serves.
#
# The OpenAPI spec is generated by booting the live Express app, so it already
# proves the server->spec direction. This job proves the client->server
# direction, which nothing checked before: the 2026-08-09 audit found nine
# admin-portal calls to operations that exist in neither the spec nor Express.
#
# It is deliberately its OWN workflow rather than a step inside the backend or
# admin jobs. The check spans apps/admin, apps/patient, apps/staff,
# packages/vhhealth_core, apps/device-gateway AND the backend spec, so it has to
# run when ANY of them changes — no single existing path filter covers that set.
#
# No install step: the script is dependency-free by design, so this job is a
# checkout plus a few seconds of Node.

on:
  workflow_call:
    inputs:
      notify_on_failure:
        required: false
        type: boolean
        default: false
      notification_label:
        required: false
        type: string
        default: Client API Contract

permissions:
  contents: read

jobs:
  client-paths:
    name: Client API paths match the OpenAPI spec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26.5.0'

      - name: Extractor and normalizer unit tests
        run: node --test scripts/ci/check-client-paths.test.mjs

      - name: Client API path contract gate
        run: node scripts/ci/check-client-paths.mjs --verbose

      - name: Notify Discord on failure
        if: failure() && inputs.notify_on_failure
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not configured — skipping notification."
            exit 0
          fi
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"🔴 **${{ inputs.notification_label }} failed** on \`${{ github.ref_name }}\`\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK_URL" || true

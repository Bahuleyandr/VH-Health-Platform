name: Reusable Device Gateway CI

on:
  workflow_call:
    inputs:
      notify_on_failure:
        required: false
        type: boolean
        default: false
      notification_label:
        required: false
        type: string
        default: Device Gateway CI

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Device gateway lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26.5.0'
          cache: npm
          cache-dependency-path: apps/device-gateway/package-lock.json
      - name: Install
        working-directory: apps/device-gateway
        run: npm ci
      - name: Lint
        working-directory: apps/device-gateway
        run: npm run lint
      - name: Test
        working-directory: apps/device-gateway
        run: npm test
      - name: Notify Discord on failure
        if: failure() && inputs.notify_on_failure
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not configured — skipping notification."
            exit 0
          fi
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"🔴 **${{ inputs.notification_label }} failed** on \`${{ github.ref_name }}\`\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK_URL" || true

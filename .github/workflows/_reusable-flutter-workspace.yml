name: Reusable Flutter Workspace

on:
  workflow_call:
    inputs:
      notify_on_failure:
        description: Send a Discord notification if the workflow fails.
        required: false
        type: boolean
        default: false
      notification_label:
        description: Label to use in the Discord failure message.
        required: false
        type: string
        default: Flutter CI
    secrets:
      DISCORD_WEBHOOK_URL:
        required: false

permissions:
  contents: read

jobs:
  workspace:
    name: Melos workspace (analyze + test + format)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          # Pin the exact Flutter (Dart) version so `dart format` is
          # deterministic. CI was on the floating `stable` channel, whose
          # formatter drifts with each Dart release and silently re-breaks the
          # format check; 3.41.9 matches the workspace's declared SDK (root
          # pubspec `sdk: ^3.8.0`, see CLAUDE.md) and the local dev toolchain.
          flutter-version: 3.44.0
          cache: true

      - name: Print versions
        run: |
          flutter --version
          dart --version

      - name: Activate Melos
        run: dart pub global activate melos 7.5.1

      - name: Resolve pub workspace
        run: dart pub get

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Format check
        run: melos run format

      # Must run AFTER format (so format only checks hand-written code; the
      # generated client lib/api/generated/** is gitignored and absent on a
      # fresh clone) and BEFORE analyze + test (the barrel, wrapper, and compose
      # test import generated symbols, so they only resolve once codegen has run).
      # melos run codegen invokes `node scripts/codegen.mjs`, which needs Node
      # (preinstalled on ubuntu-latest GitHub-hosted runners) and dart (from
      # subosito/flutter-action above).
      - name: Codegen (regenerate Dart client from synced spec)
        run: melos run codegen

      - name: Analyze
        run: melos run analyze

      - name: Test
        run: melos run test

      - name: Notify Discord on failure
        if: failure() && inputs.notify_on_failure
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not configured — skipping notification."
            exit 0
          fi
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"🔴 **${{ inputs.notification_label }} failed** on \`${{ github.ref_name }}\`\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK_URL" || true

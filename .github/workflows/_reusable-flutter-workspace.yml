name: Reusable Flutter Workspace

on:
  workflow_call:
    inputs:
      notify_on_failure:
        description: Send a Discord notification if the workflow fails.
        required: false
        type: boolean
        default: false
      notification_label:
        description: Label to use in the Discord failure message.
        required: false
        type: string
        default: Flutter CI
    secrets:
      DISCORD_WEBHOOK_URL:
        required: false

permissions:
  contents: read

jobs:
  workspace:
    name: Melos workspace (analyze + test + format)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Print versions
        run: |
          flutter --version
          dart --version

      - name: Activate Melos
        run: dart pub global activate melos 7.5.1

      - name: Resolve pub workspace
        run: dart pub get

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Format check
        run: melos run format
        continue-on-error: true

      - name: Analyze
        run: melos run analyze

      - name: Test
        run: melos run test

      - name: Notify Discord on failure
        if: failure() && inputs.notify_on_failure
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not configured — skipping notification."
            exit 0
          fi
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"🔴 **${{ inputs.notification_label }} failed** on \`${{ github.ref_name }}\`\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK_URL" || true

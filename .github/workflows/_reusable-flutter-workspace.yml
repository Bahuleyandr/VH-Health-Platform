name: Reusable Flutter Workspace

on:
  workflow_call:
    inputs:
      notify_on_failure:
        description: Send a Discord notification if the workflow fails.
        required: false
        type: boolean
        default: false
      notification_label:
        description: Label to use in the Discord failure message.
        required: false
        type: string
        default: Flutter CI
    secrets:
      DISCORD_WEBHOOK_URL:
        required: false

permissions:
  contents: read

jobs:
  workspace:
    name: Melos workspace (analyze + test + format)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Node-only, ~5ms, no toolchain (Node is preinstalled on ubuntu-latest).
      # Deliberately BEFORE flutter-action so a doc stating a stale plugin
      # constraint fails in seconds rather than after the 3-5 min SDK install
      # plus the full analyze + test pass. Guards the drift that left
      # docs/FLUTTER_PLUGIN_MAJOR_MIGRATIONS.md claiming
      # flutter_local_notifications ^21.0.0 across two dependency waves.
      - name: Docs plugin-version drift
        run: |
          node --test scripts/check-docs-plugin-versions.test.mjs
          node scripts/check-docs-plugin-versions.mjs

      - name: Vital bounds generated-contract drift
        run: node scripts/generate-vital-bounds.mjs --check

      # Same class, same placement, same cost as the vital-bounds gate above:
      # the staff role contract is rendered from backend role/route/RBAC policy
      # and byte-compared. scripts/ci/flutter.mjs (the Forgejo/local canonical
      # half) has run both since addce0351; this step is what keeps the GitHub
      # half in parity, so a backend RBAC change that never regenerated the
      # Dart contract fails here instead of shipping a client that disagrees
      # with the server about who may see what.
      - name: Staff role generated-contract drift
        run: node scripts/generate-staff-role-contract.mjs --check

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Pin the exact Flutter (Dart) version so `dart format` is
          # deterministic. CI was on the floating `stable` channel, whose
          # formatter drifts with each Dart release and silently re-breaks the
          # format check; 3.44.0 is the owner-approved workspace toolchain.
          flutter-version: 3.44.0
          cache: true

      - name: Print versions
        run: |
          flutter --version
          dart --version

      - name: Activate Melos
        run: dart pub global activate melos 8.2.2

      - name: Resolve pub workspace
        run: dart pub get

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Format check
        run: melos run format

      # Must run AFTER format (so format only checks hand-written code; the
      # generated client lib/api/generated/** is gitignored and absent on a
      # fresh clone) and BEFORE analyze + test (the barrel, wrapper, and compose
      # test import generated symbols, so they only resolve once codegen has run).
      # melos run codegen invokes `node scripts/codegen.mjs`, which needs Node
      # (preinstalled on ubuntu-latest GitHub-hosted runners) and dart (from
      # subosito/flutter-action above).
      - name: Codegen (regenerate Dart client from synced spec)
        run: melos run codegen

      - name: Analyze
        run: melos run analyze

      - name: Test
        run: melos run test

      - name: Notify Discord on failure
        if: failure() && inputs.notify_on_failure
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not configured — skipping notification."
            exit 0
          fi
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"🔴 **${{ inputs.notification_label }} failed** on \`${{ github.ref_name }}\`\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK_URL" || true

  # Compile the staff app for the web.
  #
  # WHY THIS EXISTS: dart2js applies JavaScript number semantics that the Dart
  # VM does not. An int literal above 2^53, or an import with no web
  # implementation, analyzes clean and passes `flutter test` on the VM while
  # failing the web compile outright. Until this job existed nothing in CI ever
  # ran a web build on a PR, so that whole class of breakage could only be
  # discovered by hand — exactly how the governance-ceiling literal restored in
  # #691 slipped in (packages/vhhealth_core/lib/services/clinical_continuity_*).
  #
  # STAFF ONLY, deliberately. Staff is the only app with a real web target
  # (Dockerfile.web + nginx-staff-web.conf + k8s manifests + a release image
  # job). apps/patient/web/ is untouched `flutter create` scaffolding — stock
  # name/description/theme colour, no commits since the 2026-04-18 subtree
  # import, no deploy path; it compiles but never reaches runApp in a browser.
  # Gating patient on web-compilability would invent a target that does not
  # exist and could block legitimate mobile-only work. Nothing is lost: the
  # #691 defect class lives in packages/vhhealth_core, which both apps reach
  # through the same barrel, so the staff compile already covers it.
  #
  # --debug is deliberate: it still invokes dart2js (just without the optimizer
  # and tree-shaker), so it rejects the same compile errors as the --release
  # build that apps/staff/Dockerfile.web ships, for roughly a third of the
  # runtime. This is a compatibility gate, not an artifact build — nothing is
  # uploaded, and no --dart-define values (which include a secret API key on the
  # release path) are needed to prove the code compiles.
  web-build:
    name: Flutter web build (dart2js)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Same pin as the workspace job above and every other Flutter site in
          # the repo (ci.yml, .forgejo/workflows/ci.yml, deploy-*-staging.yml,
          # release-*.yml) — bump them together.
          flutter-version: 3.44.0
          cache: true

      - name: Activate Melos
        run: dart pub global activate melos 8.2.2

      - name: Resolve pub workspace
        run: dart pub get

      - name: Bootstrap workspace
        run: melos bootstrap

      # Same ordering constraint as the workspace job: lib/api/generated/** is
      # gitignored and absent on a fresh clone, and both apps reach it through
      # the vhhealth_core barrel, so the web compile cannot resolve its imports
      # until codegen has run.
      - name: Codegen (regenerate Dart client from synced spec)
        run: melos run codegen

      - name: Build staff for web
        working-directory: apps/staff
        run: flutter build web --debug

      - name: Notify Discord on failure
        if: failure() && inputs.notify_on_failure
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not configured — skipping notification."
            exit 0
          fi
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"🔴 **${{ inputs.notification_label }} / web build failed** on \`${{ github.ref_name }}\`\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK_URL" || true

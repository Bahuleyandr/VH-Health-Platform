name: Reusable Kubernetes Manifest Validation

on:
  workflow_call:
    inputs:
      notify_on_failure:
        description: Send a Discord notification if the workflow fails.
        required: false
        type: boolean
        default: false
      notification_label:
        description: Label to use in the Discord failure message.
        required: false
        type: string
        default: Kubernetes manifest validation
    secrets:
      DISCORD_WEBHOOK_URL:
        required: false

permissions:
  contents: read

jobs:
  validate:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KUSTOMIZE_VERSION: 5.8.1
      KUBECONFORM_VERSION: 0.7.0

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.5.0'

      - name: Install manifest validators
        run: |
          set -euo pipefail

          kustomize_archive="kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -sSfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/${kustomize_archive}" -o "/tmp/${kustomize_archive}"
          tar -xzf "/tmp/${kustomize_archive}" -C /tmp kustomize
          sudo install -m 0755 /tmp/kustomize /usr/local/bin/kustomize

          kubeconform_archive="kubeconform-linux-amd64.tar.gz"
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/${kubeconform_archive}" -o "/tmp/${kubeconform_archive}"
          tar -xzf "/tmp/${kubeconform_archive}" -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform

          kustomize version
          kubeconform -v

      - name: Test C1.1 manifest + backup contracts
        run: >-
          node --test
          scripts/check-c1-1-manifest-contract.test.mjs
          scripts/c1-1-backup-scripts.test.mjs
          scripts/vhhealth-gha-deploy.test.mjs
          scripts/update-prod-digests.test.mjs
          scripts/check-prod-digests-pinned.test.mjs

      - name: Check C1.1 production render contract
        run: node scripts/check-c1-1-manifest-contract.mjs

      - name: Validate rendered Kubernetes manifests
        run: node scripts/validate-kubernetes-manifests.mjs

      # Mirror of the canonical CI infra stage (scripts/ci/infra.mjs) so these
      # guards also run GitHub-natively on PRs, not only on the Forgejo side.
      - name: Check zero-trust network pack
        run: node scripts/check-zero-trust-network-pack.mjs

      - name: Check Kyverno Enforce readiness (static policy contract)
        run: node scripts/check-kyverno-enforce-readiness.mjs

      # Render both ArgoCD production roots and verify every active tag@digest
      # pull target exists at its live registry. The validator recognizes only
      # the exact three platform-owned all-zero app pins as a deliberate hold.
      - name: Verify production image pins against registries
        run: node scripts/check-prod-digests-pinned.mjs

      # Full continuity-edge suite (audit-log chain, mTLS gateway, activation,
      # policy purge, verifier contract, platform contract, metrics labels —
      # previously only metrics.test.mjs ran in CI). The platform-contract
      # suite renders overlays, so this must run after kustomize is installed.
      # `pretest` regenerates the gitignored test-only logging certificate
      # fixture from the committed test key (needs openssl, present on the
      # runner).
      - name: Test continuity-edge suites
        run: npm test --prefix infra/continuity-edge

      - name: Validate monitoring rules + dashboards
        run: |
          PROM_VER=2.55.1
          curl -sSL "https://github.com/prometheus/prometheus/releases/download/v${PROM_VER}/prometheus-${PROM_VER}.linux-amd64.tar.gz" | tar xz
          sudo mv "prometheus-${PROM_VER}.linux-amd64/promtool" /usr/local/bin/
          node infra/kubernetes/base/monitoring/validate-monitoring.mjs

      - name: Notify Discord on failure
        if: failure() && inputs.notify_on_failure
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not configured - skipping notification."
            exit 0
          fi
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"${{ inputs.notification_label }} failed on \`${{ github.ref_name }}\`\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK_URL" || true

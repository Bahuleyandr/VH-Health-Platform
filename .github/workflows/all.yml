name: Full Stack Sweep
run-name: Full Stack Sweep (${{ github.event_name }}) @ ${{ github.ref_name }}

# Periodic/manual full-stack run that complements the path-filtered per-stack
# workflows. It catches cross-stack drift without forcing every PR to run
# every suite.

on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * 1-5'

permissions:
  contents: read

concurrency:
  group: full-stack-sweep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    uses: ./.github/workflows/secret-scan.yml
    secrets: inherit

  # WS3 B3.4 CI-9: Semgrep SAST blocking gate in the scheduled/manual sweep.
  # Findings fail the workflow. Mirrors the gate in ci-backend.yml so the
  # full-stack sweep is also a hard conformance check, not just advisory.
  semgrep-sast:
    name: Semgrep SAST (full codebase)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install semgrep
        run: pip install --quiet semgrep

      - name: Semgrep focused scan (blocking)
        run: |
          mkdir -p output/security
          semgrep scan \
            --config .semgrep.yml \
            --error \
            --severity ERROR \
            --sarif \
            --output output/security/semgrep-focused.sarif \
            --timeout 300 \
            --jobs 4 \
            --exclude apps/backend/node_modules \
            --exclude apps/admin/node_modules \
            --exclude infra/mcp \
            --exclude infra/onprem \
            --exclude 'apps/admin/.next' \
            --exclude output \
            --exclude build \
            --exclude apps/backend/src/logs \
            --exclude apps/patient/build \
            --exclude apps/staff/build \
            --exclude tmp \
            .

      - name: Upload Semgrep SARIF (soft-fail — GHAS not required)
        if: always() && hashFiles('output/security/semgrep-focused.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: output/security/semgrep-focused.sarif
          category: semgrep-full-sweep

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not configured — skipping notification."
            exit 0
          fi
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"🔴 **Full Stack Sweep / Semgrep SAST failed** on \`${{ github.ref_name }}\`\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK_URL" || true

  flutter-workspace:
    uses: ./.github/workflows/_reusable-flutter-workspace.yml
    with:
      notify_on_failure: true
      notification_label: Full Stack Sweep / flutter
    secrets: inherit

  backend-lint-and-test:
    uses: ./.github/workflows/_reusable-backend-lint-test.yml
    with:
      notify_on_failure: true
      notification_label: Full Stack Sweep / backend
    secrets: inherit

  backend-fhir-conformance:
    needs: backend-lint-and-test
    uses: ./.github/workflows/_reusable-backend-fhir.yml
    with:
      notify_on_failure: true
      # WS3 B3.4 CI-1: golden-bundle violations fail the sweep (always blocking).
      notification_label: Full Stack Sweep / backend FHIR
    secrets: inherit

  admin-lint-typecheck-build:
    uses: ./.github/workflows/_reusable-admin-ci.yml
    with:
      notify_on_failure: true
      notification_label: Full Stack Sweep / admin
    secrets: inherit

  client-contract:
    uses: ./.github/workflows/_reusable-client-contract.yml
    with:
      notify_on_failure: true
      notification_label: Full Stack Sweep / client contract
    secrets: inherit

  device-gateway-lint-and-test:
    uses: ./.github/workflows/_reusable-device-gateway-ci.yml
    with:
      notify_on_failure: true
      notification_label: Full Stack Sweep / device gateway
    secrets: inherit

  kubernetes-manifest-validation:
    uses: ./.github/workflows/_reusable-kubernetes-manifests.yml
    with:
      notify_on_failure: true
      notification_label: Full Stack Sweep / Kubernetes manifests
    secrets: inherit

name: Admin Portal CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - '.github/workflows/ci-admin.yml'
      - '.github/workflows/_reusable-admin-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - '.github/workflows/ci-admin.yml'
      - '.github/workflows/_reusable-admin-ci.yml'

concurrency:
  group: ci-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-build:
    uses: ./.github/workflows/_reusable-admin-ci.yml
    with:
      notify_on_failure: true
      notification_label: Admin Portal CI
    secrets: inherit

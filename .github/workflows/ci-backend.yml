name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/ci-backend.yml'
      - '.github/workflows/_reusable-backend-lint-test.yml'
      - '.github/workflows/_reusable-backend-fhir.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/ci-backend.yml'
      - '.github/workflows/_reusable-backend-lint-test.yml'
      - '.github/workflows/_reusable-backend-fhir.yml'

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    uses: ./.github/workflows/_reusable-backend-lint-test.yml
    with:
      notify_on_failure: true
      notification_label: Backend CI
    secrets: inherit

  fhir-conformance:
    needs: lint-and-test
    uses: ./.github/workflows/_reusable-backend-fhir.yml

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          config-file: ./apps/backend/.github/codeql/codeql-config.yml
          source-root: apps/backend

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        continue-on-error: true  # SARIF upload fails on private repos without GitHub Advanced Security

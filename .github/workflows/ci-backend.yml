name: Backend CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - '.semgrep.yml'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - '.semgrep.yml'
      - '.github/workflows/ci-backend.yml'

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/_reusable-backend-lint-test.yml
    with:
      notify_on_failure: true
      notification_label: Backend CI
    secrets: inherit

  fhir-conformance:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/_reusable-backend-fhir.yml

  semgrep:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    # WS3 B3.4 CI-9: Semgrep SAST is BLOCKING on ERROR-severity rules. The scan
    # uses the repo's own .semgrep.yml ruleset (VH Health focused rules); --error
    # makes any ERROR finding exit non-zero and fail the job, while the advisory
    # WARNING rules (e.g. Math.random jitter, weak-hash) report without gating.
    # The SARIF upload is soft-fail (GHAS not required).
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read   # codeql-action upload-sarif workflow-run lookup (private repo)
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install semgrep
        run: pip install --quiet semgrep

      - name: Semgrep focused scan (blocking)
        run: |
          mkdir -p output/security
          semgrep scan \
            --config .semgrep.yml \
            --error \
            --severity ERROR \
            --sarif \
            --output output/security/semgrep-focused.sarif \
            --timeout 300 \
            --jobs 4 \
            --exclude apps/backend/node_modules \
            --exclude apps/admin/node_modules \
            --exclude infra/mcp \
            --exclude infra/onprem \
            --exclude 'apps/admin/.next' \
            --exclude output \
            --exclude build \
            --exclude apps/backend/src/logs \
            --exclude apps/patient/build \
            --exclude apps/staff/build \
            --exclude tmp \
            .

      - name: Upload Semgrep SARIF to GitHub Security tab
        # Soft-fail: upload requires GHAS on private repos; the gate is the
        # scan step above.
        if: always() && hashFiles('output/security/semgrep-focused.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: output/security/semgrep-focused.sarif
          category: semgrep-backend

  codeql:
    # WS3 B3.4 CI-9: CodeQL now blocking. The analysis step fails CI on
    # findings. The SARIF upload step remains soft-fail (continue-on-error)
    # because upload to GitHub Security tab requires GitHub Advanced Security
    # (GHAS), which is unavailable on private repos without the add-on.
    # Separation: analysis exit-code is the gate; upload failure is noise.
    name: CodeQL SAST
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read   # codeql-action workflow-run lookup (private repo); matches release-images.yml

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: javascript
          source-root: apps/backend

      - name: Perform CodeQL Analysis
        id: codeql-analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          # Write SARIF results to a local file so we can upload separately.
          output: codeql-results
          upload: false

      - name: Upload SARIF to GitHub Security tab
        # Soft-fail: SARIF upload requires GHAS on private repos.
        # The gate is the analysis step above, not this upload.
        if: always() && steps.codeql-analyze.outcome != 'cancelled'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: codeql-results
          category: codeql-backend

name: Client API Contract

# Manual diagnostic wrapper. Canonical CI automatically calls this reusable
# workflow whenever either side of the client/server contract changes and on
# the final full-gate dispatch.

on:
  workflow_dispatch:

concurrency:
  group: ci-client-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-contract:
    uses: ./.github/workflows/_reusable-client-contract.yml
    with:
      notify_on_failure: true
      notification_label: Client API Contract
    secrets: inherit

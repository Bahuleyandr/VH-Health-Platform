name: Flutter CI

# Manual full-stack diagnostic wrapper. Automatic feature-branch selection now
# lives in Canonical CI: quick pushes call the same reusable workflow only for
# Flutter changes, while the final dispatch calls it once in the full matrix.
#
# The reusable workflow still owns the docs-vs-pubspec drift assertion; the
# canonical planner owns its trigger paths.

on:
  workflow_dispatch:

concurrency:
  group: ci-flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    uses: ./.github/workflows/_reusable-flutter-workspace.yml

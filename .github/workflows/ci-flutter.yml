name: Flutter CI

# Runs only when the Flutter side of the repo (apps/patient, apps/staff,
# packages/vhhealth_core) or workspace-wide plumbing changes. Admin + backend
# edits skip this workflow via path filters.

on:
  push:
    branches: [main]
    paths:
      - 'apps/patient/**'
      - 'apps/staff/**'
      - 'packages/vhhealth_core/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ci-flutter.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/patient/**'
      - 'apps/staff/**'
      - 'packages/vhhealth_core/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ci-flutter.yml'

concurrency:
  group: ci-flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Melos workspace (analyze + test + format)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Print versions
        run: |
          flutter --version
          dart --version

      - name: Activate Melos
        run: dart pub global activate melos 7.5.1

      - name: Resolve pub workspace
        run: dart pub get

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Format check
        run: melos run format
        continue-on-error: true

      - name: Analyze
        run: melos run analyze

      - name: Test
        run: melos run test

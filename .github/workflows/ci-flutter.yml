name: Flutter CI

# Runs only when the Flutter side of the repo (apps/patient, apps/staff,
# packages/vhhealth_core) or workspace-wide plumbing changes. Admin + backend
# edits skip this workflow via path filters.

on:
  push:
    branches: [main]
    paths:
      - 'apps/patient/**'
      - 'apps/staff/**'
      - 'packages/vhhealth_core/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ci-flutter.yml'
      - '.github/workflows/_reusable-flutter-workspace.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/patient/**'
      - 'apps/staff/**'
      - 'packages/vhhealth_core/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ci-flutter.yml'
      - '.github/workflows/_reusable-flutter-workspace.yml'

concurrency:
  group: ci-flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    uses: ./.github/workflows/_reusable-flutter-workspace.yml

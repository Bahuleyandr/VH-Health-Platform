name: Kubernetes Manifests

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci-kubernetes.yml'
      - '.github/workflows/_reusable-kubernetes-manifests.yml'
      - 'infra/kubernetes/**'
      - 'infra/continuity-edge/**'
      - 'infra/cloudflare/access/**'
      - 'docs/CNPG_POSTGRES_18_QUALIFICATION.md'
      - 'docs/DEPLOYMENT_GUIDE.md'
      - 'docs/ZERO_TRUST_NETWORK.md'
      - 'scripts/check-c1-1-manifest-contract.mjs'
      - 'scripts/check-c1-1-manifest-contract.test.mjs'
      - 'scripts/c1-1-backup-scripts.test.mjs'
      - 'scripts/vhhealth-gha-deploy.test.mjs'
      - 'scripts/validate-kubernetes-manifests.mjs'
      - 'scripts/check-zero-trust-network-pack.mjs'
      - 'scripts/check-kyverno-enforce-readiness.mjs'
      - 'scripts/check-prod-digests-pinned.mjs'
      - 'scripts/update-prod-digests.mjs'
      - 'scripts/update-prod-digests.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci-kubernetes.yml'
      - '.github/workflows/_reusable-kubernetes-manifests.yml'
      - 'infra/kubernetes/**'
      - 'infra/continuity-edge/**'
      - 'infra/cloudflare/access/**'
      - 'docs/CNPG_POSTGRES_18_QUALIFICATION.md'
      - 'docs/DEPLOYMENT_GUIDE.md'
      - 'docs/ZERO_TRUST_NETWORK.md'
      - 'scripts/check-c1-1-manifest-contract.mjs'
      - 'scripts/check-c1-1-manifest-contract.test.mjs'
      - 'scripts/c1-1-backup-scripts.test.mjs'
      - 'scripts/vhhealth-gha-deploy.test.mjs'
      - 'scripts/validate-kubernetes-manifests.mjs'
      - 'scripts/check-zero-trust-network-pack.mjs'
      - 'scripts/check-kyverno-enforce-readiness.mjs'
      - 'scripts/check-prod-digests-pinned.mjs'
      - 'scripts/update-prod-digests.mjs'
      - 'scripts/update-prod-digests.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kubernetes-manifests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/_reusable-kubernetes-manifests.yml
    secrets: inherit

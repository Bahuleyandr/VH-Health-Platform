name: Patient App CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Bahuleyandr/vhhealth-core
          path: vhhealth-core

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Override path dependency to point to checked-out core within workspace
      - name: Fix core path for CI
        run: |
          sed -i 's|path: ../vhhealth-core|path: ./vhhealth-core|' pubspec.yaml

      - run: flutter pub get

      - run: flutter analyze
        continue-on-error: true

      - run: flutter test
        if: ${{ hashFiles('test/**') != '' }}

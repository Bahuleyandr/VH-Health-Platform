name: Canonical CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Repo-owned CI runner
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/backend/package-lock.json
            apps/admin/package-lock.json

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run canonical CI
        run: node scripts/ci/run.mjs --install

name: Canonical CI

# Tiered canonical gate:
# - feature-branch pushes run security plus affected-stack checks;
# - CI-plumbing changes exercise the full matrix before this workflow lands;
# - a final no-source-change commit carrying `[full-ci]` runs every stack once,
#   in parallel, and attaches both required contexts to the pull request;
# - each lightweight aggregate keeps a stable branch-protection context.
#
# GitHub merge queues are unavailable for this user-owned repository. Requiring
# both Merge Gate and Full Merge Gate provides the same fail-closed property:
# a later push has a new SHA and therefore invalidates the prior full result.
# The broad scheduled sweep remains in all.yml. Smoke E2E runs nightly rather
# than on every PR update.

on:
  push:
    branches:
      - '**'
      - '!main'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      tier:
        description: Gate tier to exercise manually.
        required: true
        type: choice
        default: full
        options:
          - full
          - quick

permissions:
  contents: read

concurrency:
  group: canonical-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan canonical tier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      backend: ${{ steps.plan.outputs.backend }}
      fhir: ${{ steps.plan.outputs.fhir }}
      admin: ${{ steps.plan.outputs.admin }}
      flutter: ${{ steps.plan.outputs.flutter }}
      contracts: ${{ steps.plan.outputs.contracts }}
      gateway: ${{ steps.plan.outputs.gateway }}
      infra: ${{ steps.plan.outputs.infra }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.5.0'

      - name: Select tier and affected stacks
        id: plan
        env:
          CANONICAL_TIER: ${{ github.event_name == 'workflow_dispatch' && inputs.tier || contains(github.event.head_commit.message, '[full-ci]') && 'full' || 'auto' }}
        run: node scripts/ci/canonical-plan.mjs

      - name: Planner regression tests
        run: node --test scripts/ci/canonical-plan.test.mjs scripts/ci/assert-canonical-results.test.mjs scripts/ci/run-affected-backend-tests.test.mjs

  security:
    name: Security and diff checks
    needs: plan
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.5.0'

      - name: Install Semgrep
        run: python -m pip install --quiet semgrep

      - name: Semgrep rule regression tests
        run: node --test scripts/ci/semgrep-config.test.mjs

      - run: node scripts/ci/run.mjs --only=security

  quick_backend:
    needs: plan
    if: ${{ needs.plan.outputs.tier == 'quick' && needs.plan.outputs.backend == 'true' }}
    uses: ./.github/workflows/_reusable-backend-quick.yml
    with:
      notify_on_failure: true
      notification_label: Backend affected gate
    secrets: inherit

  quick_fhir:
    needs: plan
    if: ${{ needs.plan.outputs.tier == 'quick' && needs.plan.outputs.fhir == 'true' }}
    uses: ./.github/workflows/_reusable-backend-fhir.yml
    with:
      notify_on_failure: true
      notification_label: FHIR affected gate
    secrets: inherit

  quick_admin:
    needs: plan
    if: ${{ needs.plan.outputs.tier == 'quick' && needs.plan.outputs.admin == 'true' }}
    uses: ./.github/workflows/_reusable-admin-ci.yml
    with:
      notify_on_failure: true
      notification_label: Admin affected gate
    secrets: inherit

  quick_flutter:
    needs: plan
    if: ${{ needs.plan.outputs.tier == 'quick' && needs.plan.outputs.flutter == 'true' }}
    uses: ./.github/workflows/_reusable-flutter-workspace.yml
    with:
      notify_on_failure: true
      notification_label: Flutter affected gate
    secrets: inherit

  quick_contracts:
    needs: plan
    if: ${{ needs.plan.outputs.tier == 'quick' && needs.plan.outputs.contracts == 'true' }}
    uses: ./.github/workflows/_reusable-client-contract.yml
    with:
      notify_on_failure: true
      notification_label: Client contract affected gate
    secrets: inherit

  quick_gateway:
    needs: plan
    if: ${{ needs.plan.outputs.tier == 'quick' && needs.plan.outputs.gateway == 'true' }}
    uses: ./.github/workflows/_reusable-device-gateway-ci.yml
    with:
      notify_on_failure: true
      notification_label: Device gateway affected gate
    secrets: inherit

  quick_infra:
    needs: plan
    if: ${{ needs.plan.outputs.tier == 'quick' && needs.plan.outputs.infra == 'true' }}
    uses: ./.github/workflows/_reusable-kubernetes-manifests.yml
    with:
      notify_on_failure: true
      notification_label: Kubernetes affected gate
    secrets: inherit

  lint-and-test:
    needs: plan
    if: ${{ needs.plan.outputs.tier == 'full' }}
    uses: ./.github/workflows/_reusable-backend-lint-test.yml
    with:
      notify_on_failure: true
      notification_label: Canonical backend
    secrets: inherit

  fhir-conformance:
    needs: plan
    if: ${{ needs.plan.outputs.tier == 'full' }}
    uses: ./.github/workflows/_reusable-backend-fhir.yml
    with:
      notify_on_failure: true
      notification_label: Canonical FHIR
    secrets: inherit

  full_admin:
    needs: plan
    if: ${{ needs.plan.outputs.tier == 'full' }}
    uses: ./.github/workflows/_reusable-admin-ci.yml
    with:
      notify_on_failure: true
      notification_label: Canonical Admin
    secrets: inherit

  full_flutter:
    needs: plan
    if: ${{ needs.plan.outputs.tier == 'full' }}
    uses: ./.github/workflows/_reusable-flutter-workspace.yml
    with:
      notify_on_failure: true
      notification_label: Canonical Flutter
    secrets: inherit

  full_contracts:
    needs: plan
    if: ${{ needs.plan.outputs.tier == 'full' }}
    uses: ./.github/workflows/_reusable-client-contract.yml
    with:
      notify_on_failure: true
      notification_label: Canonical client contract
    secrets: inherit

  full_gateway:
    needs: plan
    if: ${{ needs.plan.outputs.tier == 'full' }}
    uses: ./.github/workflows/_reusable-device-gateway-ci.yml
    with:
      notify_on_failure: true
      notification_label: Canonical Device Gateway
    secrets: inherit

  full_infra:
    needs: plan
    if: ${{ needs.plan.outputs.tier == 'full' }}
    uses: ./.github/workflows/_reusable-kubernetes-manifests.yml
    with:
      notify_on_failure: true
      notification_label: Canonical Kubernetes
    secrets: inherit

  merge_gate:
    name: ${{ needs.plan.outputs.tier == 'full' && 'Full Merge Gate' || 'Merge Gate' }}
    if: ${{ always() }}
    needs:
      - plan
      - security
      - quick_backend
      - quick_fhir
      - quick_admin
      - quick_flutter
      - quick_contracts
      - quick_gateway
      - quick_infra
      - lint-and-test
      - fhir-conformance
      - full_admin
      - full_flutter
      - full_contracts
      - full_gateway
      - full_infra
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.5.0'

      - name: Aggregate selected results
        env:
          CANONICAL_TIER: ${{ needs.plan.outputs.tier }}
          CANONICAL_RESULTS: ${{ toJSON(needs) }}
          SELECT_BACKEND: ${{ needs.plan.outputs.backend }}
          SELECT_FHIR: ${{ needs.plan.outputs.fhir }}
          SELECT_ADMIN: ${{ needs.plan.outputs.admin }}
          SELECT_FLUTTER: ${{ needs.plan.outputs.flutter }}
          SELECT_CONTRACTS: ${{ needs.plan.outputs.contracts }}
          SELECT_GATEWAY: ${{ needs.plan.outputs.gateway }}
          SELECT_INFRA: ${{ needs.plan.outputs.infra }}
        run: node scripts/ci/assert-canonical-results.mjs

  full_merge_gate_compat:
    name: ${{ needs.plan.outputs.tier == 'full' && 'Merge Gate' || 'Full run Merge Gate not requested' }}
    if: ${{ always() && needs.plan.outputs.tier == 'full' }}
    needs:
      - plan
      - merge_gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm exhaustive aggregate passed
        env:
          FULL_MERGE_GATE_RESULT: ${{ needs.merge_gate.result }}
        run: test "$FULL_MERGE_GATE_RESULT" = 'success'

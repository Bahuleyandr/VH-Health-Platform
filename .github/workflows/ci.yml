name: Patient App CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Bahuleyandr/vhhealth-core
          path: vhhealth-core
          token: ${{ secrets.GH_PAT }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Override path dependency to point to checked-out core within workspace
      - name: Fix core path for CI
        run: |
          sed -i 's|path: ../vhhealth-core|path: ./vhhealth-core|' pubspec.yaml

      - run: flutter pub get

      - name: Security audit
        run: flutter pub audit
        continue-on-error: true

      - run: flutter analyze

      - run: flutter test

      - name: Verify build
        run: flutter build apk --debug

      - name: Notify Discord on failure
        if: failure()
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"🔴 **Patient App CI failed** on \`${{ github.ref_name }}\`\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}" || true

name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vhhealth
          POSTGRES_PASSWORD: test
          POSTGRES_DB: vhhealth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vhhealth"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://<user>:<password>@localhost:5432/vhhealth
      API_KEY: test-api-key
      JWT_SECRET: test-jwt-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Security audit
        run: |
          npm audit --audit-level=critical
          npx audit-ci --critical

      - run: npm run lint

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js --forceExit --detectOpenHandles

  deploy-staging:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Deploy database migrations to staging
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npx prisma migrate deploy

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

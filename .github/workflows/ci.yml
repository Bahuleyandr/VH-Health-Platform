name: Canonical CI

# WS3 B3.5 CI consolidation (2026-06-13):
# This workflow runs the repo-owned local CI script (scripts/ci/run.mjs) on
# FEATURE BRANCH pushes only. Its primary value is fast, changed-file-aware
# feedback during development before a PR is opened.
#
# PRs to main are gated by the per-stack GHA-native workflows (ci-backend.yml,
# ci-flutter.yml, ci-admin.yml, etc.) which run the canonical reusable job
# definitions and are more precisely scoped. Running this workflow on
# pull_request: too would create duplicate status checks for the same PR.
#
# If this local-runner output diverges from the per-stack workflows, treat the
# per-stack GHA workflows as authoritative for merge blocking.

on:
  push:
    branches:
      - '**'
      - '!main'   # main is covered by ci-backend/ci-flutter/ci-admin path filters
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Repo-owned CI runner (feature branches)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # `npm run ci` runs `prisma generate` + boots the app (openapi:check) BEFORE
    # its ci:backend:docker step provisions Postgres, so the early steps need
    # DATABASE_URL + the validateEnv secrets set. These are CI-only dummies (the
    # early steps don't connect; ci:backend:docker overrides DATABASE_URL with its
    # disposable container). Same values as _reusable-backend-lint-test.yml.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vhhealth
      API_KEY: test-api-key
      JWT_SECRET: test-jwt-secret-for-ci-must-be-at-least-32-chars
      NODE_ENV: test
      VH_ALLOW_NON_TEST_DATA_SEED: 'true'
      FIELD_ENCRYPTION_KEY: ci-field-encryption-key-32-chars-minimum
      TOTP_ENCRYPTION_KEY: ci-totp-encryption-key-32-chars-minimum
      BACKUP_ENCRYPTION_KEY: ci-backup-encryption-key-32-chars-minimum
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/backend/package-lock.json
            apps/admin/package-lock.json

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run canonical CI
        run: node scripts/ci/run.mjs --install --changed-on-branch-push

name: Canonical CI

# WS3 B3.5 CI consolidation (2026-06-13):
# This workflow runs the repo-owned local CI script (scripts/ci/run.mjs) on
# FEATURE BRANCH pushes only. Its primary value is fast, changed-file-aware
# feedback during development before a PR is opened.
#
# PRs to main are gated by the per-stack GHA-native workflows (ci-backend.yml,
# ci-flutter.yml, ci-admin.yml, etc.) which run the canonical reusable job
# definitions and are more precisely scoped. Running this workflow on
# pull_request: too would create duplicate status checks for the same PR.
#
# If this local-runner output diverges from the per-stack workflows, treat the
# per-stack GHA workflows as authoritative for merge blocking.

on:
  push:
    branches:
      - '**'
      - '!main'   # main is covered by ci-backend/ci-flutter/ci-admin path filters
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Repo-owned CI runner (feature branches)
    runs-on: ubuntu-latest
    # Raised 90 -> 150 (2026-08-02): on branches touching every stack the full
    # sweep (Flutter workspace + backend canonical) legitimately runs 75-90+
    # min, with the hosted canonical leg alone at 1h08-1h17. At 90 the ceiling
    # cancelled healthy, still-progressing runs (PR #697, job 91494465220, was
    # killed at 90m15s). GitHub-hosted jobs cap at 6h, so 150 stays well inside
    # the platform limit.
    timeout-minutes: 150
    # NOTE: backend CI secrets (DATABASE_URL/JWT_SECRET/encryption keys) are NOT
    # set job-wide on purpose — they must not leak into the admin stage, whose
    # middleware.test.ts asserts the no-JWT_SECRET code path. They're scoped to
    # the backend stage in scripts/ci/backend.mjs instead.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.5.0'
          cache: npm
          cache-dependency-path: |
            apps/backend/package-lock.json
            apps/admin/package-lock.json

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Pinned to match _reusable-flutter-workspace.yml — unpinned stable
          # drifted to 3.44.6 (2026-07-12) and its new ListTile framework
          # assertion broke this runner on every feature branch while the
          # hosted per-stack jobs stayed green. Bump BOTH files together.
          flutter-version: 3.44.0
          cache: true

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - name: Run canonical CI
        run: node scripts/ci/run.mjs --install --changed-on-branch-push

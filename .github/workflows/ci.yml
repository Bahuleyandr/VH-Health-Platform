name: Canonical CI

# WS3 B3.5 CI consolidation (2026-06-13):
# This workflow runs the repo-owned local CI script (scripts/ci/run.mjs) on
# feature-branch pushes and merge-queue test commits. Its single stable job
# name is the required main-branch protection check. Feature branches remain
# changed-file-aware; merge-queue commits deliberately run the full gate.
#
# The backend shard and FHIR jobs also run for every PR so their stable contexts
# can be required independently. This aggregate gate remains branch-diff-aware
# and covers every stack selected by the complete branch delta.
#
# A failure in either this gate or a relevant per-stack workflow remains a
# human-review stop until the disagreement is understood and fixed.

on:
  push:
    branches:
      - '**'
      - '!main'   # main is covered by ci-backend/ci-flutter/ci-admin path filters
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Merge Gate
    runs-on: ubuntu-latest
    # Raised 90 -> 150 (2026-08-02): on branches touching every stack the full
    # sweep (Flutter workspace + backend canonical) legitimately runs 75-90+
    # min, with the hosted canonical leg alone at 1h08-1h17. At 90 the ceiling
    # cancelled healthy, still-progressing runs (PR #697, job 91494465220, was
    # killed at 90m15s). GitHub-hosted jobs cap at 6h, so 150 stays well inside
    # the platform limit.
    timeout-minutes: 150
    # NOTE: backend CI secrets (DATABASE_URL/JWT_SECRET/encryption keys) are NOT
    # set job-wide on purpose — they must not leak into the admin stage, whose
    # middleware.test.ts asserts the no-JWT_SECRET code path. They're scoped to
    # the backend stage in scripts/ci/backend.mjs instead.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.5.0'
          cache: npm
          cache-dependency-path: |
            apps/backend/package-lock.json
            apps/admin/package-lock.json

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Pinned to match _reusable-flutter-workspace.yml — unpinned stable
          # drifted to 3.44.6 (2026-07-12) and its new ListTile framework
          # assertion broke this runner on every feature branch while the
          # hosted per-stack jobs stayed green. Bump BOTH files together.
          flutter-version: 3.44.0
          cache: true

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - name: Install Semgrep
        run: python -m pip install --quiet semgrep

      - name: Run merge gate
        run: node scripts/ci/run.mjs --install --changed-on-branch-push

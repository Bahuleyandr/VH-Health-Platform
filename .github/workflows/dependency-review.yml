name: Dependency Review

# Phase-3 hardening (2026-06-10 remediation plan): reviews PRs for dependencies
# with known HIGH/CRITICAL vulnerabilities. Complements the blocking `npm audit`
# in the Forgejo security sweep.
#
# ADVISORY (2026-06-21): actions/dependency-review-action needs GitHub's
# Dependency Graph, which is currently DISABLED on this repo, so the action
# hard-errors ("Dependency review is not supported on this repository") on every
# PR — it has failed on every PR since this workflow was added. `main` has no
# required-status-check protection, so this gate blocks nothing today regardless.
# The step is marked continue-on-error so it still runs + comments but does not
# turn every PR red. To restore the real blocking gate: enable the Dependency
# Graph (Settings -> Code security and analysis -> Dependency graph) and delete
# the `continue-on-error` line below.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Dependency review (advisory until Dependency Graph is enabled)
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        continue-on-error: true
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

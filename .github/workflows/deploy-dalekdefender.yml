name: Deploy dalekdefender

# Auto-deploy backend + admin to the dalekdefender single-node k3s test rig
# whenever a relevant change lands on main.
#
# ── Security rework (audit finding H12, 2026-06-10) ─────────────────────────
# The previous version of this workflow SSHed to the host and ran
# `git reset --hard` + a local docker build + `k3s ctr images import` +
# `kubectl set image` with passwordless sudo, and imperatively patched
# kubernetes Secrets (Sentry DSNs). That meant: unsigned, unscanned images
# under a mutable tag, code execution on a privileged host from any push to
# main, and secret material flowing through CI logs/processes.
#
# This version routes through the same controls as release-images.yml:
#   1. Build BOTH images on the GitHub runner (standard Dockerfiles).
#   2. Push to GHCR under an immutable `dalek-<sha>` tag.
#   3. Trivy scan (blocking on fixable CRITICAL/HIGH) + keyless cosign sign,
#      then cosign VERIFY the registry copy against this workflow's OIDC
#      identity before anything is deployed.
#   4. The SSH step refreshes a GHCR image-pull Secret from the short-lived
#      workflow token, pins the deployments to the verified @sha256 digest,
#      and waits for rollout — no git, no on-host build, no app secret patching.
#
# Secrets management: the rig's SENTRY_DSN / NEXT_PUBLIC_SENTRY_DSN now live
# solely in the overlay-managed Secrets (operator-applied, SealedSecret
# preferred). This workflow only refreshes the GHCR image-pull Secret required
# to fetch private images. The admin DSN is baked at build time from the GH
# secret like every other NEXT_PUBLIC_* value.
#
# OPERATOR ACTIONS still required (cannot be done from this repo):
#   - For durable pod recovery after the workflow token expires, add a
#     read-only GHCR token in /etc/rancher/k3s/registries.yaml (or make the
#     packages public).
#   - Narrow /etc/sudoers.d on the host: the deploy user now needs ONLY
#     passwordless access to the root-owned `/usr/local/sbin/vhhealth-gha-deploy`
#     wrapper from infra/kubernetes/overlays/dalekdefender/vhhealth-gha-deploy.sh.
#     The wrapper validates digest refs and commit SHA before running the limited
#     kubectl set-image/set-env/rollout-status operations, and the repo version
#     emits bounded diagnostics plus restores the previous digests on rollout
#     failure.
#   - Restrict the Tailscale ACL so tag:gha-deploy can reach dalekdefender:22
#     and nothing else.
#   - Confirm no real PHI lives on this rig; keep it firewalled from
#     anything resembling production data.
#
# Required secrets: TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET, DALEKDEFENDER_SSH_KEY,
# SENTRY_DSN_ADMIN (optional, baked into the admin build).

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'apps/admin/**'
      - 'infra/kubernetes/overlays/dalekdefender/**'
      - '.github/workflows/deploy-dalekdefender.yml'
  workflow_dispatch:

concurrency:
  # Serial deploys — never run two redeploys against the same host at once.
  group: deploy-dalekdefender
  cancel-in-progress: false

permissions:
  id-token: write   # cosign keyless signing via OIDC
  packages: write   # push dalek-<sha> images to ghcr.io
  contents: read

env:
  REGISTRY: ghcr.io
  COSIGN_YES: "true"

jobs:
  build-sign-scan:
    name: Build, scan, sign dalek images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      backend-image: ${{ steps.images.outputs.backend }}
      backend-digest: ${{ steps.build-backend.outputs.digest }}
      admin-image: ${{ steps.images.outputs.admin }}
      admin-digest: ${{ steps.build-admin.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names
        id: images
        run: |
          owner_lc="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "backend=${REGISTRY}/${owner_lc}/vh-health-platform-backend" >> "$GITHUB_OUTPUT"
          echo "admin=${REGISTRY}/${owner_lc}/vh-health-platform-adminportal" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image (dalek-<sha>)
        id: build-backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.images.outputs.backend }}:dalek-${{ github.sha }}
          build-args: |
            NODE_IMAGE=node:26.5.0-alpine@sha256:e88a35be04478413b7c71c455cd9865de9b9360e1f43456be5951032d7ac1a66
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=dalek-backend
          cache-to: type=gha,scope=dalek-backend,mode=max
          provenance: true
          sbom: true

      - name: Build and push admin image (dalek-<sha>)
        id: build-admin
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./apps/admin
          file: ./apps/admin/Dockerfile
          # Expose the backend dir as a named context so the Dockerfile can pull
          # the canonical OpenAPI spec for the admin build's generate:types step.
          build-contexts: |
            backend=./apps/backend
          push: true
          platforms: linux/amd64
          tags: ${{ steps.images.outputs.admin }}:dalek-${{ github.sha }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            NEXT_PUBLIC_API_URL=https://dalekdefender.hippocampus-monitor.ts.net:8444
            NEXT_PUBLIC_ALLOWED_ORIGIN=https://dalekdefender.hippocampus-monitor.ts.net:8445
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.SENTRY_DSN_ADMIN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=dalekdefender
            NEXT_PUBLIC_SENTRY_RELEASE=${{ github.sha }}
            NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE=0.1
            NEXT_PUBLIC_SENTRY_REPLAY_SESSION_SAMPLE_RATE=0
            NEXT_PUBLIC_SENTRY_REPLAY_ERROR_SAMPLE_RATE=0
          cache-from: type=gha,scope=dalek-admin
          cache-to: type=gha,scope=dalek-admin,mode=max
          provenance: true
          sbom: true

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.70.0
          cache: true

      - name: Scan images with Trivy (blocking)
        env:
          BACKEND_REF: ${{ steps.images.outputs.backend }}@${{ steps.build-backend.outputs.digest }}
          ADMIN_REF: ${{ steps.images.outputs.admin }}@${{ steps.build-admin.outputs.digest }}
        run: |
          mkdir -p .cache/trivy
          for ref in "$BACKEND_REF" "$ADMIN_REF"; do
            trivy image \
              --platform linux/amd64 \
              --scanners vuln \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --exit-code 1 \
              --vuln-type os,library \
              --cache-dir .cache/trivy \
              "$ref"
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Sign images (keyless via OIDC)
        env:
          BACKEND_REF: ${{ steps.images.outputs.backend }}@${{ steps.build-backend.outputs.digest }}
          ADMIN_REF: ${{ steps.images.outputs.admin }}@${{ steps.build-admin.outputs.digest }}
        run: |
          cosign sign --yes "$BACKEND_REF"
          cosign sign --yes "$ADMIN_REF"

  deploy:
    name: Pin verified digests on dalekdefender
    needs: build-sign-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Probe deploy prerequisites
        id: prereq
        run: |
          missing=()
          if [ -z "${{ secrets.TS_OAUTH_CLIENT_ID }}" ]; then missing+=(TS_OAUTH_CLIENT_ID); fi
          if [ -z "${{ secrets.TS_OAUTH_SECRET }}" ]; then missing+=(TS_OAUTH_SECRET); fi
          if [ -z "${{ secrets.DALEKDEFENDER_SSH_KEY }}" ]; then missing+=(DALEKDEFENDER_SSH_KEY); fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::warning::Skipping deploy — missing secrets: ${missing[*]}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: Install cosign
        if: steps.prereq.outputs.skip != 'true'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Log in to GHCR
        if: steps.prereq.outputs.skip != 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image signatures before deploy
        if: steps.prereq.outputs.skip != 'true'
        env:
          BACKEND_REF: ${{ needs.build-sign-scan.outputs.backend-image }}@${{ needs.build-sign-scan.outputs.backend-digest }}
          ADMIN_REF: ${{ needs.build-sign-scan.outputs.admin-image }}@${{ needs.build-sign-scan.outputs.admin-digest }}
        run: |
          for ref in "$BACKEND_REF" "$ADMIN_REF"; do
            cosign verify \
              --certificate-identity-regexp "^https://github.com/${{ github.repository }}/\.github/workflows/deploy-dalekdefender\.yml@.*$" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$ref"
          done

      - name: Tailscale connect
        if: steps.prereq.outputs.skip != 'true'
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gha-deploy
          version: latest

      - name: SSH agent
        if: steps.prereq.outputs.skip != 'true'
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DALEKDEFENDER_SSH_KEY }}

      - name: Checkout deploy helper
        if: steps.prereq.outputs.skip != 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Verify host deploy helper is current
        id: helper
        if: steps.prereq.outputs.skip != 'true'
        env:
          DALEK_HOST: bahuleyan@dalekdefender
        run: |
          set -euo pipefail
          helper_path="infra/kubernetes/overlays/dalekdefender/vhhealth-gha-deploy.sh"
          expected="$(sha256sum "$helper_path" | cut -d ' ' -f1)"
          actual="$(ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
            "$DALEK_HOST" \
            "sha256sum /usr/local/sbin/vhhealth-gha-deploy 2>/dev/null | cut -d ' ' -f1" || true)"
          actual="${actual:-missing}"
          echo "expected_sha=$expected" >> "$GITHUB_OUTPUT"
          echo "actual_sha=$actual" >> "$GITHUB_OUTPUT"
          if [ "$actual" != "$expected" ]; then
            echo "::warning::Dalekdefender host helper is missing or stale; skipping cluster mutation. expected_sha=$expected actual_sha=$actual. Install $helper_path to /usr/local/sbin/vhhealth-gha-deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Pin deployments to verified digests
        if: steps.prereq.outputs.skip != 'true' && steps.helper.outputs.skip != 'true'
        env:
          # Tailscale SSH maps the connection onto a host user. The host
          # sudoers entry allows exactly this root-owned wrapper; the wrapper
          # validates stdin refs before it runs the limited kubectl operations.
          DALEK_HOST: bahuleyan@dalekdefender
          BACKEND_REF: ${{ needs.build-sign-scan.outputs.backend-image }}@${{ needs.build-sign-scan.outputs.backend-digest }}
          ADMIN_REF: ${{ needs.build-sign-scan.outputs.admin-image }}@${{ needs.build-sign-scan.outputs.admin-digest }}
          GIT_COMMIT: ${{ github.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            printf '%s\n' "$BACKEND_REF"
            printf '%s\n' "$ADMIN_REF"
            printf '%s\n' "$GIT_COMMIT"
            printf '%s\n' "$GHCR_USERNAME"
            printf '%s\n' "$GHCR_TOKEN"
          } | ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
              "$DALEK_HOST" \
              "sudo -n /usr/local/sbin/vhhealth-gha-deploy"

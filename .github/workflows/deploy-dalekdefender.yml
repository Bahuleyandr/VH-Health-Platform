name: Deploy dalekdefender

# Auto-deploy backend + admin to the dalekdefender single-node k3s test rig
# whenever a relevant change lands on main. Triggered by changes to the
# backend or admin source, the dalekdefender overlay, or the Dockerfiles.
#
# Motivation: the vh-health-swarm runs continuously against dalekdefender.
# When main moves ahead but dalekdefender stays behind, the swarm re-files
# findings for bugs that have already been fixed upstream. The 2026-05-15→16
# tick burst was 73% stale-by-existing-code purely because of this lag.
# Auto-deploying on every main push closes the gap and improves the
# signal-to-noise ratio on swarm findings.
#
# Architecture:
#   GHA runner → Tailscale OAuth ephemeral node → ssh dalekdefender →
#   git pull + docker build + k3s ctr import + kubectl rollout restart.
#
# The dalekdefender host runs the heavy work; the GHA runner only
# coordinates and times out. Build time is ~3 min for backend, ~5 min for
# admin (Next.js), so the full deploy completes in under 10 min.
#
# Required secrets:
#   - TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET: Tailscale OAuth client granting
#     the runner an ephemeral node under tag:gha-deploy. Configure
#     in https://login.tailscale.com/admin/settings/oauth.
#   - DALEKDEFENDER_SSH_KEY: PEM-formatted private key. Public half goes
#     into ~/.ssh/authorized_keys on dalekdefender for the deploy user.
#
# Required Tailscale ACL: tag:gha-deploy must be allowed to SSH the
# dalekdefender device. Example ACL fragment:
#   {"action": "accept", "src": ["tag:gha-deploy"], "dst": ["dalekdefender:22"]}

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'apps/admin/**'
      - 'infra/kubernetes/overlays/dalekdefender/**'
      - '.github/workflows/deploy-dalekdefender.yml'
  workflow_dispatch:

concurrency:
  # Serial deploys — never run two redeploys against the same host at once.
  group: deploy-dalekdefender
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Probe deploy prerequisites
        run: |
          missing=()
          if [ -z "${{ secrets.TS_OAUTH_CLIENT_ID }}" ]; then missing+=(TS_OAUTH_CLIENT_ID); fi
          if [ -z "${{ secrets.TS_OAUTH_SECRET }}" ]; then missing+=(TS_OAUTH_SECRET); fi
          if [ -z "${{ secrets.DALEKDEFENDER_SSH_KEY }}" ]; then missing+=(DALEKDEFENDER_SSH_KEY); fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::warning::Skipping deploy — missing secrets: ${missing[*]}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        id: prereq

      - name: Tailscale connect
        if: steps.prereq.outputs.skip != 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gha-deploy
          version: latest

      - name: SSH agent
        if: steps.prereq.outputs.skip != 'true'
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DALEKDEFENDER_SSH_KEY }}

      - name: Drive rebuild + rollout on dalekdefender
        if: steps.prereq.outputs.skip != 'true'
        env:
          # Tailscale SSH is active on dalekdefender — it intercepts port 22
          # connections and tries to map them onto a local user. The runner's
          # default OS user is `runner`, which doesn't exist on dalekdefender.
          # Specify the host user explicitly so Tailscale SSH accepts.
          # `bahuleyan` owns ~/VH-Health-Platform and the sudo-no-password
          # entries for docker/kubectl used by the deploy commands.
          DALEK_HOST: bahuleyan@dalekdefender
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
              "$DALEK_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          cd ~/VH-Health-Platform

          # Drop any local working-tree drift (Dockerfile.dalek is generated
          # below; package-lock.json sometimes drifts from `npm install`
          # during prior manual builds). Safe — main is the source of truth.
          git checkout -- . 2>/dev/null || true
          git clean -fd apps/backend/Dockerfile.dalek apps/admin/Dockerfile.dalek 2>/dev/null || true

          git fetch origin main
          git checkout main
          git reset --hard origin/main

          # Stamp the deployed commit into the build so the swarm's
          # live-recheck can read it back from /health/version.
          GIT_COMMIT=$(git rev-parse HEAD)
          GIT_TAG=$(git rev-parse --short=12 HEAD)
          BACKEND_IMAGE="vhhealth-backend:${GIT_TAG}"
          ADMIN_IMAGE="vhhealth-admin:${GIT_TAG}"
          echo "Deploying commit $GIT_COMMIT"

          # Generate the Dockerfile.dalek variants — the upstream
          # Dockerfiles include an `apk add curl` + HEALTHCHECK step
          # that hangs on this host's docker DNS; strip them. k8s
          # probes do their own HTTP check anyway.
          for app in backend admin; do
            cd ~/VH-Health-Platform/apps/$app
            sed '/apk add --no-cache curl/d; /HEALTHCHECK/,/CMD curl/d' Dockerfile > Dockerfile.dalek
          done

          # Build + import backend image.
          cd ~/VH-Health-Platform/apps/backend
          sudo -n docker build \
            -t "$BACKEND_IMAGE" \
            --build-arg GIT_COMMIT="$GIT_COMMIT" \
            -f Dockerfile.dalek .
          sudo -n docker save "$BACKEND_IMAGE" | sudo -n k3s ctr images import -

          # Build + import admin image.
          cd ~/VH-Health-Platform/apps/admin
          sudo -n docker build \
            -t "$ADMIN_IMAGE" \
            --build-arg NEXT_PUBLIC_API_URL=https://dalekdefender.hippocampus-monitor.ts.net:8444 \
            --build-arg GIT_COMMIT="$GIT_COMMIT" \
            -f Dockerfile.dalek .
          sudo -n docker save "$ADMIN_IMAGE" | sudo -n k3s ctr images import -

          # Roll both deployments + wait for readiness.
          sudo -n kubectl -n vhhealth set image deploy/vhhealth-backend backend="$BACKEND_IMAGE"
          sudo -n kubectl -n vhhealth set image deploy/vhhealth-admin admin="$ADMIN_IMAGE"
          sudo -n kubectl -n vhhealth set env deploy/vhhealth-backend GIT_COMMIT="$GIT_COMMIT"
          sudo -n kubectl -n vhhealth set env deploy/vhhealth-admin GIT_COMMIT="$GIT_COMMIT"
          sudo -n kubectl -n vhhealth rollout status deploy/vhhealth-backend --timeout=300s
          sudo -n kubectl -n vhhealth rollout status deploy/vhhealth-admin --timeout=300s

          echo "Deploy complete: commit $GIT_COMMIT live on dalekdefender."
          REMOTE

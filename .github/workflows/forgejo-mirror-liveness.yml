name: Forgejo Mirror Liveness

# Watches the owner-ruled disaster-recovery mirror at
# forgejo.hippocampus-monitor.ts.net and fails loudly, and specifically, when
# it rots. It asserts three independent properties:
#
#   (a) origin/main == github/main
#   (b) the branch sets match in BOTH directions, naming any one-sided branch
#   (c) the last scheduled run of every `runs-on: ubuntu-latest` stage on the
#       mirror completed
#
# Why this lives in GitHub Actions rather than in .forgejo/workflows:
#
#   1. A detector hosted on the thing it watches cannot report that the thing
#      is dead - it would simply not run, which is precisely the failure this
#      guards. The mirror's own `runs-on: ubuntu-latest` jobs have been dying
#      in ~2 seconds since 2026-08-17 and produced silence, not an alarm.
#   2. The credentials for reaching the tailnet-only Forgejo host already live
#      here: TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET are GitHub repository
#      secrets, already used by .github/workflows/deploy-dalekdefender.yml.
#
# Neither job below is a required status check on main (branch protection
# requires only "Merge Gate" and "Full Merge Gate"), so this workflow can go
# red without blocking merges - it is an alarm, not a gate.

on:
  schedule:
    # HOURLY. Property (c) only changes at the mirror's 01:30 IST sweep, but
    # (a) and (b) break per merge: GitHub's merge-time branch delete prunes
    # GitHub only, which left a Forgejo-only branch six minutes after parity
    # was restored on 2026-09-08. A daily cadence would let that sit all day.
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    # Only the self-test runs on push (see the job-level `if:` below). This
    # trigger exists so a change to the detector is exercised before it is
    # trusted, not to check the mirror.
    paths:
      - '.github/workflows/forgejo-mirror-liveness.yml'
      - 'scripts/ci/forgejo-liveness.mjs'
      - 'scripts/ci/forgejo-liveness.test.mjs'
      - 'scripts/ci/fixtures/forgejo-liveness/**'

permissions:
  contents: read

concurrency:
  group: forgejo-mirror-liveness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detector-selftest:
    # POSITIVE CONTROL. Runs before the live check, on every trigger including
    # push, with no network and no tailnet. Thirteen fixtures drive the
    # detector through every alarm state it can report - unreachable host,
    # empty ref listing, drift, one-sided branches in each direction, failing
    # scheduled stages, a stopped scheduler, an empty monitored population -
    # and assert it exits non-zero on each, plus a healthy fixture that must
    # exit zero. A detector that can only ever report "ok" is indistinguishable
    # from a broken one; this job is what tells them apart.
    name: Forgejo liveness detector self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.5.0'

      - name: Prove the detector can detect a failure
        run: node --test scripts/ci/forgejo-liveness.test.mjs

  mirror-liveness:
    name: Forgejo mirror liveness
    needs: [detector-selftest]
    # SCHEDULE AND DISPATCH ONLY, deliberately. Two reasons:
    #   1. This job is legitimately red until the owner rebuilds the runner
    #      image. On push it would paint a red check on every PR head that
    #      touches the detector, and a monitor that is always red on PRs gets
    #      ignored before the real break arrives.
    #   2. The post-merge sync protocol (fast-forward origin/main, prune the
    #      merged branch on the mirror, verify) completes seconds to a minute
    #      AFTER a GitHub merge lands. A push-triggered run would fire inside
    #      that window and report a false break on every routine merge.
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.5.0'

      - name: Join the tailnet
        id: tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gha-deploy
          version: latest

      - name: Check drift, branch parity and scheduled-run health
        id: liveness
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        # `set -o pipefail` is load-bearing. GitHub runs `run:` under
        # `bash -e {0}` with no pipefail, so `node ... | tee ...` reports
        # tee's exit status and a FAILING detector concludes green. That is
        # exactly the false-green this workflow exists to prevent, and the
        # first run of this file hit it. Guarded by forgejo-liveness.test.mjs.
        run: |
          set -euo pipefail
          node scripts/ci/forgejo-liveness.mjs 2>&1 | tee liveness-report.txt

      - name: Raise or update the alarm issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'Forgejo DR mirror liveness FAILING'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TAILNET_OUTCOME: ${{ steps.tailnet.outcome }}
        run: |
          set -euo pipefail
          if [ "$TAILNET_OUTCOME" != "success" ]; then
            report="The GitHub runner failed to JOIN THE TAILNET (tailscale step outcome: ${TAILNET_OUTCOME}). The mirror's own state is unknown from here - this is not evidence that the mirror is down."
          else
            report="$(cat liveness-report.txt 2>/dev/null || echo 'Tailnet join succeeded but the detector produced no report - treat as MIRROR UNREACHABLE.')"
          fi
          body="$(printf '%s\n\n```\n%s\n```\n\nDetected by %s\n' \
            'The Forgejo disaster-recovery mirror is not healthy.' "$report" "$RUN_URL")"
          existing="$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "Updated existing alarm issue #$existing"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi

      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forgejo-liveness-report
          path: liveness-report.txt
          if-no-files-found: warn

name: PG18 Qualification Canary

# NON-REQUIRED qualification canary — manual dispatch only, never part of the
# `Merge Gate` / `Full Merge Gate` required contexts.
#
# Production CNPG pins PostgreSQL 17.10 (infra/kubernetes/base/cnpg/
# cluster.yaml), so the canonical CI gates run the matching
# pgvector/pgvector:pg17 service image. The PG18 cutover is a held,
# operator-gated ladder (docs/CNPG_POSTGRES_18_QUALIFICATION.md) blocked on
# Kubernetes 1.34; this dispatch runs the full backend lint+test matrix
# against pg18 so the ladder can qualify application behavior (e.g. the
# SQLSTATE 23001-vs-23503 ON DELETE RESTRICT skew that bit during #878)
# ahead of the actual cutover.

on:
  workflow_dispatch:
    inputs:
      postgres_image:
        description: 'Approved pgvector/pgvector:pg18 image with its sha256 digest'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pg18-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.validate.outputs.image }}
    steps:
      - name: Require an approved immutable PostgreSQL 18 image
        id: validate
        env:
          POSTGRES_IMAGE: ${{ inputs.postgres_image }}
        run: |
          set -euo pipefail
          if [[ ! "$POSTGRES_IMAGE" =~ ^pgvector/pgvector:pg18@sha256:[a-f0-9]{64}$ ]]; then
            echo '::error::An approved PostgreSQL 18 image digest is required'
            exit 1
          fi
          printf 'image=%s\n' "$POSTGRES_IMAGE" >> "$GITHUB_OUTPUT"

  backend-on-pg18:
    name: Backend lint + tests on PostgreSQL 18 (canary)
    needs: validate-image
    uses: ./.github/workflows/_reusable-backend-lint-test.yml
    with:
      postgres_image: ${{ needs.validate-image.outputs.image }}
      notification_label: PG18 canary

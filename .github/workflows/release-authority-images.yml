name: Release Container Images

# Builds, signs, SBOMs, scans, and publishes container images for the
# backend (Node/Express API), admin (Next.js), and staff-web (Flutter web)
# apps. These images are
# consumed by the on-prem 3-node RKE2 cluster via ArgoCD: digest pins live in
# `infra/kubernetes/apps/kustomization.yaml` (written by
# scripts/update-prod-digests.mjs) and an operator syncs the vhhealth-apps
# Application manually — a committed bump deploys nothing on its own.
#
# Triggers:
#   - workflow_dispatch on main    → publish the already-parity-verified input tag
#
# Image registry:
#   ghcr.io/<lowercase-owner>/vh-health-platform-backend
#   ghcr.io/<lowercase-owner>/vh-health-platform-adminportal
#   ghcr.io/<lowercase-owner>/vhhealth-staff-web
# These platform-scoped package names deliberately avoid the archived
# pre-monorepo backend/admin repositories and keep GHCR ownership attached to
# `Bahuleyandr/VH-Health-Platform`.
# Signing:        keyless cosign via GitHub OIDC (no KMS key required)
# SBOM:           SPDX via anchore/sbom-action (uploaded as GH artifact)
# Scanning:       Trivy (fails build on fixable CRITICAL/HIGH vulns)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing mirrored release tag, for example backend-v1.2.3'
        required: true
        type: string
      build_backend:
        description: 'Build backend image'
        required: false
        default: 'true'
        type: boolean
      build_admin:
        description: 'Build admin image'
        required: false
        default: 'true'
        type: boolean
      build_staff_web:
        description: 'Build staff Flutter web image'
        required: false
        default: 'true'
        type: boolean

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  RELEASE_SCAN_PLATFORM: linux/amd64

jobs:
  release-authority:
    name: Verify release authority
    runs-on: ubuntu-latest
    environment: release-authority-main
    permissions:
      contents: read
    outputs:
      authorized: ${{ steps.authority.outputs.authorized }}
      state: ${{ steps.authority.outputs.state }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Check provider, mirror, signer, tag, and Argo parity
        id: authority
        env:
          RELEASE_AUTHORITY_GITHUB_TOKEN: ${{ github.token }}
          RELEASE_AUTHORITY_FORGEJO_TOKEN: ${{ secrets.RELEASE_AUTHORITY_FORGEJO_TOKEN }}
          RELEASE_AUTHORITY_ARGO_API_URL: ${{ vars.RELEASE_AUTHORITY_ARGO_API_URL }}
          RELEASE_AUTHORITY_ARGO_TOKEN: ${{ secrets.RELEASE_AUTHORITY_ARGO_TOKEN }}
          RELEASE_AUTHORITY_TAG: ${{ inputs.release_tag }}
        run: |
          args=(
            --provider github
            --intent image-release
            --commit "$GITHUB_SHA"
            --event "$GITHUB_EVENT_NAME"
            --ref "$GITHUB_REF"
            --evidence-file output/release-authority/github-release-images.json
          )
          if [ -n "${RELEASE_AUTHORITY_TAG:-}" ]; then args+=(--tag "$RELEASE_AUTHORITY_TAG"); fi
          node scripts/check-release-authority.mjs "${args[@]}"

      - name: Upload release-authority evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-authority-github-images-${{ github.run_id }}
          path: output/release-authority
          if-no-files-found: error

  build-backend:
    name: Build + sign backend image
    runs-on: ubuntu-latest
    environment: release-authority-main
    timeout-minutes: 45
    needs: release-authority
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    # Publish backend images only for backend release tags or explicit manual dispatch.
    if: |
      needs.release-authority.outputs.authorized == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      startsWith(inputs.release_tag, 'backend-v') &&
      inputs.build_backend
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}
      trivy-critical: ${{ steps.trivy-summary.outputs.critical }}
      trivy-high: ${{ steps.trivy-summary.outputs.high }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names
        id: images
        run: |
          owner_lc="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "backend=${REGISTRY}/${owner_lc}/vh-health-platform-backend" >> "$GITHUB_OUTPUT"
          echo "admin=${REGISTRY}/${owner_lc}/vh-health-platform-adminportal" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.images.outputs.backend }}
          tags: |
            type=raw,value=${{ inputs.release_tag }}
            type=raw,value=latest-backend
          labels: |
            org.opencontainers.image.title=VH Health Backend
            org.opencontainers.image.description=Node/Express API for VH Health platform
            org.opencontainers.image.vendor=VH Health
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          provenance: true
          sbom: true
          build-args: |
            NODE_IMAGE=node:26.5.0-alpine@sha256:e88a35be04478413b7c71c455cd9865de9b9360e1f43456be5951032d7ac1a66

      - name: Prune local Docker cache before release analysis
        run: |
          docker buildx prune -af || true
          docker system prune -af --volumes || true
          df -h

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.images.outputs.backend }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: vh-health-backend-sbom.spdx.json
          output-file: vh-health-backend-sbom.spdx.json
          upload-artifact: true

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.70.0
          cache: true

      - name: Scan image with Trivy
        env:
          IMAGE_REF: ${{ steps.images.outputs.backend }}@${{ steps.build.outputs.digest }}
        run: |
          mkdir -p .cache/trivy
          trivy image \
            --platform "${RELEASE_SCAN_PLATFORM}" \
            --scanners vuln \
            --format sarif \
            --output trivy-backend.sarif \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            --vuln-type os,library \
            --cache-dir .cache/trivy \
            "${IMAGE_REF}"

      - name: Upload Trivy SARIF to GitHub Security
        if: always() && hashFiles('trivy-backend.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Summarise Trivy counts
        id: trivy-summary
        if: always()
        run: |
          if [ -f trivy-backend.sarif ]; then
            critical=$(jq '[.runs[].results[] | ((.properties."security-severity"? // "0") | tonumber? // 0) as $sev | select($sev >= 9.0)] | length' trivy-backend.sarif)
            high=$(jq '[.runs[].results[] | ((.properties."security-severity"? // "0") | tonumber? // 0) as $sev | select($sev >= 7.0 and $sev < 9.0)] | length' trivy-backend.sarif)
          else
            critical=0
            high=0
          fi
          echo "critical=${critical:-0}" >> "$GITHUB_OUTPUT"
          echo "high=${high:-0}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Sign image with cosign (keyless OIDC)
        env:
          COSIGN_EXPERIMENTAL: 'true'
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Sign every tag at the same digest — one signature per tag ref.
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "::group::cosign sign ${tag}@${DIGEST}"
            cosign sign --yes "${tag}@${DIGEST}"
            echo "::endgroup::"
          done <<< "$TAGS"

      - name: Verify cosign signature (WS3 B3.5 supply-chain gate)
        # Verify that the signature we just recorded is readable from the
        # registry before declaring the build complete. This catches any
        # keyless-OIDC / Rekor transparency-log failure immediately in CI
        # rather than at deploy time.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.images.outputs.backend }}
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/\.github/workflows/release-authority-images\.yml@.*$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}"
          echo "cosign verify passed for ${IMAGE}@${DIGEST}"

      # Audit finding #20: persist the just-built digest so the digest-pin
      # workflow pins exactly this image instead of re-resolving the mutable
      # tag. Runs only after cosign sign + verify succeeded.
      - name: Publish build-emitted image ref (digest-pin provenance)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.images.outputs.backend }}
        run: |
          mkdir -p output/image-ref
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > output/image-ref/image-ref.txt

      - name: Upload build-emitted image ref
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-ref-backend-${{ inputs.release_tag }}
          path: output/image-ref/image-ref.txt

      - name: Write build summary
        if: always()
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
          CRITICAL: ${{ steps.trivy-summary.outputs.critical }}
          HIGH: ${{ steps.trivy-summary.outputs.high }}
        run: |
          {
            echo "## Backend image"
            echo ""
            echo "**Digest:** \`${DIGEST}\`"
            echo ""
            echo "**Tags pushed:**"
            echo ""
            echo '```'
            echo "${TAGS}"
            echo '```'
            echo ""
            echo "**Trivy findings (${RELEASE_SCAN_PLATFORM}):** ${CRITICAL:-0} CRITICAL / ${HIGH:-0} HIGH (fixable only)"
            echo ""
            echo "**SBOM:** attached as workflow artifact \`vh-health-backend-sbom.spdx.json\`"
            echo ""
            echo "**Signed + verified:** cosign keyless via GitHub OIDC"
          } >> "$GITHUB_STEP_SUMMARY"

  build-admin:
    name: Build + sign admin image
    runs-on: ubuntu-latest
    environment: release-authority-main
    timeout-minutes: 45
    needs: release-authority
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    # Publish admin images only for admin release tags or explicit manual dispatch.
    if: |
      needs.release-authority.outputs.authorized == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      startsWith(inputs.release_tag, 'admin-v') &&
      inputs.build_admin
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}
      trivy-critical: ${{ steps.trivy-summary.outputs.critical }}
      trivy-high: ${{ steps.trivy-summary.outputs.high }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names
        id: images
        run: |
          owner_lc="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "backend=${REGISTRY}/${owner_lc}/vh-health-platform-backend" >> "$GITHUB_OUTPUT"
          echo "admin=${REGISTRY}/${owner_lc}/vh-health-platform-adminportal" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.images.outputs.admin }}
          tags: |
            type=raw,value=${{ inputs.release_tag }}
            type=raw,value=latest-admin
          labels: |
            org.opencontainers.image.title=VH Health Admin Portal
            org.opencontainers.image.description=Next.js admin portal for VH Health platform
            org.opencontainers.image.vendor=VH Health
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push admin image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./apps/admin
          file: ./apps/admin/Dockerfile
          # Expose the backend dir as a named context so the Dockerfile can pull
          # the canonical OpenAPI spec for the admin build's generate:types step.
          build-contexts: |
            backend=./apps/backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,scope=admin,mode=max
          provenance: true
          sbom: true
          # Admin is a Next.js app — NEXT_PUBLIC_* are baked into the client
          # bundle at build time. Override via repo-level variables for
          # staging/prod rebuilds; secrets in vars keep values non-sensitive.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.vhhealth.app' }}
            NEXT_PUBLIC_APP_NAME=${{ vars.NEXT_PUBLIC_APP_NAME || 'VH Health Admin' }}
            NEXT_PUBLIC_ALLOWED_ORIGIN=${{ vars.NEXT_PUBLIC_ALLOWED_ORIGIN || 'https://admin.vhhealth.app' }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.SENTRY_DSN_ADMIN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=${{ vars.SENTRY_ENVIRONMENT || 'production' }}
            NEXT_PUBLIC_SENTRY_RELEASE=${{ github.sha }}
            NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE=${{ vars.SENTRY_TRACES_SAMPLE_RATE || '0.1' }}
            NEXT_PUBLIC_SENTRY_REPLAY_SESSION_SAMPLE_RATE=${{ vars.NEXT_PUBLIC_SENTRY_REPLAY_SESSION_SAMPLE_RATE || '0' }}
            NEXT_PUBLIC_SENTRY_REPLAY_ERROR_SAMPLE_RATE=${{ vars.NEXT_PUBLIC_SENTRY_REPLAY_ERROR_SAMPLE_RATE || '0' }}

      - name: Prune local Docker cache before release analysis
        run: |
          docker buildx prune -af || true
          docker system prune -af --volumes || true
          df -h

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.images.outputs.admin }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: vh-health-adminportal-sbom.spdx.json
          output-file: vh-health-adminportal-sbom.spdx.json
          upload-artifact: true

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.70.0
          cache: true

      - name: Scan image with Trivy
        env:
          IMAGE_REF: ${{ steps.images.outputs.admin }}@${{ steps.build.outputs.digest }}
        run: |
          mkdir -p .cache/trivy
          trivy image \
            --platform "${RELEASE_SCAN_PLATFORM}" \
            --scanners vuln \
            --format sarif \
            --output trivy-admin.sarif \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            --vuln-type os,library \
            --cache-dir .cache/trivy \
            "${IMAGE_REF}"

      - name: Upload Trivy SARIF to GitHub Security
        if: always() && hashFiles('trivy-admin.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: trivy-admin.sarif
          category: trivy-admin

      - name: Summarise Trivy counts
        id: trivy-summary
        if: always()
        run: |
          if [ -f trivy-admin.sarif ]; then
            critical=$(jq '[.runs[].results[] | ((.properties."security-severity"? // "0") | tonumber? // 0) as $sev | select($sev >= 9.0)] | length' trivy-admin.sarif)
            high=$(jq '[.runs[].results[] | ((.properties."security-severity"? // "0") | tonumber? // 0) as $sev | select($sev >= 7.0 and $sev < 9.0)] | length' trivy-admin.sarif)
          else
            critical=0
            high=0
          fi
          echo "critical=${critical:-0}" >> "$GITHUB_OUTPUT"
          echo "high=${high:-0}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Sign image with cosign (keyless OIDC)
        env:
          COSIGN_EXPERIMENTAL: 'true'
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "::group::cosign sign ${tag}@${DIGEST}"
            cosign sign --yes "${tag}@${DIGEST}"
            echo "::endgroup::"
          done <<< "$TAGS"

      - name: Verify cosign signature (WS3 B3.5 supply-chain gate)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.images.outputs.admin }}
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/\.github/workflows/release-authority-images\.yml@.*$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}"
          echo "cosign verify passed for ${IMAGE}@${DIGEST}"

      # Audit finding #20: persist the just-built digest so the digest-pin
      # workflow pins exactly this image instead of re-resolving the mutable
      # tag. Runs only after cosign sign + verify succeeded.
      - name: Publish build-emitted image ref (digest-pin provenance)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.images.outputs.admin }}
        run: |
          mkdir -p output/image-ref
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > output/image-ref/image-ref.txt

      - name: Upload build-emitted image ref
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-ref-admin-${{ inputs.release_tag }}
          path: output/image-ref/image-ref.txt

      - name: Write build summary
        if: always()
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
          CRITICAL: ${{ steps.trivy-summary.outputs.critical }}
          HIGH: ${{ steps.trivy-summary.outputs.high }}
        run: |
          {
            echo "## Admin image"
            echo ""
            echo "**Digest:** \`${DIGEST}\`"
            echo ""
            echo "**Tags pushed:**"
            echo ""
            echo '```'
            echo "${TAGS}"
            echo '```'
            echo ""
            echo "**Trivy findings (${RELEASE_SCAN_PLATFORM}):** ${CRITICAL:-0} CRITICAL / ${HIGH:-0} HIGH (fixable only)"
            echo ""
            echo "**SBOM:** attached as workflow artifact \`vh-health-adminportal-sbom.spdx.json\`"
            echo ""
            echo "**Signed + verified:** cosign keyless via GitHub OIDC"
          } >> "$GITHUB_STEP_SUMMARY"

  build-staff-web:
    name: Build + sign staff web image
    runs-on: ubuntu-latest
    environment: release-authority-main
    timeout-minutes: 60
    needs: release-authority
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    # Publish staff-web images only for staff-web release tags or explicit manual dispatch.
    if: |
      needs.release-authority.outputs.authorized == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      startsWith(inputs.release_tag, 'staff-web-v') &&
      inputs.build_staff_web
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}
      trivy-critical: ${{ steps.trivy-summary.outputs.critical }}
      trivy-high: ${{ steps.trivy-summary.outputs.high }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names
        id: images
        run: |
          owner_lc="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "staff_web=${REGISTRY}/${owner_lc}/vhhealth-staff-web" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.images.outputs.staff_web }}
          tags: |
            type=raw,value=${{ inputs.release_tag }}
            type=raw,value=latest-staff-web
          labels: |
            org.opencontainers.image.title=VH Health Staff Web
            org.opencontainers.image.description=Flutter web staff app for LAN-only Clinical AI rollout
            org.opencontainers.image.vendor=VH Health
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push staff web image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./apps/staff/Dockerfile.web
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=staff-web
          cache-to: type=gha,scope=staff-web,mode=max
          provenance: true
          sbom: true
          build-args: |
            VH_BASE_URL=${{ vars.STAFF_WEB_API_URL || 'https://api.vhhealth.app/api/v1' }}
            API_KEY=${{ vars.STAFF_WEB_API_KEY }}
            APP_NAME=${{ vars.STAFF_WEB_APP_NAME || 'VH Health Staff' }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN_STAFF }}
            SENTRY_ENVIRONMENT=${{ vars.SENTRY_ENVIRONMENT || 'production' }}
            SENTRY_RELEASE=${{ github.sha }}
            VH_RECAPTCHA_SITE_KEY=${{ secrets.VH_RECAPTCHA_SITE_KEY }}
            VH_FIREBASE_WEB_API_KEY=${{ secrets.VH_FIREBASE_WEB_API_KEY }}

      - name: Prune local Docker cache before release analysis
        run: |
          docker buildx prune -af || true
          docker system prune -af --volumes || true
          df -h

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.images.outputs.staff_web }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: vhhealth-staff-web-sbom.spdx.json
          output-file: vhhealth-staff-web-sbom.spdx.json
          upload-artifact: true

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.70.0
          cache: true

      - name: Scan image with Trivy
        env:
          IMAGE_REF: ${{ steps.images.outputs.staff_web }}@${{ steps.build.outputs.digest }}
        run: |
          mkdir -p .cache/trivy
          trivy image \
            --platform "${RELEASE_SCAN_PLATFORM}" \
            --scanners vuln \
            --format sarif \
            --output trivy-staff-web.sarif \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            --vuln-type os,library \
            --cache-dir .cache/trivy \
            "${IMAGE_REF}"

      - name: Upload Trivy SARIF to GitHub Security
        if: always() && hashFiles('trivy-staff-web.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: trivy-staff-web.sarif
          category: trivy-staff-web

      - name: Summarise Trivy counts
        id: trivy-summary
        if: always()
        run: |
          if [ -f trivy-staff-web.sarif ]; then
            critical=$(jq '[.runs[].results[] | ((.properties."security-severity"? // "0") | tonumber? // 0) as $sev | select($sev >= 9.0)] | length' trivy-staff-web.sarif)
            high=$(jq '[.runs[].results[] | ((.properties."security-severity"? // "0") | tonumber? // 0) as $sev | select($sev >= 7.0 and $sev < 9.0)] | length' trivy-staff-web.sarif)
          else
            critical=0
            high=0
          fi
          echo "critical=${critical:-0}" >> "$GITHUB_OUTPUT"
          echo "high=${high:-0}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Sign image with cosign (keyless OIDC)
        env:
          COSIGN_EXPERIMENTAL: 'true'
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "::group::cosign sign ${tag}@${DIGEST}"
            cosign sign --yes "${tag}@${DIGEST}"
            echo "::endgroup::"
          done <<< "$TAGS"

      - name: Verify cosign signature (WS3 B3.5 supply-chain gate)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.images.outputs.staff_web }}
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/\.github/workflows/release-authority-images\.yml@.*$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}"
          echo "cosign verify passed for ${IMAGE}@${DIGEST}"

      # Audit finding #20: persist the just-built digest so the digest-pin
      # workflow pins exactly this image instead of re-resolving the mutable
      # tag. Runs only after cosign sign + verify succeeded.
      - name: Publish build-emitted image ref (digest-pin provenance)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.images.outputs.staff_web }}
        run: |
          mkdir -p output/image-ref
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > output/image-ref/image-ref.txt

      - name: Upload build-emitted image ref
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-ref-staff-web-${{ inputs.release_tag }}
          path: output/image-ref/image-ref.txt

      - name: Write build summary
        if: always()
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
          CRITICAL: ${{ steps.trivy-summary.outputs.critical }}
          HIGH: ${{ steps.trivy-summary.outputs.high }}
        run: |
          {
            echo "## Staff web image"
            echo ""
            echo "**Digest:** \`${DIGEST}\`"
            echo ""
            echo "**Tags pushed:**"
            echo ""
            echo '```'
            echo "${TAGS}"
            echo '```'
            echo ""
            echo "**Trivy findings (${RELEASE_SCAN_PLATFORM}):** ${CRITICAL:-0} CRITICAL / ${HIGH:-0} HIGH (fixable only)"
            echo ""
            echo "**SBOM:** attached as workflow artifact \`vhhealth-staff-web-sbom.spdx.json\`"
            echo ""
            echo "**Signed + verified:** cosign keyless via GitHub OIDC"
          } >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: Release summary
    runs-on: ubuntu-latest
    needs: [build-backend, build-admin, build-staff-web]
    if: always() && (needs.build-backend.result == 'success' || needs.build-admin.result == 'success' || needs.build-staff-web.result == 'success')
    steps:
      - name: Generate deploy instructions
        env:
          OWNER: ${{ github.repository_owner }}
          REF: ${{ inputs.release_tag }}
          BACKEND_DIGEST: ${{ needs.build-backend.outputs.image-digest }}
          BACKEND_TAGS: ${{ needs.build-backend.outputs.image-tags }}
          BACKEND_RESULT: ${{ needs.build-backend.result }}
          BACKEND_CRITICAL: ${{ needs.build-backend.outputs.trivy-critical }}
          BACKEND_HIGH: ${{ needs.build-backend.outputs.trivy-high }}
          ADMIN_DIGEST: ${{ needs.build-admin.outputs.image-digest }}
          ADMIN_TAGS: ${{ needs.build-admin.outputs.image-tags }}
          ADMIN_RESULT: ${{ needs.build-admin.result }}
          ADMIN_CRITICAL: ${{ needs.build-admin.outputs.trivy-critical }}
          ADMIN_HIGH: ${{ needs.build-admin.outputs.trivy-high }}
          STAFF_WEB_DIGEST: ${{ needs.build-staff-web.outputs.image-digest }}
          STAFF_WEB_TAGS: ${{ needs.build-staff-web.outputs.image-tags }}
          STAFF_WEB_RESULT: ${{ needs.build-staff-web.result }}
          STAFF_WEB_CRITICAL: ${{ needs.build-staff-web.outputs.trivy-critical }}
          STAFF_WEB_HIGH: ${{ needs.build-staff-web.outputs.trivy-high }}
        run: |
          owner_lc="$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "# VH Health image release — ${REF}"
            echo ""
            echo "| Image | Result | Digest | Trivy ${RELEASE_SCAN_PLATFORM} (CRITICAL/HIGH, fixable) |"
            echo "| --- | --- | --- | --- |"
            echo "| \`ghcr.io/${owner_lc}/vh-health-platform-backend\` | ${BACKEND_RESULT} | \`${BACKEND_DIGEST:-n/a}\` | ${BACKEND_CRITICAL:-0} / ${BACKEND_HIGH:-0} |"
            echo "| \`ghcr.io/${owner_lc}/vh-health-platform-adminportal\` | ${ADMIN_RESULT} | \`${ADMIN_DIGEST:-n/a}\` | ${ADMIN_CRITICAL:-0} / ${ADMIN_HIGH:-0} |"
            echo "| \`ghcr.io/${owner_lc}/vhhealth-staff-web\` | ${STAFF_WEB_RESULT} | \`${STAFF_WEB_DIGEST:-n/a}\` | ${STAFF_WEB_CRITICAL:-0} / ${STAFF_WEB_HIGH:-0} |"
            echo ""
            echo "## Tags pushed"
            echo ""
            echo "### Backend"
            echo '```'
            echo "${BACKEND_TAGS:-<no tags>}"
            echo '```'
            echo ""
            echo "### Admin"
            echo '```'
            echo "${ADMIN_TAGS:-<no tags>}"
            echo '```'
            echo ""
            echo "### Staff web"
            echo '```'
            echo "${STAFF_WEB_TAGS:-<no tags>}"
            echo '```'
            echo ""
            echo "## Deploy (bump ArgoCD-tracked digests)"
            echo ""
            echo "App-tier digest pins live in \`infra/kubernetes/apps/kustomization.yaml\` (NOT the prod overlay — see the H11 note there). They are written by \`scripts/update-prod-digests.mjs\`, which cross-checks the tag→digest binding and cosign-verifies the signed ref before rewriting the pins:"
            echo ""
            echo '```bash'
            echo "COSIGN_PUBLIC_KEY=<public key> node scripts/update-prod-digests.mjs \\"
            echo "  --tag ${REF} --expected-digest ${BACKEND_DIGEST:-<from this run>}"
            echo "git diff --binary -- infra/kubernetes/apps/kustomization.yaml > release-digest-pin.patch"
            echo '```'
            echo ""
            echo "The governed pin workflows upload that verification evidence and patch for a reviewed branch/PR; no workflow pushes directly to main."
            echo ""
            echo "Prod sync is MANUAL — no Application has automated sync, so the committed bump stays inert until an operator syncs it:"
            echo ""
            echo '```bash'
            echo "argocd app sync vhhealth-apps"
            echo '```'
            echo ""
            echo "## Verify signatures (on the cluster or locally)"
            echo ""
            echo '```bash'
            echo "cosign verify \\"
            echo "  --certificate-identity-regexp='https://github.com/${{ github.repository }}/.github/workflows/release-authority-images.yml@.*' \\"
            echo "  --certificate-oidc-issuer=https://token.actions.githubusercontent.com \\"
            echo "  ghcr.io/${owner_lc}/vh-health-platform-backend@${BACKEND_DIGEST:-<digest>}"
            echo ""
            echo "cosign verify \\"
            echo "  --certificate-identity-regexp='https://github.com/${{ github.repository }}/.github/workflows/release-authority-images.yml@.*' \\"
            echo "  --certificate-oidc-issuer=https://token.actions.githubusercontent.com \\"
            echo "  ghcr.io/${owner_lc}/vhhealth-staff-web@${STAFF_WEB_DIGEST:-<digest>}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

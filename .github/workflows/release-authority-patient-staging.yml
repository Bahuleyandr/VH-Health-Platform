name: Deploy Patient App — Staging

# Builds a profile-mode APK from a protected-main dispatch and uploads to Firebase App Distribution
# under the "staging-testers" group. Skips the upload gracefully when the
# FIREBASE_APP_ID_PATIENT / FIREBASE_TOKEN secrets aren't set — the build
# still runs so we catch release-mode breakage.
#
# Profile (not debug, not release): Crashlytics is gated OFF in debug builds
# (kDebugMode), so debug APKs would leave staging testers without crash
# reporting. Profile builds are AOT-compiled with kDebugMode=false, so
# Crashlytics stays active — and they are debug-signed automatically, so this
# lane keeps building without the release keystore secrets (a release build
# hard-fails via the build.gradle.kts taskGraph guard when key.properties is
# absent).
#
# Production (Play Store / TestFlight) is a separate manual-approve workflow
# gated on a git tag.
#
# Monorepo changes vs. the original standalone-repo workflow:
#   - No secondary checkout of vhhealth-core — it lives at packages/vhhealth_core.
#   - No sed-rewrite of the path dep — the pub workspace resolves it by name.
#   - Melos bootstrap runs at the repo root before the per-app build.
#   - Distribution is manual while release authority is held.

on:
  workflow_dispatch:

concurrency:
  group: deploy-patient-staging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-authority:
    name: Verify release authority
    runs-on: ubuntu-latest
    environment: release-authority-main
    permissions:
      contents: read
    outputs:
      authorized: ${{ steps.authority.outputs.authorized }}
      state: ${{ steps.authority.outputs.state }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Check provider, mirror, signer, commit, and Argo parity
        id: authority
        env:
          RELEASE_AUTHORITY_GITHUB_TOKEN: ${{ github.token }}
          RELEASE_AUTHORITY_FORGEJO_TOKEN: ${{ secrets.RELEASE_AUTHORITY_FORGEJO_TOKEN }}
          RELEASE_AUTHORITY_ARGO_API_URL: ${{ vars.RELEASE_AUTHORITY_ARGO_API_URL }}
          RELEASE_AUTHORITY_ARGO_TOKEN: ${{ secrets.RELEASE_AUTHORITY_ARGO_TOKEN }}
        run: >
          node scripts/check-release-authority.mjs
          --provider github
          --intent staging
          --commit "$GITHUB_SHA"
          --event "$GITHUB_EVENT_NAME"
          --ref "$GITHUB_REF"
          --evidence-file output/release-authority/github-patient-staging.json

      - name: Upload release-authority evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-authority-github-patient-staging-${{ github.run_id }}
          path: output/release-authority
          if-no-files-found: error

  build-and-distribute:
    runs-on: ubuntu-latest
    environment: release-authority-main
    timeout-minutes: 30
    needs: release-authority
    if: needs.release-authority.outputs.authorized == 'true'
    # Minimum-version signing trust must be stamped on EVERY patient artifact
    # this repo produces, not just tagged releases.
    #
    # `MinimumVersionPolicyTrust.fromBuild()` reads these four dart-defines and
    # deliberately has no repository default, so an APK built without them
    # carries an EMPTY trust map and can never verify the signed
    # `minimum_version_policy` envelope that GET /api/v1/config serves. Against
    # a backend that has the gate switched on, such a build burns the 24h
    # bootstrap grace and then blocks every staging tester at the splash screen
    # — SOS included. Same four values as release-patient.yml, same repository
    # variables, so staging and release trust the same operator-owned keys.
    env:
      PATIENT_MIN_VERSION_CURRENT_KEY_ID: ${{ vars.PATIENT_MIN_VERSION_CURRENT_KEY_ID }}
      PATIENT_MIN_VERSION_CURRENT_PUBLIC_KEY_BASE64: ${{ vars.PATIENT_MIN_VERSION_CURRENT_PUBLIC_KEY_BASE64 }}
      PATIENT_MIN_VERSION_NEXT_KEY_ID: ${{ vars.PATIENT_MIN_VERSION_NEXT_KEY_ID }}
      PATIENT_MIN_VERSION_NEXT_PUBLIC_KEY_BASE64: ${{ vars.PATIENT_MIN_VERSION_NEXT_PUBLIC_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Node runs the codegen driver below (scripts/codegen.mjs). Pinned to the
      # repo-standard version rather than relying on whatever the ubuntu-latest
      # image ships.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.5.0'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Pinned to the workspace toolchain (_reusable-flutter-workspace.yml + ci.yml) — bump all together.
          flutter-version: 3.44.0
          cache: true

      # GitHub-hosted runner images do not put `sdkmanager` on PATH, so the
      # API 37 install below exited 127 ("sdkmanager: command not found").
      # Provision the Android command-line tools explicitly and accept the SDK
      # licences non-interactively. MUST stay ahead of every sdkmanager and
      # Gradle/flutter-build step in this job.
      - name: Provision Android command-line tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # 15859902 == cmdline-tools 22.0, the build `cmdline-tools;latest`
          # currently resolves to. Pinned by build number rather than tracking
          # a moving channel — and it must not age backwards either:
          # `platforms;android-37.0` is absent from the v1 SDK repository index
          # and only resolvable by an sdkmanager that reads the v3 index.
          cmdline-tools-version: '15859902'
          # platform-tools only. The API 37 platform and build-tools stay
          # pinned in the step below, which remains the single place naming
          # them.
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android API 37 toolchain
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Activate Melos
        run: dart pub global activate melos 8.2.2

      - name: Bootstrap workspace
        run: |
          dart pub get
          melos bootstrap

      # Must run AFTER bootstrap (build_runner is resolved by the workspace)
      # and BEFORE the build: the generated client lib/api/generated/** is
      # gitignored and absent on a fresh clone, yet the tracked barrel
      # lib/api/vhhealth_api.dart re-exports it and lib/services/** imports
      # generated symbols, so the app only compiles once codegen has run.
      # melos run codegen invokes `node scripts/codegen.mjs`, which needs Node
      # (set up above) and dart (from subosito/flutter-action above).
      - name: Codegen (regenerate Dart client from synced spec)
        run: melos run codegen

      # Same validator release-patient.yml runs. Exits 0 with "HELD" when all
      # four are unset (the approved pre-activation state), and fails the build
      # on a half-configured or malformed pair rather than shipping an APK that
      # silently trusts nothing.
      - name: Validate patient minimum-version signing trust
        run: |
          set -euo pipefail
          node scripts/validate-patient-minimum-version-trust.mjs \
            --current-key-id "${PATIENT_MIN_VERSION_CURRENT_KEY_ID}" \
            --current-public-key "${PATIENT_MIN_VERSION_CURRENT_PUBLIC_KEY_BASE64}" \
            --next-key-id "${PATIENT_MIN_VERSION_NEXT_KEY_ID}" \
            --next-public-key "${PATIENT_MIN_VERSION_NEXT_PUBLIC_KEY_BASE64}"

      # An EMPTY value is safe for these four specifically (unlike the tenant
      # and Firebase defines): MinimumVersionPolicyTrust skips a pair whose id
      # and key are both empty, so an unset variable stamps "no trust anchor"
      # rather than a bogus one.
      - name: Build profile APK
        working-directory: apps/patient
        run: >
          flutter build apk --profile --split-per-abi
          --dart-define=VH_PATIENT_MIN_VERSION_CURRENT_KEY_ID="${PATIENT_MIN_VERSION_CURRENT_KEY_ID}"
          --dart-define=VH_PATIENT_MIN_VERSION_CURRENT_PUBLIC_KEY_BASE64="${PATIENT_MIN_VERSION_CURRENT_PUBLIC_KEY_BASE64}"
          --dart-define=VH_PATIENT_MIN_VERSION_NEXT_KEY_ID="${PATIENT_MIN_VERSION_NEXT_KEY_ID}"
          --dart-define=VH_PATIENT_MIN_VERSION_NEXT_PUBLIC_KEY_BASE64="${PATIENT_MIN_VERSION_NEXT_PUBLIC_KEY_BASE64}"

      - name: Check Firebase credentials
        id: fb
        run: |
          if [ -z "${{ secrets.FIREBASE_APP_ID_PATIENT }}" ] || [ -z "${{ secrets.FIREBASE_TOKEN }}" ]; then
            echo "Firebase App Distribution secrets missing — skipping upload."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload to Firebase App Distribution
        if: steps.fb.outputs.skip == 'false'
        uses: wzieba/Firebase-Distribution-Github-Action@bd494989dd4bec0343f78adee87fe66e48279ad6 # v1.7.1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_PATIENT }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: staging-testers
          releaseNotes: |
            Patient ${{ github.sha }} on ${{ github.ref_name }}
          file: apps/patient/build/app/outputs/flutter-apk/app-armeabi-v7a-profile.apk

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WORKFLOW_REF_NAME: ${{ github.ref_name }}
          WORKFLOW_SERVER_URL: ${{ github.server_url }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not configured — skipping notification."
            exit 0
          fi
          payload="$(jq -n --arg content "🔴 **Patient App staging deploy failed** on \`${WORKFLOW_REF_NAME}\`
          ${WORKFLOW_SERVER_URL}/${WORKFLOW_REPOSITORY}/actions/runs/${WORKFLOW_RUN_ID}" '{content: $content}')"
          curl -s -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_WEBHOOK_URL" || true

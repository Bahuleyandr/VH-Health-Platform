name: Deploy staging

# Manual-only staging preparation. This workflow resolves already-built,
# signed, and scanned release image tags into immutable digests, emits a
# reviewable patch for the staging app overlay, and validates the staging
# kustomize trees. It neither pushes main nor mutates a cluster.

on:
  workflow_dispatch:
    inputs:
      backend_tag:
        description: "Existing backend image tag from release-authority-images.yml, e.g. backend-v1.2.3"
        required: true
        type: string
      admin_tag:
        description: "Existing admin image tag from release-authority-images.yml, e.g. admin-v1.2.3"
        required: true
        type: string
      staff_web_tag:
        description: "Existing staff web image tag from release-authority-images.yml, e.g. staff-web-v1.2.3"
        required: true
        type: string

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  release-authority:
    name: Verify release authority
    runs-on: ubuntu-latest
    environment: release-authority-main
    permissions:
      contents: read
    outputs:
      authorized: ${{ steps.authority.outputs.authorized }}
      state: ${{ steps.authority.outputs.state }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Check provider, mirror, signer, release tags, and Argo parity
        id: authority
        env:
          RELEASE_AUTHORITY_GITHUB_TOKEN: ${{ github.token }}
          RELEASE_AUTHORITY_FORGEJO_TOKEN: ${{ secrets.RELEASE_AUTHORITY_FORGEJO_TOKEN }}
          RELEASE_AUTHORITY_ARGO_API_URL: ${{ vars.RELEASE_AUTHORITY_ARGO_API_URL }}
          RELEASE_AUTHORITY_ARGO_TOKEN: ${{ secrets.RELEASE_AUTHORITY_ARGO_TOKEN }}
          RELEASE_AUTHORITY_BACKEND_TAG: ${{ inputs.backend_tag }}
          RELEASE_AUTHORITY_ADMIN_TAG: ${{ inputs.admin_tag }}
          RELEASE_AUTHORITY_STAFF_WEB_TAG: ${{ inputs.staff_web_tag }}
        run: >
          node scripts/check-release-authority.mjs
          --provider github
          --intent staging-images
          --tag "$RELEASE_AUTHORITY_BACKEND_TAG"
          --tag "$RELEASE_AUTHORITY_ADMIN_TAG"
          --tag "$RELEASE_AUTHORITY_STAFF_WEB_TAG"
          --event "$GITHUB_EVENT_NAME"
          --ref "$GITHUB_REF"
          --evidence-file output/release-authority/github-deploy-staging.json

      - name: Upload release-authority evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-authority-github-deploy-staging-${{ github.run_id }}
          path: output/release-authority
          if-no-files-found: error

  pin-and-summarize:
    name: Pin staging digests
    runs-on: ubuntu-latest
    environment: release-authority-main
    timeout-minutes: 15
    needs: release-authority
    if: needs.release-authority.outputs.authorized == 'true'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0

      - name: Install kubectl for kubectl kustomize validation
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
        with:
          version: v1.34.1

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Resolve image digests into staging app overlay
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_TAG: ${{ inputs.backend_tag }}
          ADMIN_TAG: ${{ inputs.admin_tag }}
          STAFF_WEB_TAG: ${{ inputs.staff_web_tag }}
          COSIGN_CERTIFICATE_IDENTITY_REGEXP: '^https://github.com/${{ github.repository }}/\.github/workflows/release-authority-images\.yml@.*$'
          COSIGN_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          # Staging overlay only: already-released tags are resolved at pin
          # time (cosign-verified). The script refuses --allow-tag-resolution
          # for the prod tree (audit finding #20) — prod pins require the
          # build-emitted digest from the release run.
          node scripts/update-prod-digests.mjs \
            --kustomization infra/kubernetes/overlays/staging/apps/kustomization.yaml \
            --allow-tag-resolution \
            --tag "${BACKEND_TAG}" \
            --tag "${ADMIN_TAG}" \
            --tag "${STAFF_WEB_TAG}" \
            --evidence-file "output/staging-digest-pins/verified-digests.json"

      - name: Validate staging kustomize paths
        run: |
          kubectl kustomize infra/kubernetes/overlays/staging > /tmp/vhhealth-staging-platform.yaml
          kubectl kustomize infra/kubernetes/overlays/staging/apps > /tmp/vhhealth-staging-apps.yaml

      - name: Create reviewable staging digest patch
        id: commit
        env:
          BACKEND_TAG: ${{ inputs.backend_tag }}
          ADMIN_TAG: ${{ inputs.admin_tag }}
          STAFF_WEB_TAG: ${{ inputs.staff_web_tag }}
        run: |
          if git diff --quiet -- infra/kubernetes/overlays/staging/apps/kustomization.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            mkdir -p output/staging-digest-pins
            printf '' > output/staging-digest-pins/staging-app-digests.patch
            exit 0
          fi

          mkdir -p output/staging-digest-pins
          git diff --binary -- infra/kubernetes/overlays/staging/apps/kustomization.yaml \
            > output/staging-digest-pins/staging-app-digests.patch
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload digest verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-digest-pins
          path: output/staging-digest-pins
          if-no-files-found: ignore

      - name: Write manual deploy summary
        env:
          PIN_SHA: ${{ steps.commit.outputs.sha }}
          CHANGED: ${{ steps.commit.outputs.changed }}
          BACKEND_TAG: ${{ inputs.backend_tag }}
          ADMIN_TAG: ${{ inputs.admin_tag }}
          STAFF_WEB_TAG: ${{ inputs.staff_web_tag }}
        run: |
          {
            echo "# VH Health staging deploy preparation"
            echo ""
            echo "| Input | Tag |"
            echo "| --- | --- |"
            echo "| Backend | \`${BACKEND_TAG}\` |"
            echo "| Admin | \`${ADMIN_TAG}\` |"
            echo "| Staff web | \`${STAFF_WEB_TAG}\` |"
            echo ""
            echo "**Patch base commit:** \`${PIN_SHA}\`"
            echo "**Patch contains changes:** \`${CHANGED}\`"
            echo ""
            echo "The patch is attached as a workflow artifact for a reviewed branch/PR. This workflow did not push main or mutate a cluster."
            echo ""
            echo "## Manual ArgoCD path"
            echo ""
            echo "Run this only after the staging ArgoCD Applications exist and point at the staging paths:"
            echo ""
            echo '```bash'
            echo "argocd app sync vhhealth-platform-staging --revision <reviewed-patch-commit>"
            echo "argocd app sync vhhealth-apps-staging --revision <reviewed-patch-commit>"
            echo "argocd app wait vhhealth-platform-staging vhhealth-apps-staging --health --sync --timeout 900"
            echo '```'
            echo ""
            echo "## Manual kubectl path"
            echo ""
            echo "Run this from a workstation with staging kubeconfig:"
            echo ""
            echo '```bash'
            echo "git fetch origin main"
            echo "git checkout ${PIN_SHA}"
            echo "kubectl apply -k infra/kubernetes/overlays/staging"
            echo "kubectl apply -k infra/kubernetes/overlays/staging/apps"
            echo "kubectl -n vhhealth-platform get pods"
            echo "kubectl -n vhhealth get deploy,po"
            echo '```'
            echo ""
            echo "Rollback instructions are appended in docs/RUNBOOK_ONCALL.md."
          } >> "$GITHUB_STEP_SUMMARY"

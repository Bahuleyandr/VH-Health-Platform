name: Release Patient App

# Builds a release-mode APK + AAB for the patient app and attaches them
# to a GitHub Release. Triggered by tags prefixed `patient-v*`
# (e.g. `patient-v1.2.3`) so patient and staff releases don't collide
# in the monorepo.
#
# Monorepo adaptations vs. the original standalone-repo workflow:
#   - No secondary checkout of vhhealth-core (it's at packages/vhhealth_core).
#   - dart pub get + melos bootstrap at the repo root before the per-app build.
#   - working-directory: apps/patient for flutter build apk/appbundle.
#   - Artifact paths updated to apps/patient/build/app/outputs/...

on:
  push:
    tags: ['patient-v*']
  workflow_dispatch:

concurrency:
  group: release-patient-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VH_BASE_URL: ${{ vars.VH_BASE_URL }}
      VH_API_KEY: ${{ secrets.VH_API_KEY }}
      VH_TENANT_SLUG: ${{ vars.VH_TENANT_SLUG }}
      VH_TENANT_ID: ${{ vars.VH_TENANT_ID }}
      PATIENT_CERT_PIN_HASHES: ${{ vars.PATIENT_CERT_PIN_HASHES }}
      CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS: ${{ vars.CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS }}
      PATIENT_ANDROID_KEYSTORE_BASE64: ${{ secrets.PATIENT_ANDROID_KEYSTORE_BASE64 }}
      PATIENT_ANDROID_KEY_ALIAS: ${{ secrets.PATIENT_ANDROID_KEY_ALIAS }}
      PATIENT_ANDROID_KEY_PASSWORD: ${{ secrets.PATIENT_ANDROID_KEY_PASSWORD }}
      PATIENT_ANDROID_STORE_PASSWORD: ${{ secrets.PATIENT_ANDROID_STORE_PASSWORD }}
      VH_FIREBASE_WEB_API_KEY: ${{ secrets.VH_FIREBASE_WEB_API_KEY }}
      VH_FIREBASE_ANDROID_API_KEY: ${{ secrets.VH_FIREBASE_ANDROID_API_KEY }}
      VH_FIREBASE_IOS_API_KEY: ${{ secrets.VH_FIREBASE_IOS_API_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Node runs the codegen driver below (scripts/codegen.mjs) and the
      # cert-pin validator further down. Pinned to the repo-standard version
      # rather than relying on whatever the ubuntu-latest image ships.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.5.0'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Pinned to the workspace toolchain (_reusable-flutter-workspace.yml + ci.yml) — bump all together.
          flutter-version: 3.44.0
          cache: true

      - name: Install Android API 37 toolchain
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Activate Melos
        run: dart pub global activate melos 8.2.2

      - name: Bootstrap workspace
        run: |
          dart pub get
          melos bootstrap

      # Must run AFTER bootstrap (build_runner is resolved by the workspace)
      # and BEFORE the build: the generated client lib/api/generated/** is
      # gitignored and absent on a fresh clone, yet the tracked barrel
      # lib/api/vhhealth_api.dart re-exports it and lib/services/** imports
      # generated symbols, so the app only compiles once codegen has run.
      # melos run codegen invokes `node scripts/codegen.mjs`, which needs Node
      # (set up above) and dart (from subosito/flutter-action above).
      # Kept ahead of the signing step so a codegen failure cannot burn a tag
      # after the release keystore has already been written to disk.
      - name: Codegen (regenerate Dart client from synced spec)
        run: melos run codegen

      - name: Validate release configuration
        run: |
          set -euo pipefail
          missing=0
          for name in \
            VH_BASE_URL \
            VH_API_KEY \
            PATIENT_CERT_PIN_HASHES \
            CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS \
            PATIENT_ANDROID_KEYSTORE_BASE64 \
            PATIENT_ANDROID_KEY_ALIAS \
            PATIENT_ANDROID_KEY_PASSWORD \
            PATIENT_ANDROID_STORE_PASSWORD \
            VH_FIREBASE_ANDROID_API_KEY
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is required for patient release builds"
              missing=1
            fi
          done
          node scripts/validate-cert-pin-set.mjs \
            --pins "${PATIENT_CERT_PIN_HASHES}" \
            --clock-skew-seconds "${CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS}"
          exit "${missing}"

      # A tenant stamp that disagrees with the deployment the build points at
      # pins the app in a PERMANENT readiness outage (C-D12 5.3), refusing every
      # hospital mutation including SOS against a healthy backend. Two rules:
      #
      #  1. Never stamp an empty define. `--dart-define=VH_TENANT_ID=` sets
      #     TenantConfig.id to '' — NOT the default — which matches no tenant.
      #     An unset variable must leave the define absent entirely.
      #  2. Slug and id must be stamped together and be internally coherent.
      #
      # TenantConfig.verifyOrThrow enforces the same invariant at app startup;
      # this step is what stops a bad build being produced in the first place.
      - name: Resolve and validate tenant build stamp
        run: |
          set -euo pipefail
          slug="${VH_TENANT_SLUG:-}"
          tenant_id="${VH_TENANT_ID:-}"
          default_tenant='00000000-0000-4000-8000-000000000001'
          uuid_re='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          defines=''
          if [ -n "${slug}" ] || [ -n "${tenant_id}" ]; then
            if [ -z "${slug}" ] || [ -z "${tenant_id}" ]; then
              echo "::error::A per-tenant patient build needs BOTH VH_TENANT_SLUG and VH_TENANT_ID. Got slug='${slug}', VH_TENANT_ID $( [ -n "${tenant_id}" ] && echo 'set' || echo 'empty' )."
              exit 1
            fi
            if ! printf '%s' "${tenant_id}" | grep -Eq "${uuid_re}"; then
              echo "::error::VH_TENANT_ID is not a tenant UUID: '${tenant_id}'."
              exit 1
            fi
            if [ "${tenant_id}" = "${default_tenant}" ]; then
              echo "::error::VH_TENANT_SLUG='${slug}' is stamped but VH_TENANT_ID is the platform default tenant. Stamp that tenant's own UUID, or clear VH_TENANT_SLUG for a default single-tenant build."
              exit 1
            fi
            defines="--dart-define=VH_TENANT_SLUG=${slug} --dart-define=VH_TENANT_ID=${tenant_id}"
            echo "Per-tenant patient build for slug '${slug}'."
          else
            # Not fatal: a single-tenant hospital on its own domain is a valid
            # default-tenant deployment. Warn so a forgotten stamp is visible.
            case "${VH_BASE_URL:-}" in
              ''|https://api.vhhealth.app/api/v1) ;;
              *) echo "::warning::VH_BASE_URL is '${VH_BASE_URL}' but no VH_TENANT_SLUG/VH_TENANT_ID is stamped, so this build claims the platform default tenant. If that URL serves a different tenant, the app will sit in a permanent readiness outage." ;;
            esac
            echo 'Default single-tenant patient build: no tenant defines stamped.'
          fi
          echo "VH_TENANT_DEFINES=${defines}" >> "${GITHUB_ENV}"

      # Rotated Firebase API keys are injected at build time from GitHub
      # secrets (see docs/runbooks/FIREBASE_KEY_ROTATION.md). Only non-empty
      # secrets are stamped: `--dart-define=VH_FIREBASE_..._API_KEY=` would
      # override the committed fallback in firebase_options.dart with an empty
      # string and break Firebase init, so an unset secret must leave the
      # define absent entirely (same rule as the tenant stamp above).
      - name: Resolve Firebase API key defines
        run: |
          set -euo pipefail
          defines=''
          for name in \
            VH_FIREBASE_WEB_API_KEY \
            VH_FIREBASE_ANDROID_API_KEY \
            VH_FIREBASE_IOS_API_KEY
          do
            if [ -n "${!name:-}" ]; then
              defines="${defines} --dart-define=${name}=${!name}"
            fi
          done
          if [ -z "${defines}" ]; then
            echo "::warning::No VH_FIREBASE_*_API_KEY secrets are set — this release bakes in the committed (pre-rotation) Firebase API keys from firebase_options.dart."
          fi
          echo "VH_FIREBASE_DEFINES=${defines}" >> "${GITHUB_ENV}"

      - name: Stamp native Android Firebase configuration
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/patient/android/app/google-services.json';
          const packageName = 'com.vh.vhhealth';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          const clients = config.client.filter(
            (client) => client.client_info?.android_client_info?.package_name === packageName,
          );
          if (clients.length !== 1 || !clients[0].api_key?.length) {
            throw new Error(`Expected exactly one Firebase Android client for ${packageName}`);
          }
          for (const entry of clients[0].api_key) {
            entry.current_key = process.env.VH_FIREBASE_ANDROID_API_KEY;
          }
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`, { mode: 0o600 });
          NODE

      - name: Configure Android signing
        run: |
          set -euo pipefail
          printf '%s' "$PATIENT_ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/patient/android/release-keystore.jks
          cat > apps/patient/android/key.properties <<EOF
          storePassword=${PATIENT_ANDROID_STORE_PASSWORD}
          keyPassword=${PATIENT_ANDROID_KEY_PASSWORD}
          keyAlias=${PATIENT_ANDROID_KEY_ALIAS}
          storeFile=release-keystore.jks
          EOF

      - name: Build release APK
        working-directory: apps/patient
        run: >
          flutter build apk --release
          --dart-define=VH_BASE_URL="${VH_BASE_URL}"
          --dart-define=VH_API_KEY="${VH_API_KEY}"
          --dart-define=PRODUCTION=true
          --dart-define=CERT_PIN_HASHES="${PATIENT_CERT_PIN_HASHES}"
          --dart-define=CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS="${CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS}"
          ${VH_TENANT_DEFINES}
          ${VH_FIREBASE_DEFINES}

      - name: Build release AAB
        working-directory: apps/patient
        run: >
          flutter build appbundle --release
          --dart-define=VH_BASE_URL="${VH_BASE_URL}"
          --dart-define=VH_API_KEY="${VH_API_KEY}"
          --dart-define=PRODUCTION=true
          --dart-define=CERT_PIN_HASHES="${PATIENT_CERT_PIN_HASHES}"
          --dart-define=CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS="${CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS}"
          ${VH_TENANT_DEFINES}
          ${VH_FIREBASE_DEFINES}

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: Patient ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            apps/patient/build/app/outputs/flutter-apk/app-release.apk
            apps/patient/build/app/outputs/bundle/release/app-release.aab

      # The manual Play Console bootstrap and Play App Signing enrollment are
      # complete. PATIENT_PLAY_INTERNAL_ENABLED=true makes every patient-v* tag
      # publish the same verified AAB to the internal test track. Authentication
      # is keyless and limited to patient release tags.
      - name: Authenticate to Google Play
        id: play-auth
        if: ${{ vars.PATIENT_PLAY_INTERNAL_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/patient-v') }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: vhhealth
          workload_identity_provider: ${{ vars.GOOGLE_PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT }}

      - name: Publish Patient AAB to Play internal testing
        if: ${{ vars.PATIENT_PLAY_INTERNAL_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/patient-v') }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJson: ${{ steps.play-auth.outputs.credentials_file_path }}
          packageName: com.vh.vhhealth
          releaseFiles: apps/patient/build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          releaseName: Patient ${{ github.ref_name }}

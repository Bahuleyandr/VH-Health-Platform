name: Release Patient App

# Builds a release-mode APK + AAB for the patient app and attaches them
# to a GitHub Release. Triggered by tags prefixed `patient-v*`
# (e.g. `patient-v1.2.3`) so patient and staff releases don't collide
# in the monorepo.
#
# Monorepo adaptations vs. the original standalone-repo workflow:
#   - No secondary checkout of vhhealth-core (it's at packages/vhhealth_core).
#   - dart pub get + melos bootstrap at the repo root before the per-app build.
#   - working-directory: apps/patient for flutter build apk/appbundle.
#   - Artifact paths updated to apps/patient/build/app/outputs/...

on:
  push:
    tags: ['patient-v*']
  workflow_dispatch:

concurrency:
  group: release-patient-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VH_BASE_URL: ${{ vars.VH_BASE_URL }}
      VH_API_KEY: ${{ secrets.VH_API_KEY }}
      PATIENT_CERT_PIN_HASHES: ${{ vars.PATIENT_CERT_PIN_HASHES }}
      PATIENT_ANDROID_KEYSTORE_BASE64: ${{ secrets.PATIENT_ANDROID_KEYSTORE_BASE64 }}
      PATIENT_ANDROID_KEY_ALIAS: ${{ secrets.PATIENT_ANDROID_KEY_ALIAS }}
      PATIENT_ANDROID_KEY_PASSWORD: ${{ secrets.PATIENT_ANDROID_KEY_PASSWORD }}
      PATIENT_ANDROID_STORE_PASSWORD: ${{ secrets.PATIENT_ANDROID_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Activate Melos
        run: dart pub global activate melos 7.5.1

      - name: Bootstrap workspace
        run: |
          dart pub get
          melos bootstrap

      - name: Validate release configuration
        run: |
          set -euo pipefail
          missing=0
          for name in \
            VH_BASE_URL \
            VH_API_KEY \
            PATIENT_CERT_PIN_HASHES \
            PATIENT_ANDROID_KEYSTORE_BASE64 \
            PATIENT_ANDROID_KEY_ALIAS \
            PATIENT_ANDROID_KEY_PASSWORD \
            PATIENT_ANDROID_STORE_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is required for patient release builds"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Configure Android signing
        run: |
          set -euo pipefail
          printf '%s' "$PATIENT_ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/patient/android/release-keystore.jks
          cat > apps/patient/android/key.properties <<EOF
          storePassword=${PATIENT_ANDROID_STORE_PASSWORD}
          keyPassword=${PATIENT_ANDROID_KEY_PASSWORD}
          keyAlias=${PATIENT_ANDROID_KEY_ALIAS}
          storeFile=release-keystore.jks
          EOF

      - name: Build release APK
        working-directory: apps/patient
        run: >
          flutter build apk --release
          --dart-define=VH_BASE_URL="${VH_BASE_URL}"
          --dart-define=VH_API_KEY="${VH_API_KEY}"
          --dart-define=PRODUCTION=true
          --dart-define=CERT_PIN_HASHES="${PATIENT_CERT_PIN_HASHES}"

      - name: Build release AAB
        working-directory: apps/patient
        run: >
          flutter build appbundle --release
          --dart-define=VH_BASE_URL="${VH_BASE_URL}"
          --dart-define=VH_API_KEY="${VH_API_KEY}"
          --dart-define=PRODUCTION=true
          --dart-define=CERT_PIN_HASHES="${PATIENT_CERT_PIN_HASHES}"

      - uses: softprops/action-gh-release@v3
        with:
          name: Patient ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            apps/patient/build/app/outputs/flutter-apk/app-release.apk
            apps/patient/build/app/outputs/bundle/release/app-release.aab

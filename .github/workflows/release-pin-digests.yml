name: Pin prod image digests

# GitOps write-back for audit finding H11: after a signed release image is
# published (release-images.yml on a backend-v* / admin-v* / staff-web-v*
# tag), pin its immutable sha256 digest into
# infra/kubernetes/apps/kustomization.yaml (the tree the ArgoCD `apps`
# Application syncs). Prod never tracks a mutable tag.
#
# Audit finding #20: the pinned digest is the one the release run's build job
# emitted (downloaded from that run's image-ref artifact) — never a fresh
# resolution of the mutable tag, which would permit pinning any
# previously-signed image. The script re-resolves the tag only to cross-check
# it still agrees with the build-emitted digest and fails loudly otherwise.

on:
  workflow_run:
    workflows: ["Release Container Images"]
    types: [completed]

permissions:
  contents: write
  packages: read
  actions: read       # download the image-ref artifact from the release run

jobs:
  pin-digests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only act on successful runs that were triggered by a release tag.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'backend-v') ||
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'admin-v') ||
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'staff-web-v')
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Download build-emitted image ref from the release run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            backend-v*) app=backend ;;
            admin-v*) app=admin ;;
            staff-web-v*) app=staff-web ;;
            *) echo "::error::unexpected release tag ${RELEASE_TAG}"; exit 1 ;;
          esac
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "image-ref-${app}-${RELEASE_TAG}" --dir output/release-artifact
          ref_file="$(find output/release-artifact -name image-ref.txt -type f | head -n 1)"
          if [ -z "$ref_file" ]; then
            echo "::error::image-ref.txt not found in the release run artifact — cannot prove the digest came from that run (audit finding #20)"
            exit 1
          fi
          echo "IMAGE_REF_FILE=$ref_file" >> "$GITHUB_ENV"

      - name: Pin build-emitted digest and update overlay
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          COSIGN_CERTIFICATE_IDENTITY_REGEXP: '^https://github.com/${{ github.repository }}/\.github/workflows/release-images\.yml@.*$'
          COSIGN_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          node scripts/update-prod-digests.mjs \
            --tag "$RELEASE_TAG" \
            --expected-digest-file "$IMAGE_REF_FILE" \
            --evidence-file "output/release-pin-digests/${RELEASE_TAG}.json"

      - name: Commit digest bump
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          if git diff --quiet; then
            echo "No digest change — overlay already pinned to this release."
            exit 0
          fi
          git config user.name "vh-digest-bot"
          git config user.email "noreply@vhhealth.app"
          git add infra/kubernetes/apps/kustomization.yaml
          git commit -m "chore(prod): pin ${RELEASE_TAG} image digest (H11 GitOps write-back)"
          git push origin main

      - name: Upload digest verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-pin-digests-${{ github.event.workflow_run.head_branch }}
          path: output/release-pin-digests
          if-no-files-found: ignore

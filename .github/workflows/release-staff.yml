name: Release Staff App

# Mirrors the patient release workflow. Triggered by tags prefixed
# `staff-v*` (e.g. `staff-v1.0.0`) so patient and staff releases don't
# collide in the monorepo.
#
# Monorepo adaptations vs. the original standalone-repo workflow:
#   - No secondary checkout of vhhealth-core (it's at packages/vhhealth_core).
#   - dart pub get + melos bootstrap at the repo root before the per-app build.
#   - working-directory: apps/staff for flutter build apk/appbundle.
#   - Artifact paths updated to apps/staff/build/app/outputs/...

on:
  push:
    tags: ['staff-v*']
  workflow_dispatch:

concurrency:
  group: release-staff-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VH_BASE_URL: ${{ vars.VH_BASE_URL }}
      VH_API_KEY: ${{ secrets.VH_API_KEY }}
      STAFF_CERT_PIN_HASHES: ${{ vars.STAFF_CERT_PIN_HASHES }}
      CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS: ${{ vars.CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS }}
      STAFF_ANDROID_KEYSTORE_BASE64: ${{ secrets.STAFF_ANDROID_KEYSTORE_BASE64 }}
      STAFF_ANDROID_KEY_ALIAS: ${{ secrets.STAFF_ANDROID_KEY_ALIAS }}
      STAFF_ANDROID_KEY_PASSWORD: ${{ secrets.STAFF_ANDROID_KEY_PASSWORD }}
      STAFF_ANDROID_STORE_PASSWORD: ${{ secrets.STAFF_ANDROID_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      # Node runs the codegen driver below (scripts/codegen.mjs) and the
      # cert-pin validator further down. Pinned to the repo-standard version
      # rather than relying on whatever the ubuntu-latest image ships.
      - uses: actions/setup-node@v6
        with:
          node-version: '26.5.0'

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the workspace toolchain (_reusable-flutter-workspace.yml + ci.yml) — bump all together.
          flutter-version: 3.44.0
          cache: true

      - name: Activate Melos
        run: dart pub global activate melos 7.5.1

      - name: Bootstrap workspace
        run: |
          dart pub get
          melos bootstrap

      # Must run AFTER bootstrap (build_runner is resolved by the workspace)
      # and BEFORE the build: the generated client lib/api/generated/** is
      # gitignored and absent on a fresh clone, yet the tracked barrel
      # lib/api/vhhealth_api.dart re-exports it and lib/services/** imports
      # generated symbols, so the app only compiles once codegen has run.
      # melos run codegen invokes `node scripts/codegen.mjs`, which needs Node
      # (set up above) and dart (from subosito/flutter-action above).
      # Kept ahead of the signing step so a codegen failure cannot burn a tag
      # after the release keystore has already been written to disk.
      - name: Codegen (regenerate Dart client from synced spec)
        run: melos run codegen

      - name: Validate release configuration
        run: |
          set -euo pipefail
          missing=0
          for name in \
            VH_BASE_URL \
            VH_API_KEY \
            STAFF_CERT_PIN_HASHES \
            CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS \
            STAFF_ANDROID_KEYSTORE_BASE64 \
            STAFF_ANDROID_KEY_ALIAS \
            STAFF_ANDROID_KEY_PASSWORD \
            STAFF_ANDROID_STORE_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is required for staff release builds"
              missing=1
            fi
          done
          node scripts/validate-cert-pin-set.mjs \
            --pins "${STAFF_CERT_PIN_HASHES}" \
            --clock-skew-seconds "${CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS}"
          exit "${missing}"

      - name: Configure Android signing
        run: |
          set -euo pipefail
          printf '%s' "$STAFF_ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/staff/android/release-keystore.jks
          cat > apps/staff/android/key.properties <<EOF
          storePassword=${STAFF_ANDROID_STORE_PASSWORD}
          keyPassword=${STAFF_ANDROID_KEY_PASSWORD}
          keyAlias=${STAFF_ANDROID_KEY_ALIAS}
          storeFile=release-keystore.jks
          EOF

      - name: Build release APK
        working-directory: apps/staff
        run: >
          flutter build apk --release
          --dart-define=VH_BASE_URL="${VH_BASE_URL}"
          --dart-define=VH_API_KEY="${VH_API_KEY}"
          --dart-define=PRODUCTION=true
          --dart-define=CERT_PIN_HASHES="${STAFF_CERT_PIN_HASHES}"
          --dart-define=CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS="${CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS}"

      - name: Build release AAB
        working-directory: apps/staff
        run: >
          flutter build appbundle --release
          --dart-define=VH_BASE_URL="${VH_BASE_URL}"
          --dart-define=VH_API_KEY="${VH_API_KEY}"
          --dart-define=PRODUCTION=true
          --dart-define=CERT_PIN_HASHES="${STAFF_CERT_PIN_HASHES}"
          --dart-define=CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS="${CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS}"

      - uses: softprops/action-gh-release@v3
        with:
          name: Staff ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            apps/staff/build/app/outputs/flutter-apk/app-release.apk
            apps/staff/build/app/outputs/bundle/release/app-release.aab

  windows-msix:
    name: Build Windows MSIX
    if: startsWith(github.ref, 'refs/tags/staff-v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VH_BASE_URL: ${{ vars.VH_BASE_URL }}
      VH_API_KEY: ${{ secrets.VH_API_KEY }}
      STAFF_CERT_PIN_HASHES: ${{ vars.STAFF_CERT_PIN_HASHES }}
      CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS: ${{ vars.CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS }}
    steps:
      - uses: actions/checkout@v6

      # Node runs the codegen driver below (scripts/codegen.mjs) and the
      # cert-pin validator further down. Pinned to the repo-standard version
      # rather than relying on whatever the windows-latest image ships.
      - uses: actions/setup-node@v6
        with:
          node-version: '26.5.0'

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the workspace toolchain (_reusable-flutter-workspace.yml + ci.yml) — bump all together.
          flutter-version: 3.44.0
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Activate Melos
        run: dart pub global activate melos 7.5.1

      - name: Bootstrap workspace
        run: |
          dart pub get
          melos bootstrap

      # Same hazard as the Android job above: lib/api/generated/** is
      # gitignored, so `flutter build windows` and `dart run msix:create`
      # below cannot resolve the barrel until codegen has run. Must be AFTER
      # bootstrap and BEFORE the Windows build. scripts/codegen.mjs handles
      # win32 explicitly (it spawns dart with shell: true on Windows), so the
      # same melos script works here.
      - name: Codegen (regenerate Dart client from synced spec)
        run: melos run codegen

      - name: Validate Windows release configuration
        shell: pwsh
        run: |
          $missing = @()
          foreach ($name in @(
            'VH_BASE_URL',
            'VH_API_KEY',
            'STAFF_CERT_PIN_HASHES',
            'CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS'
          )) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) {
              $missing += $name
            }
          }
          foreach ($name in $missing) {
            Write-Error "$name is required for staff Windows release builds"
          }
          if ($missing.Count -gt 0) { exit 1 }
          & node scripts/validate-cert-pin-set.mjs `
            --pins "$env:STAFF_CERT_PIN_HASHES" `
            --clock-skew-seconds "$env:CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows release
        working-directory: apps/staff
        shell: pwsh
        run: |
          flutter build windows --release `
            --dart-define=VH_BASE_URL="$env:VH_BASE_URL" `
            --dart-define=VH_API_KEY="$env:VH_API_KEY" `
            --dart-define=PRODUCTION=true `
            --dart-define=CERT_PIN_HASHES="$env:STAFF_CERT_PIN_HASHES" `
            --dart-define=CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS="$env:CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS"

      - name: Create unsigned MSIX
        working-directory: apps/staff
        shell: pwsh
        run: |
          dart run msix:create
          $msix = Get-ChildItem -Path build/windows -Filter *.msix -Recurse |
            Select-Object -First 1
          if (-not $msix) {
            throw 'MSIX package was not produced'
          }
          $summary = @"
          ### Staff Windows MSIX

          Built and attached an unsigned/test-signed Windows MSIX from `apps/staff/pubspec.yaml` (`msix_config`).

          Production distribution still needs an operator decision for a Windows signing certificate and whether `install_certificate` should remain `false` or move to a signed install flow.
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - uses: softprops/action-gh-release@v3
        with:
          name: Staff ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            apps/staff/build/windows/**/*.msix

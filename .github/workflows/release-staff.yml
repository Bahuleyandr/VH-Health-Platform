name: Release Staff App

# Mirrors the patient release workflow. Triggered by tags prefixed
# `staff-v*` (e.g. `staff-v1.0.0`) so patient and staff releases don't
# collide in the monorepo.
#
# Monorepo adaptations vs. the original standalone-repo workflow:
#   - No secondary checkout of vhhealth-core (it's at packages/vhhealth_core).
#   - dart pub get + melos bootstrap at the repo root before the per-app build.
#   - working-directory: apps/staff for flutter build apk/appbundle.
#   - Artifact paths updated to apps/staff/build/app/outputs/...

on:
  push:
    tags: ['staff-v*']
  workflow_dispatch:

concurrency:
  group: release-staff-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VH_BASE_URL: ${{ vars.VH_BASE_URL }}
      VH_API_KEY: ${{ secrets.VH_API_KEY }}
      VH_TENANT_SLUG: ${{ vars.VH_TENANT_SLUG }}
      VH_TENANT_ID: ${{ vars.VH_TENANT_ID }}
      STAFF_CERT_PIN_HASHES: ${{ vars.STAFF_CERT_PIN_HASHES }}
      CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS: ${{ vars.CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS }}
      STAFF_ANDROID_KEYSTORE_BASE64: ${{ secrets.STAFF_ANDROID_KEYSTORE_BASE64 }}
      STAFF_ANDROID_KEY_ALIAS: ${{ secrets.STAFF_ANDROID_KEY_ALIAS }}
      STAFF_ANDROID_KEY_PASSWORD: ${{ secrets.STAFF_ANDROID_KEY_PASSWORD }}
      STAFF_ANDROID_STORE_PASSWORD: ${{ secrets.STAFF_ANDROID_STORE_PASSWORD }}
      VH_FIREBASE_WEB_API_KEY: ${{ secrets.VH_FIREBASE_WEB_API_KEY }}
      VH_FIREBASE_ANDROID_API_KEY: ${{ secrets.VH_FIREBASE_ANDROID_API_KEY }}
      VH_FIREBASE_IOS_API_KEY: ${{ secrets.VH_FIREBASE_IOS_API_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Node runs the codegen driver below (scripts/codegen.mjs) and the
      # cert-pin validator further down. Pinned to the repo-standard version
      # rather than relying on whatever the ubuntu-latest image ships.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.5.0'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Pinned to the workspace toolchain (_reusable-flutter-workspace.yml + ci.yml) — bump all together.
          flutter-version: 3.44.0
          cache: true

      - name: Install Android API 37 toolchain
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Activate Melos
        run: dart pub global activate melos 8.2.2

      - name: Bootstrap workspace
        run: |
          dart pub get
          melos bootstrap

      # Must run AFTER bootstrap (build_runner is resolved by the workspace)
      # and BEFORE the build: the generated client lib/api/generated/** is
      # gitignored and absent on a fresh clone, yet the tracked barrel
      # lib/api/vhhealth_api.dart re-exports it and lib/services/** imports
      # generated symbols, so the app only compiles once codegen has run.
      # melos run codegen invokes `node scripts/codegen.mjs`, which needs Node
      # (set up above) and dart (from subosito/flutter-action above).
      # Kept ahead of the signing step so a codegen failure cannot burn a tag
      # after the release keystore has already been written to disk.
      - name: Codegen (regenerate Dart client from synced spec)
        run: melos run codegen

      - name: Validate release configuration
        run: |
          set -euo pipefail
          missing=0
          for name in \
            VH_BASE_URL \
            VH_API_KEY \
            STAFF_CERT_PIN_HASHES \
            CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS \
            STAFF_ANDROID_KEYSTORE_BASE64 \
            STAFF_ANDROID_KEY_ALIAS \
            STAFF_ANDROID_KEY_PASSWORD \
            STAFF_ANDROID_STORE_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is required for staff release builds"
              missing=1
            fi
          done
          node scripts/validate-cert-pin-set.mjs \
            --pins "${STAFF_CERT_PIN_HASHES}" \
            --clock-skew-seconds "${CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS}"
          exit "${missing}"

      # See release-patient.yml for the full rationale. In short: never stamp an
      # empty define (`--dart-define=VH_TENANT_ID=` sets TenantConfig.id to ''
      # rather than the default, matching no tenant), and require slug + id to
      # be stamped together and coherently. TenantConfig.verifyOrThrow enforces
      # the same invariant at app startup.
      - name: Resolve and validate tenant build stamp
        run: |
          set -euo pipefail
          slug="${VH_TENANT_SLUG:-}"
          tenant_id="${VH_TENANT_ID:-}"
          default_tenant='00000000-0000-4000-8000-000000000001'
          uuid_re='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          defines=''
          if [ -n "${slug}" ] || [ -n "${tenant_id}" ]; then
            if [ -z "${slug}" ] || [ -z "${tenant_id}" ]; then
              echo "::error::A per-tenant staff build needs BOTH VH_TENANT_SLUG and VH_TENANT_ID. Got slug='${slug}', VH_TENANT_ID $( [ -n "${tenant_id}" ] && echo 'set' || echo 'empty' )."
              exit 1
            fi
            if ! printf '%s' "${tenant_id}" | grep -Eq "${uuid_re}"; then
              echo "::error::VH_TENANT_ID is not a tenant UUID: '${tenant_id}'."
              exit 1
            fi
            if [ "${tenant_id}" = "${default_tenant}" ]; then
              echo "::error::VH_TENANT_SLUG='${slug}' is stamped but VH_TENANT_ID is the platform default tenant. Stamp that tenant's own UUID, or clear VH_TENANT_SLUG for a default single-tenant build."
              exit 1
            fi
            defines="--dart-define=VH_TENANT_SLUG=${slug} --dart-define=VH_TENANT_ID=${tenant_id}"
            echo "Per-tenant staff build for slug '${slug}'."
          else
            case "${VH_BASE_URL:-}" in
              ''|https://api.vhhealth.app/api/v1) ;;
              *) echo "::warning::VH_BASE_URL is '${VH_BASE_URL}' but no VH_TENANT_SLUG/VH_TENANT_ID is stamped, so this build claims the platform default tenant." ;;
            esac
            echo 'Default single-tenant staff build: no tenant defines stamped.'
          fi
          echo "VH_TENANT_DEFINES=${defines}" >> "${GITHUB_ENV}"

      # Rotated Firebase API keys are injected at build time from GitHub
      # secrets (see docs/runbooks/FIREBASE_KEY_ROTATION.md). Only non-empty
      # secrets are stamped: `--dart-define=VH_FIREBASE_..._API_KEY=` would
      # override the committed fallback in firebase_options.dart with an empty
      # string and break Firebase init, so an unset secret must leave the
      # define absent entirely (same rule as the tenant stamp above).
      - name: Resolve Firebase API key defines
        run: |
          set -euo pipefail
          defines=''
          for name in \
            VH_FIREBASE_WEB_API_KEY \
            VH_FIREBASE_ANDROID_API_KEY \
            VH_FIREBASE_IOS_API_KEY
          do
            if [ -n "${!name:-}" ]; then
              defines="${defines} --dart-define=${name}=${!name}"
            fi
          done
          if [ -z "${defines}" ]; then
            echo "::warning::No VH_FIREBASE_*_API_KEY secrets are set — this release bakes in the committed (pre-rotation) Firebase API keys from firebase_options.dart."
          fi
          echo "VH_FIREBASE_DEFINES=${defines}" >> "${GITHUB_ENV}"

      - name: Configure Android signing
        run: |
          set -euo pipefail
          printf '%s' "$STAFF_ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/staff/android/release-keystore.jks
          cat > apps/staff/android/key.properties <<EOF
          storePassword=${STAFF_ANDROID_STORE_PASSWORD}
          keyPassword=${STAFF_ANDROID_KEY_PASSWORD}
          keyAlias=${STAFF_ANDROID_KEY_ALIAS}
          storeFile=release-keystore.jks
          EOF

      - name: Build release APK
        working-directory: apps/staff
        run: >
          flutter build apk --release
          --dart-define=VH_BASE_URL="${VH_BASE_URL}"
          --dart-define=VH_API_KEY="${VH_API_KEY}"
          --dart-define=PRODUCTION=true
          --dart-define=CERT_PIN_HASHES="${STAFF_CERT_PIN_HASHES}"
          --dart-define=CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS="${CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS}"
          ${VH_TENANT_DEFINES}
          ${VH_FIREBASE_DEFINES}

      - name: Build release AAB
        working-directory: apps/staff
        run: >
          flutter build appbundle --release
          --dart-define=VH_BASE_URL="${VH_BASE_URL}"
          --dart-define=VH_API_KEY="${VH_API_KEY}"
          --dart-define=PRODUCTION=true
          --dart-define=CERT_PIN_HASHES="${STAFF_CERT_PIN_HASHES}"
          --dart-define=CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS="${CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS}"
          ${VH_TENANT_DEFINES}
          ${VH_FIREBASE_DEFINES}

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: Staff ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            apps/staff/build/app/outputs/flutter-apk/app-release.apk
            apps/staff/build/app/outputs/bundle/release/app-release.aab

  windows-msix:
    name: Build Windows MSIX
    if: startsWith(github.ref, 'refs/tags/staff-v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VH_BASE_URL: ${{ vars.VH_BASE_URL }}
      VH_API_KEY: ${{ secrets.VH_API_KEY }}
      VH_TENANT_SLUG: ${{ vars.VH_TENANT_SLUG }}
      VH_TENANT_ID: ${{ vars.VH_TENANT_ID }}
      STAFF_CERT_PIN_HASHES: ${{ vars.STAFF_CERT_PIN_HASHES }}
      CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS: ${{ vars.CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS }}
      # Windows Firebase options reuse the project web API key
      # (firebase_options.dart maps windows -> VH_FIREBASE_WEB_API_KEY).
      VH_FIREBASE_WEB_API_KEY: ${{ secrets.VH_FIREBASE_WEB_API_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Node runs the codegen driver below (scripts/codegen.mjs) and the
      # cert-pin validator further down. Pinned to the repo-standard version
      # rather than relying on whatever the windows-latest image ships.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.5.0'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Pinned to the workspace toolchain (_reusable-flutter-workspace.yml + ci.yml) — bump all together.
          flutter-version: 3.44.0
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Activate Melos
        run: dart pub global activate melos 8.2.2

      - name: Bootstrap workspace
        run: |
          dart pub get
          melos bootstrap

      # Same hazard as the Android job above: lib/api/generated/** is
      # gitignored, so `flutter build windows` and `dart run msix:create`
      # below cannot resolve the barrel until codegen has run. Must be AFTER
      # bootstrap and BEFORE the Windows build. scripts/codegen.mjs handles
      # win32 explicitly (it spawns dart with shell: true on Windows), so the
      # same melos script works here.
      - name: Codegen (regenerate Dart client from synced spec)
        run: melos run codegen

      - name: Validate Windows release configuration
        shell: pwsh
        run: |
          $missing = @()
          foreach ($name in @(
            'VH_BASE_URL',
            'VH_API_KEY',
            'STAFF_CERT_PIN_HASHES',
            'CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS'
          )) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) {
              $missing += $name
            }
          }
          foreach ($name in $missing) {
            Write-Error "$name is required for staff Windows release builds"
          }
          if ($missing.Count -gt 0) { exit 1 }
          & node scripts/validate-cert-pin-set.mjs `
            --pins "$env:STAFF_CERT_PIN_HASHES" `
            --clock-skew-seconds "$env:CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Same tenant-stamp invariant as the Android job. PowerShell does not
      # word-split an expanded variable, so the optional defines are built as an
      # array and splatted rather than interpolated as one string.
      - name: Validate tenant build stamp
        shell: pwsh
        run: |
          $slug = "$env:VH_TENANT_SLUG"
          $tenantId = "$env:VH_TENANT_ID"
          $defaultTenant = '00000000-0000-4000-8000-000000000001'
          $uuidRe = '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          if ($slug -or $tenantId) {
            if (-not $slug -or -not $tenantId) {
              Write-Error "A per-tenant staff build needs BOTH VH_TENANT_SLUG and VH_TENANT_ID."
              exit 1
            }
            if ($tenantId -notmatch $uuidRe) {
              Write-Error "VH_TENANT_ID is not a tenant UUID: '$tenantId'."
              exit 1
            }
            if ($tenantId -eq $defaultTenant) {
              Write-Error "VH_TENANT_SLUG='$slug' is stamped but VH_TENANT_ID is the platform default tenant."
              exit 1
            }
            Write-Host "Per-tenant staff Windows build for slug '$slug'."
          } else {
            Write-Host 'Default single-tenant staff Windows build: no tenant defines stamped.'
          }

      - name: Build Windows release
        working-directory: apps/staff
        shell: pwsh
        run: |
          $tenantArgs = @()
          if ($env:VH_TENANT_SLUG) {
            $tenantArgs += "--dart-define=VH_TENANT_SLUG=$env:VH_TENANT_SLUG"
            $tenantArgs += "--dart-define=VH_TENANT_ID=$env:VH_TENANT_ID"
          }
          # Same rule as the Android job: never stamp an empty Firebase key
          # define — it would override the committed fallback with ''.
          $firebaseArgs = @()
          if ($env:VH_FIREBASE_WEB_API_KEY) {
            $firebaseArgs += "--dart-define=VH_FIREBASE_WEB_API_KEY=$env:VH_FIREBASE_WEB_API_KEY"
          }
          flutter build windows --release `
            --dart-define=VH_BASE_URL="$env:VH_BASE_URL" `
            --dart-define=VH_API_KEY="$env:VH_API_KEY" `
            --dart-define=PRODUCTION=true `
            --dart-define=CERT_PIN_HASHES="$env:STAFF_CERT_PIN_HASHES" `
            --dart-define=CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS="$env:CLIENT_READINESS_MAX_CLOCK_SKEW_SECONDS" `
            @tenantArgs `
            @firebaseArgs

      - name: Create unsigned MSIX
        working-directory: apps/staff
        shell: pwsh
        run: |
          dart run msix:create
          $msix = Get-ChildItem -Path build/windows -Filter *.msix -Recurse |
            Select-Object -First 1
          if (-not $msix) {
            throw 'MSIX package was not produced'
          }
          $summary = @"
          ### Staff Windows MSIX

          Built and attached an unsigned/test-signed Windows MSIX from `apps/staff/pubspec.yaml` (`msix_config`).

          Production distribution still needs an operator decision for a Windows signing certificate and whether `install_certificate` should remain `false` or move to a signed install flow.
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: Staff ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            apps/staff/build/windows/**/*.msix

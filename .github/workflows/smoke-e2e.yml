name: Smoke E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - 'apps/backend/**'
      - 'scripts/smoke-*.ps1'
      - 'scripts/check-clinical-ai-tenant-preflight.ps1'
      - '.github/workflows/smoke-e2e.yml'

permissions:
  contents: read

concurrency:
  group: smoke-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-full-stack:
    name: Backend + admin + API smokes
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vhhealth
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: vhhealth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vhhealth"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://vhhealth:${{ github.run_id }}@127.0.0.1:5432/vhhealth
      API_KEY: vhhealth-local-api-key
      BACKEND_API_KEY: vhhealth-local-api-key
      JWT_SECRET: vhhealth-local-admin-smoke-secret-123456789
      FIELD_ENCRYPTION_KEY: ci-field-encryption-key-32-chars-minimum
      TOTP_ENCRYPTION_KEY: ci-totp-encryption-key-32-chars-minimum
      BACKUP_ENCRYPTION_KEY: ci-backup-encryption-key-32-chars-minimum
      REQUIRE_MFA_FOR_SUPER_ADMIN: 'false'
      VH_ALLOW_NON_TEST_DATA_SEED: 'true'
      # Single-tenant smoke: the W1 tenant-context middleware fails CLOSED
      # (403 TENANT_CONTEXT_REQUIRED) for any authenticated request that
      # resolves no tenant unless this is set. The backend here runs via
      # `node src/bin/www.js` — NOT jest — so jest.setup.cjs's
      # `ALLOW_DEFAULT_TENANT ||= 'true'` does not apply, and the seeded admin
      # has no tenant binding. Without this every /api/v1/admin/* call 403s and
      # the admin route-crawl times out. Mirrors the default-tenant production
      # config (flip to 'false' only after per-tenant subdomain cutover).
      ALLOW_DEFAULT_TENANT: 'true'
      NODE_ENV: test
      PORT: '5206'
      BACKEND_URL: http://127.0.0.1:5206
      NEXT_PUBLIC_API_URL: http://127.0.0.1:5206
      NEXT_PUBLIC_ALLOWED_ORIGIN: http://localhost:3001,http://127.0.0.1:3001
      NEXT_PUBLIC_APP_ORIGIN: http://localhost:3001
      NEXT_PUBLIC_APP_NAME: VHHealth Admin
      NEXT_PUBLIC_WS_URL: ws://127.0.0.1:5206
      NEXT_PUBLIC_X_API_KEY: vhhealth-local-api-key
      PLAYWRIGHT_BASE_URL: http://localhost:3001
      PLAYWRIGHT_ADMIN_USERNAME: admin
      PLAYWRIGHT_ADMIN_PASSWORD: test1234
      PLAYWRIGHT_EXTERNAL_SERVER: '1'
      CLINICAL_AI_DEEP_PROVIDER: ollama
      CLINICAL_AI_DEEP_BASE_URL: http://127.0.0.1:11534
      CLINICAL_AI_DEEP_MODEL: llama3.1:70b-instruct-q4_K_M
      CLINICAL_AI_ALLOW_EXTERNAL: 'false'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/backend/package-lock.json
            apps/admin/package-lock.json

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install backend dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Install admin dependencies
        working-directory: apps/admin
        run: npm ci

      - name: Install Playwright browser
        working-directory: apps/admin
        run: npx playwright install --with-deps chromium

      - name: Prepare migrated and seeded database
        working-directory: apps/backend
        # Mirrors _reusable-backend-lint-test.yml: raw SQL migrations
        # (000_baseline.sql + 001+) are the source of truth; the previous
        # `prisma db push` step was removed because Prisma cannot recreate
        # the GENERATED columns / sequence-referencing defaults introduced
        # by 001+ migrations. The drift check runs after migrations so
        # any new migration that touches a Prisma-modelled table will
        # fail CI until schema.prisma is regenerated via `prisma db pull`.
        run: |
          npx prisma generate
          npm run db:ensure-pgvector
          node scripts/ci-setup-db.mjs
          node scripts/check-schema-drift.mjs
          npm run ci:db-guardrails

      - name: Enroll SUPER_ADMIN TOTP for the route-crawl (real 2FA)
        working-directory: apps/backend
        # The admin route-crawl (e2e/route-crawl.spec.ts) visits SUPER_ADMIN-only
        # pages (/dashboard/admin-management → /auth/admin/list), so it must auth
        # as SUPER_ADMIN — but the 2026-06-18 audit's requireSuperAdminStepUp gate
        # 403s a SUPER_ADMIN without a 2FA-verified (mfa:true) session on sensitive
        # namespaces (incl. the admin dashboard loaded on every page). Enroll a
        # known TOTP secret on the seeded `admin` so auth.setup.ts can complete the
        # REAL 2FA challenge and obtain an mfa:true session that satisfies BOTH the
        # step-up gate and the super-admin-only RBAC. The plaintext secret is
        # exported (run-scoped) for the Playwright step to generate codes. Smoke DB.
        run: |
          SECRET="$(node scripts/seed-smoke-admin-totp.mjs)"
          echo "PLAYWRIGHT_ADMIN_TOTP_SECRET=$SECRET" >> "$GITHUB_ENV"

      - name: Start backend
        working-directory: apps/backend
        run: |
          mkdir -p ../../output/ci-smoke
          node src/bin/www.js > ../../output/ci-smoke/backend.log 2>&1 &
          echo $! > ../../output/ci-smoke/backend.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5206/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat ../../output/ci-smoke/backend.log
          exit 1

      - name: Start admin
        working-directory: apps/admin
        run: |
          npm run dev > ../../output/ci-smoke/admin.log 2>&1 &
          echo $! > ../../output/ci-smoke/admin.pid
          for i in {1..60}; do
            if curl -fsS http://localhost:3001/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat ../../output/ci-smoke/admin.log
          exit 1

      - name: Admin browser route smoke
        working-directory: apps/admin
        run: npm run smoke:routes

      - name: Admin table controls smoke
        working-directory: apps/admin
        run: npm run smoke:tables

      - name: Patient API smoke
        shell: pwsh
        run: >
          ./scripts/smoke-patient-routing.ps1
          -BackendBase http://127.0.0.1:5206
          -ApiKey $env:API_KEY
          -JwtSecret $env:JWT_SECRET
          -PgHost 127.0.0.1
          -PgPort 5432
          -PgUser vhhealth
          -PgDatabase vhhealth
          -PgPassword '${{ github.run_id }}'

      - name: Staff API smoke
        shell: pwsh
        run: >
          ./scripts/smoke-staff-routing.ps1
          -BackendBase http://127.0.0.1:5206
          -ApiKey $env:API_KEY
          -JwtSecret $env:JWT_SECRET
          -PgHost 127.0.0.1
          -PgPort 5432
          -PgUser vhhealth
          -PgDatabase vhhealth
          -PgPassword '${{ github.run_id }}'

      - name: Staff clinical-safety API smoke
        shell: pwsh
        run: >
          ./scripts/smoke-staff-clinical-safety.ps1
          -BackendBase http://127.0.0.1:5206
          -ApiKey $env:API_KEY
          -JwtSecret $env:JWT_SECRET
          -PgHost 127.0.0.1
          -PgPort 5432
          -PgUser vhhealth
          -PgDatabase vhhealth
          -PgPassword '${{ github.run_id }}'

      - name: Clinical AI pilot evidence smoke
        shell: pwsh
        run: >
          ./scripts/smoke-clinical-ai-pilot-evidence.ps1
          -BackendBase http://127.0.0.1:5206
          -ApiKey $env:API_KEY
          -JwtSecret $env:JWT_SECRET
          -PgHost 127.0.0.1
          -PgPort 5432
          -PgUser vhhealth
          -PgDatabase vhhealth
          -PgPassword '${{ github.run_id }}'
          -EvidenceOutputPath output/ci-smoke/clinical-ai-pilot-evidence-pack.json
          -SignoffOutputPath output/ci-smoke/clinical-ai-pilot-signoff-gate.json

      - name: Clinical AI local Ollama deep-tier smoke
        shell: pwsh
        run: >
          ./scripts/smoke-clinical-ai-local-ollama.ps1
          -BackendBase http://127.0.0.1:5206
          -ApiKey $env:API_KEY
          -JwtSecret $env:JWT_SECRET
          -PgHost 127.0.0.1
          -PgPort 5432
          -PgUser vhhealth
          -PgDatabase vhhealth
          -PgPassword '${{ github.run_id }}'

      # The preflight runs STRICT (-RequireNoWarnings, the operator go-live
      # posture). Two synthetic-CI gaps would otherwise warn and must be closed
      # first (the green run's only 6 warnings were exactly these two classes;
      # locale / numbering-series / retention-policy already PASS from the seed):
      #  1. some_review_roles_unstaffed — the global catalog enables ~18 modules
      #     for every tenant whose reviewRoles span niche roles the comprehensive
      #     seed doesn't staff. Seed one active user per missing role (derived
      #     from the catalog, idempotent).
      #  2. deep_module_not_live — the preflight does a live GET /api/tags on the
      #     deep provider, but the local-Ollama smoke above start/stopped its own
      #     mock. Start a persistent mock that stays up through the preflight.
      - name: Seed Clinical AI preflight reviewers
        working-directory: apps/backend
        run: node scripts/seed-clinical-ai-preflight-reviewers.mjs --tenant 00000000-0000-4000-8000-000000000001

      - name: Start mock Ollama for preflight readiness
        run: |
          mkdir -p output/ci-smoke
          node scripts/mock-ollama-readiness-server.mjs 11534 "$CLINICAL_AI_DEEP_MODEL" > output/ci-smoke/mock-ollama-readiness.log 2>&1 &
          echo $! > output/ci-smoke/mock-ollama-readiness.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:11534/api/tags >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo "mock ollama failed to start"; cat output/ci-smoke/mock-ollama-readiness.log; exit 1

      - name: Clinical AI tenant rollout preflight
        shell: pwsh
        run: >
          ./scripts/check-clinical-ai-tenant-preflight.ps1
          -BackendBase http://127.0.0.1:5206
          -PilotStage ci_first_pilot_smoke
          -PgHost 127.0.0.1
          -PgPort 5432
          -PgUser vhhealth
          -PgDatabase vhhealth
          -PgPassword '${{ github.run_id }}'
          -OutputPath output/ci-smoke/clinical-ai-tenant-preflight.json
          -RequirePilotSignoff
          -RequireRolloutReady
          -RequireNoWarnings
          -ReviewerQueueWalkthroughConfirmed
          -PhiLoggingReviewed
          -SafetyReviewCadenceConfirmed
          -NoAutomaticPatientDispatchConfirmed

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-e2e-logs
          path: |
            output/ci-smoke
            apps/admin/playwright-report
            apps/admin/test-results
          if-no-files-found: ignore

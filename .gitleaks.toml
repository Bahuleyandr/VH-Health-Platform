title = "VH Health gitleaks config"

[[rules]]
id = "vh-postgres-url-with-credentials"
description = "PostgreSQL URL with inline literal credentials"
regex = '''postgres(?:ql)?://[A-Za-z0-9._~%-]+:[A-Za-z0-9._~!$&'()*+,;=%-]+@'''
keywords = [
  "postgres://",
  "postgresql://",
]

[[rules]]
id = "vh-hardcoded-password-assignment"
description = "Hardcoded password-like assignment with credential-shaped literal"
regex = '''(?i)\b(?:password|passwd|pwd|secret)\b["']?\s*[:=]\s*["'][A-Za-z0-9_./-]*[0-9!@#$%^&*][A-Za-z0-9_!@#$%^&*().,+=/-]{3,}["']'''
keywords = [
  "password",
  "passwd",
  "secret",
]

[extend]
useDefault = true

[allowlist]
description = "Repo-specific generated files, public Firebase client config, and test placeholders."
paths = [
  '''(^|/)\.dart_tool/''',
  '''(^|/)apps/admin/\.next/''',
  '''(^|/)apps/patient/build/''',
  '''(^|/)apps/staff/build/''',
  '''(^|/)output/''',
  '''(^|/)packages/vhhealth_core/build/''',
  '''(^|/)scripts/scan-secrets\.mjs$''',
  '''(^|/)firebase_options\.dart$''',
  '''(^|/)google-services\.json$''',
  # Local-only working-directory artifacts. The `worktree` scan
  # (`gitleaks dir .`) walks the whole tree including .gitignored
  # files, so local DB dumps and Winston log files trip the
  # generic-api-key heuristic on hash/token-shaped substrings. Both
  # paths are gitignored and never reach the repo; treat them like
  # the generated build dirs above. A pg_dump of a populated DB will
  # always look credential-ish — scanning it for source secrets is
  # category error, not security coverage.
  '''(^|/)apps/backend/backups/''',
  '''(^|/)apps/backend/src/logs/''',
  # Android signing config — gitignored, machine-local only (real keystore
  # credentials for local release builds; CI uses repository secrets).
  # Same worktree-scan class as the backups/logs paths above.
  '''(^|/)apps/(patient|staff)/android/key\.properties$''',
]
regexes = [
  '''test-api-key''',
  '''test-jwt-secret-for-ci-must-be-at-least-32-chars''',
  # Local-only QA harness Postgres credentials. The qa_writer role exists
  # only on the dev cluster at 127.0.0.1:55432 with a local-only password,
  # documented in docs/qa-findings/_baseline.md and required verbatim by
  # scripts/qa-reset.mjs and the QA findings' repro steps.
  '''qa_writer:qa_writer_local''',
  # Local-only baseline-regen docker container password. The
  # vhhealth:test@127.0.0.1:56432 URL is the ephemeral docker container
  # used by scripts/rewrite-baseline-header.mjs (vh-pg-baseline). The
  # POSTGRES_PASSWORD=test only ever exists in a local WSL docker run
  # used to regenerate 000_baseline.sql; documented inline in the
  # baseline file and the rewrite script.
  '''postgresql://vhhealth:test@''',
  '''PLACEHOLDER_REPLACE_WITH_KUBESEAL_CIPHERTEXT''',
  # Legacy placeholder used in base/ sealed-secret examples before standardisation.
  # Kept here so the git history of the migration commit doesn't trip the range scan.
  '''REPLACE_WITH_KUBESEAL_OUTPUT''',
  # RFC 4226/6238 TOTP test vector (base32 of "Hello!") used in mfaService.test.js.
  # This is a well-known public test value, not a real credential.
  '''JBSWY3DPEHPK3PXP''',
  '''af2ca5d7aa1663634f6c11eae3a1f4ceb7517720''',
  # Drug-KB source keys are public immutable edition/test identifiers. The
  # generic-api-key heuristic trips on `source_key = '...'` examples and
  # fixture manifests, but these values are not credentials.
  '''vh_indigenous_2026q3''',
  '''vh_indigenous_fixture_v1''',
  '''vh_indigenous_demo''',
  # Shell-variable password references in sealed-secret runbooks
  # (e.g. --from-literal=password="$REPL_PW" after openssl rand). A
  # variable reference is definitionally not a literal credential; the
  # vh-hardcoded-password-assignment rule matches the $NAME shape because
  # $ sits in its specials class.
  '''(?i)\b(?:password|passwd|pwd|secret)\b["']?\s*[:=]\s*"\$[A-Za-z_][A-Za-z0-9_]*"''',
  # Longhorn backupTargetCredentialSecret is a Kubernetes Secret NAME reference,
  # not a credential value. The generic-api-key heuristic trips on the resource
  # name after the colon; the real `longhorn-s3-secret` is created out-of-band by
  # the operator (see the comment above the field in longhorn-app.yaml).
  '''longhorn-s3-secret''',
  # Local-only QA-cluster superuser DSN used verbatim in the run-the-gate command
  # docs (the superpowers W3/W4 plans) + a few deep tests. `postgres:postgres` is a
  # universal local-dev convention (loopback trust auth on 127.0.0.1:55432), never
  # a production credential. Same form as the vhhealth:test@ allowlist above.
  '''postgresql://postgres:postgres@''',
  # Historical NL11-S6 unit-test placeholder from PR #526 before the fixture was
  # changed to passwordless URLs. `db.prod.internal` is a non-routable test host
  # and `pw` was not a credential, but the commit range scan still sees it.
  '''postgresql://vhhealth:pw@''',
  # Local-only dev-cluster DSN (the vhhealth role on :5433, loopback) referenced
  # in a deep-test comment + the backend CLAUDE.md.
  '''postgresql://vhhealth:vhhealth@''',
  # HL7 inbound HMAC test secret — a fixture in
  # hl7-receive-tenant-binding.deep.test.js (W3 WS6), not a real credential.
  '''hl7-tenant-binding-test-secret''',
  # HL7 per-tenant HMAC test secret — a fixture in
  # hl7-receive-tenant-equality.deep.test.js, not a real credential.
  '''hl7-can021-per-tenant-secret''',
  # Test idempotency-key fixtures in ledgerPostings.test.js (Phase 4 P4-6).
  # The generic-api-key heuristic trips on the `idempotencyKey:
  # 'ipd-advance-refund-N'` object-literal shape (identifier ends in "Key",
  # value entropy >3.5). These are arbitrary opaque idempotency tokens for the
  # postAdvanceRefundEntry unit test, not credentials.
  '''ipd-advance-refund-\d+''',
  # Care-pathway migration test actor key. This is a deterministic fixture
  # identifier persisted as event provenance, not an authentication secret.
  # Keep the exact value allowlisted because PR range scans inspect the commit
  # that introduced it even after the working-tree fixture is rewritten.
  '''owner_acceptance_test\.v1''',
  # Documentation phrase describing PostgreSQL application-role and sequence
  # privileges. The generic-api-key rule classified the historical slash form
  # as a credential, so retain an exact history-only exception.
  '''application/sequence''',
  # Staff-app auth test fixture: an unsigned alg:none mock JWT returned by
  # MockClient stubs (header {"alg":"none"}, literal ".sig" signature).
  # Not a credential; the Flutter 3.47 dart-format rejoin now trips generic-api-key.
  '''eyJhbGciOiJub25lIn0\.''',
  # Payment-gateway webhook HMAC unit-test fixtures (PR #878). The working-tree
  # copies were rewritten to digit-free strings that the
  # vh-hardcoded-password-assignment rule cannot match, but PR/push range scans
  # inspect the commit that introduced the original zero-padded placeholders
  # (same history-only class as owner_acceptance_test.v1 above). Self-describing
  # test material, never real credentials.
  '''test-webhook-secret-000000000000''',
  '''another-secret-000000000000000000''',
  # Payment-gateway refund-replay + payment-link unit-test fixtures (PR #878
  # follow-up commit fd084b66). Working-tree copies were rewritten to
  # low-entropy values the generic-api-key heuristic cannot match, but PR/push
  # range scans inspect the commit that introduced the originals (same
  # history-only class as the webhook HMAC fixtures above). Self-describing
  # test material, never real credentials.
  '''pgr_persisted_key_1234''',
  '''abcdefghijklmnop1234567890''',
  # Refund command idempotency fixture introduced in PR #940. The working-tree
  # copy is now deliberately low-entropy, but PR range scans still inspect the
  # introducing commit. This exact string is request-deduplication test data,
  # never an authentication credential.
  '''refund-coverage-key''',
]

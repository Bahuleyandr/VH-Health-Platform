name: Deploy Admin Portal — Staging

# Runs after CI passes on main. Builds the Next.js production bundle, then
# either deploys to Vercel (preferred — the `.vercel-deploy-trigger` file at
# repo root signals Vercel's native integration to pick up the commit) or,
# when the Vercel CLI token is set, pushes an explicit preview deployment
# tagged as staging.
#
# Production deploys are deliberately NOT triggered from this workflow —
# use `workflow_dispatch` on a separate production workflow with an
# `environment: production` manual-approve gate.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.build.outcome }}
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.STAGING_API_URL || 'https://api-staging.vhhealth.app' }}
      NEXT_PUBLIC_WS_URL: ${{ vars.STAGING_WS_URL || 'wss://api-staging.vhhealth.app' }}
      NEXT_PUBLIC_ALLOWED_ORIGIN: ${{ vars.STAGING_ORIGIN || 'https://admin-staging.vhhealth.app' }}
      BACKEND_API_KEY: ${{ secrets.STAGING_BACKEND_API_KEY }}
      JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN_ADMIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - id: build
        run: npx next build

  deploy-vercel:
    needs: build
    runs-on: ubuntu-latest
    # Only runs if VERCEL_TOKEN is set in secrets — otherwise the `git push`
    # to main is the signal Vercel's built-in GitHub integration uses.
    if: ${{ needs.build.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Vercel deploy opt-in
        id: vercel_check
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "VERCEL_TOKEN not set — leaving deploy to Vercel's native git integration."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Vercel CLI deploy (staging preview)
        if: steps.vercel_check.outputs.skip == 'false'
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} \
            --meta "env=staging" --meta "commit=${{ github.sha }}"

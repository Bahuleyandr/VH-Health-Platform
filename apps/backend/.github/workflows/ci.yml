name: Backend CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vhhealth
          POSTGRES_PASSWORD: test
          POSTGRES_DB: vhhealth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vhhealth"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://vhhealth:test@localhost:5432/vhhealth
      API_KEY: test-api-key
      JWT_SECRET: test-jwt-secret-for-ci-must-be-at-least-32-chars
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Security audit
        run: |
          npm audit --audit-level=critical
          npx audit-ci --critical

      - run: npm run lint

      - name: Validate Swagger structure
        run: npm run swagger:validate

      - name: Lint OpenAPI with Spectral
        run: npx spectral lint src/docs/swagger-complete.yaml

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply Prisma schema
        run: npx prisma db push --force-reset --skip-generate

      - name: Apply raw migrations + seed lookup data
        # Prisma schema only covers 69 of ~170 tables the tests need. The raw
        # migrations under `migrations/` create the rest (ot_schedules, blood_requests,
        # vitals_chart, diagnoses, admissions, etc.) and the seed scripts populate
        # departments / doctors / ICD-10 that integration tests reference.
        run: node scripts/ci-setup-db.mjs

      - name: Schema drift check
        # Fails the build if any table the detector expects is missing.
        # Unexpected tables (raw migrations) are informational only.
        run: node scripts/ci-schema-drift.mjs

      - name: Run tests
        run: node --max-old-space-size=4096 --experimental-vm-modules node_modules/jest/bin/jest.js --runInBand --forceExit --detectOpenHandles

      - name: Notify Discord on failure
        if: failure()
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"🔴 **Backend CI failed** on \`${{ github.ref_name }}\`\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}" || true

  deploy-staging:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Deploy database migrations to staging
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "STAGING_DATABASE_URL not set — skipping migration"
            exit 0
          fi
          npx prisma migrate deploy

  fhir-conformance:
    # Validates a small set of sample FHIR R4 bundles against the official
    # HL7 IG Publisher / Validator JAR. Runs on every PR; non-blocking
    # (continue-on-error) until the team commits to fixing every warning.
    # The validator JAR is large (~150MB) and slow (~30s per resource), so
    # we cache it and run only against the curated sample bundles in
    # `src/services/fhir/__samples__/` rather than the full test corpus.
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (validator requires Java)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache validator JAR
        id: cache-validator
        uses: actions/cache@v4
        with:
          path: ~/.cache/fhir-validator
          key: fhir-validator-6.3.11

      - name: Download validator JAR
        if: steps.cache-validator.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/fhir-validator
          curl -L -o ~/.cache/fhir-validator/validator_cli.jar \
            https://github.com/hapifhir/org.hl7.fhir.core/releases/download/6.3.11/validator_cli.jar

      - name: Validate sample bundles (R4)
        run: |
          if [ ! -d src/services/fhir/__samples__ ]; then
            echo "No __samples__/ directory — skipping conformance run."
            echo "Drop FHIR R4 JSON bundles in src/services/fhir/__samples__/ to enable."
            exit 0
          fi
          set -e
          # Any *.json under __samples__/ (not in golden/) is informational —
          # the `|| true` keeps the build green while warnings are triaged.
          shopt -s nullglob
          for f in src/services/fhir/__samples__/*.json; do
            echo "=== Validating (informational) $f ==="
            java -jar ~/.cache/fhir-validator/validator_cli.jar "$f" -version 4.0.1 || true
          done

      - name: Validate golden bundles strict (R4)
        # Bundles under __samples__/golden/ MUST validate clean. Any error
        # here fails the build. This is the gate that guards against
        # regressions in the handful of known-good resources while the
        # broader sample set stays informational.
        run: |
          if [ ! -d src/services/fhir/__samples__/golden ]; then
            echo "No golden/ subdirectory — skipping strict run."
            exit 0
          fi
          shopt -s nullglob
          failed=0
          for f in src/services/fhir/__samples__/golden/*.json; do
            echo "=== Validating (STRICT) $f ==="
            if ! java -jar ~/.cache/fhir-validator/validator_cli.jar "$f" -version 4.0.1; then
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo "✗ $failed golden bundle(s) failed FHIR R4 validation."
            exit 1
          fi
          echo "✓ All golden bundles validated clean."

      - name: Notify Discord on failure
        if: failure()
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"⚠️ **FHIR conformance** flagged warnings on \`${{ github.ref_name }}\`\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}" || true

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Configure git credentials
        run: |
          git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true  # SARIF upload fails on private repos without GitHub Advanced Security

      - name: Notify Discord on failure
        if: failure()
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"🔴 **Backend CodeQL failed** on \`${{ github.ref_name }}\`\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}" || true

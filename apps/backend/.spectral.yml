# Spectral ruleset for src/docs/openapi.json (the generated OpenAPI spec).
#
# Deliberately the stock ruleset, with NOTHING demoted. Two rules dominate this
# spec's history and both are recorded here so the next person does not
# re-litigate them:
#
# `operation-tags` — was 3,632 warnings (100% of operations, since nothing set
#   tags at all). FIXED at the source rather than silenced: every operation now
#   carries exactly one PRIMARY domain tag, drawn from the curated registry
#   OPENAPI_TAG_REGISTRY in scripts/openapi/base.mjs. The rule stays a live gate
#   — it is now satisfiable, so any new untagged operation is a real regression.
#
#   Precedence (resolveTags, scripts/openapi/buildSpec.mjs), most specific first:
#     1. a per-operation overlay `ov.tags` / `ov.tag`
#     2. an explicit router declaration (src/config/openapiDomain.js
#        markRouterDomain) — the intended long-term source, since it pins the
#        published tag in code and survives file moves and re-mounts
#     3. the route module's filename — BOOTSTRAP ONLY
#     4. the URL path, audience segments skipped
#     5. `unclassified` — visible, budgeted debt; never a guessed domain
#
#   NOTE: tags are NOT primarily derived from the URL path. The first segment
#   after /api/v1 is frequently an AUDIENCE prefix (admin, staff, portal), which
#   would put 895 operations — 24.6% of the API — under a single `admin` tag and
#   rebuild the junk drawer this taxonomy exists to avoid. `admin`, `staff` and
#   `portal` can never become a primary tag by inference.
#
#   The registry is a GATE: an operation tag that is not declared there fails
#   generation. That is what makes the filename bootstrap safe (a renamed module
#   stops the build instead of silently republishing a new taxonomy) and what
#   keeps `clinical-ai` / `clinicalAi` / `clinical_ai` from becoming 3 groups.
#
# `operation-description` — 3,574 warnings, and left at WARN on purpose.
#   * Not auto-generated. Synthesising a description from method + path
#     ("Get appointment by id" for GET /appointments/{id}) restates the URL
#     rather than documenting it, and would make the published API docs look
#     documented when they are not. Owner decision, 2026-08-03.
#   * Not demoted either. Demoting hides the debt permanently: nobody ever sees
#     it shrink, and a subsystem that later writes real descriptions gets no
#     credit and no signal.
#   The 58 genuine descriptions in the spec all come from the per-subsystem
#   overlay modules registered in scripts/generate-openapi.mjs (SCHEMA_MODULES),
#   which already support `summary` / `description` per operation. Real
#   descriptions accrue there, per subsystem, as owners write them.
#
# So how does a NEW warning stay visible if the rules are noisy?
# `npm run openapi:lint-budget` (scripts/check-openapi-lint-budget.mjs) pins
# every current diagnostic INDIVIDUALLY in .spectral-baseline.txt — identity is
# { severity, code, path, message } — and fails CI when one appears that is not
# listed. Existing debt stays visible and can only shrink; anything new fails
# loudly, naming the exact operation. That is the signal this ruleset alone
# cannot provide, because `spectral lint` exits 0 on warnings.
#
# It deliberately does NOT baseline per-rule COUNTS. That was tried and measured
# against the real spec: document one operation while a different one loses its
# description and the count is unchanged, so a count gate reports "none
# increased" and exits 0 while a brand-new warning exists. Counts are kept only
# as debt telemetry in the gate's output.
extends: ["spectral:oas"]

# The ONLY rule exception in this ruleset, and it is scoped to two operations.
#
# `operation-success-response` requires at least one 2xx/3xx response. DELETE
# /bulk-delete is a deliberate RETIREMENT TOMBSTONE: S4 removed appointment hard
# deletion in favour of the canonical cancellation and retention workflows, and
# the route was kept so the operation answers an explicit, documented
# 410 + APPOINTMENT_HARD_DELETE_RETIRED instead of a bare 404. It can never
# answer 2xx/3xx — that is the point, and it is pinned as a safety invariant by
# src/tests/unit/appointmentAdminCanonicalLifecycle.test.js, which asserts both
# mount prefixes return 410 "without touching a live source" (no lifecycle
# transition, no raw SQL). Deleting the route to satisfy the rule would delete
# that guard and let a future hard-delete implementation land unnoticed.
#
# So this is NOT debt and does not belong in .spectral-baseline.txt (a ledger of
# findings we intend to fix). It is a permanent, correct exception, declared
# where the next reader will find it. Both mounts are listed because
# appointmentAdminRoutes is mounted at /api/v1/appointments/admin AND
# /api/v1/admin/appointments.
#
# Scope this as narrowly as possible — never widen it to the whole spec.
overrides:
  - files:
      - "**/openapi.json#/paths/~1api~1v1~1appointments~1admin~1bulk-delete/delete"
      - "**/openapi.json#/paths/~1api~1v1~1admin~1appointments~1bulk-delete/delete"
    rules:
      operation-success-response: "off"

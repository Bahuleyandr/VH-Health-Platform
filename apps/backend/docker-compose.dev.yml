# LOCAL DEVELOPMENT ONLY.
#
# Production deploys to an on-prem 3-node RKE2 Kubernetes cluster.
# See docs/DEPLOYMENT_GUIDE.md.
#
# This compose file exists for:
#   - Local developer testing without touching the cluster
#   - CI test runs (Postgres service container)
#   - Pre-k8s-bootstrap smoke testing on a single machine
#
# Do NOT use this in production.

version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env.local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vhhealth-network

  db:
    image: postgres:16-alpine
    # POSTGRES_PASSWORD MUST be set in your local .env before `docker compose up`.
    # Compose exits with an "environment variable is required" error if unset.
    environment:
      POSTGRES_USER: vhhealth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vhhealth
    ports:
      - "5432:5432"
    volumes:
      - vhhealth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vhhealth -d vhhealth"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - vhhealth-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - vhhealth-redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - vhhealth-network

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/snippets:/etc/nginx/snippets:ro
      - ./ssl-certs:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vhhealth-network

networks:
  vhhealth-network:
    driver: bridge

volumes:
  vhhealth-db-data:
  vhhealth-redis-data:

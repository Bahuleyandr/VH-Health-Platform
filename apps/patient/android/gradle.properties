# ============================================
# GRADLE JVM CONFIGURATION
# ============================================
# Capped at 2G for GitHub Actions free runners (7GB total RAM available)
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+UseG1GC -XX:+UseStringDeduplication

# ============================================
# GRADLE PERFORMANCE OPTIMIZATION
# ============================================
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true
org.gradle.cache.push=true
org.gradle.workers.max=2
org.gradle.vfs.watch=true

# Configuration cache disabled due to Flutter compatibility issues
# org.gradle.configuration-cache=true
# org.gradle.configuration-cache.problems=warn

# ============================================
# ANDROID CONFIGURATION
# ============================================
android.useAndroidX=true
# Jetifier disabled — Flutter engine JARs are already AndroidX-compatible
# and Jetifier causes JetifyTransform failures on flutter engine artifacts
android.enableJetifier=false
android.javaCompile.suppressSourceTargetDeprecationWarning=true
android.nonTransitiveRClass=true
android.enableIncrementalAnnotationProcessing=true

# ============================================
# KOTLIN CONFIGURATION
# ============================================
kotlin.code.style=official
# Disabled to work around Kotlin compiler bug when pub cache (C:) and
# project (D:) live on different Windows drives — incremental compiler
# can't compute relative paths across roots and crashes the build with
# "this and base files have different roots".
kotlin.incremental=false
kotlin.incremental.jvm=false
kotlin.mpp.hierarchicalStructureSupport=true

# ============================================
# BUILD OPTIMIZATION
# ============================================
org.gradle.cache.cleanup=true
org.gradle.wrapper.validate=true

# ============================================
# NETWORK SETTINGS
# ============================================
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000

# ============================================
# FLUTTER & ANDROID SPECIFIC
# ============================================
flutter.buildMode=release
android.injected.build.model.feature.full_dependencies=false
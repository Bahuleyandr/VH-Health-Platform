<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- Calendar body -->
  <rect x="12" y="20" width="72" height="68" rx="8" fill="white" stroke="currentColor" stroke-width="3"/>
  <!-- Header strip -->
  <rect x="12" y="20" width="72" height="18" rx="8" fill="currentColor"/>
  <rect x="12" y="32" width="72" height="6" fill="currentColor"/>
  <!-- Binding rings -->
  <line x1="28" y1="10" x2="28" y2="26" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  <line x1="68" y1="10" x2="68" y2="26" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  <!-- Date grid (faint) -->
  <g stroke="currentColor" stroke-opacity="0.25" stroke-width="1">
    <line x1="32" y1="50" x2="38" y2="50"/>
    <line x1="44" y1="50" x2="50" y2="50"/>
    <line x1="56" y1="50" x2="62" y2="50"/>
    <line x1="32" y1="62" x2="38" y2="62"/>
    <line x1="56" y1="62" x2="62" y2="62"/>
    <line x1="32" y1="74" x2="38" y2="74"/>
    <line x1="44" y1="74" x2="50" y2="74"/>
  </g>
  <!-- Highlighted "today" cell with checkmark -->
  <circle cx="48" cy="62" r="11" fill="currentColor"/>
  <path d="M42 62 L 47 67 L 55 58" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- Hospital building (3-tier) -->
  <!-- Base -->
  <rect x="10" y="58" width="76" height="32" rx="2" fill="currentColor" fill-opacity="0.92"/>
  <!-- Middle floor -->
  <rect x="18" y="38" width="60" height="22" fill="currentColor" fill-opacity="0.85"/>
  <!-- Top tower -->
  <rect x="32" y="20" width="32" height="20" fill="currentColor" fill-opacity="0.78"/>
  <!-- Big medical cross on top tower -->
  <g transform="translate(48,30)">
    <rect x="-2" y="-7" width="4" height="14" fill="white"/>
    <rect x="-7" y="-2" width="14" height="4" fill="white"/>
  </g>
  <!-- Windows: 3 rows × 2-4 cells, white panes -->
  <g fill="white">
    <rect x="22" y="44" width="6" height="6" rx="1"/>
    <rect x="32" y="44" width="6" height="6" rx="1"/>
    <rect x="58" y="44" width="6" height="6" rx="1"/>
    <rect x="68" y="44" width="6" height="6" rx="1"/>
    <rect x="14" y="64" width="6" height="6" rx="1"/>
    <rect x="24" y="64" width="6" height="6" rx="1"/>
    <rect x="66" y="64" width="6" height="6" rx="1"/>
    <rect x="76" y="64" width="6" height="6" rx="1"/>
    <rect x="14" y="76" width="6" height="6" rx="1"/>
    <rect x="24" y="76" width="6" height="6" rx="1"/>
    <rect x="66" y="76" width="6" height="6" rx="1"/>
    <rect x="76" y="76" width="6" height="6" rx="1"/>
  </g>
  <!-- Entrance arch -->
  <path d="M40 90 V 76 a 8 8 0 0 1 16 0 V 90 Z" fill="white"/>
</svg>

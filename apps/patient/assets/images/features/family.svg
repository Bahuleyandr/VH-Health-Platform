<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- Three figures (parent + parent + child), simple silhouettes -->
  <!-- Adult left -->
  <circle cx="26" cy="30" r="9" fill="currentColor" fill-opacity="0.92"/>
  <path d="M14 78 V 56 a 12 12 0 0 1 24 0 V 78 Z" fill="currentColor" fill-opacity="0.92"/>
  <!-- Adult right -->
  <circle cx="70" cy="30" r="9" fill="currentColor" fill-opacity="0.92"/>
  <path d="M58 78 V 56 a 12 12 0 0 1 24 0 V 78 Z" fill="currentColor" fill-opacity="0.92"/>
  <!-- Child (smaller, between & in front) -->
  <circle cx="48" cy="44" r="7" fill="white" stroke="currentColor" stroke-width="2.5"/>
  <path d="M40 84 V 66 a 8 8 0 0 1 16 0 V 84 Z" fill="white" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Tiny heart floating above the child -->
  <path d="M48 22 C 44 18, 40 18, 40 22 C 40 26, 48 30, 48 30 C 48 30, 56 26, 56 22 C 56 18, 52 18, 48 22 Z"
    fill="white" stroke="currentColor" stroke-width="1.5"/>
</svg>

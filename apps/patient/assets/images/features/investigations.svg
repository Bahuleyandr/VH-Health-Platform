<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- Test tube tilted at -20° with a liquid fill + bubbles -->
  <g transform="rotate(-22 48 48)">
    <!-- Tube outline -->
    <path d="M36 12 H 60 V 16 H 56 V 70 a 8 8 0 0 1 -16 0 V 16 H 36 z"
      fill="white" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
    <!-- Liquid (lower 60% of the tube) -->
    <path d="M40 38 V 70 a 8 8 0 0 0 16 0 V 38 z"
      fill="currentColor" fill-opacity="0.85"/>
    <!-- Surface meniscus -->
    <path d="M40 38 Q 48 34 56 38" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Bubbles -->
    <circle cx="46" cy="56" r="2.5" fill="white" fill-opacity="0.85"/>
    <circle cx="50" cy="48" r="1.5" fill="white" fill-opacity="0.7"/>
    <circle cx="44" cy="44" r="1.2" fill="white" fill-opacity="0.7"/>
  </g>
  <!-- Falling droplet next to the tube (suggests sample / drop) -->
  <path d="M70 70 C 70 64, 66 60, 66 56 C 66 64, 74 64, 74 56 C 74 60, 70 64, 70 70 Z"
    fill="currentColor" fill-opacity="0.85"/>
</svg>

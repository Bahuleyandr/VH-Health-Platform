<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- Circular refresh arrow looping around a vertical pill -->
  <!-- Arrow track (3/4 circle) -->
  <path d="M 80 48 a 32 32 0 1 0 -10 22"
    stroke="currentColor" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Arrowhead at the end of the track -->
  <path d="M 70 60 L 70 76 L 84 70 Z" fill="currentColor"/>
  <!-- Vertical pill (center) -->
  <g transform="translate(48,48)">
    <!-- Top half (white) -->
    <path d="M-12 -2 a 12 12 0 0 1 24 0 V 0 H -12 Z" fill="white" stroke="currentColor" stroke-width="2.5"/>
    <!-- Bottom half (color) -->
    <path d="M-12 0 H 12 V 2 a 12 12 0 0 1 -24 0 Z" fill="currentColor"/>
    <!-- Seam -->
    <line x1="-12" y1="0" x2="12" y2="0" stroke="currentColor" stroke-width="1.5"/>
    <!-- Subtle highlight -->
    <ellipse cx="-4" cy="-8" rx="3" ry="1.5" fill="currentColor" fill-opacity="0.25"/>
  </g>
</svg>

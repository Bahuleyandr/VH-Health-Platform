<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- Running shoe in profile, simplified -->
  <!-- Sole base -->
  <path d="M10 64 Q 24 56 50 56 Q 74 56 86 64 L 88 70 Q 80 78 50 78 Q 24 78 12 72 Z"
    fill="currentColor" fill-opacity="0.95"/>
  <!-- Sole outsole rim (white separation) -->
  <path d="M12 72 Q 50 68 88 70" stroke="white" stroke-width="1.5" fill="none" stroke-opacity="0.7"/>
  <!-- Upper (the curved top of the shoe) -->
  <path d="M28 56 Q 32 36 50 36 Q 64 36 70 48 Q 78 52 84 56"
    stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="currentColor" fill-opacity="0.7"/>
  <!-- Laces: 3 short cross-hatches -->
  <path d="M40 44 L 56 50" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M44 40 L 60 46" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M48 36 L 64 42" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Motion lines behind heel -->
  <path d="M4 50 L 14 50" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.5"/>
  <path d="M2 58 L 10 58" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.4"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- Stethoscope-meets-heartbeat: arc + heart hanging at the end -->
  <!-- Tube arc (the binaurals) -->
  <path d="M22 16 V 38 a 18 18 0 0 0 36 0 V 16"
    stroke="currentColor" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Earpiece tips -->
  <circle cx="22" cy="16" r="3.5" fill="currentColor"/>
  <circle cx="58" cy="16" r="3.5" fill="currentColor"/>
  <!-- Connector cable down to chestpiece -->
  <path d="M40 56 V 70" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Chestpiece (heart-shaped — playful twist) -->
  <path d="M40 86 C 28 76, 22 68, 28 60 C 32 56, 38 58, 40 64 C 42 58, 48 56, 52 60 C 58 68, 52 76, 40 86 Z"
    fill="currentColor" fill-opacity="0.92"/>
  <!-- Mini EKG inside the heart -->
  <path d="M30 73 L 36 73 L 38 68 L 42 78 L 44 73 L 50 73"
    stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Small pulse dot off the side -->
  <circle cx="74" cy="44" r="3" fill="currentColor" fill-opacity="0.7"/>
  <circle cx="80" cy="50" r="2" fill="currentColor" fill-opacity="0.45"/>
</svg>

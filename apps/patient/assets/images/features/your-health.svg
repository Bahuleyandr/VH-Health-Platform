<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- Anatomical heart silhouette in two-tone (rounded, slightly off-axis like a sketch) -->
  <path d="M48 84 C 14 56, 6 38, 18 22 C 30 10, 42 18, 48 26 C 54 18, 66 10, 78 22 C 90 38, 82 56, 48 84 Z"
    fill="currentColor" fill-opacity="0.92"/>
  <path d="M48 84 C 30 70, 22 60, 18 50 C 16 44, 16 38, 20 32 C 26 24, 36 22, 42 28 C 46 32, 48 36, 48 38 Z"
    fill="currentColor" fill-opacity="0.7"/>
  <!-- EKG waveform across the heart, in white for contrast -->
  <path d="M16 50 L 32 50 L 38 38 L 44 60 L 50 32 L 56 56 L 64 50 L 80 50"
    stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Single bright pulse highlight dot -->
  <circle cx="50" cy="32" r="2.5" fill="white"/>
</svg>

arb-dir: lib/l10n
template-arb-file: intl_en.arb

# ▶ Where to place the generated file
output-dir: lib/generated
output-localization-file: app_localizations.dart
output-class: AppLocalizations

# Non-English ARB files intentionally trail English during stabilization.
# Missing translation warnings are tracked in docs/PLATFORM_REMEDIATION_PLAN.md.
suppress-warnings: true
untranslated-messages-file: build/l10n-untranslated-messages.json

preferred-supported-locales:
  - en
  - ta
  - hi
  - te
  - ml

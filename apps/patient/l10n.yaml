arb-dir: lib/l10n
template-arb-file: intl_en.arb

# ▶ Where to place the generated file
output-dir: lib/generated
output-localization-file: app_localizations.dart
output-class: AppLocalizations

# All shipped ARBs are held to structural key and placeholder parity by
# apps/patient/scripts/i18n-verify.mjs --check. Linguistic review remains a
# separate, fail-closed human gate.
suppress-warnings: false
untranslated-messages-file: build/l10n-untranslated-messages.json

preferred-supported-locales:
  - en
  - ta
  - hi
  - te
  - ml

name: vhhealth
description: A new Flutter project for VH Health (with working Firebase OTP)
publish_to: 'none'
version: 1.0.0+1  # Added build number
resolution: workspace

environment:
  sdk: ">=3.8.1 <4.0.0"

# ─────────────────────────────────────────────────────────────────────────────
#  Dependencies
# ─────────────────────────────────────────────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter

  # ── Shared core ────────────────────────────────────────────────────────────
  # In pub workspace mode, resolution happens by package name — no path needed.
  vhhealth_core: any
    
  # ── Localisation ───────────────────────────────────────────────────────────
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  
  # UI & widgets
  go_router: ^16.0.0
  cupertino_icons: ^1.0.8
  markdown_widget: ^2.3.2+6
  badges: ^3.1.1
  lucide_icons: ^0.257.0
  flutter_svg: ^2.0.10+1
  table_calendar: ^3.0.9
  pin_code_fields: ^8.0.1
  cached_network_image: ^3.3.1

  # State-management
  provider: ^6.1.0
  
  # Networking / storage / utilities
  http: ^1.4.0
  web_socket_channel: ^3.0.1
  encrypt: ^5.0.3
  shared_preferences: ^2.3.2      # Updated from 2.2.2
  path_provider: ^2.1.1
  open_filex: ^4.7.0
  file_picker: ^10.2.0            # Updated from 10.1.9
  image_picker: ^1.2.2            # Updated from 1.0.4
  flutter_secure_storage: ^9.2.4
  permission_handler: ^12.0.0+1
  share_plus: ^10.1.4
  screenshot: ^3.0.0
  pedometer: ^4.0.1
  health: ^13.3.1
  workmanager: ^0.9.0+3
  geolocator: ^14.0.1
  add_2_calendar: ^3.0.1
  local_auth: ^2.3.0              # Updated from 2.1.6
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  url_launcher: ^6.3.1            # Updated from 6.2.5
  vector_math: ^2.2.0
  uuid: ^4.5.1
  
  # ── Firebase (do not change versions) ──────────────────────────────────────
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  firebase_app_check: ^0.4.0
  firebase_crashlytics: ^5.0.0
  firebase_analytics: ^12.0.0

# ─────────────────────────────────────────────────────────────────────────────
#  Dev Dependencies
# ─────────────────────────────────────────────────────────────────────────────
  dio: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.14.1
  flutter_gen_runner: ^5.14.1
  leak_tracker_flutter_testing: ^3.0.9

# ─────────────────────────────────────────────────────────────────────────────
#  Dependency Overrides (only if needed - consider removing if not necessary)
# ─────────────────────────────────────────────────────────────────────────────
dependency_overrides:
  # Only keep these if you're experiencing specific version conflicts
  flutter_secure_storage_platform_interface: ^2.0.1
  leak_tracker: ^11.0.1
  leak_tracker_testing: ^3.0.2
  flutter_secure_storage_linux: ^2.0.1
  flutter_secure_storage_macos: ^4.0.0
  flutter_secure_storage_web: ^2.0.0
  flutter_secure_storage_windows: ^4.0.0
  vector_math: 2.2.0

  # Local plugin copies with manual build.gradle lint fixes
  geolocator_android:
    path: local_plugins/geolocator_android

  flutter_plugin_android_lifecycle:
    path: local_plugins/flutter_plugin_android_lifecycle
# ─────────────────────────────────────────────────────────────────────────────
#  Flutter section
# ─────────────────────────────────────────────────────────────────────────────
flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/images/logo.png
    - assets/images/hospital_bg.jpg
    - assets/images/hospital_icon.png
    - assets/images/features/
    
  fonts:
    - family: DancingScript
      fonts:
        - asset: assets/fonts/DancingScript-Regular.ttf
        - asset: assets/fonts/DancingScript-Bold.ttf
          weight: 700
        - asset: assets/fonts/DancingScript-Medium.ttf
          weight: 500
        - asset: assets/fonts/DancingScript-SemiBold.ttf
          weight: 600
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf

# ─────────────────────────────────────────────────────────────────────────────
#  Flutter Gen config (optional)
# ─────────────────────────────────────────────────────────────────────────────
flutter_gen:
  assets:
    enabled: true
  fonts:
    enabled: true

name: Deploy Staff App — Staging

# Mirrors the patient app staging workflow. Builds a debug APK on main and
# pushes it to Firebase App Distribution under a different App ID
# (FIREBASE_APP_ID_STAFF). Skips upload if credentials missing; build runs
# unconditionally so release-mode regressions surface immediately.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Bahuleyandr/vhhealth-core
          path: vhhealth-core
          token: ${{ secrets.GH_PAT }}

      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - name: Rewire path dep for CI
        run: |
          sed -i 's|path: ../vhhealth-core|path: ./vhhealth-core|' pubspec.yaml

      - name: Resolve deps
        run: |
          (cd vhhealth-core && flutter pub get)
          flutter pub get

      - name: Scaffold Android platform
        run: |
          flutter create --platforms=android --project-name vhhealth_staff .
          rm -f test/widget_test.dart

      - name: Build debug APK
        run: flutter build apk --debug --split-per-abi

      - name: Check Firebase credentials
        id: fb
        run: |
          if [ -z "${{ secrets.FIREBASE_APP_ID_STAFF }}" ] || [ -z "${{ secrets.FIREBASE_TOKEN }}" ]; then
            echo "Firebase App Distribution secrets missing — skipping upload."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload to Firebase App Distribution
        if: steps.fb.outputs.skip == 'false'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_STAFF }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: staging-testers
          releaseNotes: |
            Build ${{ github.sha }} on ${{ github.ref_name }}
          file: build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk

      - name: Notify Discord on failure
        if: failure()
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"🔴 **Staff App staging deploy failed** on \`${{ github.ref_name }}\`\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}" || true

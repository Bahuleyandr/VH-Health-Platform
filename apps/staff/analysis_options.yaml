# Analysis options for vhhealth_staff
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Downgrade deprecated API usage from warning to info (will be fixed in a future cleanup)
    deprecated_member_use: info
    deprecated_member_use_from_same_package: info
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    avoid_print: true
    prefer_const_constructors: true
    # Fire-and-forget futures must be explicit (`unawaited(...)`) — silent
    # dropped awaits have caused real clinical-data bugs (2026-08 hygiene
    # audit). discarded_futures was evaluated too but produces ~570 hits
    # (mostly sync closures calling Future-returning APIs by design) — too
    # much churn to adopt in one sweep; revisit per-package.
    unawaited_futures: true

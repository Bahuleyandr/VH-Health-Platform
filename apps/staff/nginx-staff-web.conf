# nginx config for the staff Flutter web bundle.
#
# SPA routing: every non-file request rewrites to /index.html so
# GoRouter can handle deep links like /clinical-ai/queue when a
# clinician bookmarks the page or refreshes mid-session.
#
# Caching:
#   * index.html        — `no-store`. Picks up new builds immediately
#                         when ArgoCD rolls out a new image.
#   * main.dart.js,     — 1 year + immutable. Filenames are
#     flutter.js,         hash-stamped by `flutter build web` so
#     /assets/*           cache invalidation is automatic.
#     /canvaskit/*
#   * /icons, manifest  — 1 day. Rarely change but no hash; short
#                         max-age avoids stale icon issues.
#
# Compression: gzip + brotli for text-y assets. CanvasKit binaries
# are already compressed; skip them to avoid wasted CPU.
#
# Security headers mirror what the backend emits via helmet.js so the
# clinician sees the same posture whether they're on the staff web app
# or interacting with the API directly.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---------- security headers --------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Strict CSP for a Flutter web app: needs unsafe-inline for the
    # bootstrap script, and connect-src must permit the LAN backend.
    # Hospital deployments override the connect-src host via an
    # ingress-level annotation if their backend lives at a different
    # subdomain than `same-origin`.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss: https:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'" always;

    # ---------- gzip / brotli ----------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    # ---------- caching ----------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location ~* ^/(main\.dart\.js|flutter\.js|flutter_service_worker\.js|flutter_bootstrap\.js)$ {
        # Hash-stamped flutter outputs. Long cache + immutable.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /canvaskit/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # CanvasKit wasm + workers are pre-compressed; skip gzip/brotli.
        gzip off;
        try_files $uri =404;
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "public, max-age=86400" always;
    }

    # ---------- SPA fallback ------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- ops --------------------------------------------------
    # Lightweight readiness — nginx itself is the source of truth.
    location = /healthz {
        access_log off;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
        default_type text/plain;
    }
}

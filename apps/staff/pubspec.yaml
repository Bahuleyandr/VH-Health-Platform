name: vhhealth_staff
description: VHHealth Staff App - Hospital staff management
publish_to: 'none'
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ">=3.8.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # In pub workspace mode, resolution happens by package name — no path needed.
  vhhealth_core: any
  http: ^1.4.0
  flutter_secure_storage: ^10.0.0
  go_router: ^17.2.2
  provider: ^6.1.0
  shared_preferences: ^2.3.2
  lucide_icons: ^0.257.0
  intl: ^0.20.2
  local_auth: ^3.0.1
  # Aligned with patient app to allow a unified Melos/pub workspace.
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  firebase_crashlytics: ^5.0.0
  flutter_local_notifications: ^21.0.0
  mobile_scanner: ^7.2.0
  geolocator: ^14.0.0
  table_calendar: ^3.1.2
  permission_handler: ^12.0.0+1
  image_picker: ^1.2.2
  file_picker: ^11.0.2
  url_launcher: ^6.3.1
  web_socket_channel: ^3.0.1
  sqflite: ^2.4.2+1
  connectivity_plus: ^7.1.1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

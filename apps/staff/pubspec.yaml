name: vhhealth_staff
description: VHHealth Staff App - Hospital staff management
publish_to: 'none'
version: 1.0.1+2
resolution: workspace

environment:
  sdk: ">=3.8.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Built-in Material/Cupertino translations for date pickers,
  # back-button labels, etc. Required to declare supportedLocales =
  # [en, hi, ta, te] cleanly. App-specific strings live in
  # `lib/l10n/app_strings.dart` (manual map, no codegen).
  flutter_localizations:
    sdk: flutter
  # In pub workspace mode, resolution happens by package name — no path needed.
  vhhealth_core: any
  http: ^1.4.0
  http_parser: ^4.1.2
  flutter_secure_storage: ^10.3.1
  screen_protector: ^1.5.0
  go_router: ^17.3.0
  provider: ^6.1.0
  shared_preferences: ^2.3.2
  lucide_icons: ^0.257.0
  intl: ^0.20.2
  local_auth: ^3.0.1
  # Aligned with patient app to allow a unified Melos/pub workspace.
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  firebase_crashlytics: ^5.2.3
  flutter_local_notifications: ^21.0.0
  mobile_scanner: ^7.2.0
  geolocator: ^14.0.0
  table_calendar: ^3.1.2
  permission_handler: ^12.0.0+1
  image_picker: ^1.2.2
  file_picker: ^11.0.2
  url_launcher: ^6.3.1
  web_socket_channel: ^3.0.1
  sqflite: ^2.4.2+1
  # Desktop FFI bridge for sqflite — required on Windows/Linux/macOS
  # because the default sqflite plugin only ships native libs for
  # Android/iOS. Without this, OfflineQueue.initDb throws "database-
  # Factory not initialized" on every desktop launch and the
  # connectivity sync silently breaks. main.dart wires it via
  # databaseFactory = databaseFactoryFfi on the desktop platforms.
  sqflite_common_ffi: ^2.4.0+3
  connectivity_plus: ^7.1.1
  path: ^1.9.0
  # Voice dictation on notes textareas. `record` works on Android/iOS/
  # macOS/Windows/Linux; `path_provider` is needed to drop the recorded
  # WAV into a temp dir before upload. Wired through
  # `lib/core/widgets/voice_dictate_button.dart`.
  record: ^6.2.1
  path_provider: ^2.1.5
  # PDF generation + system print dialog. Used by the bed-board's
  # printer button to render a clean A4 occupancy sheet (still common
  # for paper handovers in Indian hospitals). `pdf` builds the
  # document; `printing` shows the platform print dialog.
  printing: ^5.13.0
  pdf: ^3.11.0
  sentry_flutter: ^9.21.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  msix: ^3.16.13

msix_config:
  display_name: VH Health Staff
  publisher_display_name: VH Health
  identity_name: com.vhhealth.staff
  logo_path: assets/icon.png
  output_name: VHHealthStaff
  capabilities: internetClient, location, microphone, webcam
  languages: en-us
  install_certificate: false
  app_installer:
    hours_between_update_checks: 0
    automatic_background_task: false
    update_blocks_activation: true
    show_prompt: true
    force_update_from_any_version: false

flutter:
  uses-material-design: true

# OpenAPI → Dart codegen driver for vhhealth_core.
#
# Run `dart run build_runner build --delete-conflicting-outputs` after
# refreshing `swagger/api.yaml` from vh-health-backend/src/docs/swagger-complete.yaml.
# Generated files land in lib/api/generated/ and are exported via
# lib/api/vhhealth_api.dart.
#
# Why swagger_dart_code_generator (not openapi-generator):
# - Pure Dart. Plays with build_runner, which both Flutter apps already use.
# - No Java toolchain in CI.
# - Small generated output; opinionated but legible.
# See docs/API_CODEGEN.md for how to run it + migration playbook.

targets:
  $default:
    sources:
      include:
        - lib/**
        - swagger/**
        - pubspec.yaml
      exclude:
        - lib/api/generated/**  # never feed generated into the generator
    builders:
      swagger_dart_code_generator:
        options:
          input_folder: 'swagger/'
          output_folder: 'lib/api/generated/'
          # Use a single-file output per spec — easier to audit the diff
          # when the backend spec changes.
          input_urls_to_file: false
          # Chopper client + models:
          build_only_models: false
          with_base_url: false       # base URL injected at call time via ApiConfig
          with_converter: true
          ignore_headers: false
          # Nullable by default for POST bodies — backend validation lives
          # server-side, Dart side shouldn't re-duplicate.
          default_values_map:
            - type_name: 'bool'
              default_value: 'false'
          # Rename endpoints that collide or whose generated names are ugly.
          # Keep empty until codegen runs and we see the output.
          overriden_requests: []

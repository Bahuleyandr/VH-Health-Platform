---
# Cross-role defaults for variables that span common + hardening + firewall +
# rke2 roles. These are role-prefix-free on purpose (var-naming[no-role-prefix]
# only applies inside a single role's defaults/ tree); inventories override them.

# Management networks — allowed SSH ingress + fail2ban whitelist.
management_cidrs:
  - "10.0.0.0/8"

# Clinical client networks approved for the private ingress. Empty is the
# fail-closed repository default; network owners populate it before activation.
clinical_cidrs: []

# Cluster networks — allowed to reach RKE2 cluster-internal ports.
cluster_cidrs:
  - "10.10.0.0/24"

# Control-plane endpoint. Production overrides the interface and enables the
# role; single-node development leaves it disabled.
control_plane_vip_enabled: false
control_plane_vip_address: "10.10.0.10"
control_plane_vip_interface: ""
control_plane_vip_unicast_address: "{{ ansible_host | default('') }}"
control_plane_vip_prefix_length: 24
control_plane_vip_virtual_router_id: 51
control_plane_api_dns_name: ""

# C2.1 private-ingress endpoint. Deliberately disabled and addressless.
internal_ingress_vip_enabled: false
internal_ingress_vip_address: ""
internal_ingress_vip_interface: ""
internal_ingress_vip_unicast_address: "{{ ansible_host | default('') }}"
internal_ingress_vip_prefix_length: 24
internal_ingress_vip_virtual_router_id: 52
internal_ingress_vip_firewall_guard_enabled: false

# TLS SANs for the API-server certificate (populated per-environment).
cluster_dns_san: []

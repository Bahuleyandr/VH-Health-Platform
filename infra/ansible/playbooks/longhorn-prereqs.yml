---
# Operator-executed Longhorn host prerequisites.
#
# This playbook only installs and verifies node-local packages, kernel modules,
# and services. It does not install/sync Longhorn, create or change a
# StorageClass, patch a PVC, move data, or select a storage migration.
#
# Usage:
#   ansible-playbook -i inventories/prod.yml \
#     playbooks/longhorn-prereqs.yml \
#     -e longhorn_prereqs_authorized=true --ask-vault-pass
#
# Longhorn 1.7.2 remains an unqualified repository target. Complete
# docs/C1_2_STORAGE_PLACEMENT_GATE.md before any separately approved migration.

- name: Install Longhorn host prerequisites one node at a time
  hosts: rke2_servers:rke2_agents
  become: true
  gather_facts: true
  any_errors_fatal: true
  serial: 1
  max_fail_percentage: 0
  pre_tasks:
    - name: Require explicit authorization and the supported node OS
      ansible.builtin.assert:
        that:
          - longhorn_prereqs_authorized | default(false) | bool
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] == '24.04'
        fail_msg: >-
          Hard stop: pass -e longhorn_prereqs_authorized=true and run only
          against the supported Ubuntu 24.04 RKE2 inventory.

  tasks:
    - name: Install Longhorn prerequisite packages
      ansible.builtin.apt:
        name:
          - cryptsetup
          - dmsetup
          - nfs-common
          - open-iscsi
          - util-linux
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Persist the iSCSI TCP kernel module
      ansible.builtin.copy:
        dest: /etc/modules-load.d/90-longhorn.conf
        content: |
          # Managed by Ansible: Longhorn host prerequisite.
          iscsi_tcp
        owner: root
        group: root
        mode: "0644"

    - name: Load the iSCSI TCP kernel module
      community.general.modprobe:
        name: iscsi_tcp
        state: present

    - name: Enable and start the iSCSI daemon
      ansible.builtin.systemd:
        name: iscsid
        enabled: true
        state: started
        daemon_reload: true

    - name: Verify the iSCSI TCP kernel module
      ansible.builtin.command:
        argv:
          - /usr/sbin/lsmod
      register: longhorn_loaded_modules
      changed_when: false
      check_mode: false

    - name: Verify the iSCSI userspace client
      ansible.builtin.command:
        argv:
          - /usr/bin/iscsiadm
          - --version
      register: longhorn_iscsiadm_version
      changed_when: false
      check_mode: false

    - name: Verify Longhorn mount and block-device helpers
      ansible.builtin.command:
        argv:
          - "{{ item }}"
          - --version
      loop:
        - /usr/bin/findmnt
        - /usr/bin/lsblk
      loop_control:
        label: "{{ item }}"
      changed_when: false
      check_mode: false

    - name: Reject an incomplete node prerequisite state
      ansible.builtin.assert:
        that:
          - "'iscsi_tcp' in longhorn_loaded_modules.stdout"
          - longhorn_iscsiadm_version.rc == 0
        fail_msg: >-
          Hard stop: iscsi_tcp or iscsiadm is unavailable on
          {{ inventory_hostname }}. Do not sync the Longhorn child Application.

    - name: Report the non-migration boundary
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} has node-local Longhorn prerequisites only.
          No Longhorn deployment, StorageClass activation, PVC change, data
          migration, or production qualification was performed.

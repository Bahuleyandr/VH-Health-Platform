---
# Operator-executed replacement of one confirmed-lost RKE2 server.
#
# This file is inert in Git. It deliberately refuses to wipe an existing host,
# guess a maintenance delegate, or select the first inventory server.
#
# Example:
#   ansible-playbook -i inventories/prod.yml playbooks/node-replace.yml \
#     -e rke2_replacement_node=<lost-inventory-hostname> \
#     -e rke2_replacement_version=<current-qualified-rke2-pin> \
#     -e rke2_maintenance_host=<explicit-healthy-rke2-server> \
#     -e rke2_node_replace_evidence_dir=/secure/evidence/c1-2/node-replace \
#     -e rke2_node_replace_authorized=true \
#     -e rke2_replacement_host_fresh=true --ask-vault-pass
#
# The inventory entry must already point to freshly imaged Ubuntu 24.04
# replacement hardware. A reused host with RKE2 state is a hard stop.

- name: Validate node-replacement authority and evidence
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - name: Reject external use of the reserved internal variable namespace
      ansible.builtin.assert:
        that:
          - >-
            vars.keys()
            | select('match', '^c1_2_')
            | list
            | length == 0
        fail_msg: >-
          Hard stop: c1_2_* names are reserved for validated playbook state.
          Remove every inventory or extra variable using that prefix.

    - name: Load the protected replacement identity from the Vault file
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../inventories/group_vars/all/vault.yml"
        name: c1_2_protected_vault
      no_log: true

    - name: Normalize operator inputs
      ansible.builtin.set_fact:
        c1_2_replacement_node: "{{ rke2_replacement_node | default('') }}"
        c1_2_replacement_version: "{{ rke2_replacement_version | default('') }}"
        c1_2_replacement_artifact_url: >-
          {{
            c1_2_protected_vault.vault_rke2_prime_artifact_url
            | default('')
          }}
        c1_2_replacement_cluster_token: >-
          {{
            c1_2_protected_vault.vault_rke2_cluster_token
            | default('')
          }}
        c1_2_maintenance_host: "{{ rke2_maintenance_host | default('') }}"
        c1_2_node_replace_evidence_dir: >-
          {{ rke2_node_replace_evidence_dir | default('') }}
        c1_2_control_plane_endpoint: >-
          https://{{ control_plane_vip_address | default('') }}:6443
        c1_2_node_replace_evidence_max_age_hours: >-
          {{ rke2_node_replace_evidence_max_age_hours | default(24) | int }}
      no_log: true

    - name: Reject ambiguous or unauthorized replacement inputs
      ansible.builtin.assert:
        that:
          - rke2_node_replace_authorized | default(false) | bool
          - rke2_replacement_host_fresh | default(false) | bool
          - rke2_bootstrap is not defined
          - rke2_replacement_artifact_url is not defined
          - c1_2_replacement_cluster_token | length > 0
          - >-
            c1_2_replacement_cluster_token
            == (c1_2_replacement_cluster_token | trim)
          - "'REPLACE' not in (c1_2_replacement_cluster_token | upper)"
          - "'CHANGEME' not in (c1_2_replacement_cluster_token | upper)"
          - "'PLACEHOLDER' not in (c1_2_replacement_cluster_token | upper)"
          - control_plane_vip_address | default('') | length > 0
          - c1_2_replacement_node in groups['rke2_servers']
          - c1_2_maintenance_host in groups['rke2_servers']
          - c1_2_maintenance_host != c1_2_replacement_node
          - groups['rke2_servers'] | length == 3
          - >-
            c1_2_replacement_version in [
              'v1.31.4+rke2r1',
              'v1.31.14+rke2r2',
              'v1.32.13+rke2r2',
              'v1.33.13+rke2r1',
              'v1.34.9+rke2r1'
            ]
          - >-
            rke2_install_artifact_url | default('') | string
            == c1_2_replacement_artifact_url
          - >-
            (
              c1_2_replacement_version in [
                'v1.31.14+rke2r2',
                'v1.32.13+rke2r2'
              ]
            )
            ==
            (c1_2_replacement_artifact_url | length > 0)
          - >-
            c1_2_replacement_artifact_url | length == 0
            or c1_2_replacement_artifact_url
            is match('^https://.+/rke2/?$')
          - c1_2_node_replace_evidence_dir is match('^/')
          - c1_2_node_replace_evidence_max_age_hours > 0
        fail_msg: >-
          Hard stop: authorize the replacement, name the confirmed-lost server,
          name a different healthy maintenance server, provide the exact
          qualified RKE2 pin and an absolute evidence directory, and attest
          that the replacement host is freshly imaged. Prime-only pins require
          the encrypted group_vars/all/vault.yml
          vault_rke2_prime_artifact_url ending in /rke2, and inventory
          rke2_install_artifact_url must resolve to that exact protected value;
          rke2_replacement_artifact_url is forbidden.
          rke2_bootstrap is forbidden on this command line because a
          replacement must never initialize a new datastore.
      no_log: true

    - name: Inspect required replacement evidence receipts
      ansible.builtin.stat:
        path: "{{ c1_2_node_replace_evidence_dir }}/{{ item }}"
      loop:
        - node-loss-diagnosis.txt
        - commander-window.txt
        - backup-restore-proof.txt
        - etcd-quorum.txt
        - cnpg-replication.txt
        - storage-health.txt
      loop_control:
        label: "{{ item }}"
      register: c1_2_node_replace_evidence

    - name: Reject missing, empty, or stale replacement-window evidence
      ansible.builtin.assert:
        that:
          - item.stat.exists | default(false)
          - item.stat.isreg | default(false)
          - item.stat.size | default(0) | int > 0
          - >-
            item.item != 'commander-window.txt'
            or (
              (ansible_date_time.epoch | int)
              - (item.stat.mtime | default(0) | int)
            ) <= (c1_2_node_replace_evidence_max_age_hours * 3600)
          - >-
            item.item != 'commander-window.txt'
            or (item.stat.mtime | default(0) | int)
            <= ((ansible_date_time.epoch | int) + 300)
        fail_msg: >-
          Hard stop: {{ item.item }} is missing or empty, or the commander
          window receipt is stale. Refresh the evidence before replacement.
      loop: "{{ c1_2_node_replace_evidence.results }}"
      loop_control:
        label: "{{ item.item }}"

- name: Reject reserved replacement variables on every server
  hosts: rke2_servers
  become: false
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  tasks:
    - name: Reject inventory use of the reserved internal variable namespace
      ansible.builtin.assert:
        that:
          - >-
            vars.keys()
            | select('match', '^c1_2_')
            | list
            | length == 0
        fail_msg: >-
          Hard stop: c1_2_* names are reserved for validated playbook state.
          Remove every host or group variable using that prefix.

- name: Prove the replacement host contains no existing RKE2 state
  hosts: rke2_servers
  become: true
  gather_facts: true
  any_errors_fatal: true
  serial: 1
  pre_tasks:
    - name: End this play for non-replacement servers
      ansible.builtin.meta: end_host
      when: inventory_hostname != hostvars['localhost'].c1_2_replacement_node
  tasks:
    - name: Require freshly imaged Ubuntu 24.04 replacement hardware
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] == '24.04'
          - rke2_cluster_token | default('') | length > 0
          - >-
            rke2_cluster_token
            == hostvars['localhost'].c1_2_replacement_cluster_token
          - inventory_region | default('') | trim | length > 0
          - inventory_zone | default('') | trim | length > 0
        fail_msg: >-
          Hard stop: the replacement must be Ubuntu 24.04 with truthful
          non-empty region/zone labels and the vault-backed cluster token.
      no_log: true

    - name: Inspect the replacement RKE2 data directory
      ansible.builtin.stat:
        path: /var/lib/rancher/rke2
      register: c1_2_replacement_data_dir

    - name: Inspect the replacement RKE2 configuration directory
      ansible.builtin.stat:
        path: /etc/rancher/rke2
      register: c1_2_replacement_config_dir

    - name: Refuse to wipe or reuse existing RKE2 state
      ansible.builtin.assert:
        that:
          - not c1_2_replacement_data_dir.stat.exists
          - not c1_2_replacement_config_dir.stat.exists
        fail_msg: >-
          Hard stop: /var/lib/rancher/rke2 or /etc/rancher/rke2 already exists
          on {{ inventory_hostname }}. This playbook never wipes existing data,
          configuration, token, or drop-in state. Reimage or follow a
          separately approved state-preservation procedure.

- name: Prove every surviving server has the exact token and RKE2 pin
  hosts: rke2_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  pre_tasks:
    - name: End this play for the fresh replacement server
      ansible.builtin.meta: end_host
      when: inventory_hostname == hostvars['localhost'].c1_2_replacement_node
  tasks:
    - name: Read the installed survivor RKE2 version
      ansible.builtin.command:
        argv:
          - /usr/local/bin/rke2
          - --version
      register: c1_2_survivor_rke2_version
      changed_when: false

    - name: Extract the exact survivor RKE2 pin
      ansible.builtin.set_fact:
        c1_2_survivor_rke2_pin: >-
          {{
            c1_2_survivor_rke2_version.stdout
            | regex_search('v[0-9]+\.[0-9]+\.[0-9]+\+rke2r[0-9]+')
            | default('')
          }}

    - name: Reject a survivor that is not on the replacement pin
      ansible.builtin.assert:
        that:
          - >-
            c1_2_survivor_rke2_pin
            == hostvars['localhost'].c1_2_replacement_version
        fail_msg: >-
          Hard stop: survivor {{ inventory_hostname }} runs
          {{ c1_2_survivor_rke2_pin | default('an unreadable pin') }}, not
          {{ hostvars['localhost'].c1_2_replacement_version }}.

    - name: Inspect the survivor token file
      ansible.builtin.stat:
        path: /var/lib/rancher/rke2/server/token
        follow: true
      register: c1_2_survivor_token_stat

    - name: Require a regular survivor token file
      ansible.builtin.assert:
        that:
          - c1_2_survivor_token_stat.stat.exists | default(false)
          - c1_2_survivor_token_stat.stat.isreg | default(false)
          - c1_2_survivor_token_stat.stat.size | default(0) | int > 0
        fail_msg: >-
          Hard stop: survivor {{ inventory_hostname }} lacks a non-empty
          /var/lib/rancher/rke2/server/token.

    - name: Read the exact survivor token
      ansible.builtin.slurp:
        src: /var/lib/rancher/rke2/server/token
      register: c1_2_survivor_token_blob
      no_log: true

    - name: Normalize the exact token comparison inputs
      ansible.builtin.set_fact:
        c1_2_survivor_token_raw: >-
          {{
            c1_2_survivor_token_blob.content
            | b64decode
            | regex_replace('[\r\n]+$', '')
          }}
        c1_2_vault_token_raw: "{{ rke2_cluster_token | default('') }}"
        c1_2_protected_token_raw: >-
          {{ hostvars['localhost'].c1_2_replacement_cluster_token }}
      no_log: true

    - name: Reject an empty, padded, placeholder, or mismatched token
      ansible.builtin.assert:
        that:
          - c1_2_survivor_token_raw | length > 0
          - c1_2_survivor_token_raw == (c1_2_survivor_token_raw | trim)
          - c1_2_vault_token_raw | length > 0
          - c1_2_vault_token_raw == (c1_2_vault_token_raw | trim)
          - c1_2_vault_token_raw == c1_2_protected_token_raw
          - c1_2_survivor_token_raw == c1_2_vault_token_raw
          - "'REPLACE' not in (c1_2_vault_token_raw | upper)"
          - "'CHANGEME' not in (c1_2_vault_token_raw | upper)"
          - "'PLACEHOLDER' not in (c1_2_vault_token_raw | upper)"
        fail_msg: >-
          Hard stop: survivor {{ inventory_hostname }} does not contain the
          exact whitespace-free Vault token, or the Vault value is a
          placeholder. No membership or node object may be changed.
        quiet: true
      no_log: true

- name: Prove the explicit maintenance server and surviving quorum
  hosts: rke2_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  vars:
    c1_2_kubeconfig_path: /etc/rancher/rke2/rke2.yaml
    c1_2_etcdctl_path: /var/lib/rancher/rke2/bin/etcdctl
    c1_2_etcd_ca: /var/lib/rancher/rke2/server/tls/etcd/server-ca.crt
    c1_2_etcd_cert: /var/lib/rancher/rke2/server/tls/etcd/server-client.crt
    c1_2_etcd_key: /var/lib/rancher/rke2/server/tls/etcd/server-client.key
  pre_tasks:
    - name: End this play for servers other than the maintenance host
      ansible.builtin.meta: end_host
      when: inventory_hostname != hostvars['localhost'].c1_2_maintenance_host
  tasks:
    - name: Verify the maintenance server runs the replacement pin
      ansible.builtin.command:
        argv:
          - /usr/local/bin/rke2
          - --version
      register: c1_2_maintenance_rke2_version
      changed_when: false

    - name: Extract the exact maintenance-server RKE2 pin
      ansible.builtin.set_fact:
        c1_2_maintenance_rke2_pin: >-
          {{
            c1_2_maintenance_rke2_version.stdout
            | regex_search('v[0-9]+\.[0-9]+\.[0-9]+\+rke2r[0-9]+')
            | default('')
          }}

    - name: Reject a replacement version that differs from the live cluster
      ansible.builtin.assert:
        that:
          - >-
            c1_2_maintenance_rke2_pin
            == hostvars['localhost'].c1_2_replacement_version
        fail_msg: >-
          Hard stop: the explicit maintenance server does not run the requested
          replacement pin. Align the exact pin before joining new hardware.

    - name: Verify the maintenance kubeconfig uses the control-plane VIP
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - "--kubeconfig={{ c1_2_kubeconfig_path }}"
          - config
          - view
          - --minify
          - -o
          - "jsonpath={.clusters[0].cluster.server}"
      register: c1_2_maintenance_kubeconfig_endpoint
      changed_when: false

    - name: Reject a per-node or non-VIP maintenance endpoint
      ansible.builtin.assert:
        that:
          - >-
            c1_2_maintenance_kubeconfig_endpoint.stdout | trim
            == hostvars['localhost'].c1_2_control_plane_endpoint
        fail_msg: >-
          Hard stop: maintenance kubeconfig is not using
          {{ hostvars['localhost'].c1_2_control_plane_endpoint }}.

    - name: Prove VIP-backed API readiness
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - "--kubeconfig={{ c1_2_kubeconfig_path }}"
          - get
          - --raw=/readyz
      register: c1_2_api_ready
      changed_when: false

    - name: Reject an unready VIP-backed API
      ansible.builtin.assert:
        that:
          - c1_2_api_ready.stdout | trim == 'ok'
        fail_msg: "Hard stop: the control-plane VIP /readyz check failed."

    - name: Prove the local surviving etcd member is healthy
      ansible.builtin.command:
        argv:
          - "{{ c1_2_etcdctl_path }}"
          - "--cacert={{ c1_2_etcd_ca }}"
          - "--cert={{ c1_2_etcd_cert }}"
          - "--key={{ c1_2_etcd_key }}"
          - "--endpoints=https://127.0.0.1:2379"
          - endpoint
          - health
      environment:
        ETCDCTL_API: "3"
      changed_when: false

    - name: Inspect etcd membership
      ansible.builtin.command:
        argv:
          - "{{ c1_2_etcdctl_path }}"
          - "--cacert={{ c1_2_etcd_ca }}"
          - "--cert={{ c1_2_etcd_cert }}"
          - "--key={{ c1_2_etcd_key }}"
          - "--endpoints=https://127.0.0.1:2379"
          - member
          - list
          - --write-out=json
      environment:
        ETCDCTL_API: "3"
      register: c1_2_etcd_members_before
      changed_when: false

    - name: Record exact declared and live etcd member names
      ansible.builtin.set_fact:
        c1_2_declared_survivor_names: >-
          {{
            groups['rke2_servers']
            | reject('equalto', hostvars['localhost'].c1_2_replacement_node)
            | list
            | sort
          }}
        c1_2_declared_server_names: >-
          {{ groups['rke2_servers'] | list | sort }}
        c1_2_etcd_member_names_before: >-
          {{
            (c1_2_etcd_members_before.stdout | from_json).members
            | map(attribute='name')
            | list
            | sort
          }}

    - name: Require exact declared etcd membership before membership change
      ansible.builtin.assert:
        that:
          - c1_2_declared_survivor_names | length == 2
          - >-
            c1_2_etcd_member_names_before
            | unique | list | length
            == c1_2_etcd_member_names_before | length
          - >-
            c1_2_etcd_member_names_before == c1_2_declared_survivor_names
            or
            c1_2_etcd_member_names_before == c1_2_declared_server_names
        fail_msg: >-
          Hard stop: etcd membership is not exactly the two declared survivors
          with the lost member absent, or the exact three declared servers
          with one uniquely removable lost member. Extra, stale, renamed, or
          missing voters require a separately approved recovery procedure.

    - name: Inspect CloudNativePG survivor health
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - "--kubeconfig={{ c1_2_kubeconfig_path }}"
          - -n
          - vhhealth-platform
          - get
          - cluster.postgresql.cnpg.io/vhhealth-pg
          - -o
          - json
      register: c1_2_cnpg_survivors_output
      changed_when: false

    - name: Require a primary and two ready CloudNativePG survivors
      ansible.builtin.assert:
        that:
          - >-
            (c1_2_cnpg_survivors_output.stdout | from_json).spec.instances
            | int == 3
          - >-
            (c1_2_cnpg_survivors_output.stdout | from_json).status.currentPrimary
            | default('') | length > 0
          - >-
            (c1_2_cnpg_survivors_output.stdout | from_json).status.readyInstances
            | default(0) | int >= 2
        fail_msg: >-
          Hard stop: CloudNativePG lacks a primary or two ready survivors.

    - name: Prove survivor synchronous standby protection
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - "--kubeconfig={{ c1_2_kubeconfig_path }}"
          - -n
          - vhhealth-platform
          - exec
          - >-
            {{
              (
                c1_2_cnpg_survivors_output.stdout
                | from_json
              ).status.currentPrimary
            }}
          - --
          - psql
          - -U
          - postgres
          - -d
          - postgres
          - -Atc
          - >-
            SELECT count(*) FROM pg_stat_replication
            WHERE state = 'streaming'
            AND sync_state IN ('sync', 'quorum');
      register: c1_2_survivor_sync_standbys
      changed_when: false

    - name: Reject replacement without a streaming synchronous standby
      ansible.builtin.assert:
        that:
          - c1_2_survivor_sync_standbys.stdout | trim | int >= 1
        fail_msg: >-
          Hard stop: the CNPG primary has no streaming synchronous standby.
          No etcd membership or Kubernetes node object may be changed.

    - name: Inspect the lost node object
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - "--kubeconfig={{ c1_2_kubeconfig_path }}"
          - get
          - node
          - "{{ hostvars['localhost'].c1_2_replacement_node }}"
          - -o
          - json
          - --ignore-not-found=true
      register: c1_2_lost_node_object
      changed_when: false

    - name: Reject replacement of a node that still reports Ready
      ansible.builtin.assert:
        that:
          - >-
            c1_2_lost_node_object.stdout | trim | length == 0
            or
            (
              c1_2_lost_node_object.stdout
              | from_json
            ).status.conditions
            | selectattr('type', 'equalto', 'Ready')
            | map(attribute='status')
            | list
            | first
            | default('Unknown') != 'True'
        fail_msg: >-
          Hard stop: {{ hostvars['localhost'].c1_2_replacement_node }} still
          reports Ready. This playbook is only for a confirmed-lost server.

    - name: Cordon the lost node object when it still exists
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - "--kubeconfig={{ c1_2_kubeconfig_path }}"
          - cordon
          - "{{ hostvars['localhost'].c1_2_replacement_node }}"
      when: c1_2_lost_node_object.stdout | trim | length > 0
      changed_when: true

    - name: Resolve the exact lost etcd member ID
      ansible.builtin.shell: |
        set -o pipefail
        {{ c1_2_etcdctl_path | quote }} \
          --cacert={{ c1_2_etcd_ca | quote }} \
          --cert={{ c1_2_etcd_cert | quote }} \
          --key={{ c1_2_etcd_key | quote }} \
          --endpoints=https://127.0.0.1:2379 \
          member list |
          /usr/bin/awk -F', *' -v name="$REPLACEMENT_NODE" \
            '$3 == name {print tolower($1)}'
      args:
        executable: /bin/bash
      environment:
        ETCDCTL_API: "3"
        REPLACEMENT_NODE: "{{ hostvars['localhost'].c1_2_replacement_node }}"
      register: c1_2_lost_etcd_member
      changed_when: false

    - name: Reject ambiguous etcd membership
      ansible.builtin.assert:
        that:
          - c1_2_lost_etcd_member.stdout_lines | length <= 1
          - >-
            (
              c1_2_lost_etcd_member.stdout_lines | length == 1
            )
            ==
            (
              c1_2_etcd_member_names_before == c1_2_declared_server_names
            )
          - >-
            c1_2_lost_etcd_member.stdout | trim | length == 0
            or
            c1_2_lost_etcd_member.stdout | trim
            is match('^[0-9a-f]{1,16}$')
        fail_msg: >-
          Hard stop: more than one etcd member matched the lost hostname, or
          its canonical lowercase hexadecimal member ID was not lossless.

    - name: Revalidate the exact lost member name and ID immediately before removal
      ansible.builtin.shell: |
        set -o pipefail
        {{ c1_2_etcdctl_path | quote }} \
          --cacert={{ c1_2_etcd_ca | quote }} \
          --cert={{ c1_2_etcd_cert | quote }} \
          --key={{ c1_2_etcd_key | quote }} \
          --endpoints=https://127.0.0.1:2379 \
          member list |
          /usr/bin/awk -F', *' \
            -v name="$REPLACEMENT_NODE" \
            -v id="$REPLACEMENT_MEMBER_ID" \
            '$3 == name || tolower($1) == id {
              print tolower($1) "|" $3
            }'
      args:
        executable: /bin/bash
      environment:
        ETCDCTL_API: "3"
        REPLACEMENT_NODE: "{{ hostvars['localhost'].c1_2_replacement_node }}"
        REPLACEMENT_MEMBER_ID: "{{ c1_2_lost_etcd_member.stdout | trim }}"
      register: c1_2_lost_etcd_member_revalidated
      changed_when: false
      when: c1_2_lost_etcd_member.stdout | trim | length > 0

    - name: Require the fresh membership result to preserve exact identity
      ansible.builtin.assert:
        that:
          - c1_2_lost_etcd_member_revalidated.stdout_lines | length == 1
          - >-
            c1_2_lost_etcd_member_revalidated.stdout | trim
            ==
            (
              c1_2_lost_etcd_member.stdout | trim
              ~ '|'
              ~ hostvars['localhost'].c1_2_replacement_node
            )
        fail_msg: >-
          Hard stop: etcd membership changed between resolution and removal.
          The exact lost hostname and canonical hexadecimal ID no longer form
          a unique pair.
      when: c1_2_lost_etcd_member.stdout | trim | length > 0

    - name: Remove the exact lost etcd member when still present
      ansible.builtin.command:
        argv:
          - "{{ c1_2_etcdctl_path }}"
          - "--cacert={{ c1_2_etcd_ca }}"
          - "--cert={{ c1_2_etcd_cert }}"
          - "--key={{ c1_2_etcd_key }}"
          - "--endpoints=https://127.0.0.1:2379"
          - member
          - remove
          - "{{ c1_2_lost_etcd_member.stdout | trim }}"
      environment:
        ETCDCTL_API: "3"
      when: c1_2_lost_etcd_member.stdout | trim | length > 0
      changed_when: true

    - name: Prove the removed member name and ID are both absent
      ansible.builtin.shell: |
        set -o pipefail
        {{ c1_2_etcdctl_path | quote }} \
          --cacert={{ c1_2_etcd_ca | quote }} \
          --cert={{ c1_2_etcd_cert | quote }} \
          --key={{ c1_2_etcd_key | quote }} \
          --endpoints=https://127.0.0.1:2379 \
          member list |
          /usr/bin/awk -F', *' \
            -v name="$REPLACEMENT_NODE" \
            -v id="$REPLACEMENT_MEMBER_ID" \
            '$3 == name || tolower($1) == id {
              print tolower($1) "|" $3
            }'
      args:
        executable: /bin/bash
      environment:
        ETCDCTL_API: "3"
        REPLACEMENT_NODE: "{{ hostvars['localhost'].c1_2_replacement_node }}"
        REPLACEMENT_MEMBER_ID: "{{ c1_2_lost_etcd_member.stdout | trim }}"
      register: c1_2_removed_etcd_member_check
      changed_when: false
      when: c1_2_lost_etcd_member.stdout | trim | length > 0

    - name: Reject lingering membership after removal
      ansible.builtin.assert:
        that:
          - c1_2_removed_etcd_member_check.stdout | trim | length == 0
        fail_msg: >-
          Hard stop: the removed etcd member name or hexadecimal ID still
          appears in the fresh membership list.
      when: c1_2_lost_etcd_member.stdout | trim | length > 0

    - name: Inspect exact etcd membership after lost-member removal
      ansible.builtin.command:
        argv:
          - "{{ c1_2_etcdctl_path }}"
          - "--cacert={{ c1_2_etcd_ca }}"
          - "--cert={{ c1_2_etcd_cert }}"
          - "--key={{ c1_2_etcd_key }}"
          - "--endpoints=https://127.0.0.1:2379"
          - member
          - list
          - --write-out=json
      environment:
        ETCDCTL_API: "3"
      register: c1_2_etcd_members_after_removal
      changed_when: false

    - name: Require exactly the two declared survivors after removal
      ansible.builtin.assert:
        that:
          - >-
            (
              (c1_2_etcd_members_after_removal.stdout | from_json).members
              | map(attribute='name')
              | list
              | sort
            )
            == c1_2_declared_survivor_names
        fail_msg: >-
          Hard stop: etcd membership after removal is not exactly the two
          declared survivors. Do not join replacement hardware.

    - name: Re-prove surviving etcd health after membership removal
      ansible.builtin.command:
        argv:
          - "{{ c1_2_etcdctl_path }}"
          - "--cacert={{ c1_2_etcd_ca }}"
          - "--cert={{ c1_2_etcd_cert }}"
          - "--key={{ c1_2_etcd_key }}"
          - "--endpoints=https://127.0.0.1:2379"
          - endpoint
          - health
      environment:
        ETCDCTL_API: "3"
      changed_when: false

    - name: Delete the stale Kubernetes node object when still present
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - "--kubeconfig={{ c1_2_kubeconfig_path }}"
          - delete
          - node
          - "{{ hostvars['localhost'].c1_2_replacement_node }}"
          - --wait=true
          - --timeout=2m
      when: c1_2_lost_node_object.stdout | trim | length > 0
      changed_when: true

- name: Configure and join only the fresh replacement server
  hosts: rke2_servers
  become: true
  gather_facts: true
  any_errors_fatal: true
  serial: 1
  max_fail_percentage: 0
  vars:
    rke2_bootstrap: false
    rke2_version: "{{ hostvars['localhost'].c1_2_replacement_version }}"
    rke2_install_artifact_url: >-
      {{ hostvars['localhost'].c1_2_replacement_artifact_url }}
    rke2_system_default_registry: registry.rancher.com
    taint_server_nodes: true
    rke2_server_taints:
      - "vhhealth.io/replacement-validation=true:NoSchedule"
  pre_tasks:
    - name: End this play for non-replacement servers
      ansible.builtin.meta: end_host
      when: inventory_hostname != hostvars['localhost'].c1_2_replacement_node
    - name: Require immutable join-only and registration-fence inputs
      ansible.builtin.assert:
        that:
          - not (rke2_bootstrap | bool)
          - rke2_version == hostvars['localhost'].c1_2_replacement_version
          - >-
            rke2_install_artifact_url
            == hostvars['localhost'].c1_2_replacement_artifact_url
          - rke2_system_default_registry == 'registry.rancher.com'
          - taint_server_nodes | bool
          - >-
            rke2_server_taints
            ==
            ['vhhealth.io/replacement-validation=true:NoSchedule']
        fail_msg: >-
          Hard stop: replacement role inputs were overridden. The server must
          join the VIP with bootstrap=false and the exact temporary
          registration-time NoSchedule fence.
  roles:
    - role: common
      tags: [common]
    - role: hardening
      tags: [hardening]
    - role: firewall
      tags: [firewall]
  tasks:
    - name: Apply replacement firewall changes before keepalived
      ansible.builtin.meta: flush_handlers
      tags: [firewall, control_plane_vip]

    - name: Read the active replacement firewall table
      ansible.builtin.command:
        cmd: nft list table inet vhhealth
      register: c1_2_replacement_firewall_table
      changed_when: false
      when: not ansible_check_mode
      tags: [firewall, control_plane_vip]

    - name: Verify replacement API and unicast VRRP firewall rules
      ansible.builtin.assert:
        that:
          - "'tcp dport 6443' in c1_2_replacement_firewall_table.stdout"
          - >-
            ('ip protocol vrrp' in c1_2_replacement_firewall_table.stdout)
            or ('ip protocol 112'
                in c1_2_replacement_firewall_table.stdout)
        fail_msg: >-
          The active vhhealth nftables table is missing the API or unicast
          VRRP rule. Keepalived will not be configured on the replacement.
      when: not ansible_check_mode
      tags: [firewall, control_plane_vip]

    - name: Configure the replacement control-plane VIP peer
      ansible.builtin.include_role:
        name: control_plane_vip
      tags: [control_plane_vip]

    - name: Run replacement RKE2 preflight
      ansible.builtin.include_role:
        name: rke2_server
        tasks_from: preflight.yml

    - name: Render the exact replacement token
      ansible.builtin.include_role:
        name: rke2_server
        tasks_from: token.yml

    - name: Install the exact replacement RKE2 pin
      ansible.builtin.include_role:
        name: rke2_server
        tasks_from: install.yml

    - name: Render the fenced replacement configuration
      ansible.builtin.include_role:
        name: rke2_server
        tasks_from: configure.yml

    - name: Reload the installed replacement RKE2 unit metadata
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Reject alternate replacement RKE2 service configuration inputs
      ansible.builtin.shell: &c1_2_replacement_service_input_gate |2
          set -euo pipefail
        unit='rke2-server.service'
        unit_base="${unit%.service}"
        mode="${unit_base#rke2-}"
        expected_fragment="/usr/local/lib/systemd/system/${unit}"

        fragment=$(
          /usr/bin/systemctl show "$unit" \
            --property=FragmentPath --value
        )
        if [[ "$fragment" != "$expected_fragment" ||
              ! -f "$fragment" || -L "$fragment" ]]; then
          printf 'unexpected RKE2 unit fragment: %s\n' "$fragment" >&2
          exit 64
        fi

        unit_version=$(
          /usr/local/bin/rke2 --version |
            /usr/bin/sed -nE \
              's/^rke2 version (v[0-9]+\.[0-9]+\.[0-9]+\+rke2r[0-9]+)([[:space:]].*)?$/\1/p' |
            /usr/bin/head -n 1
        )
        case "${unit_version}:${mode}" in
          v1.31.4+rke2r1:server|v1.31.14+rke2r2:server)
            expected_fragment_sha256='caf5e4ff923c968d15494d984320b9ab4be13504fe9d37b968ca52ecd8e4ffcb'
            ;;
          v1.32.13+rke2r2:server|v1.33.13+rke2r1:server|v1.34.9+rke2r1:server)
            expected_fragment_sha256='30cb868bfbc40d69b3c3b7553493c50c17538f3a550c89ff2300d13bb66a61b1'
            ;;
          *)
            printf 'RKE2 unit version is outside the approved ladder: %s\n' \
              "$unit_version" >&2
            exit 64
            ;;
        esac
        read -r fragment_sha256 _ < <(
          /usr/bin/sha256sum "$fragment"
        )
        if [[ "$fragment_sha256" != "$expected_fragment_sha256" ]]; then
          printf 'RKE2 unit fragment hash is not stock for %s\n' \
            "$unit_version" >&2
          exit 64
        fi

        dropins=$(
          /usr/bin/systemctl show "$unit" \
            --property=DropInPaths --value
        )
        if [[ -n "$dropins" ]]; then
          printf 'RKE2 unit drop-ins are not accepted: %s\n' "$unit" >&2
          exit 64
        fi

        unit_text=$(/usr/bin/systemctl cat --no-pager "$unit")
        environment_files=$(
          printf '%s\n' "$unit_text" |
            /usr/bin/sed -nE \
              's/^[[:space:]]*EnvironmentFile[[:space:]]*=[[:space:]]*(.*[^[:space:]])[[:space:]]*$/\1/p'
        )
        expected_environment_files=$'-/etc/default/%N\n-/etc/sysconfig/%N\n-/usr/local/lib/systemd/system/%N.env'
        if [[ "$environment_files" != "$expected_environment_files" ]]; then
          printf 'unexpected RKE2 EnvironmentFile directives: %s\n' \
            "$unit" >&2
          exit 64
        fi

        exec_start=$(
          printf '%s\n' "$unit_text" |
            /usr/bin/sed -nE \
              's/^[[:space:]]*ExecStart[[:space:]]*=[[:space:]]*(.*[^[:space:]])[[:space:]]*$/\1/p'
        )
        if [[ "$exec_start" != "/usr/local/bin/rke2 ${mode}" ]]; then
          printf 'unexpected RKE2 ExecStart: %s\n' "$unit" >&2
          exit 64
        fi

        if printf '%s\n' "$unit_text" |
          /usr/bin/grep -E \
            '^[[:space:]]*(Environment|PassEnvironment|UnsetEnvironment)[[:space:]]*=' \
            >/dev/null; then
          printf 'direct RKE2 unit environment directives are forbidden: %s\n' \
            "$unit" >&2
          exit 64
        fi

        if /usr/bin/systemctl show-environment |
          /usr/bin/grep -E '^RKE2_[A-Z0-9_]*=' >/dev/null; then
          printf 'RKE2 manager-level environment overrides are forbidden\n' >&2
          exit 64
        fi

        for env_file in \
          "/etc/default/${unit_base}" \
          "/etc/sysconfig/${unit_base}" \
          "/usr/local/lib/systemd/system/${unit_base}.env"; do
          if [[ -e "$env_file" || -L "$env_file" ]]; then
            if [[ ! -f "$env_file" || -L "$env_file" ]]; then
              printf 'unsafe RKE2 environment file: %s\n' "$env_file" >&2
              exit 64
            fi
            active_env_content=$(
              /usr/bin/sed '/^[[:space:]]*#/d' "$env_file"
            )
            backslash=$(/usr/bin/printf '\134')
            if [[ "$active_env_content" == *RKE2_* ||
                  "$active_env_content" == *"$backslash"* ]]; then
              printf 'RKE2 environment override found in: %s\n' \
                "$env_file" >&2
              exit 64
            fi
          fi
        done
      args:
        executable: /bin/bash
      changed_when: false

    - name: Find every loaded replacement configuration fragment
      ansible.builtin.find:
        paths: /etc/rancher/rke2/config.yaml.d
        patterns: '(?is)^.*\.ya?ml\Z'
        use_regex: true
        file_type: any
        recurse: false
        hidden: true
      register: c1_2_replacement_config_fragments

    - name: Reject unsafe replacement configuration fragment file types
      ansible.builtin.assert:
        that:
          - item.isreg | default(false)
          - not (item.islnk | default(false))
        fail_msg: >-
          Hard stop: RKE2 loads this YAML fragment name, but it is a symlink
          or non-regular entry and cannot be reconciled safely.
        quiet: true
      loop: "{{ c1_2_replacement_config_fragments.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Remove every loaded replacement registry override
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: >-
          (?m)^[ \t]*(?:"system-default-registry\+?"|'system-default-registry\+?'|system-default-registry\+?)[ \t]*:.*(?:\n|$)
        replace: ""
        backup: false
      loop: >-
        {{
          ['/etc/rancher/rke2/config.yaml']
          +
          (
            c1_2_replacement_config_fragments.files
            | map(attribute='path')
            | list
          )
        }}
      loop_control:
        label: "{{ item }}"

    - name: Reconcile the registry to the protected target classification
      ansible.builtin.lineinfile:
        path: /etc/rancher/rke2/config.yaml
        line: 'system-default-registry: "registry.rancher.com"'
        state: present
        insertafter: EOF
        backup: false
      when:
        - >-
          hostvars['localhost'].c1_2_replacement_artifact_url
          | length > 0

    - name: Read every reconciled replacement configuration document
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: >-
        {{
          ['/etc/rancher/rke2/config.yaml']
          +
          (
            c1_2_replacement_config_fragments.files
            | map(attribute='path')
            | list
          )
        }}
      loop_control:
        label: "{{ item }}"
      register: c1_2_replacement_registry_documents
      no_log: true

    - name: Require replacement configuration documents to be YAML mappings
      ansible.builtin.assert:
        that:
          - >-
            (item.content | b64decode | from_yaml) is none
            or (item.content | b64decode | from_yaml) is mapping
        fail_msg: >-
          Hard stop: a replacement RKE2 configuration document is not an empty
          document or YAML mapping and cannot be validated safely.
        quiet: true
      loop: "{{ c1_2_replacement_registry_documents.results }}"
      loop_control:
        label: "{{ item.source | default('unknown') }}"
      no_log: true

    - name: Require semantic replacement registry state to match the target
      ansible.builtin.assert:
        that:
          - >-
            c1_2_registry_keys | length
            ==
            (
              (
                item.source == '/etc/rancher/rke2/config.yaml'
                and
                (
                  hostvars['localhost'].c1_2_replacement_artifact_url
                  | length > 0
                )
              )
              | ternary(1, 0)
            )
          - >-
            c1_2_registry_keys
            | rejectattr('key', 'equalto', 'system-default-registry')
            | list
            | length == 0
          - >-
            c1_2_registry_keys
            | rejectattr('value', 'equalto', 'registry.rancher.com')
            | list
            | length == 0
        fail_msg: >-
          Hard stop: a semantic system-default-registry key survived in a
          replacement drop-in, used append syntax, or disagreed with the
          immutable Prime/public target classification.
        quiet: true
      vars:
        c1_2_registry_document: >-
          {{
            (item.content | b64decode | from_yaml)
            | default({}, true)
          }}
        c1_2_registry_keys: >-
          {{
            c1_2_registry_document
            | dict2items
            | selectattr('key', 'match', '^system-default-registry\\+?$')
            | list
          }}
      loop: "{{ c1_2_replacement_registry_documents.results }}"
      loop_control:
        label: "{{ item.source | default('unknown') }}"
      no_log: true

    - name: Count effective replacement registry overrides
      ansible.builtin.shell: |
        set -euo pipefail
        files=(/etc/rancher/rke2/config.yaml)
        if [[ -d /etc/rancher/rke2/config.yaml.d ]]; then
          while IFS= read -r -d '' file; do
            if [[ -L "$file" || ! -f "$file" ]]; then
              printf 'unsafe RKE2 config fragment: %s\n' "$file" >&2
              exit 64
            fi
            files+=("$file")
          done < <(
            /usr/bin/find /etc/rancher/rke2/config.yaml.d \
              -mindepth 1 -maxdepth 1 \
              \( -iname '*.yaml' -o -iname '*.yml' \) -print0 |
              /usr/bin/sort -z
          )
        fi
        /usr/bin/awk '
            BEGIN { active = 0; exact = 0 }
            /^[[:space:]]*["'\'']?system-default-registry[+]?["'\'']?[[:space:]]*:/ {
              active += 1
              if ($0 == "system-default-registry: \"registry.rancher.com\"") {
                exact += 1
              }
            }
            END { printf "%d %d\n", active, exact }
          ' "${files[@]}"
      args:
        executable: /bin/bash
      register: c1_2_replacement_registry_cardinality
      changed_when: false

    - name: Require exact effective Prime or public registry state
      ansible.builtin.assert:
        that:
          - >-
            (
              hostvars['localhost'].c1_2_replacement_artifact_url
              | length > 0
              and c1_2_replacement_registry_cardinality.stdout | trim == '1 1'
            )
            or
            (
              hostvars['localhost'].c1_2_replacement_artifact_url
              | length == 0
              and c1_2_replacement_registry_cardinality.stdout | trim == '0 0'
            )
        fail_msg: >-
          Hard stop: the effective replacement RKE2 configuration does not
          have exact Prime/public registry cardinality across config.yaml and
          every loaded config.yaml.d fragment.

    - name: Read the rendered replacement server config before first start
      ansible.builtin.slurp:
        src: /etc/rancher/rke2/config.yaml
      register: c1_2_replacement_rendered_config
      no_log: true

    - name: Prove join URL, registration fence, and Prime registry before first start
      ansible.builtin.assert:
        that:
          - >-
            (
              c1_2_replacement_rendered_config.content
              | b64decode
              | regex_findall(
                  '(?m)^server: "https://'
                  ~ (control_plane_vip_address | regex_escape)
                  ~ ':9345"$'
                )
              | length
            ) == 1
          - >-
            (
              c1_2_replacement_rendered_config.content
              | b64decode
              | regex_findall('(?m)^node-taint:$')
              | length
            ) == 1
          - >-
            (
              c1_2_replacement_rendered_config.content
              | b64decode
              | regex_findall(
                  '(?m)^  - "vhhealth.io/replacement-validation=true:'
                  ~ 'NoSchedule"$'
                )
              | length
            ) == 1
          - >-
            (
              c1_2_replacement_rendered_config.content
              | b64decode
              | regex_findall(
                  '(?m)^system-default-registry:[^\r\n]*$'
                )
              | length
            )
            ==
            (
              (
                hostvars['localhost'].c1_2_replacement_artifact_url
                | length > 0
              )
              | ternary(1, 0)
            )
          - >-
            (
              c1_2_replacement_rendered_config.content
              | b64decode
              | regex_findall(
                  '(?m)^system-default-registry: '
                  ~ '"registry.rancher.com"$'
                )
              | length
            )
            ==
            (
              (
                hostvars['localhost'].c1_2_replacement_artifact_url
                | length > 0
              )
              | ternary(1, 0)
            )
        fail_msg: >-
          Hard stop: the rendered replacement config does not contain exactly
          one VIP join URL and temporary NoSchedule taint, or its active
          system-default-registry keys do not contain exactly one canonical
          registry.rancher.com value for a Prime pin and zero for a public pin.
        quiet: true
      no_log: true

    - name: Join the fenced replacement server
      ansible.builtin.include_role:
        name: rke2_server
        tasks_from: join.yml

    - name: Reject alternate inputs in the live replacement RKE2 process
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          unit='rke2-server.service'
          mode='server'

          /usr/bin/systemctl is-active --quiet "$unit"
          main_pid=$(
            /usr/bin/systemctl show "$unit" \
              --property=MainPID --value
          )
          if [[ ! "$main_pid" =~ ^[1-9][0-9]*$ ||
                ! -r "/proc/${main_pid}/environ" ||
                ! -r "/proc/${main_pid}/cmdline" ||
                ! -L "/proc/${main_pid}/exe" ]]; then
            printf 'RKE2 MainPID cannot be inspected: %s\n' "$unit" >&2
            exit 64
          fi

          live_executable=$(
            /usr/bin/readlink -f "/proc/${main_pid}/exe"
          )
          if [[ "$live_executable" != '/usr/local/bin/rke2' ]]; then
            printf 'live RKE2 executable is not canonical: %s\n' \
              "$unit" >&2
            exit 64
          fi

          if /usr/bin/tr '\0' '\n' <"/proc/${main_pid}/environ" |
            /usr/bin/grep -E '^RKE2_[A-Z0-9_]*=' >/dev/null; then
            printf 'live RKE2 environment override found: %s\n' "$unit" >&2
            exit 64
          fi

          mapfile -d '' -t argv <"/proc/${main_pid}/cmdline"
          if [[ "${argv[0]:-}" != '/usr/local/bin/rke2' ||
                "${argv[1]:-}" != "$mode" ||
                -v 'argv[2]' ]]; then
            printf 'live RKE2 command line is not canonical: %s\n' \
              "$unit" >&2
            exit 64
          fi

          verified_pid=$(
            /usr/bin/systemctl show "$unit" \
              --property=MainPID --value
          )
          if [[ "$verified_pid" != "$main_pid" ]] ||
            ! /usr/bin/systemctl is-active --quiet "$unit"; then
            printf 'RKE2 MainPID changed during validation: %s\n' \
              "$unit" >&2
            exit 64
          fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Install tooling and rewrite replacement kubeconfigs to the VIP
      ansible.builtin.include_role:
        name: rke2_server
        tasks_from: post-install.yml

- name: Reconcile the control-plane VIP unicast peers serially
  hosts: rke2_servers
  become: true
  gather_facts: true
  any_errors_fatal: true
  serial: 1
  max_fail_percentage: 0
  roles:
    - role: control_plane_vip
      tags: [control_plane_vip]

- name: Verify and uncordon the joined replacement
  hosts: rke2_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  vars:
    c1_2_kubeconfig_path: /etc/rancher/rke2/rke2.yaml
    c1_2_etcdctl_path: /var/lib/rancher/rke2/bin/etcdctl
    c1_2_etcd_ca: /var/lib/rancher/rke2/server/tls/etcd/server-ca.crt
    c1_2_etcd_cert: /var/lib/rancher/rke2/server/tls/etcd/server-client.crt
    c1_2_etcd_key: /var/lib/rancher/rke2/server/tls/etcd/server-client.key
  pre_tasks:
    - name: End this play for non-replacement servers
      ansible.builtin.meta: end_host
      when: inventory_hostname != hostvars['localhost'].c1_2_replacement_node
  tasks:
    - name: Verify the fenced replacement before controlled uncordon
      block:
        - name: Read the installed replacement RKE2 version
          ansible.builtin.command:
            argv:
              - /usr/local/bin/rke2
              - --version
          register: c1_2_replacement_version_output
          changed_when: false

        - name: Extract the exact replacement RKE2 pin
          ansible.builtin.set_fact:
            c1_2_replacement_post_pin: >-
              {{
                c1_2_replacement_version_output.stdout
                | regex_search(
                    'v[0-9]+\.[0-9]+\.[0-9]+\+rke2r[0-9]+'
                  )
                | default('')
              }}

        - name: Reject a replacement binary that differs from the exact pin
          ansible.builtin.assert:
            that:
              - >-
                c1_2_replacement_post_pin
                == hostvars['localhost'].c1_2_replacement_version
            fail_msg: >-
              Hard stop: the replacement binary reports
              {{ c1_2_replacement_post_pin | default('an unreadable pin') }},
              not {{ hostvars['localhost'].c1_2_replacement_version }}.

        - name: Wait for real local apiserver readiness
          ansible.builtin.command:
            argv:
              - /usr/bin/curl
              - --fail
              - --silent
              - --show-error
              - --insecure
              - --connect-timeout
              - "2"
              - --max-time
              - "5"
              - https://127.0.0.1:6443/readyz
          register: c1_2_replacement_local_readyz
          retries: 30
          delay: 10
          until:
            - c1_2_replacement_local_readyz.rc == 0
            - c1_2_replacement_local_readyz.stdout | trim == 'ok'
          changed_when: false

        - name: Wait for the local RKE2 registration listener
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: 9345
            connect_timeout: 2
            timeout: 300

        - name: Rewrite the active replacement kubeconfig to the VIP
          ansible.builtin.replace:
            path: "{{ c1_2_kubeconfig_path }}"
            regexp: '(?m)^(\s*server:\s*)https://[^:\s]+:6443\s*$'
            replace: '\1{{ hostvars["localhost"].c1_2_control_plane_endpoint }}'
            backup: false

        - name: Verify the replacement kubeconfig uses the VIP
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - config
              - view
              - --minify
              - -o
              - "jsonpath={.clusters[0].cluster.server}"
          register: c1_2_replacement_kubeconfig_endpoint
          changed_when: false

        - name: Reject a non-VIP replacement kubeconfig
          ansible.builtin.assert:
            that:
              - >-
                c1_2_replacement_kubeconfig_endpoint.stdout | trim
                == hostvars['localhost'].c1_2_control_plane_endpoint
            fail_msg: >-
              Hard stop: replacement kubeconfig does not use the
              control-plane VIP after server startup.

        - name: Wait for Ready registration with the temporary taint
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - get
              - node
              - "{{ inventory_hostname }}"
              - -o
              - json
          register: c1_2_replacement_registration
          retries: 30
          delay: 20
          until:
            - >-
              (
                c1_2_replacement_registration.stdout
                | from_json
              ).status.conditions
              | selectattr('type', 'equalto', 'Ready')
              | selectattr('status', 'equalto', 'True')
              | list
              | length == 1
            - >-
              (
                c1_2_replacement_registration.stdout
                | from_json
              ).spec.taints
              | default([])
              | selectattr('key', 'equalto',
                           'vhhealth.io/replacement-validation')
              | selectattr('value', 'equalto', 'true')
              | selectattr('effect', 'equalto', 'NoSchedule')
              | list
              | length == 1
          changed_when: false

        - name: Cordon the replacement while validating it
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - cordon
              - "{{ inventory_hostname }}"
          delegate_to: "{{ hostvars['localhost'].c1_2_maintenance_host }}"
          register: c1_2_replacement_cordon
          changed_when: true

        - name: Read the cordoned replacement node state
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - get
              - node
              - "{{ inventory_hostname }}"
              - -o
              - json
          register: c1_2_replacement_node_json
          changed_when: false

        - name: Require labels, health, pin, and both scheduling fences
          ansible.builtin.assert:
            that:
              - >-
                (c1_2_replacement_node_json.stdout | from_json).metadata.labels[
                  'topology.kubernetes.io/region'
                ] == inventory_region
              - >-
                (c1_2_replacement_node_json.stdout | from_json).metadata.labels[
                  'topology.kubernetes.io/zone'
                ] == inventory_zone
              - >-
                (c1_2_replacement_node_json.stdout | from_json).spec.unschedulable
                | default(false) | bool
              - >-
                (c1_2_replacement_node_json.stdout | from_json).spec.taints
                | default([])
                | selectattr('key', 'equalto',
                             'vhhealth.io/replacement-validation')
                | selectattr('value', 'equalto', 'true')
                | selectattr('effect', 'equalto', 'NoSchedule')
                | list
                | length == 1
              - >-
                (c1_2_replacement_node_json.stdout | from_json).status.conditions
                | selectattr('type', 'equalto', 'Ready')
                | selectattr('status', 'equalto', 'True')
                | list
                | length == 1
              - >-
                (c1_2_replacement_node_json.stdout | from_json).status.conditions
                | selectattr(
                    'type',
                    'in',
                    [
                      'MemoryPressure',
                      'DiskPressure',
                      'PIDPressure',
                      'NetworkUnavailable'
                    ]
                  )
                | selectattr('status', 'equalto', 'True')
                | list
                | length == 0
              - >-
                (
                  (c1_2_replacement_node_json.stdout | from_json)
                  .status.nodeInfo.kubeletVersion
                  | regex_search(
                      'v[0-9]+\.[0-9]+\.[0-9]+\+rke2r[0-9]+'
                    )
                  | default('')
                )
                == hostvars['localhost'].c1_2_replacement_version
            fail_msg: >-
              Hard stop: replacement registration lacks the exact pin,
              truthful labels, Ready/pressure-free health, or both the
              temporary NoSchedule taint and explicit cordon.

        - name: Prove VIP-backed API readiness while fenced
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - get
              - --raw=/readyz
          register: c1_2_replacement_vip_readyz
          changed_when: false

        - name: Reject an unready VIP-backed API while fenced
          ansible.builtin.assert:
            that:
              - c1_2_replacement_vip_readyz.stdout | trim == 'ok'
            fail_msg: "Hard stop: VIP-backed /readyz failed while fenced."

        - name: Prove every etcd endpoint is healthy after join
          ansible.builtin.command:
            argv:
              - "{{ c1_2_etcdctl_path }}"
              - "--cacert={{ c1_2_etcd_ca }}"
              - "--cert={{ c1_2_etcd_cert }}"
              - "--key={{ c1_2_etcd_key }}"
              - "--endpoints=https://127.0.0.1:2379"
              - endpoint
              - health
              - --cluster
          environment:
            ETCDCTL_API: "3"
          changed_when: false

        - name: Resolve the joined member by its exact name
          ansible.builtin.shell: |
            set -o pipefail
            {{ c1_2_etcdctl_path | quote }} \
              --cacert={{ c1_2_etcd_ca | quote }} \
              --cert={{ c1_2_etcd_cert | quote }} \
              --key={{ c1_2_etcd_key | quote }} \
              --endpoints=https://127.0.0.1:2379 \
              member list |
              /usr/bin/awk -F', *' -v name="$REPLACEMENT_NODE" \
                '$3 == name {print tolower($1)}'
          args:
            executable: /bin/bash
          environment:
            ETCDCTL_API: "3"
            REPLACEMENT_NODE: "{{ inventory_hostname }}"
          register: c1_2_joined_member_id
          changed_when: false

        - name: Inspect exact etcd membership after replacement join
          ansible.builtin.command:
            argv:
              - "{{ c1_2_etcdctl_path }}"
              - "--cacert={{ c1_2_etcd_ca }}"
              - "--cert={{ c1_2_etcd_cert }}"
              - "--key={{ c1_2_etcd_key }}"
              - "--endpoints=https://127.0.0.1:2379"
              - member
              - list
              - --write-out=json
          environment:
            ETCDCTL_API: "3"
          register: c1_2_etcd_members_after_join
          changed_when: false

        - name: Require one canonical joined etcd member
          ansible.builtin.assert:
            that:
              - c1_2_joined_member_id.stdout_lines | length == 1
              - >-
                c1_2_joined_member_id.stdout | trim
                is match('^[0-9a-f]{1,16}$')
              - >-
                (
                  (c1_2_etcd_members_after_join.stdout | from_json).members
                  | map(attribute='name')
                  | list
                  | sort
                )
                == groups['rke2_servers'] | list | sort
            fail_msg: >-
              Hard stop: the replacement is not exactly one healthy etcd
              member with a canonical hexadecimal ID.

        - name: Inspect CloudNativePG quorum while replacement is fenced
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - -n
              - vhhealth-platform
              - get
              - cluster.postgresql.cnpg.io/vhhealth-pg
              - -o
              - json
          register: c1_2_replacement_cnpg_quorum
          changed_when: false

        - name: Require a primary and two ready instances while fenced
          ansible.builtin.assert:
            that:
              - >-
                (
                  c1_2_replacement_cnpg_quorum.stdout
                  | from_json
                ).spec.instances
                | int == 3
              - >-
                (
                  c1_2_replacement_cnpg_quorum.stdout
                  | from_json
                ).status.currentPrimary
                | default('') | length > 0
              - >-
                (
                  c1_2_replacement_cnpg_quorum.stdout
                  | from_json
                ).status.readyInstances
                | default(0) | int >= 2
            fail_msg: >-
              Hard stop: CloudNativePG lacks a primary or two ready instances
              while the replacement is fenced.

        - name: Prove a streaming synchronous standby while fenced
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - -n
              - vhhealth-platform
              - exec
              - >-
                {{
                  (
                    c1_2_replacement_cnpg_quorum.stdout
                    | from_json
                  ).status.currentPrimary
                }}
              - --
              - psql
              - -U
              - postgres
              - -d
              - postgres
              - -Atc
              - >-
                SELECT count(*) FROM pg_stat_replication
                WHERE state = 'streaming'
                AND sync_state IN ('sync', 'quorum');
          register: c1_2_replacement_sync_standbys
          changed_when: false

        - name: Reject loss of synchronous standby protection while fenced
          ansible.builtin.assert:
            that:
              - c1_2_replacement_sync_standbys.stdout | trim | int >= 1
            fail_msg: >-
              Hard stop: the CNPG primary has no streaming synchronous
              standby while the replacement is fenced.

        - name: Find non-Bound PVCs while fenced
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - get
              - pvc
              - --all-namespaces
              - -o
              - >-
                jsonpath={range .items[?(@.status.phase!="Bound")]}{.metadata.namespace}{"/"}{.metadata.name}{"\n"}{end}
          register: c1_2_replacement_unbound_pvcs
          changed_when: false

        - name: Reject non-Bound PVCs while fenced
          ansible.builtin.assert:
            that:
              - c1_2_replacement_unbound_pvcs.stdout | trim | length == 0
            fail_msg: >-
              Hard stop: one or more PVCs are not Bound while the replacement
              is fenced.

        - name: Detect the Longhorn API without hiding query failures
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - get
              - crd
              - volumes.longhorn.io
              - -o
              - name
          register: c1_2_replacement_longhorn_crd
          changed_when: false
          failed_when: false

        - name: Reject every Longhorn detection error except exact absence
          ansible.builtin.assert:
            that:
              - >-
                c1_2_replacement_longhorn_crd.rc == 0
                or
                (
                  c1_2_replacement_longhorn_crd.rc == 1
                  and
                  'Error from server (NotFound)'
                  in c1_2_replacement_longhorn_crd.stderr
                  and
                  'volumes.longhorn.io'
                  in c1_2_replacement_longhorn_crd.stderr
                  and
                  'not found'
                  in c1_2_replacement_longhorn_crd.stderr
                )
              - >-
                c1_2_replacement_longhorn_crd.rc != 0
                or
                c1_2_replacement_longhorn_crd.stdout | trim
                ==
                'customresourcedefinition.apiextensions.k8s.io/'
                ~ 'volumes.longhorn.io'
            fail_msg: >-
              Hard stop: Longhorn detection returned an authentication,
              transport, authorization, or unexpected resource error.

        - name: Wait for Longhorn volumes and nodes to be healthy while fenced
          ansible.builtin.shell: |
            set -euo pipefail
            /usr/local/bin/kubectl \
              --kubeconfig={{ c1_2_kubeconfig_path | quote }} \
              -n longhorn-system get volumes.longhorn.io -o json |
              /usr/bin/jq -r '
                .items[]
                | select(
                    .status.robustness != "healthy"
                    or (.spec.numberOfReplicas // 0) != 3
                  )
                | "volume/" + .metadata.name
                  + "=robustness:" + (.status.robustness // "missing")
                  + ",replicas:"
                  + ((.spec.numberOfReplicas // 0) | tostring)
              '
            /usr/local/bin/kubectl \
              --kubeconfig={{ c1_2_kubeconfig_path | quote }} \
              -n longhorn-system get nodes.longhorn.io -o json |
              /usr/bin/jq -r '
                if (.items | length) < 3 then
                  "node-count=" + ((.items | length) | tostring)
                else
                  .items[]
                  | select(
                      ([.status.conditions[]
                        | select(.type == "Ready" and .status == "True")]
                        | length) != 1
                      or
                      ([.status.conditions[]
                        | select(.type == "Schedulable"
                                 and .status == "True")]
                        | length) != 1
                    )
                  | "node/" + .metadata.name + "=not-ready-or-schedulable"
                end
              '
            test "$(
              /usr/local/bin/kubectl \
                --kubeconfig={{ c1_2_kubeconfig_path | quote }} \
                get storageclass longhorn \
                -o 'jsonpath={.provisioner}'
            )" = driver.longhorn.io
            test "$(
              /usr/local/bin/kubectl \
                --kubeconfig={{ c1_2_kubeconfig_path | quote }} \
                get storageclass longhorn \
                -o 'jsonpath={.parameters.numberOfReplicas}'
            )" = 3
          args:
            executable: /bin/bash
          register: c1_2_replacement_longhorn_health
          retries: 30
          delay: 20
          until:
            - c1_2_replacement_longhorn_health.rc == 0
            - >-
              c1_2_replacement_longhorn_health.stdout
              | trim | length == 0
          changed_when: false
          when: c1_2_replacement_longhorn_crd.rc == 0

        - name: Re-prove the maintenance server before removing live fences
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - get
              - --raw=/readyz
          delegate_to: "{{ hostvars['localhost'].c1_2_maintenance_host }}"
          register: c1_2_maintenance_ready_before_uncordon
          changed_when: false

        - name: Require the maintenance server to retain VIP-backed readiness
          ansible.builtin.assert:
            that:
              - >-
                c1_2_maintenance_ready_before_uncordon.stdout | trim == 'ok'
            fail_msg: >-
              Hard stop: the explicit maintenance server lost VIP-backed API
              readiness before live scheduling fences were removed.

        - name: Remove the temporary registration taint from RKE2 config
          ansible.builtin.replace:
            path: /etc/rancher/rke2/config.yaml
            regexp: >-
              (?m)^node-taint:\n  -
              "vhhealth\.io/replacement-validation=true:NoSchedule"\n
            replace: ""
            backup: false
          no_log: true

        - name: Remove the live temporary registration taint
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - taint
              - node
              - "{{ inventory_hostname }}"
              - vhhealth.io/replacement-validation-
          delegate_to: "{{ hostvars['localhost'].c1_2_maintenance_host }}"
          changed_when: true

        - name: Validate every replacement rescue delegate
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - get
              - --raw=/readyz
          delegate_to: "{{ item }}"
          loop: >-
            {{
              groups['rke2_servers']
              | reject(
                  'equalto',
                  hostvars['localhost'].c1_2_replacement_node
                )
              | list
              | sort
            }}
          loop_control:
            label: "{{ item }}"
          register: c1_2_replacement_rescue_delegates_ready
          changed_when: false

        - name: Require every replacement rescue delegate to be ready
          ansible.builtin.assert:
            that:
              - >-
                c1_2_replacement_rescue_delegates_ready.results
                | rejectattr('stdout', 'defined')
                | list
                | length == 0
              - >-
                c1_2_replacement_rescue_delegates_ready.results
                | map(attribute='stdout')
                | map('trim')
                | reject('equalto', 'ok')
                | list
                | length == 0
            fail_msg: >-
              Hard stop: both declared survivors must retain VIP-backed API
              readiness as independent replacement rescue delegates.

        - name: Uncordon the validated replacement
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - uncordon
              - "{{ inventory_hostname }}"
          delegate_to: "{{ hostvars['localhost'].c1_2_maintenance_host }}"
          register: c1_2_replacement_uncordon_result
          ignore_unreachable: true
          changed_when: true

        - name: Verify replacement scheduling and health after uncordon
          ansible.builtin.shell: |
            set -euo pipefail
            /usr/local/bin/kubectl \
              --kubeconfig={{ c1_2_kubeconfig_path | quote }} \
              get node "$REPLACEMENT_NODE" -o json |
              /usr/bin/jq -e '
                ((.spec.unschedulable // false) == false)
                and
                (
                  [.status.conditions[]
                    | select(.type == "Ready" and .status == "True")]
                  | length == 1
                )
                and
                (
                  [.status.conditions[]
                    | select(
                        (
                          .type == "MemoryPressure"
                          or .type == "DiskPressure"
                          or .type == "PIDPressure"
                          or .type == "NetworkUnavailable"
                        )
                        and .status == "True"
                      )]
                  | length == 0
                )
              ' >/dev/null
          args:
            executable: /bin/bash
          environment:
            REPLACEMENT_NODE: "{{ inventory_hostname }}"
          delegate_to: "{{ hostvars['localhost'].c1_2_maintenance_host }}"
          register: c1_2_replacement_after_uncordon
          ignore_unreachable: true
          retries: 12
          delay: 10
          until: c1_2_replacement_after_uncordon.rc == 0
          changed_when: false

        - name: Require immediate replacement health through the maintenance path
          ansible.builtin.assert:
            that:
              - >-
                not (
                  c1_2_replacement_after_uncordon.unreachable
                  | default(false)
                  | bool
                )
              - c1_2_replacement_after_uncordon.rc | default(1) | int == 0
            fail_msg: >-
              Hard stop: immediate replacement health could not be proved
              through the maintenance path after uncordon.

        - name: Wait for full healthy CloudNativePG convergence
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - -n
              - vhhealth-platform
              - get
              - cluster.postgresql.cnpg.io/vhhealth-pg
              - -o
              - json
          delegate_to: "{{ hostvars['localhost'].c1_2_maintenance_host }}"
          register: c1_2_cnpg_recovered
          ignore_unreachable: true
          retries: 60
          delay: 20
          until:
            - >-
              (c1_2_cnpg_recovered.stdout | from_json).status.phase
              | default('') == 'Cluster in healthy state'
            - >-
              (c1_2_cnpg_recovered.stdout | from_json).spec.instances
              | int == 3
            - >-
              (c1_2_cnpg_recovered.stdout | from_json).status.currentPrimary
              | default('') | length > 0
            - >-
              (c1_2_cnpg_recovered.stdout | from_json).status.readyInstances
              | default(0) | int
              ==
              (c1_2_cnpg_recovered.stdout | from_json).spec.instances | int
            - >-
              (
                (c1_2_cnpg_recovered.stdout | from_json)
                .status.instancesStatus.healthy
                | default([])
                | length
              )
              ==
              (c1_2_cnpg_recovered.stdout | from_json).spec.instances | int
          changed_when: false

        - name: Prove synchronous standby protection after uncordon
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - -n
              - vhhealth-platform
              - exec
              - >-
                {{
                  (
                    c1_2_cnpg_recovered.stdout
                    | from_json
                  ).status.currentPrimary
                }}
              - --
              - psql
              - -U
              - postgres
              - -d
              - postgres
              - -Atc
              - >-
                SELECT count(*) FROM pg_stat_replication
                WHERE state = 'streaming'
                AND sync_state IN ('sync', 'quorum');
          delegate_to: "{{ hostvars['localhost'].c1_2_maintenance_host }}"
          register: c1_2_recovered_sync_standbys
          ignore_unreachable: true
          changed_when: false

        - name: Reject loss of synchronous standby protection after uncordon
          ansible.builtin.assert:
            that:
              - c1_2_recovered_sync_standbys.stdout | trim | int >= 1
            fail_msg: >-
              Hard stop: CNPG converged without a streaming synchronous
              standby.

        - name: Wait for post-uncordon Longhorn health
          ansible.builtin.shell: |
            set -euo pipefail
            /usr/local/bin/kubectl \
              --kubeconfig={{ c1_2_kubeconfig_path | quote }} \
              -n longhorn-system get volumes.longhorn.io -o json |
              /usr/bin/jq -r '
                .items[]
                | select(
                    .status.robustness != "healthy"
                    or (.spec.numberOfReplicas // 0) != 3
                  )
                | "volume/" + .metadata.name
                  + "=robustness:" + (.status.robustness // "missing")
                  + ",replicas:"
                  + ((.spec.numberOfReplicas // 0) | tostring)
              '
            /usr/local/bin/kubectl \
              --kubeconfig={{ c1_2_kubeconfig_path | quote }} \
              -n longhorn-system get nodes.longhorn.io -o json |
              /usr/bin/jq -r '
                if (.items | length) < 3 then
                  "node-count=" + ((.items | length) | tostring)
                else
                  .items[]
                  | select(
                      ([.status.conditions[]
                        | select(.type == "Ready" and .status == "True")]
                        | length) != 1
                      or
                      ([.status.conditions[]
                        | select(.type == "Schedulable"
                                 and .status == "True")]
                        | length) != 1
                    )
                  | "node/" + .metadata.name + "=not-ready-or-schedulable"
                end
              '
            test "$(
              /usr/local/bin/kubectl \
                --kubeconfig={{ c1_2_kubeconfig_path | quote }} \
                get storageclass longhorn \
                -o 'jsonpath={.provisioner}'
            )" = driver.longhorn.io
            test "$(
              /usr/local/bin/kubectl \
                --kubeconfig={{ c1_2_kubeconfig_path | quote }} \
                get storageclass longhorn \
                -o 'jsonpath={.parameters.numberOfReplicas}'
            )" = 3
          args:
            executable: /bin/bash
          delegate_to: "{{ hostvars['localhost'].c1_2_maintenance_host }}"
          register: c1_2_recovered_longhorn_health
          ignore_unreachable: true
          retries: 60
          delay: 20
          until:
            - c1_2_recovered_longhorn_health.rc == 0
            - c1_2_recovered_longhorn_health.stdout | trim | length == 0
          changed_when: false
          when: c1_2_replacement_longhorn_crd.rc == 0

        - name: Find final PVC or node degradation
          ansible.builtin.shell: |
            set -euo pipefail
            pvc_failures=$(
              /usr/local/bin/kubectl \
                --kubeconfig={{ c1_2_kubeconfig_path | quote }} \
                get pvc --all-namespaces \
                -o 'jsonpath={range .items[?(@.status.phase!="Bound")]}{.metadata.namespace}{"/"}{.metadata.name}{"\n"}{end}'
            )
            node_failures=$(
              /usr/local/bin/kubectl \
                --kubeconfig={{ c1_2_kubeconfig_path | quote }} \
                get nodes -o json |
                /usr/bin/jq -r '
                  .items[]
                  | select(
                      (.spec.unschedulable // false)
                      or
                      ([.status.conditions[]
                        | select(.type == "Ready" and .status == "True")]
                        | length) != 1
                      or
                      any(.status.conditions[];
                          (
                            .type == "MemoryPressure"
                            or .type == "DiskPressure"
                            or .type == "PIDPressure"
                            or .type == "NetworkUnavailable"
                          )
                          and .status == "True")
                    )
                  | .metadata.name
                '
            )
            printf '%s\n%s\n' "$pvc_failures" "$node_failures" |
              /usr/bin/sed '/^$/d'
          args:
            executable: /bin/bash
          delegate_to: "{{ hostvars['localhost'].c1_2_maintenance_host }}"
          register: c1_2_replacement_final_degradation
          ignore_unreachable: true
          changed_when: false

        - name: Reject final PVC or node degradation
          ansible.builtin.assert:
            that:
              - >-
                not (
                  c1_2_replacement_uncordon_result.unreachable
                  | default(false)
                  | bool
                )
              - c1_2_replacement_uncordon_result.rc | default(1) | int == 0
              - >-
                not (
                  c1_2_replacement_final_degradation.unreachable
                  | default(false)
                  | bool
                )
              - >-
                c1_2_replacement_final_degradation.stdout
                | default('') | trim | length == 0
            fail_msg: >-
              Hard stop: a PVC is not Bound or a node is cordoned, not Ready,
              or reports pressure/network unavailability after replacement.

        - name: Prove the final Kubernetes node set matches the inventory
          ansible.builtin.shell: |
            set -euo pipefail
            /usr/local/bin/kubectl \
              --kubeconfig={{ c1_2_kubeconfig_path | quote }} \
              get nodes -o json |
              /usr/bin/jq -e \
                --argjson expected {{
                  (
                    (
                      (groups['rke2_servers'] | list)
                      +
                      (groups['rke2_agents'] | default([]) | list)
                    )
                    | sort
                    | to_json
                  )
                  | quote
                }} '
                  ([.items[].metadata.name] | sort)
                  == ($expected | sort)
                ' >/dev/null
          args:
            executable: /bin/bash
          delegate_to: "{{ hostvars['localhost'].c1_2_maintenance_host }}"
          register: c1_2_replacement_final_node_set
          ignore_unreachable: true
          changed_when: false

        - name: Require the exact final declared Kubernetes node set
          ansible.builtin.assert:
            that:
              - >-
                not (
                  c1_2_replacement_final_node_set.unreachable
                  | default(false)
                  | bool
                )
              - c1_2_replacement_final_node_set.rc | default(1) | int == 0
            fail_msg: >-
              Hard stop: the final Kubernetes API node set does not exactly
              match the declared RKE2 server and agent inventory.

        - name: Read the final replacement kubelet version
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - get
              - node
              - "{{ inventory_hostname }}"
              - -o
              - "jsonpath={.status.nodeInfo.kubeletVersion}"
          delegate_to: "{{ hostvars['localhost'].c1_2_maintenance_host }}"
          register: c1_2_replacement_final_kubelet_version
          ignore_unreachable: true
          changed_when: false

        - name: Require the final replacement kubelet to report the exact pin
          ansible.builtin.assert:
            that:
              - >-
                not (
                  c1_2_replacement_final_kubelet_version.unreachable
                  | default(false)
                  | bool
                )
              - >-
                c1_2_replacement_final_kubelet_version.stdout
                | default('') | trim
                == hostvars['localhost'].c1_2_replacement_version
            fail_msg: >-
              Hard stop: the final replacement kubelet reports
              {{ c1_2_replacement_final_kubelet_version.stdout | trim }},
              not {{ hostvars['localhost'].c1_2_replacement_version }}.

        - name: Re-prove final VIP-backed API readiness
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - get
              - --raw=/readyz
          delegate_to: "{{ hostvars['localhost'].c1_2_maintenance_host }}"
          register: c1_2_replacement_final_vip_readyz
          ignore_unreachable: true
          changed_when: false

        - name: Require final VIP-backed API readiness
          ansible.builtin.assert:
            that:
              - >-
                not (
                  c1_2_replacement_final_vip_readyz.unreachable
                  | default(false)
                  | bool
                )
              - >-
                c1_2_replacement_final_vip_readyz.stdout
                | default('') | trim == 'ok'
            fail_msg: "Hard stop: final VIP-backed /readyz failed."

        - name: Re-prove final etcd cluster health
          ansible.builtin.command:
            argv:
              - "{{ c1_2_etcdctl_path }}"
              - "--cacert={{ c1_2_etcd_ca }}"
              - "--cert={{ c1_2_etcd_cert }}"
              - "--key={{ c1_2_etcd_key }}"
              - "--endpoints=https://127.0.0.1:2379"
              - endpoint
              - health
              - --cluster
          environment:
            ETCDCTL_API: "3"
          delegate_to: "{{ hostvars['localhost'].c1_2_maintenance_host }}"
          register: c1_2_replacement_final_etcd_health
          ignore_unreachable: true
          changed_when: false

        - name: Require final etcd health through the maintenance path
          ansible.builtin.assert:
            that:
              - >-
                not (
                  c1_2_replacement_final_etcd_health.unreachable
                  | default(false)
                  | bool
                )
              - c1_2_replacement_final_etcd_health.rc | default(1) | int == 0
            fail_msg: >-
              Hard stop: final etcd health could not be proved through the
              maintenance path.

        - name: Report the remaining manual evidence boundary
          ansible.builtin.debug:
            msg: >-
              Replacement joined through the VIP, remained fenced through
              local/API/etcd/CNPG/storage checks, and was uncordoned only after
              those gates passed. Retain this output and complete the
              synthetic service checks in docs/runbooks/C1_2_HA_DRILL.md.
      rescue:
        - name: Re-cordon the replacement through every declared survivor
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - cordon
              - "{{ inventory_hostname }}"
          delegate_to: "{{ item }}"
          loop: >-
            {{
              groups['rke2_servers']
              | reject(
                  'equalto',
                  hostvars['localhost'].c1_2_replacement_node
                )
              | list
              | sort
            }}
          loop_control:
            label: "{{ item }}"
          register: c1_2_replacement_rescue_cordon_attempts
          when:
            - >-
              c1_2_replacement_cordon is defined
              or c1_2_replacement_uncordon_result is defined
          ignore_unreachable: true
          changed_when: false
          failed_when: false

        - name: Require at least one survivor to restore the replacement fence
          ansible.builtin.assert:
            that:
              - >-
                c1_2_replacement_rescue_cordon_attempts.results
                | selectattr('rc', 'defined')
                | selectattr('rc', 'equalto', 0)
                | list
                | length >= 1
            fail_msg: >-
              Hard stop: no declared survivor could re-cordon
              {{ inventory_hostname }} after the failed replacement gate.
          when:
            - >-
              c1_2_replacement_cordon is defined
              or c1_2_replacement_uncordon_result is defined

        - name: Stop replacement with the node fenced
          ansible.builtin.fail:
            msg: >-
              Replacement validation failed on {{ inventory_hostname }}. The
              node remained fenced or was safely re-cordoned after a later
              convergence gate; investigate before resuming.

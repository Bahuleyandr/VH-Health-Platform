---
# Operator-executed RKE2 ladder upgrade.
#
# This file is inert in Git. Running it is a production change and requires an
# approved maintenance window plus the evidence receipts checked below.
#
# Example: first approved rung
#   ansible-playbook -i inventories/prod.yml playbooks/upgrade-k8s.yml \
#     -e rke2_upgrade_from_version=v1.31.4+rke2r1 \
#     -e rke2_upgrade_to_version=v1.31.14+rke2r2 \
#     -e rke2_upgrade_maintenance_host=<healthy-rke2-server> \
#     -e rke2_upgrade_evidence_dir=/secure/evidence/c1-2/rung-1 \
#     -e rke2_upgrade_evidence_max_age_hours=1 \
#     -e rke2_upgrade_authorized=true --ask-vault-pass
#
# The exact ladder is binding. A partially completed rung may be resumed:
# nodes may already report the requested target, but no node may report any
# version other than the declared source or target.

- name: Validate the requested RKE2 rung and operator evidence
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - name: Reject external use of the reserved internal variable namespace
      ansible.builtin.assert:
        that:
          - >-
            vars.keys()
            | select('match', '^c1_2_')
            | list
            | length == 0
        fail_msg: >-
          Hard stop: c1_2_* names are reserved for validated playbook state.
          Remove every inventory or extra variable using that prefix.

    - name: Load the protected production Vault file
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/group_vars/all/vault.yml"
        name: c1_2_upgrade_vault_file
      no_log: true

    - name: Normalize operator inputs
      ansible.builtin.set_fact:
        c1_2_upgrade_from_version: "{{ rke2_upgrade_from_version | default('') }}"
        c1_2_upgrade_to_version: "{{ rke2_upgrade_to_version | default('') }}"
        c1_2_upgrade_maintenance_host: >-
          {{ rke2_upgrade_maintenance_host | default('') }}
        c1_2_upgrade_evidence_dir: "{{ rke2_upgrade_evidence_dir | default('') }}"
        c1_2_upgrade_artifact_url: >-
          {{
            c1_2_upgrade_vault_file.vault_rke2_prime_artifact_url
            | default('')
          }}
        c1_2_upgrade_protected_token: >-
          {{
            c1_2_upgrade_vault_file.vault_rke2_cluster_token
            | default('')
          }}
        c1_2_control_plane_endpoint: >-
          https://{{ control_plane_vip_address | default('') }}:6443
        c1_2_evidence_max_age_hours: >-
          {{ rke2_upgrade_evidence_max_age_hours | default(0) | int }}
        c1_2_snapshot_max_age_hours: 6
        c1_2_snapshot_clock_skew_seconds: 300
        c1_2_snapshot_receipt_delay_seconds: 900
      no_log: true

    - name: Reject an unauthorized, skipped, downgraded, or off-ladder rung
      ansible.builtin.assert:
        that:
          - rke2_upgrade_authorized | default(false) | bool
          - rke2_upgrade_artifact_url is not defined
          - c1_2_upgrade_protected_token | length > 0
          - >-
            c1_2_upgrade_protected_token
            == (c1_2_upgrade_protected_token | trim)
          - "'REPLACE' not in (c1_2_upgrade_protected_token | upper)"
          - "'CHANGEME' not in (c1_2_upgrade_protected_token | upper)"
          - "'PLACEHOLDER' not in (c1_2_upgrade_protected_token | upper)"
          - >-
            rke2_cluster_token | default('')
            == c1_2_upgrade_protected_token
          - control_plane_vip_address | default('') | length > 0
          - >-
            c1_2_upgrade_from_version in [
              'v1.31.4+rke2r1',
              'v1.31.14+rke2r2',
              'v1.32.13+rke2r2',
              'v1.33.13+rke2r1',
              'v1.34.9+rke2r1'
            ]
          - >-
            c1_2_upgrade_to_version in [
              'v1.31.4+rke2r1',
              'v1.31.14+rke2r2',
              'v1.32.13+rke2r2',
              'v1.33.13+rke2r1',
              'v1.34.9+rke2r1'
            ]
          - >-
            [
              'v1.31.4+rke2r1',
              'v1.31.14+rke2r2',
              'v1.32.13+rke2r2',
              'v1.33.13+rke2r1',
              'v1.34.9+rke2r1'
            ].index(c1_2_upgrade_to_version)
            ==
            [
              'v1.31.4+rke2r1',
              'v1.31.14+rke2r2',
              'v1.32.13+rke2r2',
              'v1.33.13+rke2r1',
              'v1.34.9+rke2r1'
            ].index(c1_2_upgrade_from_version) + 1
          - c1_2_upgrade_maintenance_host in groups['rke2_servers']
          - c1_2_upgrade_evidence_dir is match('^/')
          - c1_2_evidence_max_age_hours > 0
          - c1_2_evidence_max_age_hours <= c1_2_snapshot_max_age_hours
          - >-
            vault_rke2_prime_artifact_url | default('') | string
            == c1_2_upgrade_artifact_url
          - >-
            rke2_install_artifact_url | default('') | string
            == c1_2_upgrade_artifact_url
          - >-
            (
              c1_2_upgrade_to_version in [
                'v1.31.14+rke2r2',
                'v1.32.13+rke2r2'
              ]
            )
            ==
            (c1_2_upgrade_artifact_url | length > 0)
          - >-
            c1_2_upgrade_artifact_url | length == 0
            or c1_2_upgrade_artifact_url is match('^https://.+/rke2/?$')
        fail_msg: >-
          Hard stop: authorize the run, choose an explicit healthy maintenance
          server, provide an absolute evidence directory, and request exactly
          one forward step on the approved RKE2 ladder. Skipped minors,
          downgrades, off-ladder targets, and snapshot evidence windows over
          six hours are not supported. The two Prime-only targets require an
          authenticated value loaded directly from
          inventories/group_vars/all/vault.yml as
          vault_rke2_prime_artifact_url ending in /rke2, and the inventory
          rke2_install_artifact_url must resolve to that exact protected value.
          rke2_upgrade_artifact_url is forbidden because a command-line
          override must not replace the inventory-owned artifact identity.
      no_log: true

    - name: Build the protected installer environment
      ansible.builtin.set_fact:
        c1_2_upgrade_install_environment: >-
          {{
            {
              'INSTALL_RKE2_VERSION': c1_2_upgrade_to_version,
              'INSTALL_RKE2_CHANNEL': 'stable'
            }
            | combine(
                (
                  c1_2_upgrade_artifact_url | length > 0
                )
                | ternary(
                    {
                      'INSTALL_RKE2_ARTIFACT_URL':
                        c1_2_upgrade_artifact_url
                    },
                    {}
                  )
              )
          }}
      no_log: true

    - name: Inspect required pre-rung evidence receipts on the control node
      ansible.builtin.stat:
        path: "{{ c1_2_upgrade_evidence_dir }}/{{ item }}"
      loop:
        - synthetic-qa.txt
        - pre-rung-etcd-snapshot.txt
        - backup-restore-proof.txt
        - release-note-review.txt
        - owner-window.txt
        - cnpg-replication.txt
        - storage-health.txt
        - cni-dns.txt
        - metrics-alerts.txt
      loop_control:
        label: "{{ item }}"
      register: c1_2_upgrade_evidence

    - name: Reject missing, empty, or stale pre-rung evidence
      ansible.builtin.assert:
        that:
          - item.stat.exists | default(false)
          - item.stat.isreg | default(false)
          - item.stat.size | default(0) | int > 0
          - >-
            item.item != 'pre-rung-etcd-snapshot.txt'
            or (
              (ansible_date_time.epoch | int)
              - (item.stat.mtime | default(0) | int)
            ) <= (c1_2_evidence_max_age_hours * 3600)
          - >-
            item.item != 'pre-rung-etcd-snapshot.txt'
            or (item.stat.mtime | default(0) | int)
            <= ((ansible_date_time.epoch | int) + 300)
        fail_msg: >-
          Hard stop: {{ item.item }} is missing, empty, or the pre-rung etcd
          snapshot receipt is older than {{ c1_2_evidence_max_age_hours }}
          hours. Refresh the evidence; do not bypass this gate.
      loop: "{{ c1_2_upgrade_evidence.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read the structured pre-rung snapshot receipt
      ansible.builtin.slurp:
        src: "{{ c1_2_upgrade_evidence_dir }}/pre-rung-etcd-snapshot.txt"
      register: c1_2_snapshot_receipt_blob

    - name: Parse the structured pre-rung snapshot receipt
      ansible.builtin.set_fact:
        c1_2_snapshot_receipt: >-
          {{ c1_2_snapshot_receipt_blob.content | b64decode | from_json }}

    - name: Reject an incomplete or unsafe snapshot receipt
      ansible.builtin.assert:
        that:
          - c1_2_snapshot_receipt is mapping
          - >-
            c1_2_snapshot_receipt.keys() | list | sort == [
              'cluster_id',
              'created_at_utc',
              'etcdutl',
              'offsite_status',
              'schema',
              'sha256',
              'snapshot_host',
              'snapshot_name',
              'snapshot_path',
              'source_version'
            ]
          - >-
            c1_2_snapshot_receipt.schema
            == 'vhhealth.c1-2.rke2-snapshot/v1'
          - c1_2_snapshot_receipt.snapshot_host in groups['rke2_servers']
          - >-
            c1_2_snapshot_receipt.snapshot_name
            is match('^[A-Za-z0-9][A-Za-z0-9._+-]+$')
          - >-
            c1_2_snapshot_receipt.snapshot_path
            is match('^/var/lib/rancher/rke2/server/db/snapshots/[A-Za-z0-9][A-Za-z0-9._+-]+$')
          - >-
            c1_2_snapshot_receipt.snapshot_path | basename
            == c1_2_snapshot_receipt.snapshot_name
          - >-
            c1_2_snapshot_receipt.created_at_utc
            is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$')
          - >-
            c1_2_snapshot_receipt.source_version
            == c1_2_upgrade_from_version
          - c1_2_snapshot_receipt.cluster_id | string is match('^[0-9]+$')
          - c1_2_snapshot_receipt.sha256 is match('^[0-9a-f]{64}$')
          - c1_2_snapshot_receipt.offsite_status == 'verified'
          - c1_2_snapshot_receipt.etcdutl is mapping
          - >-
            c1_2_snapshot_receipt.etcdutl.keys() | list | sort == [
              'hash',
              'revision',
              'total_keys'
            ]
          - c1_2_snapshot_receipt.etcdutl.hash | string | length > 0
          - c1_2_snapshot_receipt.etcdutl.revision | int > 0
          - c1_2_snapshot_receipt.etcdutl.total_keys | int > 0
        fail_msg: >-
          Hard stop: pre-rung-etcd-snapshot.txt must be the exact structured
          vhhealth.c1-2.rke2-snapshot/v1 receipt for a fresh local snapshot,
          its SHA-256 identity, successful off-site proof, source pin, and
          etcdutl snapshot status. Free-form text is not accepted.

    - name: Parse the snapshot creation time and receipt file time
      ansible.builtin.set_fact:
        c1_2_snapshot_created_epoch: >-
          {{
            (
              (
                c1_2_snapshot_receipt.created_at_utc
                | to_datetime('%Y-%m-%dT%H:%M:%SZ')
              )
              -
              (
                '1970-01-01T00:00:00Z'
                | to_datetime('%Y-%m-%dT%H:%M:%SZ')
              )
            ).total_seconds()
            | int
          }}
        c1_2_snapshot_receipt_mtime: >-
          {{
            (
              c1_2_upgrade_evidence.results
              | selectattr(
                  'item',
                  'equalto',
                  'pre-rung-etcd-snapshot.txt'
                )
              | map(attribute='stat.mtime')
              | first
            )
            | int
          }}

    - name: Bind the receipt timestamp to the fresh snapshot evidence window
      ansible.builtin.assert:
        that:
          - >-
            (ansible_date_time.epoch | int) - c1_2_snapshot_created_epoch
            >= (0 - c1_2_snapshot_clock_skew_seconds)
          - >-
            (ansible_date_time.epoch | int) - c1_2_snapshot_created_epoch
            <= (c1_2_evidence_max_age_hours * 3600)
          - >-
            c1_2_snapshot_receipt_mtime - c1_2_snapshot_created_epoch
            >= (0 - c1_2_snapshot_clock_skew_seconds)
          - >-
            c1_2_snapshot_receipt_mtime - c1_2_snapshot_created_epoch
            <= c1_2_snapshot_receipt_delay_seconds
        fail_msg: >-
          Hard stop: created_at_utc is outside the bounded fresh-snapshot
          window or is not closely bound to the structured receipt file time.

- name: Reject reserved upgrade variables on every managed node
  hosts: rke2_servers:rke2_agents
  become: false
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  tasks:
    - name: Reject inventory use of the reserved internal variable namespace
      ansible.builtin.assert:
        that:
          - >-
            vars.keys()
            | select('match', '^c1_2_')
            | list
            | length == 0
        fail_msg: >-
          Hard stop: c1_2_* names are reserved for validated playbook state.
          Remove every host or group variable using that prefix.

- name: Verify the actual pre-rung etcd snapshot named by the receipt
  hosts: rke2_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  vars:
    c1_2_snapshot_etcdctl: /var/lib/rancher/rke2/bin/etcdctl
    c1_2_snapshot_etcd_ca: /var/lib/rancher/rke2/server/tls/etcd/server-ca.crt
    c1_2_snapshot_etcd_cert: /var/lib/rancher/rke2/server/tls/etcd/server-client.crt
    c1_2_snapshot_etcd_key: /var/lib/rancher/rke2/server/tls/etcd/server-client.key
  pre_tasks:
    - name: End this play for servers other than the snapshot host
      ansible.builtin.meta: end_host
      when:
        - >-
          inventory_hostname
          != hostvars['localhost'].c1_2_snapshot_receipt.snapshot_host
  tasks:
    - name: Inspect the actual snapshot file and SHA-256 identity
      ansible.builtin.stat:
        path: "{{ hostvars['localhost'].c1_2_snapshot_receipt.snapshot_path }}"
        checksum_algorithm: sha256
        get_checksum: true
      register: c1_2_actual_snapshot

    - name: Inspect the bundled etcdutl binary
      ansible.builtin.stat:
        path: /var/lib/rancher/rke2/bin/etcdutl
      register: c1_2_etcdutl_binary

    - name: Reject a missing, empty, stale, or mismatched snapshot
      ansible.builtin.assert:
        that:
          - c1_2_actual_snapshot.stat.exists | default(false)
          - c1_2_actual_snapshot.stat.isreg | default(false)
          - c1_2_actual_snapshot.stat.size | default(0) | int > 0
          - c1_2_actual_snapshot.stat.pw_name | default('') == 'root'
          - not (c1_2_actual_snapshot.stat.wgrp | default(true) | bool)
          - not (c1_2_actual_snapshot.stat.woth | default(true) | bool)
          - >-
            c1_2_actual_snapshot.stat.checksum | default('')
            == hostvars['localhost'].c1_2_snapshot_receipt.sha256
          - >-
            (
              (hostvars['localhost'].ansible_date_time.epoch | int)
              - (c1_2_actual_snapshot.stat.mtime | default(0) | int)
            )
            <=
            (hostvars['localhost'].c1_2_evidence_max_age_hours * 3600)
          - >-
            c1_2_actual_snapshot.stat.mtime | default(0) | int
            <= ((hostvars['localhost'].ansible_date_time.epoch | int) + 300)
          - >-
            (
              (c1_2_actual_snapshot.stat.mtime | default(0) | int)
              -
              (hostvars['localhost'].c1_2_snapshot_created_epoch | int)
            )
            | abs
            <=
            hostvars['localhost'].c1_2_snapshot_receipt_delay_seconds
          - c1_2_etcdutl_binary.stat.exists | default(false)
          - c1_2_etcdutl_binary.stat.executable | default(false)
        fail_msg: >-
          Hard stop: the receipt's actual local snapshot is unavailable,
          empty, stale, checksum-mismatched, timestamp-unbound, or cannot be
          inspected by the bundled etcdutl.

    - name: Inspect the live etcd cluster ID bound by the receipt
      ansible.builtin.command:
        argv:
          - "{{ c1_2_snapshot_etcdctl }}"
          - "--cacert={{ c1_2_snapshot_etcd_ca }}"
          - "--cert={{ c1_2_snapshot_etcd_cert }}"
          - "--key={{ c1_2_snapshot_etcd_key }}"
          - "--endpoints=https://127.0.0.1:2379"
          - endpoint
          - status
          - --write-out=json
      environment:
        ETCDCTL_API: "3"
      register: c1_2_snapshot_live_etcd_status
      changed_when: false

    - name: Reject a receipt from another etcd cluster
      ansible.builtin.assert:
        that:
          - >-
            (
              c1_2_snapshot_live_etcd_status.stdout
              | from_json
              | first
            ).Status.header.cluster_id | string
            == hostvars['localhost'].c1_2_snapshot_receipt.cluster_id | string
        fail_msg: >-
          Hard stop: the snapshot receipt cluster ID differs from the live
          source cluster.

    - name: Validate the actual snapshot with etcdutl
      ansible.builtin.command:
        argv:
          - /var/lib/rancher/rke2/bin/etcdutl
          - snapshot
          - status
          - "{{ hostvars['localhost'].c1_2_snapshot_receipt.snapshot_path }}"
          - --write-out=json
      register: c1_2_actual_snapshot_status_output
      changed_when: false

    - name: Parse the actual etcdutl snapshot status
      ansible.builtin.set_fact:
        c1_2_actual_snapshot_status_raw: >-
          {{ c1_2_actual_snapshot_status_output.stdout | from_json }}

    - name: Normalize the actual etcdutl snapshot status
      ansible.builtin.set_fact:
        c1_2_actual_snapshot_status: >-
          {{
            c1_2_actual_snapshot_status_raw
            if c1_2_actual_snapshot_status_raw is mapping
            else (c1_2_actual_snapshot_status_raw | first)
          }}

    - name: Reject etcdutl status that differs from the receipt
      ansible.builtin.assert:
        that:
          - c1_2_actual_snapshot_status is mapping
          - >-
            c1_2_actual_snapshot_status.hash | string
            == hostvars['localhost'].c1_2_snapshot_receipt.etcdutl.hash | string
          - >-
            c1_2_actual_snapshot_status.revision | int
            == hostvars['localhost'].c1_2_snapshot_receipt.etcdutl.revision | int
          - >-
            c1_2_actual_snapshot_status.totalKey | int
            == hostvars['localhost'].c1_2_snapshot_receipt.etcdutl.total_keys | int
        fail_msg: >-
          Hard stop: etcdutl validated a snapshot whose hash, revision, or key
          count differs from the structured pre-rung receipt.

- name: Prove the current HA control plane is healthy and classify etcd members
  hosts: rke2_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  vars:
    c1_2_kubeconfig_path: /etc/rancher/rke2/rke2.yaml
    c1_2_server_token_path: /var/lib/rancher/rke2/server/token
    c1_2_etcdctl_path: /var/lib/rancher/rke2/bin/etcdctl
    c1_2_etcd_ca: /var/lib/rancher/rke2/server/tls/etcd/server-ca.crt
    c1_2_etcd_cert: /var/lib/rancher/rke2/server/tls/etcd/server-client.crt
    c1_2_etcd_key: /var/lib/rancher/rke2/server/tls/etcd/server-client.key
  tasks:
    - name: Inspect the exact live RKE2 server token
      ansible.builtin.stat:
        path: "{{ c1_2_server_token_path }}"
        follow: true
      register: c1_2_upgrade_server_token_stat

    - name: Require a regular non-empty live server token
      ansible.builtin.assert:
        that:
          - c1_2_upgrade_server_token_stat.stat.exists | default(false)
          - c1_2_upgrade_server_token_stat.stat.isreg | default(false)
          - c1_2_upgrade_server_token_stat.stat.size | default(0) | int > 0
        fail_msg: >-
          Hard stop: {{ inventory_hostname }} lacks a non-empty
          {{ c1_2_server_token_path }}. No node may be cordoned or restarted.

    - name: Read the exact live RKE2 server token
      ansible.builtin.slurp:
        src: "{{ c1_2_server_token_path }}"
      register: c1_2_upgrade_server_token_blob
      no_log: true

    - name: Normalize only the live token file terminator
      ansible.builtin.set_fact:
        c1_2_upgrade_server_token: >-
          {{
            c1_2_upgrade_server_token_blob.content
            | b64decode
            | regex_replace('[\r\n]+$', '')
          }}
        c1_2_upgrade_vault_token: >-
          {{ hostvars['localhost'].c1_2_upgrade_protected_token }}
        c1_2_upgrade_inventory_token: "{{ rke2_cluster_token | default('') }}"
      no_log: true

    - name: Reject a padded, placeholder, or mismatched Vault token
      ansible.builtin.assert:
        that:
          - c1_2_upgrade_server_token | length > 0
          - c1_2_upgrade_server_token == (c1_2_upgrade_server_token | trim)
          - c1_2_upgrade_vault_token | length > 0
          - c1_2_upgrade_vault_token == (c1_2_upgrade_vault_token | trim)
          - c1_2_upgrade_inventory_token == c1_2_upgrade_vault_token
          - c1_2_upgrade_server_token == c1_2_upgrade_vault_token
          - "'REPLACE' not in (c1_2_upgrade_vault_token | upper)"
          - "'CHANGEME' not in (c1_2_upgrade_vault_token | upper)"
          - "'PLACEHOLDER' not in (c1_2_upgrade_vault_token | upper)"
        fail_msg: >-
          Hard stop: {{ inventory_hostname }} does not contain the exact
          whitespace-free Vault token. No node may be cordoned or restarted.
        quiet: true
      no_log: true

    - name: Inspect the installed RKE2 version
      ansible.builtin.command:
        argv:
          - /usr/local/bin/rke2
          - --version
      register: c1_2_rke2_version_output
      changed_when: false

    - name: Record the exact installed RKE2 pin
      ansible.builtin.set_fact:
        c1_2_installed_rke2_version: >-
          {{
            c1_2_rke2_version_output.stdout
            | regex_search('v[0-9]+\.[0-9]+\.[0-9]+\+rke2r[0-9]+')
            | default('')
          }}

    - name: Reject inconsistent or unexpected installed versions
      ansible.builtin.assert:
        that:
          - c1_2_installed_rke2_version | length > 0
          - >-
            c1_2_installed_rke2_version in
            [
              hostvars['localhost'].c1_2_upgrade_from_version,
              hostvars['localhost'].c1_2_upgrade_to_version
            ]
        fail_msg: >-
          Hard stop: {{ inventory_hostname }} runs
          {{ c1_2_installed_rke2_version | default('an unparseable version') }}.
          A resumable rung may contain only the declared source and target.

    - name: Inspect the pinned RKE2 installer
      ansible.builtin.stat:
        path: /usr/local/sbin/rke2-install.sh
      register: c1_2_rke2_installer

    - name: Reject a missing or non-executable installer before cordon
      ansible.builtin.assert:
        that:
          - c1_2_rke2_installer.stat.exists | default(false)
          - c1_2_rke2_installer.stat.isreg | default(false)
          - c1_2_rke2_installer.stat.executable | default(false)
        fail_msg: >-
          Hard stop: /usr/local/sbin/rke2-install.sh is unavailable or not
          executable on {{ inventory_hostname }}.

    - name: Verify the local admin kubeconfig uses the control-plane VIP
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - "--kubeconfig={{ c1_2_kubeconfig_path }}"
          - config
          - view
          - --minify
          - -o
          - "jsonpath={.clusters[0].cluster.server}"
      register: c1_2_kubeconfig_endpoint
      changed_when: false

    - name: Reject a per-node or non-VIP maintenance endpoint
      ansible.builtin.assert:
        that:
          - >-
            c1_2_kubeconfig_endpoint.stdout | trim
            == hostvars['localhost'].c1_2_control_plane_endpoint
        fail_msg: >-
          Hard stop: {{ inventory_hostname }} kubeconfig points to
          {{ c1_2_kubeconfig_endpoint.stdout | trim }}, not the HA endpoint
          {{ hostvars['localhost'].c1_2_control_plane_endpoint }}.

    - name: Prove VIP-backed API readiness
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - "--kubeconfig={{ c1_2_kubeconfig_path }}"
          - get
          - --raw=/readyz
      register: c1_2_api_ready
      changed_when: false

    - name: Reject an unready VIP-backed API
      ansible.builtin.assert:
        that:
          - c1_2_api_ready.stdout | trim == 'ok'
        fail_msg: "Hard stop: the VIP-backed Kubernetes /readyz check failed."

    - name: Prove the VIP-backed RKE2 registration endpoint
      ansible.builtin.wait_for:
        host: "{{ control_plane_vip_address }}"
        port: 9345
        connect_timeout: 3
        timeout: 10
      changed_when: false

    - name: Prove all etcd endpoints are healthy
      ansible.builtin.command:
        argv:
          - "{{ c1_2_etcdctl_path }}"
          - "--cacert={{ c1_2_etcd_ca }}"
          - "--cert={{ c1_2_etcd_cert }}"
          - "--key={{ c1_2_etcd_key }}"
          - "--endpoints=https://127.0.0.1:2379"
          - endpoint
          - health
          - --cluster
      environment:
        ETCDCTL_API: "3"
      changed_when: false

    - name: Inspect exact pre-rung etcd membership
      ansible.builtin.command:
        argv:
          - "{{ c1_2_etcdctl_path }}"
          - "--cacert={{ c1_2_etcd_ca }}"
          - "--cert={{ c1_2_etcd_cert }}"
          - "--key={{ c1_2_etcd_key }}"
          - "--endpoints=https://127.0.0.1:2379"
          - member
          - list
          - --write-out=json
      environment:
        ETCDCTL_API: "3"
      register: c1_2_etcd_members_before_rung
      changed_when: false

    - name: Require exact declared etcd membership before the rung
      ansible.builtin.assert:
        that:
          - >-
            (
              (c1_2_etcd_members_before_rung.stdout | from_json).members
              | map(attribute='name')
              | list
              | sort
            )
            == groups['rke2_servers'] | list | sort
        fail_msg: >-
          Hard stop: live etcd member names do not exactly match the declared
          RKE2 server inventory before the rung.

    - name: Inspect the local etcd member and current leader
      ansible.builtin.command:
        argv:
          - "{{ c1_2_etcdctl_path }}"
          - "--cacert={{ c1_2_etcd_ca }}"
          - "--cert={{ c1_2_etcd_cert }}"
          - "--key={{ c1_2_etcd_key }}"
          - "--endpoints=https://127.0.0.1:2379"
          - endpoint
          - status
          - --write-out=json
      environment:
        ETCDCTL_API: "3"
      register: c1_2_etcd_status_output
      changed_when: false

    - name: Record whether this host owns etcd leadership
      ansible.builtin.set_fact:
        c1_2_is_etcd_leader: >-
          {{
            (c1_2_etcd_status_output.stdout | from_json | first).Status.header.member_id
            ==
            (c1_2_etcd_status_output.stdout | from_json | first).Status.leader
          }}

    - name: Build explicit follower and leader upgrade groups
      ansible.builtin.group_by:
        key: >-
          c1_2_rke2_{{ c1_2_is_etcd_leader | ternary('leader', 'followers') }}

    - name: Inspect CloudNativePG health through the VIP
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - "--kubeconfig={{ c1_2_kubeconfig_path }}"
          - -n
          - vhhealth-platform
          - get
          - cluster.postgresql.cnpg.io/vhhealth-pg
          - -o
          - json
      register: c1_2_cnpg_output
      changed_when: false

    - name: Record CloudNativePG health
      ansible.builtin.set_fact:
        c1_2_cnpg: "{{ c1_2_cnpg_output.stdout | from_json }}"

    - name: Reject degraded CloudNativePG
      ansible.builtin.assert:
        that:
          - c1_2_cnpg.status.currentPrimary | default('') | length > 0
          - c1_2_cnpg.spec.instances | int == 3
          - >-
            c1_2_cnpg.status.readyInstances | default(0) | int
            == c1_2_cnpg.spec.instances | int
        fail_msg: >-
          Hard stop: CloudNativePG has no primary or not all declared instances
          are ready.

    - name: Prove pre-rung synchronous standby protection
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - "--kubeconfig={{ c1_2_kubeconfig_path }}"
          - -n
          - vhhealth-platform
          - exec
          - "{{ c1_2_cnpg.status.currentPrimary }}"
          - --
          - psql
          - -U
          - postgres
          - -d
          - postgres
          - -Atc
          - >-
            SELECT count(*) FROM pg_stat_replication
            WHERE state = 'streaming'
            AND sync_state IN ('sync', 'quorum');
      register: c1_2_pre_rung_sync_standbys
      changed_when: false

    - name: Reject a rung without a streaming synchronous standby
      ansible.builtin.assert:
        that:
          - c1_2_pre_rung_sync_standbys.stdout | trim | int >= 1
        fail_msg: >-
          Hard stop: CloudNativePG has no streaming synchronous standby
          before the first server mutation.

    - name: Find non-Bound persistent volume claims
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - "--kubeconfig={{ c1_2_kubeconfig_path }}"
          - get
          - pvc
          - --all-namespaces
          - -o
          - >-
            jsonpath={range .items[?(@.status.phase!="Bound")]}{.metadata.namespace}{"/"}{.metadata.name}{"="}{.status.phase}{"\n"}{end}
      register: c1_2_unbound_pvcs
      changed_when: false

    - name: Find unready nodes or nodes under disk pressure
      ansible.builtin.shell: |
        set -o pipefail
        /usr/local/bin/kubectl --kubeconfig={{ c1_2_kubeconfig_path | quote }} \
          get nodes -o json |
          /usr/bin/jq -r '
            .items[]
            | select(
                ([.status.conditions[]
                  | select(.type == "Ready" and .status == "True")] | length) != 1
                or
                any(.status.conditions[];
                    (.type == "DiskPressure"
                     or .type == "MemoryPressure"
                     or .type == "PIDPressure")
                    and .status == "True")
              )
            | .metadata.name
          '
      args:
        executable: /bin/bash
      register: c1_2_unhealthy_nodes
      changed_when: false

    - name: Reject degraded Kubernetes or PVC storage
      ansible.builtin.assert:
        that:
          - c1_2_unbound_pvcs.stdout | trim | length == 0
          - c1_2_unhealthy_nodes.stdout | trim | length == 0
        fail_msg: >-
          Hard stop: unready/disk-pressure nodes={{ c1_2_unhealthy_nodes.stdout
          | trim | default('none') }}; non-Bound PVCs={{
          c1_2_unbound_pvcs.stdout | trim | default('none') }}.

    - name: Detect an installed Longhorn API
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - "--kubeconfig={{ c1_2_kubeconfig_path }}"
          - get
          - crd
          - volumes.longhorn.io
          - -o
          - name
      register: c1_2_longhorn_crd
      changed_when: false
      failed_when: false

    - name: Reject every pre-rung Longhorn detection error except exact absence
      ansible.builtin.assert:
        that:
          - >-
            c1_2_longhorn_crd.rc == 0
            or
            (
              c1_2_longhorn_crd.rc == 1
              and
              'Error from server (NotFound)' in c1_2_longhorn_crd.stderr
              and 'volumes.longhorn.io' in c1_2_longhorn_crd.stderr
              and 'not found' in c1_2_longhorn_crd.stderr
            )
        fail_msg: >-
          Hard stop: Longhorn detection returned an authentication, transport,
          authorization, or unexpected resource error.

    - name: Read the pre-rung Longhorn StorageClass
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - "--kubeconfig={{ c1_2_kubeconfig_path }}"
          - get
          - storageclass
          - longhorn
          - -o
          - json
      register: c1_2_longhorn_storageclass
      changed_when: false
      when: c1_2_longhorn_crd.rc == 0

    - name: Find degraded Longhorn volumes when Longhorn is installed
      ansible.builtin.shell: |
        set -euo pipefail
        /usr/local/bin/kubectl \
          --kubeconfig={{ c1_2_kubeconfig_path | quote }} \
          -n longhorn-system get volumes.longhorn.io -o json |
          /usr/bin/jq -r '
            .items[]
            | select(
                .status.robustness != "healthy"
                or (.spec.numberOfReplicas // 0) != 3
              )
            | .metadata.name
              + "=robustness:" + (.status.robustness // "missing")
              + ",replicas:" + ((.spec.numberOfReplicas // 0) | tostring)
          '
      args:
        executable: /bin/bash
      register: c1_2_degraded_longhorn_volumes
      changed_when: false
      when: c1_2_longhorn_crd.rc == 0

    - name: Find unhealthy pre-rung Longhorn nodes
      ansible.builtin.shell: |
        set -o pipefail
        /usr/local/bin/kubectl \
          --kubeconfig={{ c1_2_kubeconfig_path | quote }} \
          -n longhorn-system get nodes.longhorn.io -o json |
          /usr/bin/jq -r '
            if (.items | length) < 3 then
              "node-count=" + ((.items | length) | tostring)
            else
              .items[]
              | select(
                  ([.status.conditions[]?
                    | select(
                        .type == "Ready" and .status == "True"
                      )] | length) != 1
                  or
                  ([.status.conditions[]?
                    | select(
                        .type == "Schedulable" and .status == "True"
                      )] | length) != 1
                )
              | .metadata.name
            end
          '
      args:
        executable: /bin/bash
      register: c1_2_unhealthy_longhorn_nodes
      changed_when: false
      when: c1_2_longhorn_crd.rc == 0

    - name: Reject degraded or misconfigured Longhorn when it is installed
      ansible.builtin.assert:
        that:
          - >-
            (c1_2_longhorn_storageclass.stdout | from_json).provisioner
            == 'driver.longhorn.io'
          - >-
            (
              (
                c1_2_longhorn_storageclass.stdout
                | from_json
              ).parameters.numberOfReplicas
              | default('')
              | string
            ) == '3'
          - c1_2_degraded_longhorn_volumes.stdout | trim | length == 0
          - c1_2_unhealthy_longhorn_nodes.stdout | trim | length == 0
        fail_msg: >-
          Hard stop: the pre-rung Longhorn StorageClass, volumes, or nodes are
          outside the qualified three-copy healthy/schedulable contract.
      when: c1_2_longhorn_crd.rc == 0

- name: Validate every RKE2 agent before any server mutation
  hosts: rke2_agents
  become: true
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  vars:
    c1_2_agent_token_path: /etc/rancher/rke2/cluster-token
  tasks:
    - name: Inspect the exact live RKE2 agent token
      ansible.builtin.stat:
        path: "{{ c1_2_agent_token_path }}"
        follow: true
      register: c1_2_upgrade_agent_token_stat

    - name: Require a regular non-empty live agent token
      ansible.builtin.assert:
        that:
          - c1_2_upgrade_agent_token_stat.stat.exists | default(false)
          - c1_2_upgrade_agent_token_stat.stat.isreg | default(false)
          - c1_2_upgrade_agent_token_stat.stat.size | default(0) | int > 0
        fail_msg: >-
          Hard stop: {{ inventory_hostname }} lacks a non-empty
          {{ c1_2_agent_token_path }}. No server may be cordoned or restarted.

    - name: Read the exact live RKE2 agent token
      ansible.builtin.slurp:
        src: "{{ c1_2_agent_token_path }}"
      register: c1_2_upgrade_agent_token_blob
      no_log: true

    - name: Normalize only the live agent token file terminator
      ansible.builtin.set_fact:
        c1_2_upgrade_agent_token: >-
          {{
            c1_2_upgrade_agent_token_blob.content
            | b64decode
            | regex_replace('[\r\n]+$', '')
          }}
        c1_2_upgrade_agent_vault_token: >-
          {{ hostvars['localhost'].c1_2_upgrade_protected_token }}
        c1_2_upgrade_agent_inventory_token: >-
          {{ rke2_cluster_token | default('') }}
      no_log: true

    - name: Reject a padded, placeholder, or mismatched agent token
      ansible.builtin.assert:
        that:
          - c1_2_upgrade_agent_token | length > 0
          - c1_2_upgrade_agent_token == (c1_2_upgrade_agent_token | trim)
          - c1_2_upgrade_agent_vault_token | length > 0
          - >-
            c1_2_upgrade_agent_vault_token
            == (c1_2_upgrade_agent_vault_token | trim)
          - >-
            c1_2_upgrade_agent_inventory_token
            == c1_2_upgrade_agent_vault_token
          - c1_2_upgrade_agent_token == c1_2_upgrade_agent_vault_token
          - "'REPLACE' not in (c1_2_upgrade_agent_vault_token | upper)"
          - "'CHANGEME' not in (c1_2_upgrade_agent_vault_token | upper)"
          - "'PLACEHOLDER' not in (c1_2_upgrade_agent_vault_token | upper)"
        fail_msg: >-
          Hard stop: {{ inventory_hostname }} does not contain the exact
          whitespace-free Vault token. No server may be cordoned or restarted.
        quiet: true
      no_log: true

    - name: Inspect the installed agent version
      ansible.builtin.command:
        argv:
          - /usr/local/bin/rke2
          - --version
      register: c1_2_agent_preflight_version_output
      changed_when: false

    - name: Record the exact installed agent pin
      ansible.builtin.set_fact:
        c1_2_installed_agent_version: >-
          {{
            c1_2_agent_preflight_version_output.stdout
            | regex_search('v[0-9]+\.[0-9]+\.[0-9]+\+rke2r[0-9]+')
            | default('')
          }}

    - name: Inspect the pinned RKE2 installer
      ansible.builtin.stat:
        path: /usr/local/sbin/rke2-install.sh
      register: c1_2_agent_installer

    - name: Reject an unexpected agent or missing installer
      ansible.builtin.assert:
        that:
          - >-
            c1_2_installed_agent_version in
            [
              hostvars['localhost'].c1_2_upgrade_from_version,
              hostvars['localhost'].c1_2_upgrade_to_version
            ]
          - c1_2_agent_installer.stat.exists | default(false)
          - c1_2_agent_installer.stat.isreg | default(false)
          - c1_2_agent_installer.stat.executable | default(false)
        fail_msg: >-
          Hard stop: {{ inventory_hostname }} has an unexpected RKE2 version
          or lacks an executable pinned installer.

- name: Validate the etcd upgrade order
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Require one leader and at least two followers
      ansible.builtin.assert:
        that:
          - groups['rke2_servers'] | length >= 3
          - groups['c1_2_rke2_leader'] | default([]) | length == 1
          - >-
            groups['c1_2_rke2_followers'] | default([]) | length
            == (groups['rke2_servers'] | length) - 1
        fail_msg: >-
          Hard stop: the production upgrade requires a three-or-more-member
          control plane with exactly one detectable etcd leader.

- name: Upgrade etcd followers one at a time
  hosts: c1_2_rke2_followers
  become: true
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  max_fail_percentage: 0
  vars:
    c1_2_expected_leader: false
    c1_2_kubeconfig_path: /etc/rancher/rke2/rke2.yaml
    c1_2_etcdctl_path: /var/lib/rancher/rke2/bin/etcdctl
    c1_2_etcd_ca: /var/lib/rancher/rke2/server/tls/etcd/server-ca.crt
    c1_2_etcd_cert: /var/lib/rancher/rke2/server/tls/etcd/server-client.crt
    c1_2_etcd_key: /var/lib/rancher/rke2/server/tls/etcd/server-client.key
  tasks: &c1_2_server_upgrade_tasks
    - name: Record the deterministic server order for delegate selection
      ansible.builtin.set_fact:
        c1_2_ordered_server_hosts: "{{ groups['rke2_servers'] | sort }}"

    - name: Select an independent maintenance server for this target
      ansible.builtin.set_fact:
        c1_2_target_maintenance_host: >-
          {{
            (
              hostvars['localhost'].c1_2_upgrade_maintenance_host
              if
              hostvars['localhost'].c1_2_upgrade_maintenance_host
              != inventory_hostname
              else
              c1_2_ordered_server_hosts[
                (
                  c1_2_ordered_server_hosts.index(inventory_hostname) + 1
                )
                %
                (c1_2_ordered_server_hosts | length)
              ]
            )
          }}

    - name: Reject a self-targeting or non-server maintenance delegate
      ansible.builtin.assert:
        that:
          - c1_2_target_maintenance_host in groups['rke2_servers']
          - c1_2_target_maintenance_host != inventory_hostname
        fail_msg: >-
          Hard stop: {{ inventory_hostname }} has no independent RKE2 server
          available to own its cordon, drain, health gates, and rescue fence.

    - name: Verify the independent delegate uses the VIP-backed kubeconfig
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - "--kubeconfig={{ c1_2_kubeconfig_path }}"
          - config
          - view
          - --minify
          - -o
          - "jsonpath={.clusters[0].cluster.server}"
      delegate_to: "{{ c1_2_target_maintenance_host }}"
      register: c1_2_target_delegate_endpoint
      changed_when: false

    - name: Verify the independent delegate is a healthy schedulable node
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - "--kubeconfig={{ c1_2_kubeconfig_path }}"
          - get
          - node
          - "{{ c1_2_target_maintenance_host }}"
          - -o
          - json
      delegate_to: "{{ c1_2_target_maintenance_host }}"
      register: c1_2_target_delegate_node
      changed_when: false

    - name: Reject an unhealthy independent maintenance delegate
      ansible.builtin.assert:
        that:
          - >-
            c1_2_target_delegate_endpoint.stdout | trim
            == hostvars['localhost'].c1_2_control_plane_endpoint
          - >-
            not (
              (c1_2_target_delegate_node.stdout | from_json)
              .spec.unschedulable
              | default(false)
              | bool
            )
          - >-
            (
              (c1_2_target_delegate_node.stdout | from_json).status.conditions
              | selectattr('type', 'equalto', 'Ready')
              | selectattr('status', 'equalto', 'True')
              | list
              | length
            ) == 1
          - >-
            (
              (c1_2_target_delegate_node.stdout | from_json).status.conditions
              | selectattr(
                  'type',
                  'in',
                  ['DiskPressure', 'MemoryPressure', 'PIDPressure']
                )
              | selectattr('status', 'equalto', 'True')
              | list
              | length
            ) == 0
        fail_msg: >-
          Hard stop: the independent maintenance server
          {{ c1_2_target_maintenance_host }} is not Ready, schedulable,
          pressure-free, and VIP-backed.

    - name: Prove protected RKE2 configuration path integrity
      block: &c1_2_rke2_config_integrity_gate
        - name: Inspect the filesystem root without following links
          ansible.builtin.stat:
            path: /
            follow: false
          register: c1_2_root_directory_stat

        - name: Inspect the etc ancestor without following links
          ansible.builtin.stat:
            path: /etc
            follow: false
          register: c1_2_etc_directory_stat

        - name: Inspect the Rancher ancestor without following links
          ansible.builtin.stat:
            path: /etc/rancher
            follow: false
          register: c1_2_rancher_directory_stat

        - name: Inspect the RKE2 configuration directory without following links
          ansible.builtin.stat:
            path: /etc/rancher/rke2
            follow: false
          register: c1_2_config_directory_stat

        - name: Inspect the main RKE2 configuration without following links
          ansible.builtin.stat:
            path: /etc/rancher/rke2/config.yaml
            follow: false
          register: c1_2_main_config_stat

        - name: Inspect the optional RKE2 drop-in directory without following links
          ansible.builtin.stat:
            path: /etc/rancher/rke2/config.yaml.d
            follow: false
          register: c1_2_dropin_directory_stat

        - name: Reject unsafe RKE2 configuration paths
          ansible.builtin.assert:
            that:
              - c1_2_root_directory_stat.stat.exists | default(false)
              - c1_2_root_directory_stat.stat.isdir | default(false)
              - not (c1_2_root_directory_stat.stat.islnk | default(false))
              - c1_2_root_directory_stat.stat.uid | default(-1) | int == 0
              - c1_2_root_directory_stat.stat.gid | default(-1) | int == 0
              - >-
                c1_2_root_directory_stat.stat.mode | default('')
                is match('^[0-7][0-7][0145][0145]$')
              - c1_2_etc_directory_stat.stat.exists | default(false)
              - c1_2_etc_directory_stat.stat.isdir | default(false)
              - not (c1_2_etc_directory_stat.stat.islnk | default(false))
              - c1_2_etc_directory_stat.stat.uid | default(-1) | int == 0
              - c1_2_etc_directory_stat.stat.gid | default(-1) | int == 0
              - >-
                c1_2_etc_directory_stat.stat.mode | default('')
                is match('^[0-7][0-7][0145][0145]$')
              - c1_2_rancher_directory_stat.stat.exists | default(false)
              - c1_2_rancher_directory_stat.stat.isdir | default(false)
              - not (c1_2_rancher_directory_stat.stat.islnk | default(false))
              - c1_2_rancher_directory_stat.stat.uid | default(-1) | int == 0
              - c1_2_rancher_directory_stat.stat.gid | default(-1) | int == 0
              - >-
                c1_2_rancher_directory_stat.stat.mode | default('')
                is match('^[0-7][0-7][0145][0145]$')
              - c1_2_config_directory_stat.stat.exists | default(false)
              - c1_2_config_directory_stat.stat.isdir | default(false)
              - not (c1_2_config_directory_stat.stat.islnk | default(false))
              - c1_2_config_directory_stat.stat.uid | default(-1) | int == 0
              - c1_2_config_directory_stat.stat.gid | default(-1) | int == 0
              - c1_2_config_directory_stat.stat.mode | default('') == '0750'
              - c1_2_main_config_stat.stat.exists | default(false)
              - c1_2_main_config_stat.stat.isreg | default(false)
              - not (c1_2_main_config_stat.stat.islnk | default(false))
              - c1_2_main_config_stat.stat.uid | default(-1) | int == 0
              - c1_2_main_config_stat.stat.gid | default(-1) | int == 0
              - c1_2_main_config_stat.stat.mode | default('') == '0640'
              - >-
                not (
                  c1_2_dropin_directory_stat.stat.exists | default(false)
                )
                or
                (
                  c1_2_dropin_directory_stat.stat.isdir | default(false)
                  and not (
                    c1_2_dropin_directory_stat.stat.islnk | default(false)
                  )
                  and
                  c1_2_dropin_directory_stat.stat.uid | default(-1) | int == 0
                  and
                  c1_2_dropin_directory_stat.stat.gid | default(-1) | int == 0
                  and
                  c1_2_dropin_directory_stat.stat.mode | default('') == '0750'
                )
            fail_msg: >-
              Hard stop: /, /etc, and /etc/rancher must be root-owned
              non-symlink directories without group/world write;
              /etc/rancher/rke2 must be a root-owned non-symlink 0750
              directory; config.yaml must be a root-owned non-symlink 0640
              regular file; and config.yaml.d must be absent or the same
              protected directory type. No reconciliation or restart is safe.

        - name: Find every case-insensitive loaded RKE2 YAML fragment
          ansible.builtin.find:
            paths: /etc/rancher/rke2/config.yaml.d
            patterns: '(?is)^.*\.ya?ml\Z'
            use_regex: true
            file_type: any
            recurse: false
            hidden: true
            follow: false
          register: c1_2_integrity_config_fragments
          when: c1_2_dropin_directory_stat.stat.exists | default(false)

        - name: Reject unsafe loaded RKE2 YAML fragments
          ansible.builtin.assert:
            that:
              - item.isreg | default(false)
              - not (item.islnk | default(false))
              - item.uid | default(-1) | int == 0
              - item.gid | default(-1) | int == 0
              - item.mode | default('') in ['0600', '0640']
            fail_msg: >-
              Hard stop: every hidden or visible case-insensitive YAML/YML
              drop-in RKE2 can load must be a root-owned non-symlink regular
              file with canonical 0640 or stricter secret-file 0600 mode.
          loop: "{{ c1_2_integrity_config_fragments.files | default([]) }}"
          loop_control:
            label: "{{ item.path | to_json }}"

    - name: Reject alternate RKE2 server service configuration inputs
      ansible.builtin.shell:
        cmd: &c1_2_service_input_gate |
          set -euo pipefail
          unit={{ c1_2_rke2_service_unit | quote }}
          unit_base="${unit%.service}"
          mode="${unit_base#rke2-}"
          expected_fragment="/usr/local/lib/systemd/system/${unit}"

          fragment=$(
          /usr/bin/systemctl show "$unit" \
            --property=FragmentPath --value
          )
          if [[ "$fragment" != "$expected_fragment" ||
              ! -f "$fragment" || -L "$fragment" ]]; then
          printf 'unexpected RKE2 unit fragment: %s\n' "$fragment" >&2
          exit 64
          fi

          unit_version=$(
          /usr/local/bin/rke2 --version |
            /usr/bin/sed -nE \
              's/^rke2 version (v[0-9]+\.[0-9]+\.[0-9]+\+rke2r[0-9]+)([[:space:]].*)?$/\1/p' |
            /usr/bin/head -n 1
          )
          case "${unit_version}:${mode}" in
          v1.31.4+rke2r1:server|v1.31.14+rke2r2:server)
            expected_fragment_sha256='caf5e4ff923c968d15494d984320b9ab4be13504fe9d37b968ca52ecd8e4ffcb'
            ;;
          v1.31.4+rke2r1:agent|v1.31.14+rke2r2:agent)
            expected_fragment_sha256='ce3962d986a360e11d175de9fa8d9ae0a55cb227f41ed576e93fcbc817d8a103'
            ;;
          v1.32.13+rke2r2:server|v1.33.13+rke2r1:server|v1.34.9+rke2r1:server)
            expected_fragment_sha256='30cb868bfbc40d69b3c3b7553493c50c17538f3a550c89ff2300d13bb66a61b1'
            ;;
          v1.32.13+rke2r2:agent|v1.33.13+rke2r1:agent|v1.34.9+rke2r1:agent)
            expected_fragment_sha256='7c574199fc688205f313c451255fffcc139b8092326de8c706d50e2d3058c608'
            ;;
          *)
            printf 'RKE2 unit version is outside the approved ladder: %s\n' \
              "$unit_version" >&2
            exit 64
            ;;
          esac
          read -r fragment_sha256 _ < <(
          /usr/bin/sha256sum "$fragment"
          )
          if [[ "$fragment_sha256" != "$expected_fragment_sha256" ]]; then
          printf 'RKE2 unit fragment hash is not stock for %s\n' \
            "$unit_version" >&2
          exit 64
          fi

          dropins=$(
          /usr/bin/systemctl show "$unit" \
            --property=DropInPaths --value
          )
          if [[ -n "$dropins" ]]; then
          printf 'RKE2 unit drop-ins are not accepted: %s\n' "$unit" >&2
          exit 64
          fi

          unit_text=$(/usr/bin/systemctl cat --no-pager "$unit")
          environment_files=$(
          printf '%s\n' "$unit_text" |
            /usr/bin/sed -nE \
              's/^[[:space:]]*EnvironmentFile[[:space:]]*=[[:space:]]*(.*[^[:space:]])[[:space:]]*$/\1/p'
          )
          expected_environment_files=$'-/etc/default/%N\n-/etc/sysconfig/%N\n-/usr/local/lib/systemd/system/%N.env'
          if [[ "$environment_files" != "$expected_environment_files" ]]; then
          printf 'unexpected RKE2 EnvironmentFile directives: %s\n' \
            "$unit" >&2
          exit 64
          fi

          exec_start=$(
          printf '%s\n' "$unit_text" |
            /usr/bin/sed -nE \
              's/^[[:space:]]*ExecStart[[:space:]]*=[[:space:]]*(.*[^[:space:]])[[:space:]]*$/\1/p'
          )
          if [[ "$exec_start" != "/usr/local/bin/rke2 ${mode}" ]]; then
          printf 'unexpected RKE2 ExecStart: %s\n' "$unit" >&2
          exit 64
          fi

          if printf '%s\n' "$unit_text" |
          /usr/bin/grep -E \
            '^[[:space:]]*(Environment|PassEnvironment|UnsetEnvironment)[[:space:]]*=' \
            >/dev/null; then
          printf 'direct RKE2 unit environment directives are forbidden: %s\n' \
            "$unit" >&2
          exit 64
          fi

          if /usr/bin/systemctl show-environment |
          /usr/bin/grep -E '^RKE2_[A-Z0-9_]*=' >/dev/null; then
          printf 'RKE2 manager-level environment overrides are forbidden\n' >&2
          exit 64
          fi

          for env_file in \
          "/etc/default/${unit_base}" \
          "/etc/sysconfig/${unit_base}" \
          "/usr/local/lib/systemd/system/${unit_base}.env"; do
          if [[ -e "$env_file" || -L "$env_file" ]]; then
            if [[ ! -f "$env_file" || -L "$env_file" ]]; then
              printf 'unsafe RKE2 environment file: %s\n' "$env_file" >&2
              exit 64
            fi
            active_env_content=$(
              /usr/bin/sed '/^[[:space:]]*#/d' "$env_file"
            )
            backslash=$(/usr/bin/printf '\134')
            if [[ "$active_env_content" == *RKE2_* ||
                  "$active_env_content" == *"$backslash"* ]]; then
              printf 'RKE2 environment override found in: %s\n' \
                "$env_file" >&2
              exit 64
            fi
          fi
          done
      args: &c1_2_service_input_gate_args
        executable: /bin/bash
      vars:
        c1_2_rke2_service_unit: rke2-server.service
      changed_when: false

    - &c1_2_find_server_configuration_fragments
      name: Find every loaded server configuration fragment
      ansible.builtin.find:
        paths: /etc/rancher/rke2/config.yaml.d
        patterns: '(?is)^.*\.ya?ml\Z'
        use_regex: true
        file_type: any
        recurse: false
        hidden: true
      register: c1_2_server_config_fragments

    - &c1_2_reject_unsafe_server_fragment_types
      name: Reject unsafe server configuration fragment file types
      ansible.builtin.assert:
        that:
          - item.isreg | default(false)
          - not (item.islnk | default(false))
        fail_msg: >-
          Hard stop: RKE2 loads this YAML fragment name, but it is a symlink
          or non-regular entry and cannot be reconciled safely.
        quiet: true
      loop: "{{ c1_2_server_config_fragments.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Remove every active server registry override
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: >-
          (?m)^[ \t]*(?:"system-default-registry\+?"|'system-default-registry\+?'|system-default-registry\+?)[ \t]*:.*(?:\n|$)
        replace: ''
        backup: false
      loop: >-
        {{
          ['/etc/rancher/rke2/config.yaml']
          +
          (
            c1_2_server_config_fragments.files
            | map(attribute='path')
            | list
          )
        }}
      loop_control:
        label: "{{ item }}"

    - name: Install the one canonical Prime server registry override
      ansible.builtin.lineinfile:
        path: /etc/rancher/rke2/config.yaml
        line: 'system-default-registry: "registry.rancher.com"'
        state: present
        insertafter: EOF
        backup: false
      when:
        - >-
          hostvars['localhost'].c1_2_upgrade_to_version in
          ['v1.31.14+rke2r2', 'v1.32.13+rke2r2']

    - &c1_2_read_server_configuration_documents
      name: Read every reconciled server configuration document
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: >-
        {{
          ['/etc/rancher/rke2/config.yaml']
          +
          (
            c1_2_server_config_fragments.files
            | map(attribute='path')
            | list
          )
        }}
      loop_control:
        label: "{{ item }}"
      register: c1_2_server_registry_documents
      no_log: true

    - &c1_2_require_server_configuration_mappings
      name: Require loaded server configuration documents to be YAML mappings
      ansible.builtin.assert:
        that:
          - >-
            (item.content | b64decode | from_yaml) is none
            or (item.content | b64decode | from_yaml) is mapping
        fail_msg: >-
          Hard stop: an RKE2 server configuration document is not an empty
          document or YAML mapping and cannot be validated safely.
        quiet: true
      loop: "{{ c1_2_server_registry_documents.results }}"
      loop_control:
        label: "{{ item.source | default('unknown') }}"
      no_log: true

    - &c1_2_require_semantic_server_registry_state
      name: Require semantic server registry state to match the protected target
      ansible.builtin.assert:
        that:
          - >-
            c1_2_registry_keys | length
            ==
            (
              (
                item.source == '/etc/rancher/rke2/config.yaml'
                and
                hostvars['localhost'].c1_2_upgrade_to_version in
                ['v1.31.14+rke2r2', 'v1.32.13+rke2r2']
              )
              | ternary(1, 0)
            )
          - >-
            c1_2_registry_keys
            | rejectattr('key', 'equalto', 'system-default-registry')
            | list
            | length == 0
          - >-
            c1_2_registry_keys
            | rejectattr('value', 'equalto', 'registry.rancher.com')
            | list
            | length == 0
        fail_msg: >-
          Hard stop: a semantic system-default-registry key survived in a
          server drop-in, used append syntax, or disagreed with the immutable
          Prime/public target classification.
        quiet: true
      vars:
        c1_2_registry_document: >-
          {{
            (item.content | b64decode | from_yaml)
            | default({}, true)
          }}
        c1_2_registry_keys: >-
          {{
            c1_2_registry_document
            | dict2items
            | selectattr('key', 'match', '^system-default-registry\\+?$')
            | list
          }}
      loop: "{{ c1_2_server_registry_documents.results }}"
      loop_control:
        label: "{{ item.source | default('unknown') }}"
      no_log: true

    - &c1_2_count_server_registry_overrides
      name: Count active and exact server registry overrides
      ansible.builtin.shell: |
        set -euo pipefail
        files=(/etc/rancher/rke2/config.yaml)
        if [[ -d /etc/rancher/rke2/config.yaml.d ]]; then
          while IFS= read -r -d '' file; do
            if [[ -L "$file" || ! -f "$file" ]]; then
              printf 'unsafe RKE2 config fragment: %s\n' "$file" >&2
              exit 64
            fi
            files+=("$file")
          done < <(
            /usr/bin/find /etc/rancher/rke2/config.yaml.d \
              -mindepth 1 -maxdepth 1 \
              \( -iname '*.yaml' -o -iname '*.yml' \) -print0 |
              /usr/bin/sort -z
          )
        fi
        /usr/bin/awk '
            BEGIN { active = 0; exact = 0 }
            /^[[:space:]]*["'\'']?system-default-registry[+]?["'\'']?[[:space:]]*:/ {
              active += 1
              if ($0 == "system-default-registry: \"registry.rancher.com\"") {
                exact += 1
              }
            }
            END { printf "%d %d\n", active, exact }
          ' "${files[@]}"
      args:
        executable: /bin/bash
      register: c1_2_server_registry_cardinality
      changed_when: false

    - &c1_2_reject_noncanonical_server_registry
      name: Reject a non-canonical server registry state
      ansible.builtin.assert:
        that:
          - >-
            (
              hostvars['localhost'].c1_2_upgrade_to_version in
              ['v1.31.14+rke2r2', 'v1.32.13+rke2r2']
              and c1_2_server_registry_cardinality.stdout | trim == '1 1'
            )
            or
            (
              hostvars['localhost'].c1_2_upgrade_to_version not in
              ['v1.31.14+rke2r2', 'v1.32.13+rke2r2']
              and c1_2_server_registry_cardinality.stdout | trim == '0 0'
            )
        fail_msg: >-
          Hard stop: the server registry override does not have exact
          Prime/public cardinality for the immutable target classification.

    - name: Upgrade or recover this server on the declared target rung
      block:
        - name: Re-query the exact server pin immediately before recovery
          ansible.builtin.command:
            argv:
              - /usr/local/bin/rke2
              - --version
          register: c1_2_fresh_server_version_output
          changed_when: false

        - name: Require the fresh server query to remain on this rung
          ansible.builtin.assert:
            that:
              - >-
                (
                  c1_2_fresh_server_version_output.stdout
                  | regex_search(
                      'v[0-9]+\.[0-9]+\.[0-9]+\+rke2r[0-9]+'
                  )
                  | default('')
                )
                in [
                  hostvars['localhost'].c1_2_upgrade_from_version,
                  hostvars['localhost'].c1_2_upgrade_to_version
                ]
            fail_msg: >-
              Hard stop: {{ inventory_hostname }} no longer runs the declared
              source or target pin immediately before recovery.

        - name: Recheck local etcd leadership immediately before mutation
          ansible.builtin.command:
            argv:
              - "{{ c1_2_etcdctl_path }}"
              - "--cacert={{ c1_2_etcd_ca }}"
              - "--cert={{ c1_2_etcd_cert }}"
              - "--key={{ c1_2_etcd_key }}"
              - "--endpoints=https://127.0.0.1:2379"
              - endpoint
              - status
              - --write-out=json
          environment:
            ETCDCTL_API: "3"
          register: c1_2_pre_node_etcd_status
          changed_when: false

        - name: Reject a changed follower or leader order
          ansible.builtin.assert:
            that:
              - >-
                (
                  (c1_2_pre_node_etcd_status.stdout | from_json | first).Status.header.member_id
                  ==
                  (c1_2_pre_node_etcd_status.stdout | from_json | first).Status.leader
                )
                == c1_2_expected_leader
            fail_msg: >-
              Hard stop: etcd leadership changed after classification. Re-run
              the playbook so followers are still upgraded before the leader.

        - name: Cordon the server through the VIP-backed kubeconfig
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - cordon
              - "{{ inventory_hostname }}"
          delegate_to: "{{ c1_2_target_maintenance_host }}"
          register: c1_2_server_initial_cordon
          changed_when: true

        - name: Drain the server while respecting disruption budgets
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - drain
              - "{{ inventory_hostname }}"
              - --ignore-daemonsets
              - --delete-emptydir-data
              - --force
              - --grace-period=300
              - --timeout=10m
          delegate_to: "{{ c1_2_target_maintenance_host }}"
          changed_when: true

        - name: Stop this RKE2 server
          ansible.builtin.systemd:
            name: rke2-server
            state: stopped

        - name: Install the exact approved target pin
          ansible.builtin.command:
            argv:
              - /usr/local/sbin/rke2-install.sh
          environment: >-
            {{
              hostvars['localhost'].c1_2_upgrade_install_environment
              | combine({'INSTALL_RKE2_TYPE': 'server'})
            }}
          no_log: >-
            {{ hostvars['localhost'].c1_2_upgrade_artifact_url | length > 0 }}
          changed_when: true
          when:
            - >-
              c1_2_installed_rke2_version
              == hostvars['localhost'].c1_2_upgrade_from_version

        - name: Reload the installed RKE2 server unit metadata
          ansible.builtin.systemd:
            daemon_reload: true

        - name: Re-prove protected RKE2 paths immediately before server start
          block: *c1_2_rke2_config_integrity_gate

        - name: Re-prove semantic registry state immediately before server start
          block:
            - *c1_2_find_server_configuration_fragments
            - *c1_2_reject_unsafe_server_fragment_types
            - *c1_2_read_server_configuration_documents
            - *c1_2_require_server_configuration_mappings
            - *c1_2_require_semantic_server_registry_state
            - *c1_2_count_server_registry_overrides
            - *c1_2_reject_noncanonical_server_registry

        - name: Revalidate RKE2 server service inputs before start
          ansible.builtin.shell:
            cmd: *c1_2_service_input_gate
          args: *c1_2_service_input_gate_args
          vars:
            c1_2_rke2_service_unit: rke2-server.service
          changed_when: false

        - name: Start this RKE2 server
          ansible.builtin.systemd:
            name: rke2-server
            state: started

        - name: Wait for local HTTPS API readiness
          ansible.builtin.command:
            argv:
              - /usr/bin/curl
              - --fail
              - --silent
              - --show-error
              - --insecure
              - --connect-timeout
              - "2"
              - --max-time
              - "5"
              - https://127.0.0.1:6443/readyz
          register: c1_2_local_api_ready
          retries: 60
          delay: 10
          until:
            - c1_2_local_api_ready.rc == 0
            - c1_2_local_api_ready.stdout | trim == 'ok'
          changed_when: false

        - name: Wait for the local RKE2 registration listener
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: 9345
            connect_timeout: 2
            timeout: 300

        - name: Reject alternate inputs in the live RKE2 server process
          ansible.builtin.shell:
            cmd: &c1_2_live_process_input_gate |
              set -euo pipefail
              unit={{ c1_2_rke2_service_unit | quote }}
              unit_base="${unit%.service}"
              mode="${unit_base#rke2-}"

              /usr/bin/systemctl is-active --quiet "$unit"
              main_pid=$(
                /usr/bin/systemctl show "$unit" \
                  --property=MainPID --value
              )
              if [[ ! "$main_pid" =~ ^[1-9][0-9]*$ ||
                    ! -r "/proc/${main_pid}/environ" ||
                    ! -r "/proc/${main_pid}/cmdline" ||
                    ! -L "/proc/${main_pid}/exe" ]]; then
                printf 'RKE2 MainPID cannot be inspected: %s\n' "$unit" >&2
                exit 64
              fi

              live_executable=$(
                /usr/bin/readlink -f "/proc/${main_pid}/exe"
              )
              if [[ "$live_executable" != '/usr/local/bin/rke2' ]]; then
                printf 'live RKE2 executable is not canonical: %s\n' \
                  "$unit" >&2
                exit 64
              fi

              if /usr/bin/tr '\0' '\n' <"/proc/${main_pid}/environ" |
                /usr/bin/grep -E '^RKE2_[A-Z0-9_]*=' >/dev/null; then
                printf 'live RKE2 environment override found: %s\n' "$unit" >&2
                exit 64
              fi

              mapfile -d '' -t argv <"/proc/${main_pid}/cmdline"
              if [[ "${argv[0]:-}" != '/usr/local/bin/rke2' ||
                    "${argv[1]:-}" != "$mode" ||
                    -v 'argv[2]' ]]; then
                printf 'live RKE2 command line is not canonical: %s\n' \
                  "$unit" >&2
                exit 64
              fi

              verified_pid=$(
                /usr/bin/systemctl show "$unit" \
                  --property=MainPID --value
              )
              if [[ "$verified_pid" != "$main_pid" ]] ||
                ! /usr/bin/systemctl is-active --quiet "$unit"; then
                printf 'RKE2 MainPID changed during validation: %s\n' \
                  "$unit" >&2
                exit 64
              fi
          args: &c1_2_live_process_input_gate_args
            executable: /bin/bash
          vars:
            c1_2_rke2_service_unit: rke2-server.service
          changed_when: false

        - name: Rewrite the regenerated kubeconfig to the control-plane VIP
          ansible.builtin.replace:
            path: "{{ c1_2_kubeconfig_path }}"
            regexp: '(?m)^(\s*server:\s*)https://[^:\s]+:6443\s*$'
            replace: >-
              \1{{ hostvars['localhost'].c1_2_control_plane_endpoint }}
          no_log: true

        - name: Verify the rewritten kubeconfig endpoint
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - config
              - view
              - --minify
              - -o
              - "jsonpath={.clusters[0].cluster.server}"
          register: c1_2_post_restart_kubeconfig_endpoint
          changed_when: false

        - name: Reject a regenerated per-node kubeconfig endpoint
          ansible.builtin.assert:
            that:
              - >-
                c1_2_post_restart_kubeconfig_endpoint.stdout | trim
                == hostvars['localhost'].c1_2_control_plane_endpoint
            fail_msg: >-
              Hard stop: the restarted server kubeconfig is not VIP-backed.

        - name: Verify the exact installed target pin
          ansible.builtin.command:
            argv:
              - /usr/local/bin/rke2
              - --version
          register: c1_2_post_upgrade_version
          changed_when: false

        - name: Parse the exact installed target pin
          ansible.builtin.set_fact:
            c1_2_post_upgrade_version_pin: >-
              {{
                c1_2_post_upgrade_version.stdout
                | regex_search('v[0-9]+\.[0-9]+\.[0-9]+\+rke2r[0-9]+')
                | default('')
              }}

        - name: Reject a version that differs from the exact target pin
          ansible.builtin.assert:
            that:
              - >-
                c1_2_post_upgrade_version_pin
                == hostvars['localhost'].c1_2_upgrade_to_version
            fail_msg: >-
              Hard stop: {{ inventory_hostname }} did not install the exact
              requested RKE2 target.

        - name: Wait for the upgraded node to report Ready through the VIP
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - get
              - node
              - "{{ inventory_hostname }}"
              - -o
              - json
          delegate_to: "{{ c1_2_target_maintenance_host }}"
          register: c1_2_node_health_output
          retries: 30
          delay: 20
          until:
            - >-
              (
                c1_2_node_health_output.stdout | from_json
              ).status.conditions
              | selectattr('type', 'equalto', 'Ready')
              | map(attribute='status')
              | list
              | first
              | default('Unknown') == 'True'
          changed_when: false

        - name: Reject pressure on the upgraded node
          ansible.builtin.assert:
            that:
              - >-
                (
                  c1_2_node_health_output.stdout | from_json
                ).status.conditions
                | selectattr('type', 'equalto', 'DiskPressure')
                | map(attribute='status')
                | list
                | first
                | default('Unknown') == 'False'
              - >-
                (
                  c1_2_node_health_output.stdout | from_json
                ).status.conditions
                | selectattr('type', 'equalto', 'MemoryPressure')
                | map(attribute='status')
                | list
                | first
                | default('Unknown') == 'False'
              - >-
                (
                  c1_2_node_health_output.stdout | from_json
                ).status.conditions
                | selectattr('type', 'equalto', 'PIDPressure')
                | map(attribute='status')
                | list
                | first
                | default('Unknown') == 'False'
            fail_msg: >-
              Hard stop: the upgraded node is Ready but reports resource
              pressure. It remains cordoned.

        - name: Re-prove VIP-backed API readiness before uncordon
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - get
              - --raw=/readyz
          delegate_to: "{{ c1_2_target_maintenance_host }}"
          register: c1_2_post_node_api_ready
          changed_when: false

        - name: Re-prove etcd health before uncordon
          ansible.builtin.command:
            argv:
              - "{{ c1_2_etcdctl_path }}"
              - "--cacert={{ c1_2_etcd_ca }}"
              - "--cert={{ c1_2_etcd_cert }}"
              - "--key={{ c1_2_etcd_key }}"
              - "--endpoints=https://127.0.0.1:2379"
              - endpoint
              - health
              - --cluster
          environment:
            ETCDCTL_API: "3"
          delegate_to: "{{ c1_2_target_maintenance_host }}"
          changed_when: false

        - name: Recheck the CloudNativePG surviving quorum
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - -n
              - vhhealth-platform
              - get
              - cluster.postgresql.cnpg.io/vhhealth-pg
              - -o
              - json
          delegate_to: "{{ c1_2_target_maintenance_host }}"
          register: c1_2_post_node_cnpg_output
          changed_when: false

        - name: Require API readiness and a CloudNativePG primary quorum
          ansible.builtin.assert:
            that:
              - c1_2_post_node_api_ready.stdout | trim == 'ok'
              - >-
                (c1_2_post_node_cnpg_output.stdout | from_json).spec.instances
                | int == 3
              - >-
                (c1_2_post_node_cnpg_output.stdout | from_json).status.currentPrimary
                | default('') | length > 0
              - >-
                (c1_2_post_node_cnpg_output.stdout | from_json).status.readyInstances
                | default(0) | int >= 2
            fail_msg: >-
              Hard stop: the VIP/API or CloudNativePG primary quorum degraded
              after upgrading {{ inventory_hostname }}. It remains cordoned.

        - name: Find non-Bound PVCs before uncordon
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - get
              - pvc
              - --all-namespaces
              - -o
              - >-
                jsonpath={range .items[?(@.status.phase!="Bound")]}{.metadata.namespace}{"/"}{.metadata.name}{"="}{.status.phase}{"\n"}{end}
          delegate_to: "{{ c1_2_target_maintenance_host }}"
          register: c1_2_post_node_unbound_pvcs
          changed_when: false

        - name: Reject non-Bound PVCs before uncordon
          ansible.builtin.assert:
            that:
              - c1_2_post_node_unbound_pvcs.stdout | trim | length == 0
            fail_msg: >-
              Hard stop: a PVC is non-Bound after upgrading
              {{ inventory_hostname }}. The node remains cordoned.

        - name: Prove Longhorn health while this node remains cordoned
          block: &c1_2_longhorn_health_gate
            - name: Detect the exact Longhorn volume CRD
              ansible.builtin.command:
                argv:
                  - /usr/local/bin/kubectl
                  - "--kubeconfig={{ c1_2_kubeconfig_path }}"
                  - get
                  - crd
                  - volumes.longhorn.io
                  - -o
                  - name
              delegate_to: "{{ c1_2_target_maintenance_host }}"
              register: c1_2_gate_longhorn_crd
              changed_when: false
              failed_when: false

            - name: Reject every Longhorn detection error except exact absence
              ansible.builtin.assert:
                that:
                  - >-
                    c1_2_gate_longhorn_crd.rc == 0
                    or
                    (
                      c1_2_gate_longhorn_crd.rc == 1
                      and
                      'Error from server (NotFound)'
                      in c1_2_gate_longhorn_crd.stderr
                      and
                      'volumes.longhorn.io'
                      in c1_2_gate_longhorn_crd.stderr
                      and
                      'not found'
                      in c1_2_gate_longhorn_crd.stderr
                    )
                  - >-
                    c1_2_gate_longhorn_crd.rc != 0
                    or
                    c1_2_gate_longhorn_crd.stdout | trim
                    ==
                    'customresourcedefinition.apiextensions.k8s.io/'
                    ~ 'volumes.longhorn.io'
                fail_msg: >-
                  Hard stop: Longhorn detection returned an authentication,
                  transport, authorization, or unexpected resource error.

            - name: Read the required Longhorn StorageClass
              ansible.builtin.command:
                argv:
                  - /usr/local/bin/kubectl
                  - "--kubeconfig={{ c1_2_kubeconfig_path }}"
                  - get
                  - storageclass
                  - longhorn
                  - -o
                  - json
              delegate_to: "{{ c1_2_target_maintenance_host }}"
              register: c1_2_gate_longhorn_storageclass
              changed_when: false
              when: c1_2_gate_longhorn_crd.rc == 0

            - name: Find every non-healthy Longhorn volume
              ansible.builtin.shell: |
                set -euo pipefail
                /usr/local/bin/kubectl \
                  --kubeconfig={{ c1_2_kubeconfig_path | quote }} \
                  -n longhorn-system get volumes.longhorn.io -o json |
                  /usr/bin/jq -r '
                    .items[]
                    | select(
                        .status.robustness != "healthy"
                        or (.spec.numberOfReplicas // 0) != 3
                      )
                    | .metadata.name
                      + "=robustness:"
                      + (.status.robustness // "missing")
                      + ",replicas:"
                      + ((.spec.numberOfReplicas // 0) | tostring)
                  '
              args:
                executable: /bin/bash
              delegate_to: "{{ c1_2_target_maintenance_host }}"
              register: c1_2_gate_longhorn_volumes
              retries: 60
              delay: 20
              until:
                - c1_2_gate_longhorn_volumes.rc == 0
                - c1_2_gate_longhorn_volumes.stdout | trim | length == 0
              changed_when: false
              when: c1_2_gate_longhorn_crd.rc == 0

            - name: Find missing, unready, or unschedulable Longhorn nodes
              ansible.builtin.shell: |
                set -o pipefail
                /usr/local/bin/kubectl \
                  --kubeconfig={{ c1_2_kubeconfig_path | quote }} \
                  -n longhorn-system get nodes.longhorn.io -o json |
                  /usr/bin/jq -r '
                    if (.items | length) < 3 then
                      "node-count=" + ((.items | length) | tostring)
                    else
                      .items[]
                      | select(
                          ([.status.conditions[]?
                            | select(
                                .type == "Ready" and .status == "True"
                              )] | length) != 1
                          or
                          ([.status.conditions[]?
                            | select(
                                .type == "Schedulable"
                                and .status == "True"
                              )] | length) != 1
                        )
                      | .metadata.name
                    end
                  '
              args:
                executable: /bin/bash
              delegate_to: "{{ c1_2_target_maintenance_host }}"
              register: c1_2_gate_longhorn_nodes
              retries: 60
              delay: 20
              until:
                - c1_2_gate_longhorn_nodes.rc == 0
                - c1_2_gate_longhorn_nodes.stdout | trim | length == 0
              changed_when: false
              when: c1_2_gate_longhorn_crd.rc == 0

            - name: Reject an unhealthy or misconfigured Longhorn installation
              ansible.builtin.assert:
                that:
                  - >-
                    (
                      c1_2_gate_longhorn_storageclass.stdout
                      | from_json
                    ).provisioner == 'driver.longhorn.io'
                  - >-
                    (
                      (
                        c1_2_gate_longhorn_storageclass.stdout
                        | from_json
                      ).parameters.numberOfReplicas
                      | default('')
                      | string
                    ) == '3'
                  - c1_2_gate_longhorn_volumes.stdout | trim | length == 0
                  - c1_2_gate_longhorn_nodes.stdout | trim | length == 0
                fail_msg: >-
                  Hard stop: the longhorn StorageClass is not the three-copy
                  driver.longhorn.io contract, a Longhorn volume is not
                  healthy, or a Longhorn node is not Ready and Schedulable.
              when: c1_2_gate_longhorn_crd.rc == 0

        - name: Validate every independent server rescue delegate
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - get
              - --raw=/readyz
          delegate_to: "{{ item }}"
          loop: >-
            {{
              groups['rke2_servers']
              | reject('equalto', inventory_hostname)
              | list
              | sort
            }}
          loop_control:
            label: "{{ item }}"
          register: c1_2_server_rescue_delegates_ready
          changed_when: false

        - name: Require every independent server rescue delegate to be ready
          ansible.builtin.assert:
            that:
              - >-
                c1_2_server_rescue_delegates_ready.results
                | rejectattr('stdout', 'defined')
                | list
                | length == 0
              - >-
                c1_2_server_rescue_delegates_ready.results
                | map(attribute='stdout')
                | map('trim')
                | reject('equalto', 'ok')
                | list
                | length == 0
            fail_msg: >-
              Hard stop: every independent server rescue delegate must retain
              VIP-backed API readiness before uncordon.

        - name: Uncordon only after node, API, etcd, CNPG, PVC, and storage health
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - uncordon
              - "{{ inventory_hostname }}"
          delegate_to: "{{ c1_2_target_maintenance_host }}"
          register: c1_2_server_uncordon_result
          ignore_unreachable: true
          changed_when: true

        - name: Wait for full CloudNativePG convergence after uncordon
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - -n
              - vhhealth-platform
              - get
              - cluster.postgresql.cnpg.io/vhhealth-pg
              - -o
              - json
          delegate_to: "{{ c1_2_target_maintenance_host }}"
          register: c1_2_post_uncordon_cnpg
          ignore_unreachable: true
          retries: 60
          delay: 20
          until:
            - >-
              (c1_2_post_uncordon_cnpg.stdout | from_json).status.phase
              | default('') == 'Cluster in healthy state'
            - >-
              (c1_2_post_uncordon_cnpg.stdout | from_json).spec.instances
              | int == 3
            - >-
              (c1_2_post_uncordon_cnpg.stdout | from_json).status.currentPrimary
              | default('') | length > 0
            - >-
              (c1_2_post_uncordon_cnpg.stdout | from_json).status.readyInstances
              | default(0) | int
              ==
              (c1_2_post_uncordon_cnpg.stdout | from_json).spec.instances | int
            - >-
              (
                (c1_2_post_uncordon_cnpg.stdout | from_json)
                .status.instancesStatus.healthy
                | default([])
                | length
              )
              ==
              (c1_2_post_uncordon_cnpg.stdout | from_json).spec.instances | int
          changed_when: false

        - name: Prove a streaming synchronous standby after server uncordon
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - -n
              - vhhealth-platform
              - exec
              - >-
                {{
                  (
                    c1_2_post_uncordon_cnpg.stdout
                    | from_json
                  ).status.currentPrimary
                }}
              - --
              - psql
              - -U
              - postgres
              - -d
              - postgres
              - -Atc
              - >-
                SELECT count(*) FROM pg_stat_replication
                WHERE state = 'streaming'
                AND sync_state IN ('sync', 'quorum');
          delegate_to: "{{ c1_2_target_maintenance_host }}"
          register: c1_2_post_uncordon_sync_standbys
          ignore_unreachable: true
          changed_when: false

        - name: Reject loss of synchronous standby after server uncordon
          ansible.builtin.assert:
            that:
              - c1_2_post_uncordon_sync_standbys.stdout | trim | int >= 1
            fail_msg: >-
              Hard stop: CNPG converged without a streaming synchronous
              standby after server uncordon.

        - name: Re-prove Longhorn health after server uncordon
          ignore_unreachable: true
          block: *c1_2_longhorn_health_gate

        - name: Recheck PVCs after workload convergence
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - get
              - pvc
              - --all-namespaces
              - -o
              - >-
                jsonpath={range .items[?(@.status.phase!="Bound")]}{.metadata.namespace}{"/"}{.metadata.name}{"="}{.status.phase}{"\n"}{end}
          delegate_to: "{{ c1_2_target_maintenance_host }}"
          register: c1_2_post_uncordon_unbound_pvcs
          ignore_unreachable: true
          changed_when: false

        - name: Find unready, pressured, or still-cordoned nodes
          ansible.builtin.shell: |
            set -euo pipefail
            /usr/local/bin/kubectl --kubeconfig={{ c1_2_kubeconfig_path | quote }} \
              get nodes -o json |
              /usr/bin/jq -r '
                .items[]
                | select(
                    (.spec.unschedulable // false)
                    or
                    ([.status.conditions[]
                      | select(.type == "Ready" and .status == "True")]
                      | length) != 1
                    or
                    any(.status.conditions[];
                        (.type == "DiskPressure"
                         or .type == "MemoryPressure"
                         or .type == "PIDPressure")
                        and .status == "True")
                  )
                | .metadata.name
              '
          args:
            executable: /bin/bash
          delegate_to: "{{ c1_2_target_maintenance_host }}"
          register: c1_2_post_uncordon_unhealthy_nodes
          ignore_unreachable: true
          changed_when: false

        - name: Re-prove VIP API and etcd health after convergence
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - get
              - --raw=/readyz
          delegate_to: "{{ c1_2_target_maintenance_host }}"
          register: c1_2_post_convergence_api
          ignore_unreachable: true
          changed_when: false

        - name: Re-prove all etcd endpoints after convergence
          ansible.builtin.command:
            argv:
              - "{{ c1_2_etcdctl_path }}"
              - "--cacert={{ c1_2_etcd_ca }}"
              - "--cert={{ c1_2_etcd_cert }}"
              - "--key={{ c1_2_etcd_key }}"
              - "--endpoints=https://127.0.0.1:2379"
              - endpoint
              - health
              - --cluster
          environment:
            ETCDCTL_API: "3"
          delegate_to: "{{ c1_2_target_maintenance_host }}"
          register: c1_2_post_convergence_etcd
          ignore_unreachable: true
          changed_when: false

        - name: Accept this server only after full post-node convergence
          ansible.builtin.assert:
            that:
              - >-
                not (
                  c1_2_server_uncordon_result.unreachable
                  | default(false)
                  | bool
                )
              - c1_2_server_uncordon_result.rc | default(1) | int == 0
              - >-
                not (
                  c1_2_post_uncordon_cnpg.unreachable
                  | default(false)
                  | bool
                )
              - >-
                not (
                  c1_2_post_uncordon_sync_standbys.unreachable
                  | default(false)
                  | bool
                )
              - >-
                not (
                  c1_2_post_uncordon_unbound_pvcs.unreachable
                  | default(false)
                  | bool
                )
              - >-
                c1_2_post_uncordon_unbound_pvcs.stdout
                | default('') | trim | length == 0
              - >-
                not (
                  c1_2_post_uncordon_unhealthy_nodes.unreachable
                  | default(false)
                  | bool
                )
              - >-
                c1_2_post_uncordon_unhealthy_nodes.stdout
                | default('') | trim | length == 0
              - >-
                not (
                  c1_2_post_convergence_api.unreachable
                  | default(false)
                  | bool
                )
              - >-
                c1_2_post_convergence_api.stdout
                | default('') | trim == 'ok'
              - >-
                not (
                  c1_2_post_convergence_etcd.unreachable
                  | default(false)
                  | bool
                )
              - c1_2_post_convergence_etcd.rc | default(1) | int == 0
            fail_msg: >-
              Hard stop: post-uncordon node, PVC, or VIP/API convergence failed.

        - name: Record the completed target on this host
          ansible.builtin.set_fact:
            c1_2_installed_rke2_version: >-
              {{ hostvars['localhost'].c1_2_upgrade_to_version }}
      rescue:
        - name: Re-cordon the server through every independent survivor
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - cordon
              - "{{ inventory_hostname }}"
          delegate_to: "{{ item }}"
          loop: >-
            {{
              groups['rke2_servers']
              | reject('equalto', inventory_hostname)
              | list
              | sort
            }}
          loop_control:
            label: "{{ item }}"
          register: c1_2_server_rescue_cordon_attempts
          when:
            - >-
              c1_2_server_initial_cordon is defined
              or c1_2_server_uncordon_result is defined
          ignore_unreachable: true
          changed_when: false
          failed_when: false

        - name: Require at least one independent server to restore the fence
          ansible.builtin.assert:
            that:
              - >-
                c1_2_server_rescue_cordon_attempts.results
                | selectattr('rc', 'defined')
                | selectattr('rc', 'equalto', 0)
                | list
                | length >= 1
            fail_msg: >-
              Hard stop: no independent surviving server could re-cordon
              {{ inventory_hostname }} after the failed upgrade gate.
          when:
            - >-
              c1_2_server_initial_cordon is defined
              or c1_2_server_uncordon_result is defined

        - name: Stop the rung with this node fenced
          ansible.builtin.fail:
            msg: >-
              RKE2 upgrade failed on {{ inventory_hostname }}. It remained
              cordoned or was safely re-cordoned after a post-uncordon gate.
              Do not downgrade this binary in place. Stop at the last
              qualified rung and follow the snapshot-plus-datastore rollback
              procedure in docs/RKE2_1_34_QUALIFICATION.md.

- name: Upgrade the current etcd leader last
  hosts: c1_2_rke2_leader
  become: true
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  max_fail_percentage: 0
  vars:
    c1_2_expected_leader: true
    c1_2_kubeconfig_path: /etc/rancher/rke2/rke2.yaml
    c1_2_etcdctl_path: /var/lib/rancher/rke2/bin/etcdctl
    c1_2_etcd_ca: /var/lib/rancher/rke2/server/tls/etcd/server-ca.crt
    c1_2_etcd_cert: /var/lib/rancher/rke2/server/tls/etcd/server-client.crt
    c1_2_etcd_key: /var/lib/rancher/rke2/server/tls/etcd/server-client.key
  tasks: *c1_2_server_upgrade_tasks

- name: Upgrade RKE2 agents after every server
  hosts: rke2_agents
  become: true
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  max_fail_percentage: 0
  vars:
    c1_2_kubeconfig_path: /etc/rancher/rke2/rke2.yaml
    c1_2_etcdctl_path: /var/lib/rancher/rke2/bin/etcdctl
    c1_2_etcd_ca: /var/lib/rancher/rke2/server/tls/etcd/server-ca.crt
    c1_2_etcd_cert: /var/lib/rancher/rke2/server/tls/etcd/server-client.crt
    c1_2_etcd_key: /var/lib/rancher/rke2/server/tls/etcd/server-client.key
  tasks:
    - name: Inspect the installed agent version
      ansible.builtin.command:
        argv:
          - /usr/local/bin/rke2
          - --version
      register: c1_2_agent_version_output
      changed_when: false

    - name: Record the exact installed agent pin
      ansible.builtin.set_fact:
        c1_2_installed_agent_version: >-
          {{
            c1_2_agent_version_output.stdout
            | regex_search('v[0-9]+\.[0-9]+\.[0-9]+\+rke2r[0-9]+')
            | default('')
          }}

    - name: Reject an unexpected agent version
      ansible.builtin.assert:
        that:
          - >-
            c1_2_installed_agent_version in
            [
              hostvars['localhost'].c1_2_upgrade_from_version,
              hostvars['localhost'].c1_2_upgrade_to_version
            ]
        fail_msg: >-
          Hard stop: {{ inventory_hostname }} does not run the declared source
          or target RKE2 rung.

    - name: Select the independent maintenance server for this agent
      ansible.builtin.set_fact:
        c1_2_target_maintenance_host: >-
          {{ hostvars['localhost'].c1_2_upgrade_maintenance_host }}

    - name: Reject a self-targeting or non-server agent delegate
      ansible.builtin.assert:
        that:
          - c1_2_target_maintenance_host in groups['rke2_servers']
          - c1_2_target_maintenance_host != inventory_hostname
        fail_msg: >-
          Hard stop: {{ inventory_hostname }} has no independent RKE2 server
          available to own its cordon, drain, health gates, and rescue fence.

    - name: Verify the agent delegate uses the VIP-backed kubeconfig
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - "--kubeconfig={{ c1_2_kubeconfig_path }}"
          - config
          - view
          - --minify
          - -o
          - "jsonpath={.clusters[0].cluster.server}"
      delegate_to: "{{ c1_2_target_maintenance_host }}"
      register: c1_2_agent_delegate_endpoint
      changed_when: false

    - name: Verify the agent delegate is a healthy schedulable node
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - "--kubeconfig={{ c1_2_kubeconfig_path }}"
          - get
          - node
          - "{{ c1_2_target_maintenance_host }}"
          - -o
          - json
      delegate_to: "{{ c1_2_target_maintenance_host }}"
      register: c1_2_agent_delegate_node
      changed_when: false

    - name: Reject an unhealthy agent maintenance delegate
      ansible.builtin.assert:
        that:
          - >-
            c1_2_agent_delegate_endpoint.stdout | trim
            == hostvars['localhost'].c1_2_control_plane_endpoint
          - >-
            not (
              (c1_2_agent_delegate_node.stdout | from_json)
              .spec.unschedulable
              | default(false)
              | bool
            )
          - >-
            (
              (c1_2_agent_delegate_node.stdout | from_json).status.conditions
              | selectattr('type', 'equalto', 'Ready')
              | selectattr('status', 'equalto', 'True')
              | list
              | length
            ) == 1
          - >-
            (
              (c1_2_agent_delegate_node.stdout | from_json).status.conditions
              | selectattr(
                  'type',
                  'in',
                  ['DiskPressure', 'MemoryPressure', 'PIDPressure']
                )
              | selectattr('status', 'equalto', 'True')
              | list
              | length
            ) == 0
        fail_msg: >-
          Hard stop: the independent maintenance server
          {{ c1_2_target_maintenance_host }} is not Ready, schedulable,
          pressure-free, and VIP-backed.

    - name: Prove protected RKE2 agent configuration path integrity
      block: *c1_2_rke2_config_integrity_gate

    - name: Reject alternate RKE2 agent service configuration inputs
      ansible.builtin.shell:
        cmd: *c1_2_service_input_gate
      args: *c1_2_service_input_gate_args
      vars:
        c1_2_rke2_service_unit: rke2-agent.service
      changed_when: false

    - &c1_2_find_agent_configuration_fragments
      name: Find every loaded agent configuration fragment
      ansible.builtin.find:
        paths: /etc/rancher/rke2/config.yaml.d
        patterns: '(?is)^.*\.ya?ml\Z'
        use_regex: true
        file_type: any
        recurse: false
        hidden: true
      register: c1_2_agent_config_fragments

    - &c1_2_reject_unsafe_agent_fragment_types
      name: Reject unsafe agent configuration fragment file types
      ansible.builtin.assert:
        that:
          - item.isreg | default(false)
          - not (item.islnk | default(false))
        fail_msg: >-
          Hard stop: RKE2 loads this YAML fragment name, but it is a symlink
          or non-regular entry and cannot be reconciled safely.
        quiet: true
      loop: "{{ c1_2_agent_config_fragments.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Remove every active agent registry override
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: >-
          (?m)^[ \t]*(?:"system-default-registry\+?"|'system-default-registry\+?'|system-default-registry\+?)[ \t]*:.*(?:\n|$)
        replace: ''
        backup: false
      loop: >-
        {{
          ['/etc/rancher/rke2/config.yaml']
          +
          (
            c1_2_agent_config_fragments.files
            | map(attribute='path')
            | list
          )
        }}
      loop_control:
        label: "{{ item }}"

    - name: Install the one canonical Prime agent registry override
      ansible.builtin.lineinfile:
        path: /etc/rancher/rke2/config.yaml
        line: 'system-default-registry: "registry.rancher.com"'
        state: present
        insertafter: EOF
        backup: false
      when:
        - >-
          hostvars['localhost'].c1_2_upgrade_to_version in
          ['v1.31.14+rke2r2', 'v1.32.13+rke2r2']

    - &c1_2_read_agent_configuration_documents
      name: Read every reconciled agent configuration document
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: >-
        {{
          ['/etc/rancher/rke2/config.yaml']
          +
          (
            c1_2_agent_config_fragments.files
            | map(attribute='path')
            | list
          )
        }}
      loop_control:
        label: "{{ item }}"
      register: c1_2_agent_registry_documents
      no_log: true

    - &c1_2_require_agent_configuration_mappings
      name: Require loaded agent configuration documents to be YAML mappings
      ansible.builtin.assert:
        that:
          - >-
            (item.content | b64decode | from_yaml) is none
            or (item.content | b64decode | from_yaml) is mapping
        fail_msg: >-
          Hard stop: an RKE2 agent configuration document is not an empty
          document or YAML mapping and cannot be validated safely.
        quiet: true
      loop: "{{ c1_2_agent_registry_documents.results }}"
      loop_control:
        label: "{{ item.source | default('unknown') }}"
      no_log: true

    - &c1_2_require_semantic_agent_registry_state
      name: Require semantic agent registry state to match the protected target
      ansible.builtin.assert:
        that:
          - >-
            c1_2_registry_keys | length
            ==
            (
              (
                item.source == '/etc/rancher/rke2/config.yaml'
                and
                hostvars['localhost'].c1_2_upgrade_to_version in
                ['v1.31.14+rke2r2', 'v1.32.13+rke2r2']
              )
              | ternary(1, 0)
            )
          - >-
            c1_2_registry_keys
            | rejectattr('key', 'equalto', 'system-default-registry')
            | list
            | length == 0
          - >-
            c1_2_registry_keys
            | rejectattr('value', 'equalto', 'registry.rancher.com')
            | list
            | length == 0
        fail_msg: >-
          Hard stop: a semantic system-default-registry key survived in an
          agent drop-in, used append syntax, or disagreed with the immutable
          Prime/public target classification.
        quiet: true
      vars:
        c1_2_registry_document: >-
          {{
            (item.content | b64decode | from_yaml)
            | default({}, true)
          }}
        c1_2_registry_keys: >-
          {{
            c1_2_registry_document
            | dict2items
            | selectattr('key', 'match', '^system-default-registry\\+?$')
            | list
          }}
      loop: "{{ c1_2_agent_registry_documents.results }}"
      loop_control:
        label: "{{ item.source | default('unknown') }}"
      no_log: true

    - &c1_2_count_agent_registry_overrides
      name: Count active and exact agent registry overrides
      ansible.builtin.shell: |
        set -euo pipefail
        files=(/etc/rancher/rke2/config.yaml)
        if [[ -d /etc/rancher/rke2/config.yaml.d ]]; then
          while IFS= read -r -d '' file; do
            if [[ -L "$file" || ! -f "$file" ]]; then
              printf 'unsafe RKE2 config fragment: %s\n' "$file" >&2
              exit 64
            fi
            files+=("$file")
          done < <(
            /usr/bin/find /etc/rancher/rke2/config.yaml.d \
              -mindepth 1 -maxdepth 1 \
              \( -iname '*.yaml' -o -iname '*.yml' \) -print0 |
              /usr/bin/sort -z
          )
        fi
        /usr/bin/awk '
            BEGIN { active = 0; exact = 0 }
            /^[[:space:]]*["'\'']?system-default-registry[+]?["'\'']?[[:space:]]*:/ {
              active += 1
              if ($0 == "system-default-registry: \"registry.rancher.com\"") {
                exact += 1
              }
            }
            END { printf "%d %d\n", active, exact }
          ' "${files[@]}"
      args:
        executable: /bin/bash
      register: c1_2_agent_registry_cardinality
      changed_when: false

    - &c1_2_reject_noncanonical_agent_registry
      name: Reject a non-canonical agent registry state
      ansible.builtin.assert:
        that:
          - >-
            (
              hostvars['localhost'].c1_2_upgrade_to_version in
              ['v1.31.14+rke2r2', 'v1.32.13+rke2r2']
              and c1_2_agent_registry_cardinality.stdout | trim == '1 1'
            )
            or
            (
              hostvars['localhost'].c1_2_upgrade_to_version not in
              ['v1.31.14+rke2r2', 'v1.32.13+rke2r2']
              and c1_2_agent_registry_cardinality.stdout | trim == '0 0'
            )
        fail_msg: >-
          Hard stop: the agent registry override does not have exact
          Prime/public cardinality for the immutable target classification.

    - name: Upgrade or recover this agent on the declared target rung
      block:
        - name: Re-query the exact agent pin immediately before recovery
          ansible.builtin.command:
            argv:
              - /usr/local/bin/rke2
              - --version
          register: c1_2_fresh_agent_version_output
          changed_when: false

        - name: Require the fresh agent query to remain on this rung
          ansible.builtin.assert:
            that:
              - >-
                (
                  c1_2_fresh_agent_version_output.stdout
                  | regex_search(
                      'v[0-9]+\.[0-9]+\.[0-9]+\+rke2r[0-9]+'
                    )
                  | default('')
                )
                in [
                  hostvars['localhost'].c1_2_upgrade_from_version,
                  hostvars['localhost'].c1_2_upgrade_to_version
                ]
            fail_msg: >-
              Hard stop: {{ inventory_hostname }} no longer runs the declared
              source or target pin immediately before recovery.

        - name: Cordon the agent through the VIP-backed kubeconfig
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - cordon
              - "{{ inventory_hostname }}"
          delegate_to: "{{ c1_2_target_maintenance_host }}"
          register: c1_2_agent_initial_cordon
          changed_when: true

        - name: Drain the agent while respecting disruption budgets
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - drain
              - "{{ inventory_hostname }}"
              - --ignore-daemonsets
              - --delete-emptydir-data
              - --force
              - --grace-period=300
              - --timeout=10m
          delegate_to: "{{ c1_2_target_maintenance_host }}"
          changed_when: true

        - name: Stop this RKE2 agent
          ansible.builtin.systemd:
            name: rke2-agent
            state: stopped

        - name: Install the exact approved agent target pin
          ansible.builtin.command:
            argv:
              - /usr/local/sbin/rke2-install.sh
          environment: >-
            {{
              hostvars['localhost'].c1_2_upgrade_install_environment
              | combine({'INSTALL_RKE2_TYPE': 'agent'})
            }}
          no_log: >-
            {{ hostvars['localhost'].c1_2_upgrade_artifact_url | length > 0 }}
          changed_when: true
          when:
            - >-
              c1_2_installed_agent_version
              == hostvars['localhost'].c1_2_upgrade_from_version

        - name: Reload the installed RKE2 agent unit metadata
          ansible.builtin.systemd:
            daemon_reload: true

        - name: Re-prove protected RKE2 paths immediately before agent start
          block: *c1_2_rke2_config_integrity_gate

        - name: Re-prove semantic registry state immediately before agent start
          block:
            - *c1_2_find_agent_configuration_fragments
            - *c1_2_reject_unsafe_agent_fragment_types
            - *c1_2_read_agent_configuration_documents
            - *c1_2_require_agent_configuration_mappings
            - *c1_2_require_semantic_agent_registry_state
            - *c1_2_count_agent_registry_overrides
            - *c1_2_reject_noncanonical_agent_registry

        - name: Revalidate RKE2 agent service inputs before start
          ansible.builtin.shell:
            cmd: *c1_2_service_input_gate
          args: *c1_2_service_input_gate_args
          vars:
            c1_2_rke2_service_unit: rke2-agent.service
          changed_when: false

        - name: Start this RKE2 agent
          ansible.builtin.systemd:
            name: rke2-agent
            state: started

        - name: Wait for the local kubelet listener
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: 10250
            delay: 5
            timeout: 600

        - name: Reject alternate inputs in the live RKE2 agent process
          ansible.builtin.shell:
            cmd: *c1_2_live_process_input_gate
          args: *c1_2_live_process_input_gate_args
          vars:
            c1_2_rke2_service_unit: rke2-agent.service
          changed_when: false

        - name: Verify the exact installed agent target pin
          ansible.builtin.command:
            argv:
              - /usr/local/bin/rke2
              - --version
          register: c1_2_post_agent_version
          changed_when: false

        - name: Parse the exact installed agent target pin
          ansible.builtin.set_fact:
            c1_2_post_agent_version_pin: >-
              {{
                c1_2_post_agent_version.stdout
                | regex_search('v[0-9]+\.[0-9]+\.[0-9]+\+rke2r[0-9]+')
                | default('')
              }}

        - name: Reject an agent version that differs from the exact target
          ansible.builtin.assert:
            that:
              - >-
                c1_2_post_agent_version_pin
                == hostvars['localhost'].c1_2_upgrade_to_version
            fail_msg: >-
              Hard stop: {{ inventory_hostname }} did not install the exact
              requested RKE2 agent target.

        - name: Wait for the upgraded agent to report Ready through the VIP
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - get
              - node
              - "{{ inventory_hostname }}"
              - -o
              - json
          delegate_to: "{{ c1_2_target_maintenance_host }}"
          register: c1_2_agent_node_health
          retries: 30
          delay: 20
          until:
            - >-
              (c1_2_agent_node_health.stdout | from_json).status.conditions
              | selectattr('type', 'equalto', 'Ready')
              | map(attribute='status')
              | list
              | first
              | default('Unknown') == 'True'
          changed_when: false

        - name: Reject pressure on the upgraded agent
          ansible.builtin.assert:
            that:
              - >-
                (c1_2_agent_node_health.stdout | from_json).status.conditions
                | selectattr('type', 'equalto', 'DiskPressure')
                | map(attribute='status')
                | list
                | first
                | default('Unknown') == 'False'
              - >-
                (c1_2_agent_node_health.stdout | from_json).status.conditions
                | selectattr('type', 'equalto', 'MemoryPressure')
                | map(attribute='status')
                | list
                | first
                | default('Unknown') == 'False'
              - >-
                (c1_2_agent_node_health.stdout | from_json).status.conditions
                | selectattr('type', 'equalto', 'PIDPressure')
                | map(attribute='status')
                | list
                | first
                | default('Unknown') == 'False'
            fail_msg: >-
              Hard stop: the upgraded agent reports resource pressure.

        - name: Re-prove VIP-backed API readiness before agent uncordon
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - get
              - --raw=/readyz
          delegate_to: "{{ c1_2_target_maintenance_host }}"
          register: c1_2_agent_api_ready
          changed_when: false

        - name: Recheck CloudNativePG primary quorum before agent uncordon
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - -n
              - vhhealth-platform
              - get
              - cluster.postgresql.cnpg.io/vhhealth-pg
              - -o
              - json
          delegate_to: "{{ c1_2_target_maintenance_host }}"
          register: c1_2_agent_cnpg_quorum
          changed_when: false

        - name: Find non-Bound PVCs before agent uncordon
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - get
              - pvc
              - --all-namespaces
              - -o
              - >-
                jsonpath={range .items[?(@.status.phase!="Bound")]}{.metadata.namespace}{"/"}{.metadata.name}{"="}{.status.phase}{"\n"}{end}
          delegate_to: "{{ c1_2_target_maintenance_host }}"
          register: c1_2_agent_unbound_pvcs
          changed_when: false

        - name: Require VIP/API, CNPG quorum, and PVC health
          ansible.builtin.assert:
            that:
              - c1_2_agent_api_ready.stdout | trim == 'ok'
              - >-
                (c1_2_agent_cnpg_quorum.stdout | from_json).spec.instances
                | int == 3
              - >-
                (c1_2_agent_cnpg_quorum.stdout | from_json).status.currentPrimary
                | default('') | length > 0
              - >-
                (c1_2_agent_cnpg_quorum.stdout | from_json).status.readyInstances
                | default(0) | int >= 2
              - c1_2_agent_unbound_pvcs.stdout | trim | length == 0
            fail_msg: >-
              Hard stop: VIP/API, CNPG quorum, or PVC health degraded after
              upgrading {{ inventory_hostname }}. The agent remains cordoned.

        - name: Prove Longhorn health while this agent remains cordoned
          block: *c1_2_longhorn_health_gate

        - name: Validate every server rescue delegate for this agent
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - get
              - --raw=/readyz
          delegate_to: "{{ item }}"
          loop: "{{ groups['rke2_servers'] | list | sort }}"
          loop_control:
            label: "{{ item }}"
          register: c1_2_agent_rescue_delegates_ready
          changed_when: false

        - name: Require every agent rescue delegate to be ready
          ansible.builtin.assert:
            that:
              - >-
                c1_2_agent_rescue_delegates_ready.results
                | rejectattr('stdout', 'defined')
                | list
                | length == 0
              - >-
                c1_2_agent_rescue_delegates_ready.results
                | map(attribute='stdout')
                | map('trim')
                | reject('equalto', 'ok')
                | list
                | length == 0
            fail_msg: >-
              Hard stop: every declared server must retain VIP-backed API
              readiness as an independent agent rescue delegate.

        - name: Uncordon the healthy upgraded agent after storage health
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - uncordon
              - "{{ inventory_hostname }}"
          delegate_to: "{{ c1_2_target_maintenance_host }}"
          register: c1_2_agent_uncordon_result
          ignore_unreachable: true
          changed_when: true

        - name: Wait for full CloudNativePG convergence after agent uncordon
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - -n
              - vhhealth-platform
              - get
              - cluster.postgresql.cnpg.io/vhhealth-pg
              - -o
              - json
          delegate_to: "{{ c1_2_target_maintenance_host }}"
          register: c1_2_post_agent_cnpg
          ignore_unreachable: true
          retries: 60
          delay: 20
          until:
            - >-
              (c1_2_post_agent_cnpg.stdout | from_json).status.phase
              | default('') == 'Cluster in healthy state'
            - >-
              (c1_2_post_agent_cnpg.stdout | from_json).spec.instances
              | int == 3
            - >-
              (c1_2_post_agent_cnpg.stdout | from_json).status.currentPrimary
              | default('') | length > 0
            - >-
              (c1_2_post_agent_cnpg.stdout | from_json).status.readyInstances
              | default(0) | int
              ==
              (c1_2_post_agent_cnpg.stdout | from_json).spec.instances | int
            - >-
              (
                (c1_2_post_agent_cnpg.stdout | from_json)
                .status.instancesStatus.healthy
                | default([])
                | length
              )
              ==
              (c1_2_post_agent_cnpg.stdout | from_json).spec.instances | int
          changed_when: false

        - name: Prove a streaming synchronous standby after agent uncordon
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - -n
              - vhhealth-platform
              - exec
              - >-
                {{
                  (
                    c1_2_post_agent_cnpg.stdout
                    | from_json
                  ).status.currentPrimary
                }}
              - --
              - psql
              - -U
              - postgres
              - -d
              - postgres
              - -Atc
              - >-
                SELECT count(*) FROM pg_stat_replication
                WHERE state = 'streaming'
                AND sync_state IN ('sync', 'quorum');
          delegate_to: "{{ c1_2_target_maintenance_host }}"
          register: c1_2_post_agent_sync_standbys
          ignore_unreachable: true
          changed_when: false

        - name: Reject loss of synchronous standby after agent uncordon
          ansible.builtin.assert:
            that:
              - c1_2_post_agent_sync_standbys.stdout | trim | int >= 1
            fail_msg: >-
              Hard stop: CNPG converged without a streaming synchronous
              standby after agent uncordon.

        - name: Re-prove Longhorn health after agent uncordon
          ignore_unreachable: true
          block: *c1_2_longhorn_health_gate

        - name: Find post-agent PVC or node degradation
          ansible.builtin.shell: |
            set -euo pipefail
            pvc_failures=$(
              /usr/local/bin/kubectl --kubeconfig={{ c1_2_kubeconfig_path | quote }} \
                get pvc --all-namespaces \
                -o 'jsonpath={range .items[?(@.status.phase!="Bound")]}{.metadata.namespace}{"/"}{.metadata.name}{"\n"}{end}'
            )
            node_failures=$(
              /usr/local/bin/kubectl --kubeconfig={{ c1_2_kubeconfig_path | quote }} \
                get nodes -o json |
                /usr/bin/jq -r '
                  .items[]
                  | select(
                      (.spec.unschedulable // false)
                      or
                      ([.status.conditions[]
                        | select(.type == "Ready" and .status == "True")]
                        | length) != 1
                      or
                      any(.status.conditions[];
                          (.type == "DiskPressure"
                           or .type == "MemoryPressure"
                           or .type == "PIDPressure")
                          and .status == "True")
                    )
                  | .metadata.name
                '
            )
            printf '%s\n%s\n' "$pvc_failures" "$node_failures" |
              /usr/bin/sed '/^$/d'
          args:
            executable: /bin/bash
          delegate_to: "{{ c1_2_target_maintenance_host }}"
          register: c1_2_post_agent_degradation
          ignore_unreachable: true
          changed_when: false

        - name: Reject post-agent PVC or node degradation
          ansible.builtin.assert:
            that:
              - >-
                not (
                  c1_2_agent_uncordon_result.unreachable
                  | default(false)
                  | bool
                )
              - c1_2_agent_uncordon_result.rc | default(1) | int == 0
              - >-
                not (
                  c1_2_post_agent_degradation.unreachable
                  | default(false)
                  | bool
                )
              - >-
                c1_2_post_agent_degradation.stdout
                | default('') | trim | length == 0
            fail_msg: >-
              Hard stop: post-agent PVC or node convergence failed.
      rescue:
        - name: Re-cordon the agent through every declared server
          ansible.builtin.command:
            argv:
              - /usr/local/bin/kubectl
              - "--kubeconfig={{ c1_2_kubeconfig_path }}"
              - cordon
              - "{{ inventory_hostname }}"
          delegate_to: "{{ item }}"
          loop: "{{ groups['rke2_servers'] | list | sort }}"
          loop_control:
            label: "{{ item }}"
          register: c1_2_agent_rescue_cordon_attempts
          when:
            - >-
              c1_2_agent_initial_cordon is defined
              or c1_2_agent_uncordon_result is defined
          ignore_unreachable: true
          changed_when: false
          failed_when: false

        - name: Require at least one server to restore the agent fence
          ansible.builtin.assert:
            that:
              - >-
                c1_2_agent_rescue_cordon_attempts.results
                | selectattr('rc', 'defined')
                | selectattr('rc', 'equalto', 0)
                | list
                | length >= 1
            fail_msg: >-
              Hard stop: no declared server could re-cordon
              {{ inventory_hostname }} after the failed agent gate.
          when:
            - >-
              c1_2_agent_initial_cordon is defined
              or c1_2_agent_uncordon_result is defined

        - name: Stop the rung with this agent fenced
          ansible.builtin.fail:
            msg: >-
              RKE2 agent upgrade failed on {{ inventory_hostname }}. It
              remained cordoned or was safely re-cordoned after a later gate;
              investigate before resuming the approved rung.

- name: Require every server and agent to finish on the exact target pin
  hosts: rke2_servers:rke2_agents
  become: true
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  tasks:
    - name: Re-prove protected RKE2 paths in final per-node validation
      block: *c1_2_rke2_config_integrity_gate

    - name: Reject alternate final RKE2 service configuration inputs
      ansible.builtin.shell:
        cmd: *c1_2_service_input_gate
      args: *c1_2_service_input_gate_args
      vars:
        c1_2_rke2_service_unit: >-
          {{
            (
              inventory_hostname in groups['rke2_servers']
            )
            | ternary('rke2-server.service', 'rke2-agent.service')
          }}
      changed_when: false

    - name: Reject alternate inputs in every final live RKE2 process
      ansible.builtin.shell:
        cmd: *c1_2_live_process_input_gate
      args: *c1_2_live_process_input_gate_args
      vars:
        c1_2_rke2_service_unit: >-
          {{
            (
              inventory_hostname in groups['rke2_servers']
            )
            | ternary('rke2-server.service', 'rke2-agent.service')
          }}
      changed_when: false

    - name: Re-query the final installed RKE2 version
      ansible.builtin.command:
        argv:
          - /usr/local/bin/rke2
          - --version
      register: c1_2_final_rke2_version_output
      changed_when: false

    - name: Find every final loaded configuration fragment
      ansible.builtin.find:
        paths: /etc/rancher/rke2/config.yaml.d
        patterns: '(?is)^.*\.ya?ml\Z'
        use_regex: true
        file_type: any
        recurse: false
        hidden: true
      register: c1_2_final_config_fragments

    - name: Reject unsafe final configuration fragment file types
      ansible.builtin.assert:
        that:
          - item.isreg | default(false)
          - not (item.islnk | default(false))
        fail_msg: >-
          Hard stop: RKE2 loads this YAML fragment name, but it is a symlink
          or non-regular entry and cannot be validated safely.
        quiet: true
      loop: "{{ c1_2_final_config_fragments.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Read every final loaded configuration document
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: >-
        {{
          ['/etc/rancher/rke2/config.yaml']
          +
          (
            c1_2_final_config_fragments.files
            | map(attribute='path')
            | list
          )
        }}
      loop_control:
        label: "{{ item }}"
      register: c1_2_final_registry_documents
      no_log: true

    - name: Require final loaded configuration documents to be YAML mappings
      ansible.builtin.assert:
        that:
          - >-
            (item.content | b64decode | from_yaml) is none
            or (item.content | b64decode | from_yaml) is mapping
        fail_msg: >-
          Hard stop: a final RKE2 configuration document is not an empty
          document or YAML mapping and cannot be validated safely.
        quiet: true
      loop: "{{ c1_2_final_registry_documents.results }}"
      loop_control:
        label: "{{ item.source | default('unknown') }}"
      no_log: true

    - name: Require every final semantic registry state to match the target
      ansible.builtin.assert:
        that:
          - >-
            c1_2_registry_keys | length
            ==
            (
              (
                item.source == '/etc/rancher/rke2/config.yaml'
                and
                hostvars['localhost'].c1_2_upgrade_to_version in
                ['v1.31.14+rke2r2', 'v1.32.13+rke2r2']
              )
              | ternary(1, 0)
            )
          - >-
            c1_2_registry_keys
            | rejectattr('key', 'equalto', 'system-default-registry')
            | list
            | length == 0
          - >-
            c1_2_registry_keys
            | rejectattr('value', 'equalto', 'registry.rancher.com')
            | list
            | length == 0
        fail_msg: >-
          Hard stop: a final semantic system-default-registry key survived in
          a drop-in, used append syntax, or disagreed with the immutable
          Prime/public target classification.
        quiet: true
      vars:
        c1_2_registry_document: >-
          {{
            (item.content | b64decode | from_yaml)
            | default({}, true)
          }}
        c1_2_registry_keys: >-
          {{
            c1_2_registry_document
            | dict2items
            | selectattr('key', 'match', '^system-default-registry\\+?$')
            | list
          }}
      loop: "{{ c1_2_final_registry_documents.results }}"
      loop_control:
        label: "{{ item.source | default('unknown') }}"
      no_log: true

    - name: Count final active and exact registry overrides
      ansible.builtin.shell: |
        set -euo pipefail
        files=(/etc/rancher/rke2/config.yaml)
        if [[ -d /etc/rancher/rke2/config.yaml.d ]]; then
          while IFS= read -r -d '' file; do
            if [[ -L "$file" || ! -f "$file" ]]; then
              printf 'unsafe RKE2 config fragment: %s\n' "$file" >&2
              exit 64
            fi
            files+=("$file")
          done < <(
            /usr/bin/find /etc/rancher/rke2/config.yaml.d \
              -mindepth 1 -maxdepth 1 \
              \( -iname '*.yaml' -o -iname '*.yml' \) -print0 |
              /usr/bin/sort -z
          )
        fi
        /usr/bin/awk '
            BEGIN { active = 0; exact = 0 }
            /^[[:space:]]*["'\'']?system-default-registry[+]?["'\'']?[[:space:]]*:/ {
              active += 1
              if ($0 == "system-default-registry: \"registry.rancher.com\"") {
                exact += 1
              }
            }
            END { printf "%d %d\n", active, exact }
          ' "${files[@]}"
      args:
        executable: /bin/bash
      register: c1_2_final_registry_cardinality
      changed_when: false

    - name: Require the exact target pin and registry state on every managed node
      ansible.builtin.assert:
        that:
          - >-
            (
              c1_2_final_rke2_version_output.stdout
              | regex_search(
                  'v[0-9]+\.[0-9]+\.[0-9]+\+rke2r[0-9]+'
                )
              | default('')
            )
            == hostvars['localhost'].c1_2_upgrade_to_version
          - >-
            (
              hostvars['localhost'].c1_2_upgrade_to_version in
              ['v1.31.14+rke2r2', 'v1.32.13+rke2r2']
              and c1_2_final_registry_cardinality.stdout | trim == '1 1'
            )
            or
            (
              hostvars['localhost'].c1_2_upgrade_to_version not in
              ['v1.31.14+rke2r2', 'v1.32.13+rke2r2']
              and c1_2_final_registry_cardinality.stdout | trim == '0 0'
            )
        fail_msg: >-
          Hard stop: {{ inventory_hostname }} did not finish the rung on the
          exact target {{ hostvars['localhost'].c1_2_upgrade_to_version }} with
          the exact Prime/public registry cardinality.

- name: Prove final cluster-wide node convergence through an independent server
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    c1_2_kubeconfig_path: /etc/rancher/rke2/rke2.yaml
    c1_2_etcdctl_path: /var/lib/rancher/rke2/bin/etcdctl
    c1_2_etcd_ca: /var/lib/rancher/rke2/server/tls/etcd/server-ca.crt
    c1_2_etcd_cert: /var/lib/rancher/rke2/server/tls/etcd/server-client.crt
    c1_2_etcd_key: /var/lib/rancher/rke2/server/tls/etcd/server-client.key
  tasks:
    - name: Select the final independent cluster-health delegate
      ansible.builtin.set_fact:
        c1_2_final_maintenance_host: >-
          {{ c1_2_upgrade_maintenance_host }}

    - name: Require a declared server for the final cluster-wide gate
      ansible.builtin.assert:
        that:
          - c1_2_final_maintenance_host in groups['rke2_servers']
        fail_msg: >-
          Hard stop: the final cluster-wide gate has no declared RKE2 server
          delegate.

    - name: Inspect exact final etcd membership
      ansible.builtin.command:
        argv:
          - "{{ c1_2_etcdctl_path }}"
          - "--cacert={{ c1_2_etcd_ca }}"
          - "--cert={{ c1_2_etcd_cert }}"
          - "--key={{ c1_2_etcd_key }}"
          - "--endpoints=https://127.0.0.1:2379"
          - member
          - list
          - --write-out=json
      environment:
        ETCDCTL_API: "3"
      delegate_to: "{{ c1_2_final_maintenance_host }}"
      register: c1_2_final_etcd_members
      changed_when: false

    - name: Require exact declared etcd membership after the rung
      ansible.builtin.assert:
        that:
          - >-
            (
              (c1_2_final_etcd_members.stdout | from_json).members
              | map(attribute='name')
              | list
              | sort
            )
            == groups['rke2_servers'] | list | sort
        fail_msg: >-
          Hard stop: final etcd member names do not exactly match the declared
          RKE2 server inventory.

    - name: Find every final node convergence or version violation
      ansible.builtin.shell: |
        set -euo pipefail
        /usr/local/bin/kubectl \
          --kubeconfig={{ c1_2_kubeconfig_path | quote }} get nodes -o json |
          /usr/bin/jq -r \
            --arg version {{ c1_2_upgrade_to_version | quote }} \
            --argjson expected_count {{
              (
                (groups['rke2_servers'] | length)
                +
                (groups['rke2_agents'] | default([]) | length)
              )
              | quote
            }} \
            --argjson expected_names {{
              (
                (
                  (groups['rke2_servers'] | list)
                  +
                  (groups['rke2_agents'] | default([]) | list)
                )
                | sort
                | to_json
              )
              | quote
            }} '
              if (.items | length) != $expected_count then
                "node-count=" + ((.items | length) | tostring)
              elif
                ([.items[].metadata.name] | sort)
                !=
                ($expected_names | sort)
              then
                "node-names="
                + (([.items[].metadata.name] | sort) | join(","))
              else
                .items[]
                | select(
                    (.spec.unschedulable // false)
                    or .status.nodeInfo.kubeletVersion != $version
                    or
                    ([.status.conditions[]
                      | select(
                          .type == "Ready" and .status == "True"
                        )] | length) != 1
                    or
                    any(.status.conditions[];
                        (.type == "DiskPressure"
                         or .type == "MemoryPressure"
                         or .type == "PIDPressure"
                         or .type == "NetworkUnavailable")
                        and .status == "True")
                  )
                | .metadata.name
              end
            '
      args:
        executable: /bin/bash
      delegate_to: "{{ c1_2_final_maintenance_host }}"
      register: c1_2_final_cluster_violations
      changed_when: false

    - name: Reject an incomplete or degraded final cluster state
      ansible.builtin.assert:
        that:
          - c1_2_final_cluster_violations.stdout | trim | length == 0
        fail_msg: >-
          Hard stop: final nodes are missing, cordoned, unready, pressured, or
          do not report the exact target kubelet pin:
          {{ c1_2_final_cluster_violations.stdout | trim }}.

- name: Record the repository automation boundary
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Report required post-rung qualification
      ansible.builtin.debug:
        msg: >-
          The approved RKE2 rung completed. This playbook does not claim a
          production qualification result: retain its output and complete the
          per-rung backend synthetic read/write, CNPG replication, storage,
          CNI, DNS, metrics, alert, backup/restore, and rollback evidence in
          docs/RKE2_1_34_QUALIFICATION.md before starting another rung.

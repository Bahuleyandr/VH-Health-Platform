---
# NOTE: management_cidrs + cluster_cidrs are defined in
# inventories/group_vars/all/main.yml because they are used by multiple
# roles (firewall + hardening). They are intentionally NOT role-prefixed.

# Ports we open to declared management networks.
firewall_management_tcp_ports:
  - 6443            # Kubernetes API through the control-plane VIP

# Ports we open cluster-wide.
# Source: https://docs.rke2.io/install/requirements#networking
firewall_cluster_tcp_ports:
  - 6443            # Kubernetes API
  - 9345            # RKE2 supervisor (server registration)
  - 10250           # kubelet metrics
  - 2379-2380       # embedded etcd
firewall_cluster_udp_ports:
  - 8472            # flannel VXLAN
  - 51820           # wireguard (optional; leave open for future)
  - 51821           # wireguard IPv6 (optional)

# Unicast keepalived uses VRRP IP protocol 112 directly between cluster nodes.
firewall_vrrp_protocol: 112

# NodePort range (kube default 30000-32767).
firewall_nodeport_range: "30000-32767"

# Whether to log dropped packets (rate-limited).
firewall_log_drops: true

# Nftables rendered config path — Debian/Ubuntu default location.
firewall_config_path: /etc/nftables.conf

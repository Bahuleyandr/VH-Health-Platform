---
- name: Reload nftables
  # `nft -f` flushes + loads atomically — safer than `systemctl restart`
  # which briefly drops to default policy.
  ansible.builtin.command:
    cmd: "nft -f {{ firewall_config_path }}"
  listen: reload nftables
  changed_when: true

- name: Ensure nftables service restarted
  ansible.builtin.systemd:
    name: nftables
    state: restarted
  listen: restart nftables

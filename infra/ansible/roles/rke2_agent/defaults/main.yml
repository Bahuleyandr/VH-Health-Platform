---
# Inherits most defaults from the server role for consistency. Only the
# service name + install type + config template differ.
rke2_version: "v1.31.4+rke2r1"
rke2_channel: stable
rke2_install_method: curl
rke2_install_artifact_url: ""
rke2_system_default_registry: registry.rancher.com
rke2_config_dir: /etc/rancher/rke2
rke2_config_file: "{{ rke2_config_dir }}/config.yaml"
rke2_agent_token_file: "{{ rke2_config_dir }}/cluster-token"
rke2_data_dir: /var/lib/rancher/rke2
rke2_system_reserved: "cpu=500m,memory=1Gi,ephemeral-storage=10Gi"
rke2_kube_reserved: "cpu=500m,memory=1Gi,ephemeral-storage=10Gi"

# Agents always register through the cleared HA endpoint and use the same
# pre-shared Vault token as servers. The role rejects missing token or
# failure-domain input before installing or starting anything.
control_plane_vip_enabled: false
control_plane_vip_address: "10.10.0.10"
rke2_agent_server_url: "https://{{ control_plane_vip_address }}:9345"
rke2_agent_token: "{{ rke2_cluster_token | default('') }}"
rke2_agent_allow_token_rotation: false

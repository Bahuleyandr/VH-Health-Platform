---
# Runs ONLY on the host with rke2_bootstrap: true.
# This node creates the cluster; embedded etcd initializes with a single
# member, and the other servers join via join.yml.

- name: Ensure rke2-server service is enabled
  ansible.builtin.systemd:
    name: rke2-server
    enabled: true
    daemon_reload: true
  tags: [rke2, bootstrap]

- name: Apply notified configuration changes before readiness checks
  ansible.builtin.meta: flush_handlers
  tags: [rke2, bootstrap]

- name: Start rke2-server (bootstrap node)
  ansible.builtin.systemd:
    name: rke2-server
    state: started
  tags: [rke2, bootstrap]

- name: Wait for API server readiness on bootstrap node (5 min budget)
  ansible.builtin.uri:
    url: https://127.0.0.1:6443/readyz
    method: GET
    validate_certs: false
    return_content: false
    status_code: 200
    timeout: 3
  register: rke2_bootstrap_ready
  retries: 60
  delay: 5
  until: rke2_bootstrap_ready.status | default(0) == 200
  tags: [rke2, bootstrap]

- name: Wait for kubeconfig to exist
  ansible.builtin.wait_for:
    path: "{{ rke2_config_dir }}/rke2.yaml"
    state: present
    timeout: 60
  tags: [rke2, bootstrap]

- name: Wait for local etcd endpoint health
  ansible.builtin.command:
    argv:
      - "{{ rke2_data_dir }}/bin/etcdctl"
      - "--endpoints=https://127.0.0.1:2379"
      - "--cacert={{ rke2_data_dir }}/server/tls/etcd/server-ca.crt"
      - "--cert={{ rke2_data_dir }}/server/tls/etcd/server-client.crt"
      - "--key={{ rke2_data_dir }}/server/tls/etcd/server-client.key"
      - endpoint
      - health
  environment:
    ETCDCTL_API: "3"
  register: rke2_bootstrap_etcd_health
  changed_when: false
  retries: 30
  delay: 10
  until: rke2_bootstrap_etcd_health.rc == 0
  tags: [rke2, bootstrap]

- name: Wait for both control-plane VIP services before joiners start
  ansible.builtin.wait_for:
    host: "{{ control_plane_vip_address }}"
    port: "{{ item }}"
    connect_timeout: 3
    delay: 2
    timeout: 300
  loop:
    - 6443
    - 9345
  when: control_plane_vip_enabled | bool
  tags: [rke2, bootstrap]

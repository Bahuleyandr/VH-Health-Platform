---
# RKE2 binary installation via the official install script.
# Pin to rke2_version; re-runs no-op unless version changed.

- name: Check currently installed RKE2 version
  ansible.builtin.command:
    cmd: /usr/local/bin/rke2 --version
  register: rke2_installed
  failed_when: false
  changed_when: false
  check_mode: false
  tags: [rke2, install]

- name: Download RKE2 install script
  ansible.builtin.get_url:
    url: https://get.rke2.io
    dest: /usr/local/sbin/rke2-install.sh
    mode: "0750"
    owner: root
    group: root
  when:
    - rke2_install_method == 'curl'
    - rke2_installed.rc != 0 or rke2_version not in (rke2_installed.stdout | default(''))
  tags: [rke2, install]

- name: Run RKE2 install script (pinned to {{ rke2_version }})
  ansible.builtin.command:
    cmd: /usr/local/sbin/rke2-install.sh
  environment:
    INSTALL_RKE2_VERSION: "{{ rke2_version }}"
    INSTALL_RKE2_CHANNEL: "{{ rke2_channel }}"
    INSTALL_RKE2_TYPE: "server"
  when:
    - rke2_install_method == 'curl'
    - rke2_installed.rc != 0 or rke2_version not in (rke2_installed.stdout | default(''))
  changed_when: true
  notify: reload systemd
  tags: [rke2, install]

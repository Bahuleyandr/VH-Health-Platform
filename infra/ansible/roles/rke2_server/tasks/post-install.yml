---
# Post-install: install kubectl/helm/kubectx + copy kubeconfig to admin user.

- name: Symlink rke2 kubectl into /usr/local/bin
  ansible.builtin.file:
    src: "{{ rke2_data_dir }}/bin/kubectl"
    dest: /usr/local/bin/kubectl
    state: link
    force: true
  tags: [rke2, post, tooling]

- name: Install Helm (pinned)
  ansible.builtin.unarchive:
    src: "https://get.helm.sh/helm-{{ rke2_helm_version }}-linux-amd64.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/linux-amd64/helm"
  tags: [rke2, post, tooling]

- name: Move Helm binary into /usr/local/bin
  ansible.builtin.copy:
    src: /tmp/linux-amd64/helm
    dest: /usr/local/bin/helm
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  tags: [rke2, post, tooling]

- name: Install kubectx + kubens via apt (Ubuntu 24.04 universe)
  ansible.builtin.apt:
    name:
      - kubectx
    state: present
    update_cache: true
  failed_when: false  # package may not be available on all mirrors
  tags: [rke2, post, tooling]

# --- Copy kubeconfig to admin user ----------------------------------------

- name: Ensure admin kube dir
  ansible.builtin.file:
    path: "{{ hardening_admin_home | default('/home/' ~ (hardening_admin_user | default('vhhealth'))) }}/.kube"
    state: directory
    owner: "{{ hardening_admin_user | default('vhhealth') }}"
    group: "{{ hardening_admin_user | default('vhhealth') }}"
    mode: "0700"
  tags: [rke2, post, kubeconfig]

- name: Wait for rke2 kubeconfig file
  ansible.builtin.wait_for:
    path: "{{ rke2_config_dir }}/rke2.yaml"
    state: present
    timeout: 300
  tags: [rke2, post, kubeconfig]

- name: Rewrite RKE2 admin kubeconfig to the control-plane VIP
  ansible.builtin.replace:
    path: "{{ rke2_config_dir }}/rke2.yaml"
    regexp: '(?m)^(\s*server:\s*)https://[^:\s]+:6443\s*$'
    replace: '\1https://{{ control_plane_vip_address }}:6443'
  diff: false
  no_log: true
  when: control_plane_vip_enabled | bool
  tags: [rke2, post, kubeconfig]

- name: Copy rke2.yaml to admin ~/.kube/config
  ansible.builtin.copy:
    src: "{{ rke2_config_dir }}/rke2.yaml"
    dest: "{{ hardening_admin_home | default('/home/' ~ (hardening_admin_user | default('vhhealth'))) }}/.kube/config"
    remote_src: true
    owner: "{{ hardening_admin_user | default('vhhealth') }}"
    group: "{{ hardening_admin_user | default('vhhealth') }}"
    mode: "0600"
    backup: false
  diff: false
  no_log: true
  tags: [rke2, post, kubeconfig]

- name: Rewrite admin kubeconfig to the control-plane VIP
  ansible.builtin.replace:
    path: "{{ hardening_admin_home | default('/home/' ~ (hardening_admin_user | default('vhhealth'))) }}/.kube/config"
    regexp: '(?m)^(\s*server:\s*)https://[^:\s]+:6443\s*$'
    replace: '\1https://{{ control_plane_vip_address }}:6443'
  diff: false
  no_log: true
  when: control_plane_vip_enabled | bool
  tags: [rke2, post, kubeconfig]

- name: Read kubeconfig endpoints without exposing credentials
  ansible.builtin.command:
    argv:
      - "{{ rke2_data_dir }}/bin/kubectl"
      - "--kubeconfig={{ item }}"
      - config
      - view
      - --minify
      - -o
      - 'jsonpath={.clusters[0].cluster.server}'
  loop:
    - "{{ rke2_config_dir }}/rke2.yaml"
    - "{{ hardening_admin_home | default('/home/' ~ (hardening_admin_user | default('vhhealth'))) }}/.kube/config"
  register: rke2_kubeconfig_endpoints
  changed_when: false
  when: control_plane_vip_enabled | bool
  tags: [rke2, post, kubeconfig]

- name: Prove every admin kubeconfig uses the control-plane VIP
  ansible.builtin.assert:
    that:
      - >-
        rke2_kubeconfig_endpoints.results
        | map(attribute='stdout')
        | unique
        | list
        == ['https://' ~ control_plane_vip_address ~ ':6443']
    fail_msg: >-
      A generated admin kubeconfig does not use the control-plane VIP.
  when: control_plane_vip_enabled | bool
  tags: [rke2, post, kubeconfig]

# RKE2 node-label is registration-time configuration. Existing live nodes are
# deliberately relabelled only by the operator procedure in the C1.2 HA
# runbook, after comparing live labels with these inventory values.

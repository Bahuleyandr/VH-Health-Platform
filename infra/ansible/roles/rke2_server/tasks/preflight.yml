---
# Hard guards before touching anything. If any of these fail, the run
# aborts before a single RKE2 byte is written.

- name: Assert Ubuntu 24.04
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] == '24.04'
    fail_msg: "RKE2 role expects Ubuntu 24.04 LTS; got {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
  tags: [rke2, preflight]

- name: Assert swap is off
  ansible.builtin.assert:
    that:
      - ansible_facts['swaptotal_mb'] | default(0) | int == 0
    fail_msg: "Swap must be disabled before RKE2 install (common role handles this)."
  tags: [rke2, preflight]

- name: Assert exactly one bootstrap server in inventory
  ansible.builtin.assert:
    that:
      - >-
        groups['rke2_servers']
        | map('extract', hostvars)
        | selectattr('rke2_bootstrap', 'defined')
        | selectattr('rke2_bootstrap', 'equalto', true)
        | list
        | length == 1
    fail_msg: "Exactly one host in 'rke2_servers' must have rke2_bootstrap: true."
  run_once: true
  tags: [rke2, preflight]

- name: Assert truthful failure-domain labels are present
  ansible.builtin.assert:
    that:
      - inventory_region is defined
      - inventory_region | string | trim | length > 0
      - inventory_zone is defined
      - inventory_zone | string | trim | length > 0
    fail_msg: >-
      inventory_region and inventory_zone are required and must describe
      evidenced physical failure-domain truth.
  tags: [rke2, preflight]

- name: Assert the implemented RKE2 installation contract
  ansible.builtin.assert:
    that:
      - rke2_install_method == 'curl'
      - rke2_channel == 'stable'
      - >-
        rke2_install_artifact_url | string
        == (rke2_install_artifact_url | string | trim)
      - >-
        rke2_install_artifact_url | string
        ==
        (vault_rke2_prime_artifact_url | default('') | string)
      - >-
        rke2_install_artifact_url | string | length == 0
        or (
          (
            rke2_install_artifact_url
            | regex_search('^https://\S+/rke2/?$')
          ) is not none
        )
      - >-
        rke2_install_artifact_url | string | length == 0
        or rke2_system_default_registry == 'registry.rancher.com'
    fail_msg: >-
      This role supports only the stable-channel official curl installer.
      Prime artifact URLs must come from vault_rke2_prime_artifact_url, use
      HTTPS, end in /rke2 (optional trailing slash), and pair with
      system-default-registry registry.rancher.com.
  tags: [rke2, preflight, install]

- name: Assert joining servers use an enabled control-plane VIP
  ansible.builtin.assert:
    that:
      - control_plane_vip_enabled | bool
      - control_plane_vip_address | string | trim | length > 0
    fail_msg: "Joining servers require the enabled control-plane VIP registration endpoint."
  when: not (rke2_bootstrap | default(false) | bool)
  tags: [rke2, preflight]

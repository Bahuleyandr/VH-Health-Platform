          - >-
            (
              c12_rescue_fence_assertion_source
              | regex_findall(
                  "selectattr\\('rc', 'equalto', 0\\)"
                )
              | length
            ) == 3
          - >-
            (
              c12_rescue_fence_assertion_source
              | regex_findall('length\s+>=\s+1')
              | length
            ) == 3
        fail_msg: >-
          Every initial cordon must be registered. Rescue must try every
          independent surviving server, tolerate individual transport failure,
          and then hard-stop unless at least one delegate returned rc zero
          after either the initial cordon or an uncordon attempt.

    - name: Verify node-replacement token and membership identity safety
      ansible.builtin.assert:
        that:
          - >-
            '- name: Inspect the replacement RKE2 configuration directory'
            in c12_node_replace_playbook_source
          - >-
            'not c1_2_replacement_config_dir.stat.exists'
            in c12_node_replace_playbook_source
          - >-
            'rke2_cluster_token'
            in c12_node_replace_playbook_source
          - >-
            "== hostvars['localhost'].c1_2_replacement_cluster_token"
            in c12_node_replace_playbook_source
          - >-
            "regex_replace('[\\r\\n]+$', '')"
            in c12_node_replace_playbook_source
          - >-
            'c1_2_survivor_token_raw == c1_2_vault_token_raw'
            in c12_node_replace_playbook_source
          - >-
            '- name: Reject replacement without a streaming synchronous standby'
            in c12_node_replace_playbook_source
          - >-
            c12_node_replace_playbook_source.find(
              '- name: Reject replacement without a streaming synchronous standby'
            )
            <
            c12_node_replace_playbook_source.find(
              '- name: Cordon the lost node object when it still exists'
            )
          - >-
            (
              c12_node_replace_playbook_source
              | regex_search(
                  '(?s)c1_2_survivor_token_blob\.content'
                  ~ '.{0,240}?\|\s*trim\b'
                )
            ) is none
          - "'member list' in c12_node_lost_member_resolution_block"
          - "'/usr/bin/awk' in c12_node_lost_member_resolution_block"
          - "'--write-out=json' not in c12_node_lost_member_resolution_block"
          - "'tostring' not in c12_node_lost_member_resolution_block"
          - >-
            "is match('^[0-9a-f]{1,16}$')"
            in c12_node_replace_playbook_source
          - >-
            '- name: Revalidate the exact lost member name and ID immediately'
            in c12_node_replace_playbook_source
          - >-
            c12_node_replace_playbook_source.find(
              '- name: Revalidate the exact lost member name and ID immediately'
            )
            <
            c12_node_replace_playbook_source.find(
              '- name: Remove the exact lost etcd member when still present'
            )
          - >-
            '- name: Prove the removed member name and ID are both absent'
            in c12_node_replace_playbook_source
          - >-
            '- name: Require exact declared etcd membership before membership change'
            in c12_node_replace_playbook_source
          - >-
            'c1_2_etcd_member_names_before == c1_2_declared_survivor_names'
            in c12_node_replace_playbook_source
          - >-
            'c1_2_etcd_member_names_before == c1_2_declared_server_names'
            in c12_node_replace_playbook_source
          - >-
            '- name: Require exactly the two declared survivors after removal'
            in c12_node_replace_playbook_source
          - >-
            '== c1_2_declared_survivor_names'
            in c12_node_replace_playbook_source
          - >-
            '- name: Inspect exact etcd membership after replacement join'
            in c12_node_replace_playbook_source
          - >-
            "== groups['rke2_servers'] | list | sort"
            in c12_node_replace_playbook_source
        fail_msg: >-
          Node replacement must reject existing data or configuration state,
          bind the live survivor token to the fixed Vault identity, preserve
          and revalidate a lossless hexadecimal member ID, prove the exact
          survivor set after removal, and prove the full declared set after
          join.

    - name: Verify the replacement remains fenced through degraded-safe gates
      ansible.builtin.assert:
        that:
          - >-
            'vhhealth.io/replacement-validation=true:NoSchedule'
            in c12_node_replace_playbook_source
          - >-
            c12_node_replace_playbook_source.find(
              '- name: Render the fenced replacement configuration'
            )
            <
            c12_node_replace_playbook_source.find(
              '- name: Join the fenced replacement server'
            )
          - >-
            '.spec.unschedulable'
            in c12_node_replace_playbook_source
          - c12_node_fenced_cnpg_gate | length > 0
          - "'status.currentPrimary' in c12_node_fenced_cnpg_gate"
          - "'status.readyInstances' in c12_node_fenced_cnpg_gate"
          - "'status.phase' not in c12_node_fenced_cnpg_gate"
          - >-
            c12_node_replace_playbook_source.find(
              '- name: Require a primary and two ready instances while fenced'
            )
            <
            c12_node_replace_playbook_source.find(
              '- name: Remove the temporary registration taint from RKE2 config'
            )
          - >-
            c12_node_replace_playbook_source.find(
              '- name: Reject non-Bound PVCs while fenced'
            )
            <
            c12_node_replace_playbook_source.find(
              '- name: Remove the temporary registration taint from RKE2 config'
            )
          - >-
            c12_node_replace_playbook_source.find(
              '- name: Wait for Longhorn volumes and nodes to be healthy while fenced'
            )
            <
            c12_node_replace_playbook_source.find(
              '- name: Remove the temporary registration taint from RKE2 config'
            )
          - >-
            c12_node_replace_playbook_source.find(
              '- name: Remove the live temporary registration taint'
            )
            <
            c12_node_replace_playbook_source.find(
              '- name: Uncordon the validated replacement'
            )
          - >-
            c12_node_replace_playbook_source.find(
              '- name: Uncordon the validated replacement'
            )
            <
            c12_node_replace_playbook_source.find(
              '- name: Wait for full healthy CloudNativePG convergence'
            )
        fail_msg: >-
          A replacement must remain tainted and cordoned through exact pin,
          VIP, etcd, degraded-safe CNPG, synchronous standby, PVC, and Longhorn
          gates; full three-instance convergence occurs only after uncordon.

    - name: Verify replacement exact pin, readiness, and VIP postconditions
      ansible.builtin.assert:
        that:
          - >-
            'c1_2_replacement_post_pin'
            in c12_node_replace_playbook_source
          - >-
            "== hostvars['localhost'].c1_2_replacement_version"
            in c12_node_replace_playbook_source
          - >-
            'https://127.0.0.1:6443/readyz'
            in c12_node_replace_playbook_source
          - "'port: 9345' in c12_node_replace_playbook_source"
          - >-
            '- name: Rewrite the active replacement kubeconfig to the VIP'
            in c12_node_replace_playbook_source
          - >-
            '- name: Reject a non-VIP replacement kubeconfig'
            in c12_node_replace_playbook_source
          - >-
            "sync_state IN ('sync', 'quorum')"
            in c12_node_replace_playbook_source
          - >-
            '- name: Re-prove final VIP-backed API readiness'
            in c12_node_replace_playbook_source
          - >-
            '- name: Re-prove final etcd cluster health'
            in c12_node_replace_playbook_source
          - >-
            'c1_2_maintenance_host != c1_2_replacement_node'
            in c12_node_replace_playbook_source
          - >-
            '- name: Prove the final Kubernetes node set matches the inventory'
            in c12_node_replace_playbook_source
          - >-
            '- name: Require the exact final declared Kubernetes node set'
            in c12_node_replace_playbook_source
          - >-
            "([.items[].metadata.name] | sort)"
            in c12_node_post_uncordon_source
          - >-
            "== ($expected | sort)"
            in c12_node_post_uncordon_source
          - >-
            'c1_2_replacement_final_node_set.rc | default(1) | int == 0'
            in c12_node_post_uncordon_source
          - c12_node_post_uncordon_source | length > 0
          - >-
            (
              c12_node_post_uncordon_source
              | regex_findall('ansible\\.builtin\\.(?:command|shell):')
              | length
            )
            ==
            (
              c12_node_post_uncordon_source
              | regex_findall('delegate_to:')
              | length
            )
          - >-
            (
              c12_node_post_uncordon_source
              | regex_findall(
                  "hostvars\\['localhost'\\]\\.c1_2_maintenance_host"
                )
              | length
            )
            >=
            (
              c12_node_post_uncordon_source
              | regex_findall('delegate_to:')
              | length
            )
          - >-
            '((.spec.unschedulable // false) == false)'
            in c12_node_post_uncordon_source
          - >-
            (
              c12_node_post_uncordon_source
              | regex_findall('\\.type == "(?:MemoryPressure|DiskPressure|PIDPressure|NetworkUnavailable)"')
              | unique
              | length
            ) == 4
          - >-
            '- name: Read the final replacement kubelet version'
            in c12_node_post_uncordon_source
          - >-
            'jsonpath={.status.nodeInfo.kubeletVersion}'
            in c12_node_post_uncordon_source
          - >-
            'c1_2_replacement_final_kubelet_version.stdout | trim'
            in c12_node_post_uncordon_source
          - >-
            (
              c12_node_post_uncordon_source
              | regex_search(
                  '(?s)c1_2_replacement_final_kubelet_version\.stdout'
                  ~ '.{0,120}?==\s*hostvars'
                  ~ "\\['localhost'\\]\\.c1_2_replacement_version"
                )
            ) is not none
        fail_msg: >-
          Replacement validation must use the explicit non-target maintenance
          server for every post-uncordon read, then prove exact version,
          uncordoned Ready/no-pressure health, storage, final VIP readiness, and
          final etcd health.

    # disaster-recover.yml is intentionally excluded: it is outside the
    # coordinator-cleared C1.2 file ledger and is not a C1.2 runtime path.
    - name: Find C1.2 role sources that could select a bootstrap host
      ansible.builtin.find:
        paths:
          - "{{ playbook_dir }}/../roles/rke2_server"
          - "{{ playbook_dir }}/../roles/rke2_agent"
          - "{{ playbook_dir }}/../roles/control_plane_vip"
        recurse: true
        file_type: file
        patterns:
          - "*.yml"
          - "*.yaml"
          - "*.j2"
      register: c12_runtime_role_source_files

    - name: Define the coordinator-cleared C1.2 runtime source set
      ansible.builtin.set_fact:
        c12_runtime_source_paths: >-
          {{
            (
              c12_runtime_role_source_files.files
              | map(attribute='path')
              | list
            )
            +
            [
              playbook_dir ~ '/../playbooks/site.yml',
              playbook_dir ~ '/../playbooks/upgrade-k8s.yml',
              playbook_dir ~ '/../playbooks/node-replace.yml',
              playbook_dir ~ '/../playbooks/longhorn-prereqs.yml'
            ]
          }}

    - name: Reject first-inventory-host and bootstrap-token-source dependencies
      ansible.builtin.assert:
        that:
          - >-
            (
               lookup('ansible.builtin.file', item)
               | regex_search(
                   'groups\\s*\\[\\s*[''"]rke2_servers[''"]\\s*\\]'
                   ~ '\\s*(?:\\|\\s*sort\\s*)?\\|\\s*first\\b'
                 )
             ) is none
          - >-
            (
              lookup('ansible.builtin.file', item)
              | regex_search(
                  'groups\\s*\\[\\s*[''"]rke2_servers[''"]\\s*\\]'
                  ~ '\\s*\\[\\s*0\\s*\\]'
                )
            ) is none
          - >-
            'rke2_bootstrap_host'
            not in lookup('ansible.builtin.file', item)
          - >-
            (
              lookup('ansible.builtin.file', item)
              | regex_search('\\bbootstrap_token_(?:stat|blob)\\b')
            ) is none
        fail_msg: >-
          {{ item }} still selects the first rke2_servers inventory
          host or treats a bootstrap host as the cluster-token source.
      loop: "{{ c12_runtime_source_paths }}"
      loop_control:
        label: "{{ item }}"

    - name: Verify agent defaults and copied kubeconfigs name the VIP
      ansible.builtin.assert:
        that:
          - "'control_plane_vip_address' in c12_agent_defaults_source"
          - "':9345' in c12_agent_defaults_source"
          - >-
            (
              c12_agent_defaults_source
              | regex_search('(?i)(?:vhh-)?node-?1')
            ) is none
          - "'control_plane_vip_address' in c12_post_install_source"
          - "':6443' in c12_post_install_source"
        fail_msg: >-
          Agent defaults and copied administrator kubeconfigs must use the VIP,
          never a named first server.

    - name: Report the offline contract result
      ansible.builtin.debug:
        msg: >-
          C1.2 offline contract passed: bootstrap, joiners, agent, all three
          unicast keepalived peers, readiness gate, manual-sync posture,
          scheduling, and inert storage truth are internally consistent.

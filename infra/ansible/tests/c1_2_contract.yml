---
# Offline contract only. Run from infra/ansible with:
#   ansible-playbook -i localhost, -c local tests/c1_2_contract.yml

- name: Build the C1.2 offline fixture inventory
  hosts: localhost
  gather_facts: false
  vars:
    c12_control_plane_vip: 10.10.0.10
    c12_control_plane_interface: enp1s0
    c12_control_plane_prefix_length: 24
    c12_control_plane_virtual_router_id: 42
    c12_control_plane_dns_name: api.c1-2.invalid
    c12_cluster_token: >-
      K10aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa::server:C12_OFFLINE_CONTRACT_TOKEN
    c12_fixture_servers:
      - name: c12-server-a
        address: 10.10.0.11
        bootstrap: true
        expected_priority: 150
      - name: c12-server-b
        address: 10.10.0.12
        bootstrap: false
        expected_priority: 140
      - name: c12-server-c
        address: 10.10.0.13
        bootstrap: false
        expected_priority: 130
  tasks:
    - name: Add three control-plane fixture hosts
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups:
          - rke2_servers
          - c1_2_contract_servers
        ansible_connection: local
        ansible_host: "{{ item.address }}"
        inventory_region: c12-hospital
        inventory_zone: c12-shared-facility-zone
        rke2_bootstrap: "{{ item.bootstrap }}"
        rke2_cluster_token: "{{ c12_cluster_token }}"
        control_plane_vip_enabled: true
        control_plane_vip_address: "{{ c12_control_plane_vip }}"
        control_plane_vip_interface: "{{ c12_control_plane_interface }}"
        control_plane_vip_prefix_length: "{{ c12_control_plane_prefix_length }}"
        control_plane_vip_virtual_router_id: "{{ c12_control_plane_virtual_router_id }}"
        control_plane_api_dns_name: "{{ c12_control_plane_dns_name }}"
        c12_expected_priority: "{{ item.expected_priority }}"
      loop: "{{ c12_fixture_servers }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: false

    - name: Add one worker fixture host
      ansible.builtin.add_host:
        name: c12-agent-a
        groups:
          - rke2_agents
          - c1_2_contract_agents
        ansible_connection: local
        ansible_host: 10.10.0.21
        inventory_region: c12-hospital
        inventory_zone: c12-shared-facility-zone
        rke2_cluster_token: "{{ c12_cluster_token }}"
        control_plane_vip_address: "{{ c12_control_plane_vip }}"
      changed_when: false

- name: Render and verify every control-plane peer
  hosts: c1_2_contract_servers
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../roles/rke2_server/defaults/main.yml"
    - "{{ playbook_dir }}/../roles/control_plane_vip/defaults/main.yml"
  vars:
    ansible_managed: C1.2 offline contract fixture
    cluster_dns_san:
      - c12-cluster-api.invalid
    etcd_s3_endpoint: s3.c1-2.invalid
    etcd_s3_bucket: c12-etcd
    etcd_s3_access_key: C12_ACCESS_KEY
    etcd_s3_secret_key: C12_SECRET_KEY
  tasks:
    - name: Apply the production-like VIP fixture over role defaults
      ansible.builtin.set_fact:
        control_plane_vip_enabled: true
        control_plane_vip_address: 10.10.0.10
        control_plane_vip_interface: enp1s0
        control_plane_vip_prefix_length: 24
        control_plane_vip_virtual_router_id: 42
        control_plane_api_dns_name: api.c1-2.invalid
        cluster_dns_san:
          - c12-cluster-api.invalid
        rke2_install_artifact_url: https://prime.c1-2.invalid/rke2
        rke2_system_default_registry: registry.rancher.com

    - name: Derive the same deterministic peer order as the VIP role
      ansible.builtin.set_fact:
        control_plane_vip_server_hosts: >-
          {{ groups['rke2_servers'] | sort }}

    - name: Derive this peer's deterministic priority
      ansible.builtin.set_fact:
        control_plane_vip_effective_priority: >-
          {{
            control_plane_vip_priority_base
            - (
              control_plane_vip_server_hosts.index(inventory_hostname)
              * control_plane_vip_priority_step
            )
          }}

    - name: Render the server, keepalived, and health-check templates
      ansible.builtin.set_fact:
        c12_server_config_text: >-
          {{
            lookup(
              'ansible.builtin.template',
              playbook_dir ~ '/../roles/rke2_server/templates/config.yaml.j2'
            )
          }}
        c12_keepalived_config_text: >-
          {{
            lookup(
              'ansible.builtin.template',
              playbook_dir ~ '/../roles/control_plane_vip/templates/keepalived.conf.j2'
            )
          }}
        c12_health_check_text: >-
          {{
            lookup(
              'ansible.builtin.template',
              playbook_dir ~ '/../roles/control_plane_vip/templates/check-rke2-control-plane.sh.j2'
            )
          }}

    - name: Parse the rendered server configuration
      ansible.builtin.set_fact:
        c12_server_config: "{{ c12_server_config_text | from_yaml }}"
        c12_expected_server_sans: >-
          {{
            [
              control_plane_vip_address,
              control_plane_api_dns_name,
              'c12-cluster-api.invalid'
            ]
            + groups['rke2_servers']
            + (
              groups['rke2_servers']
              | map('extract', hostvars, 'ansible_host')
              | list
            )
          }}
        c12_expected_peer_addresses: >-
          {{
            (
              groups['rke2_servers']
              | map('extract', hostvars, 'ansible_host')
              | list
            )
            | difference([ansible_host])
          }}

    - name: Verify bootstrap and joiner registration contracts
      ansible.builtin.assert:
        that:
          - "'token' not in c12_server_config"
          - c12_server_config['token-file'] == rke2_token_input_file
          - rke2_cluster_token not in c12_server_config_text
          - >-
            c12_server_config['system-default-registry']
            == 'registry.rancher.com'
          - >-
            (
              rke2_bootstrap | bool
              and c12_server_config.get('server', '') == ''
            )
            or
            (
              not (rke2_bootstrap | bool)
              and c12_server_config.get('server', '') == 'https://10.10.0.10:9345'
            )
          - >-
            c12_expected_server_sans
            | difference(c12_server_config.get('tls-san', []))
            | length == 0
          - >-
            'topology.kubernetes.io/region=' ~ inventory_region
            in c12_server_config.get('node-label', [])
          - >-
            'topology.kubernetes.io/zone=' ~ inventory_zone
            in c12_server_config.get('node-label', [])
          - >-
            'topology.kubernetes.io/region=default'
            not in c12_server_config.get('node-label', [])
          - >-
            'topology.kubernetes.io/zone=default'
            not in c12_server_config.get('node-label', [])
        fail_msg: >-
          {{ inventory_hostname }} violates the pre-shared-token, VIP registration,
          required failure-domain label, or complete TLS SAN contract.

    - name: Verify keepalived peer and hysteresis contracts
      ansible.builtin.assert:
        that:
          - >-
            (
              c12_keepalived_config_text
              | regex_search('(?m)^\\s*state\\s+BACKUP\\s*$')
            ) is not none
          - >-
            (
              c12_keepalived_config_text
              | regex_search('(?m)^\\s*vrrp_version\\s+3\\s*$')
            ) is not none
          - >-
            (
              c12_keepalived_config_text
              | regex_search('(?m)^\\s*nopreempt\\s*$')
            ) is not none
          - >-
            (
              c12_keepalived_config_text
              | regex_search(
                  '(?m)^\\s*priority\\s+'
                  ~ (c12_expected_priority | string)
                  ~ '\\s*$'
                )
            ) is not none
          - >-
            (
              c12_keepalived_config_text
              | regex_search(
                  '(?m)^\\s*unicast_src_ip\\s+'
                  ~ ansible_host
                  ~ '\\s*$'
                )
            ) is not none
          - >-
            (
              c12_keepalived_config_text
              | regex_search('(?m)^\\s*unicast_peer\\s*\\{\\s*$')
            ) is not none
          - >-
            (
              c12_keepalived_config_text
              | regex_findall(
                  ansible_host | regex_escape
                )
              | length
            ) == 1
          - >-
            (
              c12_keepalived_config_text
              | regex_search(
                  '(?m)^\\s*'
                  ~ control_plane_vip_address
                  ~ '/'
                  ~ (control_plane_vip_prefix_length | string)
                  ~ '\\s+dev\\s+'
                  ~ control_plane_vip_interface
                  ~ '\\s*$'
                )
            ) is not none
          - >-
            (
              c12_keepalived_config_text
              | regex_search('(?m)^\\s*fall\\s+[2-9][0-9]*\\s*$')
            ) is not none
          - >-
            (
              c12_keepalived_config_text
              | regex_search('(?m)^\\s*rise\\s+[2-9][0-9]*\\s*$')
            ) is not none
          - >-
            (
              c12_keepalived_config_text
              | regex_search('(?m)^\\s*track_script\\s*\\{')
            ) is not none
          - >-
            (
              c12_keepalived_config_text
              | regex_search('(?m)^\\s*init_fail\\s*$')
            ) is not none
          - >-
            (
              c12_keepalived_config_text
              | regex_search('(?m)^\\s*track_src_ip\\s*$')
            ) is not none
        fail_msg: >-
          {{ inventory_hostname }} violates the all-BACKUP, unicast, nopreempt,
          deterministic-priority, VIP, source tracking, initial-failure, or
          fail/rise keepalived contract.

    - name: Verify every expected unicast peer is present
      ansible.builtin.assert:
        that:
          - >-
            (
              c12_keepalived_config_text
              | regex_search(
                  '(?m)^\\s*'
                  ~ item
                  ~ '\\s*$'
                )
            ) is not none
        fail_msg: >-
          {{ inventory_hostname }} is missing unicast peer {{ item }}.
      loop: "{{ c12_expected_peer_addresses }}"

    - name: Verify the local readiness gate
      ansible.builtin.assert:
        that:
          - >-
            'curl -kfsS' in c12_health_check_text
            or
            (
              'curl --insecure --fail --silent --show-error'
              in c12_health_check_text
            )
          - "'--connect-timeout' in c12_health_check_text"
          - "'--max-time' in c12_health_check_text"
          - "'https://127.0.0.1:6443/readyz' in c12_health_check_text"
          - "'timeout ' in c12_health_check_text"
          - "'/dev/tcp/127.0.0.1/9345' in c12_health_check_text"
          - "'/dev/tcp/127.0.0.1/6443' not in c12_health_check_text"
        fail_msg: >-
          The VIP health check must use strict-timeout HTTPS /readyz plus local
          TCP 9345; a bare API listener is not sufficient.

- name: Render and verify the worker registration contract
  hosts: c1_2_contract_agents
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../roles/rke2_agent/defaults/main.yml"
  vars:
    ansible_managed: C1.2 offline contract fixture
  tasks:
    - name: Apply the production-like registration fixture over role defaults
      ansible.builtin.set_fact:
        control_plane_vip_enabled: true
        control_plane_vip_address: 10.10.0.10
        rke2_cluster_token: >-
          K10aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa::server:C12_OFFLINE_CONTRACT_TOKEN
        rke2_cluster_token_mode: steady_state_exact
        rke2_install_artifact_url: https://prime.c1-2.invalid/rke2
        rke2_system_default_registry: registry.rancher.com

    - name: Render the agent configuration
      ansible.builtin.set_fact:
        c12_agent_config_text: >-
          {{
            lookup(
              'ansible.builtin.template',
              playbook_dir ~ '/../roles/rke2_agent/templates/config.yaml.j2'
            )
          }}

    - name: Parse the rendered agent configuration
      ansible.builtin.set_fact:
        c12_agent_config: "{{ c12_agent_config_text | from_yaml }}"

    - name: Verify the agent uses the VIP and pre-shared token
      ansible.builtin.assert:
        that:
          - c12_agent_config.server == 'https://10.10.0.10:9345'
          - "'token' not in c12_agent_config"
          - c12_agent_config['token-file'] == rke2_agent_token_file
          - rke2_cluster_token not in c12_agent_config_text
          - >-
            c12_agent_config['system-default-registry']
            == 'registry.rancher.com'
          - >-
            'topology.kubernetes.io/region=' ~ inventory_region
            in c12_agent_config.get('node-label', [])
          - >-
            'topology.kubernetes.io/zone=' ~ inventory_zone
            in c12_agent_config.get('node-label', [])
          - >-
            'topology.kubernetes.io/region=default'
            not in c12_agent_config.get('node-label', [])
          - >-
            'topology.kubernetes.io/zone=default'
            not in c12_agent_config.get('node-label', [])
        fail_msg: >-
          The agent default must use the VIP registration URL, vault-backed
          pre-shared token, and required truthful failure-domain labels.

- name: Verify repository-level C1.2 inertness and placement contracts
  hosts: localhost
  gather_facts: false
  vars:
    c12_repo_root: "{{ playbook_dir }}/../../.."
    c12_platform_application_documents: >-
      {{
        lookup(
          'ansible.builtin.file',
          playbook_dir ~
          '/../../kubernetes/base/argocd/applications/platform.yaml'
        )
        | from_yaml_all
        | reject('equalto', none)
        | selectattr('kind', 'equalto', 'Application')
        | list
      }}
    c12_workload_application_documents: >-
      {{
        lookup(
          'ansible.builtin.file',
          playbook_dir ~
          '/../../kubernetes/base/argocd/applications/apps.yaml'

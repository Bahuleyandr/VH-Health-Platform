  tasks:
    - name: Pin the frozen operator playbook sources
      ansible.builtin.assert:
        that:
          - >-
            c12_upgrade_playbook_raw | hash('sha256') | upper
            == c12_expected_upgrade_playbook_sha256
          - >-
            c12_node_replace_playbook_raw | hash('sha256') | upper
            == c12_expected_node_replace_playbook_sha256
          - >-
            c12_server_install_raw | hash('sha256') | upper
            == c12_expected_server_install_sha256
          - >-
            c12_server_preflight_raw | hash('sha256') | upper
            == c12_expected_server_preflight_sha256
          - >-
            c12_agent_tasks_raw | hash('sha256') | upper
            == c12_expected_agent_tasks_sha256
        fail_msg: >-
          An operator playbook or shared RKE2 install-role source changed after
          the final contract freeze; remap every safety invariant and update
          the pinned hashes.

    - name: Verify all four top-level Argo Applications remain manual-sync
      ansible.builtin.assert:
        that:
          - >-
            c12_top_level_application_documents
            | map(attribute='metadata.name')
            | sort
            | list
            ==
            [
              'vhhealth-apps',
              'vhhealth-kube-prometheus',
              'vhhealth-loki',
              'vhhealth-platform'
            ]
          - item.spec.syncPolicy.automated is not defined
        fail_msg: >-
          The top-level Argo Application set must remain exactly four
          manual-sync Applications.
      loop: "{{ c12_top_level_application_documents }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: Verify the Longhorn child Application remains manual-sync
      ansible.builtin.assert:
        that:
          - c12_longhorn_application.kind == 'Application'
          - c12_longhorn_application.metadata.name == 'longhorn'
          - c12_longhorn_application.spec.syncPolicy.automated is not defined
        fail_msg: >-
          The Longhorn child Application must be present and manual-sync.

    - name: Verify backend and CNPG placement contracts
      ansible.builtin.assert:
        that:
          - c12_cnpg_cluster_documents | length == 1
          - c12_hostname_spread_constraints | length == 1
          - c12_hostname_spread_constraints[0].maxSkew == 1
          - >-
            c12_hostname_spread_constraints[0].whenUnsatisfiable
            == 'DoNotSchedule'
          - c12_hostname_spread_constraints[0].nodeTaintsPolicy == 'Honor'
          - c12_zone_spread_constraints | length == 1
          - c12_zone_spread_constraints[0].maxSkew == 1
          - >-
            c12_zone_spread_constraints[0].whenUnsatisfiable
            == 'ScheduleAnyway'
          - c12_cnpg_cluster.spec.affinity.enablePodAntiAffinity | bool
          - >-
            c12_cnpg_cluster.spec.affinity.topologyKey
            == 'kubernetes.io/hostname'
          - >-
            c12_cnpg_cluster.spec.affinity.podAntiAffinityType
            == 'required'
        fail_msg: >-
          Backend hostname spreading must be hard and zone spreading
          best-effort; CNPG must require one instance per hostname.

    - name: Verify storage remains inert and truthful
      ansible.builtin.assert:
        that:
          - c12_cnpg_cluster.spec.storage.storageClass == 'local-path'
          - c12_cnpg_cluster.spec.walStorage.storageClass == 'local-path'
          - c12_three_replica_longhorn_classes | length == 1
          - >-
            c12_three_replica_longhorn_classes[0].parameters.numberOfReplicas
            == '3'
          - >-
            'longhorn-pvc-patch.yaml'
            not in (
              c12_prod_kustomization.patches
              | default([], true)
              | to_json
            )
          - "'longhorn-nvme' not in c12_storage_truth_text"
          - >-
            (
              c12_storage_truth_text
              | regex_search('(?i)\\bdelete\\s+and\\s+restore\\b')
            ) is none
        fail_msg: >-
          C1.2 must leave CNPG data and WAL on local-path, keep the Longhorn
          migration patch inactive, and use only the real longhorn class name.

    - name: Verify the firewall cannot erase or compete with Kubernetes rules
      ansible.builtin.assert:
        that:
          - >-
            (
              c12_firewall_source
              | regex_search('(?im)^\\s*flush\\s+ruleset\\s*$')
            ) is none
          - >-
            (
              c12_firewall_source
              | regex_search(
                  '(?im)^\\s*type\\s+filter\\s+hook\\s+forward\\b'
                )
            ) is none
          - >-
            (
              c12_firewall_source
              | regex_search(
                  '(?im)^\\s*destroy\\s+table\\s+inet\\s+vhhealth\\s*$'
                )
            ) is not none
        fail_msg: >-
          The host firewall must not globally flush nftables or install a
          competing forward base chain beside kube-proxy and the CNI; it may
          replace only its own inet vhhealth table.

    - name: Verify real-interface VIP validation precedes firewall mutation
      ansible.builtin.assert:
        that:
          - >-
            '- name: Resolve the selected interface address and declared peer addresses'
            in c12_site_playbook_source
          - >-
            "interface_facts['ipv4_secondaries'] | default([])"
            in c12_site_playbook_source
          - >-
            'c1_2_control_plane_unicast_prefixes | length == 1'
            in c12_site_playbook_source
          - >-
            'c1_2_control_plane_unicast_prefixes | first | int'
            in c12_site_playbook_source
          - >-
            '== control_plane_vip_prefix_length | int'
            in c12_site_playbook_source
          - >-
            'c1_2_vip_cluster_scope_matches | length == 1'
            in c12_site_playbook_source
          - >-
            'c1_2_unicast_cluster_scope_matches | length == 1'
            in c12_site_playbook_source
          - >-
            'difference(c1_2_peer_cluster_scope_matches)'
            in c12_site_playbook_source
          - >-
            (
              c12_site_playbook_source
              | regex_findall("ansible\\.utils\\.ipaddr\\('network'\\)")
              | length
            ) >= 4
          - >-
            c12_site_playbook_source.find(
              '- name: Bind the declared VIP prefix to the selected interface address'
            )
            <
            c12_site_playbook_source.find(
              '    - role: firewall'
            )
          - >-
            c12_site_playbook_source.find(
              '- name: Require every VRRP peer to share the real interface subnet'
            )
            <
            c12_site_playbook_source.find(
              '    - role: firewall'
            )
          - >-
            '- name: Resolve addresses and prefixes on the control-plane interface'
            in c12_control_plane_vip_tasks_source
          - >-
            "interface_facts['ipv4_secondaries'] | default([])"
            in c12_control_plane_vip_tasks_source
          - >-
            'control_plane_vip_local_unicast_prefixes | length == 1'
            in c12_control_plane_vip_tasks_source
          - >-
            '== control_plane_vip_prefix_length | int'
            in c12_control_plane_vip_tasks_source
          - >-
            'difference(control_plane_vip_firewall_scoped_addresses)'
            in c12_control_plane_vip_tasks_source
          - >-
            c12_control_plane_vip_tasks_source.find(
              '- name: Reject ambiguous control-plane addressing'
            )
            <
            c12_control_plane_vip_tasks_source.find(
              '- name: Read the active firewall before control-plane keepalived'
            )
        fail_msg: >-
          Site and control_plane_vip must bind the declared unicast source to
          its actual primary-or-secondary interface prefix, prove VIP and every
          peer share that real subnet and cluster CIDR scope, and hard-stop
          before the firewall or keepalived can be changed.

    - name: Verify tagged includes execute their tagged role tasks
      ansible.builtin.assert:
        that:
          - >-
            (
              c12_site_playbook_source
              | regex_findall(
                  '(?ms)- name: Verify the pre-shared token before any host changes'
                  ~ '.*?tasks_from: token\\.yml'
                  ~ '.*?apply:\\s*\\n\\s*tags: \\[always\\]'
                  ~ '.*?tags: \\[always, rke2, token\\]'
                )
              | length
            ) == 1
          - >-
            (
              c12_site_playbook_source
              | regex_findall(
                  '(?ms)- name: Configure the control-plane VIP'
                  ~ '.*?name: control_plane_vip'
                  ~ '.*?apply:\\s*\\n\\s*tags: \\[control_plane_vip\\]'
                  ~ '.*?tags: \\[control_plane_vip\\]'
                )
              | length
            ) == 2
          - >-
            (
              c12_site_playbook_source
              | regex_findall('(?m)^  serial: 1\\s*$')
              | length
            ) >= 3
        fail_msg: >-
          Tagged token and VIP include_role calls must use apply.tags so
          --tags executes the selected role tasks, and server mutation plays
          must remain serialized.

    - name: Verify fleet-wide server and agent token identity preflight
      ansible.builtin.assert:
        that:
          - >-
            'c1_2_fleet_token_mode:'
            in c12_site_playbook_source
          - >-
            'rke2_cluster_token_mode'
            in c12_site_playbook_source
          - >-
            "rke2_cluster_token_canonical | hash('sha256')"
            in c12_site_playbook_source
          - >-
            'c1_2_fleet_existing_server_state'
            in c12_site_playbook_source
          - >-
            "map('extract', hostvars, 'c1_2_fleet_token_fingerprint')"
            in c12_site_playbook_source
          - >-
            "'c1_2_fleet_existing_server_state'"
            in c12_site_playbook_source
          - >-
            "select('equalto', true)"
            in c12_site_playbook_source
          - >-
            "select('equalto', false)"
            in c12_site_playbook_source
          - >-
            "'steady_state_exact'" in c12_site_playbook_source
          - >-
            "'fresh_short'" in c12_site_playbook_source
          - >-
            '- name: Validate every existing RKE2 agent before host changes'
            in c12_site_playbook_source
          - >-
            "[rke2_cluster_token | string | hash('sha256')]"
            in c12_site_playbook_source
          - >-
            '- name: Reject agent data without recoverable registration identity'
            in c12_site_playbook_source
          - >-
            "regex_replace('[\\r\\n]+$', '')"
            in c12_site_playbook_source
          - >-
            'c1_2_agent_preflight_existing_token'
            in c12_site_playbook_source
          - >-
            '== (rke2_cluster_token | string)'
            in c12_site_playbook_source
          - >-
            (
              c12_site_playbook_source
              | regex_findall('(?m)^\\s+no_log:\\s+true\\s*$')
              | length
            ) >= 8
        fail_msg: >-
          Site preflight must bind one protected token fingerprint and
          datastore phase across all servers, then prove every existing agent's
          recoverable registration identity and exact token before host roles.

    - name: Verify fixed protected Vault artifact sources
      ansible.builtin.assert:
        that:
          - >-
            'inventory_dir }}/group_vars/all/vault.yml'
            in c12_upgrade_playbook_source
          - >-
            'name: c1_2_upgrade_vault_file'
            in c12_upgrade_playbook_source
          - >-
            'c1_2_upgrade_vault_file.vault_rke2_prime_artifact_url'
            in c12_upgrade_playbook_source
          - >-
            (
              'c1_2_upgrade_vault_file'
              ~ '\n            .vault_rke2_prime_artifact_sha256_by_architecture'
            ) in c12_upgrade_playbook_source
          - >-
            (
              'vault_rke2_prime_artifact_sha256_by_architecture '
              ~ '| default({})'
            ) in c12_upgrade_playbook_source
          - >-
            'rke2_prime_artifact_sha256_by_architecture is not defined'
            in c12_upgrade_playbook_source
          - >-
            'c1_2_upgrade_vault_file.vault_rke2_cluster_token'
            in c12_upgrade_playbook_source
          - >-
            "rke2_cluster_token | default('')"
            in c12_upgrade_playbook_source
          - >-
            '== c1_2_upgrade_protected_token'
            in c12_upgrade_playbook_source
          - >-
            'rke2_upgrade_artifact_url is not defined'
            in c12_upgrade_playbook_source
          - >-
            (
              "rke2_install_artifact_url | default('') | string | length == 0"
            )
            in c12_upgrade_playbook_source
          - >-
            c12_prod_inventory.all.vars.rke2_install_artifact_url == ''
          - >-
            'playbook_dir }}/../inventories/group_vars/all/vault.yml'
            in c12_node_replace_playbook_source
          - >-
            'name: c1_2_protected_vault'
            in c12_node_replace_playbook_source
          - >-
            'c1_2_protected_vault.vault_rke2_prime_artifact_url'
            in c12_node_replace_playbook_source
          - >-
            'c1_2_protected_vault.vault_rke2_cluster_token'
            in c12_node_replace_playbook_source
          - >-
            'rke2_replacement_artifact_url is not defined'
            in c12_node_replace_playbook_source
          - >-
            c12_node_prime_replacement_rejection_block | length > 0
          - >-
            'rke2_install_artifact_url'
            in c12_node_prime_replacement_rejection_block
          - >-
            '| length == 0'
            in c12_node_prime_replacement_rejection_block
          - >-
            'c1_2_replacement_artifact_url | string | length == 0'
            in c12_node_prime_replacement_rejection_block
          - >-
            (
              c12_upgrade_playbook_source
              | regex_search(
                  '(?s)c1_2_upgrade_artifact_url:\\s*>-\\s*'
                  ~ '\\{\\{\\s*rke2_upgrade_artifact_url'
                )
            ) is none
          - >-
            (
              c12_node_replace_playbook_source
              | regex_search(
                  '(?s)c1_2_replacement_artifact_url:\\s*>-\\s*'
                  ~ '\\{\\{\\s*rke2_replacement_artifact_url'
                )
            ) is none
        fail_msg: >-
          Upgrade and replacement must load artifact identity from the fixed
          protected Vault file. Upgrade alone may stage the two legacy Prime
          artifacts; replacement must reject every inventory or protected
          artifact URL before touching a host.

    - name: Verify protected secret files and explicit token modes
      ansible.builtin.assert:
        that:
          - >-
            c12_server_token_write_task['ansible.builtin.copy'].mode == '0600'
          - >-
            not (
              c12_server_token_write_task['ansible.builtin.copy'].backup
              | bool
            )
          - not (c12_server_token_write_task.diff | bool)
          - c12_server_token_write_task.no_log | bool
          - c12_server_s3_write_task['ansible.builtin.copy'].mode == '0600'
          - >-
            not (
              c12_server_s3_write_task['ansible.builtin.copy'].backup
              | bool
            )
          - not (c12_server_s3_write_task.diff | bool)
          - c12_server_s3_write_task.no_log | bool
          - >-
            c12_agent_token_write_task['ansible.builtin.copy'].mode == '0600'
          - >-
            not (
              c12_agent_token_write_task['ansible.builtin.copy'].backup
              | bool
            )
          - not (c12_agent_token_write_task.diff | bool)
          - c12_agent_token_write_task.no_log | bool
          - >-
            not (
              c12_agent_config_render_task['ansible.builtin.template'].backup
              | bool
            )
          - not (c12_agent_config_render_task.diff | bool)
          - c12_agent_config_render_task.no_log | bool
          - >-
            'rke2_cluster_token | string == '
            ~ '(rke2_cluster_token | string | trim)'
            in c12_server_token_source
          - >-
            "regex_search('^K10[0-9a-fA-F]{64}::server:\\S+$')"
            in c12_server_token_source
          - >-
            'rke2_existing_token_value == rke2_cluster_token_canonical'
            in c12_server_token_source
          - "'::server:' in c12_server_token_source"
          - >-
            (
              c12_server_token_source
              | regex_search(
                  '(?s)rke2_existing_token_blob\\.content'
                  ~ '.{0,240}?\\|\\s*trim\\b'
                )
            ) is none
          - "'rke2_agent_allow_token_rotation' in c12_agent_tasks_source"
          - >-
            'rke2_agent_existing_token_value == '
            ~ '(rke2_agent_token | string)'
            in c12_agent_tasks_source
          - >-
            c12_dev_inventory.all.vars.rke2_cluster_token_mode
            == 'development_short'
          - >-
            not (
              c12_dev_inventory.all.vars.control_plane_vip_enabled
              | bool
            )
          - >-
            c12_dev_inventory.all.children.rke2_servers.hosts
            | length == 1
          - >-
            c12_prod_inventory.all.vars.rke2_cluster_token_mode
            == 'steady_state_exact'
          - >-
            (
              c12_prod_inventory_source
              | regex_search(

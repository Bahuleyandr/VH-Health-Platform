    c12_agent_defaults_source: >-
      {{
        lookup(
          'ansible.builtin.file',
          playbook_dir ~ '/../roles/rke2_agent/defaults/main.yml'
        )
      }}
    c12_site_playbook_source: >-
      {{
        lookup(
          'ansible.builtin.file',

apiVersion: v1
kind: ConfigMap
metadata:
  name: vhhealth-admin-config
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: vhhealth-admin
    app.kubernetes.io/component: admin
    app.kubernetes.io/part-of: vhhealth
data:
  # Next.js runtime
  NODE_ENV: "production"
  PORT: "3001"
  HOSTNAME: "0.0.0.0"
  NEXT_TELEMETRY_DISABLED: "1"

  # ---- Public runtime env (exposed to the browser by Next.js) ----
  # IMPORTANT: NEXT_PUBLIC_* vars are baked into the client bundle at BUILD
  # time, not read from env at container start. These values will ONLY take
  # effect if the image was built with them (see apps/admin/Dockerfile ARGs).
  # For runtime-switchable config, use server components or a config API.
  NEXT_PUBLIC_API_URL: "https://api.vhhealth.app"
  NEXT_PUBLIC_APP_NAME: "VH Health Admin"
  NEXT_PUBLIC_ALLOWED_ORIGIN: "https://admin.vhhealth.app"
  ADMIN_CANONICAL_ORIGIN: "https://admin.vhhealth.app"

  # Firebase client SDK config (values ARE public by design — see
  # firebase.google.com/docs/projects/api-keys; the apiKey is a public
  # identifier, not a credential. Server-side admin auth is what matters).
  # Kept here for rotation workflow; overlay per env.
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: "vh-health-prod"
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "vh-health-prod.firebaseapp.com"
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "vh-health-prod.appspot.com"
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
  NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"

  # Sentry release tagging (non-secret — DSN + auth token are Secret)
  NEXT_PUBLIC_SENTRY_ENVIRONMENT: "production"
  SENTRY_ORG: "vh-health"
  SENTRY_PROJECT: "vhhealth-admin"
  SENTRY_ENVIRONMENT: "production"

  # IP allowlist. Production middleware fails closed when this is empty.
  # Comma-separated exact IPs or IPv4 CIDRs allowed through middleware.ts
  # before auth.
  ADMIN_IP_ALLOWLIST: ""

  # Embedded BI (NL-10) — the browser-facing origin of the LAN Metabase
  # ingress (https://analytics.vhhealth.hospital.local once the optional
  # metabase module is enabled). Read by middleware.ts to extend the CSP
  # frame-src so the BI Dashboards page can render signed embeds. Empty =
  # dark: the CSP stays at frame-src 'self' and no Metabase frame can load.
  # NOTE: like all NEXT_PUBLIC_* values this is baked at image BUILD time
  # (see the block comment above) — set it as a build ARG too when enabling.
  NEXT_PUBLIC_METABASE_ORIGIN: ""

  # Backend URL used server-side by /api/proxy, /api/login, /api/refresh
  # (read by getServerBackendUrl() in src/lib/api-config.ts as BACKEND_URL).
  # Points at the in-cluster backend Service to skip the public ingress.
  # This is the cluster-internal companion of NEXT_PUBLIC_API_URL (which is
  # only used by client-side code that can't reach the cluster service).
  BACKEND_URL: "http://vhhealth-backend.vhhealth.svc.cluster.local"

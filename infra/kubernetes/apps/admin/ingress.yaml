apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vhhealth-admin
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Admin is SSR Next.js — uploads are proxied through /api/proxy and can
    # include patient document attachments. Match backend's 50m cap.
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    # Admin doesn't issue cross-origin requests to other domains (it talks to
    # backend via same-origin /api/proxy). Leave the browser-side CORS
    # enforcement untouched.
    nginx.ingress.kubernetes.io/enable-cors: "false"
    # Security headers — stricter than the backend because this serves HTML.
    # NOTE: Content-Security-Policy is deliberately NOT set here. admin's
    # src/middleware.ts emits a per-request nonce CSP ('strict-dynamic', no
    # 'unsafe-inline') on every response (matcher covers every route incl.
    # /login). `more_set_headers` REPLACES the upstream header, so setting a
    # CSP at this ingress would clobber the nonce and force the browser onto a
    # weaker 'unsafe-inline' policy — defeating the M9 XSS backstop. We keep
    # only the static, non-nonce security headers here (they guard the first
    # byte during rollouts); the nonce CSP flows through from the pod.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: geolocation=(), microphone=(), camera=()";
    nginx.ingress.kubernetes.io/limit-connections: "30"
    nginx.ingress.kubernetes.io/limit-rpm: "300"
  labels:
    app.kubernetes.io/name: vhhealth-admin
    app.kubernetes.io/component: admin
    app.kubernetes.io/part-of: vhhealth
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - admin.vhhealth.app
      secretName: vhhealth-admin-tls
  rules:
    - host: admin.vhhealth.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vhhealth-admin
                port:
                  number: 80
    # Multi-tenancy W5/W7 (FLAT model): the admin portal stays SINGLE-HOST at
    # admin.vhhealth.app. The admin's tenant + branding are driven by the JWT
    # (W5 — token tenant_id + /admin/tenant-context), so per-tenant admin
    # subdomains aren't needed (and a K8s Ingress can't wildcard-route `*-admin`
    # anyway). This more-specific `admin.vhhealth.app` rule wins over the
    # backend's `*.vhhealth.app` wildcard.

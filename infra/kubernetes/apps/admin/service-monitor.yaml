# ServiceMonitor for the admin portal.
#
# STATUS: Admin does NOT yet expose a /metrics endpoint (verified 2026-04-23:
# only /api/login, /api/logout, /api/refresh, /api/proxy, /api/realtime-ticket
# exist under apps/admin/src/app/api/). Shipping the ServiceMonitor anyway so
# scraping is wired up the day a /api/metrics route lands. Until then,
# Prometheus will record the target as down — harmless; the admin is not
# on-call. Add `/api/metrics` and a `prom-client` default collector to bring
# this live.
#
# Track at: TODO in apps/admin/src/app/api/ — add metrics route.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vhhealth-admin
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    vhhealth.app/pending-implementation: "admin /api/metrics endpoint not yet exposed"
  labels:
    app.kubernetes.io/name: vhhealth-admin
    app.kubernetes.io/component: admin
    app.kubernetes.io/part-of: vhhealth
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vhhealth-admin
  namespaceSelector:
    matchNames:
      - vhhealth
  endpoints:
    - port: http
      path: /api/metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace

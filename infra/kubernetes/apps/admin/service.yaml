apiVersion: v1
kind: Service
metadata:
  name: vhhealth-admin
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: vhhealth-admin
    app.kubernetes.io/component: admin
    app.kubernetes.io/part-of: vhhealth
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vhhealth-admin
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  sessionAffinity: None

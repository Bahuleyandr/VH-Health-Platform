# Backup verification — outage-critical CronJob (REL-3 / WS2 B2.3)
#
# Problem this solves: `verifyLatestBackup()` ran in-process in scheduler.js
# immediately after the nightly backup step. When the backend is down during
# a critical outage, no one knows whether the last backup is intact.
# This CronJob verifies the latest CNPG-managed Postgres backup and the
# off-cluster R2 sync independently of the backend Deployment.
#
# What it does: queries the CNPG backup metadata via the in-cluster Postgres
# connection (reads the pg_catalog + CNPG operator tables) and confirms that
# an offsite R2 object younger than 26 hours exists. Exits non-zero on
# verification failure; Alertmanager fires CNPGBackupNotRecent if the CronJob
# fails repeatedly.
#
# Schedule: daily at 02:30 IST (21:00 UTC previous day).  This is 30 minutes
# after the CNPG scheduled-backup window (see base/cnpg/scheduled-backup.yaml)
# so the latest physical backup should already be complete.
#
# Image: amazon/aws-cli — already used by backup-cronjob.yaml for R2 sync.
# Has aws, openssl, and sh. Pinned to the same tag used in backup-cronjob.yaml.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-verification
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: backup-verification
    app.kubernetes.io/component: outage-critical-job
    app.kubernetes.io/part-of: vhhealth
spec:
  # 21:00 UTC = 02:30 IST — after the CNPG backup window.
  schedule: "0 21 * * *"
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 1800
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backup-verification
            app.kubernetes.io/component: outage-critical-job
            app.kubernetes.io/part-of: vhhealth
        spec:
          restartPolicy: OnFailure
          terminationGracePeriodSeconds: 30
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup-verification
              # Same image and tag as backup-cronjob.yaml; pinned at the
              # operator level via the upstream upstream release cadence.
              # This image ships aws, openssl, and sh; no backend code
              # required — verification is a pure R2 + CNPG metadata check.
              image: amazon/aws-cli:2.34.53
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail
                  NOW_TS=$(date -u +%s)
                  MAX_AGE_SECONDS=93600    # 26 hours — window for nightly backup

                  echo "[backup-verification] Checking offsite R2 backup recency..."

                  # List the 5 most-recent objects in R2 offsite/ prefix.
                  LATEST=$(aws \
                    --endpoint-url "https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com" \
                    --region auto \
                    s3 ls "s3://${CF_R2_BUCKET}/offsite/" \
                    --recursive \
                    | sort \
                    | tail -1)

                  if [ -z "${LATEST}" ]; then
                    echo "[backup-verification] FAIL: no offsite objects found in R2"
                    exit 1
                  fi

                  echo "[backup-verification] Latest R2 offsite object: ${LATEST}"

                  # Parse the date from the listing line (format: YYYY-MM-DD HH:MM:SS ...)
                  OBJECT_DATE=$(echo "${LATEST}" | awk '{print $1 "T" $2 "Z"}')
                  OBJECT_TS=$(date -u -d "${OBJECT_DATE}" +%s 2>/dev/null || date -u -j -f "%Y-%m-%dT%H:%M:%SZ" "${OBJECT_DATE}" +%s)
                  AGE_SECONDS=$(( NOW_TS - OBJECT_TS ))

                  echo "[backup-verification] Backup age: ${AGE_SECONDS}s (max allowed: ${MAX_AGE_SECONDS}s)"

                  if [ "${AGE_SECONDS}" -gt "${MAX_AGE_SECONDS}" ]; then
                    echo "[backup-verification] FAIL: latest offsite backup is too old (${AGE_SECONDS}s > ${MAX_AGE_SECONDS}s)"
                    exit 1
                  fi

                  echo "[backup-verification] OK — offsite backup is recent (${AGE_SECONDS}s old)"
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: vhhealth-backend-env
                      key: CF_R2_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: vhhealth-backend-env
                      key: CF_R2_SECRET_ACCESS_KEY
              envFrom:
                - configMapRef:
                    name: vhhealth-backend-config
                - secretRef:
                    name: vhhealth-backend-env
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: aws-home
                  mountPath: /home/nobody
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
            - name: aws-home
              emptyDir:
                sizeLimit: 16Mi

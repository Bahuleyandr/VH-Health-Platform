# Verifies every encrypted MinIO off-site archive window independently of the
# backend Deployment and independently of the write-capable producer identity.
#
# The R2 reader init phase lists/heads/downloads with the dedicated read-only
# identity. The crypto-only main container then validates metadata and age,
# compares size and SHA-256, authenticates the canonical metadata, archive key,
# and ciphertext with an independent HMAC key, decrypts, checks the tar stream,
# and reconciles the decrypted object count. It does not query CNPG: database
# backup verification belongs to the Barman plugin workloads in base/cnpg.
#
# The download work volume is capped at 10Gi. Production activation is blocked
# unless the observed encrypted archive plus safety margin fits; the reader
# checks ContentLength and fails before download when the limit would be crossed.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-verification
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: backup-verification
    app.kubernetes.io/component: backup-archive-verifier
    app.kubernetes.io/part-of: vhhealth
spec:
  # Producer starts at minute 0 every six hours and has a one-hour deadline.
  # Verify 105 minutes later so a delayed producer can finish, while the
  # three-hour freshness bound still rejects the preceding six-hour window.
  schedule: "45 1,7,13,19 * * *"
  timeZone: "Asia/Kolkata"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 1800
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backup-verification
            app.kubernetes.io/component: backup-archive-verifier
            app.kubernetes.io/part-of: vhhealth
        spec:
          serviceAccountName: vhhealth-backup-verifier
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          terminationGracePeriodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: archive-reader
              image: docker.io/amazon/aws-cli:2.34.53@sha256:cf53765c0de54ad3a8ea21818f1c4c845a8cf7ca87831c078a00fef244031493
              imagePullPolicy: IfNotPresent
              command:
                - /bin/bash
                - /opt/vhhealth/backup/verify-upload-archive.sh
                - fetch
              env:
                - name: HOME
                  value: /home/aws
                - name: AWS_EC2_METADATA_DISABLED
                  value: "true"
                - name: R2_ENDPOINT
                  value: https://dbe488236c64499a3dfc797a750c912d.r2.cloudflarestorage.com
                - name: R2_BUCKET
                  valueFrom:
                    configMapKeyRef:
                      name: vhhealth-backend-config
                      key: CF_R2_BUCKET
                - name: R2_PREFIX
                  valueFrom:
                    configMapKeyRef:
                      name: vhhealth-backend-config
                      key: OFFSITE_BACKUP_PREFIX
                - name: R2_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: offsite-backup-reader
                      key: ACCESS_KEY_ID
                - name: R2_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: offsite-backup-reader
                      key: SECRET_ACCESS_KEY
                - name: BACKUP_WORK_LIMIT_BYTES
                  valueFrom:
                    configMapKeyRef:
                      name: vhhealth-backend-config
                      key: BACKUP_WORK_LIMIT_BYTES
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: scripts
                  mountPath: /opt/vhhealth/backup
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: aws-home
                  mountPath: /home/aws
          containers:
            - name: backup-verification
              image: docker.io/alpine/openssl:3.5.7@sha256:045a40a53b8e283cff95052e0c39f256b7467d48c7445260d4f180fc0e767999
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - /opt/vhhealth/backup/verify-upload-archive.sh
                - verify
              env:
                - name: BACKUP_ENCRYPTION_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-crypto
                      key: BACKUP_ENCRYPTION_KEY
                - name: BACKUP_HMAC_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-crypto
                      key: BACKUP_HMAC_KEY
                - name: EXPECTED_SOURCE_BUCKET
                  valueFrom:
                    configMapKeyRef:
                      name: vhhealth-backend-config
                      key: MINIO_BACKUP_BUCKET
                - name: BACKUP_MAX_AGE_SECONDS
                  valueFrom:
                    configMapKeyRef:
                      name: vhhealth-backend-config
                      key: BACKUP_MAX_AGE_SECONDS
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: scripts
                  mountPath: /opt/vhhealth/backup
                  readOnly: true
                - name: work
                  mountPath: /work
          volumes:
            - name: scripts
              configMap:
                name: vhhealth-backup-scripts
                defaultMode: 0555
            - name: work
              emptyDir:
                sizeLimit: 10Gi
            - name: aws-home
              emptyDir:
                sizeLimit: 16Mi

apiVersion: v1
kind: ConfigMap
metadata:
  name: vhhealth-backend-config
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: vhhealth-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: vhhealth
data:
  # Core runtime — keep in sync with apps/backend/src/utils/validateEnv.js
  NODE_ENV: "production"
  PORT: "5000"
  CLUSTER_WORKERS: "2"

  # CORS — comma-separated list of allowed origins (backend reads in cors middleware)
  # Overlay overrides per environment:
  #   dev:     http://localhost:3001,http://localhost:3000
  #   staging: https://admin.staging.vhhealth.app,https://api.staging.vhhealth.app
  #   prod:    https://admin.vhhealth.app,https://vhhealth.app
  ALLOWED_ORIGINS: "https://admin.vhhealth.app,https://vhhealth.app"

  # Rate limiting — Joi schema defaults are fine; override per env if needed
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX: "100"

  # Redis Sentinel HA. Hosts are individual StatefulSet identities rather than
  # the load-balanced Service so ioredis can retry discovery across all three.
  # Passwords live in vhhealth-backend-env. REDIS_REQUIRE_SENTINEL makes a
  # missing/malformed topology a startup failure instead of a silent downgrade.
  #
  # SCOPE OF STRICTNESS (873-F2, 2026-08-15): this knob is a BOOT gate only.
  # A pod that cannot reach Redis at startup exits 1 and crash-loops into
  # visibility. It does NOT make /health/ready fail on a run-time Redis
  # outage: an already-initialized pod keeps serving degraded (fail-closed
  # rate-limit profiles answer 429, caches fall to the authoritative DB) and
  # reports the store state in the readiness payload's `degraded` block. It
  # used to also gate readiness, which meant a full Redis loss pulled every
  # pod from the Service in ~15s — converting a cache outage into the
  # hospital-wide API outage the fail-open store-loss posture exists to
  # prevent (apps/backend/src/config/rateLimitStoreLossPolicy.js).
  REDIS_REQUIRE_SENTINEL: "true"
  REDIS_SENTINEL_HOSTS: "redis-0.redis-headless.vhhealth-platform.svc.cluster.local:26379,redis-1.redis-headless.vhhealth-platform.svc.cluster.local:26379,redis-2.redis-headless.vhhealth-platform.svc.cluster.local:26379"
  REDIS_SENTINEL_MASTER: "vhhealth-primary"
  REDIS_USERNAME: "vhhealth-backend"
  REDIS_SENTINEL_USERNAME: "vhhealth-discovery"

  # Logging — Winston format (json for aggregators, pretty in dev)
  LOG_FORMAT: "json"
  LOG_LEVEL: "info"

  # NB: DATABASE_SSL_MODE and APP_VERSION used to be declared here and were
  # removed (2026-08-23 once-over) — no code and no manifest read either name.
  # TLS mode is carried in the DATABASE_URL query string (`?sslmode=require`,
  # see sealed-secret.yaml.example), and the deployed build is reported from
  # GIT_COMMIT, which the Deployment injects from the pod's
  # `app.kubernetes.io/version` label and /health/version serves. Do not
  # reinstate either name without a reader.
  PUBLIC_BASE_URL: "https://api.vhhealth.app"

  # Firebase — project ID is public; private_key + client_email live in the Secret
  FIREBASE_AUTH_ENABLED: "true"

  # SOS alert-age escalation sweep (every 2 min). "true" is also the code
  # default — this key exists so an operator can flip it to "false" and
  # restart the Deployment to stop the sweep paging the emergency team,
  # without a revert commit and a second manual ArgoCD sync. Turning it off
  # disables the HIGH-1 remediation: never-acknowledged SOS alerts stop
  # auto-escalating. Alerts still fan out at creation and stay visible on the
  # SOS dashboard. Re-enable as soon as the underlying issue is fixed.
  SOS_ALERT_AGE_ESCALATION_ENABLED: "true"

  # Cloudflare R2 — endpoint/account/bucket are not secrets. R2_ENDPOINT is the
  # exact production S3 API endpoint confirmed in the bucket's Settings → S3
  # API page. CF_R2_URL is a different value: r2Storage.js uses it as the public
  # object-download base. No public/custom-domain base is proven in-repository,
  # so it stays empty and fails closed until the operator supplies the real base
  # before activating application uploads. Credentials stay in workload-
  # specific sealed Secrets.
  CF_ACCOUNT_ID: "dbe488236c64499a3dfc797a750c912d"
  R2_ENDPOINT: "https://dbe488236c64499a3dfc797a750c912d.r2.cloudflarestorage.com"
  CF_R2_URL: ""
  CF_R2_BUCKET: "vh-health-records"
  OFFSITE_BACKUP_PREFIX: "offsite/minio-records"

  # Malware scanning posture — see apps/backend/src/config/fileScanPolicy.js.
  # THIS IS A RISK DECLARATION, NOT A TUNING KNOB.
  #
  # The application-code default is `required`, which refuses every upload when
  # no scanner answers. This cluster has NO clamd daemon deployed on any node —
  # nothing in infra/ ships one — so `required` would take every file upload and
  # every staff-message attachment to a hard 503 the moment this rolls out.
  # Setting the value here states the true, currently-accepted posture on the
  # record instead: files are stored and served with scan_status='not_scanned',
  # visibly distinct from 'clean', and the backend logs a warning naming this
  # on every pod start.
  #
  # Files already known to be malware ('quarantined') are still never served,
  # under either value.
  #
  # ▶ TO RESTORE SCANNING: deploy clamd as a node-local daemon reachable at
  #   127.0.0.1:3310 from the backend pods, then change this to "required" and
  #   sync. No code change is needed. Every caller-byte ingest path screens
  #   through the shared fileScanService, so `required` refuses unscanned
  #   uploads platform-wide at ingest. Note the bound on retro-blocking:
  #   stores WITH a per-row scan_status (generic uploads, staff-message
  #   attachments, investigation files, consent signatures, booking photos)
  #   also stop serving their never-scanned history under `required`; the
  #   remaining legacy stores (appointment documents, patient records,
  #   pharmacy/Rx photos, profile photos, proxy signatures, credential
  #   documents) have no per-row status, so their pre-existing files keep
  #   serving — see the fileScanService header for the coverage map.
  FILE_SCAN_POLICY: "disabled_accepted_risk"

  # MinIO upload archive source. Use the operator-managed `minio` Service name
  # covered by requestAutoCert; the custom `minio-api` alias is not in the
  # generated certificate SANs. This is not the CNPG physical-backup target.
  MINIO_BACKUP_ENDPOINT: "https://minio.vhhealth-platform.svc.cluster.local:443"
  MINIO_BACKUP_BUCKET: "vhhealth-records"
  # Producer runs every six hours; verification follows 105 minutes later.
  # Three hours admits the producer/verifier deadline margins but rejects the
  # preceding six-hour archive if the current producer window fails.
  BACKUP_MAX_AGE_SECONDS: "10800"
  # Must equal both backup work-volume sizeLimit values. The pre-download
  # activation gate blocks production unless source/archive projections plus
  # the scripted safety margin fit.
  BACKUP_WORK_LIMIT_BYTES: "10737418240"

  # Sentry — DSN lives in Secret; project/org are non-secret metadata for release
  SENTRY_ENVIRONMENT: "production"
  SENTRY_TRACES_SAMPLE_RATE: "0.1"

  # Admin IP allowlist. Production backend middleware fails closed when this is
  # empty; overlays/operators must set hospital VPN/admin CIDRs before admin
  # APIs are reachable.
  ADMIN_IP_ALLOWLIST: ""

  # Feature flags / timeouts that the app reads directly.
  # HTTP_BODY_LIMIT drives express.json/urlencoded (app.js). Kept conservative:
  # JSON parsing is a CPU-bound DoS surface and file uploads use multer (capped
  # at 25MB PDF / 10MB image), NOT express.json. Raise deliberately only if a
  # JSON endpoint legitimately needs larger payloads.
  HTTP_BODY_LIMIT: "1mb"
  STATEMENT_TIMEOUT_MS: "30000"
  AUTH_ENFORCE_TENANT_RLS: "true"
  # Relationship ABAC remains telemetry-gated. Keep the current rollout posture
  # explicit and run `npm run care-team:audit-enforcement-readiness` before any
  # tenant is moved to enforce; an unset value must not hide production intent.
  CARE_TEAM_ENFORCEMENT_MODE: "shadow"
  # W1 (multi-tenancy): tenant resolution fails closed by default. The current
  # single-hospital deploy opts INTO the legacy default-tenant floor so behavior
  # is unchanged; flip to "false" at the multi-tenant cutover (W7) so a request
  # that resolves no tenant 403s instead of silently acting as the default tenant.
  ALLOW_DEFAULT_TENANT: "true"
  ENABLE_AUTOMATED_PAYROLL_CRONS: "false"
  # Deliberately-off switches, pinned here so "off" is visible intent rather
  # than an absent var a future operator cannot distinguish from "forgotten"
  # (once-over 2026-08-23). Clinical-AI sweeps stay off per the rollout
  # plateau decision; the revenue-cycle tracker's ROUTES are live — this flag
  # governs only its background sweep.
  CLINICAL_AI_OPERATIONAL_ALERTS_ENABLED: "false"
  CLINICAL_AI_CODING_BATCH_ENABLED: "false"
  REVENUE_CYCLE_TRACKER_ENABLED: "false"
  # Security paging enable flag (utils/securityWebhook.js). Flip to "true"
  # AND seal SECURITY_WEBHOOK_URL (+ optional SECURITY_WEBHOOK_CRITICAL /
  # SECURITY_WEBHOOK_SECRET) in the vhhealth-backend-env Secret to page on
  # brute-force / break-glass / audit-chain-tamper events. While "false",
  # the vhhealth_security_webhook_events_total{outcome="disabled"} metric
  # counts every page that would have fired.
  SECURITY_WEBHOOKS_ENABLED: "false"

  # ---- Client force-upgrade gates (public GET /api/v1/config) ----
  # 0 = gate DISABLED, and that is a decision recorded here, not an omission.
  # Both names were read by the backend and declared in no manifest until the
  # 2026-08-23 once-over; an absent variable and a deliberately-off gate were
  # indistinguishable. The backend now also prints the resolved state of both
  # gates at every boot.
  #
  # Arming (docs/DARK_GATE_ENABLEMENT.md#6-client-force-upgrade-gates):
  #   • MIN_STAFF_VERSION_CODE — set to the minimum accepted staff build
  #     number. Safe on its own: every staff build implements the unsigned
  #     comparison and fails open when /config is unusable.
  #   • MIN_PATIENT_VERSION_CODE — COUPLED. A non-zero value REQUIRES a valid
  #     PATIENT_MINIMUM_VERSION_POLICY_JSON in the vhhealth-backend-env Secret;
  #     validateEnv refuses to boot otherwise, because fielded patient builds
  #     fail closed on a minimum they cannot verify and would block every
  #     install — including installs already above the code, and their SOS path.
  # Leave both as the string "0"; an empty value fails Joi's number check and
  # the pod will not start.
  MIN_STAFF_VERSION_CODE: "0"
  MIN_PATIENT_VERSION_CODE: "0"

  # ---- PHI shadow-column envelope encryption (migration 132) — DORMANT ----
  # Deliberately no keys here. The subsystem's two secrets (KMS_MASTER_KEY and
  # PHI_SEARCH_HASH_KEY) are NOT sealed into vhhealth-backend-env, so nothing
  # is written to the migration-132 shadow columns. That is step 1 of a four-step
  # rollout with only the dual-WRITE half wired: no read path consumes those
  # columns, so the plaintext columns remain authoritative and nothing is lost
  # by leaving it off. The backend prints "PHI shadow-column envelope
  # encryption: DORMANT by configuration" at every boot.
  #
  # ▶ TO ARM: follow docs/DARK_GATE_ENABLEMENT.md#5-phi-shadow-column-envelope-encryption.
  #   Both secrets must be sealed TOGETHER — the backend refuses to boot with
  #   exactly one of them, because the dual-write call sites swallow a
  #   missing-key error and would leave rows half-encrypted.
  #
  # Not to be confused with FIELD_ENCRYPTION_MASTER_KEK (the per-tenant KEK
  # hierarchy). That one is a Secret key, not a ConfigMap key — it belongs in
  # vhhealth-backend-env (schema: sealed-secret.yaml.example) and gates payroll
  # runs, payslip-password reveal, HL7 I03 recovery and PHI re-wrap. It is NOT
  # sealed today; the backend warns at every boot naming those paths.
  # W3-H2 (audit 2026-06-22): the base host for per-tenant subdomain resolution.
  # tenantFromHost() parses "<slug>-api.<TENANT_BASE_HOST>" → tenant slug. If this
  # is unset it falls back to "localhost", so once W7 wildcard DNS is live every
  # "<slug>-api.vhhealth.app" host fails to parse and resolves to the DEFAULT
  # tenant (a cross-tenant exposure path that also silently disables the W4
  # Host↔token cross-check). validateEnv.js fails closed in production if this is
  # unset or "localhost".
  TENANT_BASE_HOST: "vhhealth.app"
  HL7_INBOUND_ENABLED: "false"
  # Tenant-RLS runtime role (roadmap A2): tenant-scoped transactions SET LOCAL
  # ROLE to this non-owner, non-BYPASSRLS role before applying
  # app.current_tenant_id. This is the SET LOCAL ROLE TARGET and stays
  # `vhhealth_app` — do NOT change it to the connection role.
  #
  # As of INF-4/INF-8 the backend now CONNECTS as `vhhealth_runtime` (LOGIN,
  # NOSUPERUSER, NOBYPASSRLS — see DATABASE_URL in sealed-secret.yaml.example),
  # which is granted membership in vhhealth_app so SET LOCAL ROLE succeeds.
  # vhhealth_runtime does NOT own the tables, so even unforced tenant_isolation
  # policies are enforced on the connection — and SET LOCAL ROLE vhhealth_app
  # remains the belt-and-braces scope marker. Both roles are created by CNPG
  # `spec.managed.roles` (base/cnpg/cluster.yaml); grants are ensured by the
  # owner-credential PreSync migration Job, never by API workers.
  AUTH_TENANT_RLS_RUNTIME_ROLE: "vhhealth_app"
  # Production API workers are read-only migration consumers. They verify that
  # `_migrations` exactly matches the image and refuse to listen on drift; only
  # the owner-credential PreSync Job may apply DDL.
  RUN_MIGRATIONS: "false"

  # ---- Embedded BI (NL-10) — DARK until the optional Metabase module is
  # enabled. Empty values = unconfigured: metabaseService.buildEmbedUrl fails
  # closed without METABASE_URL (+ METABASE_EMBED_SECRET, which is a Secret —
  # see sealed-secret.yaml.example), and every catalog dashboard whose
  # METABASE_DASH_* id is unset renders as a disabled "Config" card. The
  # backend only SIGNS embed URLs — it never calls Metabase over the network,
  # so no NetworkPolicy egress is needed here. Fill METABASE_URL with the
  # LAN Metabase origin (https://analytics.vhhealth.hospital.local) and the
  # dashboard ids per docs/runbooks/EMBEDDED_BI_GO_LIVE.md after authoring
  # dashboards in Metabase (see infra/kubernetes/optional/metabase/README.md).
  METABASE_URL: ""
  # Dashboard ids — names match analytics_dashboard_catalog.metabase_env_var
  # (migrations 465 + 720).
  METABASE_DASH_DAILY_OPS: ""
  METABASE_DASH_BED_FLOW: ""
  METABASE_DASH_OT_UTILIZATION: ""
  METABASE_DASH_REVENUE_PAYER_MIX: ""
  METABASE_DASH_ORDERS_TAT: ""
  METABASE_DASH_LAB_TAT: ""
  METABASE_DASH_PHARMACY_OPS: ""
  METABASE_DASH_COLLECTIONS_RCM: ""
  METABASE_DASH_ENCOUNTER_VOLUME: ""
  # Held catalog rows (status 'held' in migration 465) — leave empty until
  # their upstream aggregates are certified.
  METABASE_DASH_QUALITY_FEEDBACK: ""
  METABASE_DASH_OPERATIONAL_AI_ALERTS: ""

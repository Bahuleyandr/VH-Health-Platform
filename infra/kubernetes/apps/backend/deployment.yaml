apiVersion: apps/v1
kind: Deployment
metadata:
  name: vhhealth-backend
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # The unselected continuity-publication-rwx component adds the shared
    # publication volume read-only. This annotation is an inert review hook.
    vhhealth.app/continuity-publication-role: held-reader
  labels:
    app.kubernetes.io/name: vhhealth-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: vhhealth
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vhhealth-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vhhealth-backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: vhhealth
      annotations:
        # Force rollout on ConfigMap/Secret change (Kustomize hashes merge into
        # the referenced name; this is a belt-and-braces stamp for overlays
        # that inject live config).
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      # Graceful shutdown — backend has SIGTERM handlers in bin/www.js that
      # drain the DB pool; CLAUDE.md guarantees 10s force-exit fallback.
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Keep backend replicas balanced across eligible node hostnames. Zone
      # labels remain a best-effort placement hint; they do not prove separate
      # rack, power, or network failure domains. HPA replicas stay balanced,
      # while replacements after a node loss may share surviving hosts. The
      # PDB and readiness gates remain authoritative for availability.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: vhhealth-backend
                topologyKey: topology.kubernetes.io/zone
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: vhhealth-backend
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: vhhealth-backend
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: vhhealth-backend
      containers:
        - name: backend
          # Pinned to an immutable tag; prod overlay replaces with a digest:
          #   image: ghcr.io/bahuleyandr/vh-health-platform-backend@sha256:...
          # Never use `:latest` — fails-build in our CI/ArgoCD policy.
          image: ghcr.io/bahuleyandr/vh-health-platform-backend:0.0.0-placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            # Downward API — pod identity + git sha for Sentry release tagging.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: GIT_COMMIT
              valueFrom:
                fieldRef:
                  # Overlay sets `app.kubernetes.io/version` on the template
                  # via a bake step from the image digest / git sha.
                  fieldPath: metadata.labels['app.kubernetes.io/version']
            # Explicit overrides — take precedence over ConfigMap entries.
            # validateEnv.js uses Joi with defaults, so these are belt-and-braces.
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
            - name: CLUSTER_WORKERS
              value: "2"
            # Read the exact same non-secret listener profiles as the held
            # device gateway. The ConfigMap is optional because that held tree
            # is not composed by active overlays; absent remains dark.
            - name: DEVICE_GATEWAY_LIS_LISTENERS
              valueFrom:
                configMapKeyRef:
                  name: device-gateway-config
                  key: DEVICE_GATEWAY_LIS_LISTENERS
                  optional: true
            # validateEnv.js still treats this legacy deploy/backup variable as
            # mandatory at backend startup. Keep it explicit and isolated while
            # the archive jobs also use the same dedicated crypto generation;
            # never put it back into the broad backend Secret.
            - name: BACKUP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: backup-crypto
                  key: BACKUP_ENCRYPTION_KEY
          envFrom:
            - configMapRef:
                name: vhhealth-backend-config
            - secretRef:
                # Populated by SealedSecret `vhhealth-backend-env`
                # (see sealed-secret.yaml.example).
                name: vhhealth-backend-env
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          # `/health/live` has no DB dependency. `/health/ready` gates traffic
          # on DB reachability + migration readiness ONLY.
          #
          # Redis is NOT a readiness gate (873-F2, 2026-08-15 — this comment
          # said it was until the 2026-08-23 once-over caught it). Strictness
          # (REDIS_REQUIRE_SENTINEL=true in the ConfigMap) is a BOOT gate: a
          # pod that cannot reach Sentinel at startup exits 1 in bin/www.js and
          # never serves. Once initialized, a MID-FLIGHT Redis outage reports
          # `redis: degraded` in the readiness payload and keeps the pod READY
          # on purpose — failing readiness pulled every pod from the Service in
          # ~15s, turning a cache outage into a hospital-wide API outage. The
          # one Redis condition that still fails readiness is a strict pod whose
          # client was never initialized at all. Tenant-RLS posture likewise
          # remains an alert, not a traffic gate (C-7).
          #
          # Readiness uses an exec probe so the protected monitoring endpoint
          # can receive the pod's MONITORING_TOKEN without baking the secret
          # value into this manifest.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30  # 30 * 5s = 150s max startup window
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - |
                  (async () => {
                    const token = process.env.MONITORING_TOKEN || process.env.METRICS_TOKEN || process.env.INTERNAL_MONITORING_TOKEN;
                    if (!token) {
                      console.error('MONITORING_TOKEN, METRICS_TOKEN, or INTERNAL_MONITORING_TOKEN is required for readiness');
                      process.exit(1);
                    }
                    const port = process.env.PORT || '5000';
                    try {
                      const response = await fetch(`http://127.0.0.1:${port}/health/ready`, {
                        headers: {
                          'x-forwarded-proto': 'https',
                          'x-monitoring-token': token,
                        },
                        signal: AbortSignal.timeout(2500),
                      });
                      if (!response.ok) {
                        console.error(await response.text());
                        process.exit(1);
                      }
                    } catch (error) {
                      console.error(error.message);
                      process.exit(1);
                    }
                  })();
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # Express/multer spill + winston file transports (if ever enabled)
            # + pg tmp catalog reads all go to /tmp.
            - name: tmp
              mountPath: /tmp
            # Backend writes transient files here (see app.js audit/hipaa
            # fallback file transports).
            - name: app-tmp
              mountPath: /app/tmp
            # Nothing mounts over /app/node_modules/** on purpose: the image
            # bakes the generated Prisma client at node_modules/.prisma, and a
            # mount REPLACES the image directory — the emptyDir that used to
            # sit there erased the client, so boot died importing
            # '@prisma/client'. Runtime never writes into .prisma. Pinned by
            # scripts/backend-image-command-contract.test.mjs.
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: app-tmp
          emptyDir:
            sizeLimit: 512Mi

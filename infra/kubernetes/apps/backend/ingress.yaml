apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vhhealth-backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # TLS via cert-manager (Let's Encrypt prod issuer — overlay may switch to
    # `letsencrypt-staging` in dev/staging to avoid rate limits).
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Request/response tunables — the backend's express.json limit is small
    # (HTTP_BODY_LIMIT, default 1mb; configmap) because large JSON is a DoS
    # surface. This proxy-body-size is sized for the multipart UPLOAD path
    # (validatePatientUpload caps at 25MB PDF, so 50m leaves headroom), which
    # goes through multer rather than express.json.
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    # Backend handles CORS itself (src/middleware/corsMiddleware.js) with
    # ALLOWED_ORIGINS from env. Ingress must NOT double-handle or it strips
    # Access-Control-Allow-Credentials.
    nginx.ingress.kubernetes.io/enable-cors: "false"
    # Security headers are NOT set here (audit 2026-06-22 W3-H1). The controller
    # has allow-snippet-annotations="false" (CVE-2021-25742/2023-5043), so a
    # configuration-snippet here is REJECTED at admission → API routing outage.
    # Transport headers (HSTS, X-Content-Type-Options, X-Frame-Options,
    # Referrer-Policy, Permissions-Policy) are applied controller-wide via the
    # http-snippet + nginx-security-headers ConfigMap in base/ingress-nginx; the
    # strict API CSP (default-src 'none') is owned by Helmet.js in backend app.js.
    # Rate limiting — belt-and-braces on top of backend's express-rate-limit.
    # Per-IP burst protection for anyone bypassing the /api/v1/auth rate limits.
    nginx.ingress.kubernetes.io/limit-connections: "50"
    nginx.ingress.kubernetes.io/limit-rpm: "600"
    # Log X-Request-Id so nginx + backend logs correlate by request.
    nginx.ingress.kubernetes.io/enable-modsecurity: "false"
  labels:
    app.kubernetes.io/name: vhhealth-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: vhhealth
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.vhhealth.app
      secretName: vhhealth-backend-tls
  rules:
    - host: api.vhhealth.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vhhealth-backend
                port:
                  number: 80
    # ── Per-tenant subdomains (multi-tenancy W7, FLAT 1st-level model) ───────
    # Route every 1st-level host to the backend (the per-tenant API host is
    # `<slug>-api.vhhealth.app`); W4 derives the tenant from the preserved Host.
    # `admin.vhhealth.app` keeps its own more-specific Ingress (→ admin), so
    # nginx routes it correctly; `api.vhhealth.app` keeps the apex rule above.
    # Browser-facing TLS is the Cloudflare edge's FREE Universal SSL cert for
    # `*.vhhealth.app` (1st-level — no ACM). The wildcard is deliberately NOT in
    # the cert-manager `tls.hosts` (the cloudflared→ingress hop is HTTP). INERT
    # until the wildcard DNS exists (runbook Part A). See
    # docs/TENANT_ONBOARDING_RUNBOOK.md.
    - host: "*.vhhealth.app"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vhhealth-backend
                port:
                  number: 80
---
# SMS delivery callbacks authenticate with an opaque bearer in the URL path.
# Give that prefix its own nginx location with access logging disabled so the
# credential never reaches the controller access log. The application still
# emits its redacted operational/audit events; snippets remain disabled.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vhhealth-backend-sms-webhooks
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    nginx.ingress.kubernetes.io/enable-access-log: "false"
    nginx.ingress.kubernetes.io/enable-cors: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    nginx.ingress.kubernetes.io/limit-rpm: "600"
  labels:
    app.kubernetes.io/name: vhhealth-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: vhhealth
spec:
  ingressClassName: nginx
  rules:
    - host: api.vhhealth.app
      http:
        paths:
          - path: /webhooks/sms
            pathType: Prefix
            backend:
              service:
                name: vhhealth-backend
                port:
                  number: 80
    - host: "*.vhhealth.app"
      http:
        paths:
          - path: /webhooks/sms
            pathType: Prefix
            backend:
              service:
                name: vhhealth-backend
                port:
                  number: 80

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# VH Health — Backend API
# Base Kustomization; overlays under infra/kubernetes/overlays/{dev,staging,prod}
# pin the image digest, scale replicas, and attach real SealedSecrets.

namespace: vhhealth

# Use modern `labels` (not deprecated `commonLabels`). We keep these
# informational-only (`includeSelectors: false`) because each workload already
# declares its own `app.kubernetes.io/name` on selectors + pod template — this
# prevents commonLabels from rewriting cross-workload selectors (e.g. the
# admin→backend NetworkPolicy ingress rule, which must keep its original
# `vhhealth-admin` selector, not be auto-rewritten to `vhhealth-backend`).
labels:
  - pairs:
      app.kubernetes.io/part-of: vhhealth
      app.kubernetes.io/component: api
    includeSelectors: false
    includeTemplates: true

resources:
  - configmap.yaml
  - payroll-revision-754-acceptance.yaml
  - migration-job.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  # C2.1 apex-only private route. Its referenced TLS Secret has no producer in
  # the default render and the keepalived VIP defaults disabled/addressless.
  - ingress-internal-api.yaml
  # LAN-only ingress for /api/v1/clinical-ai/clinical/* (Phase 1 of the
  # clinical-AI rollout — see docs/CLINICAL_AI_ROLLOUT_PLAN.md). Uses
  # ingressClassName: nginx-internal so it's served by the internal-only
  # ingress-nginx controller, not the public one. Hostname is
  # clinical.vhhealth.hospital.local by default; overlays can patch.
  - ingress-clinical-internal.yaml
  - hpa.yaml
  - pdb.yaml
  - network-policy.yaml
  - service-monitor.yaml
  - backup-cronjob.yaml
  - backup-network-policy.yaml
  # Egress for the canary probe pods (DNS + backend:5000); the matching
  # backend-side ingress allow is rule 5 in network-policy.yaml.
  - canary-network-policy.yaml
  # REL-3 / WS2 B2.3: outage-critical jobs promoted from in-process scheduler
  # to native CronJobs so they survive backend Deployment downtime.
  - ward-downtime-packs-cronjob.yaml
  - lab-threshold-reconciliation-cronjob.yaml
  - lab-threshold-reconciliation-network-policy.yaml
  - backup-verification-cronjob.yaml
  - canary-health-check-cronjob.yaml

# External scripts keep shell logic testable and keep runtime `${VAR}`
# expansion inside the pod rather than in Argo/Kustomize.
configMapGenerator:
  - name: vhhealth-backup-scripts
    files:
      - upload-archive.sh
      - verify-upload-archive.sh
  - name: vhhealth-internal-ingress-parameters
    literals:
      # C-D13 remains unresolved. An approved overlay replaces this value only
      # when it also selects exactly one matching TLS-material component.
      - tlsSecretName=c-d13-unprovisioned-internal-api-tls

generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: vhhealth-backup-scripts
    app.kubernetes.io/component: backup-archive
    app.kubernetes.io/part-of: vhhealth

# The app tier is a separate manual-sync Argo Application from the platform
# overlay, so it carries its own non-secret ConfigMap source. These native
# replacements still make the rendered workload endpoint literal and ensure
# both jobs use the same confirmed value.
replacements:
  - source:
      kind: ConfigMap
      name: vhhealth-backend-config
      fieldPath: data.R2_ENDPOINT
    targets:
      - select:
          group: batch
          version: v1
          kind: CronJob
          name: vhhealth-backend-r2-sync
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.containers.[name=r2-sync].env.[name=R2_ENDPOINT].value
      - select:
          group: batch
          version: v1
          kind: CronJob
          name: backup-verification
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.initContainers.[name=archive-reader].env.[name=R2_ENDPOINT].value
  - source:
      kind: ConfigMap
      name: vhhealth-internal-ingress-parameters
      fieldPath: data.tlsSecretName
    targets:
      - select:
          group: networking.k8s.io
          version: v1
          kind: Ingress
          name: vhhealth-backend-internal-api
        fieldPaths:
          - spec.tls.0.secretName

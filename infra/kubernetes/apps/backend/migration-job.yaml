# DB migration Job — runs before the Deployment reconciles.
#
# ArgoCD PreSync hook:
#   - Job is applied by ArgoCD BEFORE the main sync. The Deployment will not
#     roll out until this Job reports Complete.
#   - `hook-delete-policy: BeforeHookCreation` wipes the previous run's Job
#     object on the next sync (otherwise a 2nd apply of the same-named Job
#     errors). No leftover Completed Jobs to reap manually.
#   - Failure aborts the sync. Fix the migration, re-sync.
#   - Because the hook is deleted only BEFORE the NEXT hook creation, exactly
#     ONE migration Job (and its pods) can exist at a time no matter how long
#     they are retained. That bound is what makes the retention settings below
#     safe: `restartPolicy` and `ttlSecondsAfterFinished` decide how long the
#     LAST run's evidence survives, never how much of it accumulates.
#
# Reading a FAILED run (see restartPolicy + ttlSecondsAfterFinished below).
# ArgoCD streams hook pod logs live, so an operator watching a sync sees the
# migration output in real time. Everything here is about the other case —
# diagnosing after the fact, which is what an unattended or overnight sync
# leaves you with. The BackendMigrationJobFailed rule in
# base/monitoring/backend-red-alerts.yaml watches this Job by name, so a
# failure is recorded rather than depending on a human noticing the failed
# sync (OutageCriticalCronJobFailing matches the CronJobs only). Alertmanager
# receiver wiring is still C1.3, so treat that rule as stated intent, not as
# proof anyone is notified. It reads kube_job_status_failed, which
# kube-state-metrics emits only once this Job carries a terminal Failed
# condition — so a transient failure absorbed by backoffLimit below stays
# silent, and both BackoffLimitExceeded and DeadlineExceeded are covered.
# Every attempt is a separate retained pod, so select on the CONTROLLER-set
# job-name label. Not `logs job/<name>` — that picks ONE arbitrary attempt
# ("Found 3 pods, using pod/…"), which need not be the one that failed. Not the
# app label either — it is on the pod template, so it is NOT scoped to a single
# run: the 582 cutover runbook has an operator create a differently-NAMED Job
# derived from this one that must keep the same app label (NetworkPolicy and
# the CNPG pooler select Postgres access on it), and its pods would match too.
#
#   kubectl -n vhhealth get pods -l batch.kubernetes.io/job-name=vhhealth-backend-migrate
#   kubectl -n vhhealth logs -l batch.kubernetes.io/job-name=vhhealth-backend-migrate \
#     -c migrate --tail=400 --prefix
#
# The job does:
#   1. `node scripts/ensure-pgvector-extension.mjs` — runs `CREATE EXTENSION
#      IF NOT EXISTS vector` (000_baseline.sql declares columns of type
#      `public.vector`, so vector must exist before ci-setup-db on a fresh DB).
#      This is the exact entrypoint behind the `db:ensure-pgvector` npm alias in
#      apps/backend/package.json. The ALIAS is unusable here: the production
#      stage of apps/backend/Dockerfile deletes npm and npx from the runtime
#      image (`rm -rf /usr/local/lib/node_modules/npm /usr/local/bin/npm
#      /usr/local/bin/npx`), so invoking the alias would abort this PreSync
#      hook at step 1 with `npm: not found` and block the sync. Every step
#      below invokes `node` directly, exactly as the initContainer does.
#      scripts/backend-image-command-contract.test.mjs pins that contract:
#      it derives the runtime image's binaries and file tree from the
#      Dockerfile and fails if any command in this file is not actually in the
#      image.
#
#      On a fresh prod
#      cluster this is now an IDEMPOTENT NO-OP: vector is UNTRUSTED and the Job
#      connects as the NOSUPERUSER owner `vhhealth` (DATABASE_SUPERUSER_URL),
#      which can NEVER `CREATE EXTENSION vector` (bypassrls ≠ extension-creation
#      rights). So vector is instead created by CNPG's bootstrap
#      `postInitApplicationSQL` (see base/cnpg/cluster.yaml), which runs as the
#      SUPERUSER at initdb — before this Job. The step is kept as a defensive
#      guard for non-CNPG / pre-existing DBs (e.g. the dalekdefender overlay and
#      local QA, where it runs as a superuser DSN).
#   2. `node scripts/payroll-revision-754-preflight.mjs --report-only` — emits
#      the read-only reconciliation inventory. Acceptance is enforced again on
#      the migration connection while source and authority tables are locked.
#   3. `node scripts/ci-setup-db.mjs` — tracker-driven, idempotent. Applies
#      every file in `src/migrations/*.sql` exactly once per DB via the
#      `_migrations` table; auto-detects a pre-existing baseline schema
#      (probes for users + appointments + admissions) and records
#      `000_baseline.sql` without re-running its non-idempotent DDL.
#      Safe to re-run on a populated DB — no-op when caught up.
#
# History: previously this job also ran `prisma db push --accept-data-loss`
# as step 1 to sync the ~69 Prisma-modelled tables before applying raw
# migrations for the rest. Removed 2026-05-12 in PR #78 (commit 5712f0cb)
# along with the same step in `_reusable-backend-lint-test.yml`,
# `smoke-e2e.yml`, and `apps/backend/scripts/ensure-test-db.mjs`. Raw SQL
# migrations are now the source of truth: `000_baseline.sql` is a
# `pg_dump --schema-only` of the fully migrated QA DB and includes
# GENERATED ALWAYS AS columns (e.g. `bmw_waste_log.total_kg`,
# `drug_return_items.total_value_paise`), sequence-referencing defaults,
# and column-reference defaults that Prisma cannot emit declaratively.
# Pushing the regenerated `schema.prisma` against an empty DB therefore
# fails before any rows exist. See memory note
# `project_vh_health_schema_drift_fix.md` for the full rationale.
#
# Security: same non-root + readOnlyRootFilesystem + tmp volumes as the
# main Deployment. Uses the same image and the same vhhealth-backend-env Secret,
# but OVERRIDES DATABASE_URL from the DATABASE_SUPERUSER_URL key (audit findings
# INF-4 + INF-8): the Deployment connects as the NOSUPERUSER/NOBYPASSRLS
# `vhhealth_runtime` role (RLS enforced), while migrations need DDL privileges
# so this Job connects as the bootstrap OWNER role `vhhealth`. The migration
# scripts (scripts/ensure-pgvector-extension.mjs, scripts/ci-setup-db.mjs) read
# DATABASE_URL, so this `env:` override (which takes precedence over envFrom)
# transparently points them at the owner DSN — no backend code change needed.
#
# ⚠ No volume may mount over /app/node_modules/** — the image bakes the
# generated Prisma client at /app/node_modules/.prisma, and a Kubernetes mount
# REPLACES that directory. The emptyDir that sat there until 2026-08 erased the
# client, so step 3's import of '@prisma/client' died at module link while the
# pg-direct steps 1-2 kept passing. Nothing at runtime writes into .prisma
# (the client is generated at image build; the runtime image has no npm/npx or
# prisma CLI to regenerate it). scripts/backend-image-command-contract.test.mjs
# pins this for every backend-image workload.
#
# Step 4 fails closed when no runtime role is configured. A hand-run copy of
# this Job on a single-DSN environment (dalekdefender rig, local QA — no
# configmap, no vhhealth_runtime login role in the DB) may set
# RUNTIME_ROLE_GRANTS_OPTIONAL=true to turn exactly that configuration-absent
# skip into a loud exit-0 no-op. This canonical Job deliberately does NOT set
# it — prod aborts the sync if migration-config.yaml ever loses
# AUTH_TENANT_RLS_RUNTIME_ROLE (pinned by startupMigrationReadiness.test.js).
# That key lives in vhhealth-backend-migration-config rather than the runtime
# vhhealth-backend-config because only the former exists during the PreSync
# phase; validate-kubernetes-manifests.mjs fails closed unless the two carry an
# identical value, so the role this Job GRANTS to and the role the Deployment
# CONNECTS as cannot drift apart.
apiVersion: batch/v1
kind: Job
metadata:
  name: vhhealth-backend-migrate
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels:
    app.kubernetes.io/name: vhhealth-backend-migrate
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: vhhealth
spec:
  backoffLimit: 2
  # 15min hard cap — real migrations take <60s; anything longer is hung.
  # NOTE this is JOB-scoped, not pod-scoped: the budget covers all attempts
  # together. On the normal path the gate passes at once and 3 × <60s is far
  # inside it. The margin is NOT large in the pathological case, though: the
  # wait-owner-bypassrls initContainer below has its own 5-minute cap and runs
  # once PER ATTEMPT, so three gate timeouts alone (~900s + back-off) exhaust
  # the budget before a migration runs. That is unchanged from the OnFailure
  # era — OnFailure restarts the initContainer in place under the same cap —
  # and it is bounded evidence, not lost evidence: the earlier attempts' pods
  # are retained with the gate's own diagnostic. It is also why the guard in
  # scripts/validate-kubernetes-manifests.mjs floors this value rather than
  # merely recording it. It is also the ONE terminal path that still discards
  # evidence: on DeadlineExceeded the Job controller DELETES the pod that is
  # still running, under either restartPolicy — verified on the rig. A hang is
  # therefore diagnosed from the Job's DeadlineExceeded condition and ArgoCD's
  # live stream, not from a retained pod. Earlier attempts that already failed
  # are retained normally.
  activeDeadlineSeconds: 900
  # 24h, raised from 1h. The TTL controller deletes the Job — and cascades to
  # its pods — this many seconds after it FINISHES, in either terminal state;
  # Kubernetes has no way to express a longer TTL for failure specifically, so
  # the single number has to be justified for both.
  #
  # 1h was too short for the case that actually matters. Prod sync is MANUAL
  # (base/argocd/applications/apps.yaml has no `automated:` block), so a
  # migration failure is found by a human coming back to it — and an hour does
  # not survive an overnight or unattended sync. The evidence was reaped before
  # anyone looked.
  #
  # 24h covers any overnight window plus the whole following business day, and
  # matches what the backup + backup-verification CronJobs already keep. The
  # cost is bounded to ONE extra terminal Job and its ≤3 terminal pods, because
  # `hook-delete-policy: BeforeHookCreation` deletes the previous Job at the
  # start of the next sync regardless of TTL — a longer TTL cannot accumulate
  # anything, it only defers the no-further-sync backstop.
  #
  # Deliberately NOT multi-day: a terminal Failed Job lingering for days is
  # misleading state, and past about a day the correct move is to re-sync
  # (ci-setup-db.mjs is tracker-driven and idempotent, so a re-run reproduces
  # the same failure with fresh logs) rather than read stale ones.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vhhealth-backend-migrate
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: vhhealth
    spec:
      # Never, NOT OnFailure — a diagnosability requirement, not a preference.
      #
      # With OnFailure the kubelet restarts the container in the SAME pod, and
      # the job controller DELETES that pod the instant it exceeds the backoff
      # limit ("SuccessfulDelete ... Deleted pod" lands about a second after
      # "BackoffLimitExceeded"). What is left is a Job object reading
      # `Failed 0/1` and carrying no output at all: not the migration's file
      # name, not the Postgres error. The one thing an after-the-fact diagnosis
      # needs is the one thing it could never have. Reproduced on the
      # dalekdefender rig against this exact policy (OnFailure, backoffLimit 2)
      # — the marker line the container printed was unrecoverable — and fixed
      # for the rig's own Job in PR #954.
      #
      # With Never each attempt is a NEW pod and failed pods are RETAINED, so
      # each of the backoffLimit+1 attempts leaves a readable pod — 3 today.
      # Comparing them is how you tell a deterministic migration failure from
      # one transient blip, which is why the guard floors backoffLimit too.
      # Nothing about the
      # ArgoCD hook contract changes: hook success/failure is assessed from the
      # Job object's Complete/Failed condition, which is identical under either
      # policy, so "failure aborts the sync" still holds, sync-wave -1 still
      # holds, and BeforeHookCreation still clears them at the next sync.
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Ordering GATE (security-review HIGH #6 / fresh-cluster race).
      #
      # The migration below must run as the bootstrap OWNER `vhhealth` WITH
      # bypassrls (000_baseline does `SET row_security=off` and migs 237/272
      # `ALTER TABLE ... FORCE ROW LEVEL SECURITY`, so a NOBYPASSRLS owner 42501s
      # partway through a fresh apply — see base/cnpg/cluster.yaml managed.roles
      # `vhhealth`). The owner ROLE exists from bootstrap.initdb so the Job can
      # authenticate immediately, but `bypassrls:true` is applied by CNPG's
      # managed.roles reconciler on the OPERATOR'S OWN loop — it is NOT an ArgoCD
      # sync-wave participant. On a fresh cluster the PreSync migration Job
      # (sync-wave -1) can therefore RACE ahead of that reconcile and start
      # running while the owner is still NOBYPASSRLS → a cryptic mid-migration
      # 42501 and a fix that "silently doesn't take" on first sync.
      #
      # This initContainer BLOCKS the Job until the attribute has actually landed:
      # it polls `SELECT rolbypassrls FROM pg_roles WHERE rolname='vhhealth'` and
      # only exits 0 once it returns `t`. On timeout it exits NON-ZERO with a
      # clear, diagnosable message so the Job fails loudly at the gate instead of
      # half-applying migrations. Uses the SAME image + the owner DSN
      # (DATABASE_SUPERUSER_URL) as the migrate container — the owner can log in
      # and read pg_roles even before bypassrls is set. node + the `pg` client are
      # both already in the image (pg is a prod dependency used by ci-setup-db.mjs);
      # npm/psql are not, so we invoke node directly.
      initContainers:
        - name: wait-owner-bypassrls
          image: ghcr.io/bahuleyandr/vh-health-platform-backend:0.0.0-placeholder
          imagePullPolicy: IfNotPresent
          command: ["node"]
          args:
            - -e
            - |
              const pg = require('pg');
              // Poll every INTERVAL_MS up to a hard DEADLINE; the owner role
              // exists from bootstrap.initdb, so a connect failure is itself a
              // retryable "not ready yet" condition (DB still coming up), not a
              // fatal error — only a clean `f` (or an exhausted deadline) means
              // CNPG hasn't reconciled bypassrls yet.
              const INTERVAL_MS = 5000;
              const DEADLINE_MS = 5 * 60 * 1000; // 5 min hard cap
              const CONNECT_TIMEOUT_MS = 10000;
              const url = process.env.DATABASE_URL;
              if (!url) {
                console.error('[wait-owner-bypassrls] DATABASE_URL (owner DSN) not set — cannot gate migration');
                process.exit(1);
              }
              const started = Date.now();
              let lastSeen = 'unknown';
              async function probe() {
                const client = new pg.Client({
                  connectionString: url,
                  connectionTimeoutMillis: CONNECT_TIMEOUT_MS,
                  statement_timeout: CONNECT_TIMEOUT_MS,
                  application_name: 'migrate-gate',
                });
                try {
                  await client.connect();
                  const { rows } = await client.query(
                    "SELECT rolbypassrls FROM pg_roles WHERE rolname = 'vhhealth'",
                  );
                  if (rows.length === 0) { lastSeen = 'role-absent'; return false; }
                  lastSeen = rows[0].rolbypassrls === true ? 't' : 'f';
                  return rows[0].rolbypassrls === true;
                } finally {
                  await client.end().catch(() => {});
                }
              }
              (async () => {
                while (Date.now() - started < DEADLINE_MS) {
                  let ok = false;
                  try {
                    ok = await probe();
                  } catch (err) {
                    lastSeen = 'connect-error: ' + (err && err.message ? err.message : String(err));
                  }
                  const waited = Math.round((Date.now() - started) / 1000);
                  if (ok) {
                    console.log(`[wait-owner-bypassrls] owner 'vhhealth' has bypassrls=t after ${waited}s — proceeding to migrate`);
                    process.exit(0);
                  }
                  console.log(`[wait-owner-bypassrls] not ready (rolbypassrls=${lastSeen}) after ${waited}s — retrying in ${INTERVAL_MS / 1000}s`);
                  await new Promise((r) => setTimeout(r, INTERVAL_MS));
                }
                console.error(
                  "[wait-owner-bypassrls] TIMEOUT after 5m: owner 'vhhealth' bypassrls not reconciled by CNPG " +
                  `(last observed rolbypassrls=${lastSeen}). The migration needs the owner to bypass RLS ` +
                  '(000_baseline SET row_security=off + migs 237/272 FORCE RLS). ' +
                  'Check managed.roles for vhhealth in base/cnpg/cluster.yaml and the CNPG operator logs; ' +
                  "verify manually with: kubectl cnpg psql vhhealth-pg -- -c \"SELECT rolbypassrls FROM pg_roles WHERE rolname='vhhealth'\" (must be t). " +
                  'Aborting before migrations run to avoid a partial mid-migration 42501.',
                );
                process.exit(1);
              })();
          env:
            # Same owner DSN the migrate container uses (DATABASE_SUPERUSER_URL).
            # The owner can log in + read pg_roles even while still NOBYPASSRLS.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vhhealth-backend-env
                  key: DATABASE_SUPERUSER_URL
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: migrate
          image: ghcr.io/bahuleyandr/vh-health-platform-backend:0.0.0-placeholder
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              echo ">> db:ensure-pgvector (CREATE EXTENSION IF NOT EXISTS vector)"
              node scripts/ensure-pgvector-extension.mjs
              echo ">> migration 754 payroll-revision reconciliation preflight"
              node scripts/payroll-revision-754-preflight.mjs --report-only
              echo ">> ci-setup-db.mjs (apply raw src/migrations/*.sql, tracker-driven)"
              node scripts/ci-setup-db.mjs --skip-seeds
              echo ">> ensure runtime-role grants (owner-only bootstrap)"
              node scripts/ensure-runtime-role-grants.mjs
              echo ">> migrations complete"
          env:
            - name: NODE_ENV
              value: "production"
            - name: CI_DB_SKIP_SEEDS
              value: "1"
            - name: PAYROLL_754_ACCEPTED_MANIFEST_SHA256
              valueFrom:
                configMapKeyRef:
                  name: vhhealth-payroll-revision-754-acceptance
                  key: PAYROLL_754_ACCEPTED_MANIFEST_SHA256
            - name: PAYROLL_754_ACCEPTED_BY
              valueFrom:
                configMapKeyRef:
                  name: vhhealth-payroll-revision-754-acceptance
                  key: PAYROLL_754_ACCEPTED_BY
            # Override DATABASE_URL with the superuser/owner DSN for migrations
            # ONLY (INF-4/INF-8). Takes precedence over the envFrom value below.
            # The Deployment keeps the vhhealth_runtime DATABASE_URL; this Job
            # alone uses the owner connection so it can run DDL + CREATE
            # EXTENSION. Key lives in the same vhhealth-backend-env SealedSecret
            # (see sealed-secret.yaml.example → DATABASE_SUPERUSER_URL).
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vhhealth-backend-env
                  key: DATABASE_SUPERUSER_URL
          # vhhealth-backend-migration-config, NOT vhhealth-backend-config.
          #
          # This container runs in the PreSync phase, and ArgoCD completes every
          # PreSync hook before it applies ANY Sync-phase resource — sync waves
          # order within a phase, they do not order across phases.
          # vhhealth-backend-config is a Sync-phase resource (configmap.yaml
          # carries a sync-wave but no hook annotation), so on a fresh namespace
          # it does not exist yet, and referencing it here made this Job
          # UNSTARTABLE in the one way that leaves nothing to read:
          # CreateContainerConfigError is a WAITING reason, not a pod failure,
          # so it never increments backoffLimit and never produces a failed pod
          # for the restartPolicy above to retain; the Job simply runs until
          # activeDeadlineSeconds, and DeadlineExceeded then deletes the
          # still-running pod. Zero pods, zero logs — and the Sync phase that
          # would have created the ConfigMap is itself gated on this hook, so a
          # retry reproduces it exactly. Reproduced on a kind cluster running
          # ArgoCD before the fix, and re-run green after it.
          #
          # migration-config.yaml carries the same value in the PreSync phase,
          # narrowed to the only key this Job actually reads. Its header records
          # the key-by-key argument for that narrowing, and why annotating the
          # runtime ConfigMap as a hook instead was measured and rejected
          # (it loses ArgoCD drift detection and deletes/re-creates the
          # ConfigMap on every sync).
          #
          # The Secret is NOT the same case: vhhealth-backend-env is not
          # rendered by this Application at all. It is applied out of band from
          # a SealedSecret before the first sync (GO_LIVE_ACTIVATION_CHECKLIST
          # B1-B3, ahead of the D2 sync that runs this Job), so no phase
          # ordering within this Application can affect it.
          envFrom:
            - configMapRef:
                name: vhhealth-backend-migration-config
            - secretRef:
                name: vhhealth-backend-env
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-tmp
              mountPath: /app/tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: app-tmp
          emptyDir:
            sizeLimit: 128Mi

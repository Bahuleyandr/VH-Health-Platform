# DB migration Job — runs before the Deployment reconciles.
#
# ArgoCD PreSync hook:
#   - Job is applied by ArgoCD BEFORE the main sync. The Deployment will not
#     roll out until this Job reports Complete.
#   - `hook-delete-policy: BeforeHookCreation` wipes the previous run's Job
#     object on the next sync (otherwise a 2nd apply of the same-named Job
#     errors). No leftover Completed Jobs to reap manually.
#   - Failure aborts the sync. Fix the migration, re-sync.
#
# The job runs the backend's own startup script which:
#   1. Runs `prisma db push` (idempotent schema sync for Prisma's 69 models).
#   2. Runs `node scripts/ci-setup-db.mjs` (applies the raw-SQL migrations
#      in src/migrations/*.sql — CLAUDE.md Phase 0.5 notes this is required for
#      the full schema; Prisma alone is ~60% of tables).
#
# Security: same non-root + readOnlyRootFilesystem + tmp volumes as the
# main Deployment. Uses the same image & same DATABASE_URL Secret —
# no separate credentials to manage.
apiVersion: batch/v1
kind: Job
metadata:
  name: vhhealth-backend-migrate
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels:
    app.kubernetes.io/name: vhhealth-backend-migrate
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: vhhealth
spec:
  backoffLimit: 2
  # 15min hard cap — real migrations take <60s; anything longer is hung.
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vhhealth-backend-migrate
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: vhhealth
    spec:
      restartPolicy: OnFailure
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/bahuleyandr/vh-health-backend:0.0.0-placeholder
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              echo ">> prisma db push (sync 69 Prisma models)"
              npx --no-install prisma db push --skip-generate --accept-data-loss=false
              echo ">> ci-setup-db.mjs (apply raw src/migrations/*.sql)"
              node scripts/ci-setup-db.mjs
              echo ">> migrations complete"
          env:
            - name: NODE_ENV
              value: "production"
          envFrom:
            - configMapRef:
                name: vhhealth-backend-config
            - secretRef:
                name: vhhealth-backend-env
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-tmp
              mountPath: /app/tmp
            - name: prisma-cache
              mountPath: /app/node_modules/.prisma
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: app-tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: prisma-cache
          emptyDir:
            sizeLimit: 64Mi

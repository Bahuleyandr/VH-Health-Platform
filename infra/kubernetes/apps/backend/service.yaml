apiVersion: v1
kind: Service
metadata:
  name: vhhealth-backend
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: vhhealth-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: vhhealth
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vhhealth-backend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  # Session affinity not needed — backend is stateless, JWTs in headers.
  sessionAffinity: None

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Top-level barrel for the app tier.
# Platform services (CNPG, Redis, MinIO, ingress-nginx) are owned by
# `infra/kubernetes/platform/` and sync before this folder.
resources:
  - backend/
  - admin/
  # Staff Flutter-web bundle, served LAN-only behind nginx-internal at
  # clinical.<hospital>.local. Phase 3 of the clinical-AI rollout
  # (docs/CLINICAL_AI_ROLLOUT_PLAN.md).
  - staff-web/

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vhhealth-staff-web
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: vhhealth-staff-web
    app.kubernetes.io/component: staff-web
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/exposure: lan-only
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vhhealth-staff-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vhhealth-staff-web
        app.kubernetes.io/component: staff-web
        app.kubernetes.io/part-of: vhhealth
    spec:
      terminationGracePeriodSeconds: 15
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Matches the `nginx` user from nginx:alpine.
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: vhhealth-staff-web
                topologyKey: kubernetes.io/hostname
      containers:
        - name: nginx
          # Tag is pinned by the overlay (e.g. main-<sha> in staging,
          # staff-web-v1.2.3 in prod). Default tracks `latest-staff-web`
          # for dev convenience — overlays MUST patch this.
          image: ghcr.io/bahuleyandr/vhhealth-staff-web:latest-staff-web
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # The image is fully static — no runtime config. The Flutter
          # API_URL is baked at build time via --dart-define. Per-env
          # builds happen by passing different build args to the CI.
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # nginx writes to /var/cache/nginx and /var/run/nginx.pid;
          # mount tmpfs for both since the rootfs is read-only.
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: nginx-cache
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-run
          emptyDir:
            sizeLimit: 8Mi
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi

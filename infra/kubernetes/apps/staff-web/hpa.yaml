apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vhhealth-staff-web
  labels:
    app.kubernetes.io/name: vhhealth-staff-web
    app.kubernetes.io/component: staff-web
    app.kubernetes.io/part-of: vhhealth
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vhhealth-staff-web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    # CPU is the primary signal for nginx static-serving — scale up
    # when the per-pod request rate spikes (e.g. shift change, every
    # nurse opens the app at the same time).
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60

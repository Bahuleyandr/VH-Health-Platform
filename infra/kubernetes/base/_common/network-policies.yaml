# network-policies.yaml — default-deny NetworkPolicy baseline
#
# Every `vhhealth-*` namespace gets a default-deny ingress+egress policy.
# On top of that, we explicitly allow:
#   - kube-dns (so pods can resolve names; kube-dns lives in kube-system)
#   - metrics scraping from vhhealth-monitoring -> all namespaces
#   - ingress traffic from vhhealth-ingress -> all namespaces
#
# Per-workload allow rules (e.g. "backend -> postgres:5432") live alongside
# the workload manifest (Agent C owns app-side rules; platform-internal
# rules like Harbor->CNPG or Harbor->Redis live alongside the platform
# service in its own subdir).
#
# IMPORTANT: NetworkPolicy is *additive*: when no policy selects a pod it
# is implicitly allow-all. Once any policy selects a pod, *only* rules in
# selecting policies apply. The default-deny policies below select all
# pods in each namespace so every pod is immediately restricted until a
# specific allow rule lets traffic through.
#
# This requires a CNI that supports NetworkPolicy enforcement. The current
# RKE2 default is Canal (flannel + Calico NetworkPolicy), so this baseline is
# L3/L4-only. Cilium L7 policy is a separate migration plan, not active here.
---
# ---- vhhealth ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: vhhealth
  labels:
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: vhhealth
  labels:
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
  namespace: vhhealth
  labels:
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vhhealth-monitoring
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-traffic
  namespace: vhhealth
  labels:
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vhhealth-ingress
---

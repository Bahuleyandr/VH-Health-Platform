# argocd/namespace.yaml — Argo CD namespace
#
# Argo CD conventionally runs in the `argocd` namespace. We don't put it
# under `vhhealth-*` because:
#   (a) Operators + docs assume `argocd` as the default.
#   (b) The `argocd-server` service name (`argocd-server.argocd.svc.cluster.local`)
#       is wired into dozens of ecosystem tools expecting that exact
#       DNS suffix.
#
# PSS enforcement: restricted. Argo CD's images are already hardened;
# the chart defaults meet restricted admission.
---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
  annotations:
    vhhealth.app/description: "Argo CD GitOps engine; out of the vhhealth-* namespace family by convention."

# argocd/project.yaml — AppProject scoping Argo CD access to vhhealth-*
#
# Projects constrain which repos can be pulled, which clusters/namespaces
# can be synced into, and which resource kinds are permitted. Without a
# project, any Application sync would have cluster-wide power.
#
# The real ClusterRoleBinding stitching Argo CD's service account to its
# RBAC is created by the helm chart; this Project layers on top of it.
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: vhhealth
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
spec:
  description: "Main project scoping Argo CD to vhhealth-* namespaces"
  sourceRepos:
    - "https://github.com/Bahuleyandr/VH-Health-Platform"
    - "https://helm.goharbor.io"
    - "https://prometheus-community.github.io/helm-charts"
    - "https://grafana.github.io/helm-charts"
    - "https://falcosecurity.github.io/charts"
    - "https://charts.bitnami.com/bitnami"
    - "https://kubernetes.github.io/ingress-nginx"
    - "https://operator.min.io"
    - "https://charts.cloudnative-pg.io"
    # Longhorn child Application (base/longhorn/longhorn-app.yaml) pulls its
    # chart from here; without this entry the project rejects that source.
    - "https://charts.longhorn.io"
  destinations:
    - namespace: "vhhealth"
      server: https://kubernetes.default.svc
    - namespace: "vhhealth-platform"
      server: https://kubernetes.default.svc
    - namespace: "vhhealth-monitoring"
      server: https://kubernetes.default.svc
    - namespace: "vhhealth-ingress"
      server: https://kubernetes.default.svc
    - namespace: "vhhealth-security"
      server: https://kubernetes.default.svc
    - namespace: "argocd"
      server: https://kubernetes.default.svc
    # Bootstrapping CNPG operator writes into cnpg-system; MinIO op to
    # minio-operator. Allow those destinations.
    - namespace: "cnpg-system"
      server: https://kubernetes.default.svc
    - namespace: "minio-operator"
      server: https://kubernetes.default.svc
    - namespace: "kube-system"
      server: https://kubernetes.default.svc
    # The longhorn child Application deploys into longhorn-system; without
    # this destination the project rejects its sync.
    - namespace: "longhorn-system"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: storage.k8s.io
      kind: StorageClass
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: cert-manager.io
      kind: ClusterIssuer
    - group: networking.k8s.io
      kind: IngressClass
    - group: scheduling.k8s.io
      kind: PriorityClass
    # base/image-policy/kyverno-verify-images.yaml is rendered into the prod
    # overlay; ClusterPolicy is cluster-scoped so it must be whitelisted here.
    - group: kyverno.io
      kind: ClusterPolicy
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
  # Least-privilege project roles for tokens/automation. Humans use the Argo
  # CD SSO RBAC; these exist so any automation token minted later (e.g. a
  # release pipeline) can be scoped to sync-only instead of admin. Inert
  # until a token is created with `argocd proj role create-token`.
  roles:
    - name: readonly
      description: "Read-only visibility into vhhealth applications"
      policies:
        - p, proj:vhhealth:readonly, applications, get, vhhealth/*, allow
    - name: release-sync
      description: "Sync-only automation role for release tooling; no app create/delete/override"
      policies:
        - p, proj:vhhealth:release-sync, applications, get, vhhealth/*, allow
        - p, proj:vhhealth:release-sync, applications, sync, vhhealth/*, allow
  # Audit finding M16: ArgoCD `signatureKeys` verifies GPG-signed GIT
  # COMMITS only — it cannot verify cosign image signatures, so it stays
  # empty. Image-signature verification at admission is enforced by Kyverno:
  # see infra/kubernetes/base/image-policy/kyverno-verify-images.yaml
  # (keyless cosign keyed to the release workflows' GitHub-OIDC identity).
  # If commit-signing is adopted later, populate this with the maintainers'
  # GPG key IDs.
  signatureKeys: []

# cert-manager/cert-manager.yaml — cert-manager reference + ClusterIssuers
#
# cert-manager v1.16.1 has an immutable manual-sync Helm Application in
# ../../held/operator-lifecycle. That target is deliberately not composed into
# the active Argo application barrel or an environment overlay, keeping CRDs
# and controllers separate from the ClusterIssuers below.
#
# This file ships:
#   (1) a version tracker ConfigMap for Renovate,
#   (2) the two ClusterIssuers we rely on,
#   (3) the SealedSecret placeholder for Cloudflare API token.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cert-manager-pinned-version
  namespace: vhhealth-security
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
data:
  managedByArgoCD: "held-manual-application"
  version: "v1.16.1"
  chartRepository: "https://charts.jetstack.io"
  chartVersion: "v1.16.1"
  chartSha256: "e6bf08ee8834e6a727e38991978607ea9b729825150a20d7d10be1eb284106e6"
  controllerImage: "quay.io/jetstack/cert-manager-controller:v1.16.1@sha256:ae5e14401cde4dec8bccce7594f829cd491044aa66944272e1d4fccc941ec77c"
  webhookImage: "quay.io/jetstack/cert-manager-webhook:v1.16.1@sha256:6edf44244b2a711be737c4ab8e54e68d9112cc4e87da2ef97a7f76b768f4fde7"
  caInjectorImage: "quay.io/jetstack/cert-manager-cainjector:v1.16.1@sha256:3c49185718cf454bac559f71c4453b33f1086db48084604247d9acb7a4de2973"
  acmeSolverImage: "quay.io/jetstack/cert-manager-acmesolver:v1.16.1@sha256:14304826ab1a1184e185f952ef7e0bf8e620568b5c17939179efe6f4c6049d8e"
  startupApiCheckImage: "quay.io/jetstack/cert-manager-startupapicheck:v1.16.1@sha256:b4a5e42f6dbfb0d7dbb9366b4cb437a59a7616f6c5e67c76fa3641cadbe0c958"
---
# ---- Let's Encrypt production issuer (DNS-01 via Cloudflare) ----
# We cannot use HTTP-01 because the hospital firewall blocks all inbound
# traffic; Cloudflare Tunnel is the only path in. DNS-01 lets cert-manager
# prove domain control by writing a TXT record via the Cloudflare API.
#
# Pre-condition: the Cloudflare API token (scoped to Zone:DNS:Edit on the
# vhhealth.app zone) is stored in the Secret
# `cloudflare-api-token` — see `cloudflare-api-token.sealed-secret.yaml.example`.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: cluster-issuer
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@vhhealth.app
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - selector:
          dnsZones:
            - "vhhealth.app"
        dns01:
          cloudflare:
            email: ops@vhhealth.app
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
---
# ---- Let's Encrypt staging issuer (for testing) ----
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: cluster-issuer
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ops@vhhealth.app
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - selector:
          dnsZones:
            - "vhhealth.app"
        dns01:
          cloudflare:
            email: ops@vhhealth.app
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
---
# ---- Internal step-ca issuer ----
# Used for LAN-only services (Harbor registry, Grafana admin, MinIO
# console). These never expose a public hostname and so Let's Encrypt
# cannot issue for them. Pre-condition: step-ca is up and its root
# certificate is mounted into cert-manager's trust store.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: step-ca-internal
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: cluster-issuer
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
spec:
  # We use an ACME server that step-ca exposes. The step-ca StatefulSet
  # in base/step-ca/ runs the ACME endpoint at
  # https://step-ca.vhhealth-security.svc.cluster.local/acme/acme/directory
  acme:
    server: https://step-ca.vhhealth-security.svc.cluster.local/acme/acme/directory
    email: ops@vhhealth.hospital.local
    privateKeySecretRef:
      name: step-ca-acme-account-key
    # Trust anchor for the step-ca root cert so cert-manager accepts
    # it. cert-manager reads from the cluster-wide trust bundle when
    # caBundleInjectorEnabled=true; the bundle is managed by
    # `trust-manager` installed alongside cert-manager.
    caBundle: 
    solvers:
      # HTTP-01 via cluster-internal ingress. Valid because step-ca
      # serves internal hostnames that are only resolvable inside the
      # cluster / the hospital LAN.
      - http01:
          ingress:
            ingressClassName: nginx-internal

# Barman Cloud Plugin producer. C6.2 removes retention deletion from the
# database sidecar: this identity writes and reads the exact archive prefix but
# its temporary action list excludes DeleteObject/DeleteObjects. Eligible
# deletion is performed only by the separate suspended retention remover.
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: vhhealth-pg18-producer
  namespace: vhhealth-platform
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: database-backup
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
  annotations:
    # This remains the production recovery boundary. It is enforced by the
    # separately approved remover because a no-delete writer cannot execute
    # the Barman plugin's built-in retention deletion.
    vhhealth.app/database-retention-boundary: "30d"
spec:
  configuration:
    destinationPath: "s3://vhhealth-db-backups/cluster/"
    endpointURL: "https://dbe488236c64499a3dfc797a750c912d.r2.cloudflarestorage.com"
    s3Credentials:
      accessKeyId:
        name: cnpg-backup-producer-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-backup-producer-credentials
        key: SECRET_ACCESS_KEY
      sessionToken:
        name: cnpg-backup-producer-credentials
        key: ACCESS_SESSION_TOKEN
    wal:
      compression: gzip
      maxParallel: 8
    data:
      compression: gzip
      immediateCheckpoint: false
      jobs: 2

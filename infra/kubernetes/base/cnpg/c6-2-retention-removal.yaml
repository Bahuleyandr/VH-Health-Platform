# C6.2 eligible-object remover. It is inert twice over: the CronJob is
# suspended and execution defaults false. Unsuspending without a separately
# mounted, owner-approved inventory exits 78 without deleting anything.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg-retention-remover
  namespace: vhhealth-platform
  labels:
    app.kubernetes.io/name: cnpg-retention-removal
    app.kubernetes.io/part-of: vhhealth
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cnpg-retention-removal
  namespace: vhhealth-platform
  labels:
    app.kubernetes.io/name: cnpg-retention-removal
    app.kubernetes.io/component: database-backup-retention
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
  annotations:
    vhhealth.app/activation-gate: "C6.2 Phase 1 legal/security/backup approval"
spec:
  schedule: "0 22 1 * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cnpg-retention-removal
            app.kubernetes.io/component: database-backup-retention
            app.kubernetes.io/part-of: vhhealth
        spec:
          restartPolicy: Never
          serviceAccountName: cnpg-retention-remover
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: remove-approved-objects
              image: docker.io/amazon/aws-cli:2.34.53@sha256:cf53765c0de54ad3a8ea21818f1c4c845a8cf7ca87831c078a00fef244031493
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/opt/vhhealth/c6-2-retention-removal.sh"]
              env:
                - name: R2_ENDPOINT
                  value: "https://dbe488236c64499a3dfc797a750c912d.r2.cloudflarestorage.com"
                - name: R2_BUCKET
                  value: "vhhealth-db-backups"
                - name: R2_PREFIX
                  value: "cluster/"
                - name: DATABASE_RETENTION_DAYS
                  value: "30"
                - name: APPROVAL_RECORD
                  value: "/approval/approved-objects.tsv"
                - name: EXECUTE_RETENTION_REMOVAL
                  value: "false"
                - name: CHANGE_WINDOW_ID
                  value: "OWNER_INPUT_REQUIRED"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: cnpg-retention-remover-credentials
                      key: ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: cnpg-retention-remover-credentials
                      key: SECRET_ACCESS_KEY
                - name: AWS_SESSION_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: cnpg-retention-remover-credentials
                      key: ACCESS_SESSION_TOKEN
                - name: AWS_DEFAULT_REGION
                  value: "auto"
                - name: AWS_EC2_METADATA_DISABLED
                  value: "true"
                - name: AWS_PAGER
                  value: ""
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "256Mi"
                  cpu: "500m"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: script
                  mountPath: /opt/vhhealth
                  readOnly: true
                - name: approval
                  mountPath: /approval
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: cnpg-retention-removal-scripts
                defaultMode: 0555
            # This ConfigMap is deliberately absent from Git. The operator
            # creates it from the approved, PHI-free exact-object inventory.
            - name: approval
              configMap:
                name: cnpg-retention-removal-approval
            - name: tmp
              emptyDir: {}

# cnpg/cluster.yaml — VH Health production PostgreSQL cluster
#
# PostgreSQL 18.4, 3 instances (1 primary + 2 replicas), synchronous
# replication with 1 sync standby, required anti-affinity across hosts,
# continuous WAL archiving to Cloudflare R2 through the Barman Cloud
# Plugin, and one daily base backup retained for 30 days.
#
# Why synchronous with minSyncReplicas=1: DPDP + HIPAA-analog clinical
# data mustn't silently lose writes during failover. At 3 instances with
# minSync=1 we tolerate one failed replica without blocking writes, and
# any committed write has been flushed to at least 2 of 3 nodes.
#
# Anti-affinity: required across `kubernetes.io/hostname`, so at most one
# instance runs on each eligible host. On a node loss the third instance stays
# Pending; the two surviving instances preserve quorum and one sync standby.
#
# Backup: the Barman Cloud Plugin references ObjectStore
# `vhhealth-pg18-producer`. Credentials are a producer-only SealedSecret;
# see `cnpg-backup-producer-credentials.sealed-secret.yaml.example`.
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: vhhealth-pg
  namespace: vhhealth-platform
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: vhhealth-pg
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
spec:
  description: "VH Health primary PostgreSQL cluster (3 instances, 1 sync)"
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-bookworm@sha256:0ec6b32ab5b644aa51da58443c5ac2c1724d97de0d2a88961920d437b71b9ad8
  instances: 3
  minSyncReplicas: 1
  maxSyncReplicas: 1
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  stopDelay: 300
  startDelay: 60
  switchoverDelay: 60

  # Superuser access is DISABLED (audit findings INF-4 + INF-8). Previously
  # `true`, which let the backend connect as the Postgres superuser `postgres`
  # and meant any non-FORCE RLS policy was silently bypassed. The app now
  # connects as the NOSUPERUSER/NOBYPASSRLS `vhhealth_runtime` role (see
  # managed.roles below + the backend DATABASE_URL SealedSecret). External
  # connections still come in through the `vhhealth-pg-rw` service (primary) or
  # the PgBouncer pooler in poolers.yaml.
  #
  # Migration ordering: the migration Job needs DDL privileges. It connects as
  # the bootstrap OWNER role `vhhealth` (bootstrap.initdb.owner, secret
  # vhhealth-pg-app) via DATABASE_SUPERUSER_URL. The owner runs each migration's
  # DDL on its own objects, BUT it must also carry BYPASSRLS — proven by
  # scripts/runtime-role-cutover-drill.mjs (docs/RUNTIME_ROLE_CUTOVER_DRILL.md):
  # 000_baseline.sql sets `SET row_security = off`, and migrations 237/272 do
  # `ALTER TABLE ... FORCE ROW LEVEL SECURITY`, so a NOSUPERUSER NOBYPASSRLS owner
  # 42501s partway through a FRESH-cluster apply (e.g. mig 240 FK-add, 255 beds
  # seed). CI never caught this because it applies as the postgres superuser. Fix:
  # the owner role below is granted bypassrls:true (migration path ONLY) while the
  # app's vhhealth_runtime stays NOBYPASSRLS so tenant RLS still enforces.
  # OPERATOR VERIFY (blocker B — now image-dependent ONLY): `vector` (pgvector)
  # is an UNTRUSTED extension, so a non-superuser owner can NEVER create it
  # (bypassrls is not extension-creation rights). It is now created in
  # bootstrap.initdb.postInitApplicationSQL below, which CNPG runs as the
  # SUPERUSER against the application DB at initdb — so it lands BEFORE the
  # PreSync migration Job and that Job's `db:ensure-pgvector` becomes a safe
  # idempotent no-op. The ONLY residual to confirm is image-level: the
  # exact PostgreSQL 18.4 image above must actually SHIP the pgvector
  # shared library (the .so), or `CREATE EXTENSION vector` fails for everyone —
  # even the superuser — with "could not open extension control file". Verify on
  # first bring-up: `kubectl cnpg psql vhhealth-pg -- -c "SELECT 1 FROM
  # pg_available_extensions WHERE name='vector'"` must return a row (this is what
  # ensure-pgvector-extension.mjs probes too). If it does NOT, switch only to a
  # signed, digest-pinned pgvector-bearing PostgreSQL 18 Bookworm image and
  # repeat the full qualification. Never retarget the PostgreSQL 17 source.
  #
  # MAJOR UPGRADE (17 -> 18, owner decision 2026-07-12): on an EXISTING cluster
  # this imageName bump triggers CNPG's declarative offline major upgrade
  # (pg_upgrade; requires operator >= 1.26, a completed backup, and a downtime
  # window). On first bring-up it simply bootstraps 18. Do NOT sync this to a
  # running 17 cluster without the runbook step.
  #
  # OPERATOR: with enableSuperuserAccess:false the operator no longer manages a
  # `postgres` superuser password; the vhhealth-pg-superuser Secret becomes
  # unused. Leaving superuserSecret referenced is harmless (the operator ignores
  # it when access is disabled) but we drop it to avoid implying the password is
  # live. Re-add it only alongside enableSuperuserAccess:true.
  enableSuperuserAccess: false

  postgresql:
    parameters:
      # Memory / planner
      shared_buffers: "1GB"
      max_connections: "200"
      effective_cache_size: "3GB"
      maintenance_work_mem: "256MB"
      work_mem: "16MB"
      # WAL / replication
      wal_compression: "on"
      max_wal_size: "4GB"
      min_wal_size: "1GB"
      hot_standby: "on"
      archive_timeout: "5min"
      # Logging (observability)
      log_destination: "stderr"
      logging_collector: "off"
      log_min_duration_statement: "1000"
      log_connections: "on"
      log_disconnections: "on"
      log_lock_waits: "on"
      log_checkpoints: "on"
      log_temp_files: "0"
      log_autovacuum_min_duration: "1000"
      log_line_prefix: "%t [%p-%l] %q(%u@%d,app=%a,client=%h) "
      # Statement tracking for pg_stat_statements (already in CNPG image)
      shared_preload_libraries: "pg_stat_statements,auto_explain"
      "pg_stat_statements.track": "all"
      "pg_stat_statements.max": "10000"
      # Timeouts
      statement_timeout: "60s"
      idle_in_transaction_session_timeout: "300s"
      lock_timeout: "10s"
      # auto_explain for slow queries
      "auto_explain.log_min_duration": "2000"
      "auto_explain.log_analyze": "on"
      "auto_explain.log_buffers": "on"
      "auto_explain.log_timing": "off"
    pg_hba:
      # All in-cluster connections use scram-sha-256. The operator already
      # writes the replication entries; we add app connections explicitly.
      - "host all all 10.0.0.0/8 scram-sha-256"
      - "host all all 172.16.0.0/12 scram-sha-256"
      - "host all all 192.168.0.0/16 scram-sha-256"

  # Declaratively managed roles (reconciled continuously by the operator —
  # works on existing clusters, unlike postInitApplicationSQL which only
  # runs at initdb time).
  #
  # vhhealth_app — tenant-RLS runtime role (roadmap A2). The backend's
  # connection role `vhhealth` OWNS every table (bootstrap.initdb.owner), and
  # Postgres exempts owners from non-FORCEd RLS. Tenant-scoped transactions
  # therefore SET LOCAL ROLE vhhealth_app (AUTH_TENANT_RLS_RUNTIME_ROLE in the
  # backend ConfigMap) before applying app.current_tenant_id. Object grants
  # are applied idempotently at backend boot (ensureTenantRlsRuntimeRoleGrants
  # in src/lib/prisma.js), so ordering with migrations is not a concern.
  managed:
    roles:
      - name: vhhealth_app
        ensure: present
        comment: >-
          Tenant-RLS runtime role: SET LOCAL ROLE target for tenant-scoped
          transactions. NOLOGIN by design — only reachable through the
          backend's connection.
        login: false
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        replication: false
        bypassrls: false
      # vhhealth_runtime — the backend's NORMAL connection login role (audit
      # findings INF-4 + INF-8 / mirrors the dalekdefender precedent in
      # overlays/dalekdefender/rls-runtime-role.sql §M17). Prod previously
      # connected as the superuser `vhhealth` (bootstrap.initdb.owner), which
      # bypasses ALL row-level security — every tenant_isolation policy is
      # silently inert outside a SET LOCAL ROLE transaction. This LOGIN role is
      # NOSUPERUSER + NOBYPASSRLS, so RLS is actually enforced on the app's
      # connection; tenant-scoped transactions still SET LOCAL ROLE vhhealth_app
      # (AUTH_TENANT_RLS_RUNTIME_ROLE) as before. The superuser DSN is reserved
      # for the migration Job only (DATABASE_SUPERUSER_URL).
      #
      # `inRoles: [vhhealth_app]` grants membership so the SET LOCAL ROLE target
      # is reachable. Object-level grants (SELECT/INSERT/... on tables) are
      # applied idempotently at backend boot by ensureTenantRlsRuntimeRoleGrants
      # (src/lib/prisma.js), exactly like vhhealth_app — so ordering with
      # migrations is not a concern. Password is sourced from the
      # vhhealth-pg-runtime SealedSecret; the operator applies AND rotates it
      # (runtime-credentials.sealed-secret.yaml.example).
      - name: vhhealth_runtime
        ensure: present
        comment: >-
          Backend connection login role — NOSUPERUSER NOBYPASSRLS so tenant RLS
          enforces. Password managed via the vhhealth-pg-runtime secret; the
          superuser DSN is reserved for the migration Job only.
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        replication: false
        bypassrls: false
        inRoles:
          - vhhealth_app
        passwordSecret:
          name: vhhealth-pg-runtime
      # vhhealth_readonly — dashboards/exports read role. Audit finding H10
      # (2026-06-10): the password was previously set INLINE at initdb
      # ("set-in-sealed-secret" — a predictable literal) and never rotated.
      # It is now sourced from the vhhealth-pg-readonly secret (SealedSecret;
      # see readonly-credentials.sealed-secret.yaml.example) and reconciled
      # continuously by the operator — which also ROTATES the password on
      # existing clusters once the secret is applied. initdb only creates the
      # role as NOLOGIN with no password (grants need it to exist).
      - name: vhhealth_readonly
        ensure: present
        comment: >-
          Read-only role for dashboards and exports. Password managed via
          the vhhealth-pg-readonly secret — never inline in this manifest.
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        replication: false
        bypassrls: false
        passwordSecret:
          name: vhhealth-pg-readonly
      # vhhealth — bootstrap OWNER + MIGRATION role (bootstrap.initdb.owner).
      # Managed here ONLY to grant bypassrls:true: a fresh-cluster migration apply
      # must bypass RLS because 000_baseline sets row_security=off and migs 237/272
      # FORCE RLS, which 42501s a NOBYPASSRLS owner (proven by
      # scripts/runtime-role-cutover-drill.mjs). Migration path ONLY
      # (DATABASE_SUPERUSER_URL); the app connects as NOBYPASSRLS vhhealth_runtime,
      # so tenant RLS still enforces. Password MUST stay the bootstrap
      # vhhealth-pg-app secret (must match bootstrap.initdb.secret).
      - name: vhhealth
        ensure: present
        comment: >-
          Bootstrap owner + migration role; bypassrls for the migration-Job apply
          path only (app uses the NOBYPASSRLS vhhealth_runtime role).
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        replication: false
        bypassrls: true
        passwordSecret:
          name: vhhealth-pg-app

  bootstrap:
    initdb:
      database: vhhealth
      owner: vhhealth
      encoding: UTF8
      localeCType: "C"
      localeCollate: "C"
      # Enables checksums only for newly bootstrapped clusters. Existing PG17
      # clusters are unchanged: qualification must prove SHOW data_checksums,
      # and use the downtime procedure to run pg_checksums --enable if it is off.
      dataChecksums: true
      secret:
        name: vhhealth-pg-app
      # CNPG runs postInitApplicationSQL as the SUPERUSER (postgres) against the
      # application database `vhhealth`, ONCE at initdb (CNPG 1.24 bootstrap docs:
      # "Use the postInit, postInitTemplate, and postInitApplication options with
      # extreme care, as queries are run as a superuser"). That superuser context
      # is why `vector` belongs here and NOT only in the migration Job: pgvector is
      # an UNTRUSTED extension, so the NOSUPERUSER owner `vhhealth` (which the
      # migration Job connects as via DATABASE_SUPERUSER_URL) cannot CREATE it even
      # WITH bypassrls — bypassrls is not extension-creation rights. pgcrypto /
      # citext / uuid-ossp are TRUSTED in PG13+ and a db owner could create them,
      # but they ride here too so every extension is provisioned in one
      # superuser-context pass. Creating `vector` here makes the migration Job's
      # `db:ensure-pgvector` (CREATE EXTENSION IF NOT EXISTS vector) a safe
      # idempotent no-op on a fresh cluster instead of a 42501.
      postInitApplicationSQL:
        - "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;"
        - "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
        - "CREATE EXTENSION IF NOT EXISTS citext;"
        - "CREATE EXTENSION IF NOT EXISTS uuid-ossp;"
        # pgvector (UNTRUSTED → superuser-only). 000_baseline.sql declares columns
        # of type public.vector, so the extension MUST exist before the migration
        # Job applies. See the comment block above + the OPERATOR VERIFY note near
        # enableSuperuserAccess for the one remaining image-dependent caveat.
        - "CREATE EXTENSION IF NOT EXISTS vector;"
        # Read-only role used by dashboards and exports. Created NOLOGIN and
        # with NO password here (audit finding H10 — never set credentials
        # inline at initdb). The managed.roles entry above flips it to LOGIN
        # and applies the password from the vhhealth-pg-readonly secret.
        - "CREATE ROLE vhhealth_readonly NOLOGIN;"
        - "GRANT CONNECT ON DATABASE vhhealth TO vhhealth_readonly;"
        - "GRANT USAGE ON SCHEMA public TO vhhealth_readonly;"
        - "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO vhhealth_readonly;"

  storage:
    size: 100Gi
    storageClass: local-path
    resizeInUseVolumes: true

  walStorage:
    # Separate PVC for WAL so heavy write bursts don't starve data disk I/O.
    size: 20Gi
    storageClass: local-path

  resources:
    requests:
      memory: "2Gi"
      cpu: "1"
    limits:
      memory: "4Gi"
      cpu: "2"

  affinity:
    enablePodAntiAffinity: true
    topologyKey: "kubernetes.io/hostname"
    podAntiAffinityType: required

  # Per-pod disruption budget: at most 1 instance may be voluntarily
  # disrupted at a time (operator drain during node upgrade, etc.).
  # CNPG manages this implicitly via its managed PDB; no separate PDB
  # resource required.

  monitoring:
    enablePodMonitor: true
    customQueriesConfigMap:
      - name: vhhealth-pg-custom-queries
        key: queries.yaml

  # CNPG 1.30 delegates WAL archiving and base backups to the separately
  # installed Barman Cloud Plugin. `serverName` is the immutable PG18 archive
  # identity; PG17 evidence must remain under its previous identity.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: vhhealth-pg18-producer
        serverName: vhhealth-pg18

  # Replica bootstrap: not used. Set to null so the operator knows to
  # promote in-place from existing cluster members during upgrades.
---
# Custom queries for the Prometheus exporter that ships inside each
# CNPG pod. Adds replication lag per-client, connection-usage percent,
# active-vs-max-connections, and long-running queries. Grafana dashboards
# reference these.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vhhealth-pg-custom-queries
  namespace: vhhealth-platform
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: vhhealth-pg
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
data:
  queries.yaml: |
    vhhealth_replication_lag:
      query: |
        SELECT
          client_addr::text AS client,
          application_name,
          state,
          COALESCE(EXTRACT(EPOCH FROM (now() - pg_last_xact_replay_timestamp()))::bigint, 0) AS lag_seconds,
          COALESCE(pg_wal_lsn_diff(sent_lsn, replay_lsn)::bigint, 0) AS lag_bytes
        FROM pg_stat_replication
      metrics:
        - client:
            usage: LABEL
            description: "Replica client address"
        - application_name:
            usage: LABEL
            description: "Replica application_name"
        - state:
            usage: LABEL
            description: "Replication state"
        - lag_seconds:
            usage: GAUGE
            description: "Replication lag in seconds"
        - lag_bytes:
            usage: GAUGE
            description: "Replication lag in bytes"

    vhhealth_connections:
      query: |
        SELECT
          count(*) AS total,
          count(*) FILTER (WHERE state = 'active') AS active,
          count(*) FILTER (WHERE state = 'idle') AS idle,
          count(*) FILTER (WHERE state = 'idle in transaction') AS idle_in_tx,
          (SELECT setting::int FROM pg_settings WHERE name = 'max_connections') AS max_conn
        FROM pg_stat_activity
      metrics:
        - total:
            usage: GAUGE
            description: "Total current connections"
        - active:
            usage: GAUGE
            description: "Active (running) connections"
        - idle:
            usage: GAUGE
            description: "Idle connections"
        - idle_in_tx:
            usage: GAUGE
            description: "Idle-in-transaction connections"
        - max_conn:
            usage: GAUGE
            description: "max_connections setting"

# Operator-owned DR drill template. It is intentionally excluded from
# kustomization and restores only through the Object Read-only DR identity.
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: vhhealth-pg18-reader
  namespace: vhhealth-restore-proof
  labels:
    vhhealth.app/disposable-restore-proof: "true"
    app.kubernetes.io/part-of: vhhealth
spec:
  configuration:
    destinationPath: "s3://vhhealth-db-backups/cluster/"
    endpointURL: "https://dbe488236c64499a3dfc797a750c912d.r2.cloudflarestorage.com"
    s3Credentials:
      accessKeyId:
        name: cnpg-dr-reader-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-dr-reader-credentials
        key: SECRET_ACCESS_KEY
      sessionToken:
        name: cnpg-dr-reader-credentials
        key: ACCESS_SESSION_TOKEN
    wal:
      compression: gzip
    data:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: vhhealth-pg-drill
  namespace: vhhealth-restore-proof
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: vhhealth-pg-drill
    app.kubernetes.io/component: dr-drill
    app.kubernetes.io/part-of: vhhealth
    vhhealth.app/disposable-restore-proof: "true"
  annotations:
    vhhealth.app/phi-warning: "DISPOSABLE DRILL CLUSTER - REMOVE AFTER EVIDENCE CAPTURE"
spec:
  description: "Operator-owned PG18 restore drill"
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-bookworm@sha256:0ec6b32ab5b644aa51da58443c5ac2c1724d97de0d2a88961920d437b71b9ad8
  instances: 1
  enableSuperuserAccess: true
  storage:
    size: 110Gi
    storageClass: local-path
  walStorage:
    size: 25Gi
    storageClass: local-path
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "4Gi"
      cpu: "2"
  bootstrap:
    recovery:
      source: vhhealth-pg18-r2
      # Required before a drill. The script rejects this sentinel and patches
      # only its temporary input stream; production manifests remain inert.
      recoveryTarget:
        targetTime: "2000-01-01T00:00:00Z"
  externalClusters:
    - name: vhhealth-pg18-r2
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: vhhealth-pg18-reader
          serverName: vhhealth-pg18

# cnpg/kustomization.yaml — CloudNativePG operator + VH Health cluster
#
# The CNPG operator and Barman plugin are installed out-of-band from the
# digest-qualified 1.30.0 / 0.13.0 release manifests. This kustomization
# carries only the inert marker and resources that depend on their CRDs.
#
# The URL is NOT listed in `resources:` below because:
#   (a) Remote resources break offline builds and add ~9k lines to every
#       kustomize render.
#   (b) commonLabels at this level would try to patch immutable selectors
#       on the upstream Deployments + CRDs.
#
# Instead, the platform bootstrap runbook applies the operator manifest
# directly with `kubectl apply -f <URL>` once, and Argo CD manages the
# `Cluster`, `Pooler`, `ScheduledBackup`, and ConfigMap resources here.
#
# When we migrate to Argo CD ApplicationSets, the operator itself becomes
# its own Application ("app of apps" pattern) and syncs from the pinned
# URL directly — keeping its lifecycle separate from the Cluster CRDs
# we manage in this directory.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: vhhealth-cnpg
resources:
  - operator.yaml
  - barman-cloud-object-store.yaml
  - cluster.yaml
  - poolers.yaml
  - scheduled-backup.yaml
  - r2-backup-hardening.yaml
  - scheduled-restore-proof.yaml
  - c6-2-retention-removal.yaml
  - backup-network-policy.yaml

# DR drill and PG18 upgrade rehearsal manifests remain operator-owned,
# synthetic templates and are intentionally excluded from this render.
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: cnpg-backup-verification-scripts
    namespace: vhhealth-platform
    files:
      - verify-cnpg-backup.sh
  - name: cnpg-restore-proof-scripts
    namespace: vhhealth-restore-proof
    files:
      - scheduled-restore-proof.sh
  - name: cnpg-restore-object-verification-scripts
    namespace: vhhealth-restore-proof
    files:
      - verify-cnpg-backup.sh
  - name: cnpg-retention-removal-scripts
    namespace: vhhealth-platform
    files:
      - c6-2-retention-removal.sh

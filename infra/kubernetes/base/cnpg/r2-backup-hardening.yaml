# CNPG backup verification uses a bucket-scoped Object Read-only DR identity.
# The configured prefix is workload routing, not an R2 token boundary.
# Ordinary long-lived R2 tokens are Object Read/Write or Object Read-only; the
# producer must retain delete authority for Barman retention. Put-only
# brokerage and independent retention/deletion authority are C6.2.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg-backup-verifier
  namespace: vhhealth-platform
  labels:
    app.kubernetes.io/name: cnpg-backup-verify
    app.kubernetes.io/part-of: vhhealth
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cnpg-backup-verifier
  namespace: vhhealth-platform
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cnpg-backup-verifier
  namespace: vhhealth-platform
subjects:
  - kind: ServiceAccount
    name: cnpg-backup-verifier
    namespace: vhhealth-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cnpg-backup-verifier
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cnpg-backup-verify
  namespace: vhhealth-platform
  labels:
    app.kubernetes.io/name: cnpg-backup-verify
    app.kubernetes.io/component: database-backup-verification
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  # Daily after the 20:30 UTC base-backup schedule. A failure is observable
  # through the inert monitoring rule; Alertmanager delivery is C1.3.
  schedule: "30 21 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cnpg-backup-verify
            app.kubernetes.io/component: database-backup-verification
            app.kubernetes.io/part-of: vhhealth
        spec:
          restartPolicy: Never
          serviceAccountName: cnpg-backup-verifier
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: verify
              image: docker.io/amazon/aws-cli:2.34.53@sha256:cf53765c0de54ad3a8ea21818f1c4c845a8cf7ca87831c078a00fef244031493
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/opt/vhhealth/verify-cnpg-backup.sh"]
              env:
                - name: R2_ENDPOINT
                  value: "https://dbe488236c64499a3dfc797a750c912d.r2.cloudflarestorage.com"
                - name: R2_BUCKET
                  value: "vhhealth-db-backups"
                - name: R2_PREFIX
                  value: "cluster/"
                - name: BARMAN_SERVER_NAME
                  value: "vhhealth-pg18"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: cnpg-dr-reader-credentials
                      key: ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: cnpg-dr-reader-credentials
                      key: SECRET_ACCESS_KEY
                - name: AWS_DEFAULT_REGION
                  value: "auto"
                - name: AWS_EC2_METADATA_DISABLED
                  value: "true"
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "256Mi"
                  cpu: "500m"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: script
                  mountPath: /opt/vhhealth
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: cnpg-backup-verification-scripts
                defaultMode: 0555
            - name: tmp
              emptyDir: {}

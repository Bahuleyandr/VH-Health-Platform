# cnpg/scheduled-backup.yaml — sole production base-backup schedule.
#
# PRE-SYNC BLOCKER: the retired `vhhealth-pg-nightly` used
# `backupOwnerReference: self`. Before Argo prunes it, export every Backup CR it
# owns, preserve status/object evidence, detach only its ownerReference from
# each retained Backup, and prove none still names that schedule as an owner.
# Otherwise Kubernetes garbage collection can delete the retained Backup CR
# evidence with the old schedule. This replacement runs at 02:00 IST
# (20:30 UTC) and invokes the Barman Cloud Plugin.
#
# Restore procedure + quarterly drill: docs/DR_RESTORE_DRILL.md
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: vhhealth-pg-daily
  namespace: vhhealth-platform
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: vhhealth-pg
    app.kubernetes.io/component: database-backup
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
spec:
  # CNPG cron format includes seconds: sec min hour day month weekday
  schedule: "0 30 20 * * *"
  backupOwnerReference: self
  cluster:
    name: vhhealth-pg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  target: prefer-standby
  immediate: false

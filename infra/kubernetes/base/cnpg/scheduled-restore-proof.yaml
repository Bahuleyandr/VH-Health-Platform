# Inert C6.2 restore-only proof. It cannot create resources until an operator
# deliberately replaces every OWNER_INPUT value, seals three separated
# credentials, records the approved target time, and unsuspends it.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg-restore-proof
  namespace: vhhealth-restore-proof
  labels:
    app.kubernetes.io/name: cnpg-restore-proof
    app.kubernetes.io/part-of: vhhealth
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cnpg-restore-proof
  namespace: vhhealth-restore-proof
rules:
  - apiGroups: ["barmancloud.cnpg.io"]
    resources: ["objectstores"]
    verbs: ["get", "create", "delete"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "create", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cnpg-restore-proof
  namespace: vhhealth-restore-proof
subjects:
  - kind: ServiceAccount
    name: cnpg-restore-proof
    namespace: vhhealth-restore-proof
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cnpg-restore-proof
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cnpg-scheduled-restore-proof
  namespace: vhhealth-restore-proof
  labels:
    app.kubernetes.io/name: cnpg-restore-proof
    app.kubernetes.io/component: database-restore-proof
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
  annotations:
    vhhealth.app/measurement-scenario: restore-only
    vhhealth.app/decision-authority: C-D1
spec:
  schedule: "0 3 1 */3 *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 14400
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cnpg-restore-proof
            app.kubernetes.io/component: database-restore-proof
            app.kubernetes.io/part-of: vhhealth
        spec:
          serviceAccountName: cnpg-restore-proof
          # This workload intentionally calls the Kubernetes API to create and
          # UID-bound-delete its disposable proof resources.
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: prove-restore
              image: docker.io/curlimages/curl:8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/opt/vhhealth/scheduled-restore-proof.sh"]
              env:
                - name: R2_ENDPOINT
                  value: "https://dbe488236c64499a3dfc797a750c912d.r2.cloudflarestorage.com"
                - name: R2_BUCKET
                  value: "vhhealth-db-backups"
                - name: R2_PREFIX
                  value: "cluster/"
                - name: BARMAN_SERVER_NAME
                  value: "vhhealth-pg18"
                - name: PG18_IMAGE
                  value: "ghcr.io/cloudnative-pg/postgresql:18.4-standard-bookworm@sha256:0ec6b32ab5b644aa51da58443c5ac2c1724d97de0d2a88961920d437b71b9ad8"
                - name: RESTORE_TARGET_TIME
                  value: "OWNER_INPUT_RFC3339"
                - name: SOURCE_SAFE_POINT_TIME
                  value: "OWNER_INPUT_RFC3339"
                - name: APPROVED_TEST_TENANT_ID
                  value: "OWNER_INPUT_UUID"
                - name: APPROVED_TEST_PATIENT_UID
                  value: "OWNER_INPUT_UUID"
                - name: EXPECTED_ACTIVE_ADMISSIONS
                  value: "OWNER_INPUT_INTEGER"
                - name: EXPECTED_TIMELINE_MIN
                  value: "OWNER_INPUT_INTEGER"
                - name: EXPECTED_AUDIT_MIN
                  value: "OWNER_INPUT_INTEGER"
                - name: EXPECTED_MIGRATION_COUNT
                  value: "OWNER_INPUT_INTEGER"
                - name: EXPECTED_SCHEMA_CHECKSUM
                  value: "OWNER_INPUT_MD5"
                - name: SOURCE_COMMIT
                  value: "OWNER_INPUT_FULL_GIT_SHA"
                - name: LOCK_PROOF_SHA256
                  value: "OWNER_INPUT_SHA256"
                - name: DRILL_RUN_ID
                  value: "OWNER_INPUT_UNIQUE_RUN_ID"
                - name: APPLICATION_READ_URL
                  value: "https://restore-application.OWNER_INPUT.invalid/clinical-read"
                - name: APPLICATION_EXPECTED_MARKER
                  value: "OWNER_INPUT_PHIFREE_MARKER"
                - name: APPLICATION_READ_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: cnpg-restore-proof-application-reader
                      key: TOKEN
                - name: EVIDENCE_OBJECT_KEY
                  value: "OWNER_INPUT_PREFIX/OWNER_INPUT_UNIQUE_RUN_ID/restore-only.env"
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "128Mi"
                  cpu: "250m"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: script
                  mountPath: /opt/vhhealth
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: evidence
                  mountPath: /evidence
            - name: upload-evidence
              image: docker.io/amazon/aws-cli:2.34.53@sha256:cf53765c0de54ad3a8ea21818f1c4c845a8cf7ca87831c078a00fef244031493
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  while [ ! -f /evidence/complete ]; do
                    test ! -f /evidence/abort || exit 1
                    sleep 2
                  done
                  digest="$(sha256sum /evidence/restore-only.env | awk '{print $1}')"
                  printf '%s\n' "${digest}" > /evidence/upload-digest
                  aws --endpoint-url "${EVIDENCE_R2_ENDPOINT}" s3 cp \
                    /evidence/restore-only.env \
                    "s3://${EVIDENCE_R2_BUCKET}/${EVIDENCE_OBJECT_KEY}" \
                    --only-show-errors
                  aws --endpoint-url "${EVIDENCE_R2_ENDPOINT}" s3api head-object \
                    --bucket "${EVIDENCE_R2_BUCKET}" \
                    --key "${EVIDENCE_OBJECT_KEY}" >/evidence/upload-head.json
                  touch /evidence/uploaded
              env:
                - name: EVIDENCE_R2_ENDPOINT
                  value: "https://OWNER_INPUT_ACCOUNT.r2.cloudflarestorage.com"
                - name: EVIDENCE_R2_BUCKET
                  value: "OWNER_INPUT_RESTORE_EVIDENCE_BUCKET"
                - name: EVIDENCE_OBJECT_KEY
                  value: "OWNER_INPUT_PREFIX/OWNER_INPUT_UNIQUE_RUN_ID/restore-only.env"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: cnpg-restore-evidence-writer-credentials
                      key: ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: cnpg-restore-evidence-writer-credentials
                      key: SECRET_ACCESS_KEY
                - name: AWS_SESSION_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: cnpg-restore-evidence-writer-credentials
                      key: ACCESS_SESSION_TOKEN
                - name: AWS_DEFAULT_REGION
                  value: "auto"
                - name: AWS_EC2_METADATA_DISABLED
                  value: "true"
                - name: AWS_PAGER
                  value: ""
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "250m"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: evidence
                  mountPath: /evidence
                - name: tmp
                  mountPath: /tmp
            - name: read-back-evidence
              image: docker.io/amazon/aws-cli:2.34.53@sha256:cf53765c0de54ad3a8ea21818f1c4c845a8cf7ca87831c078a00fef244031493
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  while [ ! -f /evidence/uploaded ]; do
                    test ! -f /evidence/abort || exit 1
                    sleep 2
                  done
                  aws --endpoint-url "${EVIDENCE_R2_ENDPOINT}" s3 cp \
                    "s3://${EVIDENCE_R2_BUCKET}/${EVIDENCE_OBJECT_KEY}" \
                    /tmp/restore-only-readback.env \
                    --only-show-errors
                  expected="$(cat /evidence/upload-digest)"
                  actual="$(sha256sum /tmp/restore-only-readback.env | awk '{print $1}')"
                  test "${actual}" = "${expected}"
                  printf 'evidence_readback=passed sha256=%s\n' "${actual}" \
                    > /evidence/readback
              env:
                - name: EVIDENCE_R2_ENDPOINT
                  value: "https://OWNER_INPUT_ACCOUNT.r2.cloudflarestorage.com"
                - name: EVIDENCE_R2_BUCKET
                  value: "OWNER_INPUT_RESTORE_EVIDENCE_BUCKET"
                - name: EVIDENCE_OBJECT_KEY
                  value: "OWNER_INPUT_PREFIX/OWNER_INPUT_UNIQUE_RUN_ID/restore-only.env"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: cnpg-restore-evidence-reader-credentials
                      key: ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: cnpg-restore-evidence-reader-credentials
                      key: SECRET_ACCESS_KEY
                - name: AWS_SESSION_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: cnpg-restore-evidence-reader-credentials
                      key: ACCESS_SESSION_TOKEN
                - name: AWS_DEFAULT_REGION
                  value: "auto"
                - name: AWS_EC2_METADATA_DISABLED
                  value: "true"
                - name: AWS_PAGER
                  value: ""
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "250m"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: evidence
                  mountPath: /evidence
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: cnpg-restore-proof-scripts
                defaultMode: 0555
            - name: tmp
              emptyDir: {}
            - name: evidence
              emptyDir: {}

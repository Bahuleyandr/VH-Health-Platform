# Inert restore proof. It cannot create resources until an operator deliberately
# unsuspends it after completing the pre-sync qualification checklist.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg-restore-proof
  namespace: vhhealth-restore-proof
  labels:
    app.kubernetes.io/name: cnpg-restore-proof
    app.kubernetes.io/part-of: vhhealth
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cnpg-restore-proof
  namespace: vhhealth-restore-proof
rules:
  - apiGroups: ["barmancloud.cnpg.io"]
    resources: ["objectstores"]
    verbs: ["get", "create", "delete"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cnpg-restore-proof
  namespace: vhhealth-restore-proof
subjects:
  - kind: ServiceAccount
    name: cnpg-restore-proof
    namespace: vhhealth-restore-proof
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cnpg-restore-proof
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cnpg-scheduled-restore-proof
  namespace: vhhealth-restore-proof
  labels:
    app.kubernetes.io/name: cnpg-restore-proof
    app.kubernetes.io/component: database-restore-proof
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
spec:
  schedule: "0 3 1 */3 *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 7200
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cnpg-restore-proof
            app.kubernetes.io/component: database-restore-proof
            app.kubernetes.io/part-of: vhhealth
        spec:
          serviceAccountName: cnpg-restore-proof
          # This workload intentionally calls the Kubernetes API to create and
          # UID-bound-delete its disposable proof resources.
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            fsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: prove-restore
              image: docker.io/curlimages/curl:8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/opt/vhhealth/scheduled-restore-proof.sh"]
              env:
                - name: R2_ENDPOINT
                  value: "https://dbe488236c64499a3dfc797a750c912d.r2.cloudflarestorage.com"
                - name: R2_BUCKET
                  value: "vhhealth-db-backups"
                - name: R2_PREFIX
                  value: "cluster/"
                - name: BARMAN_SERVER_NAME
                  value: "vhhealth-pg18"
                - name: PG18_IMAGE
                  value: "ghcr.io/cloudnative-pg/postgresql:18.4-standard-bookworm@sha256:0ec6b32ab5b644aa51da58443c5ac2c1724d97de0d2a88961920d437b71b9ad8"
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "128Mi"
                  cpu: "250m"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: script
                  mountPath: /opt/vhhealth
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: cnpg-restore-proof-scripts
                defaultMode: 0555
            - name: tmp
              emptyDir: {}

apiVersion: v1
kind: ConfigMap
metadata:
  name: device-gateway-config
  namespace: vhhealth
data:
  DEVICE_GATEWAY_LISTENERS: |
    [
      {
        "name": "icu-monitors",
        "port": 2575,
        "adapter": "mllp-hl7v2",
        "tenant_slug": "default",
        "source_kind": "monitor"
      }
    ]
  DEVICE_GATEWAY_METRICS_PORT: "9108"
  DEVICE_GATEWAY_SPOOL_DIR: "/var/spool/vhhealth-device-gateway"
  DEVICE_GATEWAY_MAX_SPOOL_BYTES: "1073741824"
  # Held until every per-source identity, capacity, clock, retention, and
  # enrollment input has been supplied and owner-cleared.
  DEVICE_GATEWAY_I09_ENROLLMENTS: "[]"
  DEVICE_GATEWAY_DRAIN_INTERVAL_MS: "5000"
  # DEVICE_GATEWAY_COLD_CHAIN_PORT is intentionally unset. The cold-chain
  # HTTP ingest listener is opt-in and only starts when this variable is
  # explicitly set (e.g. "8088"). Enabling it also requires exposing the
  # port in service.yaml and allowing it in networkpolicy.yaml, which
  # currently expose only MLLP (2575) and metrics (9108).

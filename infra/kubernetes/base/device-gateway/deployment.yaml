apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-gateway
  namespace: vhhealth
  labels:
    app.kubernetes.io/name: device-gateway
    app.kubernetes.io/part-of: vhhealth
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: device-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: device-gateway
        app.kubernetes.io/part-of: vhhealth
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: device-gateway
          image: ghcr.io/bahuleyandr/vh-health-device-gateway:held
          imagePullPolicy: IfNotPresent
          ports:
            - name: mllp
              containerPort: 2575
            - name: metrics
              containerPort: 9108
          envFrom:
            - configMapRef:
                name: device-gateway-config
          env:
            - name: BACKEND_BASE_URL
              value: http://backend.vhhealth.svc.cluster.local:3000
            - name: DEVICE_GATEWAY_BACKEND_TOKEN
              valueFrom:
                secretKeyRef:
                  name: device-gateway-secret
                  key: backend-token
            - name: DEVICE_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: device-gateway-secret
                  key: api-key
          volumeMounts:
            - name: spool
              mountPath: /var/spool/vhhealth-device-gateway
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: spool
          persistentVolumeClaim:
            claimName: device-gateway-spool

apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-gateway
  namespace: vhhealth
  labels:
    app.kubernetes.io/name: device-gateway
    app.kubernetes.io/part-of: vhhealth
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: device-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: device-gateway
        app.kubernetes.io/part-of: vhhealth
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: device-gateway
          # PROVENANCE GAP, HELD BY DESIGN: no CI pipeline builds, signs, or
          # digest-pins this image — `:held` is a mutable tag that exists in
          # no registry, and neither .github/ nor .forgejo/ release workflows
          # cover the device gateway (release-images.yml builds backend/admin/
          # staff-web only). This tree is deliberately outside the production
          # composition, so the unpullable ref is fail-closed as committed.
          # ACTIVATION REQUIREMENT: before composing this manifest, add a
          # signed image build (cosign, matching the backend/admin release
          # pipeline) and replace this ref with an immutable @sha256 digest —
          # the Kyverno verify-images policy (base/image-policy/) flags a
          # hand-built unsigned image. See apps/backend/docs/RUNBOOKS/
          # device-gateway-activation.md.
          image: ghcr.io/bahuleyandr/vh-health-device-gateway:held
          imagePullPolicy: IfNotPresent
          ports:
            - name: mllp
              containerPort: 2575
            - name: metrics
              containerPort: 9108
          envFrom:
            # Project operator-sealed per-analyzer LIS tokens by their dynamic
            # token_env names. Keep this before the ConfigMap so non-secret
            # configuration remains authoritative on any accidental collision.
            - secretRef:
                name: device-gateway-secret
            - configMapRef:
                name: device-gateway-config
          env:
            # Matches the real backend Service (infra/kubernetes/apps/backend/
            # service.yaml): name vhhealth-backend, port 80 → targetPort http
            # (5000). Same portless form the admin ConfigMap uses.
            - name: BACKEND_BASE_URL
              value: http://vhhealth-backend.vhhealth.svc.cluster.local
            - name: DEVICE_GATEWAY_BACKEND_TOKEN
              valueFrom:
                secretKeyRef:
                  name: device-gateway-secret
                  key: backend-token
            - name: DEVICE_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: device-gateway-secret
                  key: api-key
          volumeMounts:
            - name: spool
              mountPath: /var/spool/vhhealth-device-gateway
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: spool
          persistentVolumeClaim:
            claimName: device-gateway-spool

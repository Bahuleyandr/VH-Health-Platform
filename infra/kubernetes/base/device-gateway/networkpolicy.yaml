apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: device-gateway-locked-egress
  namespace: vhhealth
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: device-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.40.0.0/16
      ports:
        - protocol: TCP
          port: 2575
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vhhealth-monitoring
      ports:
        - protocol: TCP
          port: 9108
  egress:
    # Backend REST API (device resolve + vitals ingest + spool drain). The
    # Service is vhhealth-backend:80, but NetworkPolicy is evaluated after
    # the Service DNAT, so the rule must name the pod label and pod port.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vhhealth-backend
      ports:
        - protocol: TCP
          port: 5000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

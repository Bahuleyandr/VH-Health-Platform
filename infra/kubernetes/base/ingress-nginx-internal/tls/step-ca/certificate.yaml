# UNSELECTED C-D13 option. Do not add this component to a base or overlay
# until the security owner approves the issuer, trust, pin, and SAN contract.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vhhealth-internal-api
  namespace: vhhealth
  labels:
    app.kubernetes.io/name: vhhealth-backend
    app.kubernetes.io/component: internal-api-tls
    app.kubernetes.io/part-of: vhhealth
  annotations:
    vhhealth.app/activation-hold: C-D13
spec:
  secretName: c-d13-unprovisioned-internal-api-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: replace-with-approved-internal-issuer
  dnsNames:
    - api.vhhealth.app
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
    - server auth

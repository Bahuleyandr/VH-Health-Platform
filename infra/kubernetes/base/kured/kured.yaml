# kured/kured.yaml — Kubernetes Reboot Daemon
#
# Watches `/var/run/reboot-required` on each node. When found, drains
# the node (respecting PDBs), reboots it, then uncordons. Only operates
# inside the maintenance window Sunday 02:00-04:00 IST.
#
# Leader election ensures at most one node reboots at a time.
#
# Runs in kube-system by convention (it's a cluster-lifecycle tool, not
# an app). The namespace is NOT `vhhealth-*`.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kured
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kured
    app.kubernetes.io/instance: kured
    app.kubernetes.io/component: reboot-daemon
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kured
  labels:
    app.kubernetes.io/name: kured
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, delete, get]
  - apiGroups: [apps]
    resources: [daemonsets]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kured
  labels:
    app.kubernetes.io/name: kured
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kured
subjects:
  - kind: ServiceAccount
    name: kured
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kured
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kured
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
rules:
  - apiGroups: [""]
    resources: [daemonsets]
    verbs: [update]
  - apiGroups: [apps]
    resources: [daemonsets]
    verbs: [update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kured
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kured
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kured
subjects:
  - kind: ServiceAccount
    name: kured
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kured
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kured
    app.kubernetes.io/instance: kured
    app.kubernetes.io/component: reboot-daemon
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kured
      app.kubernetes.io/instance: kured
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kured
        app.kubernetes.io/instance: kured
        app.kubernetes.io/component: reboot-daemon
        app.kubernetes.io/part-of: vhhealth
        app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: kured
      hostPID: true
      restartPolicy: Always
      tolerations:
        - operator: Exists
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      containers:
        - name: kured
          image: ghcr.io/kubereboot/kured:1.16.2@sha256:c8c19766c778ba7fe87b4321eef05ba81dcc893a366a4cb3da00bf66a6d5d4df
          imagePullPolicy: IfNotPresent
          command:
            - /usr/bin/kured
          args:
            - --reboot-days=sun
            - --start-time=02:00
            - --end-time=04:00
            - --time-zone=Asia/Kolkata
            - --period=60m
            - --drain-grace-period=300
            - --drain-timeout=20m
            - --reboot-sentinel=/var/run/reboot-required
            - --notify-url=alertmanager-webhook://vhhealth-monitoring-alertmanager.vhhealth-monitoring.svc.cluster.local:9093/api/v2/alerts
            - --prometheus-url=http://vhhealth-monitoring-kube-prom-prometheus.vhhealth-monitoring.svc.cluster.local:9090
            - --metrics-host=0.0.0.0
            - --metrics-port=8080
            - --log-format=json
          env:
            - name: KURED_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http-metrics
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
          livenessProbe:
            httpGet:
              path: /metrics
              port: http-metrics
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /metrics
              port: http-metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [SYS_BOOT, SYS_PTRACE]
          volumeMounts:
            - name: reboot-required
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: reboot-required
          hostPath:
            path: /var/run
            type: Directory
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kured
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kured
    app.kubernetes.io/instance: kured
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kured
    app.kubernetes.io/instance: kured
  ports:
    - name: http-metrics
      port: 8080
      targetPort: 8080
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kured
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kured
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
    release: vhhealth-monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kured
      app.kubernetes.io/instance: kured
  namespaceSelector:
    matchNames:
      - kube-system
  endpoints:
    - port: http-metrics
      interval: 60s
      path: /metrics

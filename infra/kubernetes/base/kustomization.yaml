# base/kustomization.yaml — top-level VH Health platform base
#
# Order matters only for `kustomize build` output readability; Argo CD
# applies resources with server-side apply + waves. Use annotation
# `argocd.argoproj.io/sync-wave: "N"` on individual resources to
# sequence bootstrap (namespaces wave 0, CRDs wave 1, operators wave 2,
# operands wave 3, apps wave 4).
#
# Everything here is consumed by `overlays/<env>/kustomization.yaml`
# via `bases:` so prod/staging/dev can patch individual pieces.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: vhhealth-platform-base
resources:
  - _common
  - sealed-secrets
  - cert-manager
  - step-ca
  - vault
  - cnpg
  - redis
  - minio
  - harbor
  - ingress-nginx
  - cloudflare-tunnel
  - monitoring
  - falco
  - kured
  - argocd
  # Kyverno ClusterPolicy that verifies keyless-cosign image signatures at
  # admission (audit finding M16 / B0.6). Renders the policy in Audit mode;
  # the operator flips validationFailureAction to Enforce after one clean audit
  # cycle (see image-policy/kyverno-verify-images.yaml + the operator step in
  # docs/PHASE0_OPERATOR_ACTIONS_2026-06-10.md §6). PREREQUISITE: Kyverno must
  # be installed in the cluster (it is NOT vendored here — see the policy file
  # header for the install command); the ClusterPolicy CRD must exist before
  # ArgoCD can apply this resource.
  - image-policy
  # Longhorn replicated block storage (INF-5 / B2.6). The ArgoCD Application
  # CR in this directory installs Longhorn via Helm; the StorageClass is
  # declared here so prod overlay patches can reference it.
  # NOTE: dev overlay intentionally excludes longhorn — it uses local-path.
  - longhorn

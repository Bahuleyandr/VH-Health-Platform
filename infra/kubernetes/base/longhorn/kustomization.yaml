# longhorn/kustomization.yaml
#
# Only the StorageClass and ArgoCD Application are vendored here. The Longhorn
# operator pods, CRDs, and DaemonSets are deployed by ArgoCD from the Helm
# chart (longhorn-app.yaml). We list longhorn-app.yaml here so that ArgoCD's
# vhhealth-platform Application (which syncs the prod overlay) applies the
# child Application CR — "app of apps" pattern.
#
# Sync wave ordering:
#   Wave -5: longhorn-app.yaml  (ArgoCD deploys Longhorn from Helm)
#   Wave  0: storageclass.yaml  (StorageClass available once CRDs are ready)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: vhhealth-longhorn
resources:
  - longhorn-app.yaml
  - storageclass.yaml

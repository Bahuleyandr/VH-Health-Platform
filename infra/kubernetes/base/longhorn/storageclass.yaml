# longhorn/storageclass.yaml — Longhorn StorageClasses (INF-5 / B2.6)
#
# Two classes:
#   longhorn         — 3-replica, Retain, for production stateful workloads
#   longhorn-single  — 1-replica, Delete, for scratch / dev use where
#                      local-path is unavailable (e.g. single-node staging)
#
# The `longhorn` class is NOT the Kubernetes default (defaultClass: false in
# the ArgoCD Application values). Any later, independently approved placement
# must explicitly name `storageClassName: longhorn`; no workload selects it in
# this slice.
#
# reclaimPolicy: Retain — a released volume remains retained for an explicit,
# separately reviewed disposition. This is intentional for PHI data.
#
# volumeBindingMode: WaitForFirstConsumer — the PV is only provisioned when
# a pod is scheduled. Longhorn's three replicas are storage copies on eligible
# nodes, not proof of independent facility failure domains.
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn
  labels:
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
  annotations:
    # This is NOT the default class — explicit adoption only.
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
parameters:
  # Three node-level copies; this does not establish rack/power/network
  # independence.
  numberOfReplicas: "3"
  # A stale replica is eligible for cleanup after 30 minutes.
  staleReplicaTimeout: "30"
  # Filesystem for block volumes.
  fsType: ext4
  # Longhorn backup target (inherits from defaultSettings in the app).
  # Individual volumes can override.
  recurringJobSelector: '[]'
  dataLocality: best-effort   # Prefer a local replica where possible.
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-single
  labels:
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
parameters:
  numberOfReplicas: "1"
  staleReplicaTimeout: "30"
  fsType: ext4
  dataLocality: strict-local  # Must run on the same node as the pod.

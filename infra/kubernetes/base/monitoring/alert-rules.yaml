# monitoring/alert-rules.yaml — VH Health alerting rules
#
# Rules are PrometheusRule CRs picked up by the kube-prometheus-stack
# operator (via the release=vhhealth-monitoring label selector in its
# values). C1.1 commits rule definitions only. Alertmanager delivery is not
# active evidence and remains owned by C1.3.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vhhealth-platform-alerts
  namespace: vhhealth-monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: rules
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
    release: vhhealth-monitoring
spec:
  groups:
    - name: nodes
      interval: 30s
      rules:
        - alert: NodeDown
          expr: up{job="node-exporter"} == 0
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Node {{ $labels.instance }} is down"
            description: "node_exporter has been unreachable for 5 minutes on {{ $labels.instance }}."
            runbook: "apps/backend/docs/RUNBOOKS/node-down.md"

        - alert: NodeHighCPU
          expr: (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 0.85
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "High CPU on {{ $labels.instance }}"
            description: "CPU usage above 85% on {{ $labels.instance }} for 10 minutes."

        - alert: NodeHighMemory
          expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "High memory on {{ $labels.instance }}"
            description: "Memory usage above 90% on {{ $labels.instance }} for 10 minutes."

        - alert: PVCNearlyFull
          expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) > 0.85
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is 85% full"
            description: "Expand the PVC or delete old data before it runs out."

        - alert: PVCCritical
          expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) > 0.95
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is 95% full"

    - name: workloads
      interval: 30s
      rules:
        - alert: PodCrashLoopBackOff
          expr: rate(kube_pod_container_status_restarts_total[15m]) * 60 * 5 > 5
          for: 15m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash-looping"
            description: "More than 5 restarts in 15 minutes."

        - alert: DeploymentReplicasMismatch
          expr: kube_deployment_spec_replicas{namespace=~"vhhealth.*"} != kube_deployment_status_replicas_available{namespace=~"vhhealth.*"}
          for: 15m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has fewer ready replicas than desired"

        - alert: StatefulSetReplicasMismatch
          expr: kube_statefulset_status_replicas_ready{namespace=~"vhhealth.*"} != kube_statefulset_status_replicas{namespace=~"vhhealth.*"}
          for: 15m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} has fewer ready replicas than desired"

    - name: postgres
      interval: 30s
      rules:
        # ── WHERE THESE SERIES COME FROM (re-audit 2026-08-23) ────────────────
        # The cnpg_vhhealth_* series below are produced by the in-pod CNPG
        # Prometheus exporter running the user-defined queries in
        # infra/kubernetes/base/cnpg/cluster.yaml (ConfigMap
        # vhhealth-pg-custom-queries, wired via
        # spec.monitoring.customQueriesConfigMap). CNPG names a user-defined
        # query's non-LABEL columns `cnpg_<query>_<column>`, so query
        # `vhhealth_connections` column `total` is exported as
        # `cnpg_vhhealth_connections_total` — not the bare
        # `vhhealth_connections_total` these rules used to reference. Four rules
        # (PostgresReplicationLagHigh, PostgresReplicationLagCritical and
        # PostgresConnectionsHigh below, plus C6WarmStandbyReplicationLagHigh in
        # the c6-2-backup-dr group) therefore selected series that no target has
        # ever produced, and could never fire. The convention is relied on correctly
        # elsewhere in the repo: CnpgWalArchivingStalled below reads
        # cnpg_pg_stat_archiver_*, and CNPGReplicationLagHigh in
        # backend-red-alerts.yaml reads cnpg_pg_replication_lag — both CNPG
        # built-ins rather than user-defined queries.
        #
        # ── THE RENAME WAS ONLY HALF OF IT (round 2) ──────────────────────────
        # Resolving the names left the three replication rules inert for a
        # second, independent reason: the query's `lag_seconds` column was
        # `now() - pg_last_xact_replay_timestamp()`, a standby-side, server-wide
        # scalar. On a never-promoted primary it is NULL and was COALESCEd to 0,
        # so nothing could ever cross 60/300/30; on a CNPG-promoted primary it
        # freezes at the pre-promotion replay timestamp, so the difference grows
        # without bound and all three would have fired permanently after a
        # failover. cluster.yaml now exports pg_stat_replication's per-standby
        # write_lag / flush_lag / replay_lag intervals, which are what
        # PostgreSQL maintains for this measurement, and these rules threshold on
        # `replay_lag_seconds`: WAL is written, then flushed, then applied, so
        # replay is the last stage and its lag is the outermost of the three —
        # and it is what the "lagging" / "streaming lag" wording in these
        # annotations describes, the delay before a transaction becomes visible
        # on the replica. `flush_lag_seconds` (durability, the RPO-relevant one)
        # and `write_lag_seconds` are exported alongside for diagnosis; moving an
        # alert onto flush_lag would loosen it, so that is an operator decision
        # and is not made here.
        #
        # LABELS COME FROM THE SAME QUERY ROW: `client`, `application_name` and
        # `state` are declared `usage: LABEL` on the vhhealth_replication query,
        # so they are labels on these gauges. The {{ $labels.client }}
        # annotations here and the {application_name=~"(?i).*dr.*"} selector on
        # C6WarmStandbyReplicationLagHigh depend on that.
        #
        # ── WHAT IS AND IS NOT PROVEN STATICALLY ──────────────────────────────
        # check-cnpg-metric-parity.mjs, run by validate-monitoring.mjs in CI,
        # re-derives `cnpg_<query>_<column>` from cluster.yaml and fails when any
        # rule here selects a cnpg_vhhealth_* series — or a label on one — that
        # no user-defined query produces. That is the check the original miss
        # needed: promtool fixtures could not catch it, because the same author
        # writes the rule and the sample it is fed. It still cannot confirm the
        # `cnpg_` prefix convention itself against a live scrape (the test rig
        # runs a plain postgres StatefulSet; only the hospital overlay runs
        # CNPG), so PostgresConnectionMetricsAbsent and
        # PostgresReplicationMetricAbsent below make a wrong prefix page instead
        # of passing as silence.
        - alert: PostgresReplicationLagHigh
          expr: cnpg_vhhealth_replication_replay_lag_seconds > 60
          for: 5m
          labels:
            severity: warning
            team: database
          annotations:
            summary: "Postgres replica {{ $labels.client }} lagging > 60s"
            description: "pg_stat_replication.replay_lag for this standby, read on the primary: the delay between the primary flushing WAL and this standby reporting it applied. Currently {{ $value }}s."

        - alert: PostgresReplicationLagCritical
          expr: cnpg_vhhealth_replication_replay_lag_seconds > 300
          for: 5m
          labels:
            severity: critical
            team: database
          annotations:
            summary: "Postgres replica {{ $labels.client }} lagging > 5 minutes"
            description: "Same measure as PostgresReplicationLagHigh — pg_stat_replication.replay_lag for this standby — past the 300s budget. Check cnpg_vhhealth_replication_flush_lag_seconds and cnpg_vhhealth_replication_lag_bytes on the same labels to tell a slow apply apart from a stalled stream."

        - alert: PostgresConnectionsHigh
          expr: cnpg_vhhealth_connections_total / cnpg_vhhealth_connections_max_conn > 0.85
          for: 5m
          labels:
            severity: warning
            team: database
          annotations:
            summary: "Postgres connection usage is above 85% of max_connections"
            description: "Both operands come from the same vhhealth_connections query row, so they carry identical labels and divide per CNPG instance. Check for a connection leak or a runaway client before the pool exhausts max_connections."

        # ── META-ALERTS: the metric itself must exist ──────────────────────────
        # A rule that references a series nobody exports looks exactly like a
        # rule that is healthy and quiet. That is how the four rules named in the
        # group header shipped inert. These two convert "the assumed name does
        # not exist" from silence into a page, following the absent() posture
        # already used by CnpgWalArchivingStalled and CnpgBackupVerifyStale.
        #
        # PostgresConnectionMetricsAbsent catches a wholesale naming miss on a
        # real CNPG cluster: pg_stat_activity is never empty, so every scraped
        # CNPG instance exports these two columns on every cluster size, dev
        # included. It is gated on CNPG actually running — `count(cnpg_collector_up)
        # > 0`, the operator's built-in exporter health series, present on every
        # CNPG instance regardless of the customQueriesConfigMap. Without that
        # gate the rule pages forever on a plain-postgres StatefulSet (the test
        # rig, and any non-CNPG overlay), where no cnpg_ series exists at all —
        # which is silence-not-fault, not a naming miss. On a real CNPG cluster
        # cnpg_collector_up is present, so a missing vhhealth_connections series
        # still pages. (The gate cannot be the connections series itself — that is
        # the series being tested for absence.)
        - alert: PostgresConnectionMetricsAbsent
          expr: (absent(cnpg_vhhealth_connections_total) or absent(cnpg_vhhealth_connections_max_conn)) and (count(cnpg_collector_up) > 0)
          for: 15m
          labels:
            severity: warning
            team: database
          annotations:
            summary: "CNPG connection-usage metrics are not being exported — PostgresConnectionsHigh is blind"
            description: "The vhhealth_connections user-defined query reads pg_stat_activity, so it yields a row on every instance whenever the exporter is scraped at all. This alert is gated on CNPG running (count(cnpg_collector_up) > 0), so it stays silent on a non-CNPG rig instead of paging forever; on a CNPG cluster its firing means the customQueriesConfigMap is not mounted, the query is erroring, or the exported names are not cnpg_vhhealth_connections_total / cnpg_vhhealth_connections_max_conn. Read the real names off a live instance before editing the rules: kubectl exec -n vhhealth-platform vhhealth-pg-1 -c postgres -- curl -s localhost:9187/metrics | grep vhhealth"

        # Gated arm: pg_stat_replication is empty on a single-instance cluster,
        # and overlays/dev patches spec.instances to 1, so absence there is
        # correct rather than a fault. count() over the connections series is the
        # instance count (one row per scraped CNPG pod), so >1 means a standby is
        # expected to be streaming.
        - alert: PostgresReplicationMetricAbsent
          expr: absent(cnpg_vhhealth_replication_replay_lag_seconds) and (count(cnpg_vhhealth_connections_total) > 1)
          for: 15m
          labels:
            severity: critical
            team: database
          annotations:
            summary: "CNPG replication-lag metric is missing on a multi-instance cluster — three replication alerts are blind"
            description: "PostgresReplicationLagHigh, PostgresReplicationLagCritical and C6WarmStandbyReplicationLagHigh all read cnpg_vhhealth_replication_replay_lag_seconds, exported by the primary from pg_stat_replication. On a cluster with more than one instance it must exist. Either no standby is streaming at all — a synchronous-commit and DR-readiness incident — or the exported metric name is not what those rules assume. If the connections series is missing too this rule stays silent by design; PostgresConnectionMetricsAbsent is the arm that fires for a wholesale naming miss."

        # ── STANDBY-SIDE ARM ──────────────────────────────────────────────────
        # The three rules above are read on the PRIMARY, one row per connected
        # WAL sender, and that view has a blind spot: when a standby's WAL sender
        # disconnects its row disappears rather than growing, so a partitioned or
        # crashed standby registers as absence, not lag.
        #
        # A standby-side query was drafted for this and then withdrawn: every
        # formulation available to a custom query reads pg_last_wal_receive_lsn(),
        # which FREEZES when the walreceiver exits, so receive_lsn equals
        # replay_lsn and the metric reports "caught up" during exactly the link
        # loss it was meant to catch. CNPG's built-in pg_replication collector
        # already covers standby-side lag and is alerted on by
        # CNPGReplicationLagHigh in backend-red-alerts.yaml; a second, subtly
        # wrong copy of it here would be worse than none.

        # Gap-audit 2026-08 (HIGH-2): continuous WAL archiving had no alert.
        # The Barman Cloud plugin (cnpg/cluster.yaml, isWALArchiver: true) could
        # wedge and the first signal was CnpgBackupVerifyStale ~30 hours later —
        # a silent PITR-degradation window in which every unarchived WAL segment
        # is recovery the hospital does not have. CNPG's default queries export
        # cnpg_pg_stat_archiver_* via the enabled PodMonitor.
        #
        # Three arms:
        #   1. Staleness — CNPG pins archive_timeout to 5m, so a healthy primary
        #      archives at least every 5 minutes; 900s (= 3 missed cycles) is
        #      comfortably above one archiver cycle yet ≪ the 30h verify window.
        #      The `>= 0` inner filter drops the NaN the exporter emits for
        #      replicas (NULL last_archived_time — replicas do not archive).
        #   2. Failure — the failed counter rising over 15m means archive
        #      attempts are erroring right now, even if an older success keeps
        #      the staleness arm quiet.
        #   3. absent() guard per the CanaryHealthCheckStale precedent: a scrape
        #      gap must not read as healthy while archiving is unobserved.
        - alert: CnpgWalArchivingStalled
          expr: >
            max(cnpg_pg_stat_archiver_seconds_since_last_archival{namespace="vhhealth-platform"} >= 0) > 900
            or (max_over_time(cnpg_pg_stat_archiver_failed_count{namespace="vhhealth-platform"}[15m])
                - min_over_time(cnpg_pg_stat_archiver_failed_count{namespace="vhhealth-platform"}[15m])) > 0
            or absent(cnpg_pg_stat_archiver_seconds_since_last_archival{namespace="vhhealth-platform"})
          for: 15m
          labels:
            severity: critical
            team: database
          annotations:
            summary: "CNPG WAL archiving is stalled or failing — PITR coverage is degrading now"
            description: "The primary has not archived a WAL segment for >15 minutes, the archiver failure counter is rising, or the archiver metric is absent. Every unarchived segment widens the point-in-time-recovery gap; do not wait for the daily backup verify (~30h) to notice. Check the Barman Cloud plugin sidecar logs, the ObjectStore status, and pg_stat_archiver on the primary in ns vhhealth-platform."
            runbook: "docs/DR_RESTORE_DRILL.md"

    - name: certificates
      interval: 300s
      rules:
        - alert: CertificateExpiringSoon
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 30 * 24 * 3600
          for: 1h
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in <30 days"
            description: "Check cert-manager logs if renewal isn't happening automatically."

        - alert: CertificateExpiringVerySoon
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 7 * 24 * 3600
          for: 1h
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in <7 days"

    - name: cloudflared
      interval: 30s
      rules:
        - alert: CloudflaredTunnelDown
          expr: cloudflared_tunnel_active_streams < 1
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Cloudflare Tunnel has no active streams"
            description: "All public API traffic is affected. Check cloudflared pod logs."

    - name: harbor
      interval: 30s
      rules:
        - alert: HarborRegistryDown
          expr: up{job=~".*harbor.*"} == 0
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Harbor registry component down: {{ $labels.instance }}"
            description: "Image pulls/pushes may fail. Check {{ $labels.job }}."

    # Audit 2026-06-22 (observability): the synthetic-outage signals were
    # themselves unmonitored — if the canary CronJob or the CNPG backup-verify
    # CronJob silently stops scheduling (controller wedged, namespace/RBAC
    # defect, suspended) or starts failing, the very check that would surface a
    # real outage / a bad backup goes dark with no alert. These watch the
    # watchers via kube-state-metrics.
    - name: synthetic-checks
      interval: 1m
      rules:
        - alert: CanaryHealthCheckStale
          # canary-health-check runs every 5m; >30m without a new schedule =
          # the CronJob controller isn't firing it.
          expr: time() - max(kube_cronjob_status_last_schedule_time{namespace="vhhealth", cronjob="canary-health-check"}) > 1800
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Canary health-check CronJob has not run in >30m"
            description: "The synthetic DB read/write + stuck-notification + unacked-critical-alert check is not scheduling. The platform may be degraded with no signal. Check the canary-health-check CronJob in ns vhhealth."
        - alert: CanaryHealthCheckFailing
          expr: max(kube_job_status_failed{namespace="vhhealth", job_name=~"^canary-health-check.*"}) > 0
          for: 15m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Canary health-check job is failing"
            description: "The most recent canary-health-check Job reported a failure — either the canary itself is broken or it is detecting a real fault. Inspect the Job logs in ns vhhealth."
        - alert: CnpgBackupVerifyStale
          # cnpg-backup-verify runs daily at 21:30 UTC. More than 30 hours
          # without a schedule, or no scheduling metric, means the check is dark.
          expr: (time() - max(kube_cronjob_status_last_schedule_time{namespace="vhhealth-platform", cronjob="cnpg-backup-verify"}) > 108000) or absent(kube_cronjob_status_last_schedule_time{namespace="vhhealth-platform", cronjob="cnpg-backup-verify"})
          for: 1h
          labels:
            severity: critical
            team: backup
          annotations:
            summary: "CNPG backup-verify CronJob has not run in >30 hours"
            description: "Backup restorability is no longer being verified — a 'WAL with no good base backup' failure could go undetected until a real restore. Check the cnpg-backup-verify CronJob in ns vhhealth-platform."
        - alert: CnpgBackupVerifyFailing
          expr: max(kube_job_status_failed{namespace="vhhealth-platform", job_name=~"^cnpg-backup-verify.*"}) > 0
          for: 1h
          labels:
            severity: critical
            team: backup
          annotations:
            summary: "CNPG backup-verify job is failing"
            description: "The latest cnpg-backup-verify Job failed — the R2 base backup may be missing or unrestorable. Treat as a DR-readiness incident. Inspect the Job logs in ns vhhealth-platform."
        - alert: CnpgPluginBackupFailed
          expr: |
            max(barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp)
              > max(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp)
          for: 15m
          labels:
            severity: critical
            team: backup
          annotations:
            summary: "The latest Barman Cloud Plugin backup attempt failed"
            description: "The plugin reports a failed backup newer than its last available backup. Preserve the healthy WAL stream and inspect the Backup CR, ObjectStore status, and plugin logs."
            runbook: "docs/DR_RESTORE_DRILL.md"
        - alert: CnpgRestoreProofUnexpectedlyEnabled
          expr: |
            kube_cronjob_spec_suspend{
              namespace="vhhealth-restore-proof",
              cronjob="cnpg-scheduled-restore-proof"
            } == 0
          for: 5m
          labels:
            severity: critical
            team: backup
          annotations:
            summary: "The operator-gated CNPG restore proof is not suspended"
            description: "C1.1 ships this CronJob suspended. Suspend it immediately unless a recorded synthetic restore drill is actively in progress."
            runbook: "docs/DR_RESTORE_DRILL.md"

    # C6.2 adds rule expressions only. C1.3's existing team=backup and
    # team=database routing tree owns receivers and delivery activation.
    - name: c6-2-backup-dr
      interval: 1m
      rules:
        - alert: C6BackupLockNotEffective
          expr: (vhhealth_c6_2_backup_lock_effective == 0) or absent(vhhealth_c6_2_backup_lock_effective)
          for: 5m
          labels:
            severity: critical
            team: backup
          annotations:
            summary: "The approved C6.2 database backup lock is not effective"
            description: "The operator-published lock attestation metric reports that the approved production archive prefix is not protected. Preserve the last recoverable generation and follow the C6.2 lock runbook."
            runbook: "docs/runbooks/C6_2_R2_LOCK_AND_RESTORE_DRILL.md"
        - alert: C6RestoreProofFailed
          expr: max(kube_job_status_failed{namespace="vhhealth-restore-proof", job_name=~"^cnpg-scheduled-restore-proof.*"}) > 0
          for: 5m
          labels:
            severity: critical
            team: backup
          annotations:
            summary: "The C6.2 timed restore-only proof failed"
            description: "This is a C-D1 restore-only evidence failure. It does not measure or fail C-D9's separate warm-promotion target."
            runbook: "docs/runbooks/C6_2_R2_LOCK_AND_RESTORE_DRILL.md"
        - alert: C6RetentionRemovalUnexpectedlyEnabled
          expr: kube_cronjob_spec_suspend{namespace="vhhealth-platform", cronjob="cnpg-retention-removal"} == 0
          for: 5m
          labels:
            severity: critical
            team: backup
          annotations:
            summary: "The operator-gated C6.2 retention remover is not suspended"
            description: "Suspend it unless a named legal/security/backup-approved exact-object removal window is active. Never retry a lock-denied deletion by widening authority."
            runbook: "docs/runbooks/C6_2_R2_LOCK_AND_RESTORE_DRILL.md"
        - alert: C6RetentionRemovalFailed
          expr: max(kube_job_status_failed{namespace="vhhealth-platform", job_name=~"^cnpg-retention-removal.*"}) > 0
          for: 5m
          labels:
            severity: critical
            team: backup
          annotations:
            summary: "The C6.2 approved-object retention-removal job failed"
            description: "Inspect the immutable approval inventory, Barman boundary, legal-hold and bucket-lock proof. Do not grant the database writer delete authority."
            runbook: "docs/runbooks/C6_2_R2_LOCK_AND_RESTORE_DRILL.md"
        # Series name and measure both come from the postgres-group header above:
        # the CNPG exporter publishes user-defined-query columns as
        # cnpg_<query>_<column>, and the seconds column is now
        # pg_stat_replication.replay_lag for this standby rather than the
        # local-recovery scalar that could never move on a primary. The
        # `application_name` selector is unaffected — it is a `usage: LABEL`
        # column on the same vhhealth_replication query, so it is a label on this
        # series exactly as before.
        #
        # replay_lag, not flush_lag, because this alert's stated job is the
        # health of the async stream end-to-end and it explicitly does not claim
        # to prove RPO; flush_lag is the RPO measure and is never larger, so
        # switching to it would loosen a critical DR alert. It is exported as
        # cnpg_vhhealth_replication_flush_lag_seconds if an operator decides to
        # make that change.
        - alert: C6WarmStandbyReplicationLagHigh
          expr: cnpg_vhhealth_replication_replay_lag_seconds{application_name=~"(?i).*dr.*"} > 30
          for: 5m
          labels:
            severity: critical
            team: database
          annotations:
            summary: "C6.2 warm-standby streaming lag exceeds 30 seconds"
            description: "The Phase 2 target is evaluated only by a promotion drill; this signal protects the async stream and does not itself prove RPO."
            runbook: "docs/runbooks/C6_2_WARM_STANDBY_PROMOTION_FAILBACK.md"
    # Security-event pipeline (once-over 2026-08-23 HIGH): these fire from the
    # backend's own counters, so they page even when the security-webhook
    # channel is disabled or misconfigured — a deliberate second channel.
    - name: security-events
      rules:
        - alert: SecurityAuditChainTampered
          expr: increase(vhhealth_security_webhook_events_total{event_type="AUDIT_CHAIN_TAMPERED"}[15m]) > 0
          labels:
            severity: critical
            team: backend
          annotations:
            summary: "Audit hash-chain tamper detected"
            description: "The nightly audit-chain verifier found broken links. Treat as an active integrity incident; identify the first broken sequence from the backend logs and audit_log."
        # Re-audit 2026-08-23: this matcher was `event_type=~"BREAK_GLASS_.*"`
        # and could never match. Prometheus label regexes are FULLY ANCHORED
        # (the matcher is compiled as ^(?:BREAK_GLASS_.*)$), and the only
        # producer — alertBreakGlass() in
        # apps/backend/src/services/security/breakGlassService.js — emits
        # 'PHI_BREAK_GLASS_ACTIVATED' and 'PHI_BREAK_GLASS_REVOKED'. The
        # unanchored-looking prefix silently selected nothing. `.*BREAK_GLASS.*`
        # is deliberately anchor-proof: it keeps matching if the PHI_ prefix is
        # dropped, renamed, or extended again. No other emitted event type
        # contains the substring BREAK_GLASS.
        - alert: SecurityBreakGlassActivated
          expr: increase(vhhealth_security_webhook_events_total{event_type=~".*BREAK_GLASS.*"}[15m]) > 0
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "A break-glass access grant was activated or revoked"
            description: "Break-glass use is legitimate but must always be reviewed. Cross-check the actor and reason in audit_log and the break-glass review queue."
        - alert: SecurityPagingUnconfigured
          expr: increase(vhhealth_security_webhook_events_total{outcome="disabled"}[1h]) > 0
          for: 5m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "Security events occurred while webhook paging is disabled"
            description: "sendSecurityWebhook dropped events because SECURITY_WEBHOOKS_ENABLED/SECURITY_WEBHOOK_URL are unset. Either enable paging (ConfigMap flag + sealed URL) or accept and silence during quiet hours."

        # ── The second exported counter ────────────────────────────────────────
        # vhhealth_security_events_total
        # (apps/backend/src/observability/securityEventMetrics.js, shipped by
        # #914) increments on EVERY logSecurityEvent() call, independently of
        # webhook configuration. Until this change no rule consumed it, so the
        # brute-force and lockout signals the backend already emits reached only
        # audit_log rows and log lines. These two rules page off that counter and
        # therefore work while the webhook channel stays disabled.
        - alert: SecurityBruteForceDetected
          expr: increase(vhhealth_security_events_total{event_type="BRUTE_FORCE_DETECTED"}[15m]) > 0
          labels:
            severity: critical
            team: backend
          annotations:
            summary: "Credential-stuffing pattern detected against the auth endpoints"
            description: "loginAnomalyDetector flagged one client IP failing logins against 10 or more distinct accounts inside its 15-minute window. Identify the IP from the BRUTE_FORCE_DETECTED rows in audit_log (module='security'), block it at the edge, and check whether any targeted account succeeded afterwards. Detection requires Redis: trackFailedLogin returns early when the Redis client is disconnected, so a Redis outage silences this signal entirely — cross-check RateLimitStoreDegraded before reading quiet as safe."
        - alert: SecurityAccountLockoutSurge
          expr: sum(increase(vhhealth_security_events_total{event_type="ACCOUNT_LOCKED"}[15m])) > 25
          for: 5m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "Account lockouts are surging — credential attack, or staff shut out of clinical systems"
            description: "More than 25 ACCOUNT_LOCKED events fleet-wide in 15 minutes. The counter is labelled by event type only — the account and the lockout reason are on the audit_log row — so this is deliberately a surge threshold and not a per-account notice: one locked-out clinician retrying contributes several events, because the lockout check re-fires on every subsequent attempt inside the window. Read the ACCOUNT_LOCKED rows in audit_log to tell distributed credential guessing apart from an auth or deployment fault locking real staff out."

        # ── Meta-alert: the webhook counter must still exist ───────────────────
        # SecurityAuditChainTampered, SecurityBreakGlassActivated and
        # SecurityPagingUnconfigured all read
        # vhhealth_security_webhook_events_total. If that counter is renamed,
        # dropped from /metrics, or short-circuited, all three go quiet and look
        # healthy — the same failure mode as the break-glass matcher.
        #
        # A plain absent() cannot guard it: Counter in
        # apps/backend/src/observability/metricPrimitives.js serialises only the
        # label sets it has actually seen, so the counter has NO series until the
        # first sendSecurityWebhook() call in a process and absence is normal on
        # a quiet deployment. Instead this pairs it against the events counter.
        # Each event type listed here is emitted by an unconditional
        # logSecurityEvent()+sendSecurityWebhook() pair in the same block —
        # loginAnomalyDetector.js (BRUTE_FORCE_DETECTED), breakGlassService.js
        # (PHI_BREAK_GLASS_*), sosEscalationService.js (SOS_ALERT_UNACKNOWLEDGED),
        # sosService.js and notificationService.js (SOS_ESCALATION_FAILED) — and
        # sendSecurityWebhook records an outcome on every path it can take,
        # including the early return when paging is disabled. So the events
        # counter moving while the webhook counter records nothing at all means
        # the webhook counter is broken, never that the system is quiet.
        - alert: SecurityWebhookCounterMissing
          expr: |
            (sum(increase(vhhealth_security_events_total{event_type=~"BRUTE_FORCE_DETECTED|SOS_ALERT_UNACKNOWLEDGED|SOS_ESCALATION_FAILED|.*BREAK_GLASS.*"}[1h])) > 0)
            unless
            (sum(increase(vhhealth_security_webhook_events_total[1h])) > 0)
          for: 15m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "Security events fired but the webhook counter recorded nothing — three security rules are blind"
            description: "vhhealth_security_events_total advanced for an event type that always calls sendSecurityWebhook, yet vhhealth_security_webhook_events_total did not move. SecurityAuditChainTampered, SecurityBreakGlassActivated and SecurityPagingUnconfigured are all inert in that state. Check that /metrics still exposes vhhealth_security_webhook_events_total and that serializeSecurityEventMetrics is still wired into metricsRoutes.js."

# monitoring/alert-rules.yaml — VH Health alerting rules
#
# Rules are PrometheusRule CRs picked up by the kube-prometheus-stack
# operator (via the release=vhhealth-monitoring label selector in its
# values). C1.1 commits rule definitions only. Alertmanager delivery is not
# active evidence and remains owned by C1.3.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vhhealth-platform-alerts
  namespace: vhhealth-monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: rules
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
    release: vhhealth-monitoring
spec:
  groups:
    - name: nodes
      interval: 30s
      rules:
        - alert: NodeDown
          expr: up{job="node-exporter"} == 0
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Node {{ $labels.instance }} is down"
            description: "node_exporter has been unreachable for 5 minutes on {{ $labels.instance }}."
            runbook: "apps/backend/docs/RUNBOOKS/node-down.md"

        - alert: NodeHighCPU
          expr: (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 0.85
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "High CPU on {{ $labels.instance }}"
            description: "CPU usage above 85% on {{ $labels.instance }} for 10 minutes."

        - alert: NodeHighMemory
          expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "High memory on {{ $labels.instance }}"
            description: "Memory usage above 90% on {{ $labels.instance }} for 10 minutes."

        - alert: PVCNearlyFull
          expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) > 0.85
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is 85% full"
            description: "Expand the PVC or delete old data before it runs out."

        - alert: PVCCritical
          expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) > 0.95
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is 95% full"

    - name: workloads
      interval: 30s
      rules:
        - alert: PodCrashLoopBackOff
          expr: rate(kube_pod_container_status_restarts_total[15m]) * 60 * 5 > 5
          for: 15m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash-looping"
            description: "More than 5 restarts in 15 minutes."

        - alert: DeploymentReplicasMismatch
          expr: kube_deployment_spec_replicas{namespace=~"vhhealth.*"} != kube_deployment_status_replicas_available{namespace=~"vhhealth.*"}
          for: 15m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has fewer ready replicas than desired"

        - alert: StatefulSetReplicasMismatch
          expr: kube_statefulset_status_replicas_ready{namespace=~"vhhealth.*"} != kube_statefulset_status_replicas{namespace=~"vhhealth.*"}
          for: 15m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} has fewer ready replicas than desired"

    - name: postgres
      interval: 30s
      rules:
        - alert: PostgresReplicationLagHigh
          expr: vhhealth_replication_lag_seconds > 60
          for: 5m
          labels:
            severity: warning
            team: database
          annotations:
            summary: "Postgres replica {{ $labels.client }} lagging > 60s"
            description: "Replication lag in seconds: {{ $value }}."

        - alert: PostgresReplicationLagCritical
          expr: vhhealth_replication_lag_seconds > 300
          for: 5m
          labels:
            severity: critical
            team: database
          annotations:
            summary: "Postgres replica {{ $labels.client }} lagging > 5 minutes"

        - alert: PostgresConnectionsHigh
          expr: vhhealth_connections_total / vhhealth_connections_max_conn > 0.85
          for: 5m
          labels:
            severity: warning
            team: database
          annotations:
            summary: "Postgres primary connection usage > 85%"

    - name: certificates
      interval: 300s
      rules:
        - alert: CertificateExpiringSoon
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 30 * 24 * 3600
          for: 1h
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in <30 days"
            description: "Check cert-manager logs if renewal isn't happening automatically."

        - alert: CertificateExpiringVerySoon
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 7 * 24 * 3600
          for: 1h
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in <7 days"

    - name: cloudflared
      interval: 30s
      rules:
        - alert: CloudflaredTunnelDown
          expr: cloudflared_tunnel_active_streams < 1
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Cloudflare Tunnel has no active streams"
            description: "All public API traffic is affected. Check cloudflared pod logs."

    - name: harbor
      interval: 30s
      rules:
        - alert: HarborRegistryDown
          expr: up{job=~".*harbor.*"} == 0
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Harbor registry component down: {{ $labels.instance }}"
            description: "Image pulls/pushes may fail. Check {{ $labels.job }}."

    # Audit 2026-06-22 (observability): the synthetic-outage signals were
    # themselves unmonitored — if the canary CronJob or the CNPG backup-verify
    # CronJob silently stops scheduling (controller wedged, namespace/RBAC
    # defect, suspended) or starts failing, the very check that would surface a
    # real outage / a bad backup goes dark with no alert. These watch the
    # watchers via kube-state-metrics.
    - name: synthetic-checks
      interval: 1m
      rules:
        - alert: CanaryHealthCheckStale
          # canary-health-check runs every 5m; >30m without a new schedule =
          # the CronJob controller isn't firing it.
          expr: time() - max(kube_cronjob_status_last_schedule_time{namespace="vhhealth", cronjob="canary-health-check"}) > 1800
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Canary health-check CronJob has not run in >30m"
            description: "The synthetic DB read/write + stuck-notification + unacked-critical-alert check is not scheduling. The platform may be degraded with no signal. Check the canary-health-check CronJob in ns vhhealth."
        - alert: CanaryHealthCheckFailing
          expr: max(kube_job_status_failed{namespace="vhhealth", job_name=~"^canary-health-check.*"}) > 0
          for: 15m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Canary health-check job is failing"
            description: "The most recent canary-health-check Job reported a failure — either the canary itself is broken or it is detecting a real fault. Inspect the Job logs in ns vhhealth."
        - alert: CnpgBackupVerifyStale
          # cnpg-backup-verify runs daily at 21:30 UTC. More than 30 hours
          # without a schedule, or no scheduling metric, means the check is dark.
          expr: (time() - max(kube_cronjob_status_last_schedule_time{namespace="vhhealth-platform", cronjob="cnpg-backup-verify"}) > 108000) or absent(kube_cronjob_status_last_schedule_time{namespace="vhhealth-platform", cronjob="cnpg-backup-verify"})
          for: 1h
          labels:
            severity: critical
            team: backup
          annotations:
            summary: "CNPG backup-verify CronJob has not run in >30 hours"
            description: "Backup restorability is no longer being verified — a 'WAL with no good base backup' failure could go undetected until a real restore. Check the cnpg-backup-verify CronJob in ns vhhealth-platform."
        - alert: CnpgBackupVerifyFailing
          expr: max(kube_job_status_failed{namespace="vhhealth-platform", job_name=~"^cnpg-backup-verify.*"}) > 0
          for: 1h
          labels:
            severity: critical
            team: backup
          annotations:
            summary: "CNPG backup-verify job is failing"
            description: "The latest cnpg-backup-verify Job failed — the R2 base backup may be missing or unrestorable. Treat as a DR-readiness incident. Inspect the Job logs in ns vhhealth-platform."
        - alert: CnpgPluginBackupFailed
          expr: |
            max(barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp)
              > max(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp)
          for: 15m
          labels:
            severity: critical
            team: backup
          annotations:
            summary: "The latest Barman Cloud Plugin backup attempt failed"
            description: "The plugin reports a failed backup newer than its last available backup. Preserve the healthy WAL stream and inspect the Backup CR, ObjectStore status, and plugin logs."
            runbook: "docs/DR_RESTORE_DRILL.md"
        - alert: CnpgRestoreProofUnexpectedlyEnabled
          expr: |
            kube_cronjob_spec_suspend{
              namespace="vhhealth-restore-proof",
              cronjob="cnpg-scheduled-restore-proof"
            } == 0
          for: 5m
          labels:
            severity: critical
            team: backup
          annotations:
            summary: "The operator-gated CNPG restore proof is not suspended"
            description: "C1.1 ships this CronJob suspended. Suspend it immediately unless a recorded synthetic restore drill is actively in progress."
            runbook: "docs/DR_RESTORE_DRILL.md"

    # C6.2 adds rule expressions only. C1.3's existing team=backup and
    # team=database routing tree owns receivers and delivery activation.
    - name: c6-2-backup-dr
      interval: 1m
      rules:
        - alert: C6BackupLockNotEffective
          expr: (vhhealth_c6_2_backup_lock_effective == 0) or absent(vhhealth_c6_2_backup_lock_effective)
          for: 5m
          labels:
            severity: critical
            team: backup
          annotations:
            summary: "The approved C6.2 database backup lock is not effective"
            description: "The operator-published lock attestation metric reports that the approved production archive prefix is not protected. Preserve the last recoverable generation and follow the C6.2 lock runbook."
            runbook: "docs/runbooks/C6_2_R2_LOCK_AND_RESTORE_DRILL.md"
        - alert: C6RestoreProofFailed
          expr: max(kube_job_status_failed{namespace="vhhealth-restore-proof", job_name=~"^cnpg-scheduled-restore-proof.*"}) > 0
          for: 5m
          labels:
            severity: critical
            team: backup
          annotations:
            summary: "The C6.2 timed restore-only proof failed"
            description: "This is a C-D1 restore-only evidence failure. It does not measure or fail C-D9's separate warm-promotion target."
            runbook: "docs/runbooks/C6_2_R2_LOCK_AND_RESTORE_DRILL.md"
        - alert: C6RetentionRemovalUnexpectedlyEnabled
          expr: kube_cronjob_spec_suspend{namespace="vhhealth-platform", cronjob="cnpg-retention-removal"} == 0
          for: 5m
          labels:
            severity: critical
            team: backup
          annotations:
            summary: "The operator-gated C6.2 retention remover is not suspended"
            description: "Suspend it unless a named legal/security/backup-approved exact-object removal window is active. Never retry a lock-denied deletion by widening authority."
            runbook: "docs/runbooks/C6_2_R2_LOCK_AND_RESTORE_DRILL.md"
        - alert: C6RetentionRemovalFailed
          expr: max(kube_job_status_failed{namespace="vhhealth-platform", job_name=~"^cnpg-retention-removal.*"}) > 0
          for: 5m
          labels:
            severity: critical
            team: backup
          annotations:
            summary: "The C6.2 approved-object retention-removal job failed"
            description: "Inspect the immutable approval inventory, Barman boundary, legal-hold and bucket-lock proof. Do not grant the database writer delete authority."
            runbook: "docs/runbooks/C6_2_R2_LOCK_AND_RESTORE_DRILL.md"
        - alert: C6WarmStandbyReplicationLagHigh
          expr: vhhealth_replication_lag_seconds{application_name=~"(?i).*dr.*"} > 30
          for: 5m
          labels:
            severity: critical
            team: database
          annotations:
            summary: "C6.2 warm-standby streaming lag exceeds 30 seconds"
            description: "The Phase 2 target is evaluated only by a promotion drill; this signal protects the async stream and does not itself prove RPO."
            runbook: "docs/runbooks/C6_2_WARM_STANDBY_PROMOTION_FAILBACK.md"

# monitoring/backend-red-alerts.yaml — backend RED + clinical-path alerts
# (roadmap A6). C1.1 adds rules but does not activate Alertmanager delivery;
# notification wiring and proof remain C1.3. Metric names come from the backend's own exporter
# (src/middleware/prometheusMiddleware.js): http_request_duration_seconds
# (histogram, labels method/route/status_code) and http_requests_total.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vhhealth-backend-red-alerts
  namespace: vhhealth-monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: rules
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
    release: vhhealth-monitoring
spec:
  groups:
    - name: backend-red
      interval: 30s
      rules:
        - alert: BackendHighErrorRate
          expr: |
            sum(rate(http_requests_total{status_code=~"5.."}[5m]))
              / clamp_min(sum(rate(http_requests_total[5m])), 1e-9) > 0.02
          for: 5m
          labels:
            severity: critical
            team: backend
          annotations:
            summary: "Backend 5xx rate above 2% for 5m"
            runbook: "docs/RUNBOOK_ONCALL.md#backendhigherrorrate"

        - alert: BackendReadLatencyP95Breach
          expr: |
            histogram_quantile(0.95,
              sum(rate(http_request_duration_seconds_bucket{method="GET"}[5m])) by (le)
            ) > 0.4
          for: 10m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "GET p95 latency above the 400ms SLO for 10m"
            runbook: "docs/RUNBOOK_ONCALL.md#backendreadlatencyp95breach"

        - alert: BackendWriteLatencyP95Breach
          expr: |
            histogram_quantile(0.95,
              sum(rate(http_request_duration_seconds_bucket{method=~"POST|PUT|PATCH"}[5m])) by (le)
            ) > 0.8
          for: 10m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "Write p95 latency above the 800ms SLO for 10m"
            runbook: "docs/RUNBOOK_ONCALL.md#backendwritelatencyp95breach"

        - alert: BackendClinicalRouteErrors
          expr: |
            sum(rate(http_requests_total{status_code=~"5..",
              route=~"/api/v1/(emr|clinical|pharmacy-orders|prescriptions|downtime).*"}[5m])) > 0.05
          for: 3m
          labels:
            severity: critical
            team: backend
          annotations:
            summary: "5xx on clinical routes (EMR/MAR/prescriptions) — patient-facing impact"
            runbook: "docs/RUNBOOK_ONCALL.md#backendclinicalrouteerrors"

        - alert: BackendDown
          expr: absent(up{job=~".*vhhealth-backend.*"} == 1)
          for: 2m
          labels:
            severity: critical
            team: backend
          annotations:
            summary: "No backend targets up for 2m — downtime procedure may apply"
            runbook: "docs/DOWNTIME_PROCEDURE.md"

        # REL-3 / WS2 B2.3, REPLACED 2026-08-04: the ward-pack rule now asserts
        # pack OUTPUT, not CronJob liveness.
        #
        # The retired rule was `WardDowntimePacksStale`, which watched
        # kube_cronjob_status_last_successful_time for ward-downtime-packs. It
        # could not fire, and its silence meant nothing: the CronJob invokes
        # `generateWardDowntimePacks()` with zero arguments, which branches to
        # the governed C3 sweep, and that sweep returns an empty array without
        # touching the database whenever CLINICAL_CONTINUITY_PACKS_ENABLED is
        # unset (it is), no signed facility policy is active (none is), or no
        # operator signer is wired (the CronJob passes none). The job exits 0
        # every 15 minutes, the success timestamp stays fresh forever, and no
        # ward has a pack to print. A rule that watches a producer's exit code
        # cannot distinguish "produced every pack" from "produced nothing".
        #
        # The replacement reads a probe inside the scraped backend Deployment
        # (src/services/downtime/wardDowntimePackOutputProbe.js), which counts
        # wards that have an occupied bed but no pack that exists, is fresh
        # (<45 min old — the retired rule's own threshold, so the replacement
        # is no less sensitive to a stalled producer), is unexpired, and is
        # non-empty. A CronJob pod is short-lived and never scraped, so the
        # observation has to be taken in the long-running process.
        #
        # The alerting series is a COUNT OF WARDS IN THE BAD STATE, so no
        # healthy ward can average away a sick one — the masking hazard that
        # forced the per-facility labels on the continuity-edge rules, avoided
        # here by shape rather than by labels. `for: 10m` rides out probe and
        # scrape jitter only; the 45-minute freshness window already absorbs
        # missed generation cycles.
        - alert: WardDowntimePacksMissing
          expr: max(vhhealth_ward_downtime_pack_wards_missing) > 0
          for: 10m
          labels:
            severity: critical
            team: continuity
          annotations:
            summary: "Occupied wards have no fresh downtime pack to print — nothing exists for an outage"
            description: |
              One or more wards with occupied beds have no ward downtime pack that is
              present, under 45 minutes old, unexpired, and non-empty. The backend log
              line `Ward downtime packs missing for N occupied ward(s)` names the wards.
              Generation is NOT automatic today — confirm the preconditions in
              docs/DOWNTIME_PROCEDURE.md ("Why generation may produce nothing") and
              regenerate with POST /api/v1/downtime/generate meanwhile.
              Check: kubectl get cronjob ward-downtime-packs -n vhhealth
                     kubectl logs -n vhhealth -l app.kubernetes.io/name=ward-downtime-packs
            runbook: "docs/DOWNTIME_PROCEDURE.md"

        # The companion to the rule above: it can only fire while something is
        # measuring. If the probe stops reporting, ward-pack coverage becomes
        # unknown, and unknown is not healthy. 20m clears backend rollouts and
        # the 5-minute probe cadence without flapping.
        - alert: WardDowntimePackOutputUnobserved
          expr: absent(vhhealth_ward_downtime_pack_wards_expected)
          for: 20m
          labels:
            severity: critical
            team: continuity
          annotations:
            summary: "No ward downtime-pack output observation is being reported — coverage is unknown"
            description: |
              vhhealth_ward_downtime_pack_wards_expected is absent from every backend
              replica, so WardDowntimePacksMissing cannot fire and nothing is asserting
              that a printable pack exists. Check the backend /metrics scrape and the
              ward-downtime-pack-output-probe scheduler job.
            runbook: "docs/DOWNTIME_PROCEDURE.md"

        # CronJob failure rate guard — fires when any outage-critical job
        # fails repeatedly. Covers backup-verification and canary-health-check
        # in addition to ward-downtime-packs.
        - alert: OutageCriticalCronJobFailing
          expr: |
            kube_job_status_failed{
              namespace="vhhealth",
              job_name=~"(ward-downtime-packs|backup-verification|vhhealth-backend-r2-sync|canary-health-check)-.*"
            } > 0
          for: 10m
          labels:
            severity: warning
            team: continuity
          annotations:
            summary: "Outage-critical CronJob {{ $labels.job_name }} has failed pods"
            description: |
              One or more outage-critical job pods have failed in the last 10 minutes.
              Check: kubectl describe job {{ $labels.job_name }} -n vhhealth
                     kubectl logs -n vhhealth -l job-name={{ $labels.job_name }}
            runbook: "docs/DOWNTIME_PROCEDURE.md"

    - name: backend-db
      interval: 30s
      rules:
        - alert: CNPGReplicationLagHigh
          expr: max(cnpg_pg_replication_lag) > 30
          for: 5m
          labels:
            severity: warning
            team: database
          annotations:
            summary: "CNPG replication lag above 30s — read replicas serving stale data"
            runbook: "docs/RUNBOOK_ONCALL.md#cnpgreplicationlaghigh"

        - alert: CNPGBackupNotRecent
          expr: |
            (
              time() - max(
                barman_cloud_cloudnative_pg_io_last_available_backup_timestamp
              ) > 60 * 60 * 30
            )
            or
            absent(
              barman_cloud_cloudnative_pg_io_last_available_backup_timestamp
            )
          for: 1h
          labels:
            severity: critical
            team: backup
          annotations:
            summary: "No completed CNPG backup in >30h — RPO at risk (roadmap A4)"
            runbook: "docs/DR_RESTORE_DRILL.md"

        - alert: BackendUploadArchiveStale
          expr: |
            (
              time() - max(kube_cronjob_status_last_successful_time{
                namespace="vhhealth",
                cronjob="vhhealth-backend-r2-sync"
              }) > 25200
            )
            or
            absent(kube_cronjob_status_last_successful_time{
              namespace="vhhealth",
              cronjob="vhhealth-backend-r2-sync"
            })
          for: 15m
          labels:
            severity: warning
            team: backup
          annotations:
            summary: "The encrypted MinIO upload archive has not completed in >7h"
            description: "The producer runs every six hours. Inspect its Job without reusing the producer identity for verification."
            runbook: "apps/backend/docs/DISASTER-RECOVERY.md"

        - alert: BackendUploadArchiveVerificationStale
          expr: |
            (
              time() - max(kube_cronjob_status_last_successful_time{
                namespace="vhhealth",
                cronjob="backup-verification"
              }) > 28800
            )
            or
            absent(kube_cronjob_status_last_successful_time{
              namespace="vhhealth",
              cronjob="backup-verification"
            })
          for: 30m
          labels:
            severity: critical
            team: backup
          annotations:
            summary: "The off-site upload archive has not been verified in >8h"
            description: "Checksum, decryption, and metadata verification is stale or absent. Inspect the reader-only verification Job."
            runbook: "apps/backend/docs/DISASTER-RECOVERY.md"

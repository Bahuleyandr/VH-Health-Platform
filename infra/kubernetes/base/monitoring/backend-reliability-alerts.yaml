# monitoring/backend-reliability-alerts.yaml — application reliability alerts.
# Metric names come from the backend exporter
# (src/observability/reliabilityMetrics.js). Gauges are reported per-pod, so
# every expr collapses the identical series with max().
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vhhealth-backend-reliability-alerts
  namespace: vhhealth-monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: rules
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
    release: vhhealth-monitoring
spec:
  groups:
    - name: backend-reliability
      interval: 30s
      rules:
        - alert: EventOutboxDrainStalled
          expr: max(event_outbox_oldest_pending_age_seconds) > 600
          for: 10m
          labels:
            severity: critical
            team: backend
          annotations:
            summary: "Oldest pending event_outbox row is >10m old — the drain cron is stalled"
            runbook: "docs/RUNBOOK_ONCALL.md#eventoutboxdrainstalled"
        - alert: EventOutboxBacklogGrowing
          expr: max(event_outbox_pending_rows) > 500
          for: 10m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "event_outbox pending backlog >500 for 10m"
            runbook: "docs/RUNBOOK_ONCALL.md#eventoutboxbacklog"
        - alert: EventOutboxDeadLettersPresent
          expr: max(event_outbox_dead_letter_rows) > 0
          for: 5m
          labels:
            severity: critical
            team: backend
          annotations:
            summary: "event_outbox dead-letter rows present — events permanently undelivered (clinical/billing consumers never saw them)"
            runbook: "docs/RUNBOOK_ONCALL.md#eventoutboxdeadletters"
        - alert: EventOutboxDeadLetterRateRising
          expr: increase(event_outbox_dead_lettered_total[15m]) > 0
          for: 0m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "Events are crossing into dead-letter (rate>0 over 15m)"
            runbook: "docs/RUNBOOK_ONCALL.md#eventoutboxdeadletters"
        - alert: EventOutboxStaleProcessing
          expr: max(event_outbox_stale_processing_rows) > 0
          for: 5m
          labels:
            severity: critical
            team: backend
          annotations:
            summary: "event_outbox contains expired processing leases — source work is stranded until reaped"
            runbook: "docs/RUNBOOK_ONCALL.md#outboxstaleleases"
        - alert: WebhookDeliveriesDead
          expr: max(webhook_deliveries_dead_rows) > 0
          for: 5m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "webhook_deliveries in terminal dead status — outbound webhooks permanently undelivered"
            runbook: "docs/RUNBOOK_ONCALL.md#webhookdeliveriesdead"
        - alert: WebhookDeliveryBacklog
          expr: max(webhook_deliveries_pending_rows) > 200
          for: 15m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "webhook_deliveries pending backlog >200 for 15m"
            runbook: "docs/RUNBOOK_ONCALL.md#webhookbacklog"
        - alert: WebhookDeliveryStaleInFlight
          expr: max(webhook_deliveries_stale_in_flight_rows) > 0
          for: 5m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "webhook_deliveries contains expired in-flight leases — dispatch workers may be crashing or timing out"
            runbook: "docs/RUNBOOK_ONCALL.md#outboxstaleleases"
        - alert: OutboxLeaseReapingRepeated
          expr: sum(increase(event_outbox_stale_lease_reaped_total[15m])) + sum(increase(webhook_deliveries_stale_lease_reaped_total[15m])) > 3
          for: 5m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "Outbox stale-lease reapers recovered more than three claims in 15m — investigate worker instability"
            runbook: "docs/RUNBOOK_ONCALL.md#outboxstaleleases"
        - alert: NotificationOutboxBacklog
          expr: max(notification_outbox_pending_rows) > 500
          for: 15m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "notification_outbox PENDING backlog >500 for 15m"
            runbook: "docs/RUNBOOK_ONCALL.md#notificationbacklog"
        - alert: NotificationOutboxDeadLetters
          expr: max(notification_outbox_dead_letter_rows) > 0
          for: 5m
          labels:
            severity: critical
            team: backend
          annotations:
            summary: "notification_outbox contains terminally failed deliveries requiring operator review"
            runbook: "docs/RUNBOOK_ONCALL.md#notificationoutboxdeadletters"
        - alert: NotificationOutboxReconciliationRequired
          expr: max(notification_outbox_reconciliation_required_rows) > 0
          for: 0m
          labels:
            severity: critical
            team: backend
          annotations:
            summary: "Notification provider outcomes are uncertain and require evidence-led reconciliation"
            runbook: "docs/RUNBOOK_ONCALL.md#notificationoutboxreconciliationrequired"
        - alert: NotificationDeliveryCursorPaused
          expr: max by (state) (notification_delivery_paused_cursors) > 0
          for: 5m
          labels:
            severity: critical
            team: backend
          annotations:
            summary: "A notification delivery channel cursor is paused in {{ $labels.state }}"
            runbook: "docs/RUNBOOK_ONCALL.md#notificationdeliverycursorpaused"
        - alert: ReliabilityMetricsStale
          expr: absent(reliability_metrics_last_success_timestamp_seconds) or (max(time() - reliability_metrics_last_success_timestamp_seconds) > 300)
          for: 5m
          labels:
            severity: critical
            team: backend
          annotations:
            summary: "The backend reliability collector has not completed successfully for five minutes"
            runbook: "docs/RUNBOOK_ONCALL.md#reliabilitymetricsstale"
        - alert: WsBroadcastDropsDetected
          expr: sum(rate(ws_broadcast_dropped_total[5m])) > 0
          for: 5m
          labels:
            severity: critical
            team: backend
          annotations:
            summary: "Real-time WS broadcasts dropping (slow-consumer backpressure or cross-process fan-out fallback) — clinical realtime (vitals/alerts) may not reach all sessions"
            description: "By reason: {{ $labels.reason }}. The invisible Redis-failover drop is proxied by ws_fanout_subscriber_errors_total."
            runbook: "docs/RUNBOOK_ONCALL.md#wsbroadcastdrops"
        - alert: WsFanoutSubscriberErrorsHigh
          expr: sum(rate(ws_fanout_subscriber_errors_total[5m])) > 0
          for: 10m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "WS Redis fan-out subscriber erroring/reconnecting — the window where broadcasts can be silently dropped (at-most-once)"
            runbook: "docs/RUNBOOK_ONCALL.md#wsbroadcastdrops"
        # Gap-audit 2026-08 (#873 follow-up): the rate-limit store posture was
        # only visible on the JSON /health/metrics, which nothing scrapes. The
        # gauges below come from src/observability/rateLimitPostureMetrics.js.
        # No absent() arm on purpose: a deployment without Redis configured
        # emits neither family (MemoryStore / no fan-out — nothing to alert on).
        - alert: RateLimitStoreDegraded
          expr: max(vh_rate_limit_store_degraded) > 0
          for: 5m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "Redis rate-limit store degraded for 5m — fail-closed profiles (auth/otp/sos) are answering 429, fail-open profiles pass unmetered"
            runbook: "docs/RUNBOOK_ONCALL.md#ratelimitstoredegraded"
        # min(), not max(): one deaf pod is a real coverage hole even while its
        # siblings are subscribed — sessions pinned to it miss cross-pod events.
        - alert: WsFanoutSubscriberDown
          expr: min(vh_redis_ws_fanout_ready) == 0
          for: 10m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "Cross-pod WS fan-out subscriber is down — realtime broadcasts (vitals/code-blue) are single-process only on at least one pod"
            runbook: "docs/RUNBOOK_ONCALL.md#wsfanoutsubscriberdown"
        - alert: DbCircuitBreakerOpen
          expr: max(db_circuit_breaker_open) == 1
          for: 2m
          labels:
            severity: critical
            team: backend
          annotations:
            summary: "Prisma DB circuit breaker is OPEN — queries are being rejected fast"
            runbook: "docs/RUNBOOK_ONCALL.md#dbcircuitbreakeropen"
        - alert: DbReadReplicaLagHigh
          expr: max(db_read_replica_lag_seconds) > 30
          for: 5m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "Backend read-replica lag above 30s — read-only routes may serve stale data"
            runbook: "docs/RUNBOOK_ONCALL.md#dbreadreplicalaghigh"
        - alert: CarePathwayReconciliationTechnicalError
          expr: max by (pathway_key) (care_pathway_reconciliation_technical_error_tenants) > 0
          for: 5m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "Care-pathway reconciliation is failing technically for {{ $labels.pathway_key }}"
            runbook: "docs/RUNBOOK_ONCALL.md#carepathwayreconciliationtechnicalerror"
        - alert: CarePathwayActiveWithoutAuthority
          expr: max by (pathway_key) (care_pathway_reconciliation_active_without_authority_tenants) > 0
          for: 0m
          labels:
            severity: critical
            team: backend
          annotations:
            summary: "A tenant configured {{ $labels.pathway_key }} active without production activation authority"
            runbook: "docs/RUNBOOK_ONCALL.md#carepathwayactivewithoutauthority"
        - alert: PathwayProjectorDeadRowsPresent
          expr: max(pathway_projector_inbox_dead_rows) > 0
          for: 5m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "Pathway projector inbox contains terminal dead rows"
            runbook: "docs/RUNBOOK_ONCALL.md#pathwayprojectordebt"
        - alert: PathwayProjectorRetiredPendingRowsPresent
          expr: max(pathway_projector_inbox_retired_pending_rows) > 0
          for: 5m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "Retired pathway projector generations still contain pending work"
            runbook: "docs/RUNBOOK_ONCALL.md#pathwayprojectordebt"
    - name: external-recovery-operability
      interval: 30s
      rules:
        - alert: ExternalRecoveryObservabilityUnobserved
          expr: absent(external_recovery_observation_timestamp_seconds) or (time() - max(external_recovery_observation_timestamp_seconds) > 300)
          for: 5m
          labels:
            severity: critical
            team: continuity
          annotations:
            summary: "External-recovery database output has not been observed for five minutes — state is unknown"
            description: "The output snapshot is absent or stale. Do not infer healthy offsets, inboxes, or late-critical awareness from backend liveness."
            runbook: "docs/runbooks/C6_1_EXTERNAL_RECOVERY_OPERABILITY.md"
        - alert: ExternalRecoveryOffsetRequiresReconciliation
          expr: max by (tenant_id, facility_scope, facility_id, interface_family, direction, recovery_state) (external_recovery_active_offsets{recovery_state=~"reconciliation_required_.*"}) > 0
          for: 0m
          labels:
            severity: critical
            team: continuity
          annotations:
            summary: "External recovery for {{ $labels.tenant_id }}/{{ $labels.facility_id }} {{ $labels.interface_family }} {{ $labels.direction }} requires reconciliation"
            description: "The database reports one or more live offsets in {{ $labels.recovery_state }}. Inspect the exact partition in the Admin Continuity Reconciliation workbench; do not bulk resume."
            runbook: "docs/runbooks/C6_1_EXTERNAL_RECOVERY_OPERABILITY.md"
        - alert: ExternalRecoveryInboxDeadRows
          expr: max by (tenant_id, facility_scope, facility_id, interface_family, direction) (external_recovery_inbox_dead_rows) > 0
          for: 0m
          labels:
            severity: critical
            team: continuity
          annotations:
            summary: "External recovery has terminal dead work for {{ $labels.tenant_id }}/{{ $labels.facility_id }} {{ $labels.interface_family }} {{ $labels.direction }}"
            description: "The database reports terminal external-interface inbox rows. Inspect exact rows and preserved evidence; this alert grants no redrive or family activation authority."
            runbook: "docs/runbooks/C6_1_EXTERNAL_RECOVERY_OPERABILITY.md"
        - alert: ExternalRecoveryInboxPendingStalled
          expr: max by (tenant_id, facility_scope, facility_id, interface_family, direction) (external_recovery_inbox_pending_rows) > 0 and on (tenant_id, facility_scope, facility_id, interface_family, direction) max by (tenant_id, facility_scope, facility_id, interface_family, direction) (external_recovery_inbox_oldest_pending_age_seconds) > 900
          for: 5m
          labels:
            severity: critical
            team: continuity
          annotations:
            summary: "External recovery pending work is stalled for {{ $labels.tenant_id }}/{{ $labels.facility_id }} {{ $labels.interface_family }} {{ $labels.direction }}"
            description: "At least one database inbox row has remained pending for more than 15 minutes after recovery recording. This is output evidence, not a worker-liveness proxy."
            runbook: "docs/runbooks/C6_1_EXTERNAL_RECOVERY_OPERABILITY.md"
        - alert: ExternalRecoveryInboxBacklogHigh
          expr: max by (tenant_id, facility_scope, facility_id, interface_family, direction) (external_recovery_inbox_pending_rows) > 500
          for: 15m
          labels:
            severity: warning
            team: continuity
          annotations:
            summary: "External recovery backlog exceeds 500 rows for {{ $labels.tenant_id }}/{{ $labels.facility_id }} {{ $labels.interface_family }} {{ $labels.direction }}"
            description: "The database output reports a sustained capacity backlog. This signal is not permission to predicate-bulk replay or weaken cursor fences."
            runbook: "docs/runbooks/C6_1_EXTERNAL_RECOVERY_OPERABILITY.md"
        - alert: ExternalRecoveryCriticalReviewUnacknowledged
          expr: max by (tenant_id, facility_scope, facility_id, interface_family, direction) (external_recovery_critical_review_unacknowledged_rows) > 0
          for: 0m
          labels:
            severity: critical
            team: continuity
          annotations:
            summary: "Late critical result awaits continuity awareness for {{ $labels.tenant_id }}/{{ $labels.facility_id }}"
            description: "Open the facility/tenant Critical Results / Clinical Inbox. This operational page reports a missing recovery-awareness acknowledgement; it is not a fresh lab alarm or SLA breach."
            runbook: "docs/runbooks/C6_1_EXTERNAL_RECOVERY_OPERABILITY.md"
    - name: backend-safety-signals
      interval: 30s
      rules:
        - alert: ClinicalAiDeepTemplateFallback
          expr: increase(clinical_ai_deep_template_fallback_total[15m]) > 0
          for: 0m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "Deep/critical clinical-AI module {{ $labels.module }} silently fell back to a TEMPLATE draft — clinicians may believe it is AI-assisted"
            runbook: "docs/RUNBOOK_ONCALL.md#clinicalaitemplatefallback"
        - alert: DbUndefinedTableFallback
          expr: increase(db_undefined_table_fallback_total[15m]) > 0
          for: 0m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "Postgres 42P01 undefined_table graceful fallbacks firing — likely schema drift or a missing partition"
            runbook: "docs/RUNBOOK_ONCALL.md#dbundefinedtablefallback"

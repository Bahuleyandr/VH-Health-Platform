# monitoring/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: vhhealth-monitoring
resources:
  - chart-tracker.yaml
  - alert-rules.yaml
  - backend-red-alerts.yaml
  - backend-reliability-alerts.yaml
  - backend-slo.yaml
  - device-gateway-alerts.yaml

configMapGenerator:
  - name: vhhealth-backend-dashboards
    namespace: vhhealth-monitoring
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
    files:
      - dashboards/vhhealth-backend-red.json
      - dashboards/vhhealth-backend-reliability.json
      - dashboards/vhhealth-device-gateway.json

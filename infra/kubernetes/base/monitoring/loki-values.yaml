# monitoring/loki-values.yaml — Loki + Promtail values
#
# Chart: grafana/loki-stack v2.10.2 (Loki 2.9.x, Promtail 2.9.x).
# We stay on v2 rather than jump to Loki 3 until Grafana 11 has proven
# stable with it; v2 is still supported through mid-2026.
#
# Single-binary (monolithic) Loki with filesystem storage. Scale-out
# (microservices or SSD) is possible later if log volume justifies it;
# for a 3-node on-prem cluster, monolithic + 100Gi is ample.
loki:
  enabled: true
  isDefault: true
  persistence:
    enabled: true
    storageClassName: local-path
    size: 100Gi
    accessModes: ["ReadWriteOnce"]
  config:
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9095
      log_level: info
      log_format: json
    common:
      path_prefix: /data/loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      instance_addr: 127.0.0.1
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage_config:
      tsdb_shipper:
        active_index_directory: /data/loki/tsdb-index
        cache_location: /data/loki/tsdb-cache
      filesystem:
        directory: /data/loki/chunks
    limits_config:
      retention_period: 720h   # 30d
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      ingestion_rate_mb: 10
      ingestion_burst_size_mb: 20
      max_query_parallelism: 32
      split_queries_by_interval: 30m
    compactor:
      working_directory: /data/loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
      delete_request_store: filesystem
    ruler:
      enable_api: true
      storage:
        type: local
        local:
          directory: /data/loki/rules
      rule_path: /data/loki/rules-temp
  resources:
    requests:
      memory: 512Mi
      cpu: 200m
    limits:
      memory: 2Gi
      cpu: 1
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: vhhealth-monitoring

promtail:
  enabled: true
  config:
    clients:
      - url: http://vhhealth-monitoring-loki:3100/loki/api/v1/push
    positions:
      filename: /run/promtail/positions.yaml
    snippets:
      extraRelabelConfigs:
        - action: replace
          source_labels: [__meta_kubernetes_namespace]
          target_label: k8s_namespace
        - action: replace
          source_labels: [__meta_kubernetes_pod_name]
          target_label: k8s_pod
        - action: replace
          source_labels: [__meta_kubernetes_pod_node_name]
          target_label: k8s_node
  extraVolumeMounts:
    - name: journal
      mountPath: /var/log/journal
      readOnly: true
  extraVolumes:
    - name: journal
      hostPath:
        path: /var/log/journal
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    # Promtail needs root to read /var/log/containers/*; the pod
    # security policy exemption is granted by namespace-level
    # audit/warn rather than enforce-privileged.
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
      add: [DAC_READ_SEARCH]
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: vhhealth-monitoring

grafana:
  enabled: false

prometheus:
  enabled: false

evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'up{job="node-exporter",instance="node-a"}'
        values: '0x20'
      - series: 'db_circuit_breaker_open{pod="backend-0"}'
        values: '1x20'
      - series: 'job:slo_error:ratio_rate1h{job="backend"}'
        values: '0.01x20'
      - series: 'job:slo_error:ratio_rate5m{job="backend"}'
        values: '0.01x20'
      - series: 'gateway_spool_depth'
        values: '101x20'
      - series: 'vhhealth_continuity_edge_replication_lag_seconds{facility_id="1"}'
        values: '901x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: NodeDown
        exp_alerts:
          - exp_labels:
              instance: node-a
              job: node-exporter
              severity: critical
              team: platform
            exp_annotations:
              summary: "Node node-a is down"
              description: "node_exporter has been unreachable for 5 minutes on node-a."
              runbook: "apps/backend/docs/RUNBOOKS/node-down.md"
      - eval_time: 3m
        alertname: BackendDown
        exp_alerts:
          - exp_labels:
              severity: critical
              team: backend
            exp_annotations:
              summary: "No backend targets up for 2m — downtime procedure may apply"
              runbook: "docs/DOWNTIME_PROCEDURE.md"
      - eval_time: 3m
        alertname: DbCircuitBreakerOpen
        exp_alerts:
          - exp_labels:
              severity: critical
              team: backend
            exp_annotations:
              summary: "Prisma DB circuit breaker is OPEN — queries are being rejected fast"
              runbook: "docs/RUNBOOK_ONCALL.md#dbcircuitbreakeropen"
      - eval_time: 3m
        alertname: BackendErrorBudgetBurnFast
        exp_alerts:
          - exp_labels:
              job: backend
              severity: critical
              slo: availability
              team: backend
            exp_annotations:
              summary: "Backend availability error budget burning >14.4x (99.95% SLO) — fast burn"
              runbook: "docs/RUNBOOK_ONCALL.md#backenderrorbudgetburn"
      - eval_time: 16m
        alertname: DeviceGatewaySpoolDepthHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              team: device
            exp_annotations:
              summary: "Device gateway spool is backing up"
              description: "gateway_spool_depth has been above 100 for 15 minutes."
      - eval_time: 11m
        alertname: ContinuityEdgeReplicationLagHigh
        exp_alerts:
          - exp_labels:
              facility_id: "1"
              severity: warning
              team: continuity
            exp_annotations:
              summary: "Continuity-edge replication lag for facility 1 is above 15 minutes"
              runbook: "docs/runbooks/CONTINUITY_EDGE_MIRROR.md#verification-and-failure-handling"

  # Facility 41 is failing every continuity check while facility 42 is healthy.
  # With the pre-fix bare max()/min(), 42's healthy series supplied the
  # aggregate for ContinuityPackExpired and ContinuityEdgeSyncStale (no alert at
  # all), and the remaining alerts fired with no facility attribution. Each
  # expectation below is a single alert carrying facility_id="41", so a
  # regression to unlabelled aggregation fails this test.
  - interval: 1m
    input_series:
      - series: 'vhhealth_continuity_pack_fresh_until_timestamp_seconds{facility_id="41"}'
        values: '600x60'
      - series: 'vhhealth_continuity_pack_fresh_until_timestamp_seconds{facility_id="42"}'
        values: '1000000000x60'
      - series: 'vhhealth_continuity_coverage_complete{facility_id="41"}'
        values: '0x60'
      - series: 'vhhealth_continuity_coverage_complete{facility_id="42"}'
        values: '1x60'
      - series: 'vhhealth_continuity_edge_last_sync_success_timestamp_seconds{facility_id="41"}'
        values: '100x60'
      - series: 'vhhealth_continuity_edge_last_sync_success_timestamp_seconds{facility_id="42"}'
        values: '0+60x60'
      - series: 'vhhealth_continuity_edge_replication_lag_seconds{facility_id="41"}'
        values: '3600x60'
      - series: 'vhhealth_continuity_edge_replication_lag_seconds{facility_id="42"}'
        values: '5x60'
      - series: 'vhhealth_continuity_verification_failures_total{facility_id="41",reason="ACCESS_REVISION_ROLLBACK"}'
        values: '0+1x60'
      - series: 'vhhealth_continuity_verification_failures_total{facility_id="42",reason="ACCESS_REVISION_ROLLBACK"}'
        values: '0x60'
      - series: 'vhhealth_continuity_coverage_incomplete_total{facility_id="41"}'
        values: '0+1x60'
      - series: 'vhhealth_continuity_coverage_incomplete_total{facility_id="42"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: ContinuityPackExpired
        exp_alerts:
          - exp_labels:
              facility_id: "41"
              severity: critical
              team: continuity
            exp_annotations:
              summary: "The latest signed continuity publication for facility 41 is past fresh_until"
              runbook: "docs/runbooks/CONTINUITY_EDGE_MIRROR.md#verification-and-failure-handling"
      - eval_time: 45m
        alertname: ContinuityEdgeSyncStale
        exp_alerts:
          - exp_labels:
              facility_id: "41"
              severity: critical
              team: continuity
            exp_annotations:
              summary: "No successful continuity-edge replication has completed for facility 41 for 30 minutes"
              runbook: "docs/runbooks/CONTINUITY_EDGE_MIRROR.md#verification-and-failure-handling"
      - eval_time: 45m
        alertname: ContinuityCoverageIncomplete
        exp_alerts:
          - exp_labels:
              facility_id: "41"
              severity: critical
              team: continuity
            exp_annotations:
              summary: "A continuity publication for facility 41 was rejected for incomplete required coverage"
              runbook: "docs/runbooks/CONTINUITY_EDGE_MIRROR.md#verification-and-failure-handling"
      - eval_time: 45m
        alertname: ContinuityEdgeReplicationLagHigh
        exp_alerts:
          - exp_labels:
              facility_id: "41"
              severity: warning
              team: continuity
            exp_annotations:
              summary: "Continuity-edge replication lag for facility 41 is above 15 minutes"
              runbook: "docs/runbooks/CONTINUITY_EDGE_MIRROR.md#verification-and-failure-handling"
      - eval_time: 45m
        alertname: ContinuityVerificationFailed
        exp_alerts:
          - exp_labels:
              facility_id: "41"
              reason: ACCESS_REVISION_ROLLBACK
              severity: critical
              team: continuity
            exp_annotations:
              summary: "Continuity verification rejected one or more artifacts for facility 41 (ACCESS_REVISION_ROLLBACK)"
              runbook: "docs/runbooks/CONTINUITY_EDGE_MIRROR.md#verification-and-failure-handling"

  # Absence must neither suppress nor invent an alert. Facility 51 is the only
  # complete, failing emitter. Facility 52 has failed coverage but has NEVER
  # published, and facility 53 has published a fresh pack but emits no coverage
  # series at all — under the original bare aggregation those two unrelated
  # facilities cross-matched into one phantom, unattributed alert.
  #
  # ★ Facility 52 is the #710 regression pin. While ContinuityCoverageIncomplete
  # joined two gauges, 52 had no pack_fresh_until arm to match and its coverage
  # failure fired NOTHING. On the counter it fires on its own, so this block now
  # expects TWO coverage alerts (51 and 52) where it previously expected one.
  - interval: 1m
    input_series:
      - series: 'vhhealth_continuity_pack_fresh_until_timestamp_seconds{facility_id="51"}'
        values: '600x60'
      - series: 'vhhealth_continuity_pack_fresh_until_timestamp_seconds{facility_id="53"}'
        values: '1000000000x60'
      - series: 'vhhealth_continuity_coverage_complete{facility_id="51"}'
        values: '0x60'
      - series: 'vhhealth_continuity_coverage_complete{facility_id="52"}'
        values: '0x60'
      - series: 'vhhealth_continuity_coverage_incomplete_total{facility_id="51"}'
        values: '0+1x60'
      - series: 'vhhealth_continuity_coverage_incomplete_total{facility_id="52"}'
        values: '0+1x60'
      - series: 'vhhealth_continuity_edge_replication_lag_seconds{facility_id="51"}'
        values: '3600x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: ContinuityPackExpired
        exp_alerts:
          - exp_labels:
              facility_id: "51"
              severity: critical
              team: continuity
            exp_annotations:
              summary: "The latest signed continuity publication for facility 51 is past fresh_until"
              runbook: "docs/runbooks/CONTINUITY_EDGE_MIRROR.md#verification-and-failure-handling"
      - eval_time: 45m
        alertname: ContinuityCoverageIncomplete
        exp_alerts:
          - exp_labels:
              facility_id: "51"
              severity: critical
              team: continuity
            exp_annotations:
              summary: "A continuity publication for facility 51 was rejected for incomplete required coverage"
              runbook: "docs/runbooks/CONTINUITY_EDGE_MIRROR.md#verification-and-failure-handling"
          - exp_labels:
              facility_id: "52"
              severity: critical
              team: continuity
            exp_annotations:
              summary: "A continuity publication for facility 52 was rejected for incomplete required coverage"
              runbook: "docs/runbooks/CONTINUITY_EDGE_MIRROR.md#verification-and-failure-handling"
      - eval_time: 45m
        alertname: ContinuityEdgeReplicationLagHigh
        exp_alerts:
          - exp_labels:
              facility_id: "51"
              severity: warning
              team: continuity
            exp_annotations:
              summary: "Continuity-edge replication lag for facility 51 is above 15 minutes"
              runbook: "docs/runbooks/CONTINUITY_EDGE_MIRROR.md#verification-and-failure-handling"

  # Window headroom for ContinuityCoverageIncomplete. Publication runs every 15
  # minutes exactly, so a [15m] window can hold zero increments between attempts
  # and flap a persistent failure. Facility 71 fails coverage ONCE at t=1m and
  # never again: at 45m it must still be alerting (a [15m] window would have
  # dropped it around 16m), and by 75m — past the 1h window — it must have
  # resolved rather than latching forever. Facility 72's flat counter never
  # fires, which is what keeps a freshly provisioned edge from paging on day one.
  - interval: 1m
    input_series:
      - series: 'vhhealth_continuity_coverage_incomplete_total{facility_id="71"}'
        values: '0 1x80'
      - series: 'vhhealth_continuity_coverage_incomplete_total{facility_id="72"}'
        values: '0x80'
    alert_rule_test:
      - eval_time: 45m
        alertname: ContinuityCoverageIncomplete
        exp_alerts:
          - exp_labels:
              facility_id: "71"
              severity: critical
              team: continuity
            exp_annotations:
              summary: "A continuity publication for facility 71 was rejected for incomplete required coverage"
              runbook: "docs/runbooks/CONTINUITY_EDGE_MIRROR.md#verification-and-failure-handling"
      - eval_time: 75m
        alertname: ContinuityCoverageIncomplete
        exp_alerts: []

  # Ward downtime packs: the OUTPUT rules that replaced the CronJob-liveness
  # rule. The scenario is the one the retired rule could not see — the
  # ward-downtime-packs CronJob completes successfully every 15 minutes while
  # its gated sweep produces nothing, so six occupied wards have no pack to
  # print. kube_cronjob_status_last_successful_time advances the whole time,
  # which is exactly why it is no longer what we alert on.
  - interval: 1m
    input_series:
      - series: 'vhhealth_ward_downtime_pack_wards_expected{pod="backend-0"}'
        values: '6x40'
      - series: 'vhhealth_ward_downtime_pack_wards_covered{pod="backend-0"}'
        values: '0x40'
      - series: 'vhhealth_ward_downtime_pack_wards_missing{pod="backend-0"}'
        values: '0 0 0 0 0 6x35'
      - series: 'kube_cronjob_status_last_successful_time{namespace="vhhealth",cronjob="ward-downtime-packs"}'
        values: '0+60x40'
    alert_rule_test:
      # Nothing missing yet — the rule is quiet while packs are covered.
      - eval_time: 4m
        alertname: WardDowntimePacksMissing
        exp_alerts: []
      # Coverage is lost at t=5m; `for: 10m` holds it until 15m.
      - eval_time: 14m
        alertname: WardDowntimePacksMissing
        exp_alerts: []
      - eval_time: 16m
        alertname: WardDowntimePacksMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              team: continuity
            exp_annotations:
              summary: "Occupied wards have no fresh downtime pack to print — nothing exists for an outage"
              description: |
                One or more wards with occupied beds have no ward downtime pack that is
                present, under 45 minutes old, unexpired, and non-empty. The backend log
                line `Ward downtime packs missing for N occupied ward(s)` names the wards.
                Generation is NOT automatic today — confirm the preconditions in
                docs/DOWNTIME_PROCEDURE.md ("Why generation may produce nothing") and
                regenerate with POST /api/v1/downtime/generate meanwhile.
                Check: kubectl get cronjob ward-downtime-packs -n vhhealth
                       kubectl logs -n vhhealth -l app.kubernetes.io/name=ward-downtime-packs
              runbook: "docs/DOWNTIME_PROCEDURE.md"
      # The observation itself is being reported, so the "we cannot tell"
      # companion stays quiet.
      - eval_time: 30m
        alertname: WardDowntimePackOutputUnobserved
        exp_alerts: []

  # A hospital with no occupied beds legitimately needs no packs. The probe
  # still publishes its zeros, so this must NOT page — and the absent() guard
  # must not fire either, because the deployment is observed, just empty.
  - interval: 1m
    input_series:
      - series: 'vhhealth_ward_downtime_pack_wards_expected{pod="backend-0"}'
        values: '0x40'
      - series: 'vhhealth_ward_downtime_pack_wards_covered{pod="backend-0"}'
        values: '0x40'
      - series: 'vhhealth_ward_downtime_pack_wards_missing{pod="backend-0"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: WardDowntimePacksMissing
        exp_alerts: []
      - eval_time: 35m
        alertname: WardDowntimePackOutputUnobserved
        exp_alerts: []

  # One replica reporting a gap is enough: the series is a count of wards in
  # the bad state, so a healthy replica cannot average it away. (Under the old
  # per-entity gauge shape this is the case a bare max()/min() would have
  # hidden.) With no series at all, the absent() companion fires instead of the
  # deployment reading as healthy.
  - interval: 1m
    input_series:
      - series: 'vhhealth_ward_downtime_pack_wards_missing{pod="backend-0"}'
        values: '0x40'
      - series: 'vhhealth_ward_downtime_pack_wards_missing{pod="backend-1"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: WardDowntimePacksMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              team: continuity
            exp_annotations:
              summary: "Occupied wards have no fresh downtime pack to print — nothing exists for an outage"
              description: |
                One or more wards with occupied beds have no ward downtime pack that is
                present, under 45 minutes old, unexpired, and non-empty. The backend log
                line `Ward downtime packs missing for N occupied ward(s)` names the wards.
                Generation is NOT automatic today — confirm the preconditions in
                docs/DOWNTIME_PROCEDURE.md ("Why generation may produce nothing") and
                regenerate with POST /api/v1/downtime/generate meanwhile.
                Check: kubectl get cronjob ward-downtime-packs -n vhhealth
                       kubectl logs -n vhhealth -l app.kubernetes.io/name=ward-downtime-packs
              runbook: "docs/DOWNTIME_PROCEDURE.md"
      # Nothing is measuring ward-pack coverage in this scenario, so silence is
      # reported as silence.
      - eval_time: 30m
        alertname: WardDowntimePackOutputUnobserved
        exp_alerts:
          - exp_labels:
              severity: critical
              team: continuity
            exp_annotations:
              summary: "No ward downtime-pack output observation is being reported — coverage is unknown"
              description: |
                vhhealth_ward_downtime_pack_wards_expected is absent from every backend
                replica, so WardDowntimePacksMissing cannot fire and nothing is asserting
                that a printable pack exists. Check the backend /metrics scrape and the
                ward-downtime-pack-output-probe scheduler job.
              runbook: "docs/DOWNTIME_PROCEDURE.md"

  # External-recovery alerts retain the honest database-output scope. Facility
  # 41 and tenant-wide I03 require reconciliation while facility 42 is healthy.
  - interval: 1m
    input_series:
      - series: 'external_recovery_observation_timestamp_seconds{pod="backend-0"}'
        values: '0+60x40'
      - series: 'external_recovery_active_offsets{tenant_id="10000000-0000-4000-8000-000000000001",facility_scope="facility",facility_id="41",interface_family="I10",direction="inbound",recovery_state="reconciliation_required_source_gap",pod="backend-0"}'
        values: '1x40'
      - series: 'external_recovery_inbox_pending_rows{tenant_id="10000000-0000-4000-8000-000000000001",facility_scope="facility",facility_id="41",interface_family="I10",direction="inbound",pod="backend-0"}'
        values: '501x40'
      - series: 'external_recovery_inbox_oldest_pending_age_seconds{tenant_id="10000000-0000-4000-8000-000000000001",facility_scope="facility",facility_id="41",interface_family="I10",direction="inbound",pod="backend-0"}'
        values: '1000x40'
      - series: 'external_recovery_inbox_dead_rows{tenant_id="10000000-0000-4000-8000-000000000001",facility_scope="facility",facility_id="41",interface_family="I10",direction="inbound",pod="backend-0"}'
        values: '1x40'
      - series: 'external_recovery_critical_review_unacknowledged_rows{tenant_id="10000000-0000-4000-8000-000000000001",facility_scope="facility",facility_id="41",interface_family="I10",direction="inbound",pod="backend-0"}'
        values: '1x40'
      - series: 'external_recovery_active_offsets{tenant_id="10000000-0000-4000-8000-000000000001",facility_scope="facility",facility_id="42",interface_family="I10",direction="inbound",recovery_state="ready",pod="backend-0"}'
        values: '1x40'
      - series: 'external_recovery_inbox_pending_rows{tenant_id="10000000-0000-4000-8000-000000000001",facility_scope="facility",facility_id="42",interface_family="I10",direction="inbound",pod="backend-0"}'
        values: '0x40'
      - series: 'external_recovery_active_offsets{tenant_id="20000000-0000-4000-8000-000000000001",facility_scope="tenant",facility_id="tenant-wide",interface_family="I03",direction="inbound",recovery_state="reconciliation_required_missing_marker",pod="backend-0"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: ExternalRecoveryObservabilityUnobserved
        exp_alerts: []
      - eval_time: 20m
        alertname: ExternalRecoveryOffsetRequiresReconciliation
        exp_alerts:
          - exp_labels:
              tenant_id: "10000000-0000-4000-8000-000000000001"
              facility_scope: facility
              facility_id: "41"
              interface_family: I10
              direction: inbound
              recovery_state: reconciliation_required_source_gap
              severity: critical
              team: continuity
            exp_annotations:
              summary: "External recovery for 10000000-0000-4000-8000-000000000001/41 I10 inbound requires reconciliation"
              description: "The database reports one or more live offsets in reconciliation_required_source_gap. Inspect the exact partition in the Admin Continuity Reconciliation workbench; do not bulk resume."
              runbook: "docs/runbooks/C6_1_EXTERNAL_RECOVERY_OPERABILITY.md"
          - exp_labels:
              tenant_id: "20000000-0000-4000-8000-000000000001"
              facility_scope: tenant
              facility_id: tenant-wide
              interface_family: I03
              direction: inbound
              recovery_state: reconciliation_required_missing_marker
              severity: critical
              team: continuity
            exp_annotations:
              summary: "External recovery for 20000000-0000-4000-8000-000000000001/tenant-wide I03 inbound requires reconciliation"
              description: "The database reports one or more live offsets in reconciliation_required_missing_marker. Inspect the exact partition in the Admin Continuity Reconciliation workbench; do not bulk resume."
              runbook: "docs/runbooks/C6_1_EXTERNAL_RECOVERY_OPERABILITY.md"
      - eval_time: 20m
        alertname: ExternalRecoveryInboxDeadRows
        exp_alerts:
          - exp_labels:
              tenant_id: "10000000-0000-4000-8000-000000000001"
              facility_scope: facility
              facility_id: "41"
              interface_family: I10
              direction: inbound
              severity: critical
              team: continuity
            exp_annotations:
              summary: "External recovery has terminal dead work for 10000000-0000-4000-8000-000000000001/41 I10 inbound"
              description: "The database reports terminal external-interface inbox rows. Inspect exact rows and preserved evidence; this alert grants no redrive or family activation authority."
              runbook: "docs/runbooks/C6_1_EXTERNAL_RECOVERY_OPERABILITY.md"
      - eval_time: 20m
        alertname: ExternalRecoveryInboxPendingStalled
        exp_alerts:
          - exp_labels:
              tenant_id: "10000000-0000-4000-8000-000000000001"
              facility_scope: facility
              facility_id: "41"
              interface_family: I10
              direction: inbound
              severity: critical
              team: continuity
            exp_annotations:
              summary: "External recovery pending work is stalled for 10000000-0000-4000-8000-000000000001/41 I10 inbound"
              description: "At least one database inbox row has remained pending for more than 15 minutes after recovery recording. This is output evidence, not a worker-liveness proxy."
              runbook: "docs/runbooks/C6_1_EXTERNAL_RECOVERY_OPERABILITY.md"
      - eval_time: 20m
        alertname: ExternalRecoveryInboxBacklogHigh
        exp_alerts:
          - exp_labels:
              tenant_id: "10000000-0000-4000-8000-000000000001"
              facility_scope: facility
              facility_id: "41"
              interface_family: I10
              direction: inbound
              severity: warning
              team: continuity
            exp_annotations:
              summary: "External recovery backlog exceeds 500 rows for 10000000-0000-4000-8000-000000000001/41 I10 inbound"
              description: "The database output reports a sustained capacity backlog. This signal is not permission to predicate-bulk replay or weaken cursor fences."
              runbook: "docs/runbooks/C6_1_EXTERNAL_RECOVERY_OPERABILITY.md"
      - eval_time: 20m
        alertname: ExternalRecoveryCriticalReviewUnacknowledged
        exp_alerts:
          - exp_labels:
              tenant_id: "10000000-0000-4000-8000-000000000001"
              facility_scope: facility
              facility_id: "41"
              interface_family: I10
              direction: inbound
              severity: critical
              team: continuity
            exp_annotations:
              summary: "Late critical result awaits continuity awareness for 10000000-0000-4000-8000-000000000001/41"
              description: "Open the facility/tenant Critical Results / Clinical Inbox. This operational page reports a missing recovery-awareness acknowledgement; it is not a fresh lab alarm or SLA breach."
              runbook: "docs/runbooks/C6_1_EXTERNAL_RECOVERY_OPERABILITY.md"

  # Missing output cannot be made green by a zero offset total.
  - interval: 1m
    input_series:
      - series: 'external_recovery_offsets_observed_total{pod="backend-0"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: ExternalRecoveryObservabilityUnobserved
        exp_alerts:
          - exp_labels:
              severity: critical
              team: continuity
            exp_annotations:
              summary: "External-recovery database output has not been observed for five minutes — state is unknown"
              description: "The output snapshot is absent or stale. Do not infer healthy offsets, inboxes, or late-critical awareness from backend liveness."
              runbook: "docs/runbooks/C6_1_EXTERNAL_RECOVERY_OPERABILITY.md"

  # Stale output is also unknown, even though a timestamp series exists.
  - interval: 1m
    input_series:
      - series: 'external_recovery_observation_timestamp_seconds{pod="backend-0"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: ExternalRecoveryObservabilityUnobserved
        exp_alerts:
          - exp_labels:
              severity: critical
              team: continuity
            exp_annotations:
              summary: "External-recovery database output has not been observed for five minutes — state is unknown"
              description: "The output snapshot is absent or stale. Do not infer healthy offsets, inboxes, or late-critical awareness from backend liveness."
              runbook: "docs/runbooks/C6_1_EXTERNAL_RECOVERY_OPERABILITY.md"

  # Rate-limit store posture (#873 follow-up). One pod degraded is enough for
  # RateLimitStoreDegraded (max()), and one deaf pod is enough for
  # WsFanoutSubscriberDown (min()) even while a sibling stays subscribed.
  - interval: 1m
    input_series:
      - series: 'vh_rate_limit_store_degraded{pod="backend-0"}'
        values: '1x30'
      - series: 'vh_rate_limit_store_degraded{pod="backend-1"}'
        values: '0x30'
      - series: 'vh_redis_ws_fanout_ready{pod="backend-0"}'
        values: '0x30'
      - series: 'vh_redis_ws_fanout_ready{pod="backend-1"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 6m
        alertname: RateLimitStoreDegraded
        exp_alerts:
          - exp_labels:
              severity: warning
              team: backend
            exp_annotations:
              summary: "Redis rate-limit store degraded for 5m — fail-closed profiles (auth/otp/sos) are answering 429, fail-open profiles pass unmetered"
              runbook: "docs/RUNBOOK_ONCALL.md#ratelimitstoredegraded"
      - eval_time: 11m
        alertname: WsFanoutSubscriberDown
        exp_alerts:
          - exp_labels:
              severity: warning
              team: backend
            exp_annotations:
              summary: "Cross-pod WS fan-out subscriber is down — realtime broadcasts (vitals/code-blue) are single-process only on at least one pod"
              runbook: "docs/RUNBOOK_ONCALL.md#wsfanoutsubscriberdown"

  # Healthy posture on every pod stays silent for both rules.
  - interval: 1m
    input_series:
      - series: 'vh_rate_limit_store_degraded{pod="backend-0"}'
        values: '0x30'
      - series: 'vh_redis_ws_fanout_ready{pod="backend-0"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: RateLimitStoreDegraded
        exp_alerts: []
      - eval_time: 15m
        alertname: WsFanoutSubscriberDown
        exp_alerts: []

  # CNPG WAL archiving (gap-audit HIGH-2). Arm 1: the primary's
  # seconds-since-last-archival grows past 900 while the failure counter stays
  # flat — the archiver is wedged without erroring. The aggregated max() drops
  # instance labels, so the alert carries only severity/team.
  - interval: 1m
    input_series:
      - series: 'cnpg_pg_stat_archiver_seconds_since_last_archival{namespace="vhhealth-platform",pod="vhhealth-pg-1"}'
        values: '1000x40'
      - series: 'cnpg_pg_stat_archiver_failed_count{namespace="vhhealth-platform",pod="vhhealth-pg-1"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 16m
        alertname: CnpgWalArchivingStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              team: database
            exp_annotations:
              summary: "CNPG WAL archiving is stalled or failing — PITR coverage is degrading now"
              description: "The primary has not archived a WAL segment for >15 minutes, the archiver failure counter is rising, or the archiver metric is absent. Every unarchived segment widens the point-in-time-recovery gap; do not wait for the daily backup verify (~30h) to notice. Check the Barman Cloud plugin sidecar logs, the ObjectStore status, and pg_stat_archiver on the primary in ns vhhealth-platform."
              runbook: "docs/DR_RESTORE_DRILL.md"

  # Arm 2: archive attempts are actively failing (counter rising) even though a
  # recent success keeps the staleness arm quiet. Per-series labels survive.
  # A healthy flat counter with fresh archival must stay silent.
  - interval: 1m
    input_series:
      - series: 'cnpg_pg_stat_archiver_seconds_since_last_archival{namespace="vhhealth-platform",pod="vhhealth-pg-1"}'
        values: '60x40'
      - series: 'cnpg_pg_stat_archiver_failed_count{namespace="vhhealth-platform",pod="vhhealth-pg-1"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 17m
        alertname: CnpgWalArchivingStalled
        exp_alerts:
          - exp_labels:
              namespace: vhhealth-platform
              pod: vhhealth-pg-1
              severity: critical
              team: database
            exp_annotations:
              summary: "CNPG WAL archiving is stalled or failing — PITR coverage is degrading now"
              description: "The primary has not archived a WAL segment for >15 minutes, the archiver failure counter is rising, or the archiver metric is absent. Every unarchived segment widens the point-in-time-recovery gap; do not wait for the daily backup verify (~30h) to notice. Check the Barman Cloud plugin sidecar logs, the ObjectStore status, and pg_stat_archiver on the primary in ns vhhealth-platform."
              runbook: "docs/DR_RESTORE_DRILL.md"

  - interval: 1m
    input_series:
      - series: 'cnpg_pg_stat_archiver_seconds_since_last_archival{namespace="vhhealth-platform",pod="vhhealth-pg-1"}'
        values: '60x40'
      - series: 'cnpg_pg_stat_archiver_failed_count{namespace="vhhealth-platform",pod="vhhealth-pg-1"}'
        values: '5x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: CnpgWalArchivingStalled
        exp_alerts: []

  # Arm 3: no archiver series at all — a scrape gap must not read as healthy
  # while archiving is unobserved (CanaryHealthCheckStale precedent).
  - interval: 1m
    input_series:
      - series: 'up{job="node-exporter",instance="node-b"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 16m
        alertname: CnpgWalArchivingStalled
        exp_alerts:
          - exp_labels:
              namespace: vhhealth-platform
              severity: critical
              team: database
            exp_annotations:
              summary: "CNPG WAL archiving is stalled or failing — PITR coverage is degrading now"
              description: "The primary has not archived a WAL segment for >15 minutes, the archiver failure counter is rising, or the archiver metric is absent. Every unarchived segment widens the point-in-time-recovery gap; do not wait for the daily backup verify (~30h) to notice. Check the Barman Cloud plugin sidecar logs, the ObjectStore status, and pg_stat_archiver on the primary in ns vhhealth-platform."
              runbook: "docs/DR_RESTORE_DRILL.md"

  # The continuity page clears only when the acknowledgement output becomes 0.
  - interval: 1m
    input_series:
      - series: 'external_recovery_observation_timestamp_seconds{pod="backend-0"}'
        values: '0+60x20'
      - series: 'external_recovery_critical_review_unacknowledged_rows{tenant_id="20000000-0000-4000-8000-000000000001",facility_scope="tenant",facility_id="tenant-wide",interface_family="I01",direction="inbound",pod="backend-0"}'
        values: '1x5 0x15'
    alert_rule_test:
      - eval_time: 4m
        alertname: ExternalRecoveryCriticalReviewUnacknowledged
        exp_alerts:
          - exp_labels:
              tenant_id: "20000000-0000-4000-8000-000000000001"
              facility_scope: tenant
              facility_id: tenant-wide
              interface_family: I01
              direction: inbound
              severity: critical
              team: continuity
            exp_annotations:
              summary: "Late critical result awaits continuity awareness for 20000000-0000-4000-8000-000000000001/tenant-wide"
              description: "Open the facility/tenant Critical Results / Clinical Inbox. This operational page reports a missing recovery-awareness acknowledgement; it is not a fresh lab alarm or SLA breach."
              runbook: "docs/runbooks/C6_1_EXTERNAL_RECOVERY_OPERABILITY.md"
      - eval_time: 7m
        alertname: ExternalRecoveryCriticalReviewUnacknowledged
        exp_alerts: []

  # ────────────────────────────────────────────────────────────────────────────
  # security-events group (re-audit 2026-08-23). The group shipped with NO
  # promtool coverage, which is exactly how SecurityBreakGlassActivated shipped
  # with a matcher that could never match: Prometheus label regexes are fully
  # anchored, so `event_type=~"BREAK_GLASS_.*"` never saw the
  # 'PHI_BREAK_GLASS_ACTIVATED' / 'PHI_BREAK_GLASS_REVOKED' values that
  # alertBreakGlass() in
  # apps/backend/src/services/security/breakGlassService.js actually emits.
  #
  # Every input_series below therefore uses the REAL label values produced by
  # the backend, not a convenient abbreviation. Against the pre-fix rule the
  # first block fails (exp_alerts non-empty, actual empty), which is the whole
  # point of adding it.
  # ────────────────────────────────────────────────────────────────────────────

  # Break-glass ACTIVATED, recorded while webhook paging is unconfigured — the
  # deployed state the once-over found. Both the break-glass rule and the
  # paging-unconfigured rule must fire off the same counter.
  - interval: 1m
    input_series:
      - series: 'vhhealth_security_webhook_events_total{event_type="PHI_BREAK_GLASS_ACTIVATED",outcome="disabled",pod="backend-0"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: SecurityBreakGlassActivated
        exp_alerts:
          - exp_labels:
              event_type: PHI_BREAK_GLASS_ACTIVATED
              outcome: disabled
              pod: backend-0
              severity: warning
              team: backend
            exp_annotations:
              summary: "A break-glass access grant was activated or revoked"
              description: "Break-glass use is legitimate but must always be reviewed. Cross-check the actor and reason in audit_log and the break-glass review queue."
      - eval_time: 20m
        alertname: SecurityPagingUnconfigured
        exp_alerts:
          - exp_labels:
              event_type: PHI_BREAK_GLASS_ACTIVATED
              outcome: disabled
              pod: backend-0
              severity: warning
              team: backend
            exp_annotations:
              summary: "Security events occurred while webhook paging is disabled"
              description: "sendSecurityWebhook dropped events because SECURITY_WEBHOOKS_ENABLED/SECURITY_WEBHOOK_URL are unset. Either enable paging (ConfigMap flag + sealed URL) or accept and silence during quiet hours."
      # The webhook counter is moving, so the pairing meta-alert must stay quiet.
      - eval_time: 20m
        alertname: SecurityWebhookCounterMissing
        exp_alerts: []

  # Break-glass REVOKED, delivered successfully. The revoke half of the
  # lifecycle must page too, and a non-'disabled' outcome must not trip
  # SecurityPagingUnconfigured.
  - interval: 1m
    input_series:
      - series: 'vhhealth_security_webhook_events_total{event_type="PHI_BREAK_GLASS_REVOKED",outcome="sent",pod="backend-1"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: SecurityBreakGlassActivated
        exp_alerts:
          - exp_labels:
              event_type: PHI_BREAK_GLASS_REVOKED
              outcome: sent
              pod: backend-1
              severity: warning
              team: backend
            exp_annotations:
              summary: "A break-glass access grant was activated or revoked"
              description: "Break-glass use is legitimate but must always be reviewed. Cross-check the actor and reason in audit_log and the break-glass review queue."
      - eval_time: 20m
        alertname: SecurityPagingUnconfigured
        exp_alerts: []

  # Audit-chain tamper. Also pins the break-glass matcher's negative side: a
  # neighbouring event type on the same counter must NOT satisfy
  # `.*BREAK_GLASS.*`.
  - interval: 1m
    input_series:
      - series: 'vhhealth_security_webhook_events_total{event_type="AUDIT_CHAIN_TAMPERED",outcome="sent",pod="backend-0"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: SecurityAuditChainTampered
        exp_alerts:
          - exp_labels:
              event_type: AUDIT_CHAIN_TAMPERED
              outcome: sent
              pod: backend-0
              severity: critical
              team: backend
            exp_annotations:
              summary: "Audit hash-chain tamper detected"
              description: "The nightly audit-chain verifier found broken links. Treat as an active integrity incident; identify the first broken sequence from the backend logs and audit_log."
      - eval_time: 20m
        alertname: SecurityBreakGlassActivated
        exp_alerts: []

  # vhhealth_security_events_total consumers. BRUTE_FORCE_DETECTED and a
  # lockout surge page off the audit funnel, so they work while the webhook
  # channel stays disabled. No webhook series exists at all here, which is also
  # the SecurityWebhookCounterMissing positive case: an event type that always
  # calls sendSecurityWebhook advanced while the webhook counter recorded
  # nothing.
  - interval: 1m
    input_series:
      - series: 'vhhealth_security_events_total{event_type="BRUTE_FORCE_DETECTED",pod="backend-1"}'
        values: '0+1x40'
      - series: 'vhhealth_security_events_total{event_type="ACCOUNT_LOCKED",pod="backend-1"}'
        values: '0+4x40'
    alert_rule_test:
      - eval_time: 25m
        alertname: SecurityBruteForceDetected
        exp_alerts:
          - exp_labels:
              event_type: BRUTE_FORCE_DETECTED
              pod: backend-1
              severity: critical
              team: backend
            exp_annotations:
              summary: "Credential-stuffing pattern detected against the auth endpoints"
              description: "loginAnomalyDetector flagged one client IP failing logins against 10 or more distinct accounts inside its 15-minute window. Identify the IP from the BRUTE_FORCE_DETECTED rows in audit_log (module='security'), block it at the edge, and check whether any targeted account succeeded afterwards. Detection requires Redis: trackFailedLogin returns early when the Redis client is disconnected, so a Redis outage silences this signal entirely — cross-check RateLimitStoreDegraded before reading quiet as safe."
      - eval_time: 25m
        alertname: SecurityAccountLockoutSurge
        exp_alerts:
          - exp_labels:
              severity: warning
              team: backend
            exp_annotations:
              summary: "Account lockouts are surging — credential attack, or staff shut out of clinical systems"
              description: "More than 25 ACCOUNT_LOCKED events fleet-wide in 15 minutes. The counter is labelled by event type only — the account and the lockout reason are on the audit_log row — so this is deliberately a surge threshold and not a per-account notice: one locked-out clinician retrying contributes several events, because the lockout check re-fires on every subsequent attempt inside the window. Read the ACCOUNT_LOCKED rows in audit_log to tell distributed credential guessing apart from an auth or deployment fault locking real staff out."
      - eval_time: 25m
        alertname: SecurityWebhookCounterMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              team: backend
            exp_annotations:
              summary: "Security events fired but the webhook counter recorded nothing — three security rules are blind"
              description: "vhhealth_security_events_total advanced for an event type that always calls sendSecurityWebhook, yet vhhealth_security_webhook_events_total did not move. SecurityAuditChainTampered, SecurityBreakGlassActivated and SecurityPagingUnconfigured are all inert in that state. Check that /metrics still exposes vhhealth_security_webhook_events_total and that serializeSecurityEventMetrics is still wired into metricsRoutes.js."

  # Healthy pipeline: the webhook counter advances alongside the events counter,
  # and lockouts stay under the surge threshold (15 in 15 minutes, not >25).
  - interval: 1m
    input_series:
      - series: 'vhhealth_security_events_total{event_type="BRUTE_FORCE_DETECTED",pod="backend-1"}'
        values: '0+1x40'
      - series: 'vhhealth_security_events_total{event_type="ACCOUNT_LOCKED",pod="backend-1"}'
        values: '0+1x40'
      - series: 'vhhealth_security_webhook_events_total{event_type="BRUTE_FORCE_DETECTED",outcome="sent",pod="backend-1"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 25m
        alertname: SecurityWebhookCounterMissing
        exp_alerts: []
      - eval_time: 25m
        alertname: SecurityAccountLockoutSurge
        exp_alerts: []

  # ────────────────────────────────────────────────────────────────────────────
  # postgres group (re-audit 2026-08-23). Four rules referenced the CNPG
  # user-defined queries by their query-local names (vhhealth_replication_lag_
  # seconds, vhhealth_connections_total/_max_conn) instead of the exported
  # cnpg_<query>_<column> spelling, so they could never match a sample. Round 2
  # then found that the seconds column itself could not measure per-standby lag
  # on a primary, so the series is now cnpg_vhhealth_replication_replay_lag_
  # seconds, fed by pg_stat_replication.replay_lag.
  #
  # These blocks feed the exported names AND the LABEL columns declared
  # alongside them in infra/kubernetes/base/cnpg/cluster.yaml. Note what that
  # does and does not buy: promtool only proves the rules behave as written
  # against samples written here by the same author, which is why both defects
  # passed a green fixture. check-cnpg-metric-parity.mjs is the half that reads
  # cluster.yaml — it validates the series names in these input_series too, so a
  # fixture cannot invent a metric no query produces.
  # ────────────────────────────────────────────────────────────────────────────

  # Primary with one badly lagging standby and a nearly exhausted pool.
  - interval: 1m
    input_series:
      - series: 'cnpg_vhhealth_replication_replay_lag_seconds{namespace="vhhealth-platform",pod="vhhealth-pg-1",client="10.42.0.7",application_name="vhhealth-pg-2",state="streaming"}'
        values: '420x20'
      - series: 'cnpg_vhhealth_connections_total{namespace="vhhealth-platform",pod="vhhealth-pg-1"}'
        values: '180x20'
      - series: 'cnpg_vhhealth_connections_max_conn{namespace="vhhealth-platform",pod="vhhealth-pg-1"}'
        values: '200x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: PostgresReplicationLagHigh
        exp_alerts:
          - exp_labels:
              application_name: vhhealth-pg-2
              client: "10.42.0.7"
              namespace: vhhealth-platform
              pod: vhhealth-pg-1
              state: streaming
              severity: warning
              team: database
            exp_annotations:
              summary: "Postgres replica 10.42.0.7 lagging > 60s"
              description: "pg_stat_replication.replay_lag for this standby, read on the primary: the delay between the primary flushing WAL and this standby reporting it applied. Currently 420s."
      - eval_time: 6m
        alertname: PostgresReplicationLagCritical
        exp_alerts:
          - exp_labels:
              application_name: vhhealth-pg-2
              client: "10.42.0.7"
              namespace: vhhealth-platform
              pod: vhhealth-pg-1
              state: streaming
              severity: critical
              team: database
            exp_annotations:
              summary: "Postgres replica 10.42.0.7 lagging > 5 minutes"
              description: "Same measure as PostgresReplicationLagHigh — pg_stat_replication.replay_lag for this standby — past the 300s budget. Check cnpg_vhhealth_replication_flush_lag_seconds and cnpg_vhhealth_replication_lag_bytes on the same labels to tell a slow apply apart from a stalled stream."
      # 180/200 = 0.90. Both operands carry identical labels, so the division
      # matches per instance and keeps namespace/pod.
      - eval_time: 6m
        alertname: PostgresConnectionsHigh
        exp_alerts:
          - exp_labels:
              namespace: vhhealth-platform
              pod: vhhealth-pg-1
              severity: warning
              team: database
            exp_annotations:
              summary: "Postgres connection usage is above 85% of max_connections"
              description: "Both operands come from the same vhhealth_connections query row, so they carry identical labels and divide per CNPG instance. Check for a connection leak or a runaway client before the pool exhausts max_connections."
      # A normal in-cluster standby is not the C6.2 DR standby.
      - eval_time: 6m
        alertname: C6WarmStandbyReplicationLagHigh
        exp_alerts: []
      # The series exist, so neither meta-alert may fire.
      - eval_time: 16m
        alertname: PostgresConnectionMetricsAbsent
        exp_alerts: []
      - eval_time: 16m
        alertname: PostgresReplicationMetricAbsent
        exp_alerts: []

  # SAFE-01: the automatic unmatched-result reconciliation loop must page when
  # it stops scheduling or its Job fails. Owned clinical tasks remain open, so
  # this test verifies liveness without pretending an absent sweep is healthy.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_schedule_time{namespace="vhhealth",cronjob="lab-threshold-exception-reconciliation"}'
        values: '0x30'
      - series: 'kube_job_status_failed{namespace="vhhealth",job_name="lab-threshold-exception-reconciliation-10000001"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 22m
        alertname: LabThresholdReconciliationCronJobStale
        exp_alerts:
          - exp_labels:
              severity: critical
              team: backend
            exp_annotations:
              summary: "Laboratory threshold-exception reconciliation has not scheduled for more than 15 minutes"
              description: "Unmatched laboratory results still retain owned tasks, but automatic re-evaluation against newly approved policy content is unavailable."
              runbook: "docs/RUNBOOK_ONCALL.md#labthresholdreconciliationcronjobstale--labthresholdreconciliationcronjobfailing"
      - eval_time: 22m
        alertname: LabThresholdReconciliationCronJobFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              team: backend
            exp_annotations:
              summary: "Laboratory threshold-exception reconciliation is failing"
              description: "At least one scheduled reconciliation job failed; inspect its durable fleet and tenant receipts before retrying."
              runbook: "docs/RUNBOOK_ONCALL.md#labthresholdreconciliationcronjobstale--labthresholdreconciliationcronjobfailing"

  # The C6.2 warm standby is identified by application_name, a LABEL column on
  # the same user-defined query — it survives both the metric rename and the
  # change of measure. 45s of replay_lag is over the 30s DR budget but under the
  # 60s general threshold.
  - interval: 1m
    input_series:
      - series: 'cnpg_vhhealth_replication_replay_lag_seconds{namespace="vhhealth-platform",pod="vhhealth-pg-1",client="10.42.9.4",application_name="vhhealth-pg-dr-1",state="streaming"}'
        values: '45x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: C6WarmStandbyReplicationLagHigh
        exp_alerts:
          - exp_labels:
              application_name: vhhealth-pg-dr-1
              client: "10.42.9.4"
              namespace: vhhealth-platform
              pod: vhhealth-pg-1
              state: streaming
              severity: critical
              team: database
            exp_annotations:
              summary: "C6.2 warm-standby streaming lag exceeds 30 seconds"
              description: "The Phase 2 target is evaluated only by a promotion drill; this signal protects the async stream and does not itself prove RPO."
              runbook: "docs/runbooks/C6_2_WARM_STANDBY_PROMOTION_FAILBACK.md"
      - eval_time: 6m
        alertname: PostgresReplicationLagHigh
        exp_alerts: []

  # THE DURABLE GUARD. CNPG is running (cnpg_collector_up present) but the
  # assumed vhhealth_connections names are not exported at all — the exact state
  # the four rules above were shipped in. The CNPG-gated arm must page.
  - interval: 1m
    input_series:
      - series: 'up{job="node-exporter",instance="node-c"}'
        values: '1x40'
      - series: 'cnpg_collector_up{namespace="vhhealth-platform",pod="vhhealth-pg-1"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 16m
        alertname: PostgresConnectionMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: warning
              team: database
            exp_annotations:
              summary: "CNPG connection-usage metrics are not being exported — PostgresConnectionsHigh is blind"
              description: "The vhhealth_connections user-defined query reads pg_stat_activity, so it yields a row on every instance whenever the exporter is scraped at all. This alert is gated on CNPG running (count(cnpg_collector_up) > 0), so it stays silent on a non-CNPG rig instead of paging forever; on a CNPG cluster its firing means the customQueriesConfigMap is not mounted, the query is erroring, or the exported names are not cnpg_vhhealth_connections_total / cnpg_vhhealth_connections_max_conn. Read the real names off a live instance before editing the rules: kubectl exec -n vhhealth-platform vhhealth-pg-1 -c postgres -- curl -s localhost:9187/metrics | grep vhhealth"
      # With no connections series the instance count is unknown, so the gated
      # replication arm deliberately stays silent; PostgresConnectionMetricsAbsent
      # carries the page.
      - eval_time: 16m
        alertname: PostgresReplicationMetricAbsent
        exp_alerts: []

  # NON-CNPG RIG. A plain-postgres StatefulSet (the test rig, and any non-CNPG
  # overlay) exports no cnpg_ series at all — including no cnpg_collector_up.
  # PostgresConnectionMetricsAbsent must NOT page here: absence is silence, not a
  # naming miss. This is the case that used to page forever before the gate.
  - interval: 1m
    input_series:
      - series: 'up{job="node-exporter",instance="node-c"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 16m
        alertname: PostgresConnectionMetricsAbsent
        exp_alerts: []
      - eval_time: 16m
        alertname: PostgresReplicationMetricAbsent
        exp_alerts: []

  # Multi-instance cluster (two scraped exporters) with no replication series:
  # either nothing is streaming or the metric name is wrong. Both page.
  - interval: 1m
    input_series:
      - series: 'cnpg_vhhealth_connections_total{namespace="vhhealth-platform",pod="vhhealth-pg-1"}'
        values: '20x40'
      - series: 'cnpg_vhhealth_connections_total{namespace="vhhealth-platform",pod="vhhealth-pg-2"}'
        values: '5x40'
      - series: 'cnpg_vhhealth_connections_max_conn{namespace="vhhealth-platform",pod="vhhealth-pg-1"}'
        values: '200x40'
      - series: 'cnpg_vhhealth_connections_max_conn{namespace="vhhealth-platform",pod="vhhealth-pg-2"}'
        values: '200x40'
    alert_rule_test:
      - eval_time: 16m
        alertname: PostgresReplicationMetricAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              team: database
            exp_annotations:
              summary: "CNPG replication-lag metric is missing on a multi-instance cluster — three replication alerts are blind"
              description: "PostgresReplicationLagHigh, PostgresReplicationLagCritical and C6WarmStandbyReplicationLagHigh all read cnpg_vhhealth_replication_replay_lag_seconds, exported by the primary from pg_stat_replication. On a cluster with more than one instance it must exist. Either no standby is streaming at all — a synchronous-commit and DR-readiness incident — or the exported metric name is not what those rules assume. If the connections series is missing too this rule stays silent by design; PostgresConnectionMetricsAbsent is the arm that fires for a wholesale naming miss."
      - eval_time: 16m
        alertname: PostgresConnectionMetricsAbsent
        exp_alerts: []
      - eval_time: 16m
        alertname: PostgresConnectionsHigh
        exp_alerts: []

  # Single-instance cluster (overlays/dev patches spec.instances to 1):
  # pg_stat_replication is legitimately empty, so the gated arm must NOT page.
  - interval: 1m
    input_series:
      - series: 'cnpg_vhhealth_connections_total{namespace="vhhealth-platform",pod="vhhealth-pg-1"}'
        values: '20x40'
      - series: 'cnpg_vhhealth_connections_max_conn{namespace="vhhealth-platform",pod="vhhealth-pg-1"}'
        values: '200x40'
    alert_rule_test:
      - eval_time: 16m
        alertname: PostgresReplicationMetricAbsent
        exp_alerts: []
      - eval_time: 16m
        alertname: PostgresConnectionMetricsAbsent
        exp_alerts: []

  # ── Boundary: exactly at the DR budget, and flush behind replay ──────────────
  # The DR standby sits at replay_lag = 30s, which `> 30` must NOT trip, with
  # flush_lag = 12s behind it — the real ordering, since WAL is flushed before it
  # is applied and flush_lag is therefore never larger than replay_lag. Nothing
  # may fire: this is the block that would break if a rule were retargeted from
  # replay_lag onto a different column without its threshold being reconsidered.
  - interval: 1m
    input_series:
      - series: 'cnpg_vhhealth_replication_replay_lag_seconds{namespace="vhhealth-platform",pod="vhhealth-pg-1",client="10.42.9.4",application_name="vhhealth-pg-dr-1",state="streaming"}'
        values: '30x40'
      - series: 'cnpg_vhhealth_replication_flush_lag_seconds{namespace="vhhealth-platform",pod="vhhealth-pg-1",client="10.42.9.4",application_name="vhhealth-pg-dr-1",state="streaming"}'
        values: '12x40'
      - series: 'cnpg_vhhealth_connections_total{namespace="vhhealth-platform",pod="vhhealth-pg-1"}'
        values: '20x40'
      - series: 'cnpg_vhhealth_connections_total{namespace="vhhealth-platform",pod="vhhealth-pg-2"}'
        values: '4x40'
      - series: 'cnpg_vhhealth_connections_max_conn{namespace="vhhealth-platform",pod="vhhealth-pg-1"}'
        values: '200x40'
      - series: 'cnpg_vhhealth_connections_max_conn{namespace="vhhealth-platform",pod="vhhealth-pg-2"}'
        values: '200x40'
    alert_rule_test:
      - eval_time: 16m
        alertname: PostgresReplicationLagHigh
        exp_alerts: []
      - eval_time: 16m
        alertname: PostgresReplicationLagCritical
        exp_alerts: []
      - eval_time: 16m
        alertname: C6WarmStandbyReplicationLagHigh
        exp_alerts: []
      - eval_time: 16m
        alertname: PostgresReplicationMetricAbsent
        exp_alerts: []

  # ────────────────────────────────────────────────────────────────────────────
  # BackendMigrationJobFailed. The ArgoCD PreSync migration hook is the one
  # outage-relevant Job in this namespace that OutageCriticalCronJobFailing
  # cannot see: that rule's alternation carries a `-.*` suffix for
  # CronJob-generated names, and Prometheus label regexes are fully anchored,
  # so a fixed-name Job can never match it however many names are added.
  #
  # These three blocks pin the three decisions that rule encodes: which SERIES
  # (the Job's Failed CONDITION, not its failed-POD count), that the pod count
  # is wrong in BOTH directions, and that the CronJob rule is still not the
  # place this belongs.
  # ────────────────────────────────────────────────────────────────────────────

  # 1. Terminal failure. The Job is running (condition false) through t=5m and
  # goes Failed at t=6m. `for: 2m` holds the page to t=8m — three minutes from
  # failure to page, three orders of magnitude inside the 86400s
  # ttlSecondsAfterFinished, so the object cannot be reaped before the alert
  # can fire.
  - interval: 1m
    input_series:
      - series: 'kube_job_failed{namespace="vhhealth",job_name="vhhealth-backend-migrate",condition="true"}'
        values: '0x5 1x35'
      - series: 'kube_job_failed{namespace="vhhealth",job_name="vhhealth-backend-migrate",condition="false"}'
        values: '1x5 0x35'
    alert_rule_test:
      - eval_time: 5m
        alertname: BackendMigrationJobFailed
        exp_alerts: []
      - eval_time: 7m
        alertname: BackendMigrationJobFailed
        exp_alerts: []
      - eval_time: 9m
        alertname: BackendMigrationJobFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              team: backend
            exp_annotations:
              summary: "The production database migration Job failed — the deploy is blocked and the schema may sit between releases"
              description: |
                The PreSync hook failed, so ArgoCD aborted the sync and the new
                Deployment never rolled out. ci-setup-db.mjs applies one file per
                transaction, so every migration BEFORE the failing one is already
                committed and tracked — the database can be left ahead of the
                image still serving traffic, and an @no-transaction file can be
                half-applied with no tracker row at all. Backend workers verify
                the tracker against their own image at startup and exit 1 on a
                mismatch, so the running pods survive only until one restarts.
                Read the evidence BEFORE re-syncing — hook-delete-policy
                BeforeHookCreation destroys this Job, its pods, and this alert at
                the start of the next sync:
                  kubectl -n vhhealth logs -l batch.kubernetes.io/job-name=vhhealth-backend-migrate -c migrate --tail=400 --prefix
                  kubectl -n vhhealth describe job vhhealth-backend-migrate
              runbook: "docs/RUNBOOK_ONCALL.md#backendmigrationjobfailed"

  # 2. THE FALSE-PAGE PIN. Under PR #955's `restartPolicy: Never` the Job
  # retains its failed pods, so kube_job_status_failed reads 1 — but the Job
  # went on to SUCCEED, so its Failed condition is false and Complete is true.
  # A rule written on the failed-POD count would page here for the entire 24h
  # retention window on a HEALTHY deploy. Silence is the assertion.
  #
  # The second expectation pins the other half of the design: the migration Job
  # must not be adopted by OutageCriticalCronJobFailing either. If the coverage
  # gap is ever "fixed" by widening that rule's alternation instead, this
  # expectation fails and the resulting double-page is caught here.
  - interval: 1m
    input_series:
      - series: 'kube_job_failed{namespace="vhhealth",job_name="vhhealth-backend-migrate",condition="true"}'
        values: '0x40'
      - series: 'kube_job_complete{namespace="vhhealth",job_name="vhhealth-backend-migrate",condition="true"}'
        values: '0x5 1x35'
      - series: 'kube_job_status_failed{namespace="vhhealth",job_name="vhhealth-backend-migrate"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: BackendMigrationJobFailed
        exp_alerts: []
      - eval_time: 30m
        alertname: OutageCriticalCronJobFailing
        exp_alerts: []

  # 3. THE BLINDNESS PIN, and today's actual policy. Under `restartPolicy:
  # OnFailure` the Job controller deletes the pod once it exceeds backoffLimit,
  # so a terminally failed Job reads `Failed 0/1`: kube_job_status_failed is 0
  # while the Failed condition is true. A rule on the pod count would see
  # nothing at the exact moment the deploy is blocked. This one pages.
  - interval: 1m
    input_series:
      - series: 'kube_job_failed{namespace="vhhealth",job_name="vhhealth-backend-migrate",condition="true"}'
        values: '1x40'
      - series: 'kube_job_status_failed{namespace="vhhealth",job_name="vhhealth-backend-migrate"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: BackendMigrationJobFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              team: backend
            exp_annotations:
              summary: "The production database migration Job failed — the deploy is blocked and the schema may sit between releases"
              description: |
                The PreSync hook failed, so ArgoCD aborted the sync and the new
                Deployment never rolled out. ci-setup-db.mjs applies one file per
                transaction, so every migration BEFORE the failing one is already
                committed and tracked — the database can be left ahead of the
                image still serving traffic, and an @no-transaction file can be
                half-applied with no tracker row at all. Backend workers verify
                the tracker against their own image at startup and exit 1 on a
                mismatch, so the running pods survive only until one restarts.
                Read the evidence BEFORE re-syncing — hook-delete-policy
                BeforeHookCreation destroys this Job, its pods, and this alert at
                the start of the next sync:
                  kubectl -n vhhealth logs -l batch.kubernetes.io/job-name=vhhealth-backend-migrate -c migrate --tail=400 --prefix
                  kubectl -n vhhealth describe job vhhealth-backend-migrate
              runbook: "docs/RUNBOOK_ONCALL.md#backendmigrationjobfailed"

protected-mode yes
tcp-backlog 511
timeout 0
tcp-keepalive 300

daemonize no
supervised no
loglevel notice
logfile ""

# Persistence: AOF primary, RDB snapshot as safety net.
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes
save 900 1
save 300 10
save 60 10000

maxmemory 768mb
maxmemory-policy allkeys-lru

repl-diskless-sync yes
repl-diskless-sync-delay 5
repl-timeout 60
replica-read-only yes

# A partitioned former primary must stop accepting writes after it loses every
# replica. Sentinel still owns promotion; this is the data-plane split-brain
# barrier while quorum converges.
min-replicas-to-write 1
min-replicas-max-lag 10

slowlog-log-slower-than 10000
slowlog-max-len 128
latency-monitor-threshold 100

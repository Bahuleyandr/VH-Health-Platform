# redis/redis-sentinel.yaml — Redis 7.4 + Sentinel HA (3 nodes)
#
# Every Redis and Sentinel container start queries the three stable Sentinel
# endpoints and requires two identical master votes. Only a transient, explicit
# REDIS_ALLOW_FIRST_CLUSTER_BOOTSTRAP=true patch may create the first empty
# cluster; the committed manifest is inert. A restarted former primary therefore
# cannot promote itself from its ordinal or stale local config.
#
# Redis AOF persistence plus min-replicas-to-write limits both crash loss and
# split-brain writes. The generated ConfigMap name is content-hashed by Kustomize,
# so a script/config change truthfully changes the StatefulSet pod template.
# Production activation and all-cluster recovery remain manual operator gates;
# this repository does not claim an HA operator or automatic recovery authority.
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: vhhealth-platform
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: vhhealth-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: vhhealth-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
    - name: sentinel
      port: 26379
      targetPort: 26379
  publishNotReadyAddresses: true
---
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel
  namespace: vhhealth-platform
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: vhhealth-redis
    app.kubernetes.io/component: sentinel
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: vhhealth-redis
  ports:
    - name: sentinel
      port: 26379
      targetPort: 26379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-metrics
  namespace: vhhealth-platform
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: vhhealth-redis
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: vhhealth-redis
  ports:
    - name: http-metrics
      port: 9121
      targetPort: 9121
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: vhhealth-platform
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: vhhealth-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
spec:
  serviceName: redis-headless
  replicas: 3
  # All three Sentinel sidecars must be able to form the first quorum before
  # ordinal readiness. Stateful identity and rolling-update order are retained.
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: vhhealth-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: vhhealth-redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: vhhealth
        app.kubernetes.io/managed-by: kustomize
    spec:
      terminationGracePeriodSeconds: 30
      serviceAccountName: redis
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: topology.kubernetes.io/zone
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: vhhealth-redis
            - weight: 50
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: vhhealth-redis
      containers:
        - name: redis
          image: redis:7.4.1-alpine@sha256:c1e88455c85225310bbea54816e9c3f4b5295815e6dbf80c34d40afc6df28275
          imagePullPolicy: IfNotPresent
          # Discovery runs on every container start, not only at pod init. A
          # restarted former primary therefore follows 2-of-3 Sentinel state.
          command: ["/bin/sh", "/config/start-redis.sh"]
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: redis-password
            - name: REDIS_CONTROL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: redis-control-password
            - name: REDIS_METRICS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: redis-metrics-password
            - name: REDIS_SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: sentinel-password
            - name: REDIS_PASSWORD_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: redis-password-previous
                  optional: true
            - name: REDIS_CONTROL_PASSWORD_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: redis-control-password-previous
                  optional: true
            - name: REDIS_METRICS_PASSWORD_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: redis-metrics-password-previous
                  optional: true
            - name: REDIS_SENTINEL_PASSWORD_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: sentinel-password-previous
                  optional: true
            - name: REDIS_ALLOW_FIRST_CLUSTER_BOOTSTRAP
              # Deliberately inert. Set true only in a transient, reviewed
              # first-install patch while every Redis PVC is proven empty;
              # remove it immediately after readiness proves quorum.
              value: "false"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1"
          readinessProbe:
            exec:
              command:
                - /config/redis-readiness.sh
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'REDISCLI_AUTH="$REDIS_CONTROL_PASSWORD" redis-cli --no-auth-warning --user vhhealth-control ping | grep -qx PONG'
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - 'REDISCLI_AUTH="$REDIS_CONTROL_PASSWORD" redis-cli --no-auth-warning --user vhhealth-control ping | grep -qx PONG'
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: rendered-config
              mountPath: /etc/redis
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
        - name: sentinel
          image: redis:7.4.1-alpine@sha256:c1e88455c85225310bbea54816e9c3f4b5295815e6dbf80c34d40afc6df28275
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/config/start-sentinel.sh"]
          ports:
            - name: sentinel
              containerPort: 26379
          env:
            - name: REDIS_CONTROL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: redis-control-password
            - name: REDIS_SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: sentinel-password
            - name: REDIS_SENTINEL_CONTROL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: sentinel-control-password
            - name: REDIS_SENTINEL_PASSWORD_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: sentinel-password-previous
                  optional: true
            - name: REDIS_SENTINEL_CONTROL_PASSWORD_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: sentinel-control-password-previous
                  optional: true
            - name: REDIS_ALLOW_FIRST_CLUSTER_BOOTSTRAP
              value: "false"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            exec:
              command:
                - /config/sentinel-readiness.sh
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'REDISCLI_AUTH="$REDIS_SENTINEL_PASSWORD" redis-cli --no-auth-warning --user vhhealth-discovery -p 26379 ping | grep -qx PONG'
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: rendered-config
              mountPath: /etc/redis
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
        - name: metrics
          image: oliver006/redis_exporter:v1.66.0@sha256:d98e6db8094f491b95791e9f776b0ba30a20aeacb90e18334935d5e51bf2e6a1
          imagePullPolicy: IfNotPresent
          args:
            - --redis.addr=redis://localhost:6379
            - --redis.user=vhhealth-metrics
            - --web.listen-address=0.0.0.0:9121
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: redis-metrics-password
          ports:
            - name: http-metrics
              containerPort: 9121
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /
              port: http-metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http-metrics
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 59000
            runAsGroup: 59000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: config
          configMap:
            name: redis-sentinel-config
            defaultMode: 0755
        - name: rendered-config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: redis
          app.kubernetes.io/instance: vhhealth-redis
          app.kubernetes.io/part-of: vhhealth
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
  namespace: vhhealth-platform
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: vhhealth-redis
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: false
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis
  namespace: vhhealth-platform
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: vhhealth-redis
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: vhhealth-redis
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis
  namespace: vhhealth-platform
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: vhhealth-redis
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
    # kube-prometheus-stack picks this up via release: vhhealth selector.
    release: vhhealth-monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: metrics
  namespaceSelector:
    matchNames:
      - vhhealth-platform
  endpoints:
    - port: http-metrics
      interval: 30s
      scrapeTimeout: 10s
      path: /metrics
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-allow-app-ingress
  namespace: vhhealth-platform
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: vhhealth-redis
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: vhhealth-redis
  policyTypes: [Ingress]
  ingress:
    # Apps (backend, admin) speaking to Redis. Keep this pod-selected so a
    # future tenant/job pod in vhhealth does not inherit cache access.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vhhealth
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vhhealth-backend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vhhealth
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vhhealth-admin
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 26379
    # Intra-cluster sentinel/replication chatter
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: vhhealth-redis
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 26379
    # Harbor (cache/job queue) inside vhhealth-platform
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: harbor
      ports:
        - protocol: TCP
          port: 6379
    # Monitoring namespace scrapes metrics
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vhhealth-monitoring
      ports:
        - protocol: TCP
          port: 9121

# sealed-secrets/sealed-secrets.yaml — Bitnami sealed-secrets controller
#
# The sealed-secrets controller decrypts `SealedSecret` CRs into regular
# `Secret`s in the same namespace. Everything in `*.sealed-secret.yaml`
# files across this repo is encrypted with the public half of the key
# pair owned by the controller below; only the controller can decrypt.
#
# We use the upstream manifest pinned at v0.27.0 as the install source,
# but render our own Deployment here so we can:
#   (a) set `--key-renew-period=720h` (30-day key rotation as per the
#       Bitnami recommendation),
#   (b) pin the controller securityContext to restricted,
#   (c) expose controller metrics on the Service.
#
# The ServiceMonitor is intentionally owned by `base/monitoring`. Keeping that
# CR out of this Kustomization lets the controller bootstrap on a fresh cluster
# before the Prometheus Operator has installed the monitoring.coreos.com CRDs.
#
# Rotation note: the controller generates a new key every 30 days and
# keeps old keys indefinitely for decryption. Existing sealed-secrets
# stay decryptable as long as the private keys are backed up. Back up
# `kubectl -n vhhealth-security get secret -l sealedsecrets.bitnami.com/sealed-secrets-key -o yaml`
# to a secure location (offline S3 bucket or password manager).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sealed-secrets
  namespace: vhhealth-security
  labels:
    app.kubernetes.io/name: sealed-secrets
    app.kubernetes.io/instance: sealed-secrets
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
---
apiVersion: v1
kind: Service
metadata:
  name: sealed-secrets
  namespace: vhhealth-security
  labels:
    app.kubernetes.io/name: sealed-secrets
    app.kubernetes.io/instance: sealed-secrets
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sealed-secrets
    app.kubernetes.io/instance: sealed-secrets
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: http-metrics
      port: 8081
      targetPort: 8081
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sealed-secrets
  labels:
    app.kubernetes.io/name: sealed-secrets
    app.kubernetes.io/instance: sealed-secrets
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, delete, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: ["bitnami.com"]
    resources: [sealedsecrets]
    verbs: [get, list, watch]
  - apiGroups: ["bitnami.com"]
    resources: [sealedsecrets/status]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sealed-secrets
  labels:
    app.kubernetes.io/name: sealed-secrets
    app.kubernetes.io/instance: sealed-secrets
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sealed-secrets
subjects:
  - kind: ServiceAccount
    name: sealed-secrets
    namespace: vhhealth-security
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sealed-secrets
  namespace: vhhealth-security
  labels:
    app.kubernetes.io/name: sealed-secrets
    app.kubernetes.io/instance: sealed-secrets
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sealed-secrets
      app.kubernetes.io/instance: sealed-secrets
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sealed-secrets
        app.kubernetes.io/instance: sealed-secrets
        app.kubernetes.io/component: controller
        app.kubernetes.io/part-of: vhhealth
        app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: sealed-secrets
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sealed-secrets
          image: docker.io/bitnami/sealed-secrets-controller:0.27.3@sha256:76f8c93c9e2e5450f90a416674f62ed9b9638b939561298f3218ed2a1cbe69d1
          imagePullPolicy: IfNotPresent
          command: ["controller"]
          args:
            - --key-renew-period=720h
            - --key-prefix=sealed-secrets-key
            - --log-level=INFO
            - --log-format=json
            - --listen-addr=:8080
            - --listen-metrics-addr=:8081
          ports:
            - name: http
              containerPort: 8080
            - name: http-metrics
              containerPort: 8081
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

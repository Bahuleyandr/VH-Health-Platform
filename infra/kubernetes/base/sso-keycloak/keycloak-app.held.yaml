# HELD: do not add this Application to an overlay until NL-1 SSO has an
# operator-approved deployment window.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-admin-sso-held
  namespace: argocd
  annotations:
    vhhealth.app/deploy-state: "held"
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: admin-sso
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
spec:
  project: vhhealth
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: keycloak
    targetRevision: "25.2.0"
    helm:
      values: |
        global:
          security:
            allowInsecureImages: false
        image:
          registry: quay.io
          repository: keycloak/keycloak
          tag: 26.6.4
        auth:
          adminUser: admin
          existingSecret: keycloak-admin
          passwordSecretKey: admin-password
        production: true
        proxyHeaders: xforwarded
        ingress:
          enabled: true
          ingressClassName: nginx
          hostname: sso.vhhealth.hospital.local
          tls: true
          annotations:
            cert-manager.io/cluster-issuer: step-ca-internal
        postgresql:
          enabled: false
        externalDatabase:
          host: vhhealth-pg-rw.vhhealth-platform.svc.cluster.local
          port: 5432
          database: keycloak
          user: keycloak
          existingSecret: keycloak-database
          existingSecretPasswordKey: password
        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
            labels:
              release: vhhealth-monitoring
        networkPolicy:
          enabled: true
          allowExternal: false
  destination:
    server: https://kubernetes.default.svc
    namespace: vhhealth-platform
  syncPolicy:
    automated: null
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
  revisionHistoryLimit: 3

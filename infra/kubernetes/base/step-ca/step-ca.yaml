# step-ca/step-ca.yaml — Internal Certificate Authority (smallstep/step-ca)
#
# Single-instance CA for issuing certs to LAN-only services (Harbor,
# Grafana, MinIO console, Vault, step-ca ACME). HA for the CA is
# unnecessary in a single-site on-prem deployment — if the CA is
# offline for an hour during maintenance, existing certs keep working
# (cert-manager renews them only when they're close to expiry).
#
# Bootstrap: the CA's root + intermediate keys are generated offline
# (NOT in-cluster) by:
#
#   step ca init \
#     --name "VH Health Internal CA" \
#     --dns "step-ca.vhhealth-security.svc.cluster.local,step-ca.vhhealth.hospital.local" \
#     --address ":443" \
#     --provisioner admin \
#     --remote-management \
#     --deployment-type standalone \
#     --password-file /tmp/ca-pass \
#     --provisioner-password-file /tmp/provisioner-pass
#
# The resulting `~/.step/` directory is bundled into two SealedSecrets:
#   - `step-ca-secrets`: root.crt, intermediate.crt, root.key (encrypted
#      with the CA password), intermediate.key (same).
#   - `step-ca-passwords`: the two password files.
#
# We never rotate the root CA in normal operations — rotating the
# intermediate is an annual runbook task.
#
# ACME provisioner: enabled so cert-manager can request certs via the
# standard ACME protocol. See base/cert-manager/cert-manager.yaml.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: step-ca
  namespace: vhhealth-security
  labels:
    app.kubernetes.io/name: step-ca
    app.kubernetes.io/instance: step-ca
    app.kubernetes.io/component: internal-ca
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: step-ca
  namespace: vhhealth-security
  labels:
    app.kubernetes.io/name: step-ca
    app.kubernetes.io/instance: step-ca
    app.kubernetes.io/component: internal-ca
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: step-ca
    app.kubernetes.io/instance: step-ca
  ports:
    - name: https
      port: 443
      targetPort: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: step-ca
  namespace: vhhealth-security
  labels:
    app.kubernetes.io/name: step-ca
    app.kubernetes.io/instance: step-ca
    app.kubernetes.io/component: internal-ca
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
spec:
  serviceName: step-ca
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: step-ca
      app.kubernetes.io/instance: step-ca
  template:
    metadata:
      labels:
        app.kubernetes.io/name: step-ca
        app.kubernetes.io/instance: step-ca
        app.kubernetes.io/component: internal-ca
        app.kubernetes.io/part-of: vhhealth
        app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: step-ca
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: step-ca
          image: smallstep/step-ca:0.28.1@sha256:a8308bddba866f5fccb2740c8bb2e5dea8cdde4b5856058539a7f5170894a9c0
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/step-ca"]
          args:
            - "--password-file=/home/step/secrets/password"
            - "/home/step/config/ca.json"
          ports:
            - name: https
              containerPort: 9000
          env:
            - name: STEPDEBUG
              value: "0"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: https
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /health
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /home/step
            - name: config
              mountPath: /home/step/config
              readOnly: true
            - name: secrets
              mountPath: /home/step/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: step-ca-config
        - name: secrets
          secret:
            secretName: step-ca-passwords
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: step-ca
          app.kubernetes.io/part-of: vhhealth
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: step-ca
  namespace: vhhealth-security
  labels:
    app.kubernetes.io/name: step-ca
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
spec:
  # Single-replica CA; a 0-disruption PDB prevents accidental drains
  # from taking the CA offline. Manual maintenance is coordinated.
  maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: step-ca
      app.kubernetes.io/instance: step-ca
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: step-ca-allow-issuance
  namespace: vhhealth-security
  labels:
    app.kubernetes.io/name: step-ca
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: step-ca
  policyTypes: [Ingress]
  ingress:
    # All namespaces can request certs (cert-manager in any namespace
    # can target this as a ClusterIssuer)
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 9000

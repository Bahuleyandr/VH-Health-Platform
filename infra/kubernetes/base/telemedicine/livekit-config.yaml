apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
  namespace: vhhealth-telemedicine
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    vhhealth.app/deploy-state: held
  labels:
    app.kubernetes.io/name: livekit
    app.kubernetes.io/component: teleconsult-media
    app.kubernetes.io/part-of: vhhealth
data:
  livekit.yaml: |
    # NL-3 P1: self-hosted LiveKit inside hospital-controlled infra.
    # Recording/Egress is intentionally absent. API keys and Redis password are
    # supplied by livekit-secret via env so this ConfigMap carries no secrets.
    port: 7880
    bind_addresses:
      - "0.0.0.0"
    log_level: info
    prometheus_port: 6789

    rtc:
      tcp_port: 7881
      port_range_start: 50000
      port_range_end: 50100
      use_external_ip: true

    redis:
      sentinel_master_name: vhhealth-primary
      sentinel_addresses:
        - redis-sentinel.vhhealth-platform.svc.cluster.local:26379

    turn:
      enabled: true
      domain: turn.teleconsult.vhhealth.app
      udp_port: 3478
      tls_port: 5349
      cert_file: /etc/livekit/turn/tls.crt
      key_file: /etc/livekit/turn/tls.key

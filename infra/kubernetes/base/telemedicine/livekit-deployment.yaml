apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: vhhealth-telemedicine
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    vhhealth.app/deploy-state: held
    vhhealth.app/activation-gate: "hospital L4 media edge, embedded TURN ports, and manual smoke required"
  labels:
    app.kubernetes.io/name: livekit
    app.kubernetes.io/component: teleconsult-media
    app.kubernetes.io/part-of: vhhealth
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: livekit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: livekit
        app.kubernetes.io/component: teleconsult-media
        app.kubernetes.io/part-of: vhhealth
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "6789"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: livekit
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: livekit
          image: livekit/livekit-server:v1.8.0
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/livekit/livekit.yaml
          env:
            - name: LIVEKIT_KEYS
              valueFrom:
                secretKeyRef:
                  name: livekit-secret
                  key: LIVEKIT_KEYS
            - name: LIVEKIT_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: livekit-secret
                  key: LIVEKIT_REDIS_PASSWORD
          ports:
            - name: http
              containerPort: 7880
              protocol: TCP
            - name: rtc-tcp
              containerPort: 7881
              protocol: TCP
            - name: turn-udp
              containerPort: 3478
              protocol: UDP
            - name: turn-tls
              containerPort: 5349
              protocol: TCP
            - name: metrics
              containerPort: 6789
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/livekit
              readOnly: true
            - name: turn-tls
              mountPath: /etc/livekit/turn
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: livekit-config
        - name: turn-tls
          secret:
            secretName: livekit-secret
            items:
              - key: turn-tls.crt
                path: tls.crt
              - key: turn-tls.key
                path: tls.key
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: livekit
  namespace: vhhealth-telemedicine
  labels:
    app.kubernetes.io/name: livekit
    app.kubernetes.io/component: teleconsult-media
    app.kubernetes.io/part-of: vhhealth

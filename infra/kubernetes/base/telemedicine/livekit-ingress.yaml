apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: livekit-signaling
  namespace: vhhealth-telemedicine
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/enable-cors: "false"
    vhhealth.app/deploy-state: held
    vhhealth.app/media-boundary: "signaling-only; Cloudflare Tunnel must not carry WebRTC media"
  labels:
    app.kubernetes.io/name: livekit
    app.kubernetes.io/component: teleconsult-signaling
    app.kubernetes.io/part-of: vhhealth
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - teleconsult.vhhealth.app
      secretName: livekit-signaling-tls
  rules:
    - host: teleconsult.vhhealth.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: livekit-signaling
                port:
                  number: 80

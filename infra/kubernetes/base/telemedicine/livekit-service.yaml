apiVersion: v1
kind: Service
metadata:
  name: livekit-signaling
  namespace: vhhealth-telemedicine
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    vhhealth.app/deploy-state: held
  labels:
    app.kubernetes.io/name: livekit
    app.kubernetes.io/component: teleconsult-media
    app.kubernetes.io/part-of: vhhealth
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: livekit
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
    - name: metrics
      protocol: TCP
      port: 6789
      targetPort: metrics

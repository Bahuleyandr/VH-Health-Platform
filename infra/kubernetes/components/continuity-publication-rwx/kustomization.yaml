apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# HELD: no active overlay includes this component. An operator may select it
# only after the H1 RWX storage receipts and C1.2 placement gate are approved.
# The PVC is pre-created; this component never selects a StorageClass or
# provisions storage.
patches:
  - path: backend-reader-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: vhhealth-backend
  - path: downtime-writer-patch.yaml
    target:
      group: batch
      version: v1
      kind: CronJob
      name: ward-downtime-packs

# Ollama as a single-replica StatefulSet so the model PVC + the
# pod identity stay stable across rollouts. Backed by ollama/ollama
# upstream image; no custom build.
#
# A note on replica count: Ollama is stateful per pod (the model
# weights live in /root/.ollama/models). Scaling out requires either
# a model-aware proxy (vllm-router, litellm-proxy) or per-pod model
# preload — neither is in scope here. For one hospital running 4-12
# clinical-AI deep-tier requests per minute, one pod is enough.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/component: deep-tier-llm
    app.kubernetes.io/part-of: vhhealth
spec:
  serviceName: ollama-internal
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
        app.kubernetes.io/component: deep-tier-llm
        app.kubernetes.io/part-of: vhhealth
    spec:
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext:
        # INF-11: run as non-root. An initContainer chowns the model PVC
        # to UID 1000 so Ollama can write the model cache as a regular user.
        # OLLAMA_MODELS is redirected to /ollama/models (owned by UID 1000)
        # instead of the upstream default /root/.ollama.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Scheduled onto a GPU node. The ollama image links against
      # the bundled GPU runtime; pinning here prevents the pod from
      # landing on a CPU-only node where it would fall back to slow
      # CPU inference and silently degrade clinician latency.
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      # INF-11: initContainer runs as root (only) to chown the model
      # PVC mount to UID 1000 (the Ollama process user). This is the
      # minimum-privilege approach: root access is scoped to the init
      # phase only, the main container never runs as root, and the
      # PVC directory is owned by the app user before Ollama starts.
      initContainers:
        - name: model-dir-init
          image: docker.io/library/busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              chown -R 1000:1000 /ollama/models
              echo "Model directory ownership set to 1000:1000"
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE]
          volumeMounts:
            - name: models
              mountPath: /ollama/models
      containers:
        - name: ollama
          image: docker.io/ollama/ollama:0.5.4@sha256:18bfb1d605604fd53dcad20d0556df4c781e560ebebcd923454d627c994a0e37
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 11434
              protocol: TCP
          env:
            # Bind to all interfaces inside the pod (default is
            # localhost-only).
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            # INF-11: redirect model storage away from /root/.ollama
            # (which requires root ownership) to /ollama/models, which
            # the initContainer chowned to UID 1000.
            - name: OLLAMA_MODELS
              value: "/ollama/models"
            # HOME must also point away from /root since the container
            # user (UID 1000) cannot write there.
            - name: HOME
              value: "/ollama"
            # Pre-warm + keep models in GPU memory between requests
            # so the first call after idle isn't a cold-load.
            - name: OLLAMA_KEEP_ALIVE
              value: "30m"
            # One concurrent request per model. Ollama serializes
            # generation per model anyway; setting this explicitly
            # makes the queue depth visible in logs.
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            # Cap the number of distinct loaded models — the deep
            # tier currently uses one. Loading a second large model
            # would OOM the GPU.
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
              # Reserve one GPU. Hospital cluster operator must have
              # the nvidia-device-plugin DaemonSet installed for this
              # to schedule.
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: "16Gi"
              nvidia.com/gpu: "1"
          securityContext:
            # INF-11 hardening: readOnlyRootFilesystem added (WS5 B5.4).
            # Ollama writes model cache to /ollama/models (PVC-backed) and
            # process temp state to /ollama (emptyDir). The root filesystem
            # itself is read-only. If Ollama writes anything else to rootfs
            # at runtime, add a named emptyDir volumeMount for that path.
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: models
              mountPath: /ollama/models
            # HOME for the ollama process (writable temp state).
            - name: ollama-home
              mountPath: /ollama
            # tmp for short-lived inference scratch.
            - name: tmp
              mountPath: /tmp
          # Generous start delay — pulling a 70B model on first run
          # takes 5-15 minutes. Once the PVC has the model cached,
          # subsequent pod restarts come up in ~30s.
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
        # INF-11: writable home dir for the non-root ollama process.
        # Small — only holds Ollama's process-level temp state (locks,
        # sockets). Models live on the PVC at /ollama/models.
        - name: ollama-home
          emptyDir:
            sizeLimit: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: models
        labels:
          app.kubernetes.io/name: ollama
          app.kubernetes.io/component: deep-tier-llm
          app.kubernetes.io/part-of: vhhealth
      spec:
        accessModes: ["ReadWriteOnce"]
        # 100 GB headroom for one or two large models. Llama-3-70B at
        # Q4_K_M is ~38 GB; Qwen2.5-72B Q4 is ~40 GB; smaller models
        # like Mistral-7B fit comfortably in <10 GB. Overlays can
        # patch this size based on the hospital's storage class.
        resources:
          requests:
            storage: 100Gi

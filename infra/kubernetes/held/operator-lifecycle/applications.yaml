# INF-010 operator lifecycle Applications.
#
# HELD: this file is not composed into base/argocd/applications, base, or any
# overlay. Applying it only creates manual-sync Argo CD Applications; it does
# not install an operator. Each Application source, chart archive, and runtime
# image is pinned by scripts/operator-lifecycle-preflight.mjs. Activation still
# requires the operator-owned sequence in docs/OPERATOR_LIFECYCLE.md.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vhhealth-cert-manager-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: vhhealth
    app.kubernetes.io/component: operator-lifecycle
    vhhealth.app/deploy-state: held
  annotations:
    vhhealth.app/chart-sha256: e6bf08ee8834e6a727e38991978607ea9b729825150a20d7d10be1eb284106e6
spec:
  project: vhhealth
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.16.1
    helm:
      releaseName: cert-manager
      values: |
        crds:
          enabled: true
        image:
          repository: quay.io/jetstack/cert-manager-controller
          tag: v1.16.1
          digest: sha256:ae5e14401cde4dec8bccce7594f829cd491044aa66944272e1d4fccc941ec77c
        webhook:
          image:
            repository: quay.io/jetstack/cert-manager-webhook
            tag: v1.16.1
            digest: sha256:6edf44244b2a711be737c4ab8e54e68d9112cc4e87da2ef97a7f76b768f4fde7
        cainjector:
          image:
            repository: quay.io/jetstack/cert-manager-cainjector
            tag: v1.16.1
            digest: sha256:3c49185718cf454bac559f71c4453b33f1086db48084604247d9acb7a4de2973
        acmesolver:
          image:
            repository: quay.io/jetstack/cert-manager-acmesolver
            tag: v1.16.1
            digest: sha256:14304826ab1a1184e185f952ef7e0bf8e620568b5c17939179efe6f4c6049d8e
        startupapicheck:
          image:
            repository: quay.io/jetstack/cert-manager-startupapicheck
            tag: v1.16.1
            digest: sha256:b4a5e42f6dbfb0d7dbb9366b4cb437a59a7616f6c5e67c76fa3641cadbe0c958
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
  revisionHistoryLimit: 5
---

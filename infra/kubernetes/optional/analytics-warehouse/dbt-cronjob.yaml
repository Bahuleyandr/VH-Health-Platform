# Nightly dbt build (models + tests) against the warehouse.
# 21:30 UTC = 03:00 IST — after the OLTP daily backup window, before the
# morning OPD rush reads dashboards.
#
# The dbt project ships as ConfigMaps generated by kustomization.yaml from
# analytics/dbt/ in this repo — the cluster has no internet egress, so no
# git clone and no dbt package downloads (the project uses none).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vh-warehouse-dbt
  namespace: vhhealth-platform
  labels:
    app.kubernetes.io/name: vh-warehouse-dbt
    app.kubernetes.io/component: analytics-warehouse
    app.kubernetes.io/part-of: vhhealth
spec:
  schedule: "30 21 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dbt
              image: ghcr.io/dbt-labs/dbt-postgres:1.9.latest
              command: ["/bin/sh", "-ceu"]
              args:
                - |
                  # ConfigMap mounts are read-only; dbt needs a writable
                  # project dir for target/ + logs/.
                  cp -rL /dbt-src /work
                  cd /work
                  dbt build --profiles-dir profiles --no-use-colors
              env:
                - name: DBT_PG_HOST
                  value: "vhhealth-warehouse-rw"
                - name: DBT_PG_PORT
                  value: "5432"
                - name: DBT_PG_DBNAME
                  value: "vhhealth"
                - name: DBT_PG_SCHEMA
                  value: "analytics"
                - name: DBT_PG_USER
                  valueFrom:
                    secretKeyRef: { name: vh-dbt-credentials, key: username }
                - name: DBT_PG_PASSWORD
                  valueFrom:
                    secretKeyRef: { name: vh-dbt-credentials, key: password }
              resources:
                requests: { cpu: "250m", memory: "512Mi" }
                limits: { cpu: "2", memory: "2Gi" }
              volumeMounts:
                - { name: work, mountPath: /work }
                - { name: dbt-project, mountPath: /dbt-src/dbt_project.yml, subPath: dbt_project.yml }
                - { name: dbt-profiles, mountPath: /dbt-src/profiles }
                - { name: dbt-macros, mountPath: /dbt-src/macros }
                - { name: dbt-models, mountPath: /dbt-src/models }
                - { name: dbt-models-staging, mountPath: /dbt-src/models/staging }
                - { name: dbt-models-dims, mountPath: /dbt-src/models/dims }
                - { name: dbt-models-facts, mountPath: /dbt-src/models/facts }
                - { name: dbt-models-marts, mountPath: /dbt-src/models/marts }
                - { name: dbt-tests, mountPath: /dbt-src/tests }
          volumes:
            - name: work
              emptyDir: { sizeLimit: 512Mi }
            - name: dbt-project
              configMap: { name: vh-dbt-project-root }
            - name: dbt-profiles
              configMap: { name: vh-dbt-profiles }
            - name: dbt-macros
              configMap: { name: vh-dbt-macros }
            - name: dbt-models
              configMap: { name: vh-dbt-models }
            - name: dbt-models-staging
              configMap: { name: vh-dbt-models-staging }
            - name: dbt-models-dims
              configMap: { name: vh-dbt-models-dims }
            - name: dbt-models-facts
              configMap: { name: vh-dbt-models-facts }
            - name: dbt-models-marts
              configMap: { name: vh-dbt-models-marts }
            - name: dbt-tests
              configMap: { name: vh-dbt-tests }

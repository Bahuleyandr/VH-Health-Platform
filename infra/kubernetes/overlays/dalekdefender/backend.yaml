# Backend deployment for Dalekdefender.
# Image is built on the host (`docker build` then `k3s ctr images import`)
# and tagged `vhhealth-backend:dev`. imagePullPolicy: IfNotPresent keeps
# k3s from trying to fetch the tag from a registry that doesn't host it.
apiVersion: v1
kind: Service
metadata:
  name: vhhealth-backend
  namespace: vhhealth
  labels:
    app.kubernetes.io/name: vhhealth-backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vhhealth-backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vhhealth-backend
  namespace: vhhealth
  labels:
    app.kubernetes.io/name: vhhealth-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vhhealth-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vhhealth-backend
    spec:
      # Audit finding M17: this internet-reachable (Tailscale) pod ran with
      # NO securityContext. Restricted-profile settings, matching the prod
      # deployment posture.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: vhhealth-backend:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          # Cluster.js spawns workers; for single-node dev a single worker
          # is plenty and avoids fighting the kube probe scheduler.
          command: ["node", "src/bin/www.js"]
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - secretRef:
                name: vhhealth-backend
          env:
            - name: NODE_ENV
              value: production
            # The production route graph exceeds Node's cgroup-derived
            # default old-space ceiling during startup on this test rig.
            - name: NODE_OPTIONS
              value: --max-old-space-size=768
            - name: TENANT_BASE_HOST
              value: vhhealth.app
            # Specialty department gate ENFORCED on the rig: seeded staff carry
            # clean departments, so the fail-closed mode is safe here and lets
            # testers see the gate for real. Production overlays keep the
            # 'report' default until their department data is cleaned up and
            # the mismatch ledger reviewed (2026-08-22 audit rollout plan).
            - name: SPECIALTY_DEPARTMENT_GATE_MODE
              value: enforce
            - name: PORT
              value: "5000"
            # DalekDefender's bootstrap DB role is a superuser so it can run
            # local migrations, which would otherwise bypass Postgres RLS.
            # Request-scoped tenant transactions SET LOCAL ROLE to this
            # non-bypass role before applying app.current_tenant_id.
            # Canonical name (prisma.js tenantRlsRuntimeRole). Until 2026-09-08
            # this was the legacy alias AUTH_TENANT_RLS_TEST_ROLE, which the
            # resolver honours identically, so the rename changes nothing at
            # runtime; it makes the Deployment, migration-job.yaml and the base
            # ConfigMap agree on one name for the one role.
            - name: AUTH_TENANT_RLS_RUNTIME_ROLE
              value: vhhealth_app
            - name: PATHWAY_PROJECTOR_SHADOW_ENABLED
              value: "true"
            - name: CARE_PATHWAY_RECONCILIATION_ENABLED
              value: "true"
            - name: CARE_PATHWAY_RECONCILIATION_REPAIR_ENABLED
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vhhealth-backend
                  key: DATABASE_URL
          # `/` is a DB-backed probe: it runs a real `SELECT 1` through the
          # Prisma pool (app.js → utils/probeDb.js). timeoutSeconds and
          # failureThreshold were previously unset, so the kubelet applied its
          # own defaults of 1 s and 3 — a budget shorter than a single slow
          # query. On 2026-09-09 06:40Z a boot-time scheduled-job storm pushed
          # `SELECT 1` past 1 s, three consecutive probes failed inside 20 s,
          # the pod went NotReady and a healthy deploy was rolled back.
          # Both values are now explicit: 5 s of patience per probe and 6
          # consecutive failures (~60 s at periodSeconds 10) before NotReady.
          readinessProbe:
            httpGet:
              path: /
              port: 5000
              # Backend redirects HTTP→HTTPS when NODE_ENV=production unless
              # x-forwarded-proto says https. Tailscale serve (the public
              # entrypoint) sets it correctly; the kubelet probe doesn't,
              # so we set it manually to avoid a probe-loop.
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 5000
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi

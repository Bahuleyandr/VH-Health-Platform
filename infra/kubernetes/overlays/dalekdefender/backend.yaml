# Backend deployment for Dalekdefender.
# Image is built on the host (`docker build` then `k3s ctr images import`)
# and tagged `vhhealth-backend:dev`. imagePullPolicy: IfNotPresent keeps
# k3s from trying to fetch the tag from a registry that doesn't host it.
apiVersion: v1
kind: Service
metadata:
  name: vhhealth-backend
  namespace: vhhealth
  labels:
    app.kubernetes.io/name: vhhealth-backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vhhealth-backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vhhealth-backend
  namespace: vhhealth
  labels:
    app.kubernetes.io/name: vhhealth-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vhhealth-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vhhealth-backend
    spec:
      # Audit finding M17: this internet-reachable (Tailscale) pod ran with
      # NO securityContext. Restricted-profile settings, matching the prod
      # deployment posture.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: vhhealth-backend:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          # Cluster.js spawns workers; for single-node dev a single worker
          # is plenty and avoids fighting the kube probe scheduler.
          command: ["node", "src/bin/www.js"]
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - secretRef:
                name: vhhealth-backend
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "5000"
            # DalekDefender's bootstrap DB role is a superuser so it can run
            # local migrations, which would otherwise bypass Postgres RLS.
            # Request-scoped tenant transactions SET LOCAL ROLE to this
            # non-bypass role before applying app.current_tenant_id.
            - name: AUTH_TENANT_RLS_TEST_ROLE
              value: vhhealth_app
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vhhealth-backend
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /
              port: 5000
              # Backend redirects HTTP→HTTPS when NODE_ENV=production unless
              # x-forwarded-proto says https. Tailscale serve (the public
              # entrypoint) sets it correctly; the kubelet probe doesn't,
              # so we set it manually to avoid a probe-loop.
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5000
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi

# overlays/dev/kustomization.yaml — dev cluster
#
# Dev is deliberately thinner:
#   - Single-replica CNPG (no HA).
#   - No MinIO (use external R2 directly from dev backend).
#   - No Harbor (push from local docker build or ghcr.io).
#   - Single ingress-nginx replica (dev cluster has 1 node).
#   - No Falco, no Kured (we reboot dev manually; runtime security
#     traces add noise without value).
#   - Prometheus retention shortened to 7d.
#   - No Longhorn (use local-path in dev — Longhorn prereqs are heavy).
#
# We inherit the base via a filtered `resources:` that excludes the
# services we're dropping. Instead of trying to unload resources from
# the base (kustomize has no "exclude" primitive), we list the keeper
# subdirs individually.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: vhhealth-platform-dev
resources:
  - ../../base/_common
  - ../../base/sealed-secrets
  - ../../base/cert-manager
  - ../../base/step-ca
  - ../../base/cnpg
  - ../../base/redis
  - ../../base/ingress-nginx
  - ../../base/cloudflare-tunnel
  - ../../base/monitoring
  - ../../base/argocd
patches:
  # CNPG: 1 instance (primary only, no HA). minSyncReplicas must be 0
  # or the cluster won't accept writes.
  #
  # imageName + serverName (audit 2026-08-13, P1 follow-up). The base carries
  # the PRODUCTION hold: an all-zero, deliberately unpullable digest, because
  # the exact qualified PostgreSQL 17 minor and digest for the live clinical
  # database are operator evidence this repository does not hold, and because a
  # major-version bump on that cluster is an irreversible pg_upgrade. Neither
  # rationale applies here — dev has no clinical data and no conversion risk —
  # so inheriting the hold only meant "dev can bring up no database at all".
  # Dev therefore pins the real, publicly resolvable digest for the documented
  # secure floor tag 17.10-standard-bookworm:
  #   ghcr.io/cloudnative-pg/postgresql:17.10-standard-bookworm
  #   -> sha256:f94c0eea2a7e9d40880adebd27a912d8473d5805a99c4dbc6eb6244ad9770620
  #      (multi-arch OCI index: linux/amd64 + linux/arm64; re-verified on every
  #      run by scripts/check-prod-digests-pinned.mjs, which now renders this
  #      overlay too).
  #
  # The archive identity moves with the image generation (see cluster.yaml) AND
  # must not be a production identity: dev shares the R2 bucket + destination
  # prefix declared by ObjectStore/vhhealth-pg18-producer, so the `serverName`
  # is the ONLY thing keeping dev WAL out of the production archive. It is
  # neither `vhhealth-pg` (production PG17) nor `vhhealth-pg18` (production
  # PG18); the daily verifier CronJob below is repointed to match.
  - target:
      kind: Cluster
      name: vhhealth-pg
      group: postgresql.cnpg.io
    patch: |-
      - op: replace
        path: /spec/imageName
        value: ghcr.io/cloudnative-pg/postgresql:17.10-standard-bookworm@sha256:f94c0eea2a7e9d40880adebd27a912d8473d5805a99c4dbc6eb6244ad9770620
      - op: replace
        path: /spec/plugins/0/parameters/serverName
        value: vhhealth-pg-dev
      - op: replace
        path: /spec/instances
        value: 1
      - op: replace
        path: /spec/minSyncReplicas
        value: 0
      - op: replace
        path: /spec/maxSyncReplicas
        value: 0
      - op: replace
        path: /spec/storage/size
        value: 20Gi
      - op: replace
        path: /spec/walStorage/size
        value: 5Gi
      - op: replace
        path: /spec/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/resources/requests/cpu
        value: "200m"
      - op: replace
        path: /spec/resources/limits/memory
        value: "1Gi"
      - op: replace
        path: /spec/resources/limits/cpu
        value: "500m"

  # The daily backup verifier reads the prefix the Cluster writes, so its
  # archive identity must equal the Cluster's. Enforced by
  # scripts/check-c1-1-manifest-contract.mjs for every rendered overlay.
  - target:
      kind: CronJob
      name: cnpg-backup-verify
      namespace: vhhealth-platform
    patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: cnpg-backup-verify
        namespace: vhhealth-platform
      spec:
        jobTemplate:
          spec:
            template:
              spec:
                containers:
                  - name: verify
                    env:
                      - name: BARMAN_SERVER_NAME
                        value: "vhhealth-pg-dev"

  # Pooler: 1 replica
  - target:
      kind: Pooler
      name: vhhealth-pg-rw-pooler
      group: postgresql.cnpg.io
    patch: |-
      - op: replace
        path: /spec/instances
        value: 1

  # Redis: 1 replica (no sentinel HA, but keep the sentinel binary up
  # for interface compatibility with the backend's client).
  - target:
      kind: StatefulSet
      name: redis
      namespace: vhhealth-platform
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  # Cloudflared: 1 replica
  - target:
      kind: Deployment
      name: cloudflared
      namespace: vhhealth-ingress
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  # Vault: not installed in dev
  # (already excluded via the resources list above)

  # PDBs: drop MinAvailable to 0 so single-replica services can roll.
  - target:
      kind: PodDisruptionBudget
      name: redis
      namespace: vhhealth-platform
    patch: |-
      - op: replace
        path: /spec/maxUnavailable
        value: 1

configMapGenerator:
  - name: vhhealth-env
    namespace: vhhealth-platform
    literals:
      - ENVIRONMENT=development
      - LOG_LEVEL=debug
      - INGRESS_PUBLIC_HOST=api.dev.vhhealth.app
      - INGRESS_ADMIN_HOST=admin.dev.vhhealth.app
      - DB_HOST=vhhealth-pg-rw.vhhealth-platform.svc.cluster.local
      - REDIS_SENTINEL_HOST=redis-sentinel.vhhealth-platform.svc.cluster.local
      - PROMETHEUS_RETENTION=7d

commonAnnotations:
  vhhealth.app/environment: "development"
  vhhealth.app/data-residency: "in"

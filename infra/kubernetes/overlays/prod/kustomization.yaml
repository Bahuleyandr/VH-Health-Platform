# overlays/prod/kustomization.yaml — production
#
# Prod takes the base as-is (3-replica everything, full backups, strict
# PDBs) and layers on:
#   - prod-specific ConfigMap (env=prod, log level=info, specific ingress
#     hosts).
#   - Resource overrides for highest-traffic services (slightly larger
#     requests/limits than the base defaults).
#   - No Helm chart rendering — Argo CD takes care of Harbor, Falco, and
#     Argo CD itself as their own Applications. Monitoring (kube-prometheus-
#     stack + loki-stack) is deployed via the ArgoCD Applications in
#     base/argocd/applications/monitoring.yaml (multi-source: git for values,
#     Helm chart repos for the charts). Values live in base/monitoring/*.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: vhhealth-platform-prod
resources:
  - ../../base
  - resource-governance.yaml

# NOTE (audit finding H11): the app-tier Deployments (backend / admin /
# staff-web) are NOT part of this overlay — ArgoCD syncs them from
# `infra/kubernetes/apps/` as a separate Application. The digest-pin
# `images:` block therefore lives in infra/kubernetes/apps/kustomization.yaml
# (written by scripts/update-prod-digests.mjs via release-pin-digests.yml).

patches:
  # ── INF-5 / B2.6: Longhorn PVC migration ──────────────────────────────────
  # Switches stateful PVCs from local-path → longhorn (3-replica block storage).
  # OPERATOR-GATED: do NOT activate until the Longhorn operator pre-install
  # checklist in base/longhorn/longhorn-app.yaml is complete AND all
  # StatefulSet data-move procedures have been executed per
  # longhorn-pvc-patch.yaml's header comment. Each service requires a
  # maintenance window. Activate by un-commenting the line below.
  # - longhorn-pvc-patch.yaml

  # ── INF-6 / B2.7: Vault Transit auto-unseal ──────────────────────────────
  # OPERATOR-GATED: un-comment BOTH lines below only after completing the
  # vault-bootstrap initialization sequence in VAULT_SECRET_ROTATION_RUNBOOK.md.
  # Applying prematurely will cause the prod Vault ConfigMap to reference a
  # Transit token that doesn't exist yet — Vault will fail to start.
  # - vault-autounseal-config-patch.yaml
  # - vault-autounseal-patch.yaml

  # ── Prod sizing ────────────────────────────────────────────────────────────
  # Prod sizing: 2 CPU requested on Postgres (vs base's 1) — we run hot.
  - target:
      kind: Cluster
      name: vhhealth-pg
      group: postgresql.cnpg.io
    patch: |-
      - op: replace
        path: /spec/resources/requests/cpu
        value: "2"
      - op: replace
        path: /spec/resources/requests/memory
        value: "4Gi"
      - op: replace
        path: /spec/resources/limits/cpu
        value: "4"
      - op: replace
        path: /spec/resources/limits/memory
        value: "8Gi"
      - op: replace
        path: /spec/postgresql/parameters/shared_buffers
        value: "2GB"
      - op: replace
        path: /spec/postgresql/parameters/effective_cache_size
        value: "6GB"

  # Cloudflared replicas bumped to 4 (one per zone + 1 spare).
  - target:
      kind: Deployment
      name: cloudflared
      namespace: vhhealth-ingress
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 4

configMapGenerator:
  - name: vhhealth-env
    namespace: vhhealth-platform
    literals:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - INGRESS_PUBLIC_HOST=api.vhhealth.app
      - INGRESS_ADMIN_HOST=admin.vhhealth.app
      - DB_HOST=vhhealth-pg-rw.vhhealth-platform.svc.cluster.local
      - DB_POOLER_HOST=vhhealth-pg-rw-pooler.vhhealth-platform.svc.cluster.local
      - REDIS_SENTINEL_HOST=redis-sentinel.vhhealth-platform.svc.cluster.local
      - MINIO_ENDPOINT=minio-api.vhhealth-platform.svc.cluster.local
      - R2_ENDPOINT=https://dbe488236c64499a3dfc797a750c912d.r2.cloudflarestorage.com

replacements:
  # Argo CD renders plain Kustomize: source the confirmed non-secret endpoint
  # from vhhealth-env instead of assuming envsubst, SOPS, or a CMP.
  - source:
      kind: ConfigMap
      name: vhhealth-env
      namespace: vhhealth-platform
      fieldPath: data.R2_ENDPOINT
    targets:
      - select:
          group: barmancloud.cnpg.io
          version: v1
          kind: ObjectStore
          name: vhhealth-pg18-producer
          namespace: vhhealth-platform
        fieldPaths:
          - spec.configuration.endpointURL
      - select:
          group: batch
          version: v1
          kind: CronJob
          name: cnpg-backup-verify
          namespace: vhhealth-platform
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.containers.[name=verify].env.[name=R2_ENDPOINT].value
      - select:
          group: batch
          version: v1
          kind: CronJob
          name: cnpg-scheduled-restore-proof
          namespace: vhhealth-restore-proof
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.containers.[name=prove-restore].env.[name=R2_ENDPOINT].value

commonAnnotations:
  vhhealth.app/environment: "production"
  vhhealth.app/data-residency: "in"

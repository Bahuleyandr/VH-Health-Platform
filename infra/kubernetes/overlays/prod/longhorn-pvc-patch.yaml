# overlays/prod/longhorn-pvc-patch.yaml — held placement candidate
#
# This file is intentionally NOT referenced by the production kustomization.
# C1.2 selects no storage migration. The current CNPG data/WAL placement is
# local-path and its durability contract is PostgreSQL streaming replication.
# `longhorn` is the repository StorageClass name; no alternate class name is
# defined. Longhorn's three replicas are three node copies, not proof of
# separate rack, power, network, PDU, UPS, or switch failure domains.
#
# The blocks below only preserve the candidate manifests for a later,
# service-by-service decision. Before any block is activated, the operator must
# complete docs/C1_2_STORAGE_PLACEMENT_GATE.md, qualify the exact Longhorn
# version, quantify write amplification, prove backup and disposable restore,
# and approve a service-specific execution and abort plan. Longhorn upgrades
# advance one minor at a time; downgrade is not an accepted rollback.
#
# PLACEMENT TRADEOFFS TO QUALIFY:
# ┌─────────────────┬────────────────────────────────────────────────────────┐
# │ Service         │ Tradeoff note                                          │
# ├─────────────────┼────────────────────────────────────────────────────────┤
# │ CNPG (Postgres) │ PG already replicates at the app layer (3-instance     │
# │                 │ synchronous-standby cluster). Adding Longhorn replica=3 │
# │                 │ gives storage-layer HA on top. Write amplification:     │
# │                 │ each write goes to 3 PG nodes AND is mirrored 3× by    │
# │                 │ Longhorn per node = ~9× total I/Os in the worst case.  │
# │                 │ This must be measured before a placement is selected.  │
# │                 │ Monitor: Longhorn volume IOPS + Postgres replication    │
# │                 │ lag; owner thresholds are required by the gate.        │
# ├─────────────────┼────────────────────────────────────────────────────────┤
# │ Redis           │ AOF and storage placement have an owner-defined RPO.    │
# │                 │ Measure replay, loss, latency, and failure behavior.    │
# ├─────────────────┼────────────────────────────────────────────────────────┤
# │ Vault           │ Raft requires durable storage. Prove node/disk-loss,    │
# │                 │ quorum, recovery, and latency behavior before selection.│
# ├─────────────────┼────────────────────────────────────────────────────────┤
# │ MinIO           │ MinIO erasure coding plus Longhorn replication would    │
# │                 │ duplicate writes and capacity. Quantify both candidate  │
# │                 │ layouts; C1.2 selects neither StorageClass.             │
# ├─────────────────┼────────────────────────────────────────────────────────┤
# │ Harbor          │ Image blobs in MinIO (S3). Harbor's own PVCs (registry │
# │                 │ jobLog, trivy) are large but non-clinical. Replicated.  │
# ├─────────────────┼────────────────────────────────────────────────────────┤
# │ step-ca         │ CA state needs an owner-approved durability and restore │
# │                 │ result; the offline key remains outside the PVC.        │
# └─────────────────┴────────────────────────────────────────────────────────┘

# ── CNPG data PVC ───────────────────────────────────────────────────────────
- target:
    kind: Cluster
    name: vhhealth-pg
    group: postgresql.cnpg.io
    namespace: vhhealth-platform
  patch: |-
    - op: replace
      path: /spec/storage/storageClass
      value: longhorn
    - op: replace
      path: /spec/walStorage/storageClass
      value: longhorn

# ── Redis data PVC ───────────────────────────────────────────────────────────
- target:
    kind: StatefulSet
    name: redis
    namespace: vhhealth-platform
  patch: |-
    - op: replace
      path: /spec/volumeClaimTemplates/0/spec/storageClassName
      value: longhorn

# ── Vault data PVC ───────────────────────────────────────────────────────────
- target:
    kind: StatefulSet
    name: vault
    namespace: vhhealth-security
  patch: |-
    - op: replace
      path: /spec/volumeClaimTemplates/0/spec/storageClassName
      value: longhorn

# ── step-ca data PVC ─────────────────────────────────────────────────────────
- target:
    kind: StatefulSet
    name: step-ca
    namespace: vhhealth-security
  patch: |-
    - op: replace
      path: /spec/volumeClaimTemplates/0/spec/storageClassName
      value: longhorn

# ── MinIO pool-0 PVCs ────────────────────────────────────────────────────────
# NOTE: The placement gate must measure MinIO erasure coding with each held
# Longhorn candidate, including capacity, write amplification, network loss,
# and restore behavior. C1.2 chooses neither candidate.
- target:
    kind: Tenant
    name: vhhealth-minio
    group: minio.min.io
    namespace: vhhealth-platform
  patch: |-
    - op: replace
      path: /spec/pools/0/volumeClaimTemplate/spec/storageClassName
      value: longhorn

# ── Harbor Helm-managed PVCs ─────────────────────────────────────────────────
# Harbor is deployed via ArgoCD Helm Application (not a StatefulSet in
# kustomize). The candidate below would update the values ConfigMap read by
# that child Application.
# Image blobs live in MinIO — only the jobservice log PVC and trivy DB PVC
# remain node-local placement candidates.
#
# Any future use remains subject to the same placement gate and manual sync.
- target:
    kind: ConfigMap
    name: harbor-values-override
    namespace: vhhealth-platform
  patch: |-
    - op: add
      path: /data/longhorn-storage-override
      value: |
        persistence:
          persistentVolumeClaim:
            jobservice:
              jobLog:
                storageClass: longhorn
            trivy:
              storageClass: longhorn

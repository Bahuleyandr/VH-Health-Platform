# overlays/prod/longhorn-pvc-patch.yaml — INF-5 / B2.6
#
# Switches all production stateful PVCs from local-path to the longhorn
# StorageClass (3-replica block replication across all 3 nodes).
#
# TRADEOFFS DOCUMENTED:
# ┌─────────────────┬────────────────────────────────────────────────────────┐
# │ Service         │ Tradeoff note                                          │
# ├─────────────────┼────────────────────────────────────────────────────────┤
# │ CNPG (Postgres) │ PG already replicates at the app layer (3-instance     │
# │                 │ synchronous-standby cluster). Adding Longhorn replica=3 │
# │                 │ gives storage-layer HA on top. Write amplification:     │
# │                 │ each write goes to 3 PG nodes AND is mirrored 3× by    │
# │                 │ Longhorn per node = ~9× total I/Os in the worst case.  │
# │                 │ Accept: PHI loss on storage failure is unacceptable.   │
# │                 │ Monitor: Longhorn volume IOPS + Postgres replication    │
# │                 │ lag. Tune if p99 write latency > 20ms.                 │
# ├─────────────────┼────────────────────────────────────────────────────────┤
# │ Redis           │ AOF ensures ≤1s data loss already. Longhorn adds       │
# │                 │ storage-layer resilience for the JWT blacklist PVC.    │
# ├─────────────────┼────────────────────────────────────────────────────────┤
# │ Vault           │ Raft consensus requires disk durability. Longhorn       │
# │                 │ prevents data loss if a node's disk fails.             │
# ├─────────────────┼────────────────────────────────────────────────────────┤
# │ MinIO           │ MinIO EC:4 provides its own erasure coding. Longhorn    │
# │                 │ replica=3 is redundant but not harmful. Operators may   │
# │                 │ choose longhorn-single for MinIO pool PVCs to avoid     │
# │                 │ double-redundancy overhead (~1.5 TiB extra).           │
# ├─────────────────┼────────────────────────────────────────────────────────┤
# │ Harbor          │ Image blobs in MinIO (S3). Harbor's own PVCs (registry │
# │                 │ jobLog, trivy) are large but non-clinical. Replicated.  │
# ├─────────────────┼────────────────────────────────────────────────────────┤
# │ step-ca         │ CA key material. Single PVC (10 GiB) — Longhorn adds   │
# │                 │ storage HA for the CA state (offline key never on PVC). │
# └─────────────────┴────────────────────────────────────────────────────────┘
#
# MIGRATION: existing local-path PVCs CANNOT be migrated in-place.
# Operator must follow the data-move procedure for each StatefulSet:
#
#   For each StatefulSet (redis, vault, step-ca):
#   1. kubectl scale sts/<name> -n <ns> --replicas=0
#   2. Take a backup:
#      - Redis: BGSAVE + copy /data/dump.rdb from the pod before scaling
#      - Vault: vault operator raft snapshot save vault-snapshot.snap
#      - step-ca: kubectl cp vhhealth-security/step-ca-0:/home/step step-ca-data/
#   3. kubectl delete pvc data-<name>-0 data-<name>-1 data-<name>-2 -n <ns>
#      (If Retain policy, also: kubectl delete pv <pv-names>)
#   4. Edit the StatefulSet volumeClaimTemplate or apply this kustomize patch.
#   5. kubectl scale sts/<name> -n <ns> --replicas=3
#      Longhorn provisions fresh PVs; restore data from backup.
#
#   For CNPG: the CNPG operator manages its own PVCs. Migrate by:
#   1. kubectl cnpg backup vhhealth-pg -n vhhealth-platform --name pre-migration
#   2. Confirm backup to R2 is complete.
#   3. kubectl delete cluster vhhealth-pg -n vhhealth-platform
#      (This also deletes CNPG-managed PVCs — BACKUP MUST BE CONFIRMED FIRST.)
#   4. Apply this overlay with the patched storageClass.
#   5. ArgoCD re-creates the Cluster CR; CNPG bootstraps from R2 backup.
#   This is the most impactful operation — schedule a maintenance window
#   (DOWNTIME_PROCEDURE.md) and test the full drill BEFORE doing this in prod.
#
#   For MinIO: patch pools[0].volumeClaimTemplate.spec.storageClassName.
#   The MinIO Operator manages pool PVCs. Operator must drain each pool
#   pod one at a time (rolling) after patching, allowing MinIO to rebalance.

# ── CNPG data PVC ───────────────────────────────────────────────────────────
- target:
    kind: Cluster
    name: vhhealth-pg
    group: postgresql.cnpg.io
    namespace: vhhealth-platform
  patch: |-
    - op: replace
      path: /spec/storage/storageClass
      value: longhorn
    - op: replace
      path: /spec/walStorage/storageClass
      value: longhorn

# ── Redis data PVC ───────────────────────────────────────────────────────────
- target:
    kind: StatefulSet
    name: redis
    namespace: vhhealth-platform
  patch: |-
    - op: replace
      path: /spec/volumeClaimTemplates/0/spec/storageClassName
      value: longhorn

# ── Vault data PVC ───────────────────────────────────────────────────────────
- target:
    kind: StatefulSet
    name: vault
    namespace: vhhealth-security
  patch: |-
    - op: replace
      path: /spec/volumeClaimTemplates/0/spec/storageClassName
      value: longhorn

# ── step-ca data PVC ─────────────────────────────────────────────────────────
- target:
    kind: StatefulSet
    name: step-ca
    namespace: vhhealth-security
  patch: |-
    - op: replace
      path: /spec/volumeClaimTemplates/0/spec/storageClassName
      value: longhorn

# ── MinIO pool-0 PVCs ────────────────────────────────────────────────────────
# NOTE: If double-redundancy overhead (MinIO EC:4 + Longhorn 3×) is
# unacceptable on the current hardware, change `longhorn` to `longhorn-single`
# here. MinIO's own EC provides sufficient redundancy for object data.
- target:
    kind: Tenant
    name: vhhealth-minio
    group: minio.min.io
    namespace: vhhealth-platform
  patch: |-
    - op: replace
      path: /spec/pools/0/volumeClaimTemplate/spec/storageClassName
      value: longhorn

# ── Harbor Helm-managed PVCs ─────────────────────────────────────────────────
# Harbor is deployed via ArgoCD Helm Application (not a StatefulSet in kustomize).
# The patch below updates the harbor-values ConfigMap key that the ArgoCD
# Application references. This propagates to the Helm chart on the next sync.
# Image blobs live in MinIO — only the jobservice log PVC and trivy DB PVC
# are node-local and need migration.
#
# OPERATOR ACTION: after applying this overlay, verify Harbor ArgoCD Application
# shows the patched storageClass values before triggering a sync.
- target:
    kind: ConfigMap
    name: harbor-values-override
    namespace: vhhealth-platform
  patch: |-
    - op: add
      path: /data/longhorn-storage-override
      value: |
        persistence:
          persistentVolumeClaim:
            jobservice:
              jobLog:
                storageClass: longhorn
            trivy:
              storageClass: longhorn

# Prod namespace resource guardrails.
#
# Sizing notes (2026-07-02):
# - vhhealth: backend HPA max 10 (500m/512Mi requests, 2CPU/2Gi limits),
#   admin HPA max 6 (250m/256Mi, 1CPU/1Gi), staff-web HPA max 6, plus
#   backend CronJobs/canary. Quota rounds the ~30% headroom calculation up.
# - vhhealth-platform: prod-patched CNPG 3x (2CPU/4Gi requests, 4CPU/8Gi
#   limits), Redis Sentinel 3x, MinIO 4x, Harbor scale-out, CNPG poolers, and
#   backup jobs. Storage allows CNPG data+WAL, Redis PVCs, and MinIO's 16x100Gi
#   pool with roughly 30% headroom.
# - LimitRanges provide safe defaults for operator-generated pods that do not
#   expose explicit container resources in our manifests (notably CNPG poolers).
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: vhhealth-app-prod-quota
  namespace: vhhealth
  annotations:
    vhhealth.app/sizing-basis: "backend max 10, admin max 6, staff-web max 6, app CronJobs; ~30% rounded headroom"
spec:
  hard:
    pods: "40"
    requests.cpu: "10"
    requests.memory: 10Gi
    limits.cpu: "40"
    limits.memory: 40Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: vhhealth-app-prod-limits
  namespace: vhhealth
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      default:
        cpu: "500m"
        memory: "512Mi"
      min:
        cpu: "25m"
        memory: "32Mi"
      max:
        cpu: "4"
        memory: "4Gi"
      maxLimitRequestRatio:
        cpu: "8"
        memory: "8"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: vhhealth-platform-prod-quota
  namespace: vhhealth-platform
  annotations:
    vhhealth.app/sizing-basis: "CNPG, Redis Sentinel, MinIO, Harbor, poolers, backup jobs; ~30% rounded headroom"
spec:
  hard:
    pods: "50"
    persistentvolumeclaims: "40"
    requests.storage: 3Ti
    requests.cpu: "16"
    requests.memory: 40Gi
    limits.cpu: "50"
    limits.memory: 80Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: vhhealth-platform-prod-limits
  namespace: vhhealth-platform
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      default:
        cpu: "500m"
        memory: "512Mi"
      min:
        cpu: "25m"
        memory: "32Mi"
      max:
        cpu: "4"
        memory: "8Gi"
      maxLimitRequestRatio:
        cpu: "10"
        memory: "8"

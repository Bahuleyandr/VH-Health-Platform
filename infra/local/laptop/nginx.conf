worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    client_max_body_size 50m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/tls/localhost.crt;
    ssl_certificate_key /etc/nginx/tls/localhost.key;
    ssl_session_cache shared:TLS:1m;
    ssl_session_tickets off;

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 70s;
    proxy_send_timeout 70s;

    server {
        listen 8444 ssl default_server;
        server_name localhost;
        if ($http_host != "localhost:8444") { return 421; }

        location / {
            proxy_set_header Host localhost:8444;
            proxy_set_header X-Forwarded-Host localhost:8444;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For 127.0.0.1;
            proxy_set_header Forwarded "";
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Client-IP "";
            proxy_set_header X-Original-Forwarded-For "";
            proxy_set_header True-Client-IP "";
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://backend:5000;
        }
    }

    server {
        listen 8445 ssl default_server;
        server_name localhost;
        if ($http_host != "localhost:8445") { return 421; }

        # No default-src/script-src: the upstream nonce/hash policy stays authoritative.
        add_header Content-Security-Policy "connect-src https://localhost:8444 https://localhost:8445 wss://localhost:8444 wss://localhost:8445; img-src 'self' https://localhost:8444 data: blob:; font-src 'self' data:; media-src 'self' https://localhost:8444 blob:; frame-src 'self' https://localhost:8444 blob:; form-action 'self'; base-uri 'self'; object-src 'none'" always;
        add_header X-DNS-Prefetch-Control off always;

        location / {
            proxy_set_header Host localhost:8445;
            proxy_set_header X-Forwarded-Host localhost:8445;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For 127.0.0.1;
            proxy_set_header Forwarded "";
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Client-IP "";
            proxy_set_header X-Original-Forwarded-For "";
            proxy_set_header True-Client-IP "";
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://admin:3001;
        }
    }
}

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  access_log off;
  server_tokens off;

  client_body_temp_path /tmp/client-body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  map $http_x_forwarded_for $tailnet_peer {
    default $http_x_forwarded_for;
    "" $remote_addr;
  }

  # Tailscale Serve overwrites X-Forwarded-For with the connecting tailnet
  # peer. Only the active cloudflared connector on Deltaquadrant may promote
  # Cloudflare's single-value client address into the backend forwarding chain.
  map "$tailnet_peer|$http_cf_connecting_ip" $client_forwarded_for {
    default $tailnet_peer;
    ~^100\.67\.17\.115\|(?<cloudflare_client>[0-9A-Fa-f:.]+)$ $cloudflare_client;
  }

  upstream vhhealth_backend {
    server 127.0.0.1:30090;
    keepalive 32;
  }

  server {
    listen 127.0.0.1:30093;
    client_max_body_size 25m;

    location / {
      proxy_pass http://vhhealth_backend;
      proxy_http_version 1.1;
      proxy_connect_timeout 10s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;

      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $client_forwarded_for;
      proxy_set_header X-Real-IP $client_forwarded_for;

      # This controller is the trust boundary for the public Dalekdefender
      # route. Always replace caller input; never append or pass it through.
      proxy_set_header X-VH-Route-Kind public;
      proxy_set_header CF-Connecting-IP "";

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}

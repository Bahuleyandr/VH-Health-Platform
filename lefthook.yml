# One-time install per clone:  lefthook install
#
# Path-scoped hooks so Flutter changes don't try to run npm checks and vice
# versa. pre-commit runs on staged files only; pre-push runs the same full
# checks CI runs, scoped to what the push actually touches.

pre-commit:
  parallel: true
  commands:
    secrets-scan:
      run: node scripts/scan-secrets.mjs

    gitleaks-staged:
      run: node scripts/gitleaks-scan.mjs staged

    ggshield-staged:
      run: node scripts/ggshield-scan.mjs staged --optional

    dart-format:
      glob: "apps/patient/**/*.dart apps/staff/**/*.dart packages/vhhealth_core/**/*.dart"
      run: dart format --set-exit-if-changed {staged_files}

    admin-tsc:
      root: apps/admin
      glob: "*.{ts,tsx}"
      run: npx tsc --noEmit

    admin-lint:
      root: apps/admin
      glob: "*.{ts,tsx,js,jsx}"
      run: npx next lint --file {staged_files}

    backend-eslint:
      root: apps/backend
      glob: "*.{js,mjs,cjs}"
      run: npx eslint --no-warn-ignored {staged_files}

pre-push:
  commands:
    secrets-scan:
      run: node scripts/scan-secrets.mjs

    gitleaks-pushed:
      run: node scripts/gitleaks-scan.mjs range

    ggshield-pushed:
      run: node scripts/ggshield-scan.mjs range --optional

    flutter-analyze:
      run: |
        if git diff --name-only @{u}..HEAD 2>/dev/null | grep -qE '^(apps/(patient|staff)/|packages/vhhealth_core/|pubspec\.(yaml|lock))'; then
          melos run analyze
        else
          echo "lefthook pre-push: no Flutter changes — skipping melos analyze"
        fi

    backend-lint:
      run: |
        if git diff --name-only @{u}..HEAD 2>/dev/null | grep -q '^apps/backend/'; then
          (cd apps/backend && npm run --silent lint)
        else
          echo "lefthook pre-push: no backend changes — skipping backend lint"
        fi

    docs-plugin-versions:
      run: |
        if git diff --name-only @{u}..HEAD 2>/dev/null | grep -qE '^(apps/(patient|staff)/pubspec\.yaml|packages/vhhealth_core/pubspec\.yaml|docs/(FLUTTER_PLUGIN_MAJOR_MIGRATIONS|SMOKE_E2E_JOURNEYS)\.md|scripts/check-docs-plugin-versions)'; then
          node scripts/check-docs-plugin-versions.mjs
        else
          echo "lefthook pre-push: no pubspec/guarded-doc changes — skipping plugin-version drift"
        fi

    openapi-drift:
      run: |
        if git diff --name-only @{u}..HEAD 2>/dev/null | grep -qE '^apps/backend/(src/routes/|src/app\.js)'; then
          (cd apps/backend && node scripts/check-openapi-drift.mjs)
        else
          echo "lefthook pre-push: no backend route changes — skipping openapi drift"
        fi

    client-api-paths:
      run: |
        if git diff --name-only @{u}..HEAD 2>/dev/null | grep -qE '^(apps/admin/src/|apps/(patient|staff)/lib/|packages/vhhealth_core/lib/|apps/device-gateway/src/|apps/backend/src/(docs/openapi\.json|app\.js)|scripts/ci/(check-client-paths|client-path-allowlist))'; then
          node scripts/ci/check-client-paths.mjs
        else
          echo "lefthook pre-push: no client or spec changes — skipping client API path gate"
        fi

    openapi-core-sync:
      run: |
        if git diff --name-only @{u}..HEAD 2>/dev/null | grep -qE '^(apps/backend/src/docs/openapi\.json|packages/vhhealth_core/swagger/)'; then
          (cd apps/backend && node scripts/check-core-spec-sync.mjs)
        else
          echo "lefthook pre-push: no OpenAPI spec changes — skipping core-sync check"
        fi

    admin-jest:
      run: |
        if git diff --name-only @{u}..HEAD 2>/dev/null | grep -q '^apps/admin/'; then
          (cd apps/admin && npx jest --passWithNoTests --silent)
        else
          echo "lefthook pre-push: no admin changes — skipping admin jest"
        fi

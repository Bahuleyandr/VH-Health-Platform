# OpenAPI → Dart codegen driver for vhhealth_core.
#
# Run `melos run codegen` (or `dart run build_runner build` in this package) after
# refreshing `swagger/openapi.json` via
# `npm --prefix apps/backend run openapi:sync-core` — it is synced byte-for-byte
# from the canonical apps/backend/src/docs/openapi.json (NEVER edit it by hand;
# the openapi:check-core gate enforces the copy). Generated files land in
# lib/api/generated/ and are exported via lib/api/vhhealth_api.dart.
#
# Why swagger_dart_code_generator (not openapi-generator):
# - Pure Dart. Plays with build_runner, which both Flutter apps already use.
# - No Java toolchain in CI.
# - Small generated output; opinionated but legible.
# See docs/API_CODEGEN.md for how to run it + migration playbook.

targets:
  $default:
    sources:
      include:
        - lib/**
        - swagger/**
        - pubspec.yaml
      exclude:
        - lib/api/generated/**  # never feed generated into the generator
    builders:
      swagger_dart_code_generator:
        options:
          input_folder: 'swagger/'
          output_folder: 'lib/api/generated/'
          # Use a single-file output per spec — easier to audit the diff
          # when the backend spec changes.
          input_urls_to_file: false
          # Chopper client + models:
          build_only_models: false
          with_base_url: false       # base URL injected at call time via ApiConfig
          with_converter: true
          ignore_headers: false
          # Nullable by default for POST bodies — backend validation lives
          # server-side, Dart side shouldn't re-duplicate.
          default_values_map:
            - type_name: 'bool'
              default_value: 'false'
          # The I03 endpoint selects recovery by own-property presence. The
          # generator serializes optional fields as explicit nulls by default,
          # so override only this union wrapper to omit `recovery` for live
          # requests while retaining the generated typed recovery envelope.
          overriden_models:
            - file_name: 'openapi'
              import_url: '../hl7_inbound_receive_request.dart'
              overriden_models:
                - 'Hl7InboundReceiveRequest'
          # Drop the single FHIR bulk-export operation whose path contains a
          # literal `$` (`/api/v1/fhir/Patient/{id}/$everything`). chopper_generator
          # emits the path verbatim into `@GET(path: '...$everything')`; Dart reads
          # the unescaped `$everything` as string interpolation of an undefined
          # variable → `FormatException: Not an instance of String` → the whole
          # `openapi.swagger.chopper.dart` file is skipped → `_$Openapi` never
          # resolves → the client does not compile. It is the ONLY `$`-prefixed
          # operation in the entire 2,636-path spec, has ZERO Flutter consumers
          # (it is a niche FHIR `$everything` bulk-export op), and dropping it is
          # the surgical fix. `exclude_paths` is matched as a RegExp against the
          # path, so `\$everything$` anchors to exactly this one operation.
          # NOTE: this is a SILENT drop inside the generator — the dropped op is
          # logged at codegen time by scripts/codegen.mjs and documented in
          # docs/API_CODEGEN.md (per the no-silent-truncation convention).
          # The canonical + core specs stay byte-identical; only the Dart client
          # omits this one method.
          exclude_paths:
            - '/api/v1/fhir/Patient/\{id\}/\$everything$'

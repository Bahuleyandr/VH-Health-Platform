name: vhhealth_core
description: Shared code for VHHealth patient and staff apps
version: 0.1.0
publish_to: 'none'
resolution: workspace

environment:
  sdk: ">=3.8.1 <4.0.0"
  flutter: ">=3.8.1"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.4.0
  flutter_secure_storage: ^10.3.1
  # AES-256-GCM at-rest encryption for the offline write queue's PHI body
  # (audit 2026-06-18). Same package/scheme the patient app already uses for
  # its encrypted API cache, so the workspace resolves a single version.
  encrypt: ^5.0.3
  geolocator: ^14.0.1
  url_launcher: ^6.3.1
  web_socket_channel: ^3.0.1
  cryptography: ^2.7.0
  # chopper runtime is needed at runtime by swagger_dart_code_generator's
  # generated clients (Client / RequestInterceptor types, serialization hooks).
  # The generator itself is a dev_dependency below.
  chopper: ^8.6.0
  json_annotation: ^4.12.0
  # Offline write queue (was staff-only; Phase 5.5 promoted to core so the
  # patient app gets the same ChangeNotifier + sync-badge UX).
  sqflite: ^2.4.2+1
  path: ^1.9.0
  connectivity_plus: ^7.1.1
  # Used by OfflineSyncBadge for the "synced 2 minutes ago" label.
  intl: ^0.20.2
  # Device integrity — used by DeviceIntegrityService to detect
  # rooted / jailbroken devices before issuing JWTs in release builds.
  # Used by DeviceInfoPlusProbe for richer emulator/device-trust detection.
  device_info_plus: ^12.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # In-memory SQLite for OfflineQueue tests (encryption-at-rest + staff
  # owner-scoping). Already in the workspace lock via apps/staff.
  sqflite_common_ffi: ^2.4.0+3
  # OpenAPI → Dart codegen. Runs via `dart run build_runner build` and reads
  # swagger/openapi.json, emitting models + chopper client stubs into
  # lib/api/generated/. See docs/API_CODEGEN.md for the migration playbook.
  build_runner: ^2.15.0
  swagger_dart_code_generator: ^4.1.1
  chopper_generator: ^8.6.2
  json_serializable: ^6.14.0

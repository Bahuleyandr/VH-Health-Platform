name: vhhealth_staff
description: VHHealth Staff App - Hospital staff management
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.8.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  vhhealth_core:
    path: ../vhhealth-core
  http: ^1.4.0
  flutter_secure_storage: ^9.2.4
  go_router: ^16.0.0
  provider: ^6.1.0
  shared_preferences: ^2.3.2
  lucide_icons: ^0.257.0
  intl: ^0.20.2
  local_auth: ^2.3.0
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.5
  firebase_crashlytics: ^4.3.2
  geolocator: ^14.0.0
  table_calendar: ^3.1.2
  permission_handler: ^11.3.1
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  url_launcher: ^6.3.1
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

name: vhhealth_workspace
publish_to: none
description: Root pubspec for the VH Health Flutter monorepo (Melos 7 + pub workspace).

environment:
  sdk: ^3.8.0

workspace:
  - apps/patient
  - apps/staff
  - packages/vhhealth_core

dev_dependencies:
  melos: ^7.8.1

dependency_overrides:
  lucide_icons:
    path: local_plugins/lucide_icons

melos:
  scripts:
    analyze:
      description: "flutter analyze across the workspace"
      run: melos exec -- "flutter analyze --no-fatal-infos"

    test:
      description: "flutter test across the workspace (only packages with a test/ dir)"
      run: melos exec --dir-exists=test -- "flutter test"

    format:
      description: "dart format (check only — CI-safe)"
      run: node scripts/dart-format-check.mjs

    format-fix:
      description: "dart format with writes"
      run: node scripts/dart-format-check.mjs --write

    codegen:
      description: "OpenAPI → Dart codegen for vhhealth_core (reports any exclude_paths drops, then runs build_runner). See docs/API_CODEGEN.md."
      run: node scripts/codegen.mjs

    codegen-watch:
      description: "watch-mode OpenAPI → Dart codegen for vhhealth_core"
      run: node scripts/codegen.mjs --watch

    clean:
      description: "flutter clean every package"
      run: melos exec -- "flutter clean"

    gen-l10n:
      description: "generate l10n in packages that declare flutter_localizations"
      run: melos exec --depends-on="flutter_localizations" -- "flutter gen-l10n"

    i18n-health:
      description: "Static health check for both Flutter apps' i18n. Non-blocking; informational. Reports missing keys, copy-paste, length outliers, orphan calls, and hardcoded English remaining for staff (manual map) and patient (ARB)."
      run: |
        echo '── STAFF APP ──' && node apps/staff/scripts/i18n-verify.mjs
        echo
        echo '── PATIENT APP ──' && node apps/patient/scripts/i18n-verify.mjs

    i18n-health-staff:
      description: "Staff app i18n health only."
      run: node apps/staff/scripts/i18n-verify.mjs

    i18n-health-patient:
      description: "Patient app i18n health only."
      run: node apps/patient/scripts/i18n-verify.mjs

name: vhhealth_core
description: Shared code for VHHealth patient and staff apps
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ">=3.8.1 <4.0.0"
  flutter: ">=3.8.1"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.4.0
  flutter_secure_storage: ^9.2.4
  geolocator: ^14.0.1
  url_launcher: ^6.3.1
  # Device integrity — used by DeviceIntegrityService to detect
  # rooted / jailbroken devices before issuing JWTs in release builds.
  flutter_jailbreak_detection: ^1.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
